.form-check {

  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;

  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);

.form-check:not(.form-switch)

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {

}

.form-check:not(.form-switch)

  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);

}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,

  left: 0;

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {

  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

    left: 50%;

    height: 44px;

  }

    display: inline-flex;
    min-width: 44px;
    min-height: 44px;

  }

    height: 44px;

    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

    margin-top: 12px;
  }

  &lt;script type=&quot;application/json&quot; id=&quot;fa-model-data&quot;&gt;{&quot;date&quot;: &quot;2026-09-13&quot;, &quot;version&quot;: &quot;P81 0.9&quot;, &quot;source&quot;: &quot;Instantané de la carte de travail datée du 11 septembre 2026, après U103. Noms, définitions courtes et Finalités des capacités extraits de la vue courante P81 ; définitions des domaines et notes de statut synthétisées à partir des mêmes sections, de P83 et des corrections. Sept domaines transactionnels de travail et cinq références du groupe de présentation Business References ; 36 aptitudes dont neuf validées. Le groupe ne constitue ni capacité mère ni domaine fusionné. Cet instantané ne modifie aucun arbitrage.&quot;, &quot;domains&quot;: [{&quot;id&quot;: &quot;D01&quot;, &quot;name&quot;: &quot;Inventory Management&quot;, &quot;group&quot;: &quot;transactional&quot;, &quot;purpose&quot;: &quot;Disposer d’une connaissance fiable des stocks physiques, de leurs états logiques et des ressources futures, préserver les usages retenus et enregistrer les quantités engagées.&quot;, &quot;definition&quot;: &quot;Connaître les stocks et les ressources attendues, expliquer leurs variations, fiabiliser les quantités et préserver les usages par les protections et réservations. Le stock futur est connu ici et mobilisé par Order Promising.&quot;, &quot;status&quot;: &quot;retained&quot;, &quot;statusNote&quot;: &quot;Nom Inventory Management retenu en U66. P81 conserve six aptitudes ; la fusion proposée par P82 reste non adoptée. Les frontières détaillées et la réservation demeurent à éprouver.&quot;, &quot;sources&quot;: [&quot;P81&quot;, &quot;U66&quot;, &quot;U74&quot;, &quot;U75&quot;, &quot;U78&quot;, &quot;U79&quot;, &quot;U80&quot;, &quot;U81&quot;, &quot;U86&quot;, &quot;C58&quot;], &quot;sourcePath&quot;: &quot;connaissance/25-domaines-coeur-et-epreuve-recits.md&quot;, &quot;capabilities&quot;: [{&quot;id&quot;: &quot;D01.a&quot;, &quot;name&quot;: &quot;Establish inventory positions&quot;, &quot;purpose&quot;: &quot;Disposer d’une connaissance exploitable des ressources.&quot;, &quot;definition&quot;: &quot;déterminer les quantités de stock physique et leurs états logiques par article, lieu, détenteur et propriétaire lorsque ces dimensions sont pertinentes, en distinguant les ressources futures attendues.&quot;, &quot;status&quot;: &quot;review&quot;, &quot;statusNote&quot;: &quot;Libellé Establish inventory positions contesté en U82, conservé dans P81 pour la traçabilité. Fusion avec D01.b dans Inventory Tracking proposée en P82, non adoptée.&quot;, &quot;sources&quot;: [&quot;P81&quot;, &quot;P82&quot;, &quot;U81&quot;, &quot;U82&quot;, &quot;U83&quot;, &quot;C56&quot;], &quot;sourcePath&quot;: &quot;connaissance/25-domaines-coeur-et-epreuve-recits.md&quot;}, {&quot;id&quot;: &quot;D01.b&quot;, &quot;name&quot;: &quot;Record inventory facts&quot;, &quot;purpose&quot;: &quot;Expliquer les variations et leur provenance.&quot;, &quot;definition&quot;: &quot;qualifier les faits qui font évoluer les quantités physiques et les états logiques, notamment entrées, sorties, changements d’état et consommations.&quot;, &quot;status&quot;: &quot;proposed&quot;, &quot;statusNote&quot;: &quot;Capacité proposée. Fusion avec D01.a dans Inventory Tracking proposée par P82, non adoptée ; P81 conserve la ligne.&quot;, &quot;sources&quot;: [&quot;P81&quot;, &quot;P82&quot;, &quot;U81&quot;, &quot;U83&quot;], &quot;sourcePath&quot;: &quot;connaissance/25-domaines-coeur-et-epreuve-recits.md&quot;}, {&quot;id&quot;: &quot;D01.c&quot;, &quot;name&quot;: &quot;Provide a consolidated inventory view&quot;, &quot;purpose&quot;: &quot;Permettre une lecture commune des stocks distribués.&quot;, &quot;definition&quot;: &quot;présenter les positions physiques, leurs états logiques et les ressources futures connues dans une vue cohérente, sans double comptage, avec source, périmètre et fraîcheur.&quot;, &quot;status&quot;: &quot;proposed&quot;, &quot;statusNote&quot;: &quot;Capacité et maille proposées. Inventory Visibility est un nom alternatif de P82, sans remplacement de la ligne courante P81.&quot;, &quot;sources&quot;: [&quot;P81&quot;, &quot;P82&quot;, &quot;U81&quot;, &quot;U83&quot;], &quot;sourcePath&quot;: &quot;connaissance/25-domaines-coeur-et-epreuve-recits.md&quot;}, {&quot;id&quot;: &quot;D01.d&quot;, &quot;name&quot;: &quot;Stocktaking&quot;, &quot;purpose&quot;: &quot;Fiabiliser les quantités enregistrées — Inventory accuracy.&quot;, &quot;definition&quot;: &quot;établir les quantités constatées par comptage, les confronter aux quantités enregistrées, qualifier les écarts et établir les corrections justifiées.&quot;, &quot;status&quot;: &quot;retained&quot;, &quot;statusNote&quot;: &quot;Nom Stocktaking retenu par Laurent en U86, le 11 septembre 2026 ; Inventory accuracy en exprime la Finalité. La décision de nom conserve comptage, rapprochement, écarts et corrections ; frontières détaillées ouvertes.&quot;, &quot;sources&quot;: [&quot;P81&quot;, &quot;P82&quot;, &quot;U86&quot;, &quot;C58&quot;], &quot;sourcePath&quot;: &quot;connaissance/25-domaines-coeur-et-epreuve-recits.md&quot;}, {&quot;id&quot;: &quot;D02.b&quot;, &quot;name&quot;: &quot;Supply Protection&quot;, &quot;purpose&quot;: &quot;Préserver les possibilités d’approvisionnement des usages retenus.&quot;, &quot;definition&quot;: &quot;établir et appliquer les quantités ou limites d’usage destinées à des groupes, avec leur validité.&quot;, &quot;status&quot;: &quot;retained&quot;, &quot;statusNote&quot;: &quot;Aptitude métier reconnue en U67 et rattachement à Inventory Management orienté en U74. Repère historique D02.b conservé ; définition détaillée et maille à éprouver.&quot;, &quot;sources&quot;: [&quot;P81&quot;, &quot;U67&quot;, &quot;U74&quot;, &quot;C49&quot;], &quot;sourcePath&quot;: &quot;connaissance/25-domaines-coeur-et-epreuve-recits.md&quot;}, {&quot;id&quot;: &quot;D02.c&quot;, &quot;name&quot;: &quot;Reservation&quot;, &quot;purpose&quot;: &quot;Donner effet à un engagement de ressource.&quot;, &quot;definition&quot;: &quot;établir un engagement de quantité pour un besoin identifié, dont les usages concurrents doivent tenir compte.&quot;, &quot;status&quot;: &quot;review&quot;, &quot;statusNote&quot;: &quot;Nom Reservation retenu en U84. Rattachement à D01 issu de U75 remis en discussion en U78 ; frontière réservation/affectation ouverte, sans nouveau déplacement.&quot;, &quot;sources&quot;: [&quot;P81&quot;, &quot;U75&quot;, &quot;U78&quot;, &quot;U84&quot;, &quot;C54&quot;, &quot;C57&quot;], &quot;sourcePath&quot;: &quot;connaissance/25-domaines-coeur-et-epreuve-recits.md&quot;}]}, {&quot;id&quot;: &quot;D02&quot;, &quot;name&quot;: &quot;Resource Availability and Commitments&quot;, &quot;group&quot;: &quot;transactional&quot;, &quot;purpose&quot;: &quot;Évaluer ce qui peut être mobilisé et maintenir les engagements de ressources cohérents.&quot;, &quot;definition&quot;: &quot;Deux aptitudes de disponibilité et d’ajustement subsistent comme traces de travail après les rattachements de Supply Protection et Reservation à Inventory Management, et de Supply Assignment à Order Promising.&quot;, &quot;status&quot;: &quot;review&quot;, &quot;statusNote&quot;: &quot;Domaine en réexamen depuis U75. Son autonomie n’est pas justifiée ; aucune suppression, répartition ni renumérotation supplémentaire n’est décidée.&quot;, &quot;sources&quot;: [&quot;P81&quot;, &quot;U75&quot;, &quot;U87&quot;, &quot;U88&quot;, &quot;P83&quot;], &quot;sourcePath&quot;: &quot;connaissance/25-domaines-coeur-et-epreuve-recits.md&quot;, &quot;capabilities&quot;: [{&quot;id&quot;: &quot;D02.a&quot;, &quot;name&quot;: &quot;Determine resource availability for a given use&quot;, &quot;purpose&quot;: &quot;Évaluer ce qui peut être mobilisé dans une situation donnée.&quot;, &quot;definition&quot;: &quot;apprécier les quantités admissibles à un horizon, compte tenu des états, attentes, protections et engagements.&quot;, &quot;status&quot;: &quot;review&quot;, &quot;statusNote&quot;: &quot;Trace de travail conservée dans D02. Répartition entre disponibilité de réservation et faisabilité de promesse à examiner ; aucune suppression décidée.&quot;, &quot;sources&quot;: [&quot;P81&quot;, &quot;U75&quot;, &quot;U87&quot;, &quot;U88&quot;, &quot;P83&quot;], &quot;sourcePath&quot;: &quot;connaissance/25-domaines-coeur-et-epreuve-recits.md&quot;}, {&quot;id&quot;: &quot;D02.d&quot;, &quot;name&quot;: &quot;Adjust resource commitments&quot;, &quot;purpose&quot;: &quot;Maintenir des affectations cohérentes avec les besoins et les ressources.&quot;, &quot;definition&quot;: &quot;réviser, transférer ou libérer les quantités affectées selon les décisions autorisées.&quot;, &quot;status&quot;: &quot;review&quot;, &quot;statusNote&quot;: &quot;Trace de travail conservée dans D02. À répartir ou reformuler selon l’engagement modifié ; aucune suppression ni nouvelle affectation adoptée.&quot;, &quot;sources&quot;: [&quot;P81&quot;, &quot;U75&quot;, &quot;U87&quot;, &quot;U88&quot;, &quot;P83&quot;], &quot;sourcePath&quot;: &quot;connaissance/25-domaines-coeur-et-epreuve-recits.md&quot;}]}, {&quot;id&quot;: &quot;D03&quot;, &quot;name&quot;: &quot;Order Promising&quot;, &quot;group&quot;: &quot;transactional&quot;, &quot;purpose&quot;: &quot;Proposer, établir et maintenir des engagements de fourniture réalisables, en quantité et en date, avec les ressources et possibilités d’acheminement.&quot;, &quot;definition&quot;: &quot;Établir ce qui peut être promis pour satisfaire une demande, sous quelles conditions, avec quelles ressources et quelle solution de fourniture, puis maintenir la promesse lorsque la situation évolue.&quot;, &quot;status&quot;: &quot;validated&quot;, &quot;statusNote&quot;: &quot;Domaine reconnu en U52. Neuf capacités validées par Laurent le 11 septembre 2026 en U95 : quatre actions et cinq décisions. Frontières, autorités opérationnelles et équivalences marché restent à préciser ; CTP différé.&quot;
