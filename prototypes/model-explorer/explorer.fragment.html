    add({id:'business-references',name:'Business References',kind:'group',parentId:'transactional',children:data.domains.filter(d=>d.group==='references').map(d=>d.id),purpose:'Recevoir les références externes nécessaires aux opérations.',definition:'Cinq modèles de référence distincts, reliés par identifiants et réunis dans un groupe de présentation. Chacun possède une capacité d’ingestion.',status:'retained',statusNote:'Groupe de présentation retenu par Laurent en U103. Aucun domaine fusionné ni capacité mère. Les contenus détaillés et maîtres du réseau restent ouverts.',sources:['U97','U100','U102','U103'],sourcePath:mapPath});
    add({id:'process',name:'Modèle processus',kind:'model',parentId:'atlas',children:['ILL-OBJ-02'],purpose:'Comprendre les situations et parcours métier, dans une approche Case Management.',definition:'Modèle distinct du socle transactionnel, avec ses propres objets, règles et moyens de décision et d’orchestration. Son catalogue fonctionnel reste à développer.',status:'proposed',statusNote:'Orientation déclarée U49/U50/U62. L’objet Demande de réassort est cité par Laurent ; l’aperçu ne fournit pas une cartographie des processus.',sources:['U49','U50','U62'],sourcePath:examplePath});
    const aliases={'D01':'stock physique logique futur inventaire','D01.a':'quantités position stock physique logique','D01.b':'mouvements stock états','D01.c':'visibilité stock consolidation','D01.d':'inventaire comptage counting stocktaking physical inventory rapprochement écart','D02.b':'protection allocation ressource quota','D02.c':'réservation reserver reservation engagement','D02.e':'affectation affecter allocation supply assignment','D03':'promesse promettre ATP disponible virtuel','D03.a':'proposition promesse ATP quantité date','D03.b':'confirmation confirmer promesse engagement','D03.c':'révision promesse réexaminer','D09':'partie tiers client fournisseur identité rôle party','D11':'accord contrat conditions agreement','D08':'article produit SKU','D12':'catalogue prix zone','D13':'réseau lieu point logistique entrepôt fulfillment'};
    data.domains.forEach(d=>{
      add({...d,kind:d.group==='references'?'reference':'domain',parentId:d.group==='references'?'business-references':'transactional',children:d.capabilities.map(c=>c.id),aliases:aliases[d.id]||''});
      d.capabilities.forEach(c=>add({...c,kind:'capability',parentId:d.id,aliases:aliases[c.id]||''}));
    });
    const confirmation=[...nodes.values()].find(n=>n.name==='Promise Confirmation').id;
    const illustrative={status:'illustration',sourcePath:examplePath,sources:['U61','U62','P80'],statusNote:'Exemple proposé dans la note 24, sans validation d’un modèle détaillé. Identifiant ILL propre à cet aperçu ; objets, cardinalités, contenu et autorités restent à éprouver.'};
    add({...illustrative,id:'ILL-OBJ-01',name:'Engagement de fourniture',kind:'object',modelId:'transactional',purpose:'Exprimer les quantités et dates de fourniture engagées.',definition:'Objet de travail de l’exemple de confirmation : l’engagement possède des valeurs et un état. Identité, limites et cycle de vie restent à préciser.',aliases:'promesse engagement objet'});
    add({...illustrative,id:'ILL-DOC-01',name:'Confirmation de promesse',kind:'document',modelId:'transactional',purpose:'Porter les engagements et conditions retenus dans une confirmation identifiée et versionnée.',definition:'Document associé proposé. Le contenu exact, la portée de la représentation de l’état et le traitement des corrections restent à définir.',aliases:'document justificatif preuve promesse confirmation'});
    add({...illustrative,id:'ILL-EVT-01',name:'Promesse confirmée',kind:'event',modelId:'transactional',purpose:'Constater que des quantités et dates ont été confirmées pour une demande.',definition:'Nom illustratif du fait de gestion décrit dans la note 24. Le fait métier est distinct du message qui pourrait le notifier.',aliases:'événement evenement fait confirmation notification'});
    add({...illustrative,id:'ILL-OBJ-02',name:'Demande de réassort',kind:'object',parentId:'process',modelId:'process',purpose:'Suivre une situation de réassort dans le modèle processus.',definition:'Objet cité par Laurent en U62. Besoin exprimé, exceptions et clôture sont des contenus proposés ; aucune convention universelle Demande n’est adoptée.',statusNote:'Objet cité par Laurent U62. Détails illustratifs proposés dans la note 24. Le repère ILL de l’aperçu ne crée pas un identifiant de registre.',aliases:'reassort replenishment case dossier processus'});
    const edges=[
      {from:confirmation,to:'ILL-OBJ-01',verb:'confirme',inverse:'est confirmé par',status:'illustration',sources:['P80']},
      {from:confirmation,to:'ILL-DOC-01',verb:'a pour document associé',inverse:'est associé à',status:'illustration',sources:['P80']},
      {from:confirmation,to:'ILL-EVT-01',verb:'a pour résultat constaté',inverse:'constate le résultat de',status:'illustration',sources:['P80']},
      {from:'ILL-DOC-01',to:'ILL-OBJ-01',verb:'représente les engagements de',inverse:'est représenté dans',status:'illustration',sources:['P80']},
      {from:'ILL-DOC-01',to:'ILL-EVT-01',verb:'porte la confirmation associée à',inverse:'a pour document associé',status:'illustration',sources:['P80']},
      {from:'D01',to:'D03',verb:'fournit la connaissance des stocks à',inverse:'s’appuie sur les stocks connus dans',status:'proposed',sources:['U80','U81']},
      {from:'D11',to:'D03',verb:'fournit les conditions à appliquer à',inverse:'applique les conditions reçues de',status:'proposed',sources:['U97']},
      {from:'D13',to:'D06',verb:'décrit le réseau utilisé par',inverse:'utilise les références du réseau de',status:'proposed',sources:['U102']}
    ];
    const related=id=>edges.filter(e=>e.from===id||e.to===id).map(e=>({...e,target:e.from===id?e.to:e.from,label:e.from===id?e.verb:e.inverse}));
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const normalize=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
    const icon=k=>`<i data-lucide="${icons[k]||k}" aria-hidden="true"></i>`;
    const state={id:'transactional',view:'map',query:'',type:'all',statusFilter:'all',history:[{id:'transactional',view:'map'}],at:0,recent:[],journey:-1};
    const design={density:'comfortable',layout:'cards',definitions:true};
    const steps=[{id:confirmation,label:'Capacité',text:'Promise Confirmation engage les quantités et dates retenues. Sa présence dans la liste d’Order Promising est validée en U95.'},{id:'ILL-OBJ-01',label:'Objet métier',text:'L’engagement de fourniture donne un sens durable à ce qui est confirmé. Son identité et ses règles restent à préciser.'},{id:'ILL-DOC-01',label:'Document',text:'La confirmation conserve les engagements et conditions retenus. Elle représente un état ou un contenu utile à attester.'},{id:'ILL-EVT-01',label:'Événement',text:'Le fait décrit ce qui s’est produit. Il se relie au document et à la capacité ; sa notification éventuelle est une autre notion.'}];
    function lineage(n){const p=[];const seen=new Set();while(n&&!seen.has(n.id)){p.unshift(n);seen.add(n.id);n=nodes.get(n.parentId)}return p}
    function modelOf(n){return n.modelId||lineage(n).find(x=>['process','transactional'].includes(x.id))?.id}
    function statusInfo(n){if(n.id==='D03')return ['Liste validée U95','green'];if(n.status==='validated')return ['Capacité validée','green'];if(n.status==='illustration')return ['Exemple proposé','purple'];if(n.status==='review')return ['En réexamen','amber'];if(n.status==='hypothesis')return ['Hypothèse','amber'];if(n.id==='business-references')return ['Groupe retenu','green'];if(n.status==='retained')return [n.statusNote.startsWith('Nom ')?'Nom retenu':'Orientation retenue','green'];return ['Proposé','neutral']}
    function badge(n){const [t,c]=statusInfo(n);return `<span class="fa-badge" data-tone="${c}">${t}</span>`}
    function kind(n){return `<span class="fa-kind" data-kind="${n.kind}">${icon(n.kind)}${labels[n.kind]}</span>`}
    function childCount(n){return n.kind==='group'?`${n.children.length} références`:n.children.length?`${n.children.length} ${n.kind==='model'?'éléments':'capacités'}`:labels[n.kind]}
    function tile(n){return `<button class="fa-tile" data-go="${n.id}"><span class="fa-tile-top"><span class="fa-id">${esc(n.id.startsWith('ILL-')?'ILLUSTRATION':n.kind==='model'?'MODÈLE':n.id)}</span>${badge(n)}</span><span class="fa-tile-name">${esc(n.name)}</span><span class="fa-tile-purpose">${esc(n.purpose)}</span><span class="fa-tile-foot"><span>${childCount(n)}</span>${icon('arrow-up-right')}</span></button>`}
    function inspector(n){return `<aside class="fa-inspector" aria-label="Comprendre ${esc(n.name)}"><h3>Finalité</h3><p>${esc(n.purpose)}</p><h3>Définition</h3><p>${esc(n.definition||n.purpose)}</p><div class="fa-status-note">${badge(n)}<p>${esc(n.statusNote)}</p></div><details class="fa-source-details"><summary>Sources et provenance</summary><div class="fa-source">${(n.sources||[]).map(s=>`<span>${esc(s)}</span>`).join('')}</div><p class="fa-source-path">${esc(n.sourcePath||mapPath)}</p><p class="fa-footnote">Synthèse de lecture · état au 13 septembre 2026. Le registre conserve la formulation et ses réserves.</p></details>${n.kind==='reference'?'<h3>Autorité</h3><p>Références reçues de l’extérieur. La plateforme porte l’ingestion ; le maître et les détails sont ceux précisés dans les sources.</p>':''}</aside>`}
    function relationView(n){const rs=related(n.id);if(!rs.length)return `<div class="fa-empty">${kind(n)}<h2>Relations à documenter</h2><p>Aucune relation métier détaillée n’est représentée pour cet élément dans cet aperçu.</p>${n.children.length?'<button class="fa-button" data-view="map">Explorer les éléments rattachés</button>':''}<button class="fa-button" data-journey="start">Voir l’exemple d’une promesse</button></div>`;return `<div class="fa-relations"><svg class="fa-links-svg" aria-hidden="true"></svg><div class="fa-graph-center">${kind(n)}<strong>${esc(n.name)}</strong></div><div class="fa-related-grid">${rs.map(e=>{const t=nodes.get(e.target);return `<button class="fa-related" data-go="${t.id}" data-open-view="links"><span class="fa-relation-label">${esc(e.label)} ↓</span>${kind(t)}<strong>${esc(t.name)}</strong><span class="fa-badge" data-tone="${e.status==='illustration'?'purple':'neutral'}">${e.status==='illustration'?'Lien illustratif':'Lien de lecture'} · ${e.sources.join(', ')}</span></button>`}).join('')}</div><p class="fa-edge-note">Les verbes se lisent depuis l’élément sélectionné. Les liens ne constituent pas une décomposition.</p></div>`}
    function mapView(n){if(n.id==='transactional'){return `<div class="fa-grid">${n.children.filter(id=>id!=='business-references').map(id=>tile(nodes.get(id))).join('')}</div><section class="fa-ref-group"><div class="fa-ref-head"><div><h3>Business References</h3><small>5 modèles distincts · ingestion de références externes</small></div><button class="fa-button" data-go="business-references">Explorer le groupe ${icon('arrow-right')}</button></div><div class="fa-ref-chips">${nodes.get('business-references').children.map(id=>`<button data-go="${id}">${esc(nodes.get(id).name)}</button>`).join('')}</div></section><p class="fa-footnote">La position des éléments représente un classement, pas un enchaînement de processus.</p>`}
      if(n.children.length)return `<div class="fa-grid">${n.children.map(id=>tile(nodes.get(id))).join('')}</div>${n.id==='process'?'<p class="fa-footnote">Un objet cité pour ouvrir l’exploration. Le modèle fonctionnel des processus reste à construire.</p>':''}`;
      return `<div class="fa-detail-hero">${kind(n)}<h2>${esc(n.name)}</h2><p>${esc(n.purpose)}</p></div>${related(n.id).length?`<div class="fa-eyebrow">Explorer ses relations</div>${relationView(n)}`:'<div class="fa-empty"><h3>Le détail reste à enrichir</h3><p>Sous-capacités, objets, documents et événements pourront apparaître à mesure qu’ils seront décrits et reliés au modèle.</p><button class="fa-button" data-journey="start">Découvrir un exemple de relations</button></div>'}`;
    }
    function renderJourney(){const el=root.querySelector('#fa-journey');el.hidden=state.journey<0;if(el.hidden)return;const s=steps[state.journey];el.className='fa-journey';el.innerHTML=`<div class="fa-journey-top"><strong>Suivre une promesse · ${state.journey+1}/4</strong><button class="fa-ghost" data-journey="close">Quitter le parcours ×</button></div><div class="fa-stepper">${steps.map((p,i)=>`<button data-step="${i}" aria-current="${i===state.journey?'step':'false'}">${i+1} · ${p.label}</button>`).join('')}</div><p>${esc(s.text)}</p><div class="fa-journey-actions"><span class="fa-badge" data-tone="purple">Détails métier illustratifs</span><button class="fa-button" data-journey="prev" ${state.journey===0?'disabled':''}>Précédent</button><button class="fa-button fa-primary" data-journey="next">${state.journey===3?'Terminer':'Continuer →'}</button></div>`}
    function heading(n){let subtitle=n.purpose;if(n.id==='transactional')subtitle='Entre dans un domaine pour découvrir ses capacités, puis parcours leurs relations.';return `<div class="fa-heading"><div class="fa-heading-text"><div class="fa-eyebrow">${n.id==='transactional'?'Carte du modèle':labels[n.kind]}</div><h1>${esc(n.name)}</h1><p>${esc(subtitle)}</p></div>${n.id==='transactional'?'<button class="fa-button" data-journey="start">'+icon('compass')+' Visite guidée</button>':''}</div>`}
    function drawEdges(){const graph=root.querySelector('.fa-relations');if(!graph)return;const svg=graph.querySelector('.fa-links-svg');const center=graph.querySelector('.fa-graph-center');const bounds=graph.getBoundingClientRect();const c=center.getBoundingClientRect();const x=c.left+c.width/2-bounds.left,y=c.bottom-bounds.top;svg.setAttribute('viewBox',`0 0 ${bounds.width} ${bounds.height}`);svg.innerHTML=[...graph.querySelectorAll('.fa-related')].map(el=>{const r=el.getBoundingClientRect();const tx=r.left+r.width/2-bounds.left,ty=r.top-bounds.top;return `<path d="M ${x} ${y} C ${x} ${y+18}, ${tx} ${ty-20}, ${tx} ${ty}"/>`}).join('')}
    function refreshIcons(){if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:17,height:17}})}
    function render(){const n=nodes.get(state.id);root.dataset.density=design.density;root.dataset.layout=design.layout;root.dataset.definitions=String(design.definitions);root.querySelector('#fa-back').disabled=state.at===0;root.querySelector('#fa-forward').disabled=state.at===state.history.length-1;root.querySelectorAll('.fa-nav[data-go]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.go===modelOf(n))));root.querySelector('.fa-nav[data-journey]').setAttribute('aria-pressed',String(state.journey>=0));let path=lineage(n);if(!n.parentId&&n.modelId)path=[nodes.get('atlas'),nodes.get(n.modelId),n];root.querySelector('#fa-breadcrumb').innerHTML=path.map((p,i)=>`${i?'<span aria-hidden="true">/</span>':''}<button data-go="${p.id}">${esc(p.id==='atlas'?'Modèles':p.name)}</button>`).join('');root.querySelector('#fa-recent').innerHTML=state.recent.slice(0,4).map(id=>`<button class="fa-nav" data-go="${id}">${esc(nodes.get(id).name)}</button>`).join('')||'<small class="fa-muted" style="padding:9px">Tes visites apparaîtront ici.</small>';renderJourney();if(state.query){renderSearch();refreshIcons();return}
      const showInspector=!['atlas','transactional'].includes(n.id);const count=n.id==='transactional'?'7 domaines · 1 groupe de références':n.children.length?`${childCount(n)} · ${related(n.id).length} liens de lecture`:`${related(n.id).length} relations dans cet aperçu`;content.innerHTML=heading(n)+`<div class="fa-toolbar"><div class="fa-segments" aria-label="Vue de l’élément"><button data-view="map" aria-pressed="${state.view==='map'}">${icon('layout-grid')} Structure</button><button data-view="links" aria-pressed="${state.view==='links'}">${icon('waypoints')} Relations</button></div><span class="fa-count">${count}</span></div><div class="${showInspector?'fa-focus-layout':''}"><section aria-label="${state.view==='map'?'Structure':'Relations'} de ${esc(n.name)}">${state.view==='map'?mapView(n):relationView(n)}</section>${showInspector?inspector(n):''}</div>`;refreshIcons();requestAnimationFrame(drawEdges)}
    function move(id,view='map',record=true,keepJourney=false){if(!nodes.has(id))return;if(!keepJourney)state.journey=-1;state.id=id;state.view=view;state.query='';search.value='';if(record){state.history=state.history.slice(0,state.at+1);const last=state.history.at(-1);if(last.id!==id||last.view!==view){state.history.push({id,view});state.at=state.history.length-1}}if(!['atlas','transactional','process'].includes(id))state.recent=[id,...state.recent.filter(x=>x!==id)];render();root.querySelector('#fa-announcement').textContent=`${nodes.get(id).name}. ${labels[nodes.get(id).kind]}. Vue ${view==='map'?'structure':'relations'}.`}
    function score(n,q){const tokens=normalize(q).trim().split(/\s+/);const name=normalize(n.name),id=normalize(n.id),terms=normalize([n.name,n.id,n.purpose,n.definition,n.aliases,n.sources.join(' ')].join(' '));if(!tokens.every(t=>terms.includes(t)))return 0;return (id===normalize(q)?100:0)+(name===normalize(q)?90:0)+(name.includes(normalize(q))?40:0)+(normalize(n.aliases).includes(normalize(q))?20:0)+1}
    function highlight(value,q){const text=String(value||'');const terms=normalize(q).trim().split(/\s+/).filter(Boolean);const normalized=normalize(text);const ranges=[];terms.forEach(t=>{let start=normalized.indexOf(t);while(start!==-1){ranges.push([start,start+t.length]);start=normalized.indexOf(t,start+t.length)}});ranges.sort((a,b)=>a[0]-b[0]);let out='',at=0;ranges.forEach(([s,e])=>{if(s<at)return;out+=esc(text.slice(at,s))+'<mark>'+esc(text.slice(s,e))+'</mark>';at=e});return out+esc(text.slice(at))}
    function matches(){return [...nodes.values()].filter(n=>!['atlas','transactional','process'].includes(n.id)).map(n=>({n,score:score(n,state.query)})).filter(x=>x.score>0&&(state.type==='all'||x.n.kind===state.type)&&(state.statusFilter==='all'||(state.statusFilter==='validated'?(x.n.kind==='capability'&&x.n.status==='validated'):x.n.status===state.statusFilter))).sort((a,b)=>b.score-a.score||a.n.name.localeCompare(b.n.name,'fr'))}
    function searchResults(){const results=matches();return `<p class="fa-count" role="status">${results.length} résultat${results.length>1?'s':''} dans tout le modèle</p><div class="fa-results" style="margin-top:12px">${results.map(({n})=>{const path=lineage(n).filter(x=>!['atlas','transactional'].includes(x.id));const aliasMatch=normalize(n.aliases||'').includes(normalize(state.query));return `<button class="fa-result" data-go="${n.id}"><span class="fa-result-top"><span>${highlight(n.name,state.query)}</span>${badge(n)}</span><p>${highlight(n.definition||n.purpose,state.query)}</p>${aliasMatch?`<p>Vocabulaire associé : ${highlight(n.aliases,state.query)}</p>`:''}<div class="fa-result-path">${labels[n.kind]} · ${highlight(n.id,state.query)} · ${esc(path.slice(0,-1).map(x=>x.name).join(' / ')||nodes.get(modelOf(n))?.name||'Modèle')}</div></button>`}).join('')||'<div class="fa-empty"><h2>Aucun résultat</h2><p>Essaie un libellé, un terme français ou un identifiant, par exemple « affectation », « inventaire » ou « D03.b ».</p></div>'}</div>`}
    function renderSearch(){content.innerHTML=`<div class="fa-heading"><div class="fa-heading-text"><div class="fa-eyebrow">Recherche directe</div><h1>Retrouver un élément</h1><p>Noms, identifiants, descriptions et vocabulaire français associé.</p></div><button class="fa-button" data-clear-search>Revenir à l’exploration</button></div><div class="fa-search-filters"><label>Type <select id="fa-type"><option value="all">Tous les éléments</option><option value="domain">Domaines</option><option value="reference">Références</option><option value="group">Groupes</option><option value="capability">Capacités</option><option value="object">Objets métier</option><option value="document">Documents</option><option value="event">Événements</option></select></label><label>Statut <select id="fa-status"><option value="all">Tous les statuts</option><option value="validated">Capacités validées</option><option value="review">En réexamen</option><option value="hypothesis">Hypothèses</option><option value="illustration">Exemples proposés</option><option value="proposed">Proposés</option><option value="retained">Orientations retenues</option></select></label></div><div id="fa-results-area">${searchResults()}</div>`;root.querySelector('#fa-type').value=state.type;root.querySelector('#fa-status').value=state.statusFilter}
    root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!root.contains(b)||b.disabled)return;if(b.dataset.go){move(b.dataset.go,b.dataset.openView||'map');return}if(b.dataset.view){move(state.id,b.dataset.view,true,state.journey>=0);return}if(b.id==='fa-back'||b.id==='fa-forward'){state.at+=b.id==='fa-back'?-1:1;const h=state.history[state.at];move(h.id,h.view,false);return}if(b.hasAttribute('data-clear-search')){state.query='';search.value='';render();return}if(b.dataset.journey||b.dataset.step!==undefined){const a=b.dataset.journey;if(a==='close'){state.journey=-1;render();return}if(a==='next'&&state.journey===3){state.journey=-1;move(confirmation,'links');return}state.journey=b.dataset.step!==undefined?Number(b.dataset.step):a==='start'?0:a==='prev'?state.journey-1:state.journey+1;move(steps[state.journey].id,'links',true,true)}});
    root.addEventListener('change',e=>{if(e.target.id==='fa-type'||e.target.id==='fa-status'){if(e.target.id==='fa-type')state.type=e.target.value;else state.statusFilter=e.target.value;root.querySelector('#fa-results-area').innerHTML=searchResults();refreshIcons()}});
    search.addEventListener('input',()=>{state.query=search.value.trim();state.journey=-1;render()});
    root.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();search.focus();search.select()}if(e.key==='Escape'&&state.query){state.query='';search.value='';render();search.focus()}if(e.key==='Enter'&&e.target===search&&state.query){const first=matches()[0];if(first){e.preventDefault();move(first.n.id)}}});
    render();new ResizeObserver(()=>requestAnimationFrame(drawEdges)).observe(content);
    if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSelect(design,'layout',{label:'Disposition de la carte',options:[{label:'Cartes',value:'cards'},{label:'Liste',value:'list'}]});tweak.addSelect(design,'density',{label:'Densité',options:[{label:'Aérée',value:'comfortable'},{label:'Compacte',value:'compact'}]});tweak.addToggle(design,'definitions',{label:'Finalités sur la carte'});}
  })();
  </script>
