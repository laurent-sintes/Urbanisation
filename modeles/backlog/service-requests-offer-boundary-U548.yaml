id: service-requests-offer-boundary-U548
date: '2026-09-21'
author: Codex
status: proposal_analyzed_no_structural_adoption
source_refs:
- U548
- U547
- U500
- U501
- ELM131
- ELM369
- CMP227
baseline_model_sha256: a04bd6a13198897db87c1e1797b3fefad18e2ee5a99f18b67abb9bf6aa930f2d
user_proposal: Service Requests ne représente que les requests externes, l’offre de service du Domain.
interpretation: Externe désigne la frontière de Supply Chain Orchestration, pas celle de l’entreprise, d’une application ou
  d’une équipe. La frontière offerte aux consommateurs du Domain devient le principe de lecture proposé.
finding: 'La sortie de la demande d’optimisation ne suffit pas à rendre toutes les demandes restantes exclusivement externes
  : Transfer Order D04.k possède déjà les origines Frontoffice et Backoffice adoptées U501.'
recommendation:
  principle: Organiser Service Requests autour des familles de services que le Domain expose ; conserver une seule capacité
    pour une même famille d’Orders, même lorsque certaines occurrences naissent en interne.
  proposed_definition: Prendre en charge et suivre les demandes correspondant aux services offerts par Supply Chain Orchestration,
    depuis le résultat attendu jusqu’à leur conclusion.
  boundary: Les demandes propres au fonctionnement d’une capacité, telles que le réexamen du carnet, peuvent être gérées par
    cette capacité. L’origine externe d’un appel ou d’un événement ne suffit pas à en faire une famille de services autonome.
  benefit: Clarifier l’offre du Domain sans dupliquer les cycles de vie d’Orders selon leur provenance.
  tradeoff: Cette lecture conserve des occurrences internes dans des familles exposées ; elle ne correspond donc pas à une
    exclusion stricte de toute demande née dans le Domain. Si l’exclusion stricte est retenue, le devenir des Transfer Orders
    internes et des capacités communes devra être décidé explicitement.
examples:
- case: Réexamen du carnet après un impondérable
  position: Prise en charge proposée au sein de Order Backlog Planning, U547.
- case: Transfert demandé par un consommateur externe au Domain
  position: Demande d’un service offert, gérée par Transfer Order.
- case: Transfert décidé par Inventory Optimization Planning
  position: 'Exemple cible, pas un flux Beaumanoir constaté : le Planning produit le besoin ; Transfer Order peut en gérer
    la réalisation attendue, avec les mêmes règles que pour une demande externe.'
remaining_impacts:
- Revoir la définition et les comparaisons de D04 qui couvrent actuellement demandes reçues ET internes de travail.
- Préserver les origines U501 et éviter de scinder Transfer Order par provenance.
- Order Structuring, Order Lifecycle Management et Order Archiving sont des capacités de gestion des demandes, pas automatiquement
  trois services autonomes exposés. Leur parent ne change pas par déduction.
- 'Purchase Order et Consignment Replenishment Order nécessitent un examen du point de vue : une commande adressée à un fournisseur
  ne prouve pas à elle seule une demande entrante au Domain.'
- Service Catalog D14 décrit les Backing Services sollicités par le Domain ; ne pas le confondre avec son offre aux consommateurs.
  Aucun nouveau Domain Business Services ni catalogue créé.
