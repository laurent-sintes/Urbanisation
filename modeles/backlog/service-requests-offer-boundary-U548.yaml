market_position: Appui partiel au suivi des commandes de service et à la production de demandes par un planning. La séparation
  offre exposée / demandes propres aux capacités est une recommandation de cohérence FLOW, sans consensus structurel ou innovation
  revendiqué.
canonical_changes: Aucun changement de modèle, de parent, de nom, de contrat ou d’accord. Proposition et impacts consignés.
