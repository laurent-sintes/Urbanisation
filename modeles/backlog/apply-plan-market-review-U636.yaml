assessment:
  supported:
  - Passage distinct entre propositions du plan et changements opérationnels.
  - Application sélectionnée, manuelle ou automatisée selon les règles.
  - Création de commandes et recommandations de révision de commandes existantes.
  - Suivi des résultats et traitement des refus ; pas de preuve de transaction globale atomique.
  - Notifications client documentées en gestion des commandes, comme conséquences possibles.
  not_demonstrated:
  - Une capacité standard unique nommée Apply Plan couvrant tout le périmètre FLOW.
  - Un mail systématique et directement émis par le moteur de planification.
  - Une validation globale autorisant par elle-même tous les changements de commandes.
  - Une couverture installée Beaumanoir, Boardriders ou Sarenza.
  qualification: Convergence fonctionnelle partielle entre trois documentations éditeurs ; Kinaxis apporte un positionnement
    plus général. Aucun consensus de taxonomie revendiqué.
recommendation:
  name: Apply Plan
  alternative_name: Plan Application
  name_rationale: Firming est trop centré sur la conversion des ordres planifiés ; Release Plan Recommendations est proche
    du passage à l’action mais ne couvre pas seul le constat des suites. Apply Plan reste un libellé FLOW justifié par le
    résultat métier.
  definition: Faire appliquer les changements autorisés issus d’une version préparée du plan, coordonner leurs conséquences
    auprès des responsables concernés et constater leur prise en compte effective.
  boundary: Les responsables des commandes, engagements et prestations contrôlent et réalisent leurs changements. Les notifications
    sont déclenchées selon les conséquences et règles applicables. Envoyé, accepté, appliqué, refusé et encore en attente
    doivent pouvoir être distingués selon le contexte, sans imposer cette liste comme cycle universel.
  placement: Conserver provisoirement le comportement direct du Planning commun. Les sources appuient sa responsabilité, pas
    sa promotion automatique en capacité.
  plan_adjustment: Prépare la révision proposée ; Apply Plan la fait prendre en compte. La même application sert aussi un
    plan initial.
  authorization: Séparer sémantiquement proposition, autorisation et effet réel ; cela ne démontre pas la nécessité d’un comportement
    Plan Authorization autonome.
  monitoring: Apply Plan constate les suites de son application ; Monitor Plan apprécie ensuite les effets et les écarts du
    plan dans le temps.
  benefit: Fermer la boucle entre proposition et résultat opérationnel sans perdre les refus ni les effets partiels.
  tradeoff: Responsabilité transverse qui exige des liens explicites avec les partenaires, sans reprendre leur maîtrise métier.
  progressive_application: Préciser la mise en application partielle et progressive selon l’échéancier porté par le plan (U637/U638),
    sans confondre déclenchement d’un calcul et application de ses effets.
