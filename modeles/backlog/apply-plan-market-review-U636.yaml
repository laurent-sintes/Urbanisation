  source_refs:
  - U637
  - U638
  agreed_principles:
  - La progressivité est portée par le plan lui-même.
  - Une partie des modifications peut être poussée.
  - Le plan porte le calendrier des mises à jour.
  interpretation_proposed: Le plan contient un échéancier de mise en application ; Apply Plan peut appliquer la partie sélectionnée
    ou arrivée à échéance, sous réserve des règles et autorisations pertinentes.
  distinctions:
  - Schedule Planning programme le travail de calcul.
  - L’échéancier du plan programme ses changements opérationnels.
  - Les dates de livraison ou de transfert constituent le contenu métier des changements.
  - Application partielle volontaire et application incomplète à la suite de refus sont distinctes.
  behavior_to_instruct:
    working_label: Application progressive ou sélective du plan
    placement: 'U639 appliqué : modalité décrite dans Apply Plan, sans sous-comportement ni capacité nouvelle.'
    open_points:
    - Choix de la partie applicable et dépendances à préserver
    - Autorisation et contrôle au moment de l’application
    - Actualisation de l’échéancier quand le plan est révisé
    open_points_note: Précisions éventuelles futures ; elles ne bloquent ni la modalité adoptée ni son rattachement.
  market_alignment: ELM419 documente sélection, horizon de firming et traitements récurrents. Cela appuie l’application progressive
    ; le choix de porter explicitement l’échéancier dans le plan est apporté par Laurent, pas une structure uniforme démontrée
    chez tous les éditeurs.
agreement_U639:
  source_ref: U639
  author: Laurent
  decided_at: '2026-09-23'
  status: applied_scoped_agreement
  target_id: D02.e
  approved_passage: Le plan porte l’échéancier des mises à jour. Apply Plan peut appliquer une partie des changements. Il
    distingue les changements appliqués, en attente ou refusés.
  approved_passage_sha256: a44e7f76f7b0dbdb06d935823686387a7c4ddd70aab73c742540e75edf605fb3
  placement: Modalité décrite dans Apply Plan, sans comportement supplémentaire.
  scope_limit: Accord sur ce passage et sa portée ; aucun accord global sur le champ scope, la nouvelle définition proposée
    ou les comparaisons.
  capture_note: 'record_decision accepte des champs entiers uniquement. Le champ scope contient aussi des développements non
    adoptés : aucune capture de champ entier n’est créée par extension. Le passage adopté est conservé ici avec sa source
    et son empreinte.'
  previous_changed_fields:
    D02.e.scope: |-
      Faire appliquer les recommandations autorisées du plan commun et établir les effets effectivement pris en compte, refusés ou partiels. Vérifier leurs conditions et interdépendances au moment de l'application ; une recommandation devenue inapplicable reste visible pour réexamen. Aucun retour arrière global ni transaction atomique du plan n'est supposé.

      Les familles d'effets comprennent les liens ressources-besoins, les nouveaux apports et ajustements d'Orders, les changements autorisés d'échéanciers et de promesses et les politiques à rendre applicables. Elles décrivent le contenu de ce comportement terminal, sans sous-comportements. Les décisions gardent les arbitrages ; Demand, Inventory et Reference & Policy Management conservent commandes, engagements, réservations et politiques. Fulfillment orchestre les prestations.

      Le mécanisme d'affectation conserve son sens métier Supply Assignment : matérialiser et maintenir les liens entre ressources présentes ou futures et commandes ou besoins prévisionnels identifiés, même avant toute commande. Compléter des liens existants, réaffecter ou libérer ceux qui sont modifiables restent des modalités combinables. Seule la réservation bloque les usages concurrents ; l'affectation ne crée ni réservation ni promesse. Une prévision ne devient pas une commande du seul fait d'un lien de couverture. Les protections de groupe et gels restent applicables ; préserver un lien pendant un traitement ne crée pas un gel durable.

      Exemples fictifs : affecter 40 pièces d'un arrivage à une commande puis en changer la provenance admissible ; lier 300 pièces attendues aux ventes web encore prévues en novembre. Pour des besoins de 100 et 200 et une ressource de 150, un prorata illustratif de 50 et 100 serait choisi par les décisions, puis matérialisé ici ; il ne réduit pas les demandes ni ne prescrit une politique universelle.

      [Purchase Order](model:D04.j), [Transfer Order](model:D04.k), [Consignment Fill-up Order](model:D04.r) et [Order Lifecycle Management](model:D04.o) portent les demandes et leurs changements autorisés. [Fulfillment Commitment](model:D03.n) porte les propositions et engagements de satisfaction ; une affectation peut changer sans modifier la promesse, et réciproquement. [Reservation](model:D02.c) tient les engagements de réservation. [Supply Protection](model:D02.b) et les autres capacités Policy mettent en vigueur les règles retenues. L'application les mobilise sans transférer leur responsabilité et sans créer un engagement fournisseur implicite.

      Le résultat et les écarts alimentent le suivi du Planning et [Scenario Execution Adaptation](model:BHV016). Une sollicitation acceptée n'établit pas l'application complète ; l'application partielle ne devient pas silencieusement un nouveau plan. La réalisation physique reste distincte. Exemple fictif : un transfert de 30 pièces est pris en compte mais un achat de 70 est refusé ; conserver le transfert et le refus, rendre visible le manque et faire réexaminer les possibilités. Une politique appliquée et un transfert partiel sont également deux résultats distincts ; le reliquat reste explicite.
    D05.f.scope: |-
      Construire le plan commun pour un périmètre et un horizon donnés, en confrontant commandes, prévisions restantes, ressources présentes et apports attendus. Les affectations, apports initiaux, réassorts, redistributions et révisions proposées de politiques contribuent au même résultat. Les scénarios ne maintiennent pas de plans finaux concurrents et ne comptent pas deux fois une commande comprise dans la prévision.

      [Demand Planning](model:D17.a) fournit la demande retenue à couvrir. [Fulfillment Plan Decision](model:D03.o) et les décisions spécialisées déterminent les possibilités, affectations, cibles, protections, apports, priorités et échéanciers ainsi que leur compatibilité. Le Planning organise leur mobilisation, compare les scénarios et maintient la référence retenue. Plusieurs scénarios peuvent être étudiés ; hypothèses, conditions, effets interdépendants et reste non couvert doivent rester identifiables. Aucun ordre universel de calcul, moteur unique ou optimum mathématique garanti n'est imposé.

      Le travail comprend cadrage et suivi de la demande de planification, construction d'alternatives, simulation et analyse, autorisation des suites, mise en œuvre et ajustement face aux écarts. [Apply Plan](model:D02.e) fait appliquer les recommandations autorisées et constate leur prise en compte. [Monitor Plan](model:BHV101) observe les effets, les nouvelles conditions et les besoins de réexamen. [Adjust Plan](model:BHV016) prépare une révision cohérente en tenant compte des effets acquis ; ses suites restent soumises aux autorisations et à Apply Plan. Les cinq actes de pilotage sont portés directement par [Scope Planning](model:D04.s), [Schedule Planning](model:BHV097), [Run Planning](model:BHV098), [Stop Planning](model:BHV099), [Rerun Planning](model:BHV100). Ils n’imposent ni séquence obligatoire ni intervention humaine. Le suivi du travail jusqu’à sa conclusion reste une responsabilité du Planning commun, distincte de son seul cadrage. Arrêter un calcul ne défait pas les effets déjà pris en compte.

      Les capacités de Demand conservent les Orders, leurs évolutions et les propositions, confirmations et révisions de promesse. Inventory conserve faits de stock et réservations. Reference & Policy Management porte la mise en vigueur des règles ; une politique proposée par le plan ne devient pas automatiquement applicable. Fulfillment coordonne et adapte les prestations engagées. Les capacités partenaires restent responsables de leurs résultats, même lorsqu'elles sont mobilisées par Apply Plan. Une demande ferme peut être révisée selon les conditions applicables avant son début d'exécution ; la portée d'un début partiel reste à préciser.

      Exemple fictif : un scénario prévoit un transfert de 30 pièces et un nouvel achat de 70. Le transfert est pris en compte ; l'achat est refusé. Le Planning conserve le résultat du transfert, rend visible le manque de couverture et mobilise les décisions pour réexaminer les possibilités. Il ne considère pas les 100 pièces comme acquises et n'efface pas le transfert. Une recommandation dépendant d'un autre effet doit être réexaminée avant sa propre application. Une simulation ou une autorisation ne prouve ni réservation, ni promesse confirmée, ni réception.

      Les analyses de stock restent couvertes : comparer des cibles de couverture à 10 ou 15 jours, les apports de lancement ou de réassort, les redistributions, réductions et reports d'apports, puis apprécier service, immobilisation, coûts et risques. La valeur est multidimensionnelle sans pondération universelle. Les politiques consommées restent extérieures. Les analyses d'affectation comprennent les commandes et prévisions restantes, même avant commande, et peuvent conclure sans changement. Les horizons et hypothèses se choisissent selon le problème ; cette responsabilité ne duplique pas la construction de la demande dans Demand Planning.

      Le travail de planification reste une sollicitation interne au Domain, dite Backoffice, qui peut répondre à un impondérable, une échéance de revue ou une étude volontaire. Ces origines peuvent se combiner sans imposer un dossier manuel ni un recalcul intégral à chaque événement. Le Planning conserve progression et conclusion du travail, y compris une étude abandonnée ou conclue sans application ; il ne suit pas à la place des exécutants leurs opérations.
