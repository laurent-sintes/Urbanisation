      processus.
    differences: Camunda décrit une plateforme et des mécanismes transverses. FLOW cartographie des responsabilités métier
      et sépare explicitement décision d’adaptation, orchestration et suivi.
    flow_position: Le Process orchestre des Services ; Process Orchestration reprend le vocabulaire établi. Les autres intitulés
      FLOW ne constituent pas une taxonomie Camunda.
