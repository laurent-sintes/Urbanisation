  explanation: 'Convention U409 : le Process orchestre des Services. Les Tasks expriment les contributions au processus ;
    les services réalisent les prestations sollicitées, humaines, physiques ou numériques. Un appel informatique est un moyen
    de sollicitation ou de feedback, pas le service métier lui-même. Process Orchestration coordonne la progression ; Process
    Adaptation Decision choisit les adaptations ; Operations Tracking rend visibles les opérations et Process Tracking leur
    contribution à la progression du processus. Les exécutants gardent leurs opérations internes. Le périmètre Supply et les
    couches du modèle restent inchangés ; aucun moteur de workflow ou nouveau niveau descriptif imposé.'
