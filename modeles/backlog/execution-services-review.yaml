assistant_proposal:
  state: applied_domain_and_reference_U244_capabilities_revised_U247_see_field_scopes
  reference:
    name: Execution Service Catalog
    definition: Décrire les services exécutants proposés, leurs conditions d’utilisation, leurs engagements de réalisation
      et les interfaces permettant de les solliciter et d’en suivre l’exécution.
    content:
    - Résultat métier rendu, prestataire et périmètre de service.
    - 'Conditions d’éligibilité : lieux, flux, horaires, restrictions ; liens vers Fulfillment Network et Party.'
    - 'Engagement de service applicable : délai de prise en charge/réalisation, calendrier et conditions, à distinguer du
      délai technique de réponse.'
    - 'Contrat d’accès : sollicitation et remontée d’avancement/résultats ; endpoint ou références de canaux, sans imposer
      un protocole.'
    boundaries:
    - Fulfillment Network décrit les lieux et relations du réseau ; le catalogue décrit les services qui peuvent les mobiliser.
    - Catalog reste le catalogue commercial ; ce nouveau référentiel décrit l’offre des exécutants.
    - Maître exact à identifier ; projection externe suivant la règle courante, pas d’administration locale présumée.
    - Charge actuelle, avancement des demandes et performance observée sont des états opérationnels, pas des caractéristiques
      fixes du catalogue.
  domain:
    name: Execution Management
    definition: Orchestrer l’exécution Supply en coordonnant les prestations, en suivant leur réalisation et en adaptant le
      plan aux aléas, en articulation avec la promesse Supply.
    coverage:
    - Évaluer les services et capacités de réalisation utilisables pour un besoin.
    - 'Émettre et gérer les Service Orders : sollicitation, modification, suspension ou annulation selon le contrat de service.'
    - Suivre engagements, résultats attendus, progression et retours continus.
    - Rapprocher les résultats attendus et réalisés ; traiter les écarts et suivre le respect du service engagé.
    - Coordonner les dépendances entre prestations pour suivre le plan d’exécution et ses résultats.
    - Réagir aux aléas opérationnels et rechercher des variantes du plan ; mobiliser D03 pour le réexamen de la promesse concernée
      selon des conditions à préciser.
    granularity: Responsabilités à instruire ; cette liste ne crée pas une capacité par étape.
    current_responsibility_mapping:
      D07.a: 'Execution Requirements Decision : déterminer les prestations nécessaires.'
      D06.e: 'Execution Service Decision : regrouper admissibilité et choix des services ; fusion appliquée comme proposition.'
      D06.b: 'Execution Capacity Visibility : rendre accessibles les capacités communiquées dans leur contexte.'
      D07.b: 'Service Order Management : tenir les demandes de prestation et leur cycle de vie.'
      D06.d: 'Execution Orchestration : coordonner les prestations et leurs dépendances.'
      D07.d: 'Execution Tracking : suivre les faits et les résultats encore attendus.'
      D07.c: 'Execution Reconciliation : rapprocher attendu/réalisé et conserver les contributions D04.'
      D06.f: 'Execution Adaptation Decision : déterminer les variations du plan ; D03 conserve la promesse Supply.'
    definition_status: Formulation de synthèse proposée après U242 ; principes adoptés uniquement dans les portées user_agreements_U240
      et user_agreements_U242.
  illustration: Un transport peut être accepté informatiquement rapidement, puis pris en charge, en transit et livré selon
    son engagement de réalisation ; un service documentaire peut retourner un document. Le domaine suit les états et résultats
    propres à chaque service, sans imposer un cycle métier universel.
open_points:
- Éprouver la fusion qualification/options dans D06.e et les compléments détaillés proposés après U247 ; la latitude d’adaptation
  reste une question de fonctionnement séparée.
- 'Préciser la description de capacité contextuelle : mesure, maille, horizon, charge considérée et fraîcheur ; aucun algorithme
  imposé.'
- Identifier le maître de la configuration des services/SLA et son articulation avec Agreement.
- Définir les contrats de sollicitation et de tracking selon le service et les faits accessibles.
publication: Catalogue révisé appliqué au backlog U247 ; publication courante et Atlas inchangés.
market_challenge_U239:
  state: discussed_U240_local_principles_adopted_comparisons_proposed
  source_refs:
  - U239
  study: marche/execution-services-catalog-and-management.md
  comparison_ref: CMP076
  element_refs:
  - ELM129
  - ELM130
  - ELM131
  - ELM132
  - ELM133
  - ELM134
  - ELM135
  conclusion: Catalogue et pilotage confortés ; domaine unique demeure un choix local. Préserver qualification avant commande,
    capacité dynamique, dépendances et exceptions.
  recommendations:
  - Séparer identité et contrat métier du service de ses bindings techniques, sans endpoint unique imposé.
  - Distinguer SLA applicable, engagement de prestation, estimation actualisée et performance observée, y compris pour les
    services numériques.
  - Définir les jalons et la fraîcheur du feedback ; ne pas assimiler continu à temps réel uniforme.
  - Coordonner les prestations utiles entre exécutants sans reproduire leurs opérations internes.
  - Respecter les possibilités de modification/annulation propres au service et à son état.
  model_mutation: false
