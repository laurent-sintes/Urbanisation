    name: Execution Management
    definition: Piloter les prestations confiées aux exécutants, de la sollicitation au résultat constaté, en maîtrisant leur
      prise en charge, leur avancement et leurs écarts.
    coverage:
    - Évaluer les services et capacités de réalisation utilisables pour un besoin.
    - 'Émettre et gérer les Service Orders : sollicitation, modification, suspension ou annulation selon le contrat de service.'
    - Suivre engagements, résultats attendus, progression et retours continus.
    - Rapprocher les résultats attendus et réalisés ; traiter les écarts et suivre le respect du service engagé.
    granularity: Responsabilités à instruire ; cette liste ne crée pas une capacité par étape.
    current_responsibility_mapping:
      D06.a: Offre admissible de référence dans le catalogue ; évaluation contextuelle dans le domaine.
      D06.b: Évaluation dynamique de charge/capacité conservée côté opérationnel.
      D06.c: Évaluation des options conservée côté opérationnel et mobilisable par D03.
      D07.a: Expression des Service Orders.
      D07.b: Gestion des prises en charge et engagements.
      D07.c: Suivi des résultats et rapprochement ; contributions D04 à préserver.
      D07.d: Suivi des résultats encore attendus à préserver, en élargissant si nécessaire aux prestations non physiques.
  capacity_before_U246:
