tracking_U406:
  status: integrated
  source_refs:
  - U305
  - U308
  - U404
  - U405
  - U406
  - ELM243
  - CMP154
  parent_id: D07.d
  entries:
  - id: BHV079
    name: Warehouse Visibility
    definition: Réception, manutention, préparation et expédition dans les entrepôts et plateformes.
    approved_by:
    - U305
    sources:
    - S44
    finality: Comprendre la situation des marchandises et l’avancement de leur traitement dans les entrepôts et plateformes.
    scope: |-
      Suivre réception, manutention, rangement, préparation et expédition à partir des faits communiqués par l’exécutant. Relier biens ou unités logistiques, opérations et prestations concernées. Les traces numériques d’une opération physique peuvent alimenter cette vue sans transformer l’opération en prestation numérique.

      Exemple fictif : sur 100 pièces attendues, 80 sont préparées et 20 restent à traiter ; la préparation partielle ne signifie pas que les 80 pièces ont déjà quitté le site. Les retards et anomalies sont visibles avec la progression normale.
  - id: BHV080
    name: Transportation Visibility
    definition: Acheminements, progression, arrivées estimées et remise au destinataire.
    approved_by:
    - U305
    sources:
    - S35
    finality: Connaître la progression des acheminements et les arrivées attendues, en distinguant estimation et remise constatée.
    scope: |-
      Suivre départs, étapes d’acheminement, localisation connue, retards, estimations d’arrivée et remise au destinataire. Conserver la continuité entre segments utiles, sans présumer une localisation continue ou une précision uniforme.

      Exemple fictif : un camion est en route avec une arrivée estimée à 14 h ; cette estimation n’est ni une preuve de livraison ni une réception magasin réalisée. La suite des opérations au magasin est visible dans Store Visibility.
  - id: BHV081
    name: Store Visibility
    definition: Réception magasin, passage en réserve, mise en rayon et réassort de la surface de vente.
    approved_by:
    - U305
    - U308
    sources:
    - S46
    finality: Distinguer marchandise livrée, reçue, en réserve et rendue accessible au client, afin d’expliquer les attentes
      de mise en rayon.
    scope: |-
      Rendre visibles réception magasin, passage en réserve, mise en rayon et réassort de la surface de vente. Le périmètre adopté ne s’étend pas à toutes les ventes ou à l’ensemble de l’activité du magasin.

      Exemple fictif : 100 pièces sont reçues, 60 restent en réserve et 40 sont mises en rayon. Livré au magasin ne signifie pas accessible au client ; une rupture en rayon peut coexister avec du stock en réserve. La vue décrit les opérations et leur progression, sans remplacer Inventory Visibility ni décider les seuils de réassort.
  - id: BHV082
    name: Business Process Tracking
    definition: Suivre l’avancement des processus d’exécution Supply et de leurs Tasks métier, en reliant chaque Task aux
      prestations et appels de services qui contribuent à sa réalisation, pour rendre explicites les résultats acquis, les
      attentes, les échecs et leurs conséquences sur la progression.
    approved_by:
    - U406
    sources:
    - S49
    - S48
    - S50
    finality: Comprendre où en est un traitement métier, les résultats acquis et ce qui conditionne sa progression, jusqu’aux
      appels de services associés aux Tasks.
    scope: |-
      **Point d’entrée métier.** Suivre le processus d’exécution Supply et ses Tasks métier, en les reliant aux commandes, documents et prestations concernés. Une Task peut mobiliser plusieurs services ; la corrélation ne suppose ni un appel unique ni une correspondance un pour un. Les actions humaines peuvent contribuer au résultat de la Task sans être assimilées à des appels informatiques.

      **Exemple : produire les documents d’expédition.** La Task mobilise des services pour récupérer les données, produire le document, le déposer et notifier sa disponibilité. Le tracking relie sollicitations, prises en charge connues, réponses, résultats et tentatives à cette Task. Si la production du document a abouti mais que son dépôt reste en attente, il devient possible de comprendre ce qui manque au résultat attendu, selon les conditions de fin définies pour la Task. Cet exemple ne prescrit pas un workflow universel.

      **Trois distinctions essentielles.** Un appel accepté ne signifie pas que la prestation est terminée. Des appels techniquement réussis ne garantissent pas le résultat métier attendu. Une Task terminée ne signifie pas que le processus complet est terminé. Une nouvelle tentative reste reliée à la demande d’origine ; absence de réponse ne vaut pas refus. Le suivi expose les faits et les résultats connus, sans inventer l’état d’un service externe.

      **Exemple : contrôle antifraude.** Le contrôle a répondu avec une suspicion : la prestation numérique peut être terminée alors que la commande reste en attente d’une décision. Le tracking rend explicite cette différence ; il ne décide pas d’accepter le risque. De même, la vérification d’identité ou de code-barres et la production documentaire restent visibles dans leur contexte métier, sans comportement autonome par service.

      **Lecture transversale.** Pour une commande, on peut constater le contrôle terminé, une décision attendue, le document non encore produit et la préparation physique terminée. Les vues Warehouse, Transportation et Store éclairent les opérations physiques ; Business Process Tracking explique leur articulation avec les Tasks et conditions connues de progression. Les faits peuvent être partagés sans duplication de responsabilité.

      **Frontières de modèle.** Les Tasks, prestations et appels de services sont des objets suivis ; ils ne créent aucun niveau sous Comportement. Aucun nouvel objet de catalogue, cardinalité ou relation de possession n’est imposé par cette description. Le périmètre est celui des processus d’exécution Supply ; le pilotage global des processus Business Services reste distinct. Le nom Digital Service Visibility est remplacé : son besoin de visibilité explicite demeure inclus ici, sans conserver un cinquième comportement. Les exemples sont fictifs et ne prouvent aucun existant Beaumanoir.
  common_boundaries: Les quatre comportements sont directement rattachés à Execution Tracking. Les visibilités physiques et
    le suivi du processus sont des perspectives complémentaires et peuvent utiliser les mêmes faits. Logistics Visibility
    reste une notion englobante, sans niveau supplémentaire. Les faits, estimations et engagements restent distincts, avec
    origine et fraîcheur. Le suivi porte aussi sur la progression normale, pas seulement les exceptions. Une information manquante
    ne prouve pas qu’une opération n’a pas eu lieu. Les exécutants gardent leurs opérations internes ; Inventory Management
    enregistre les effets sur le stock. Orchestration coordonne la suite et Execution Adaptation Decision détermine les adaptations
    ; le tracking ne les décide pas. Aucun temps réel uniforme ni architecture d’instrumentation imposés.
  decomposition_rationale: Les trois périmètres physiques rendent lisibles les situations et opérations propres à l’entrepôt,
    au transport et au magasin ; livré ne signifie pas mis en rayon. Le suivi transversal des processus explique les résultats,
    attentes et blocages métier en reliant Tasks et appels sous-jacents. Ce sont des perspectives combinables aux bénéfices
    distincts, sans sous-comportements ni découpage par bouton, interface ou fournisseur.
