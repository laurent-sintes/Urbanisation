      use_modeling_vocabulary: b079f5a4611fb578d8683dcd00046200b2eccaba87be18826c9490f691595869
  qualification_explanation: 'Qualification désignait l’admissibilité d’un service pour un besoin concret : lieux desservis,
    nature de prestation, horaires et restrictions. Ce contrôle ne justifie pas à lui seul une capacité autonome.'
  assistant_proposal:
    state: historical_intermediate_proposal_superseded_by_application_U247
    capabilities:
    - name: Execution Requirements Decision
      definition: 'Déterminer les prestations et résultats nécessaires pour réaliser un besoin Supply : préparation, transport,
        document, etc.'
      current_responsibility_origins:
      - D07.a
    - name: Execution Service Decision
      definition: Déterminer les services et exécutants à mobiliser pour les prestations nécessaires, en tenant compte de
        leur admissibilité et des contraintes.
      current_responsibility_origins:
      - D06.a
      - D06.c
    - name: Execution Capacity Visibility
      definition: Rendre visible la capacité opérationnelle communiquée par les exécutants, avec son contexte, sa période
        et sa fraîcheur, pour alimenter les décisions Supply.
      current_responsibility_origins:
      - D06.b
      review:
        adopted_fields:
        - name
        proposed_fields:
        - definition
        source_refs:
        - U246
        value_sha256:
          name: 1f963b5f007f2f8ae060db5e7891396e418bf8c94720ea819063034181ac38c1
    - name: Execution Commitment Management
      definition: Gérer la prise en charge, les engagements et leurs modifications ou annulations.
      current_responsibility_origins:
      - D07.b
    - name: Execution Orchestration
      definition: Coordonner le déclenchement et l’enchaînement des prestations ainsi que leurs dépendances selon le plan
        retenu.
      current_responsibility_origins:
      - D06.d
    - name: Execution Tracking
      definition: Connaître l’avancement, les faits, les estimations et les résultats encore attendus.
      current_responsibility_origins:
      - D07.d
    - name: Execution Reconciliation
      definition: Rapprocher les résultats constatés des prestations attendues et déterminer leurs écarts.
      current_responsibility_origins:
      - D07.c
    - name: Execution Adaptation Decision
      definition: Déterminer la variation du plan à retenir lorsqu’un aléa remet son exécution en cause.
      current_responsibility_origins:
      - D06.d
    rationale: Fusion proposée de l’admissibilité et de la comparaison des options dans une décision de service ; séparation
      de l’adaptation et de l’orchestration. Huit capacités résultent de cette proposition, sans objectif de nombre imposé.
    modeling_basis:
    - MOD001
    - MOD002
    - MOD003
    - MOD004
    boundaries:
    - Requirements Decision détermine le besoin de prestations ; Service Decision détermine les moyens de service pour le
      satisfaire. La formulation et la transmission du Service Order ne constituent pas à elles seules cette décision.
    - Capacity Visibility rend accessible la capacité communiquée et son contexte ; elle ne décide pas des ressources à engager
      ni d’une réservation. Nom adopté U246 ; description détaillée et règles de mesure proposées.
    - Adaptation Decision détermine une variation ; Orchestration coordonne les prestations du plan retenu. Une adaptation
      peut mobiliser à nouveau les décisions de services et la visibilité sur la capacité, sans créer de hiérarchie.
    - La décision de service reste dans le besoin Supply et les contraintes portés par D03 ; elle ne reprend pas le choix
      de couverture ou la révision de la promesse Supply.
    - D03 conserve la promesse Supply et son réexamen ; les exécutants conservent leurs opérations internes.
    - Planning signifie reconfigurer, simuler et valider en mobilisant les décisions. Aucun renommage automatique de l’adaptation
      en Planning ni capacité Planning supplémentaire déduit.
    - La latitude d’adaptation reste une question de fonctionnement sans impact sur le catalogue selon U243.
    market_status: Correspondances détaillées de ces nouveaux noms et granularités non comparées ; CMP078 conserve la portée
      du catalogue U244. Aucune equivalence de marché déduite.
  model_mutation: true
  application_note: Application U247 détaillée séparément ; ancien catalogue conservé dans history/pre-U247.yaml.
review_U246:
  state: applied_U247_service_order_management_adopted
  source_refs:
  - U246
  adopted_name:
    target_current_id: D06.b
    name: Execution Capacity Visibility
    value_sha256: 1f963b5f007f2f8ae060db5e7891396e418bf8c94720ea819063034181ac38c1
    scope: Nom retenu dans le catalogue en discussion ; ne valide pas les détails de mesure et de représentation.
  commitment_explanation:
    state: ai_proposed
    meaning: Tenir ce qui a été demandé à un exécutant, ce qu’il a accepté de réaliser et les évolutions de cette prise en
      charge.
    example: 'Demander la préparation de 100 colis avant 16 h ; enregistrer l’acceptation de l’entrepôt, un refus ou une proposition
      différente ; tenir les demandes de modification ou d’annulation et les réponses. Le tracking fournit ensuite les faits
      : préparation commencée, 60 colis prêts, retard annoncé.'
    naming_issue: Commitment Management met l’accent sur l’engagement mais décrit insuffisamment la gestion de la demande
      de prestation et de son cycle.
    candidate_name: Service Order Management
    candidate_definition: 'Gérer les demandes de prestation adressées aux exécutants et leur cycle de vie : émission, acceptation
      ou refus, modification, annulation et clôture, selon le service.'
    boundaries:
    - Requirements Decision détermine les prestations nécessaires ; Service Order Management tient les demandes et les réponses
      associées.
    - Orchestration coordonne les prestations ; Tracking renseigne leur réalisation ; Adaptation Decision détermine la variation
      du plan.
    - La gestion porte les demandes confiées aux exécutants et la connaissance de leur prise en charge ; elle ne reprend pas
      leurs opérations internes ni la promesse Supply D03.
    - Cycles et opérations autorisées dépendent du service ; aucun cycle universel ni acceptation en deux temps obligatoire.
    market_status: Piste de nom et de périmètre proposée localement ; aucune équivalence de marché nouvelle affirmée.
  model_mutation: true
  follow_up_U247: Service Order Management et sa définition présentée sont adoptés et appliqués à D07.b ; l’explication initiale
    reste historique et ses détails complémentaires proposés.
