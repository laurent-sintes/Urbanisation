  recorded_on: '2026-09-16'
  author: Laurent
  transcription: Reformulations sourcées des réponses aux points 1 à 5 de U239 ; verbatim dans le registre utilisateur.
  fields:
    catalog_configuration: Le référentiel contient la liste des services et leurs SLA globaux en configuration.
    contextual_execution_capacity: D06 porte une capacité décrivant la capacité opérationnelle de la logistique dans le contexte,
      par exemple le nombre maximal de préparations.
    supply_promise_dependency: D03 calcule la promesse dans le contexte Supply et a besoin de D06 pour ce calcul.
    coordination_boundary: FLOW coordonne les engagements et dépendances entre exécutants ; chaque exécutant conserve ses
      opérations internes.
    service_commitment_distinctions: Distinguer engagement applicable, engagement pris pour la prestation, estimation actualisée
      et résultat constaté ; ces distinctions concernent aussi les services entièrement informatisés.
    logistics_tracking: Le feedback correspond au tracking des opérations logistiques, avec faits et jalons utiles pendant
      la prestation.
    service_access_distinction: L’identité et la description métier du service sont distinctes de ses accès techniques ; la
      sollicitation informatique peut passer par une adaptation de l’exécutant.
