  placement_review_U355: 'Rattachement antérieurement proposé du split/spread à Structuring remis à l’examen : distinguer
    mutation avec filiation et composition durable ; catalogue adopté non modifié.'
structuring_boundary_U355:
  status: needs_joint_arbitration
  current_position:
    capability_id: D04.n
    parent_id: D04
    layer: transactional
    peer_id: D04.o
    adopted_U214: Organiser une demande en ordres, lignes, quantités et échéances liés.
    limit: Ni Order chapeau défini, ni règles d’identité/persistance précisées. Le catalogue actuel ne permet pas de conclure
      que Structuring gère une composition autonome.
  criterion: Existence d’une responsabilité durable sur la cohérence de la composition, au-delà de la trace des mutations.
    Ne pas déduire la capacité de la seule représentation parent-enfants.
  cases:
  - case: Mutation avec filiation
    example: Un besoin de 100 devient deux Orders de 60 et 40 ; l’ancien identifiant sert à expliquer l’origine sans porter
      une demande active supplémentaire.
    proposed_position: Peut relever de Lifecycle élargi ; préciser effets sur états, identités, engagements et absence de
      double comptage. Proposition, pas transfert adopté.
  - case: Décomposition interne en lignes et échéances
    example: Une ligne commerciale regroupe plusieurs livraisons ; le total est maintenu à partir des lignes.
    proposed_position: Forme structurée ne justifiant pas à elle seule une capacité séparée ; frontière avec gestion par type
      à qualifier.
  - case: Composition métier persistante
    example: Une demande d’ensemble demeure active et sa réalisation est suivie au travers d’Orders composants qui peuvent
      être remplacés ou regroupés.
    proposed_position: Justifie potentiellement Structuring séparé si cohérence de l’ensemble, rattachements, évolutions et
      agrégation ont un bénéfice propre ; objet chapeau proposé, pas adopté.
  responsibilities_if_separate:
  - Maintenir la composition et les liens métier actifs.
  - Assurer cohérence des quantités et suivi de satisfaction sans double comptage.
  - Répercuter les changements autorisés de composition en préservant les engagements des composants.
  boundaries:
  - D03 conserve la décision de satisfaction, de priorité et d’échéancier.
  - D06 conserve l’orchestration des prestations ; la composition d’Orders ne prescrit pas les tâches des exécutants.
  - Un chapeau peut être un objet agrégateur ou une demande, pas automatiquement un Order transactionnel supplémentaire.
  - La demande d’ensemble et ses composants ne s’ajoutent pas comme besoins indépendants lorsqu’ils représentent la même demande.
  recommendation: Ne pas garder une capacité séparée pour la seule présence de liens. Examiner l’identité et l’engagement
    persistants du parent ; si aucune composition autonome n’est utile, proposer d’intégrer les mutations à Lifecycle et réexaminer
    D04.n sans renommer/retirer automatiquement.
  open_questions:
  - Le parent porte-t-il un besoin ou engagement encore actif après décomposition, ou seulement une origine historique ?
  - Quels changements et résultats se gèrent au niveau de l’ensemble indépendamment des composants ?
  - Les composants sont-ils des Orders, des lignes/échéances ou des Service Orders d’une autre responsabilité ?
  market_comparisons:
  - vendor: Microsoft
    product: Dynamics 365 SCM
    element_name: Delivery schedules
    element_type: Structure métier ou fonction produit
    relationship: Recouvrement partiel
    similarities: Une ligne commerciale demeure comme en-tête de lignes de livraison ; sa quantité agrège celles des livraisons.
    differences: Hiérarchie de lignes dans une commande, pas preuve d’un nouvel Order chapeau ni d’une capacité autonome.
    source_title: Delivery schedules
    source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/sales-marketing/delivery-schedules
    source_version: '2025-05-07'
    source_locator: Commercial line et delivery lines
    consulted_on: '2026-09-18'
    evidence_limits: Passages primaires indexés consultés ; niveaux et contextes éditeurs conservés.
    flow_position: 'Arbitrage ouvert : mutation d’un besoin avec filiation versus gestion d’une composition durable. Une forme
      parent-enfants seule ne suffit pas à justifier une capacité.'
    status: proposed
    source_refs:
    - U355
    - ELM220
    - CMP129
  - vendor: Oracle
    product: Fusion Cloud Order Management
    element_name: Split Order Lines
    element_type: Structure métier ou fonction produit
    relationship: Recouvrement partiel
    similarities: Une ligne de 50 peut être scindée en 30 et 20 selon l’entrepôt ; le produit conserve la quantité globale
      et adapte les processus associés.
    differences: Division de lignes/fulfillment et réalisation logicielle ; ni deux Orders commerciaux autonomes ni placement
      sous une capacité FLOW démontrés.
