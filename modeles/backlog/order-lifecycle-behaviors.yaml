decomposition_rationale: Le passage d’une intention à un ordre ferme change les engagements et la préparation opérationnelle
  ; la protection contre les réoptimisations stabilise certains résultats tout en limitant les adaptations admissibles. Ces
  effets distincts justifient deux mécanismes combinables, sans créer un comportement pour chaque transition ni une séquence
  obligatoire. La complexité ciblée est de préserver ce qui est engagé sans figer inutilement la manière de satisfaire l’Order.
