  framing: 'Sept mécanismes au total proposés pour la lecture du cycle : deux intégrés et cinq candidats. Ce ne sont ni sept
    états obligatoires ni une séquence universelle. Les mécanismes peuvent concerner une ligne ou une quantité selon le type.'
  boundaries:
  - Création et changements de contenu restent dans la gestion par type d’Order.
  - Split, merge et spread restent sous Order Structuring.
  - Confirmation/révision de la promesse restent sous Promise Management.
  - Tracking, orchestration et adaptation de l’exécution restent sous D06 ; compensation du processus relève de Case Management.
  - Calcul du nouvel échéancier distinct de l’application de l’échéance du besoin.
  adoption_limit: U351 demande de compléter l’analyse ; n’adopte pas les cinq candidats. Aucun nouveau nœud actif ajouté.
  rationale: Une action produit peut réaliser un mécanisme métier. La justification repose sur l’effet distinct et la complexité
    des engagements, portées partielles, conditions et effets aval ; pas sur le nombre de boutons.
crud_and_archiving_U352:
  status: proposed
  finding: Les capacités D04.i–m décrivent déjà enregistrement, modification et consultation. La suppression admissible et
    l’archivage sont insuffisamment explicités.
  crud_responsibilities:
  - operation: Create
    meaning: Enregistrer la commande, ses lignes, son origine et son identité, par saisie ou réception ; prévenir les doublons.
    proposed_owner: Gestion par type D04.i–m
  - operation: Read
    meaning: Rechercher et consulter le contenu, les liens, les états et les versions accessibles.
    proposed_owner: Gestion par type D04.i–m ; historique conservé via archivage
  - operation: Update
    meaning: Maintenir le contenu autorisé et son historique, en respectant le gel, les états et les conséquences métier.
    proposed_owner: Gestion par type D04.i–m ; transitions Lifecycle, structure Structuring et promesse D03 restent distinctes
  - operation: Delete
    meaning: Retirer les enregistrements dont la suppression est admissible selon leur état et leurs liens, notamment les
      brouillons ; ne pas effacer des réalisations passées.
    proposed_owner: Gestion par type D04.i–m ; conditions gouvernées par Lifecycle
  boundary: CRUD est une grille de complétude utile ; ne pas en faire automatiquement quatre comportements identiques copiés
    sous chaque type. Cette proposition ne retire aucune responsabilité du modèle.
  archiving_proposal:
    id: OL-ARCHIVE
    name: Order Archiving
    parent_id: D04.o
    status: integrated_as_capability_D04.q_U363
    definition: Organiser la conservation historique des Orders éligibles en dehors de leur usage opérationnel courant, tout
      en préservant leur consultation, leurs versions utiles et leurs liens.
    decomposition_rationale: Permettre la recherche et l’explication d’anciens engagements sans maintenir indéfiniment les
      commandes dans le traitement courant ; maîtriser ce qui reste consultable.
    example: 'Exemple fictif : retrouver une commande d’implantation d’une saison antérieure, ses changements et ses réalisations
      sans la réintroduire dans les commandes à satisfaire.'
    boundary: Clôture et archivage sont distincts. Historisation des versions, restauration et réouverture ne sont pas synonymes.
      Purge définitive soumise à ses règles de conservation et d’éligibilité ; aucun nouveau comportement Purge ni règle juridique
      ajouté automatiquement.
    market_comparisons:
    - vendor: Microsoft
      product: Dynamics 365 SCM
      element_name: Archive Dynamics 365 Supply Chain Management Sales orders data
