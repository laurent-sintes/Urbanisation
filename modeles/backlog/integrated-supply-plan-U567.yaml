case:
  nature: Illustration FLOW, sans réalisation installée déduite
  inputs:
  - '600 ventes attendues dont 300 déjà commandées : prévision restante 300.'
  - 500 pièces attendues ; un impondérable retarde 100 pièces au-delà de l’échéance.
  - 50 pièces de stock final souhaité, supposées ici distinctes de la demande de vente ; politique de protection à respecter.
  arithmetic: 'Si les 600 ventes doivent être servies avant cette échéance et 50 pièces conservées, 400 pièces arrivent à
    temps : l’écart à examiner est 250. Un achat de 250 n’est pas automatiquement faisable ou retenu.'
  scenarios:
  - Obtenir 250 pièces supplémentaires à temps si délais, capacités, coûts et engagements le permettent.
  - Combiner achat, transfert et modification autorisée des échéances, en appréciant les effets sur toutes les demandes et
    les sites.
  - Proposer une révision autorisée de certaines cibles de stock ou protections ; ne pas modifier silencieusement leur configuration.
  coverage:
  - id: D17.a
    role: Demand Planning qualifie la demande et sa part restant prévisionnelle.
  - id: D03.j
    role: CTP explore la faisabilité des apports et adaptations utiles à la satisfaction des Orders.
  - ids:
    - D05.a
    - D05.d
    - D05.e
    - D05.c
    role: Les décisions de cible, protection, réassort et redistribution apportent leurs résultats spécialisés.
  - id: D03.o
    role: La responsabilité de cohérence du scénario existe ; son périmètre actuel d’affectation est à élargir pour un plan
      intégrant les apports et ajustements.
  - ids:
    - D03.p
    - D05.f
    role: Leurs vues de carnet et de stock doivent concourir au même plan Supply retenu ; deux optimisations finales indépendantes
      sont à éviter.
  - ids:
    - D02.e
    - BHV094
    - D04.j
    - D04.k
    role: Application des affectations et suites du plan avec prise en charge des achats et transferts ; engagements et exécution
      distincts.
architecture_impacts:
- target: D03.p / D05.f
  proposal: Représenter les angles carnet et stock comme contributions ou vues d’un même Planning intégré ; préserver les
    responsabilités utiles sans deux plans finaux concurrents.
  status: structure_to_design
- target: D03.o
  proposal: Examiner l’élargissement du scénario collectif aux nouveaux apports, transferts et effets de stock ; les décisions
    spécialisées conservent leurs résultats.
  status: scope_to_design
- target: D17 / D17.a
  proposal: Demand Planning reste producteur de la demande attendue ; le propriétaire du plan Supply commun et son placement
    dans Supply Planning sont à expliciter.
  status: placement_to_design
- target: U555 / D17.b retired
  proposal: Le non-doublement du plan amont demeure pertinent. Le fait qu’un outil produit des Planned Orders ne suffit pas
    à exclure du modèle la responsabilité métier de planification ; ne pas restaurer l’identifiant retiré.
  status: boundary_reexamination
- target: D02.b / D05.a / D05.d
  proposal: Consommer les politiques en vigueur et distinguer les variantes de politique proposées de leur autorisation et
    mise en vigueur.
  status: preserve_separation
preserved:
