user_direction:
  source_ref: U567
  statement: Si le mécanisme intégré est validé, le plan de supply doit être unique.
  assessment: Condition de faisabilité fonctionnelle étayée pour Microsoft Master Planning. L’hypothèse technique ARun doit
    être corrigée.
  retained_principle: Un plan Supply de référence cohérent pour le périmètre et l’horizon arbitrés, couvrant satisfaction
    des demandes, affectations et propositions d’ajustement des ressources.
  interpretation_limits:
  - Le périmètre et l’horizon communs rendent la cohérence vérifiable ; ils ne fragmentent pas implicitement les ressources
    partagées.
  - Plusieurs scénarios et révisions restent possibles ; un seul résultat retenu sert de référence.
  - Aucun accord global sur des champs du modèle, une fusion de capacités, un nom ou un parent non présenté.
