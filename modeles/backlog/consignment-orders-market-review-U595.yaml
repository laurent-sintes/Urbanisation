business_regimes:
- case: Notre stock chez le client B2B
  ownership: Nous restons propriétaires jusqu’au fait contractuel applicable.
  purpose: Alimenter le stock consigné, reprendre les invendus, constater consommation/vente ou retour après consommation.
  market_examples:
  - Consignment Fill-Up
  - Consignment Pick-Up
  - Consignment Issue
  - Consignment Return
  source_refs:
  - ELM611
  - ELM615
  recommendation: Conserver ces intentions et effets distincts ; la nomenclature documentaire SAP ne suffit pas à créer quatre
    capacités.
- case: Stock fournisseur chez nous destiné à une acquisition/consommation
  ownership: Fournisseur propriétaire puis éventuel transfert selon accord.
  purpose: Demander l’apport, suivre la réception, puis distinguer acquisition et retour.
  existing_anchor: D04.r Consignment Replenishment Order
  source_refs:
  - ELM406
  - ELM612
  recommendation: Conserver le périmètre actuel ; ne pas renommer toute entrée de stock tiers en achat.
- case: Stock du client donneur d’ordre chez nous
  ownership: Le client reste propriétaire ; lieu de détention et propriété sont deux dimensions.
  purpose: Détenir les biens du client avec mandat de les vendre ; suivre alimentation, vente, reprise des invendus et suites
    de retour.
  user_sources:
  - U595
  - U596
  - U602
  qualification: Mandat de vente confirmé U602. Une acquisition intermédiaire par nous et les modalités exactes de propriété
    ou de facturation ne sont pas établies.
  recommendation: Inclure Issue dans le cycle étudié. Relier la demande de vente, les effets sur le stock consigné et l’exécution
    logistique sans dupliquer la demande commerciale.
afs_fashion_comparison:
- axis: Mobiliser le stock en consignation fournisseur pour satisfaire des demandes
  afs: AFS 6.5 l’intègre déjà à ATP, ARun et livraisons sortantes.
  fashion: Fashion documente aussi son utilisation par ARun et les affectations aux ventes/transferts.
  finding: Continuité du principe ; ce n’est pas une invention de Fashion.
  source_refs:
  - ELM614
  - ELM616
  - ELM617
- axis: Dimensions du stock et réseau
  afs: Le contrat AFS consulté porte catégories de stock et stock consigné client ; le détail complet des déplacements et
    saisons n’est pas établi par ce corpus.
  fashion: Saisons, segmentation, ARun et circulation multisite avec maintien de consignation sont documentés.
  finding: Fashion expose un traitement Retail/Fashion enrichi ; aucune absence de ces fonctions dans AFS n’est déduite du
    silence des sources.
  source_refs:
  - ELM619
  - ELM616
  - ELM617
- axis: Affectation de la consignation chez le client
  afs: L’interface documente le stock consigné client ; les quatre parcours et leur éligibilité complète à ARun restent non
    établis dans les sources AFS consultées.
  fashion: FMS 1.0 SP13 décrit ARun pour fill-up, issue et pick-up selon article/règles ; return ne requiert pas ARun.
  s4hana: La page aATP 2025 FPS01 réserve Supply Assignment au fill-up KB, en excluant KE, KA et KR.
  finding: Écart fonctionnel documenté FMS / S/4HANA, à conserver avec ses versions. Pas de règle de migration universelle
    ni de comportement AFS extrapolé.
  source_refs:
  - ELM615
  - ELM618
  - ELM619
flow_options:
- option: Transfer Order pour toute entrée/sortie de stock tiers
  assessment: Non recommandé
  benefit: Un mécanisme de déplacement commun.
  tradeoff: Masque les obligations de garde/restitution, la nature de la demande et les différences avec acquisition ou vente.
- option: Une capacité par type de document SAP
  assessment: Non recommandé sans examen de maille
  benefit: Lecture produit directe.
  tradeoff: Importe une taxonomie logicielle ; multiplie les capacités sans démontrer de responsabilité durable distincte.
- option: Demandes qualifiées par résultat métier, régime du stock et exécution séparés
  assessment: Recommandé, décision de maille encore à prendre
  benefit: Préserve promesse et cycle de vie de la demande ; le régime de propriété reste Inventory, les prestations restent
    Fulfillment.
  tradeoff: Expliciter la filiation entre demande métier et réalisations, ainsi que les variantes qui justifient un type ou
    un comportement.
recommended_decision:
  transfer: Conserver Transfer Order pour une demande de déplacement entre sites du réseau ; le stock peut appartenir à un
    tiers si les droits/accords le permettent. La frontière ne se réduit ni au propriétaire du bâtiment ni au propriétaire
    des biens.
  consignment: Décrire séparément les intentions de mise en consignation, reprise, consommation et retour après consommation
    ; examiner leur maille sans transformer chaque document SAP en capacité.
  client_owned: 'U602 confirme le mandat de vente : inclure Issue dans le périmètre étudié avec Fill-up, Pick-up et les suites
    Return. Ne pas présumer un achat préalable de notre part.'
  existing: D04.r et D01.h ont aujourd’hui un périmètre fournisseur propriétaire/distributeur détenteur. Leur élargissement
    au stock du client donneur d’ordre serait un changement de périmètre à décider, pas un simple renommage.
  needs_business_decision:
  - Le mandat de vente est établi U602 ; préciser le fait générateur d’Issue et ses effets de propriété, ainsi que son articulation
    avec Sales Order.
  - Faut-il un type de demande de consignation client et des comportements, ou des types distincts selon obligations et cycles
    de vie ?
  issue_granularity_U606: 'Résolu U607 : Consignment Issue, comportement BHV096 de Sales Order D04.i. Description détaillée
    encore proposée.'
limitations:
- Comparaison de documentation produit, pas audit des versions et paramétrages Beaumanoir.
- Deux sens de consignation couverts ; la prestation sur stock client n’est pas transformée implicitement en achat fournisseur.
- AFS, FMS et S/4HANA distingués ; ne pas qualifier Fashion sans édition.
- Noms et responsabilités proposés restent à décider ; aucun Domain Commerce créé.
