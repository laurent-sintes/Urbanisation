        concept_name: Return disposition
        scope_summary: Sort du produit retourné et compensation.
        approach_summary: Associer un résultat de traitement au retour.
      nature: action
      decomposition_rationale: Les parcours diffèrent par le devenir attendu, les responsabilités sollicitées, les immobilisations
        et les preuves nécessaires pour considérer le retour traité. Cette complexité justifie des comportements métier ;
        les étapes de saisie, inspection, validation et clôture ne constituent pas chacune un comportement.
      market_inspiration:
        choice: 'Prendre en charge ce que devient un produit retourné par un client. Customer Return relie le retour aux suites
          retenues : stock, remise en état, fournisseur, restitution ou rebut.'
        flow_scope: Retour client et résultat logistique attendu après examen.
        flow_approach: Conserver le retour, la décision et la suite attendue ; rapprocher les réalisations sans effacer la
          vente.
        synthesis:
        - SAP présente un parcours lié de retour et de suivi ; Microsoft détaille les choix de disposition et leurs effets.
          Tous deux évitent de réduire le retour à une simple quantité négative.
        - FLOW retient une demande de retour distincte de la vente et explicite le résultat attendu pour chaque quantité.
          Un remboursement et une remise en stock ne désignent pas le même résultat.
        examples:
        - title: Illustration FLOW — Deux états dans un même retour
          situation: Sur deux articles rendus, l’un est revendable et l’autre doit être expertisé.
          outcome: Les deux quantités suivent des suites différentes.
          lesson: Le retour reste traçable même si son traitement est réparti.
