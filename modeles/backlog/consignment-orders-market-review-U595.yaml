  - Microsoft conserve les retours après vente sous Return Order/RMA, avec variantes et suites ; IFS utilise une RMA de consignation
    même avant consommation dans le cas de défaut ELM622. La frontière lexicale SAP n’est pas universelle.
  assessment: Intention commune de retour après vente cohérente avec le regroupement proposé ; nomenclature exacte non établie
    comme consensus marché.
  recommended_scope: Si Goods Return est retenu ici, expliciter les demandes de retour liées à une vente antérieure et les
    effets du régime applicable. Supplier Return reste distinct à ce stade ; ne pas faire du nom un retour universel.
  behavior_reading: Customer Return doit être défini comme parcours général de retour après vente ; Consignment Return précise
    la variante avec rétablissement du régime consigné selon accord. Ne pas traiter les deux comme des populations nécessairement
    disjointes.
