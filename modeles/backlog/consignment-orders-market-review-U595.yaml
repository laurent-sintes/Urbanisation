user_clarifications:
  demand: Transfer Order et les retours sont des demandes ; elles portent besoins/exigences et pilotent la promesse, qu’elles
    viennent du commerce ou du plan.
  scope: Couvrir nos biens chez un client et les biens de notre client chez nous ; le second cas est l’exemple prioritaire.
  study: Éviter l’Order à tout faire et comparer AFS / Fashion avant décision de découpage.
  qualified_name_U601: Fill-up qualifie la mise en consignation ; corrige Pick-up écrit en U600. Comparaison requise avant
    validation.
  sales_mandate_U602: Dans le cas U596, le stock client détenu chez nous est accompagné d’un mandat pour vendre ; Issue est
    important.
