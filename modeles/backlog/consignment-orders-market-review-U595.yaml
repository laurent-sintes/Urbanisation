    distinct: Consignment Pick-up
  findings:
  - SAP FMS et S/4 distinguent Return après Issue et Pick-up de biens restés consignés. Return peut rétablir stock consigné
    et propriété sans renvoi au dépôt du propriétaire.
  - 'Customer Return et Consignment Return ne forment pas deux catégories exclusives par nature : le retour de consignation
    SAP vient aussi d’un client.'
  - Goods Return est attesté chez SAP Business One dans le sens retour fournisseur ; le nom ne porte pas une frontière client
