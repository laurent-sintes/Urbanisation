return_order_U612:
  status: name_selected_existing_behaviors_retained
  source_refs:
  - U612
  - CMP264
  - ELM632
  capability_id: D04.l
  name: Return Order
  preserved_behaviors:
  - BHV050
  - BHV051
  - BHV052
  - BHV053
  - BHV054
  intent: Prendre en charge la demande de retour et suivre ses suites selon les décisions et accords applicables.
  contract: Réparation et autres suites possibles en consignation selon mandat ; pas de nouvelle règle de gestion ni comportement
    par contrat.
  market: Préférence FLOW pour l’approche Microsoft ; ne démontre pas une supériorité universelle ni une restriction du mot
    Customer au B2C.
  prior_node:
    id: D04.l
    revision: 8
    kind: capability
    fields:
      name: Customer Return
      definition: Prendre en charge les retours clients, leurs commandes et leurs suites logistiques, jusqu’au résultat attendu
        selon les décisions et autorisations applicables.
      finality: Connaître le retour client attendu, suivre ses suites logistiques et expliquer le résultat obtenu pour chaque
        produit ou quantité.
      scope: |-
        La capacité couvre les commandes de retour et leurs suites logistiques selon les décisions et autorisations applicables. Le libellé Customer Return désigne une capacité d’action ; [Customer Return Order](glossary:TER072) reste l’objet métier associé.

        Enregistrer origine, motif et références utiles. Rapprocher quantités attendues et reçues ; exploiter constats et écarts. Conserver liens entre retour et suites, avancement et résultats. Mobiliser Lifecycle, Structuring et Archiving pour leurs responsabilités communes.

        Les cinq comportements adoptés U385 sont des parcours métier combinables : Return to Stock, Repair and Refurbishment, Return to Supplier, Return to Customer et Scrapping. Une réparation peut précéder remise en stock ou restitution au client. Les différents produits ou quantités d’un même retour peuvent suivre des parcours différents, sans créer un quatrième niveau.

        [Return Disposition Decision](model:D05.i) choisit le devenir. Customer Return prépare et suit sa prise en charge via les capacités responsables : [Supplier Return](model:D04.m) porte l’Order fournisseur, [Process Management](model:D06) coordonne les prestations et en trace les résultats, [Inventory Management](model:D01) enregistre mouvements et états. La réception physique et la réparation restent chez les exécutants. Décider, solliciter une prestation et constater sa réalisation ne se confondent pas ; reçu, accepté et disponible sont des situations distinctes.

        [Order Lifecycle Management](model:D04.o) gouverne les mutations, [Order Structuring](model:D04.n) les compositions et [Order Archiving](model:D04.q) la conservation historique. Ces fonctions communes ne sont pas recopiées sous chaque comportement. L’Order de retour n’efface pas la vente d’origine.

        Exemple fictif : sur dix pièces attendues, six sont reçues et quatre restent attendues. Parmi les six reçues, certaines peuvent être remises en stock et d’autres nécessiter une réparation. Conserver origine, motif, quantités, décisions applicables et preuves de résultat ; aucune réception ou remise en disponibilité ne se déduit du seul état de la commande.

        L’autorisation commerciale du retour, le remboursement et le remplacement client restent à délimiter. Restituer le bien n’est pas envoyer un autre produit ; un règlement sans retour physique ne crée aucune réception fictive. Donation, recyclage et revente secondaire ne sont pas assimilés au rebut. Les règles détaillées, le porteur des décisions commerciales et ces autres axes restent à instruire. Aucun déploiement Beaumanoir présumé.
