behavior_review_U382:
  status: proposed
  source_refs:
  - U381
  - U382
  - ELM229
  - ELM230
  - CMP141
  user_direction: 'Gestion des retours : prises en charge du produit ; Return Disposition Decision : stratégies qui orientent
    le choix.'
  structural_issue: D04.l est déjà un comportement d’Order Type limité aux commandes de retour. Ne pas lui ajouter des sous-comportements.
    Le porteur de la gestion complète du retour et ses liens à D01/D04/D06 restent à instruire.
  proposed_decomposition_rationale: Distinguer les cas dont la disposition est déterminée par une politique connue des cas
    nécessitant un arbitrage contextuel entre plusieurs devenirs autorisés ; rendre visibles la standardisation des prises
    en charge et la récupération de valeur, sans imposer une technologie de décision.
  candidates:
  - name: Policy-based Disposition
    status: proposed
    definition: Déterminer le devenir du produit par application d’une politique de disposition à son état constaté, sa catégorie
      et ses conditions de retour.
    benefit: Rendre les orientations cohérentes et reproductibles lorsque les cas sont connus.
    example: 'Exemple fictif : article intact et complet orienté vers remise en stock ; défaut relevant d’un accord fournisseur
      orienté vers renvoi selon cet accord.'
    boundary: Appliquer une politique au cas ; ni administrer la politique ni inspecter ou réparer le bien. Une règle par
      défaut ne crée pas un comportement par code.
  - name: Value Recovery Optimization
    status: proposed
    definition: Choisir entre plusieurs devenirs autorisés en comparant la valeur récupérable, les coûts, délais, risques
      et objectifs applicables dans le contexte.
    benefit: Éviter une orientation systématique qui dégrade la valeur récupérée lorsque le contexte change.
    example: 'Exemple fictif textile : comparer remise en état puis revente, seconde main et renvoi fournisseur, selon coût,
      délai et potentiel de revente avant la fin de saison.'
    boundary: Les objectifs peuvent être multidimensionnels ; aucun poids imposé. La décision ne réalise pas le traitement,
      ne calcule pas seule tous les transferts du réseau et n’absorbe pas remboursement ou autorisation commerciale.
  combination: 'Les stratégies peuvent se combiner : une politique borne les choix, une optimisation les départage. Pas une
    séquence obligatoire ni une opposition règles/IA.'
  not_separate_at_this_stage:
  - 'Remise en stock, réparation et renvoi : prises en charge, pas stratégies autonomes de décision.'
  - 'Circularité et rapidité : objectifs ou politiques possibles ; un comportement autonome nécessite un mécanisme distinct
    démontré.'
  - 'Choix du site : dimension contextuelle documentée, à articuler avec Stock Redistribution Decision et les décisions D06
    plutôt que les dupliquer.'
  - 'Mode humain, règle, IA ou batch : choix de réalisation, pas stratégie métier par lui-même.'
  naming_limit: Libellés de travail FLOW ; les sources documentent les mécanismes mais ne démontrent pas un catalogue commun
    de comportements portant ces deux noms.
  market_comparisons:
  - vendor: Microsoft
    source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/sales-marketing/specify-how-to-dispose-of-returned-items
    source_version: Mise à jour affichée 2025-05-07
    consulted_on: '2026-09-18'
    source_locator: Disposition type, common code et disposition action
    similarities: Les codes de disposition représentent différentes suites du retour, dont réparation, renvoi fournisseur
      et revente.
    differences: La documentation de configuration ne prouve pas un moteur de sélection automatique par état. Les actions
      mêlent effets physiques et financiers.
    flow_position: Appui au vocabulaire et à la prise en charge ; le mécanisme Policy-based Disposition reste une interprétation
      FLOW.
    status: proposed
  - vendor: Blue Yonder
    source_url: https://blueyonder.com/solutions/returns-management/smart-disposition
    source_version: Page produit évolutive, sans édition affichée
    consulted_on: '2026-09-18'
    source_locator: Intelligent routing ; Customizable reason codes and rules ; Key Benefits
    similarities: Choix de canal et destination selon règles et contexte, récupération de valeur et coûts.
    differences: Produit plus large incluant admission et remboursement ; page commerciale sans détail algorithmique ni preuve
      de déploiement Beaumanoir.
    flow_position: Appui aux deux mécanismes proposés ; conserver uniquement le choix du devenir logistique dans D05.i.
    status: proposed
  - vendor: Manhattan
    source_url: https://www.manh.com/solutions/omnichannel-software-solutions/order-management-system/returns-management
    source_version: Page produit évolutive, sans édition affichée
    consulted_on: '2026-09-18'
    source_locator: Returns Done Right ; Maximize Returns Profitability
    similarities: Détermination dynamique du lieu de retour pour accélérer la remise en vente.
    differences: Ne démontre pas à elle seule la sélection de toutes les filières de réparation ou de disposition.
    flow_position: Le contexte réseau nourrit la stratégie ; frontière à maintenir avec redistribution et exécution.
    status: proposed
