target_id: D05.f
proposed_name: Inventory Optimization Planning
proposed_definition: Construire, comparer, actualiser et appliquer des plans d’ajustement des stocks pour concilier disponibilité,
  capital immobilisé, coûts et risques, en mobilisant les décisions spécialisées.
user_intention: Ni vider ni remplir le stock comme objectif systématique ; rechercher le stock adapté au besoin et à ses contraintes.
interpretation: Le volume total peut augmenter, diminuer ou rester identique. Le plan peut combiner des apports à certains
  lieux, une réduction ou un report ailleurs, et une redistribution du stock existant. Aucun optimum garanti ni pondération
  universelle.
coherence_condition: La capacité produit un arbitrage cohérent entre plusieurs ajustements pour un résultat d’optimisation
  commun ; un simple regroupement de tâches indépendantes de réassort et de transfert resterait trop agrégé malgré le nouveau
  nom.
boundaries:
  decisions: Inventory Target Decision détermine les cibles ; Replenishment Decision, Initial Stocking Decision et Stock Redistribution
    Decision déterminent leurs résultats spécialisés. Planning les mobilise sans dupliquer leurs calculs.
  configuration: Supply Protection reste extérieure et gouverne la configuration consommée, même si un plan propose une évolution.
  application: Application portée comme comportement du Planning ; gestion des Orders, engagements et coordination restent
    des responsabilités partenaires.
  area: Inventory Optimization demeure l’Area ; la capacité nomme le travail sur le plan, pas la totalité des décisions et
    responsabilités de cette Area. Aucun nouveau parent adopté.
  other_plans: Order Backlog Planning optimise la satisfaction d’un carnet d’Orders. La capacité de couverture D17.b reste
    à préciser pour éviter une double autorité sur les apports.
example: 'Exemple fictif : un magasin manque de tailles et un autre a un excédent. Comparer transfert, apport nouveau ou combinaison
  des deux, puis appliquer le résultat retenu en tenant compte des coûts, des délais et des besoins des deux lieux. Le plan
  ne prescrit pas d’augmenter ou réduire systématiquement le stock total.'
comparison_with_U543:
  split_by_intention: Pertinent si réassort, implantation et rééquilibrage portent des plans et pilotages réellement autonomes.
  unified_optimization_plan: Pertinent s’ils constituent des ajustements arbitrés ensemble pour le stock recherché.
  recommendation: Privilégier l’option U544 si l’on veut conserver cette responsabilité d’arbitrage global ; ne pas créer
    automatiquement un Planning pour chaque levier ni renommer sans expliciter ce résultat.
