approved_rule: La possibilité de modifier une commande s’évalue sur la partie concernée, selon son état réel, ses engagements
  et ses dépendances. Le Planning propose les changements ; Apply Plan les fait prendre en compte auprès des responsables.
  Fulfillment traite les conséquences sur les prestations déjà engagées.
