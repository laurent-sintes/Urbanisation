focused_return_comparison:
  capability_id: D05.i
  relationship: Recouvrement partiel
  sources:
  - element_ref: ELM438
    title: Specify how to dispose of returned items
    url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/sales-marketing/specify-how-to-dispose-of-returned-items
    version: Documentation évolutive, mise à jour affichée 2025-05-07
    consulted_on: '2026-09-23'
    locator: Disposition codes and actions
    finding: Le devenir du bien retourné est distingué de son motif ; les actions produit peuvent également porter des effets
      financiers.
  - element_ref: ELM328
    title: Smart Disposition
    url: https://blueyonder.com/solutions/returns-management/smart-disposition
    version: Page solution sans édition affichée
    consulted_on: '2026-09-23'
    locator: Overview; Intelligent routing; Configure and enforce policy
    finding: L’état, la destination et la valeur de revente contribuent au choix du devenir du retour.
  similarities: Décider du traitement et de l’orientation du bien selon les faits et les règles.
  differences: Les offres incluent des effets financiers ou commerciaux que FLOW garde distincts ; elles ne prouvent pas le
    propriétaire Fulfilment plutôt que Matching.
  recommendation: Proposer Fulfilment pour le choix du traitement du retour ; conserver le recours à Matching pour les effets
    sur les ressources partagées.
  benefit: Éviter de faire de Matching le propriétaire de toute décision comportant un critère économique.
  tradeoff: Expliciter la transmission des effets de disponibilité au Matching et à Availability.
  status: proposed_not_adopted
proposed_gaps:
- proposal_key: plans-ingestion
  name: Plan Ingestion
  subdomain: Plans
  definition: Recevoir et intégrer les Supply et Demand Plans fournis par l’APS externe, avec leur origine, horizon, version
    et statut. Supply Plan désigne les prévisions d’entrées ou de sorties de stock hors achats.
  boundary: Distinguer remplacement d’une projection et modification d’un Order déjà pris en charge ; conserver les liens
    utiles au rapprochement prévision-commandes, sans calculer la prévision ni effacer un engagement.
  example: 'Une prévision d’entrée de stock hors achat passe de 100 à 80 pièces : conserver sa révision sans la transformer
    en réception constatée.'
  market_refs:
  - ELM415
  - ELM649
  status: responsibility_agreed_U669_name_and_detailed_definition_proposed
  naming: Libellé descriptif proposé ; pas de consensus de marché revendiqué.
  source_refs:
  - U669
- proposal_key: plans-visibility
  name: Plan Visibility
  subdomain: Plans
  definition: Rendre consultables les projections de demande et de mouvements de stock hors achats, leurs versions, dates,
    conditions et fraîcheur pour éclairer la promesse et le Matching.
  boundary: Ne construit ni prévisions ni master plan de matching. Une projection consultable ne devient pas un approvisionnement
    ferme. La consommation de prévision par les Orders doit être portée par le calcul de couverture du Matching en s’appuyant
    sur ces liens.
  example: Présenter une sortie de stock hors achat prévue à J+3 avec son origine et son incertitude, distincte d’un mouvement
    réalisé.
  market_refs:
  - ELM352
  - ELM649
  status: proposed_new_capability_no_canonical_id
  naming: Libellé descriptif proposé ; pas de consensus de marché revendiqué.
