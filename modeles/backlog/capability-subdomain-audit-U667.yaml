migration_conditions:
- Matérialiser les nouveaux sous-domaines et parents seulement après examen de cette proposition ; ne pas recycler les identifiants
  retirés.
- Conserver identités, comportements et provenance des capacités ; le déplacement d’une fiche n’adopte pas ses champs proposés.
- Borner les trois décisions de stock face à l’APS et examiner le rattachement du devenir des retours.
- Réviser les renvois Demand/Order, plan APS/plan Matching/plan d’exécution et l’autorité locale Master Data.
- Capturer les accords sur les valeurs finales exactement présentées ; une publication reste une opération distincte.
scoped_agreement_U669:
  responsibility: Ingérer les Supply et Demand Plans dans Plans.
  external_source: L’APS est uniquement mentionné comme source externe dans les descriptions ; aucun sous-domaine APS.
  not_adopted:
  - Libellé exact Plan Ingestion
  - Définition détaillée de la nouvelle capacité
  - Plan Visibility
  - Autres placements proposés
  capture: Accord de responsabilité dans cette annexe ; aucune capacité canonique créée par cet audit.
availability_discussion_U670:
  status: recommendation_not_adopted
  baseline: Le YAML actuel conserve D03.i ATP, D03.j CTP, D03.k PTP ; cet état ne prouve pas leur réadoption dans le nouveau
    découpage.
  recommendation: Order Promising évalue les réponses faisables et recommande une promesse à Order Management comme au Matching.
    Pas de passage obligatoire par un recalcul du master plan pour chaque demande.
  concepts:
  - name: ATP
    meaning: Quantités et dates promettables à partir des ressources présentes et futures admissibles, compte tenu des engagements
      et contraintes.
    position: Rôle clair dans Order Promising.
  - name: CTP
    meaning: Faisabilité de mobiliser une ressource supplémentaire ou une capacité pour satisfaire le besoin.
    position: Évaluer la possibilité dans Availability ; ne pas y transférer les décisions de réaffectation entre commandes,
      de modification de politiques ou de réalisation.
    current_gap: D03.j étend actuellement CTP à toute adaptation des ressources ou engagements ; ce périmètre dépasse le sens
      démontré par Oracle. Une source alternative existante peut relever de l’ATP avancé SAP.
  - name: PTP
    meaning: Comparaison économique des réponses faisables.
    position: Dimension de sélection pouvant se combiner avec ATP/CTP ; pas un troisième état de disponibilité ni une optimisation
      générale du master plan.
  capability_granularity: Conserver les notions pour expliquer les responsabilités ; réexaminer la maille des capacités avant
    d’entériner trois feuilles parallèles. Aucun renommage, fusion ou retrait exécuté.
  relationships:
  - from: Order Promising
    to: Order Management
    information: Réponse recommandée en quantités, dates et conditions pour l’Order.
    effect: L’Order porte la confirmation ou la révision de l’engagement ; une consultation seule ne constitue pas une réservation.
  - from: Order Promising
    to: Demand & Supply Matching
    information: Possibilités de couverture, alternatives, coûts, délais et conditions.
    effect: Matching utilise ces résultats pour construire et arbitrer son master plan.
  - from: Demand & Supply Matching
    to: Order Promising
    information: Affectations et contraintes applicables issues du master plan.
    effect: Une réponse rapide respecte les arbitrages existants sans devoir tous les recalculer.
  - from: Order Management
    to: Demand & Supply Matching
    information: Commandes et engagements nouveaux ou révisés.
    effect: Le master plan tient compte des engagements constitués ; il ne les ignore pas en attendant une optimisation ultérieure.
  b2c:
    target: Moins de 200 ms envisagés par Laurent pour une réponse de promettabilité, non mesurés ni garantis.
    fast_response: 'Proposition : examiner les données déjà disponibles et les contraintes applicables, choisir une réponse
      sans nouvel arbitrage collectif si le cas le permet.'
    contention: Si la réponse exige de reprendre une ressource affectée à une autre demande, solliciter Matching ; ne pas
      annoncer une promesse inconditionnelle avant arbitrage.
    commitment: Distinguer consultation et confirmation ; traiter la concurrence au moment de sécuriser l’engagement. Reservation
      reste dans Inventory Management selon U436. Aucun mécanisme technique imposé.
    performance_scope: Objectif de réalisation à tester sous charge ; ne définit pas une nouvelle capacité et n’exige pas
      que toute recherche CTP complexe tienne dans le même délai.
    example: 'Exemple fictif : une pièce promettable et deux achats simultanés. Deux lectures favorables ne donnent pas deux
      droits exclusifs sur la même pièce.'
  market:
    source_refs:
    - ELM352
    - ELM653
    - ELM411
    - ELM655
    common_points: Oracle relie directement Order Management et Promising ; SAP vérifie la disponibilité pendant la création
      de commande ; Microsoft distingue contrôle et réservation.
    differences: Les modules éditeurs recouvrent plusieurs responsabilités FLOW ; PTP est une option combinable, les alternatives
      ne relèvent pas toutes de CTP.
    benefit: Servir la promesse interactive sans imposer une réoptimisation collective à chaque requête.
    tradeoff: Les réponses doivent respecter les affectations et engagements concurrents ; latence et cohérence doivent être
      vérifiées ensemble.
    performance_evidence: IBM décrit une réponse sub-seconde dans un passage primaire indexé ; cela ne prouve pas un délai
      de 200 ms pour FLOW.
  subsequent_agreement_U672: Nom Order Promising, responsabilité et usages présentés en U671 adoptés ; analyse ATP/CTP/PTP
    et détails techniques non adoptés par extension.
