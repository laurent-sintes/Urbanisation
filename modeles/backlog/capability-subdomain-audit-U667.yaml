findings:
- 'U672 : Order Promising adopté ; calcule et recommande une réponse de promesse, utilisable par Order Management avant engagement
  et par Matching. Matching arbitre les affectations ; Order Management porte les engagements.'
- 'U668 : Supply Plan porte les prévisions d’entrées ou de sorties de stock hors achats. Le master plan de matching porte
  les affectations et reste entièrement géré dans Matching. Aucun lien d’identité entre les deux objets ; les achats projetés
  APS évoqués en U656 ne sont pas reclassés en Supply Plan.'
- 57 capacités existantes ont un rattachement proposé dans les huit sous-domaines ; Demand Planning est hors périmètre, sans
  parent cible. Aucun sous-domaine externe ni retrait exécuté.
- 'Plans : responsabilité d’ingestion des Supply et Demand Plans confirmée U669 ; visibilité proposée séparément, non adoptée.
  Total cible envisagé : 59 capacités internes si toutes les propositions sont retenues.'
- Les sept référentiels et leurs quatorze capacités restent distincts sous Master Data. Corriger les formulations de simple
  copie passive incompatibles avec U479, sans reprendre la maîtrise d’entreprise.
- Les décisions Inventory Target, Initial Stocking et Replenishment sont conservées provisoirement dans Matching pour l’arbitrage
  opérationnel. Leur périmètre doit être borné face aux calculs APS externes ; l’accord sur les sous-domaines ne tranche pas
  ce détail.
- 'Return Disposition Decision est proposé dans Fulfilment : choisir le traitement du bien retourné ne constitue pas par nature
  un arbitrage de couverture. Une conséquence collective mobilise Matching. Ce déplacement reste à discuter.'
- Reservation Policy Decision et Group Protection Decision restent dans Matching pour leur résultat calculé ; Policies porte
  les règles actives. Reservation reste dans Inventory. Aucun déplacement fondé uniquement sur le mot Policy.
- Service Capacity Visibility reste chez Fulfilment ; Supply Visibility consolide les attendus dans Availability ; Inventory
  Visibility expose les positions et projections de stock. Leurs consommateurs ne deviennent pas leurs propriétaires.
- ATP, CTP, PTP et Delivery Schedule Decision couvrent déjà faisabilité et recommandation ; Fulfillment Commitment porte l’engagement
  dans Order Management. Aucun ajout automatique d’une capacité générique de promesse.
- Fulfillment Plan Decision désigne actuellement le choix du plan de couverture dans Matching ; Process Adaptation Decision
  désigne les adaptations d’exécution dans Fulfilment. Leurs noms/définitions doivent éviter le même mot plan sans qualification.
- Apply Plan, Simulation & Analysis et les commandes de planning sont déjà des comportements de D05.f. L’audit ne les recrée
  pas en capacités, ne ressuscite aucun identifiant retiré et ne rouvre pas U431.
- Le décompte porte sur la couverture du catalogue existant, pas sur une preuve d’exhaustivité de toutes les responsabilités
  possibles du domaine ni sur des fonctionnalités installées chez Beaumanoir.
