- subdomain: Master Data
  responsibility: Tenir les références locales Supply sur les sept sujets existants.
  market_refs:
  - ELM522
  - ELM652
  position_and_limit: Les produits documentent des références consommées par les Orders ; les sept regroupements sont un choix
    FLOW. La maîtrise locale U479 doit être distinguée de la maîtrise d’entreprise externe.
  status: proposed_placement_justification
- subdomain: Policies
  responsibility: Gouverner les règles applicables, leur validité et leur activation.
  market_refs:
  - ELM394
  - ELM452
  position_and_limit: Les règles DOM et protections SAP étayent l’encadrement des décisions. Ces produits ne prescrivent pas
    un sous-domaine autonome Policies.
  status: proposed_placement_justification
- subdomain: Plans
  responsibility: Tenir et exposer les données prévisionnelles calculées hors du domaine.
  market_refs:
  - ELM415
  - ELM649
  position_and_limit: Les plans externes et besoins prévisionnels sont documentés ; leur ingestion dans un sous-domaine autonome
    est une frontière FLOW. Le sens Supply Plan hors achats vient de U668 ; ces sources ne prouvent pas une équivalence avec
    Supply Planning éditeur.
  status: proposed_placement_justification
- subdomain: Order Management
  responsibility: Tenir les Orders, leurs évolutions et les engagements qu’ils portent.
  market_refs:
  - ELM112
  - ELM652
  position_and_limit: Les types d’Orders et leur traitement sont attestés ; FLOW sépare recommandation de promesse et orchestration
    de réalisation, souvent réunies dans les offres OMS.
  status: proposed_placement_justification
- subdomain: Inventory Management
  responsibility: Tenir faits, positions, régimes et réservations de stock.
  market_refs:
  - ELM408
  - ELM449
  position_and_limit: Les distinctions physiques, attendues et réservées sont étayées. La valorisation financière de certains
    ERP est hors du périmètre retenu.
  status: proposed_placement_justification
- subdomain: Order Promising
  responsibility: Établir les réponses possibles et sélectionner la promesse recommandée.
  market_refs:
  - ELM352
  - ELM653
  position_and_limit: GOP et aATP examinent des alternatives ; la séparation FLOW d’avec Matching et l’engagement confirmé
    n’est pas une frontière uniforme du marché.
  status: proposed_placement_justification
- subdomain: Demand & Supply Matching
  responsibility: Construire et maintenir un master plan de matching cohérent de couverture de la demande.
  market_refs:
  - ELM650
  - ELM654
  position_and_limit: Planifier, simuler et appliquer des affectations sont documentés. Le périmètre FLOW inclut aussi la
    demande prévisionnelle résiduelle, au-delà des seuls portefeuilles de commandes de ces exemples.
  status: proposed_placement_justification
- subdomain: Fulfilment Orchestration
  responsibility: Obtenir les prestations et adapter leur réalisation en préservant les engagements.
  market_refs:
  - ELM651
  - ELM405
  position_and_limit: La coordination des services et retours d’exécution est étayée ; l’autonomie locale respectant Matching
    est un choix explicite FLOW U664.
  status: proposed_placement_justification
