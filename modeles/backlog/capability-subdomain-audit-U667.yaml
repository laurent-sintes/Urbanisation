authority:
  structure: Huit sous-domaines confirmés par U667 ; U668 distingue Supply Plan (prévisions de mouvements de stock hors achats)
    et master plan de matching (affectations internes). U672 adopte Order Promising en remplacement du nom Supply Availability.
  placements: Le nom, la responsabilité et les usages présentés en U671 sont adoptés U672 ; les rattachements de capacités
    et autres arbitrages conservent leurs statuts propres.
  canonical_model_changed: false
  pdf: Support jetable U661 ; aucun rôle d’autorité dans cet audit.
  external_systems: 'U669 : aucun sous-domaine APS. Mention descriptive de la source externe alimentant Supply et Demand Plans
    par ingestion dans Plans.'
method:
  coverage: Définitions et périmètres des 58 capacités ; parents et comportements obtenus par contains. Référentiels présentés
    distinctement conservés.
  market: Réutilisation des documents effectivement consultés pour CMP269 ; réexamen ciblé Microsoft/Blue Yonder pour le retour.
    Les comparaisons détaillées existantes des 58 fiches sont conservées, non réputées toutes revalidées.
  no_behavior_reaudit: U431 reste clos ; seul le rattachement des enfants est inventorié.
  no_rule_thresholds: Marges d’autonomie non détaillées conformément à U666.
