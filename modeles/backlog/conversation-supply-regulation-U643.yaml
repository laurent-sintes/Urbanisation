wording_proposed: La Supply Chain Orchestration régule la satisfaction des demandes en coordonnant les ressources présentes
  ou attendues, les engagements et la réalisation des prestations, selon les priorités et contraintes métier.
decision: Aucun changement du modèle ou du glossaire ; proposition de formulation et corrections soumises à la discussion.
