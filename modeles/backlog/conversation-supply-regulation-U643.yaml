reconciliation:
- unit: Q1
  anchor: 'Début : question sur organe de régulation'
  nature: Question et proposition de formulation
  relation: Enrichit
  target: universe-supply
  confidence: probable
  finding: La régulation résume une partie du service rendu ; fonction évite de présumer un composant central.
  proposal: Formulation introductive possible, à compléter par le pilotage de la réalisation et de ses adaptations.
- unit: A1
  anchor: Inventory Management et Demand Management sont distincts de Supply Chain Orchestration
  nature: Proposition ChatGPT
  relation: Contredit
  target: universe-supply / D04 / D02
  confidence: confirmed
  finding: Le Domain courant contient les finalités Demand et Inventory. Aucune exclusion de ces finalités ne découle de leur
    séparation de responsabilités.
  proposal: Ne pas reprendre cette conclusion dans FLOW.
- unit: A2
  anchor: Supply ne se limite pas à ce qui existe physiquement maintenant
  nature: Explication ChatGPT
  relation: Confirme
  target: TER083
  confidence: confirmed
  finding: Le glossaire courant distingue déjà ressources présentes et attendues, avec conditions d’admissibilité.
  proposal: Réutiliser TER083 ; distinguer ce sens large du Purpose Supply qui porte les apports attendus.
- unit: A3
  anchor: Supply ≠ Available Supply ; exemple 1 000 et 420
  nature: Distinction conceptuelle et exemple fictif
  relation: Nuance
  target: TER083 / D02.e / D02.c
  confidence: probable
  finding: La mobilisabilité dépend de la demande, de la date et des règles. Les chiffres ne sont pas des observations. Une
    affectation n’est pas universellement un blocage dans FLOW.
  proposal: Parler de ressources mobilisables pour une demande et une échéance, selon les contraintes.
- unit: A4
  anchor: ASCM définit Supply ; synchronisation supply et demand
  nature: Attribution externe à vérifier
  relation: Nuance
  target: Vocabulaire marché
  confidence: probable
  finding: Les extraits primaires ASCM consultés appuient la synchronisation dans SCM ; ils ne définissent pas le Domain FLOW
    ni une capacité SCO de périmètre identique. Le libellé produit/composant/service est retrouvé dans un programme CPIM 6.0,
    tandis que le dictionnaire 18 donne deux sens différents de supply.
  proposal: Distinguer édition et nature du document ; ne pas présenter la paraphrase comme une citation exacte du dictionnaire.
