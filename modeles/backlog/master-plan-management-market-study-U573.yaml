proposed_capability:
  proposal_key: master-plan-management
  name: Master Plan Management
  kind: capability
  nature: planning
  parent: proposal:Master Planning
  definition: Construire et maintenir un plan Supply de référence pour satisfaire les demandes, arbitrer les ressources et
    faire appliquer les recommandations retenues en suivant leurs résultats.
  market_refs:
  - ELM584
  - ELM585
  - ELM587
  - ELM588
  source_refs:
  - U570
  - U572
  - U573
  - U574
  - CMP239
  - CMP240
  decomposition_rationale: 'Un résultat commun, des pratiques de gestion distinctes et des effets métier différents : affectations,
    échéanciers, Orders et politiques. Les onze comportements sont terminaux ; deux regroupements de lecture ne créent aucun
    niveau supplémentaire.'
  tradeoff: Capacité assez large, mais responsabilité continue du plan ; des capacités séparées de simulation, démarrage ou
    application créeraient des frontières sans résultat autonome justifié.
  status: proposed
  behaviors:
  - proposal_key: request
    name: Planning Request Management
    kind: behavior
    parent: proposal:master-plan-management
    definition: Cadrer la demande de planification, choisir le périmètre et les données de référence, lancer ou programmer
      le calcul, suivre son avancement, l’arrêter ou le relancer.
    source_refs:
    - U573
    - U574
    - ELM582
    - ELM585
    - ELM583
    market_refs:
    - ELM582
    - ELM585
    - ELM583
    predecessor_ids:
    - D04.s
    decomposition_rationale: Piloter un travail pouvant durer, échouer ou devenir inutile ; lancement et arrêt sont des modalités
      de ce comportement.
    boundary: Choisit les politiques applicables et leurs versions ; ne les administre pas. Une annulation du calcul ne défait
      aucune action déjà appliquée.
    status: proposed
  - proposal_key: simulation
    name: Simulation & Analysis
    kind: behavior
    parent: proposal:master-plan-management
    definition: Construire des alternatives et comparer leurs conséquences sur service, promesse, économie, stock et risques
      pour le même problème Supply.
    source_refs:
    - U573
    - U574
    - ELM584
    - ELM587
    market_refs:
    - ELM584
    - ELM587
    predecessor_ids:
    - BHV005
    - BHV006
    - BHV091
    decomposition_rationale: Garder ensemble construction des alternatives et lecture de leurs conséquences ; ne pas créer
      une capacité par simulation.
    boundary: Les décisions spécialisées calculent les options ; une simulation ne rend pas ses résultats applicables.
    status: proposed
  - proposal_key: authorization
    name: Plan Authorization
    kind: behavior
    parent: proposal:master-plan-management
    definition: Retenir, refuser ou demander la révision d’un scénario et préciser quelles recommandations sont autorisées
      à être appliquées.
    source_refs:
    - U573
    - U574
    - ELM416
    - ELM566
    - ELM587
    market_refs:
    - ELM416
    - ELM566
    - ELM587
    predecessor_ids:
    - BHV092
    decomposition_rationale: Distinguer résultat calculé, référence retenue et autorisation de ses effets ; autorisation humaine
      ou déléguée.
    boundary: 'Appuis marché partiels : approbation de Planned Orders, promotion de scénario et release ; aucun workflow humain
      universel.'
    status: proposed
  - proposal_key: versions
    name: Plan Version Management
    kind: behavior
    parent: proposal:master-plan-management
    definition: Identifier la référence retenue, les scénarios et révisions qui en dérivent, partager leurs hypothèses et
      conserver ou clôturer leur historique utile.
    source_refs:
    - U573
    - U574
    - ELM584
    - ELM586
    market_refs:
    - ELM584
    - ELM586
    predecessor_ids: []
    decomposition_rationale: Plusieurs variantes peuvent coexister sans plusieurs références contradictoires.
    boundary: Pas une version complète immuable garantie par chaque éditeur ; archivage métier à distinguer du journal technique.
    status: proposed
  - proposal_key: monitoring
    name: Plan Monitoring & Replanning
    kind: behavior
    parent: proposal:master-plan-management
    definition: Comparer le plan retenu aux suites effectivement prises en compte et aux nouvelles conditions, puis préparer
      sa révision face aux écarts et aux impondérables.
    source_refs:
    - U573
    - U574
    - ELM566
    - ELM418
    - ELM583
    market_refs:
    - ELM566
    - ELM418
    - ELM583
    predecessor_ids:
    - BHV016
    decomposition_rationale: Conserver le bénéfice d’adaptation, y compris quand l’application est partielle.
    boundary: Les événements opérationnels et la réalisation physique gardent leurs responsables ; le recalcul mobilise les
      autres comportements sans sous-comportement.
    status: proposed
  - proposal_key: order_allocation
    name: Order Allocation & Reallocation
    kind: behavior
    parent: proposal:master-plan-management
    definition: Matérialiser les ressources présentes ou futures retenues pour les commandes ; compléter la couverture ou
      réviser les affectations modifiables entre commandes.
    source_refs:
    - U573
    - U574
    - ELM589
    - ELM363
    - ELM418
    market_refs:
    - ELM589
    - ELM363
    - ELM418
    predecessor_ids:
    - D02.e
    decomposition_rationale: Rendre visibles couverture des commandes et arbitrage des réaffectations, sans découper chaque
      opération élémentaire.
    boundary: Nom composé proposé à partir des mécanismes du marché ; allocation ne vaut ici ni réservation, ni promesse,
      ni prélèvement. Les liens protégés et engagements doivent être respectés.
    status: proposed
  - proposal_key: forecast_allocation
    name: Forecast Supply Allocation
    kind: behavior
    parent: proposal:master-plan-management
    definition: Matérialiser les ressources retenues pour des besoins prévisionnels identifiés et maintenir leur couverture
      sans doubler les commandes qui les consomment.
    source_refs:
    - U573
    - U574
    - ELM571
    - ELM574
    market_refs:
    - ELM571
    - ELM574
    predecessor_ids:
    - D02.e
    decomposition_rationale: Préserver explicitement le cas U562/U565, qui disparaîtrait dans un comportement réservé aux
      Orders.
    boundary: Intitulé descriptif FLOW, pas appellation universelle. Même plan et même arbitrage ; aucun Order ou engagement
      créé automatiquement.
    status: proposed
  - proposal_key: fulfillment_scheduling
    name: Fulfillment Scheduling
    kind: behavior
    parent: proposal:master-plan-management
    definition: Faire appliquer l’échéancier de satisfaction retenu, y compris une satisfaction partielle, plusieurs origines
      ou une révision des dates et quantités promises.
    source_refs:
    - U573
    - U574
    - ELM590
    - ELM435
    - ELM496
    - ELM591
    market_refs:
    - ELM590
    - ELM435
    - ELM496
    - ELM591
    predecessor_ids: []
    decomposition_rationale: Concrétiser le bénéfice client de l’allocation et distinguer ressources retenues, découpage et
      engagement de service.
    boundary: Mobilise Delivery Schedule Decision, Order Structuring/Order Splitting et Fulfillment Commitment ; aucune copie
      de leurs responsabilités. Réserver reste une action distincte si requise.
    status: proposed
  - proposal_key: release
    name: Planned Order Release
    kind: behavior
    parent: proposal:master-plan-management
    definition: Faire prendre en charge les nouveaux approvisionnements retenus en déclenchant les demandes ou Orders appropriés
      et constater leur prise en compte.
    source_refs:
    - U573
    - U574
    - ELM588
    - ELM566
    - ELM570
    market_refs:
    - ELM588
    - ELM566
    - ELM570
    predecessor_ids:
    - BHV094
    decomposition_rationale: Séparer l’apport encore hypothétique de la demande prise en charge, avec une application commune
      aux types d’Orders.
    boundary: Achat, transfert ou prestation selon le cas ; release ne garantit pas toujours un achat ferme. Les capacités
      Orders gèrent leurs engagements et leur cycle de vie.
    status: proposed
  - proposal_key: adjustment
    name: Supply Order Adjustment
    kind: behavior
    parent: proposal:master-plan-management
    definition: 'Faire appliquer les changements retenus aux approvisionnements existants : quantités, avancement, report
      ou annulation autorisée.'
    source_refs:
    - U573
    - U574
    - ELM413
    - ELM570
    - ELM418
    market_refs:
    - ELM413
    - ELM570
    - ELM418
    predecessor_ids:
    - BHV094
    decomposition_rationale: Créer un apport et modifier un engagement existant ne présentent pas les mêmes contraintes.
    boundary: Une recommandation d’annulation ne vaut pas annulation effective ; les responsables des Orders peuvent refuser
      ou n’accepter qu’une partie.
    status: proposed
  - proposal_key: policy
    name: Supply Policy Adjustment
    kind: behavior
    parent: proposal:master-plan-management
    definition: Soumettre puis faire prendre en compte les cibles ou protections retenues dans le plan, en distinguant valeurs
      proposées et politiques devenues applicables.
    source_refs:
    - U573
    - U574
    - ELM421
    - ELM371
    - ELM410
    - ELM592
    market_refs:
    - ELM421
    - ELM371
    - ELM410
    - ELM592
    predecessor_ids:
    - BHV094
    decomposition_rationale: Rendre explicite le retour du plan vers ses paramètres futurs, sans absorber leur administration.
    boundary: D05.a pour les objectifs/minima ; D05.d pour les enveloppes de groupe ; D02.b maintient les politiques. Optimisation
      conjointe automatique des quotas par canal non établie par les documents examinés.
    status: proposed
action_categories:
- key: allocate
  intent: Répartir le stock disponible ou futur entre commandes non couvertes
  behavior: order_allocation
  decision:
  - D03.o
  - D03.m
  example: Affecter 80 pièces disponibles à une commande de 100 ; le solde reste à couvrir.
  market_refs:
  - ELM589
  - ELM363
- key: reallocate
  intent: Libérer des affectations modifiables et les attribuer à d’autres commandes
  behavior: order_allocation
  decision:
  - D03.o
  - D03.m
  example: Déplacer 20 pièces de A vers B après examen des conséquences sur les deux commandes.
  market_refs:
  - ELM418
  - ELM496
- key: forecast
  intent: Couvrir les prévisions restantes dans le même arbitrage
  behavior: forecast_allocation
  decision:
  - D03.o
  example: Partager 500 pièces entre 300 commandées et 300 encore prévues ; aucune double consommation.
  market_refs:
  - ELM571
  - ELM574
- key: partial
  intent: Servir une partie plus tôt, fractionner ou réviser l’échéancier
  behavior: fulfillment_scheduling
  decision:
  - D03.l
  - D03.o
  effect_owners:
  - D04.n
  - BHV044
  - D03.n
  example: Confirmer 60 pièces vendredi et les 40 restantes ensuite si cette solution est admissible.
  market_refs:
  - ELM590
  - ELM435
- key: alternate
  intent: Changer de site d’expédition ou de mode pour tenir un meilleur échéancier
  behavior: fulfillment_scheduling
  decision:
  - D03.o
  - D03.l
  effect_owners:
  - D03.n
  - D04.i
  example: Retenir un second entrepôt pour une partie de la demande, sans prétendre qu’un déplacement physique a déjà eu lieu.
  market_refs:
  - ELM496
  - ELM591
- key: targets
  intent: Proposer une révision des minima et objectifs de stock
  behavior: policy
  decision:
  - D05.a
  effect_owners:
  - D02.b
  example: Proposer de passer le minimum produit-lieu de 40 à 55, puis appliquer uniquement la valeur retenue.
  market_refs:
  - ELM421
  - ELM371
- key: protection
  intent: Proposer une nouvelle répartition des protections entre groupes
  behavior: policy
  decision:
  - D05.d
  effect_owners:
  - D02.b
  example: Proposer une protection web de 120 au lieu de 150 pour améliorer la satisfaction d’autres demandes.
  market_refs:
  - ELM410
  - ELM592
  evidence_limit: Les protections et leur modification sont documentées ; leur optimisation conjointe dans le même master
    plan reste un choix FLOW à spécifier, pas un standard prouvé.
- key: buy
  intent: Proposer puis lancer un nouvel achat
  behavior: release
  decision:
  - proposal:supply-procurement-decision
  effect_owners:
  - D04.j
  example: Calculer le manque résiduel de 100 pièces, retenir l’achat puis obtenir la prise en charge de la demande correspondante.
  market_refs:
  - ELM588
  - ELM566
- key: revise_supply
  intent: Avancer, reporter, augmenter, réduire ou annuler un approvisionnement
  behavior: adjustment
  decision:
  - proposal:supply-procurement-decision
  - D05.e
  - D05.c
  effect_owners:
  - D04.j
  - D04.k
  example: Réduire un achat de 300 à 180 après baisse de besoin ; enregistrer un refus fournisseur éventuel.
  market_refs:
  - ELM413
  - ELM570
  - ELM418
- key: replenish
  intent: Réapprovisionner les magasins ou constituer leur stock initial
  behavior: release
  decision:
  - D05.e
  - D05.g
  effect_owners:
  - D04.k
  - D04.j
  example: Faire partir 25 pièces de la plateforme pour reconstituer la disponibilité d’un magasin.
  market_refs:
  - ELM588
  - ELM566
- key: rebalance
  intent: Rééquilibrer ou regrouper des stocks existants entre sites
  behavior: release
  decision:
  - D05.c
  effect_owners:
  - D04.k
  example: Transférer 15 pièces d’un magasin en excédent vers un magasin en manque.
  market_refs:
  - ELM369
  - ELM566
procurement_gap:
  name: Supply Procurement Decision
  kind: capability
  nature: decision
  parent: proposal:Master Planning
  status: proposed_not_created
  definition: Déterminer les achats à proposer, maintenir, modifier ou annuler pour couvrir les besoins Supply dans les conditions
    admissibles.
  market_refs:
  - ELM588
  - ELM413
  - ELM566
  source_refs:
  - U567
  - U574
  - CMP240
  rationale: Le modèle courant porte Purchase Order pour la tenue de la demande et Replenishment Decision pour les apports
    pendant la commercialisation ; la décision d’achat du plan commun, y compris avant saison, mérite une responsabilité explicite.
  boundary: Replenishment Decision et Initial Stocking Decision déterminent les besoins d’apport ; cette décision détermine
    les suites d’achat, après prise en compte des autres possibilités du plan. Elle ne choisit pas seule un optimum local
    et ne conclut pas de contrat fournisseur.
  alternatives_considered: Élargir Replenishment Decision reste possible, mais ferait porter au même intitulé l’entretien
    local de disponibilité et les suites d’achat du réseau. Recommandation de séparation à cette maille, pas consensus taxonomique.
naming_review:
  current_id: D02.e
  current_name: Supply Assignment
  recommendation: Order Allocation & Reallocation pour les commandes ; Forecast Supply Allocation pour les prévisions identifiées,
    sous le même plan.
  market_terms:
    Microsoft SCM: Pegging ; marking ; action messages ; firming
    Oracle: Backlog planning ; decommit ; split ; release ; supply allocation peut aussi désigner les quotas de groupe
    SAP IBP: Planning run ; scenario ; promote ; planned receipts
  limits: Pas de synonyme universel. Les deux noms FLOW sont des formulations descriptives proposées, fondées sur ces mécanismes
    ; aucune innovation ni équivalence exacte de réservation revendiquée.
  rejected_shortcuts:
  - 'Inventory Allocation seul : ambigu avec les enveloppes par canal de Microsoft.'
  - 'Order Allocation seul comme remplacement total : perdrait la couverture des prévisions validée U565.'
  - 'Fulfillment seul : pourrait faire croire à la réalisation physique.'
  - 'Pegging seul : vocabulaire technique peu lisible et périmètre variable des liens.'
