coverage_cases:
- case: Lancer, arrêter puis relancer le calcul
  covered_by:
  - request
  limit: Pas de pause/reprise universelle démontrée.
- case: Comparer sans appliquer
  covered_by:
  - simulation
  - versions
  limit: Variantes autorisées, référence commune identifiable.
- case: Retenir seulement une partie compatible des recommandations
  covered_by:
  - authorization
  limit: Vérifier la cohérence des recommandations liées ; pas transaction atomique supposée.
- case: Une commande a déjà changé depuis le calcul
  covered_by:
  - monitoring
  - request
  limit: Réexaminer l’applicabilité et les engagements actuels.
- case: Une partie des achats est prise en compte, une autre refusée
  covered_by:
  - release
  - adjustment
  - monitoring
  limit: Ne pas déclarer tout le plan appliqué ni relancer aveuglément les suites déjà prises en compte.
- case: Un impondérable appelle une révision
  covered_by:
  - monitoring
  - simulation
  - authorization
  limit: Conserver les effets déjà engagés, puis refaire appliquer les seules suites retenues.
- case: Abandonner un scénario ou arrêter les suites restantes
  covered_by:
  - authorization
  - versions
  - monitoring
  limit: Retirer une autorisation future ne défait ni réservation, ni promesse, ni Order déjà engagé.
- case: Conserver les décisions et variantes utiles
  covered_by:
  - versions
  limit: Politique de conservation extérieure ; suppression physique de données non modélisée comme capacité métier.
outside_or_not_demonstrated:
- Production et arbitrage détaillé de capacités industrielles existent dans les ERP étudiés ; pas d’extension automatique
  du périmètre FLOW.
- 'Substitutions produit/composant et ordonnancement industriel : pistes hors du lot proposé ; couverture FLOW non instruite
  par cette étude.'
- Expédition, transport, réception et prestation physique restent chez leurs responsables ; le plan peut les solliciter.
- Demand Planning, administration des référentiels et configuration des politiques ne sont pas absorbées.
- Aucune preuve d’un arrêt/reprise universel de l’application, d’un retour arrière global ou d’une optimisation mathématique
  unique de toutes les dimensions.
examples_status: Exemples fictifs de couverture ; aucune réalisation Beaumanoir déduite.
