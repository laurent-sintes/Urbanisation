recommendation: 'Conserver les deux capacités en clarifiant les formulations : demande de travail et résultat du plan sont
  distincts. Ne pas conserver une capacité Request uniquement pour faire un appel technique à Planning ; elle doit porter
  le cadrage et le suivi métier retenus U501.'
tradeoff: Le suivi de la demande et celui du plan doivent se référer au même résultat métier, sans deux autorités concurrentes
  ni obligation d’un dossier manuel pour chaque recalcul. La documentation de marché consultée ne démontre pas un catalogue
  OMS standard comportant cette capacité de demande.
market_position: Oracle étaye le contenu du Planning ; Salesforce apporte une analogie de gestion de demande et de résolution.
  Leur rapprochement est une adaptation FLOW, pas une équivalence ni une innovation démontrée.
canonical_changes: Aucun champ du modèle, comportement, nom, parent ou accord modifié. Les formulations proposées sont consignées
  pour examen ; U501 reste préservé.
followup_U547:
  analysis_ref: modeles/backlog/planning-request-behavior-option-U547.yaml
  direction: La demande est traitée comme les Orders ; sa prise en charge comme premier comportement de Planning devient l’option
    à privilégier. La recommandation U546 de maintenir deux capacités n’est plus la seule piste. Migration et noms proposés,
    sans modification canonique.
