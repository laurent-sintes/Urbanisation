baseline_model_sha256: a04bd6a13198897db87c1e1797b3fefad18e2ee5a99f18b67abb9bf6aa930f2d
finding: Les scopes distinguent déjà la demande et le travail du Planning. Plusieurs noms et définitions courtes donnent toutefois
  l’impression que la demande réalise elle-même l’étude ou l’application. Chevauchement surtout éditorial ; pas de doublon
  structurel démontré par la seule lecture des intitulés.
responsibilities:
- id: D04.s
  responsibility: Cadrer le travail demandé, suivre sa prise en charge, conserver l’autorisation applicable et constater le
    résultat de la demande.
- id: D03.p
  responsibility: Construire, comparer et actualiser le plan du carnet ; porter l’application du résultat retenu.
- id: D03.o
  responsibility: Déterminer les arbitrages cohérents d’affectation en mobilisant les décisions spécialisées.
- id: D02.e
  responsibility: 'Comportement de D03.p : rendre effectives les affectations et signaler les écarts d’application.'
authorization_boundary:
  id: BHV092
  recommendation: Conserver dans la demande le recueil et la tenue de l’autorisation de ses suites, de sa portée et de ses
    conditions. Ne pas refaire Fulfillment Plan Decision, ne pas reprendre Order Release et ne pas lever implicitement les
    engagements.
  automation: Autorisation humaine ou déléguée selon U501 ; aucune étape manuelle obligatoire.
  scope_limit: L’audit ne crée pas une nouvelle capacité Decision par opération d’approbation.
example: 'Exemple fictif : après un retard fournisseur, la demande précise quelles commandes étudier et quels engagements
  préserver. Planning compare les possibilités en mobilisant les décisions. Une fois les suites autorisées, son comportement
  Supply Assignment applique les affectations ; la demande reçoit le bilan et garde visible ce qui reste à traiter. Une étude
  peut se conclure sans application.'
proposed_revisions:
- id: D04.s
  field: definition
  proposed_value: 'Cadrer et suivre une demande de réexamen du carnet : préciser le travail attendu, sa portée, ses contraintes,
    les suites autorisées et le résultat obtenu.'
  reason: La demande porte la finalité du travail sollicité et son suivi ; Planning produit les scénarios et applique le plan
    retenu.
  current_value: Prendre en charge une demande de réexamen du carnet, préciser son objectif, son périmètre et ses contraintes,
    et suivre les scénarios étudiés, les décisions prises et les suites autorisées.
- id: BHV089
  field: definition
  proposed_value: Engager et cadrer une revue périodique du carnet avec les besoins, ressources et priorités actualisés.
  reason: Réexaminer le carnet appartient au Planning ; ici le comportement ouvre et cadre le travail demandé.
  current_value: Réexaminer le carnet avec les ressources, besoins et priorités actualisés.
- id: BHV090
  field: definition
  proposed_value: Prendre en charge une demande d’étude volontaire en précisant son objectif, son périmètre et les hypothèses
    à examiner.
  reason: Explorer les hypothèses relève du Planning ; le scope actuel décrit déjà leur formulation dans la demande.
  current_value: Explorer volontairement un périmètre ou une hypothèse.
- id: BHV091
  field: definition
  proposed_value: Faire instruire les scénarios demandés et recueillir leurs hypothèses, leurs résultats comparés et les conclusions
    utiles au traitement de la demande.
  reason: Aligner la définition courte sur le scope qui attribue la construction et la comparaison à Order Backlog Planning.
    Ne pas refaire les calculs ni une seconde simulation dans la demande.
  current_value: Comparer les scénarios et leurs conséquences, avec possibilité de conclure sans appliquer.
- id: BHV091
  field: name
  proposed_value: Scenario Study Follow-up
  reason: Libellé candidat FLOW pour distinguer le suivi de l’étude de la Simulation & Analysis réalisée dans Planning ; pas
    de terme standard revendiqué.
  current_value: Simulation & Analysis
- id: BHV093
  field: definition
  proposed_value: Suivre la prise en compte du résultat autorisé par le Planning, recueillir les écarts et déterminer les
    suites à donner à la demande.
  reason: Le suivi de la demande ne constitue pas un second mécanisme d’application ; Supply Assignment reste le comportement
    d’application des affectations sous Planning.
  current_value: Faire appliquer le résultat autorisé et connaître sa prise en compte ou ses écarts.
