  - id: D04.s
    revision: 5
    kind: behavior
    fields:
      name: Optimization Request Management
      nature: planning_practice
      definition: 'Prendre en charge et suivre un travail de planification du plan commun : préciser son résultat attendu,
        son périmètre et ses contraintes, puis tenir sa progression et sa conclusion.'
      finality: Savoir quel travail d’optimisation est demandé, ce qui est pris en charge et comment il se conclut.
      scope: |-
        Prendre en charge une demande de planification couvrant commandes, prévisions restantes, affectations et apports, en précisant son objectif, son périmètre, ses contraintes et le résultat attendu, puis suivre sa progression jusqu’à sa conclusion. La demande reste un travail métier suivi comme les Orders, selon les mécanismes pertinents ; elle n’impose ni cycle identique à tous les Orders ni dossier manuel pour chaque recalcul.

        La sollicitation est interne au Domain, dite Backoffice. Elle peut répondre à un impondérable affectant les commandes, à une échéance de revue ou à une étude volontaire. Ces modalités peuvent se combiner : qualifier le changement et les commandes touchées, actualiser le périmètre et les dépendances utiles, ou recueillir l’hypothèse à explorer. Un retard fournisseur externe peut ainsi provoquer une demande interne de réoptimisation. Aucun événement, rythme ou seuil ne déclenche obligatoirement une nouvelle demande.

        Ce comportement est le point d’entrée et de cadrage de [Demand & Supply Optimization Planning](model:D05.f). Son suivi continue pendant la construction et l’examen des scénarios, leur autorisation et leur application ; il n’impose pas une séquence linéaire. [Simulation & Analysis](model:BHV006) éclaire les scénarios ; [Scenario Authorization](model:BHV092) porte leurs suites autorisées. [Apply Plan](model:D02.e) applique les affectations et fournit les faits de prise en compte. La demande conserve la conclusion et les écarts restant à traiter, sans reproduire ces activités.

        Une étude peut être révisée, abandonnée ou conclue sans application. Une application partielle ou impossible appelle une conclusion ou une suite explicite ; aucune relance automatique n’est imposée. Le suivi de la demande ne se substitue pas au suivi des opérations des exécutants et ne crée ni réservation ni promesse.

        Exemple fictif : un arrivage est retardé. La demande délimite les commandes à réexaminer et les contraintes à préserver ; après comparaison, elle retrace le maintien du plan ou les affectations effectivement prises en compte et la part restant à réexaminer.

        Le périmètre étudié peut combiner commandes connues et prévisions restantes. Un impondérable touchant une ressource peut appeler leur réexamen commun, sans rendre obligatoires un recalcul intégral ou un nouveau dossier.

        Le pilotage conserve les cinq actes U578 : cadrer, programmer, lancer, arrêter et relancer le travail. Leur décomposition détaillée doit être explicitée dans la suite de la reprise ; le nœud hérité ne prétend pas remplacer cette instruction. Le suivi du calcul reste distinct du suivi des effets du plan et de sa révision. Le nom courant demeure provisoire dans ce périmètre élargi.
