      market_inspiration:
        choice: Le pilotage du travail relève du Planning commun ; sa description héritée sera décomposée selon les cinq actes
          U578.
        flow_scope: Cadrage et suivi du travail de planification, avec continuité des cinq actes de pilotage U578.
        flow_approach: 'Prendre en charge et suivre une demande d’optimisation des affectations aux commandes et besoins prévisionnels
          identifiés : préciser le résultat attendu, son périmètre et ses contraintes, puis tenir sa progression et sa conclusion.'
        synthesis:
        - Salesforce documente qualification et suivi d’une demande de services IT ; cette analogie ne définit pas une capacité
          Supply standard.
        - Oracle documente la pratique du planning du carnet, la simulation et la transmission des résultats ; il ne prescrit
          pas une demande autonome ni cette hiérarchie.
        - Les modes de sollicitation sont des modalités descriptives ; aucune décomposition sous un comportement.
        - SAP EDQA illustre une réponse à un changement de situation ; Oracle décrit aussi le lancement programmé ou volontaire
          du travail sur le carnet. Ces mécanismes éclairent les modes de sollicitation sans imposer un dossier pour chaque
          événement. Les passages SAP sont repris avec leur limite de reconsultation.
        - Oracle distingue transmission et étude ; Salesforce Service Process Studio illustre le suivi du résultat d’un traitement
          dans un autre métier. FLOW utilise cette analogie pour tenir la conclusion et les écarts, sans attribuer à la demande
          le calcul du plan ou l’application des affectations.
        - FLOW étend ce comportement au plan commun des commandes et prévisions identifié en U565. Les exemples de backlog
          déjà cités étayent le mécanisme sur les commandes ; ils ne prouvent pas à eux seuls cette extension de périmètre.
