        choice: Scenario Authorization porte le choix d’appliquer, faire revoir ou abandonner le scénario dans Demand & Supply
          Optimization Planning. Il reste distinct du calcul de Fulfillment Plan Decision et de l’Order Release porté par
          Lifecycle.
        flow_scope: Recueillir le scénario proposé et les conséquences exposées, puis déterminer s’il peut être appliqué,
          doit être modifié ou doit être abandonné. Conserver la décision, sa portée et ses conditions. Une personne peut
          intervenir, ou une politique déléguée peut autoriser les suites selon le contexte.
        flow_approach: Retenir, faire revoir ou abandonner une proposition et préciser ses conditions d’application.
        synthesis:
        - Oracle sépare simulation et transmission des résultats, sans imposer une approbation humaine.
        - Salesforce illustre les autorisations nécessaires au traitement de certaines demandes IT ; FLOW conserve l’autorisation
          humaine ou déléguée selon le contexte, sans importer un workflow IT.
        - FLOW étend ce comportement au plan commun des commandes et prévisions identifié en U565. Les exemples de backlog
          déjà cités étayent le mécanisme sur les commandes ; ils ne prouvent pas à eux seuls cette extension de périmètre.
