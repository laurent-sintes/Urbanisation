    entre objectifs de stock et décision de réassort ; aucun rattachement nouveau adopté.
  source_refs:
  - U529
  - Q078
domain_naming:
  current_name: Supply Chain Orchestration
  recommendation: Conserver ce nom à ce stade ; il peut couvrir la planification si la définition du Domain l'explicite après
    arbitrage.
  proposed_service_if_scope_adopted: Préparer les équilibres de la Supply, décider comment satisfaire les besoins, coordonner
    les opérations et adapter plans et engagements lorsque la situation change.
  evidence: Kinaxis utilise orchestration de la planification stratégique à l'exécution ; Oracle désigne ainsi un composant
    recevant notamment des demandes de Supply Planning. Ces usages établissent une pluralité de portée, pas un consensus de
    découpage.
  alternative:
    name: Supply Chain Planning & Orchestration
    status: Alternative descriptive locale, non retenue et non présentée comme catégorie standard.
    tradeoff: Rend la présence de planification explicite, mais alourdit le nom et peut laisser croire que l'orchestration
      exclut par nature la planification.
  market_comparisons:
  - vendor: Kinaxis
    product: Maestro
    element_name: Supply Chain Orchestration
    element_type: Positionnement d'offre
    relationship: Appui sémantique
    similarities: Coordination de la planification et de l'exécution, avec adaptation aux changements.
    differences: Offre allant de la stratégie pluriannuelle à la livraison ; FLOW conserve un périmètre Supply plus limité
      et la réalisation physique reste chez les exécutants.
    flow_position: Le terme peut englober la planification sans adopter tout le périmètre Kinaxis. La définition FLOW doit
      rendre cette portée explicite.
    source_title: Supply Chain Orchestration
    source_url: https://www.kinaxis.com/en/solutions/supply-chain-orchestration
    source_version: Page évolutive ; édition non indiquée
    consulted_on: '2026-09-21'
    source_locator: Présentation du périmètre de la planification pluriannuelle à la livraison ; The value of orchestration.
    evidence_limits: Positionnement commercial primaire, pas taxonomie normative ni preuve de performance ou de déploiement.
    status: proposed
    source_refs:
    - U526
    - CMP214
    - ELM551
  - vendor: Oracle
    product: Fusion Cloud SCM
    element_name: Supply Chain Orchestration
    element_type: Composant de produit
    relationship: Appui sémantique
    similarities: Coordonner les réponses aux demandes Supply et adapter les approvisionnements en cours.
    differences: Supply Planning est un émetteur distinct dans cette architecture Oracle ; le terme a ici une portée plus
      étroite que le Domain FLOW proposé.
    flow_position: Conserver un nom de Domain possible sans prétendre reproduire le composant Oracle ou imposer une définition
      commune aux éditeurs.
    source_title: Overview of Supply Chain Orchestration
    source_url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/26b/fauco/overview-of-supply-orchestration.html
    source_version: 26B
    consulted_on: '2026-09-21'
    source_locator: Origines des demandes Supply et gestion des changements.
    evidence_limits: Documentation de produit ; ne démontre aucune exclusion universelle de la planification du concept d'orchestration.
    status: proposed
    source_refs:
    - U526
    - CMP214
    - ELM294
