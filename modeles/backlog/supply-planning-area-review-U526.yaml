baseline:
  path: modeles/backlog/model.yaml
  sha256: 9e046b9ab49609ff27a9ff6cad38a49f3e3e8dc54e0ec1df8134518490e49160
  canonical_change: false
scope:
  level: landscape_and_capabilities
  hierarchy: Domain → Area → Capability → Behavior
  interpretation: Une Area de planification dans le Domain courant, sans niveau supplémentaire.
  adoption: U530 retient le principe d'une Area de planification dans Supply Chain Orchestration. Supply Planning est son
    libellé de travail ; descriptions, capacités et piste PLM ne sont pas adoptées globalement.
area_proposal:
  name: Supply Planning
  parent_name: Supply Chain Orchestration
  service: Construire, comparer et mettre à jour régulièrement le plan d'ensemble de couverture des besoins Supply, puis préparer
    sa mise en œuvre par les capacités responsables.
  responsibilities:
  - Coordonner les hypothèses, objectifs et scénarios nécessaires aux équilibres de la Supply.
  - Comparer les conséquences des scénarios et préparer le choix du plan à suivre.
  - Réviser le plan lorsque les faits remettent en cause les équilibres retenus.
  cooperation: Les Areas opérationnelles prennent leurs décisions, portent leurs engagements et adaptent les opérations aux
    impondérables dans leur périmètre. Les faits et décisions opérationnels alimentent la mise à jour régulière du plan d'ensemble
    et son réexamen lorsque les équilibres sont remis en cause.
  boundary: Le plan d'ensemble est régulièrement actualisé ; il ne se définit pas par un calcul en début de saison. La planification
    mobilise les décisions spécialisées sans en dupliquer la responsabilité. Horizon, fréquence, automatisation et présence
    d'analytics ne suffisent pas à définir la frontière.
  benefit: Rendre visible la responsabilité de cohérence des plans tout en conservant la réactivité des Areas opérationnelles.
  tradeoff: Éviter une Area trop générale qui centraliserait toute analyse ou imposerait un détour de planification à chaque
    adaptation opérationnelle.
  example: Un retard fournisseur peut conduire les Areas opérationnelles à réviser la satisfaction des commandes. Si les nouvelles
    disponibilités rendent les objectifs de stock irréalistes, Supply Planning révise aussi le scénario collectif avec les
    décisions spécialisées.
  exclusions_pending_scope_decision:
  - 'U530–U531 : le plan d''ensemble illustré par MAP comprend des horizons saisonniers et plurisaisonniers. Cela ne transfère
    pas automatiquement tout le S&OP, le merchandising de saison, la conception produit ou la stratégie réseau dans FLOW.'
  - Aucun transfert général des capacités d'Inventory Optimization ni de toutes les capacités dont le nom contient Planning
    ou Plan.
  - Aucun catalogue de Behaviors ou détail de règles ajouté.
  market_comparisons:
  - vendor: SAP
    product: Integrated Business Planning
    element_name: Response and supply planning
    element_type: Périmètre fonctionnel de produit
    relationship: Recouvrement partiel
    similarities: Construire des plans sous contraintes, comparer des scénarios et répondre aux impondérables.
    differences: Offre SAP et intégration S/4HANA plus larges que la proposition de responsabilité métier FLOW ; aucun découpage
      de capacités identique démontré.
    flow_position: Le plan d'ensemble est régulièrement actualisé. La planification et les opérations peuvent toutes deux
      répondre aux impondérables ; la frontière porte sur leurs responsabilités et résultats, sans fréquence imposée.
    source_title: Response and supply planning
    source_url: https://www.sap.com/sea/products/scm/integrated-business-planning/features/response-and-supply-planning.html
    source_version: Non indiquée
    consulted_on: '2026-09-21'
    source_locator: Supply planning ; Empower planners with collaboration and simulations ; Empower planners with executional
      alignment ; Synchronised planning.
    evidence_limits: Présentation fonctionnelle primaire ; ne démontre ni contrat détaillé de synchronisation ni réalisation
      installée.
    status: proposed
    source_refs:
    - U526
    - CMP214
    - ELM552
    - U529
  - vendor: Oracle
    product: Fusion Cloud SCM
    element_name: Supply Chain Orchestration
    element_type: Composant de produit
    relationship: Appui méthodologique
    similarities: La planification transmet des demandes à l'orchestration ; celle-ci coordonne les approvisionnements et
      traite les changements.
    differences: Composant Oracle plus étroit que le Domain FLOW ; ses frontières logicielles ne prescrivent pas les Areas
      métier.
    flow_position: Distinguer construction du plan et adaptation des opérations sans transformer cette distinction en séparation
      des données ou des outils.
    source_title: Overview of Supply Chain Orchestration
    source_url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/26b/fauco/overview-of-supply-orchestration.html
    source_version: 26B
    consulted_on: '2026-09-21'
    source_locator: Réception des demandes de Supply Planning et Order Management ; orchestration des supply orders ; change
      management et exceptions.
    evidence_limits: Description du composant Oracle, pas définition universelle d'orchestration ; la fabrication documentée
      n'est pas ajoutée à FLOW.
    status: proposed
    source_refs:
    - U526
    - CMP214
    - ELM294
