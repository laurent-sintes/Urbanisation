- id: D06.f
  name: Process Adaptation Decision
  assessment: Conserver la responsabilité opérationnelle d'adaptation des prestations et processus.
- id: D05.e
  name: Replenishment Decision
  assessment: U529 propose le réassort dans l'opérationnel. Replenishment Decision détermine les apports et leurs ajustements
