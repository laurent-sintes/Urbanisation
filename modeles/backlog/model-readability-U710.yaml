canonical_changes:
- 'D02.b.name : Supply Protection Policy'
rules:
- rule: Une capacité possède zéro ou au moins deux comportements différenciants.
  status: applied_U711
  market_limit: Convention FLOW ; aucun standard marché ne prescrit ce cardinal précis.
  implementation_proposal: Intégrer les deux descriptions isolées aux capacités parents, conserver leur provenance et retirer
    les deux nœuds Behavior. Aucun second comportement artificiel.
  affected:
  - parent: service-order-packing
    child: vas-repacking
  - parent: service-order-labeling
    child: vas-labeling-relabeling
lifecycle:
  id: D07.b
  recommendation: Retirer la capacité Service Order Lifecycle.
  rationale: Toutes les familles portent déjà leurs demandes, engagements, évolutions et résultats ; la capacité commune ajoute
    une seconde responsabilité pour le même cycle.
  preserve:
  - Décrire les invariants communs dans Service Order Management, sans nouvelle capacité générique.
  - Les familles portent activation, acceptation, modification, annulation et clôture de leur demande.
  - Fulfilment coordonne le déclenchement et capte les résultats ; aucun transfert de propriété des engagements.
  - Réception et autres prestations sans famille nommée restent dans le périmètre général du sous-domaine ; signaler ce besoin
    sans inventer une famille.
  migration: Supprimer les liens de mutualisation vers D07.b, qualifier les coopérations pertinentes vers le sous-domaine
    ou les familles ; préserver leur sens et leurs preuves.
  sources:
  - ELM708
  - ELM709
  status: removed_U711
  relation_migration:
    retired_relation_ids:
    - REL-EXECUTION-ORCHESTRATION-COMMITMENTS
    - REL-EXECUTION-REQUIREMENTS-SERVICE-ORDER
    - REL-NEEDS-U290-114
    - REL-NEEDS-U290-122
