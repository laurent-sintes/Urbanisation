    replacement_relation_ids:
    - REL-U682-ORCHESTRATION-SERVICE-ORDERS
    - REL-U711-SERVICE-ORDERS-FULFILMENT
    - REL-U711-SERVICE-ORDERS-ORDERS
    - REL-U711-CATALOG-SERVICE-ORDERS
    note: Coopérations regroupées par sous-domaines ; le besoin du rapprochement des achats et celui du catalogue restent
      explicites.
subdomain_role:
  status: applied_U711
  attribute: dominant_role
  principle: Finalité dominante, facultative, descriptive, distincte du type de capacité ; aucun niveau hiérarchique ou frontière
    étanche.
  vocabulary: Préférer rôle ou finalité dominante à Purpose, ancien nom du niveau remplacé.
  assignments:
    Données et état:
    - Master Data
    - Plans
    - Inventory Management
    Politiques:
    - Policies
    Décision et planification:
    - Order Promising
    - Demand & Supply Matching
    Gestion des engagements:
    - Order Management
    - Service Order Management
    Orchestration:
    - Fulfilment Orchestration
  limit: Inventory Management tient aussi des opérations de stock ; Fulfilment comprend des décisions. Le rôle dominant ne
    change pas ces responsabilités.
  atlas: Badge texte et accent visuel discret sur le sous-domaine, avec légende et filtre ; couleurs redondantes au texte,
    sans remplacer les types des capacités.
  sources:
  - ELM706
  - ELM707
categories:
  status: applied_U711
  principle: Regroupement local des capacités, distinct du rôle dominant du sous-domaine. Le code actuel accepte déjà les
    catégories sur les capacités de tout sous-domaine.
  candidates:
    Demand & Supply Matching:
    - Plan global
    - Décisions de stock et de flux
    - Priorités et couverture des commandes
    Fulfilment Orchestration:
    - Définir et choisir les prestations
    - Coordonner et adapter
    - Suivre et rapprocher
  defer:
  - 'Plans et Policies : peu de capacités, bandes peu utiles.'
  - 'Order Promising : conserver la lecture directe ATP/CTP/PTP.'
  - 'Master Data : ses référentiels structurent déjà la présentation.'
  sources:
  - ELM706
  - ELM707
