- proposed_name: Demand Management
  question_proposed: Quels besoins devons-nous satisfaire, avec quelles contraintes et quels engagements ?
  responsibility_proposed: Porter les besoins et exigences des demandes, en suivre le contenu et le cycle de vie, et piloter
    leur promesse de satisfaction. Les demandes peuvent provenir du commerce ou du plan d’optimisation Supply ; Transfer Order
    et les retours en font partie. Relier commandes, demandes avant commande et prévision restante sans double compte.
  current_anchors:
  - D04.i
  - D17.a
  - D04.k
  - D04.l
  - D04.m
  boundary: 'Une réservation liée à une commande est un engagement sur une ressource, pas un besoin supplémentaire à additionner.
    Une demande avant commande exige une identité et une règle de succession explicites. U595 : origine Supply et effet d’apport
    ne changent pas la responsabilité Demand du Transfer Order et des retours.'
  open_issue: Le pilotage de la promesse par les demandes est précisé U595 ; décrire encore les coopérations avec calcul de
    faisabilité, échéancier et exécution. L’étude des demandes de consignation est distincte de ce principe.
  market_refs:
  - ELM600
  - ELM411
  - ELM601
  market_interpretation: Microsoft distingue demande prévue et disponibilité après réservation ; Oracle montre qu'un transfert
    porte aussi une demande. Demand Management dépasse donc potentiellement les seules commandes ; l'intégration des prévisions
    est cohérente avec D17.a déjà existante.
- proposed_name: Supply Management
  question_proposed: Quels apports attendons-nous, à quel endroit, à quelle date et avec quel niveau d'engagement ?
  responsibility_proposed: Prendre en charge et suivre les apports attendus, leurs évolutions et leurs engagements, issus
    notamment d'achats, de transferts et de retours clients admissibles.
  current_anchors:
  - D04.j
  - D04.r
  boundary: 'Distinguer proposition du plan, Order engagé et apport reçu. L''arbitrage du besoin d''un achat relève du plan
    ; la tenue de l''achat et de ses confirmations relève de la gestion de l''apport. U595 : les Transfer Orders et retours
    sont tenus par Demand ; Supply en exploite les effets attendus sans tenir une seconde commande. La responsabilité exacte
    des autres familles n’est pas déduite par extension.'
  preserve: Un retour fournisseur sort de la ressource ; il n'est pas un apport entrant par nature. Un retour client attendu
    n'est pas automatiquement disponible avant qualification. Les achats de prestations ne sont pas du stock.
  open_issue: Les capacités communes D04.n, D04.o et D04.q servent plusieurs familles d'Orders ; leurs propriétaires restent
    à déterminer sans duplication entre Demand et Supply.
  market_refs:
  - ELM601
  - ELM600
  - ELM596
  market_interpretation: Oracle distingue les deux effets du même transfert ; Microsoft sépare apports prévus et propositions
    du plan. Le regroupement métier FLOW est une interprétation, pas l'adoption d'un module logiciel.
  consumed_demand_effects_U595:
  - D04.k
  - D04.l
  - D04.m
- proposed_name: Inventory Management
  question_proposed: Quels stocks sont présents ou en transit, où, dans quel état, sous quelle propriété et avec quelle disponibilité
    projetée ?
  responsibility_proposed: Établir et fiabiliser la position du stock, tracer les mouvements et restituer les positions présentes
    et projetées à partir des besoins, apports et engagements identifiés.
  current_anchors:
  - D01.f
  - D01.g
  - D01.c
  - D01.d
  - D01.h
  - D02.c
  boundary: Le stock projeté est une vue calculée des effets attendus ; il ne recrée pas les Orders et ne décide pas un plan
    concurrent. Propriété, présence physique et disponibilité restent distinctes.
  open_issue: 'Placement de Reservation D02.c à examiner en conservant U436 : réserver bloque les usages concurrents ; affecter
    seul ne les bloque pas.'
  market_refs:
  - ELM406
  - ELM600
  - ELM411
  market_interpretation: Consignation, projection de stock et réservation étayent trois distinctions ; aucune formule produit
    n'est imposée à FLOW.
- proposed_name: Supply & Demand Matching
  question_proposed: Comment couvrir les besoins et arbitrer les ressources, les priorités et les ajustements nécessaires
    ?
  responsibility_proposed: Construire et actualiser le plan de satisfaction et de ressources, et faire appliquer les ajustements
    autorisés, notamment au contenu des demandes tant qu’elles ne sont pas en cours d’exécution. Une demande ferme peut encore
    être révisée et désaffermie. Mobiliser les décisions nécessaires aux achats, dates, quantités, fractionnements et révisions
    de politiques Supply.
  current_anchors:
  - D03.p
  - D03.m
  - D03.o
  - D02.e
  - D05.f
  - D05.a
  - D05.d
  - D05.e
  - D05.c
  - D05.g
  - D05.h
  - D05.i
  boundary: 'U592 : le début effectif d’exécution borne la retouche du contenu de la demande par l’arbitrage ; la fermeté
    seule ne la soustrait pas à ce travail. Firming, protection contre réoptimisation, autorisation de prise en charge et
    exécution sont distincts. L’arbitrage ne conduit pas les prestations ; les responsables de tenue des demandes et engagements
    appliquent les conséquences qui les concernent. Le critère ferme et exécutable formulé U591 est remplacé sur ce point.
    Les repères ATP/CTP/PTP ne prescrivent pas le découpage des capacités de la proposition.'
  naming_recommendation: Garder Demand & Supply Optimization comme option préférée pour le périmètre large déjà discuté ;
    Matching exprime directement le rapprochement mais doit être défini assez largement si ce nom est retenu.
  market_refs:
  - ELM596
  - ELM363
  - ELM434
  - ELM604
  market_interpretation: Microsoft Master Planning calcule des besoins et génère des propositions d'apports ; Oracle Backlog
    Planning réexamine le carnet et répartit les apports selon les priorités. Les périmètres diffèrent ; ni Matching ni Optimization
    n'est établi ici comme nom universel d'Area.
  preserve: Les responsabilités de gestion du plan, décisions, Apply Plan, configuration et engagements restent distinctes.
    Le caractère collectif ou la fréquence ne créent pas une frontière rigide avec l'exécution. Les nouveaux apports restent
    des propositions tant qu’ils ne sont pas engagés ; une quantité partiellement couverte ne signifie pas réduction unilatérale
    de la demande initiale.
  boundary_source_refs:
  - U585
  - U591
  - U592
  - C114
  - CMP254
- proposed_name: Fulfillment Orchestration
  question_proposed: Comment organiser, suivre et adapter la réalisation des demandes dans les engagements retenus ?
  responsibility_proposed: Conduire l’exécution d’une demande et orchestrer les Services, principalement logistiques, jusqu’au
    résultat attendu. Adapter le plan d’exécution aux aléas, y compris pour traiter un article manquant depuis un autre entrepôt
    ; conserver le lien à la demande initiale et le suivi des Logistic Orders issus du split.
  current_anchors:
  - D06.b
  - D06.d
  - D06.e
  - D06.f
  - D07.a
  - D07.b
  - D07.c
  - D07.d
  boundary: 'U592 sépare la modification du contenu d’une demande avant son début d’exécution de l’adaptation de sa réalisation.
    U591 reste applicable : un manque partiel peut être traité dans Fulfillment par split de la Logistic Order et reprise
    du seul article manquant depuis un autre entrepôt ; la demande initiale porte le lien et le suivi des deux suites. Une
    adaptation du plan d’exécution n’est pas un désaffermissement implicite de la demande initiale. Si l’engagement devient
    impossible à tenir, les conséquences et responsables doivent être explicités ; ne pas en déduire que l’arbitrage peut
    réécrire une demande déjà en cours d’exécution.'
  preserve: La visibilité de capacité des prestations D06.b ne disparaît pas dans la visibilité de stock. Les exécutants réalisent
    les opérations physiques ; l'orchestration les coordonne.
  market_refs:
  - ELM602
  - ELM603
  - ELM363
  - ELM011
  - ELM605
  market_interpretation: 'ELM602 Fluent étaye la reprise des articles manquants depuis un autre lieu pendant la réalisation.
    ELM604 Oracle traite le split lors de la promesse : le mécanisme existe aussi avant exécution. Ces fonctions appuient
    les deux usages sans imposer la frontière FLOW. Le critère de début d’exécution et la possibilité de désaffermissement
    proviennent de Laurent U592, pas d’un consensus des éditeurs.'
  case_management_U585: 'Orientation de Laurent rapprochée des principes établis du case management : contexte, résultat attendu,
    événements, critères, activités prévues ou discrétionnaires et décisions. Humain et automatique possibles ; ni notation
    ni moteur imposé.'
  boundary_source_refs:
  - U591
  - U592
  - C114
  - CMP254
  adopted_terminology:
    Re-sourcing:
      source_ref: U593
      scope: Reprise depuis une autre source, illustrée par le seul article manquant depuis un autre entrepôt.
      qualification: Nom adopté ; description détaillée et maille de modélisation à préciser.
