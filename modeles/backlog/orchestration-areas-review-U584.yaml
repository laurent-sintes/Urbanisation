      question_proposed: Comment couvrir les besoins et arbitrer les ressources, les priorités et les ajustements nécessaires
        ?
      responsibility_proposed: Construire et actualiser un plan commun de satisfaction et de ressources pouvant proposer des
        achats, des révisions de dates, quantités ou fractionnement des demandes de vente, et des révisions de politiques
        Supply.
