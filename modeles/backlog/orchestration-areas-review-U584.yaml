history_U584:
  assessment:
    author: Codex
    conclusion: Les six questions donnent une lecture métier utile ; leur adoption exige de préciser les responsabilités transversales
      et les frontières ci-dessous.
    benefit: Séparer besoins, apports attendus, position de stock, arbitrages de couverture et coordination de réalisation.
    tradeoff: Demand et Supply sont aussi deux rôles d'un même transfert ; une carte de responsabilités doit conserver une
      tenue unique des Orders et de leurs engagements.
    market_position: Appuis fonctionnels et sémantiques partiels ; aucun document consulté ne prescrit ces six Areas comme
      taxonomie universelle.
    agreement_boundary: U584 est une proposition. Le nom cible Demand & Supply Optimization retenu U581 reste tracé ; Supply
      & Demand Matching est une alternative en examen, sans remplacement automatique.
    modeling_boundary: Les exemples de documents et fonctions ne deviennent pas chacun une capacité ; ni couches transactionnelle/processus,
      ni séquence rigide de six étapes.
  areas:
  - proposed_name: Reference & Policy Management
    question_proposed: Quelles références et règles rendent nos décisions et opérations cohérentes ?
    responsibility_proposed: Maintenir les références locales du Domain et rendre les politiques applicables avec leurs conditions
      et dates de validité.
    current_anchors:
    - business-references
    - D08
    - D09
    - D12
    - D16
    - D11
    - D13
    - D14
    - D02.b
    boundary: Administrer et activer une politique se distingue du calcul qui recommande une cible, un seuil ou une protection.
      D05.a, D05.d et D05.h gardent des résultats décisionnels à placer explicitement.
    preserve: Les sept référentiels distincts, leur autorité locale U479 et les sources de vérité d'entreprise externes ;
      ni nouveau catalogue Information ni transfert de maîtrise globale.
    market_refs:
    - ELM603
    - ELM415
    market_interpretation: Fluent distingue configuration des profils et utilisation en orchestration ; Microsoft décrit les
      paramètres qui influencent le plan. Ces documents éclairent la frontière politiques/décisions, sans prouver le regroupement
      complet avec tous les référentiels.
  - proposed_name: Demand Management
    question_proposed: Quels besoins devons-nous satisfaire, avec quelles contraintes et quels engagements ?
    responsibility_proposed: Qualifier et suivre les besoins connus ou prévisionnels, leur échéance et leurs contraintes,
      en reliant commandes, demandes avant commande et prévision restante.
    current_anchors:
    - D04.i
    - D17.a
    - D04.k
    boundary: Une réservation liée à une commande est un engagement sur une ressource, pas un besoin supplémentaire à additionner.
      Une demande avant commande exige une identité et une règle de succession explicites.
    open_issue: Examiner ici la responsabilité de confirmer et réviser les engagements aujourd'hui dans D15 ; le parent d'ATP/CTP/PTP
      et du choix d'échéancier reste à préciser, sans tout absorber dans une capacité unique.
    market_refs:
    - ELM600
    - ELM411
    - ELM601
    market_interpretation: Microsoft distingue demande prévue et disponibilité après réservation ; Oracle montre qu'un transfert
      porte aussi une demande. Demand Management dépasse donc potentiellement les seules commandes ; l'intégration des prévisions
      est cohérente avec D17.a déjà existante.
  - proposed_name: Supply Management
    question_proposed: Quels apports attendons-nous, à quel endroit, à quelle date et avec quel niveau d'engagement ?
    responsibility_proposed: Prendre en charge et suivre les apports attendus, leurs évolutions et leurs engagements, issus
      notamment d'achats, de transferts et de retours clients admissibles.
    current_anchors:
    - D04.j
    - D04.k
    - D04.l
    - D04.r
    boundary: Distinguer proposition du plan, Order engagé et apport reçu. L'arbitrage du besoin d'un achat relève du plan
      ; la tenue de l'achat et de ses confirmations relève de la gestion de l'apport.
    preserve: Un retour fournisseur sort de la ressource ; il n'est pas un apport entrant par nature. Un retour client attendu
      n'est pas automatiquement disponible avant qualification. Les achats de prestations ne sont pas du stock.
    open_issue: Les capacités communes D04.n, D04.o et D04.q servent plusieurs familles d'Orders ; leurs propriétaires restent
      à déterminer sans duplication entre Demand et Supply.
    market_refs:
    - ELM601
    - ELM600
    - ELM596
    market_interpretation: Oracle distingue les deux effets du même transfert ; Microsoft sépare apports prévus et propositions
      du plan. Le regroupement métier FLOW est une interprétation, pas l'adoption d'un module logiciel.
  - proposed_name: Inventory Management
    question_proposed: Quels stocks sont présents ou en transit, où, dans quel état, sous quelle propriété et avec quelle
      disponibilité projetée ?
    responsibility_proposed: Établir et fiabiliser la position du stock, tracer les mouvements et restituer les positions
      présentes et projetées à partir des besoins, apports et engagements identifiés.
    current_anchors:
    - D01.f
    - D01.g
    - D01.c
    - D01.d
    - D01.h
    - D02.c
    boundary: Le stock projeté est une vue calculée des effets attendus ; il ne recrée pas les Orders et ne décide pas un
      plan concurrent. Propriété, présence physique et disponibilité restent distinctes.
    open_issue: 'Placement de Reservation D02.c à examiner en conservant U436 : réserver bloque les usages concurrents ; affecter
      seul ne les bloque pas.'
    market_refs:
    - ELM406
    - ELM600
    - ELM411
    market_interpretation: Consignation, projection de stock et réservation étayent trois distinctions ; aucune formule produit
      n'est imposée à FLOW.
  - proposed_name: Supply & Demand Matching
    question_proposed: Comment couvrir les besoins et arbitrer les ressources, les priorités et les ajustements nécessaires
      ?
    responsibility_proposed: Construire et actualiser le plan commun de couverture, arbitrer les ressources existantes ou
      attendues et proposer les adaptations nécessaires.
    current_anchors:
    - D03.p
    - D03.m
    - D03.o
    - D02.e
    - D05.f
    - D05.a
    - D05.d
    - D05.e
    - D05.c
    - D05.g
    - D05.h
    - D05.i
    boundary: Une portée limitée à répartir une ressource déjà donnée laisserait sans propriétaire les nouveaux achats, cibles,
      réassorts et redistributions. Conserver des décisions distinctes au sein du plan commun et l'application autorisée de
      ses suites.
    naming_recommendation: Garder Demand & Supply Optimization comme option préférée pour le périmètre large déjà discuté
      ; Matching exprime directement le rapprochement mais doit être défini assez largement si ce nom est retenu.
    market_refs:
    - ELM596
    - ELM363
    market_interpretation: Microsoft Master Planning calcule des besoins et génère des propositions d'apports ; Oracle Backlog
      Planning réexamine le carnet et répartit les apports selon les priorités. Les périmètres diffèrent ; ni Matching ni
      Optimization n'est établi ici comme nom universel d'Area.
    preserve: Les responsabilités de gestion du plan, décisions, Apply Plan, configuration et engagements restent distinctes.
      Le caractère collectif ou la fréquence ne créent pas une frontière rigide avec l'exécution.
  - proposed_name: Fulfillment Orchestration
    question_proposed: Comment organiser, suivre et adapter la réalisation des demandes dans les engagements retenus ?
    responsibility_proposed: Déterminer les prestations nécessaires, coordonner leur réalisation, suivre les résultats et
      traiter les écarts dans les marges autorisées.
    current_anchors:
    - D06.b
    - D06.d
    - D06.e
    - D06.f
    - D07.a
    - D07.b
    - D07.c
    - D07.d
    boundary: Un choix local de site ou un reroutage peut relever de l'adaptation de réalisation ; s'il modifie le partage
      des ressources ou une promesse, il mobilise aussi les responsables de couverture et d'engagement. Décider un split,
      modifier l'Order et réaliser plusieurs expéditions sont trois responsabilités différentes.
    preserve: La visibilité de capacité des prestations D06.b ne disparaît pas dans la visibilité de stock. Les exécutants
      réalisent les opérations physiques ; l'orchestration les coordonne.
    market_refs:
    - ELM602
    - ELM603
    - ELM363
    market_interpretation: Fluent réunit sourcing, limite de fractionnement et réaffectation après manque ; Oracle traite
      aussi le fulfillment lors du réexamen du carnet. Le mot fulfillment ne suffit donc pas à séparer décision et réalisation.
      Les documents Fluent sont deux documents distincts du même éditeur, sans preuve de consensus.
  cross_area_issues:
  - id: promise
    current_ids:
    - D15
    - D03.n
    - D03.i
    - D03.j
    - D03.k
    - D03.l
    question: Où calculer la faisabilité, choisir l'échéancier puis confirmer ou réviser une promesse ?
    recommendation: Rendre ces résultats visibles avant toute migration ; étudier Demand pour la tenue des engagements et
      l'articulation avec les décisions de couverture, sans fusion implicite.
  - id: shared_order_responsibilities
    current_ids:
    - D04.n
    - D04.o
    - D04.q
    - D04.k
    - D04.m
    question: Quel propriétaire unique pour la structuration, le cycle de vie et l'archivage communs, et pour les Orders ayant
      plusieurs effets ?
    recommendation: Un parent explicite par capacité ; coopérations qualifiées et lectures Demand/Supply liées à la même opération.
      Les préfixes des identifiants n'imposent pas les parents futurs.
  - id: non_inventory_resources
    current_ids:
    - D06.b
    - D14
    - D07.c
    question: Où restent les capacités opérationnelles et prestations nécessaires au respect des engagements ?
    recommendation: Conserver leur visibilité et leur mobilisation dans Fulfillment ; les ressources du Domain ne sont pas
      limitées aux quantités de produits.
clarifications_U585_U586:
  user_choices:
  - Séparer références importées et politiques dont Supply est maître.
  - Faire porter par le plan les adaptations d’achats, ventes et politiques, avec mobilisation CTP.
  - Revoir la maille de capacités ATP/CTP/PTP au profit des résultats métier.
  - Comprendre l’orchestration adaptative comme du case management.
  - Créer le type de capacité Policy.
  canonical_agreement_recording: 'Pas de nœud ou relation canonique ajouté ou requalifié : les accords de principe et de type
    sont consignés ici et dans MOD007 ; ne pas lier record_decision.py à des valeurs canoniques non présentées.'
  campaign_example: Lors d’une hausse eCommerce, le plan peut proposer de réviser une protection B2B, de compléter un achat
    et d’étaler une couverture. Les obligations de vente initiales restent traçables ; les réservations, engagements et règles
    d’autorisation déterminent les changements applicables. Policy porte la règle active ; les Orders et engagements sont
    mis à jour par leurs responsables.
  limits: Aucun mécanisme universel d’optimisation conjointe de tous les seuils démontré. Aucune auto-autorisation implicite
    du plan, aucun moteur CMMN ni déploiement Beaumanoir déduit.
  follow_up: Préciser les capacités par résultat métier et leurs parents, dont les responsables de priorité, admission des
    prestations et engagements ; classifier individuellement après présentation.
clarification_U587:
  catalog_scope: Prestations proposées par les fournisseurs, principalement logistiques mais aussi humaines ou numériques
    si elles concourent au Domain.
  policy_scope: Règles propres à Supply encadrant le recours aux fournisseurs et services, dont exclusions et plafonds en
    cas de difficultés.
  scope_boundary: D14 et TER075 couvrent déjà les prestations physiques, humaines ou numériques ; leur extension à un nouveau
    Domain n’est pas demandée.
  market_comparison_ref: CMP251
naming_review_U588:
  status: market_names_reviewed_no_rename_adopted
  question: Backing Service et Backing Service Policy sont-ils des noms de marché adaptés ?
  backing_service:
    observed_usage: Usage attesté Twelve-Factor et Microsoft en architecture applicative.
    flow_difference: TER075 étend le rôle à une prestation physique, humaine ou numérique concourant à une demande Supply
      ; les sources actuelles Field Service/Camunda rapprochent les fonctions sans attester le nom exact dans ce sens.
    assessment: Nom compréhensible dans notre convention, mais risque de lecture IT contraire à la clarification métier recherchée
      U583.
    source_refs:
    - ELM608
    - ELM609
  backing_service_policy:
    observed_usage: Les sources OTM attestent exclusions, Capacity Limits et Service Provider, pas le libellé composé Backing
      Service Policy.
    assessment: Fonctions documentées, intitulé de capacité FLOW non établi par ce corpus. Ne pas déduire une absence universelle
      d’usage.
    source_refs:
    - ELM606
    - ELM607
    - ELM610
  recommendation:
    service_object: Service
    provider_object: Service Provider
    catalog: Service Catalog
    policy_capability: Service Provider Policy
    qualification: Service Provider est attesté ; Service Provider Policy est un nom composé proposé pour FLOW, sans standard
      taxonomique revendiqué. Service désigne ici une prestation ; ne crée aucun nouveau nœud fournisseur ou catalogue de
      Commerce.
    benefit: Retirer Backing réduit l’ambiguïté logicielle ; Provider rend lisible le recours, l’exclusion et la limitation
      du prestataire.
    boundary: Préciser dans la définition les restrictions par prestation autant que par fournisseur, pour éviter une lecture
      limitée au blocage global du fournisseur.
    tradeoff: Service seul est générique ; le contexte Service Catalog et la définition de prestation doivent rester explicites.
  preservation: Le nom actuel Backing Service et la demande U587 restent tracés ; aucune mutation canonique ni remplacement
    de libellé dans la proposition avant nouvel arbitrage.
  comparison_ref: CMP252
boundary_assessment_U589:
  status: targeted_diagnostic_recommendations_not_adopted
  source_refs:
  - U589
  - U583
  - U585
  - U586
  - U587
  - U588
  - CMP253
  summary: Finalité du Domain claire ; sept axes d’Areas cohérents, mais attribution des décisions, des engagements et des
    Orders à plusieurs effets encore incomplète. Le découpage n’est pas stabilisé.
  domain:
    clear_intent: Maîtriser la satisfaction des besoins Supply, les ressources, les engagements et les politiques locales,
      puis coordonner les prestations jusqu’à leur résultat.
    external_boundaries: Les exécutants conservent la réalisation des prestations et leur fonctionnement interne. Les maîtres
      d’entreprise conservent leurs références ; le Domain en porte les projections de référence locales et maîtrise ses politiques
      propres.
    current_wording_gap:
      node: universe-supply
      field: scope
      finding: L’énoncé général sur les sources de vérité des référentiels toutes externes est trop large après U585 ; le
        borner aux références importées et rendre explicite la maîtrise des politiques locales. Ce point demande un alignement
        de description, pas une extension automatique du Domain.
    additional_known_gap:
      node: D14.a
      field: scope
      finding: La formule « pas de maître local » doit être clarifiée au regard d’U479, indépendamment des politiques maîtrisées
        par Supply.
  boundaries:
  - between:
    - Reference Management
    - Policy Management
    assessment: clear_in_principle
    finding: L’origine et la maîtrise séparent les références projetées de règles Supply propres. Une projection garde une
      autorité locale explicite.
    example: Le fournisseur propose une prestation ; Supply peut en interdire temporairement l’usage.
  - between:
    - Supply Management
    - Inventory Management
    assessment: clear_principle_operating_contract_to_specify
    finding: Supply tient l’apport attendu et son engagement ; Inventory établit les conséquences présentes et projetées sur
      le stock.
    example: Une réception attendue devient du stock constaté sans rester comptée deux fois.
    remaining: Définir quel fait transforme l’attendu en constaté et préserver transit, propriété et admissibilité.
  - between:
    - Demand Management
    - Supply Management
    assessment: open_structural_boundary
    finding: Demand et Supply sont deux rôles possibles du même Order ; une classification exclusive par type de document
      ne suffit pas.
    example: Un transfert crée une sortie au départ et une entrée à destination ; les retours ont aussi plusieurs effets.
    current_ids:
    - D04.k
    - D04.l
    - D04.m
    - D04.n
    - D04.o
    - D04.q
    recommendation: Définir un propriétaire de chaque responsabilité de tenue et de cycle de vie, avec des effets liés côté
      besoins et apports ; pas deux copies indépendantes ni duplication automatique des capacités communes.
  - between:
    - Policy Management
    - Supply & Demand Matching
    assessment: clear_principle_authority_contract_to_specify
    finding: Le plan peut recommander de changer une règle qu’il consomme ; son hypothèse ne devient pas immédiatement une
      politique active.
    example: Réviser l’enveloppe B2B au bénéfice d’une campagne eCommerce.
    recommendation: Préciser le champ de modifications autorisées et les conditions de mise en vigueur ; l’autorisation peut
      être humaine ou déléguée, sans nouveau passage manuel systématique.
  - between:
    - Supply & Demand Matching
    - Fulfillment Orchestration
    assessment: highest_remaining_ambiguity
    finding: Sourcing, choix de site, split et réaffectation apparaissent dans les deux périmètres. Planification contre temps
      réel ou avant contre après ne suffit pas à les attribuer.
    recommendation: Définir les décisions par leur résultat propre. Le plan compose la couverture ; le cas coordonne et adapte
      la réalisation, en mobilisant les décisions concernées lorsqu’il faut réarbitrer. Une décision réutilisée garde un propriétaire
      unique.
    current_ids:
    - D03.o
    - D06.d
    - D06.e
    - D06.f
    - D04.n
    remaining: Délimiter choix de couverture, choix de prestation et révision d’engagement sur des cas concrets avant de placer
      toutes les décisions.
  - between:
    - Demand Management
    - Supply & Demand Matching
    - Fulfillment Orchestration
    assessment: promise_ownership_unresolved
    finding: Quantité et date demandées, couverture jugée possible et engagement confirmé sont des résultats différents. La
      proposition n’a pas encore attribué tous les résultats aujourd’hui portés par D15.
    current_ids:
    - D15
    - D03.n
    - D03.i
    - D03.j
    - D03.k
    - D03.l
    recommendation: Examiner Demand pour la tenue de l’engagement et préserver les décisions de faisabilité et d’échéancier
      ; supprimer une maille ATP/CTP/PTP ne supprime pas ces responsabilités. Ce placement reste proposé.
  - between:
    - Inventory Management
    - Demand Management
    - Supply & Demand Matching
    assessment: reservation_placement_unresolved
    finding: La réservation bloque les usages concurrents d’une ressource ; elle est distincte du besoin, de l’affectation
      et de la promesse.
    current_ids:
    - D02.c
    - D02.e
    - D03.n
    recommendation: Attribuer sa tenue à un propriétaire et définir ses liens aux besoins et ressources ; ne pas la recréer
      dans chacune des Areas.
  cross_cutting_preservation:
  - Demand Planning D17.a et la prévision restante conservent un propriétaire à préciser dans Demand, sans double compte avec
    les commandes.
  - La capacité opérationnelle des prestations D06.b reste distincte du stock, de l’offre et des plafonds Policy.
  market_context:
    oracle_transfer: 'ELM601 relu le 22 septembre 2026 : le même Transfer Order porte demande et apport.'
    fluent_sourcing: 'ELM602 : lecture primaire indexée conservée du même jour ; nouvelle ouverture directe échouée. Sourcing
      et réaffectation après manque sont réunis dans une fonction produit, sans prescrire la frontière FLOW.'
