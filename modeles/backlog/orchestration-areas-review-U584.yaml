plan_fulfillment_boundary_U592:
  status: user_clarification_current_detailed_wording_proposed
  source_refs:
  - U591
  - U592
  - C114
  - CMP254
  user_rule: L’arbitrage modifie notamment le contenu des demandes tant qu’elles ne sont pas en cours d’exécution ; une commande
    ferme peut être désaffermie.
  supersedes: Le seuil de fermeté de la rédaction U591 et l’interprétation d’un retour automatique à l’arbitrage pour modifier
    une demande déjà en cours d’exécution.
  dimensions_distinguished:
  - Fermeté de la demande et engagement envers le client.
  - Protection contre réoptimisation.
  - Autorisation de prise en charge.
  - Début effectif de l’exécution.
  cases:
  - situation: Demande non ferme, pas en cours d’exécution
    responsibility: L’arbitrage peut en modifier le contenu dans les règles applicables.
  - situation: Demande ferme, pas en cours d’exécution
    responsibility: L’arbitrage peut encore en modifier le contenu et la désaffermir ; expliciter les conséquences sur l’engagement.
  - situation: Demande en cours d’exécution, article manquant
    responsibility: Fulfillment adapte le plan d’exécution. Le split des Logistic Orders et le suivi par la demande initiale
      restent le cas U591.
  preserved_case_ref: plan_fulfillment_boundary_U591.example
  guardrail: Possibilité de désaffermissement ne signifie ni automatisme ni absence de conséquence client. Ne pas rendre la
    demande immuable au seul motif qu’elle est ferme.
  remaining_details:
  - Le fait qui matérialise le début d’exécution et son lien à Order Release.
  - La maille pertinente lorsque seule une partie de la demande a commencé à être exécutée.
  - Les marges de reprise logistique et le traitement d’un engagement devenu impossible après début d’exécution.
  - La définition de Logistic Order et sa filiation avec la demande initiale et les commandes de prestation existantes.
  market_comparisons:
  - element_ref: ELM602
    source_title: Source Order Items
    source_url: https://docs.fluentcommerce.com/by-type/source-order-items
    consulted_on: '2026-09-22'
    source_version: Changed on 17 June 2026
    source_locator: How it Works ; Short-Pick Reallocation
    relationship: Recouvrement partiel
    similarities: Reprendre les seuls articles manquants depuis un autre lieu, avec limites de split.
    differences: Fonction de produit ; ne démontre pas le seuil ferme/exécutable ni le modèle Logistic Order proposé par Laurent.
    evidence_limits: Texte primaire indexé consulté ; ouverture directe en échec.
  - element_ref: ELM604
    source_title: Split or Substitute Fulfillment Lines
    source_url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/26a/fascp/fulfillment-line-splits-and-substitutions.html
    consulted_on: '2026-09-22'
    source_version: Oracle Fusion Cloud SCM 26A
    source_locator: Introduction ; Split a Warehouse ; Consider Dates
    relationship: Recouvrement partiel
    similarities: Fractionner les quantités entre entrepôts ou dates selon les permissions.
    differences: La page traite Promising, pas une reprise après échec ; le split peut servir plusieurs responsabilités.
    evidence_limits: Document primaire directement relu ; aucun consensus de frontière des Areas déduit.
  market_limit: Les deux documents primaires étayent split et re-sourcing ; ils ne démontrent ni cette règle universelle de
    frontière ni un droit inconditionnel de désaffermir.
  history_before_U592:
    plan_area:
      proposed_name: Supply & Demand Matching
      question_proposed: Comment couvrir les besoins et arbitrer les ressources, les priorités et les ajustements nécessaires
        ?
      responsibility_proposed: Construire et actualiser le plan de satisfaction et de ressources, et faire appliquer les ajustements
        autorisés aux demandes jusqu’à ce qu’elles soient fermes et exécutables. Mobiliser les décisions nécessaires aux achats,
        dates, quantités, fractionnements et révisions de politiques Supply.
      current_anchors:
      - D03.p
      - D03.m
      - D03.o
      - D02.e
      - D05.f
      - D05.a
      - D05.d
      - D05.e
      - D05.c
      - D05.g
      - D05.h
      - D05.i
      boundary: 'U585 retient la mobilisation de CTP dans ce travail. ATP/CTP/PTP restent des repères marché pour couverture,
        adaptation et arbitrage économique ; leur découpage n’est plus imposé à la proposition de capacités. Préserver ces
        résultats et les décisions spécialisées mobilisées par le plan. U591 précise la sortie vers Fulfillment : une demande
        ferme et exécutable. L’arbitrage ne conduit pas les prestations de son exécution ; la gestion durable des demandes
        et engagements garde ses responsabilités.'
      naming_recommendation: Garder Demand & Supply Optimization comme option préférée pour le périmètre large déjà discuté
        ; Matching exprime directement le rapprochement mais doit être défini assez largement si ce nom est retenu.
      market_refs:
      - ELM596
      - ELM363
      - ELM434
      - ELM604
      market_interpretation: Microsoft Master Planning calcule des besoins et génère des propositions d'apports ; Oracle Backlog
        Planning réexamine le carnet et répartit les apports selon les priorités. Les périmètres diffèrent ; ni Matching ni
        Optimization n'est établi ici comme nom universel d'Area.
      preserve: Les responsabilités de gestion du plan, décisions, Apply Plan, configuration et engagements restent distinctes.
        Le caractère collectif ou la fréquence ne créent pas une frontière rigide avec l'exécution. Les nouveaux apports restent
        des propositions tant qu’ils ne sont pas engagés ; une quantité partiellement couverte ne signifie pas réduction unilatérale
        de la demande initiale.
      boundary_source_refs:
      - U585
      - U591
      - CMP254
    fulfillment_area:
      proposed_name: Fulfillment Orchestration
      question_proposed: Comment organiser, suivre et adapter la réalisation des demandes dans les engagements retenus ?
      responsibility_proposed: Conduire l’exécution d’une demande ferme et exécutable et orchestrer les Services, principalement
        logistiques, jusqu’au résultat attendu. Adapter le plan d’exécution aux aléas, y compris pour traiter un article manquant
        depuis un autre entrepôt ; conserver le lien à la demande initiale et le suivi des Logistic Orders issus du split.
      current_anchors:
      - D06.b
      - D06.d
      - D06.e
      - D06.f
      - D07.a
      - D07.b
      - D07.c
      - D07.d
      boundary: 'U591 distingue l’arbitrage qui rend la demande ferme et exécutable de l’adaptation de son exécution. Un manque
        partiel peut être traité dans Fulfillment par split de la Logistic Order et reprise du seul article manquant depuis
        un autre entrepôt. La demande initiale porte le lien et le suivi des deux Logistic Orders. Proposition Codex : mobiliser
        à nouveau les responsables d’arbitrage ou d’engagement quand l’adaptation dépasse les marges autorisées ; préciser
        ces conditions, sans renvoyer automatiquement tout changement de site au plan.'
      preserve: La visibilité de capacité des prestations D06.b ne disparaît pas dans la visibilité de stock. Les exécutants
        réalisent les opérations physiques ; l'orchestration les coordonne.
      market_refs:
      - ELM602
      - ELM603
      - ELM363
      - ELM011
      - ELM605
      market_interpretation: Fluent réunit sourcing, limite de fractionnement et réaffectation après manque ; Oracle traite
        aussi le fulfillment lors du réexamen du carnet. Le mot fulfillment ne suffit donc pas à séparer décision et réalisation.
        Les documents Fluent sont deux documents distincts du même éditeur, sans preuve de consensus. U591 précise la frontière
        FLOW par la demande ferme et exécutable, tout en conservant l’adaptation de réalisation ; ELM602 étaye la reprise
        après manque et ELM604 montre que le split existe aussi lors de la promesse. Le split seul ne détermine donc pas l’Area
        responsable.
      case_management_U585: 'Orientation de Laurent rapprochée des principes établis du case management : contexte, résultat
        attendu, événements, critères, activités prévues ou discrétionnaires et décisions. Humain et automatique possibles
        ; ni notation ni moteur imposé.'
      boundary_source_refs:
      - U591
      - CMP254
  canonical_hierarchy_changed: false
terminology_adoption_U593:
  source_refs:
  - U593
  - U591
  - U592
  - CMP254
  - ELM602
  - ELM604
  author: Laurent
  date: '2026-09-22'
  interpretation: explicit
  approved_fields:
    name: Re-sourcing
  context: Reprise de la réalisation depuis une autre source, notamment un autre entrepôt pour le seul article manquant en
    cours d’exécution.
  definition_proposed: Rechercher et retenir une autre source pour réaliser ce qui reste à accomplir après un manque ou une
    impossibilité de la source initiale, selon les règles applicables.
  area_context: Fulfillment Orchestration
  boundary: Le choix d’une autre source, le split des Logistic Orders et le suivi des deux suites sont distincts. La demande
    initiale conserve leur rattachement.
  modeling_level: Capability ou Behavior à déterminer ; accord sur le terme sans création de nœud ni renommage de Process
    Adaptation Decision.
  canonical_hierarchy_changed: false
current_boundary_assessment_ref: remaining_boundaries_U594
remaining_boundaries_U594:
  status: updated_diagnostic_recommendations_not_adopted
  source_refs:
  - U594
  - U590
  - U591
  - U592
  - U593
  - CMP255
  summary: Frontière plan / Fulfillment clarifiée en principe ; responsabilités à attribuer pour les Orders à plusieurs effets,
    les engagements et la Logistic Order. Modalités opérationnelles à distinguer de ces choix structurants.
  clear_principles:
  - Références externes projetées et politiques maîtrisées par le Domain sont distinctes.
  - Service, Service Provider, Service Catalog et Service Provider Policy ont des rôles distincts.
  - L’arbitrage peut modifier le contenu avant début d’exécution, même pour une demande ferme.
  - Fulfillment conduit et adapte la réalisation ; Re-sourcing est le terme retenu pour une autre source.
  - Supply tient les apports attendus ; Inventory établit les états et mouvements, ainsi que leurs projections.
  structural_questions:
  - id: order_ownership
    boundary: Demand Management / Supply Management
    question: Quelle Area porte le cycle de vie de chaque famille d’Orders, notamment un Transfer Order qui représente demande
      au départ et apport à destination ?
    existing_ids:
    - D04.k
    - D04.n
    - D04.o
    - D04.q
    recommendation: Un responsable par cycle de vie et des effets partagés ; conserver une opération cohérente. Attribuer
      aussi structuration et archivage sans dupliquer automatiquement leurs capacités.
    evidence: ELM601 Oracle explicite les deux rôles dans un document ; cette donnée ne prescrit pas le parent FLOW.
  - id: commitment_ownership
    boundary: Demand Management / arbitrage / Fulfillment
    question: Quelle responsabilité maintient et révise l’engagement de quantité/date, en particulier si la réalisation ne
      peut plus le tenir ?
    existing_ids:
    - D03.n
    - D03.l
    - D15
    recommendation: Étudier Demand pour la tenue de l’engagement ; le plan prépare les ajustements avant exécution et Fulfillment
      fournit progression, prévisions et écarts. Une prévision de retard ne devient pas seule une nouvelle promesse. Ne pas
      autoriser implicitement l’arbitrage à réécrire une demande en cours.
    qualification: Attribution proposée, non adoptée ; la suppression de la maille commerciale ATP/CTP/PTP ne supprime pas
      les résultats métier.
  - id: logistic_order_responsibility
    boundary: Demande initiale / Fulfillment / commandes de prestation
    question: Quel périmètre exact pour Logistic Order, quelle responsabilité la tient, et quel lien avec les commandes de
      prestation existantes ?
    existing_ids:
    - D07.b
    - D04.n
    - D07.c
    established: La demande initiale porte le split et suit les deux suites U591 ; ne pas rouvrir ce principe.
    recommendation: Expliciter une mission logistique issue de la demande, orchestrée dans Fulfillment et reliée aux Services
      sollicités. Valider cette définition avant de fusionner ou créer une capacité ; Shipment ne vaut pas automatiquement
      Logistic Order.
    qualification: Définition détaillée et placement proposés ; aucun nouveau catalogue Informations.
  operating_details:
  - Quel fait marque le début d’exécution, à quelle maille en cas de réalisation partielle ?
  - Quelles marges autorisent re-sourcing, split et changement de prestataire ; quelle suite en cas d’impossibilité de tenir
    l’engagement ?
  - Comment une modification de Policy proposée par le plan devient-elle applicable, selon une autorisation humaine ou déléguée
    ?
  - Quels faits rapprochent les apports attendus des mouvements constatés, en préservant transit, propriété et disponibilité
    ?
  preserve_existing_placements_recommended:
  - id: D02.c
    name: Reservation
    current_parent: D01
    recommendation: Conserver Inventory Management ; préciser les coopérations avec demande et plan sans recréer la réservation
      dans chaque Area.
    correction_to_previous_diagnostic: U589 présentait son placement comme ouvert dans la proposition ; le parent canonique
      courant est déjà D01. Ce point ne justifie pas de nouveau blocage structurel.
    market_limit: ELM410 distingue protection de groupe et réservation liée à la transaction, sans prescrire ce parent de
      capacité.
  - id: D06.b
    name: Service Capacity Visibility
    current_parent: D06
    recommendation: Conserver sa responsabilité dans Fulfillment lors de la refonte ; le plan consomme cette visibilité. Offre
      de catalogue, capacité communiquée et plafond de Policy restent distincts.
  priority_recommended: Clarifier d’abord Demand / Supply sur le Transfer Order, car ce cas éprouve le partage des responsabilités
    de plusieurs familles.
  migration_status: Les sept Areas demeurent une proposition en annexe ; la migration du modèle canonique est un travail distinct
    du diagnostic, pas une preuve de flou métier.
  canonical_hierarchy_changed: false
  subsequent_clarification: U595 clarifie Demand pour Transfer Order et retours, ainsi que le pilotage de la promesse par
    les demandes. U596/U597 ouvrent l’étude de consignation stock client et AFS/Fashion ; ne pas présenter les deux premiers
    principes comme toujours indécis.
demand_supply_clarification_U595:
  source_refs:
  - U595
  - U596
  - U597
  - C115
  - CMP256
  - CMP257
  status: user_responsibility_clarified_order_taxonomy_under_study
  demand_rule: Demand porte besoins, exigences et promesse ; Transfer Order et retours sont des demandes, quelle que soit
    leur origine.
  clarified_previous_points:
  - remaining_boundaries_U594.structural_questions.order_ownership pour les transferts/retours
  - remaining_boundaries_U594.structural_questions.commitment_ownership dans son principe
  remaining: Découpage des demandes de consignation, autres familles non explicitement arbitrées et coopérations fines.
  study_ref: consignment-orders-market-review-U595.yaml
  history_before_U595:
    demand:
      proposed_name: Demand Management
      question_proposed: Quels besoins devons-nous satisfaire, avec quelles contraintes et quels engagements ?
      responsibility_proposed: Qualifier et suivre les besoins connus ou prévisionnels, leur échéance et leurs contraintes,
        en reliant commandes, demandes avant commande et prévision restante.
      current_anchors:
      - D04.i
      - D17.a
      - D04.k
      boundary: Une réservation liée à une commande est un engagement sur une ressource, pas un besoin supplémentaire à additionner.
        Une demande avant commande exige une identité et une règle de succession explicites.
      open_issue: Examiner ici la responsabilité de confirmer et réviser les engagements aujourd'hui dans D15 ; le parent
        d'ATP/CTP/PTP et du choix d'échéancier reste à préciser, sans tout absorber dans une capacité unique.
      market_refs:
      - ELM600
      - ELM411
      - ELM601
      market_interpretation: Microsoft distingue demande prévue et disponibilité après réservation ; Oracle montre qu'un transfert
        porte aussi une demande. Demand Management dépasse donc potentiellement les seules commandes ; l'intégration des prévisions
        est cohérente avec D17.a déjà existante.
    supply:
      proposed_name: Supply Management
      question_proposed: Quels apports attendons-nous, à quel endroit, à quelle date et avec quel niveau d'engagement ?
      responsibility_proposed: Prendre en charge et suivre les apports attendus, leurs évolutions et leurs engagements, issus
        notamment d'achats, de transferts et de retours clients admissibles.
      current_anchors:
      - D04.j
      - D04.k
      - D04.l
      - D04.r
      boundary: Distinguer proposition du plan, Order engagé et apport reçu. L'arbitrage du besoin d'un achat relève du plan
        ; la tenue de l'achat et de ses confirmations relève de la gestion de l'apport.
      preserve: Un retour fournisseur sort de la ressource ; il n'est pas un apport entrant par nature. Un retour client attendu
        n'est pas automatiquement disponible avant qualification. Les achats de prestations ne sont pas du stock.
      open_issue: Les capacités communes D04.n, D04.o et D04.q servent plusieurs familles d'Orders ; leurs propriétaires restent
        à déterminer sans duplication entre Demand et Supply.
      market_refs:
      - ELM601
      - ELM600
      - ELM596
      market_interpretation: Oracle distingue les deux effets du même transfert ; Microsoft sépare apports prévus et propositions
        du plan. Le regroupement métier FLOW est une interprétation, pas l'adoption d'un module logiciel.
  canonical_hierarchy_changed: false

service_task_order_clarification_U616:
  source_refs:
  - U616
  status: user_clarification_recorded_canonical_alignment_pending
  supersedes: 'remaining_boundaries_U594.structural_questions.logistic_order_responsibility : la mission logistique autonome
    proposée est remplacée par le pattern Service Order.'
  service_scope:
  - numérique, par exemple construction documentaire par API
  - physique, par exemple logistique ou douane
  - expertise et conseil
  task: Chaque appel de service est encapsulé dans une tâche de Fulfillment Orchestration.
  service_order: Document que la tâche peut générer pour qualifier et officialiser la demande de service, puis envoyer au
    Service Provider ; EDI est un exemple de support.
  logistic_order: Cas logistique du pattern générique Service Order ; aucune mission documentaire parallèle à créer par défaut.
  scope_resolution: La frontière Logistic Order / demandes de services est clarifiée en principe. Reste la mise en cohérence
    des capacités et descriptions existantes, notamment D07.b.
  limits:
  - La tâche et le document ne constituent pas de nouveaux niveaux de la hiérarchie des capacités.
  - Le Service Order reste facultatif ; aucun cycle universel, cardinalité documentaire ou protocole imposé.
  - La variété des services mobilisés ne rouvre pas le Domain Business Services retiré U472.
  market_comparison:
    status: existing_support_partial_no_new_market_consensus_claim
    source_refs:
    - CMP193
    - ELM397
    - ELM330
    support: Les comparaisons déjà consignées rapprochent les prestations de travail de Microsoft Field Service et la coordination
      des contributions humaines et informatiques de Camunda.
    limit: Elles appuient la diversité des contributions orchestrées, sans établir comme standard universel le document facultatif
      Service Order ni son articulation exacte avec la tâche. Ce pattern est ici la décision FLOW de Laurent.
  canonical_model_changed: false

task_governance_clarification_U617:
  source_refs:
  - U617
  - U616
  status: user_clarification_recorded_canonical_alignment_pending
  refines: service_task_order_clarification_U616.task
  definition: La tâche est un objet de gouvernance de Fulfillment Orchestration qui pilote la sollicitation et le suivi du
    service jusqu’à sa terminaison vérifiée.
  responsibilities:
  - Déclencher la sollicitation immédiatement, après un délai ou sur captation d’un événement.
  - Suivre l’exécution du service et assurer son tracking.
  - Relancer si nécessaire pour renforcer la robustesse ; pouvoir appeler un service de secours.
  - Vérifier la terminaison du service et terminer alors la tâche.
  document: Le Service Order reste le document éventuel de formalisation de la demande au Service Provider, conformément à
    U616.
  modeling_limits:
  - Objet gouverné par les capacités de Fulfillment Orchestration, sans nouveau niveau sous Behavior.
  - Aucun nombre de relances, délai, règle de secours ou protocole imposé.
  - La terminaison du service ne signifie pas implicitement que la demande métier entière est satisfaite.
  market_comparison:
    relationship: Appui méthodologique et recouvrement partiel ; aucune équivalence à une primitive normative unique.
    consulted_on: '2026-09-22'
    author: Codex
    status: documented_interpretation
    sources:
    - title: OMG — Case Management Model and Notation 1.1
      url: https://www.omg.org/spec/CMMN/1.1/PDF
      version: '1.1'
      locator: 'Table 5.39 (isBlocking), chapitre 8 : cycle de vie des tâches, entry criteria et ManualActivationRule'
      support: Conditions d’activation et cycle de vie ; une tâche bloquante attend la fin du travail associé.
      limit: CMMN permet aussi des tâches non bloquantes. Le suivi jusqu’à terminaison est le choix FLOW ; les sentries et
        règles entourent la tâche.
    - title: Camunda — Service tasks
      url: https://docs.camunda.io/docs/components/modeler/bpmn/service-tasks/
      version: 8.9, documentation évolutive
      locator: Introduction ; Task definition
      support: La tâche attend la complétion du job ; nombre de reprises configurable.
      limit: Sémantique produit des jobs ; le succès technique ne démontre pas seul la réalisation d’une prestation physique.
    - title: Camunda — Job workers
      url: https://docs.camunda.io/docs/components/concepts/job-workers/
      version: 8.9, documentation évolutive
      locator: Requesting jobs ; Failing jobs, retry back off
      support: Compte rendu de complétion ou échec, relances et délai entre tentatives.
      limit: Le service de secours et le tracking métier ne sont pas automatiquement fournis par une simple Service Task.
    flow_position: FLOW rassemble ces responsabilités dans un objet de gouvernance ; un modèle BPMN/CMMN peut les répartir
      entre tâches, événements, règles et chemins de reprise. Le périmètre métier ne prescrit pas leur réalisation technique.
  canonical_model_changed: false

