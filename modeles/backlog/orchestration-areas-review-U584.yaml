scope: Clarifier les Areas et leurs responsabilités métier, en conservant le Domain et son périmètre.
user_proposal_source: connaissance/01-contributions-utilisateur.md#U584
assessment:
  author: Codex
  conclusion: U618 maintient une seule Area pour les référentiels et les policies. La proposition de sept Areas avec séparation
    Reference Management / Policy Management est remplacée ; les deux rubriques ci-dessous conservent les responsabilités
    étudiées, sans constituer deux Areas cibles. Type de capacité et gouvernance restent deux dimensions distinctes.
  benefit: Séparer besoins, apports attendus, position de stock, arbitrages de couverture et coordination de réalisation.
  tradeoff: Demand et Supply sont aussi deux rôles d'un même transfert ; une carte de responsabilités doit conserver une tenue
    unique des Orders et de leurs engagements.
  market_position: Appuis fonctionnels et sémantiques partiels ; aucun document consulté ne prescrit ces six Areas comme taxonomie
    universelle.
  agreement_boundary: U584 est une proposition. Le nom cible Demand & Supply Optimization retenu U581 reste tracé ; Supply
    & Demand Matching est une alternative en examen, sans remplacement automatique.
  modeling_boundary: Les exemples de documents et fonctions ne deviennent pas chacun une capacité ; ni couches transactionnelle/processus,
    ni séquence rigide de six étapes.
areas:
- proposed_name: Reference Management
  question_proposed: Quelles références externes rendent les opérations Supply interprétables ?
  responsibility_proposed: Intégrer et maintenir les projections des références dont la maîtrise d’entreprise reste externe,
    et fournir leur version de référence locale au Domain.
  current_anchors:
  - business-references
  - D08
  - D09
  - D12
  - D16
  - D11
  - D13
  - D14
  boundary: U585 distingue ces projections des règles propres au Domain. Leur autorité locale U479 subsiste ; projection ne
    signifie pas cache passif. Les caractéristiques externes d’un service diffèrent de la politique locale de sa sollicitation.
  preserve: Les sept référentiels distincts, leur autorité locale U479 et les sources de vérité d'entreprise externes ; ni
    nouveau catalogue Information ni transfert de maîtrise globale.
  market_refs: []
  market_interpretation: Les appuis précédents documentent la configuration, pas le nom de cette Area de projections. La séparation
    par maîtrise vient de U585 ; aucune maîtrise produit ou entreprise nouvelle n’est déduite.
  naming_status: Nom Reference Management proposé par Codex ; séparation demandée U585, niveau de deux Areas proposé.
- proposed_name: Policy Management
  question_proposed: Quelles règles Supply maîtrisons-nous pour protéger stocks, demandes et prestations ?
  responsibility_proposed: Définir, maintenir et rendre applicables les règles, politiques et configurations métier dont le
    Domain porte la maîtrise, avec leur portée, leur validité et leurs conditions d’usage.
  current_anchors:
  - D02.b
  boundary: La maîtrise des politiques locales n’étend pas celle des référentiels externes ni la capacité physique des exécutants.
    Les décisions peuvent recommander une révision ; Policy rend le cadre retenu applicable.
  proposed_capability_nature: policy
  policy_families:
  - protection et droits d’usage du stock
  - priorité et protection des demandes
  - admissibilité des fournisseurs et de leurs Services, exclusions et limites de sollicitation
  market_refs:
  - ELM410
  - ELM603
  market_interpretation: Protections par groupes Microsoft et profils Fluent appuient la gestion de règles ; les trois familles
    et leur type de capacité restent une structuration FLOW. Ni une capacité par valeur ni une protection technique de WMS/TMS.
  naming_status: Policy Management est le terme de Laurent ; sa matérialisation comme Area distincte et les noms de capacités
    sont proposés.
  proposed_capabilities:
  - name: Service Provider Policy
    nature: policy
    proposed_parent: Policy Management
    status: name_adopted_detailed_wording_proposed
    user_requested_fields:
      name: Backing Service Policy
      nature: policy
    source_refs:
    - U587
    - U586
    - CMP251
    - U590
    - CMP252
    definition: Définir, maintenir et rendre applicables les règles de recours aux fournisseurs et à leurs Services, notamment
      les exclusions et les limites de sollicitation, afin de tenir compte de leur fiabilité et de leur situation opérationnelle.
    mastership: Supply Chain Orchestration maîtrise ces règles locales de recours ; l’offre de référence et les capacités
      opérationnelles communiquées restent distinctes.
    scope: Porter les autorisations, restrictions et exclusions applicables à un fournisseur ou une prestation, avec leur
      contexte, leur période et les conditions de révision. Des difficultés observées peuvent conduire à limiter les nouvelles
      sollicitations ou à suspendre le recours à un fournisseur selon les règles applicables. Les prestations sont surtout
      logistiques, sans restriction à ce secteur dans le Domain courant.
    example: 'Exemple fictif : un fournisseur annonce 1 000 préparations par jour. Des retards constatés conduisent Supply
      à plafonner ses nouvelles sollicitations à 200 sur une période. Le catalogue conserve l’offre et la visibilité conserve
      la capacité annoncée ; la règle locale limite les demandes admissibles.'
    boundaries:
    - Le catalogue décrit ce que le fournisseur propose ; une présence au catalogue ne vaut pas autorisation de recours.
    - Les observations de difficulté et de capacité sont des faits contextualisés ; elles ne deviennent une interdiction ou
      un plafond que selon une règle ou une décision autorisée, humaine ou automatisée.
    - Une limite de sollicitation Supply ne modifie pas la capacité physique du fournisseur et ne suffit pas à calculer une
      capacité restante.
    - L’exclusion peut concerner un fournisseur entier ou un périmètre de prestation à préciser ; ni suppression du fournisseur
      du référentiel ni interdiction d’entreprise globale implicite.
    - Les prestations déjà acceptées gardent leurs engagements ; leur modification ou annulation passe par les responsables
      concernés. Bloquer les nouvelles sollicitations ne les annule pas.
    - 'Les noms WMS/TMS ne deviennent pas des capacités : la politique concerne le recours aux prestations, non l’administration
      technique des outils.'
    field_qualification:
      requested_by_user:
      - name
      - nature
      - principe d’exclusion fournisseur
      - principe de limitation des commandes face aux difficultés
      proposed_by_codex:
