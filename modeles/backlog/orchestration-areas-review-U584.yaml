      boundary: U585 retient la mobilisation de CTP dans ce travail. ATP/CTP/PTP restent des repères marché pour couverture,
        adaptation et arbitrage économique ; leur découpage n’est plus imposé à la proposition de capacités. Préserver ces
        résultats et les décisions spécialisées mobilisées par le plan.
      naming_recommendation: Garder Demand & Supply Optimization comme option préférée pour le périmètre large déjà discuté
