      market_refs:
      - ELM596
      - ELM363
      - ELM434
      - ELM604
      market_interpretation: Microsoft Master Planning calcule des besoins et génère des propositions d'apports ; Oracle Backlog
        Planning réexamine le carnet et répartit les apports selon les priorités. Les périmètres diffèrent ; ni Matching ni
        Optimization n'est établi ici comme nom universel d'Area.
      preserve: Les responsabilités de gestion du plan, décisions, Apply Plan, configuration et engagements restent distinctes.
        Le caractère collectif ou la fréquence ne créent pas une frontière rigide avec l'exécution. Les nouveaux apports restent
        des propositions tant qu’ils ne sont pas engagés ; une quantité partiellement couverte ne signifie pas réduction unilatérale
        de la demande initiale.
    fulfillment_area:
      proposed_name: Fulfillment Orchestration
      question_proposed: Comment organiser, suivre et adapter la réalisation des demandes dans les engagements retenus ?
      responsibility_proposed: Conduire la réalisation d’une demande vers son résultat, en tenant le contexte du dossier,
        ses engagements et événements, et en adaptant les activités et prestations permises.
      current_anchors:
      - D06.b
      - D06.d
      - D06.e
      - D06.f
      - D07.a
      - D07.b
      - D07.c
      - D07.d
      boundary: Un choix local de site ou un reroutage peut relever de l'adaptation de réalisation ; s'il modifie le partage
        des ressources ou une promesse, il mobilise aussi les responsables de couverture et d'engagement. Décider un split,
        modifier l'Order et réaliser plusieurs expéditions sont trois responsabilités différentes.
      preserve: La visibilité de capacité des prestations D06.b ne disparaît pas dans la visibilité de stock. Les exécutants
        réalisent les opérations physiques ; l'orchestration les coordonne.
      market_refs:
      - ELM602
      - ELM603
      - ELM363
      - ELM011
      - ELM605
      market_interpretation: Fluent réunit sourcing, limite de fractionnement et réaffectation après manque ; Oracle traite
        aussi le fulfillment lors du réexamen du carnet. Le mot fulfillment ne suffit donc pas à séparer décision et réalisation.
        Les documents Fluent sont deux documents distincts du même éditeur, sans preuve de consensus.
      case_management_U585: 'Orientation de Laurent rapprochée des principes établis du case management : contexte, résultat
        attendu, événements, critères, activités prévues ou discrétionnaires et décisions. Humain et automatique possibles
        ; ni notation ni moteur imposé.'
  user_statements:
    plan_result: Retoucher les demandes jusqu’à ce qu’elles soient fermes et exécutables.
    fulfillment_result: Exécuter la demande et orchestrer les services, essentiellement logistiques.
    execution_adaptation: Adapter le plan d’exécution et retenter un shipment depuis un autre entrepôt pour le seul article
      manquant.
    split_and_tracking: La demande initiale splitte la Logistic Order en deux et suit le déroulement des deux.
  interpretation:
    two_plans: Le plan de satisfaction prépare les demandes à l’exécution ; le plan d’exécution organise et adapte les prestations
      qui réalisent une demande.
    firmness: Une demande ferme n’impose pas un parcours logistique immuable. Les règles précises de modification de la demande
      et de son engagement restent distinctes de son adaptation opérationnelle.
    ownership: La demande initiale reste le point de rattachement et de consolidation. La décision d’adaptation, la structuration
      des Orders et le suivi coopèrent ; leur parent canonique détaillé n’est pas déduit automatiquement.
    external_execution: Fulfillment conduit la réalisation ; les exécutants réalisent les opérations physiques et conservent
      leur fonctionnement interne.
  example:
    qualification: Illustration Codex du cas donné par Laurent, sans observation Beaumanoir.
    initial: La demande D porte les articles A et B, à réaliser depuis l’entrepôt E1.
    event: A peut partir ; B manque lors de la préparation.
    adaptation: 'La Logistic Order est répartie en deux suites liées à D : A depuis E1 et B depuis E2 selon les possibilités
      et règles applicables.'
    tracking: D conserve le suivi de chaque suite et du reste à réaliser ; la réussite du premier shipment ne suffit pas à
      déclarer toute la demande satisfaite.
    invariants_proposed:
    - Ne pas redemander les quantités déjà réalisées.
    - Ne pas compter deux fois la quantité reprise.
    - Conserver la filiation et les engagements applicables aux deux suites.
  return_to_arbitration_proposed:
    criterion: L’adaptation dépasse les marges autorisées de réalisation.
    examples:
    - Révision nécessaire de la quantité ou de la date engagée.
    - Ressource indisponible sans réarbitrage de priorité entre demandes.
    - Modification nécessaire d’une protection ou d’une politique hors délégation.
    qualification: Recommandation Codex à préciser ; aucun seuil, contrôle humain systématique ou règle universelle adopté.
  remaining_questions:
  - Quels critères rendent une demande ferme et exécutable, et comment se rattachent-ils à Order Release ?
  - Quelles marges d’adaptation sont autorisées et quels effets nécessitent un réarbitrage ?
  - Quelle définition et quelle filiation précises pour Logistic Order, distincte de Shipment et à rapprocher des commandes
    de prestation existantes ?
