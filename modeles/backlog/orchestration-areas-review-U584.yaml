      definition: Définir, maintenir et rendre applicables les règles de recours aux fournisseurs et à leurs Backing Services,
        notamment les exclusions et les limites de sollicitation, afin de tenir compte de leur fiabilité et de leur situation
        opérationnelle.
      mastership: Supply Chain Orchestration maîtrise ces règles locales de recours ; l’offre de référence et les capacités
        opérationnelles communiquées restent distinctes.
      scope: Porter les autorisations, restrictions et exclusions applicables à un fournisseur ou une prestation, avec leur
        contexte, leur période et les conditions de révision. Des difficultés observées peuvent conduire à limiter les nouvelles
        sollicitations ou à suspendre le recours à un fournisseur selon les règles applicables. Les prestations sont surtout
        logistiques, sans restriction à ce secteur dans le Domain courant.
      example: 'Exemple fictif : un fournisseur annonce 1 000 préparations par jour. Des retards constatés conduisent Supply
        à plafonner ses nouvelles sollicitations à 200 sur une période. Le catalogue conserve l’offre et la visibilité conserve
        la capacité annoncée ; la règle locale limite les demandes admissibles.'
      boundaries:
      - Le catalogue décrit ce que le fournisseur propose ; une présence au catalogue ne vaut pas autorisation de recours.
      - Les observations de difficulté et de capacité sont des faits contextualisés ; elles ne deviennent une interdiction
        ou un plafond que selon une règle ou une décision autorisée, humaine ou automatisée.
      - Une limite de sollicitation Supply ne modifie pas la capacité physique du fournisseur et ne suffit pas à calculer
        une capacité restante.
      - L’exclusion peut concerner un fournisseur entier ou un périmètre de prestation à préciser ; ni suppression du fournisseur
        du référentiel ni interdiction d’entreprise globale implicite.
      - Les prestations déjà acceptées gardent leurs engagements ; leur modification ou annulation passe par les responsables
        concernés. Bloquer les nouvelles sollicitations ne les annule pas.
      - 'Les noms WMS/TMS ne deviennent pas des capacités : la politique concerne le recours aux prestations, non l’administration
        technique des outils.'
