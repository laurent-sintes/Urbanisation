  rejected_name: Demand & Supply Orchestration
  principle: Orchestrer la supply pour répondre à la demande ; ne pas évoquer deux mondes orchestrés.
  scope: Accord U646 conservé historiquement ; définition et responsabilités non annulées par extension. Aucun nouveau nom
    appliqué.
resolution_U650:
  status: applied_scoped_agreement
  source_refs:
  - U647
  - U648
  - U649
  - U650
  name: Supply Chain Orchestration
  definition: 'La Supply Chain Orchestration est l’organe de régulation qui organise et adapte les ressources et les prestations
    pour satisfaire la demande : elle arbitre les priorités, les affectations et les apports, fait appliquer les changements
    nécessaires aux commandes et aux engagements, puis coordonne les prestations et suit leurs résultats.'
  replaces: Nom et définition U646 ; l’accord antérieur reste une preuve historique.
  market_comparison: ELM551 et ELM647, déjà consultés, étayent le nom et le lien entre planification et réalisation. Chain
    exprime ici les dépendances entre ressources, engagements et prestations. La métaphore biologique est un choix FLOW, sans
    architecture imposée.
  boundary: Faire appliquer les changements auprès des responsables ; coordonner les prestations sans confondre application
    transactionnelle et réalisation physique.
