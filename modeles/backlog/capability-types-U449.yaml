id: flow-capability-types-U449
source_refs: [U449, U435, CMP169, ELM259]
field: fields.nature
scope: Une nature principale explicite par capacité, selon le résultat métier dominant. Aucun nouveau niveau ni reclassement des couches.
review:
  state: partial
  adopted_scope: Typage exhaustif, icônes par type, décisions à la fin et séparation visuelle U449.
  proposed_scope: Définitions de la grille et dix qualifications complétées par Codex ; les 37 natures antérieures gardent leur statut propre.
types:
- id: action
  name: Action
  label_fr: Action
  definition: Effectuer une opération métier ou matérialiser une évolution autorisée des données et engagements.
  boundary: Mobiliser les décisions nécessaires sans s’approprier leur choix ; aucune réalisation physique systématique.
- id: management
  name: Management
  label_fr: Gestion
  definition: Maintenir dans la durée un ensemble cohérent de règles, états, engagements ou obligations et gouverner ses évolutions.
  boundary: Recoupe des actions ; la nature dominante est la tenue cohérente dans le temps. Ne pas l’inférer du mot Management dans un nom.
- id: knowledge
  name: Knowledge
  label_fr: Connaissance / visibilité
  definition: Établir, actualiser et rendre accessible une connaissance fiable des états, faits et résultats attendus.
  boundary: La connaissance peut être calculée ; choisir une réponse métier relève d’une décision distincte.
- id: orchestration
  name: Orchestration
  label_fr: Orchestration
  definition: Coordonner les prestations, leurs dépendances et leur progression dans un processus.
  boundary: Distinguer coordination, choix d’adaptation et réalisation des prestations.
- id: planning
  name: Planning
  label_fr: Planification
  definition: Construire, comparer et maintenir des scénarios en mobilisant les décisions spécialisées.
  boundary: Les décisions gardent leur résultat propre ; planifier ne signifie pas appliquer toutes les opérations du scénario.
- id: decision
  name: Decision
  label_fr: Décision
  definition: Déterminer une réponse métier à partir des faits, règles, objectifs et contraintes applicables, en incluant les calculs nécessaires.
  boundary: Aucune assimilation à un nom contenant Decision ni à un traitement automatisé ; application transactionnelle distincte.
presentation:
  order: Partition stable des capacités de chaque domaine ou référentiel ; non-décisions puis décisions, ordre relatif conservé dans chaque partie.
  separator: Une ligne horizontale légère seulement quand les deux parties sont présentes ; aucun séparateur devant un groupe vide.
  legacy: Un type absent dans une ancienne publication reste non renseigné. Aucune déduction du nom, de l’identifiant ou du backlog.
  publication: Les dix compléments du backlog attendent une prochaine release ; Atlas utilise uniquement la publication sélectionnée.
market_comparisons:
- vendor: OMG
  product: Decision Model and Notation
  element_name: Complementarity of DMN, BPMN and CMMN
  element_type: Principe méthodologique
  relationship: Appui méthodologique
  similarities: Distinguer la décision métier de la coordination du processus qui la mobilise.
  differences: DMN décrit les décisions et règles ; il ne prescrit ni ces six types de capacités ni les icônes et l’ordre de lecture FLOW.
  flow_position: Conserver les six natures déjà présentes et compléter les absences ; grille principale de lecture, sans taxonomie universelle revendiquée.
  source_title: Decision Model and Notation — OMG
  source_url: https://www.omg.org/dmn/
  source_version: Page de présentation évolutive, aucune version précise de spécification utilisée.
  consulted_on: '2026-09-19'
  source_locator: Présentation, complémentarité avec BPMN et CMMN.
  evidence_limits: Texte primaire ouvert ; appui méthodologique, pas preuve de classification individuelle ni de réalisation installée. Synthèse originale sans reproduction.
  source_refs: [MKT43, ELM259, CMP169]
  status: proposed
