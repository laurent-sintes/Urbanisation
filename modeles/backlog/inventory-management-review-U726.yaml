category_proposal_U732:
  status: applied_U733
  integration_direction: Réintégration appliquée U733.
  categories:
  - name: Inventory Foundation
    meaning: Établir et fiabiliser la référence locale, ses mouvements, régimes et engagements de quantité.
    capabilities:
    - Inventory Tracking
    - Inventory Ledger
    - Stocktaking
    - Reservation
    - Inventory Ownership Transfer
    naming_evidence: Libellé de classement FLOW ; pas une catégorie attestée universelle chez les éditeurs.
  - name: Availability & Promising
    meaning: Composer les vues du stock et des apports, puis calculer les possibilités de satisfaction et leurs conditions.
    capabilities:
    - Inventory Visibility
    - Supply Visibility
    - ATP
    - CTP
    - PTP
    naming_evidence: Availability et Order Promising sont des termes attestés ; leur association en catégorie est un choix
      FLOW.
  market_comparison:
    Microsoft: ELM734 réunit ingestion, positions, réservations et ATP ; ELM727 expose le prolongement aux capacités avec
      CTP. Appui fort au rapprochement Visibility/ATP, pas preuve que CTP/PTP sont inclus dans ce produit.
    Oracle: ELM736 documente le registre des transactions ; ELM726 situe exploration de disponibilité, substitutions et transport
      dans Global Order Promising. Appui aux deux responsabilités, mais regroupement produit distinct de la cible FLOW.
    conclusion: Regroupement en deux catégories plus lisible dans FLOW, compatible avec des périmètres du marché mais non
      imposé par un consensus.
  remaining_scope: 'PTP est actuellement une sélection : séparer évaluation Knowledge et choix. Delivery Schedule Decision
    et toute sélection précédemment portée par D18 doivent avoir une destination explicite. La source de vérité centrale est
