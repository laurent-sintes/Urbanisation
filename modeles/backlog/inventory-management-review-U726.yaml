- id: D01.f
  current_name: Inventory Tracking
  current_nature: integration
  proposed_name: Inventory Tracking
  proposed_nature: integration
  proposed_definition: Capter et intégrer les faits et états de stock transmis par les sources, avec leur origine, leur date
    et les corrections associées.
  recommendation: Capter, rapprocher et intégrer faits, états reçus et corrections ; supprimer la responsabilité obsolète
    de calcul de position. Operations Tracking peut être une source, sans passage obligatoire ni deuxième comptage du fait.
  market_sources:
  - ELM734
  - ELM738
  market_relation: Recouvrement partiel ; nom et typage FLOW recommandés, non imposés par les éditeurs.
  existing_behaviors: []
- id: D01.g
  current_name: Record Inventory Movements
  current_nature: action
  proposed_name: Inventory Ledger
  proposed_nature: knowledge
  proposed_definition: Établir, conserver et rendre consultable l’historique fiable des variations de stock, de statut et
    de propriété, avec leurs dates, origines et justifications.
  recommendation: Renommer et retyper. Tenir le registre métier des effets reconnus et leurs justifications, avec autorité
    locale. Knowledge établit et actualise des faits, ne signifie pas lecture seule. Ledger ne décide pas de l’ajustement,
    du transfert de propriété ou d’un droit de destruction. Ne pas confondre avec General Ledger ou journal technique.
  market_sources:
  - ELM736
  - ELM737
  market_relation: Recouvrement partiel ; nom et typage FLOW recommandés, non imposés par les éditeurs.
  existing_behaviors: []
- id: D01.c
  current_name: Inventory Visibility
  current_nature: knowledge
  proposed_name: Inventory Visibility
  proposed_nature: knowledge
  proposed_definition: Restituer les positions actuelles et projetées du stock par article, lieu, état, propriétaire et détenteur,
    avec les engagements de quantité, leur provenance et leur fraîcheur.
  recommendation: Conserver les positions actuelles et projetées, clairement séparées ; consommer Ledger, réservations, besoins
    et apports qualifiés. Les projections sont des soldes sous hypothèses, jamais une nouvelle promesse.
  market_sources:
  - ELM734
  - ELM745
  market_relation: Recouvrement partiel ; nom et typage FLOW recommandés, non imposés par les éditeurs.
  existing_behaviors: []
- id: D01.d
  current_name: Stocktaking
  current_nature: action
  proposed_name: Stocktaking
  proposed_nature: action
  proposed_definition: Organiser les vérifications de stock, rapprocher les quantités constatées et enregistrées et établir
    les corrections justifiées.
  recommendation: Conserver les trois variantes Periodic Physical Inventory, Cycle Counting, Spot Counting. Contrôle et acceptation
    des écarts restent ici, exécution physique chez les exécutants. Corriger les références à Tracking calculant l’état.
  market_sources:
  - ELM741
  - ELM742
  market_relation: Recouvrement partiel ; nom et typage FLOW recommandés, non imposés par les éditeurs.
  existing_behaviors:
  - BHV029
  - BHV030
  - BHV031
- id: D02.c
  current_name: Reservation
  current_nature: action
  proposed_name: Reservation
  proposed_nature: action
  proposed_definition: Établir et tenir un engagement de quantité pour un besoin identifié, dont les usages concurrents doivent
    tenir compte.
  recommendation: Conserver ; Matching affecte, Reservation rend un engagement opposable aux usages concurrents. Expliciter
    création, révision, libération, consommation et expiration conditionnelles sans nouveaux Behaviors CRUD ni paramètres
    imposés. Peut être sollicitée par le parcours de commande rapide sans recalcul global du Matching.
  market_sources:
  - ELM743
  - ELM744
  market_relation: Recouvrement partiel ; nom et typage FLOW recommandés, non imposés par les éditeurs.
  existing_behaviors: []
- id: D01.h
  current_name: Consigned Inventory Management
  current_nature: management
  proposed_name: Inventory Ownership Transfer
  proposed_nature: action
  proposed_definition: Appliquer un changement de propriétaire autorisé aux quantités concernées, selon l’accord et le fait
    déclencheur, en conservant les preuves et les liens aux actes associés.
  recommendation: 'Remplacer le regroupement par régime par une responsabilité ciblée. Préserver BHV063 Consumption-Based
    Ownership Transfer et BHV064 Aging-Based Ownership Transfer. Redistribution de BHV065 Consignment Exit : choix du devenir
    dans Matching, demandes dans Orders, orchestration dans Fulfilment, faits et états dans Ledger/Visibility. Ne pas déplacer
    ce Behavior entier sous une capacité sans en revoir la portée.'
  market_sources:
  - ELM739
  - ELM740
  market_relation: Recouvrement partiel ; nom et typage FLOW recommandés, non imposés par les éditeurs.
  existing_behaviors:
  - BHV063
  - BHV064
  - BHV065
findings:
- Tracking est déjà Integration mais REL-NEEDS-U290-002 va de Tracking consommateur vers Movements fournisseur ; le scope
  Movements fournit encore à Tracking, et BHV029–031 lui attribuent l’état. Incohérence U717, pas doublon de responsabilité
  nécessaire.
- REL-NEEDS-U290-006 demande à Tracking un état et des ressources futures. Cibler Ledger pour les faits et Supply Visibility
  pour les apports ; compléter le contrat Tracking → Ledger → Visibility sans imposer une architecture technique.
- Consigned Inventory Management mélange régime de stock, application contractuelle, acquisition, sortie, devenir et coordination.
  La fin de Fill-up ne termine pas les obligations liées au stock ; suppression sèche ferait perdre BHV063/064.
- Propriétaire, détenteur, emplacement, état qualitatif, droit d’usage, réservation et affectation sont des dimensions distinctes.
  Consignation entrante, stock propre chez un tiers et stock client détenu ne sont pas interchangeables ; un client déposant
  ne devient pas fournisseur.
- 'Un solde externe est aussi intégrable : fixer sa portée et sa date de référence sans fabriquer une suite de mouvements
  inconnus ; une correction documentaire ne simule pas une sortie physique.'
- Inspection Order porte actuellement la conformité/état, pas explicitement une prestation autonome de comptage. Stocktaking
  reste la responsabilité métier ; une Counting Order dédiée est une piste séparée à instruire si la demande physique doit
  être contractualisée comme service, non une création incluse.
- 'MOD007 liste encore sept types alors qu’Integration est appliqué : dette de documentation méthodologique repérée, hors
  modification automatique de cet audit.'
visibility_and_promising:
  current_overlap: Inventory Visibility inclut les positions projetées ; Supply Visibility porte les ressources attendues.
    Le contraste présent/futur seul serait faux.
  inventory_visibility: 'Question : combien et dans quel état, à quel endroit et à quelle date ? Solde consolidé sous dimensions
    et hypothèses explicites.'
  supply_visibility: 'Question : quels apports attendus, issus de quelles demandes ou plans, où, quand et avec quelle certitude
    ? Provenance, confirmation, réalisation partielle et reliquat par apport. Le stock déjà présent reste dans Inventory Visibility
    ; les apports transformés en faits ne subsistent pas comme attendus.'
  promising: 'Question : quelle quantité/date/solution peut-on proposer à CET Order selon ses exigences, protections, ressources
    et conditions économiques ? Consomme les deux vues, sans détenir les Orders ni les stocks.'
  example: 70 pièces présentes, 20 réservées ; achat attendu de 30 vendredi. Ledger explique les 70, Inventory Visibility
    expose 70 et 20 séparément ; Supply Visibility qualifie les 30, leur origine et leur ETA. Promising étudie la possibilité
    de servir 60 vendredi avec le délai de préparation et de transport. 70+30-20=80 est une illustration simplifiée de position
    nette, pas une garantie de livraison.
  market: Microsoft Inventory Visibility regroupe ATP, réservations et états dans un produit (ELM734) ; Microsoft Order promising
    distingue ATP et CTP avec capacités et transport (ELM727). Oracle Check Availability explore dates, substitutions et transport
    dans Global Order Promising (ELM726). Ni regroupement unique ni frontière universelle.
  recommendation: 'U730 remplace la recommandation antérieure de maintien de D18 : réintégrer Order Promising dans Inventory
    Management. Deux catégories proposées U731/U732 : Inventory Foundation et Availability & Promising. Le choix de réponse,
    les arbitrages et l’engagement restent à distribuer explicitement ; pas de perte des responsabilités lors du déplacement.'
  evidence:
  - ELM734
  - ELM745
  - ELM726
  - ELM727
  classification_reassessment_U728:
    principle: Knowledge établit et actualise des faits ou possibilités, y compris calculés et conditionnels. Decision choisit
      ou recommande une réponse en arbitrant. Une condition ou un seuil consommé ne transforme pas nécessairement un résultat
      en arbitrage.
    ATP: 'Le scope actuel ne réserve, n’affecte et ne confirme pas. Proposition : Knowledge pour la disponibilité promettable
      par quantités et dates dans les contraintes données.'
    CTP: 'Le scope actuel évalue les capacités supplémentaires et hypothèses sans les engager ni réviser Matching. Proposition
      : Knowledge pour les possibilités conditionnelles. Si CTP est chargé de sélectionner et engager un nouveau scénario
      de production/approvisionnement, ce périmètre dépasse cette visibilité.'
    PTP: La définition actuelle dit comparer et sélectionner ; le type Decision est cohérent avec cette rédaction. Une variante
      Knowledge évaluerait coût, marge ou admissibilité économique des possibilités, sans sélectionner. Le choix doit alors
      être repris explicitement dans les décisions de promesse et de Matching ; aucun transfert silencieux.
    decision_vs_commitment: Choisir une option et confirmer un engagement restent distincts. Une décision peut rester une
      recommandation ; absence de réservation ou de confirmation ne suffit pas seule à démontrer Knowledge.
    market_limits: Microsoft distingue ATP calcul de quantités/dates et CTP prenant en compte les capacités (ELM727) ; son
      Inventory Visibility contient ATP (ELM734). Oracle Check Availability explore des options (ELM726). Ces documents appuient
      les responsabilités, pas une classification universelle ATP/CTP/PTP comme Knowledge.
    proposal_state: ATP/CTP Knowledge recommandés ; PTP Knowledge possible avec changement explicite de portée à discuter.
      Le rôle dominant de D18 et son éventuel nom devront suivre la portée finalement retenue.
boundaries:
  Master Data: Identités, lieux, accords et tarifs ; conditions contractuelles de référence, sans transfert de maîtrise entreprise.
  Policies: Conditions actives d’usage et de réservation ; règles de consignation issues des accords, sans une Policy par
    régime imposée.
  Plan Visibility: Plans reçus externes, séparés des faits ; passage prévision → Order → attente → réception sans double compte.
  Order Management: Demandes entrantes, achats, transferts, consignation et retours ; engagements, dates et quantités confirmées.
    Une demande ne vaut ni mouvement ni propriété.
  Service Order Management: Demandes de prestations et leurs engagements ; ni registre de stock ni décision d’ajustement.
  Demand & Supply Matching: Affectations et arbitrages globaux, décisions de devenir ; demande de réservation sans réservation
    implicite.
  Fulfilment Orchestration: Coordination et suivi des prestations externes. Service Reconciliation rapproche prestation attendue/réalisée
    ; Stocktaking rapproche compté/enregistré. Notifications de fin et effets de stock distingués.
  Order Promising: 'U730 : périmètre à réintégrer dans Inventory Management, non sous-domaine autonome cible ; calculer les
    possibilités, sans confirmer la promesse de l’Order ni réarbitrer les affectations de Matching.'
  Commerce et Finance externes: Autorité commerciale, acquisition selon accord, valorisation comptable, facture et règlement
    ; Inventory fournit les faits sans absorber ces responsabilités. Le transfert autorisé peut être exécuté ailleurs puis
    intégré ; aucun double transfert.
