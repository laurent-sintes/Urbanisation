confirmation_vs_assignment_U740:
  status: clarification_recorded
  source_refs:
  - U740
  - ELM749
  - ELM750
  - ELM756
  distinction: 'Promesse : quantité/date pour une demande ; affectation : liens entre ressources identifiées et demandes.
    Les résultats peuvent changer indépendamment dans les contraintes applicables.'
  market: BOP peut utiliser ATP ou Supply Assignment comme méthode de contrôle selon les variantes SAP. L’opposition porte
    donc sur les résultats métier, pas sur deux moteurs étanches.
  flow: Availability & Promising établit et sélectionne les possibilités de réponse ; Order Management confirme/révise les
    engagements. Matching décide et applique les affectations. Allocation ne vaut pas réservation au sens FLOW.
  correction: La recommandation U738/U739 d’absorber le réexamen dans Simulation & Analysis / Adjust Plan ne concerne que
    les révisions d’affectations et leur analyse collective ; elle ne doit pas absorber tout recalcul ou réexamen de promesse.
    Le déplacement U736 de BHV077 reste cohérent pour les impacts inter-commandes ; aucune assimilation au BOP complet.
  example: Changer la source affectée tout en conservant 100 vendredi ; ou réexaminer une date proposée sans avoir encore
    fixé une source précise. Aucun engagement irréalisable ni double consommation permis.
