oms_comparison_U371:
  status: discussion_not_adoption
  source_refs:
  - U371
  conclusion: Même principe de coordination des décisions, engagements et exécution ; périmètres et responsabilités variables
    selon les offres. OMS est une catégorie de systèmes centrée sur les commandes clients ; Supply Chain Orchestration peut
    coordonner aussi achats, transferts et besoins de stock indépendants des ventes unitaires.
  boundary: Ne pas définir OMS comme strictement B2C ou incapable de traiter des achats ; ne pas confondre même principe avec
    catalogue identique ou logiciel unique.
  market_comparisons:
  - vendor: Microsoft
    element_name: Intelligent Order Management overview
    element_type: Périmètre produit
    relationship: Appui sémantique
    similarities: Orchestration des commandes entre systèmes et partenaires.
    differences: 'B2C, D2C et B2B explicitement décrits : aucune limite B2C universelle.'
    source_url: https://learn.microsoft.com/en-us/dynamics365/intelligent-order-management/overview
    source_version: Documentation évolutive, mise à jour affichée 29 janvier 2026
    source_locator: Introduction
