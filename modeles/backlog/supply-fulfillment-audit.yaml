universe_review_U369:
  status: historical_proposal_reexamined_U370
  target_id: universe-supply
  proposed_name: Supply Chain Management
  definition: Piloter et coordonner les ressources, les stocks, les commandes et leur réalisation au sein du réseau, afin
    de satisfaire les besoins selon les objectifs de service, de coût et de risque.
  definition_scope: Proposition de description du périmètre FLOW actuel sous un univers SCM ; pas définition exhaustive du
    SCM professionnel.
  rationale: 'Un univers regroupe des responsabilités de gestion : SCM exprime cette nature et évite la polysémie du mot Supply
    isolé.'
  boundaries:
  - Le périmètre professionnel SCM est plus large que les domaines actuellement cartographiés.
  - Nommer l’univers ne signifie pas couverture exhaustive ni extension de la plateforme FLOW.
  - Préserver les exclusions actuelles et les responsabilités des exécutants ; signaler la portée cartographiée dans la fiche.
  - Le réseau est la structure, le fulfillment une finalité, le SCM le pilotage du système.
