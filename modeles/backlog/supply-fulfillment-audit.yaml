oms_protection_review_U372:
  status: discussion_not_adoption
  source_refs:
  - U372
  model_refs:
  - D02.b
  - D05
  - D03
  finding: Distinguer définir/gouverner les protections, les faire respecter et consommer le disponible. Une même offre peut
    réaliser plusieurs de ces responsabilités ; aucune absence générale de protection dans les OMS établie.
  flow_position: D05 détermine les valeurs via ses décisions spécialisées ; Supply Protection gouverne et applique les règles
    actives ; promesse, affectation et réservation les respectent. Le périmètre FLOW inclut renouvellement et maîtrise des
    excédents, au-delà de la seule consommation des commandes.
  market_comparisons:
  - vendor: IBM
    element_name: Configuring Safety stock at ShipNode Level in Sterling Order Management
    element_type: Configuration produit
    relationship: Recouvrement partiel
    similarities: Un facteur de sécurité configurable par article et nœud exclut une part du stock actuel ou futur de la promesse.
    differences: Mécanisme de protection documenté dans un OMS ; aucune couverture de toute Supply Protection ou de toute
      décision d’optimisation démontrée.
    source_url: https://www.ibm.com/support/pages/configuring-safety-stock-shipnode-level-sterling-order-management
    source_version: Versions 8.5 à 9.2.1 listées ; document modifié le 16 juin 2018
    source_locator: Question ; Answer ; UID swg21699663
    consulted_on: '2026-09-18'
    status: proposed
    evidence_limits: Page primaire consultée ; preuve historique de fonctionnalité, pas vérification de toute édition courante.
  - vendor: Microsoft
    element_name: Inventory Visibility inventory allocation
    element_type: Fonctionnalité de service de stock
    relationship: Recouvrement partiel
    similarities: Enveloppes par groupe et contrôle de surconsommation distincts des réservations liées aux ventes.
    differences: Protection portée par Inventory Visibility ; ne prouve pas sa présence native dans tout OMS ni son absence
      dans les autres offres. Allocation est ici le terme éditeur pour les enveloppes de protection.
    source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/inventory/inventory-visibility-allocation
