    element_name: Integrate Supply Chain Management procurement with Intelligent Order Management
    element_type: Intégration produit
    relationship: Recouvrement partiel
    similarities: Visibilité et création de Purchase Orders depuis IOM.
    differences: Traitement dans Dynamics SCM ; source signalant des fonctionnalités en preview. Contre-exemple à une séparation
      stricte achats/OMS, pas équivalence complète avec FLOW.
    source_url: https://learn.microsoft.com/en-us/dynamics365/intelligent-order-management/integrate-procurement
    source_version: Documentation évolutive, mise à jour affichée 28 janvier 2026
    source_locator: Purchase Orders entity et note preview
    consulted_on: '2026-09-18'
    status: proposed
    evidence_limits: Passage primaire indexé consulté ; disponibilité générale non déduite.
  - vendor: Oracle
    element_name: How Supply Chain Orchestration Works
    element_type: Processus produit
    relationship: Recouvrement partiel
    similarities: Coordination des flux buy, transfer et make, à partir de demandes de planification et de gestion des commandes.
    differences: Supply Chain Orchestration collabore avec Order Management ; ce produit ne désigne pas simplement un OMS
      fusionné achats-ventes. Aucune production ajoutée à FLOW.
