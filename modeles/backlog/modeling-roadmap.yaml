limitations:
- Le travail domaine/capacité est complété par l’exploration ciblée des objets du stock unifié U187/U190 ; inventaire exhaustif
  différé.
- La cible FLOW et l’existant des trois SI ne sont pas fusionnés.
- U141 adopte le principe Supply/Case et les quatre capacités D04 dans leur portée ; ne valide pas automatiquement les détails
  des objets et liens.
- 'U173 : Business Services est nommé et défini ; ce maintien est remplacé par le retrait U472. Les dimensions de périmètre
  ne constituent pas un découpage en domaines.'
- 'U202 : audit de vocabulaire appliqué puis format YAML ; aucune nouvelle entité ou publication métier déduite.'
- U214 remplace les quatre capacités D04 de U141 par sept capacités. Portée et historique dans d04-refactoring.yaml ; aucun
  objet, type de nœud ni niveau supplémentaire instancié.
- 'U472 : terminer le travail Supply Chain avant d’étudier le commerce. Les mentions de Business Services dans les annexes
  de décisions antérieures restent des preuves historiques, pas un périmètre courant à développer.'
