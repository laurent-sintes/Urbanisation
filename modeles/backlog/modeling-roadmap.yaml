  instantiate_now: true
  note: U264 implémente behavior, rattachement contains depuis une capacité unique de même couche, niveau terminal contrôlé
    et quatre comportements ATP. Décomposition U262 et définitions U263 adoptées ; noms anglais et compléments éditoriaux
