- id: EXT-HIGHER-LEVEL
  subject: grouping_above_domains
  state: structure_prepared
  candidate_terms:
  - Domain
  name_state: decided
  semantic_definition_state: partly_defined
  instantiate_now: true
  note: 'U141 instancie Supply et Case comme groupes urbanism_level, level_ref universe. Business References reste un groupe
    de présentation ; détails de définition et rattachements proposés. U169 distingue domaines de capacités et bounded contexts
    : la frontière Supply/Services ne crée pas automatiquement un niveau ou un univers Services. U173 renomme universe-case
    en Business Services et valide sa définition ; domaines de cet univers différés, identifiant conservé. U472 remplace le
    maintien de Business Services : universe-case est retiré sans réutilisation d’identifiant. Seul Supply Chain Orchestration
    demeure instancié comme univers ; commerce différé après la Supply Chain, sans remplacement automatique. U482 remplace
    le vocabulaire courant : Supply Chain Orchestration est un Domain ; les six anciens domaines sont des Areas. Les identifiants
    et responsabilités restent stables. Authoritative Data est le nom du groupe de présentation business-references ; les
    six référentiels restent distincts. Les mentions précédentes conservent les décisions historiques.'
- id: EXT-BUSINESS-ENTITIES
  subject: business_objects_documents_events
  state: in_progress
  candidate_terms:
  - Product
  - Article
  - Product Unit
  - Container
  - Container Unit
  - Product Variant
  name_state: not_decided
  semantic_definition_state: partly_defined
  instantiate_now: false
  note: 'U141 : prévoir Case (process) et Order (transactional), leur rattachement caractérisé sans cardinalité présumée.
    Inventaire complet objets/documents/événements différé ; illustrations distinctes. U169 valide la distinction sémantique
    Supply Order / Service Order et les modèles propres aux contextes Supply/Services ; inventaire, attributs, cycles et cardinalités
    restent différés. Preuve et portée dans vocabulary-review.json. U187 ouvre une exploration ciblée des entités utiles au
    stock unifié, contenus et conditionnements inbound/outbound, dans unified-inventory-packaging.json. L’inventaire exhaustif
    et l’instanciation dans la carte restent différés ; ne pas traiter les candidats comme adoptés. U190 propose une première
    structure d’entités pour le stock unifié. Exploration ciblée en cours dans unified-inventory-packaging.json ; grain Article/référence/exemplaire
    à clarifier. Pas d’instanciation dans la carte ni d’univers Design créé automatiquement. U191 tranche Product Unit/Article
    comme exemplaire physique avec identité propre ; U192 dissocie cette notion du code-barres. Ce grain n’est plus à clarifier.
    Noms définitifs, individualisation des sources quantitatives et schéma restent ouverts. U193 introduit Product Variant
    et distingue Serial Number éventuel de l’exemplaire, GTIN de référence commerciale et support code-barres. Structure Product/Variant/Unit
    en instruction dans l’annexe ; conditionnements et cardinalités à préciser. U195 retient Product comme concept commun
    portant un rôle Article ou Container. Ces deux termes sont des rôles, non deux familles indépendantes de références imposées.
    Grain individuel Product Unit maintenu ; définitions détaillées et multiplicité des rôles ouvertes.'
