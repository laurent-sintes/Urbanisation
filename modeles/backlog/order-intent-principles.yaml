catalog_changed: true
business_visibility_U394:
  source_refs:
  - U394
  - C103
  criterion: Visibilité du métier au travers du design
  rule: Rendre identifiables dans les concepts, noms, relations, états et événements l’intention de la demande, les parties,
    leurs engagements et la progression métier. Ne pas obliger à reconstruire le sens du processus à partir des seules transactions
    ou d’un paramétrage implicite.
  distinction: Évaluer la lisibilité sémantique séparément de la couverture fonctionnelle ; savoir exécuter un processus ne
    prouve pas que son sens est visible dans le modèle.
  application:
  - Pouvoir distinguer une demande d’apport en consignation d’un engagement d’achat et relier leur évolution éventuelle.
  - Montrer le lien entre intention, accord, demande, exécution et résultat, sans confondre modèle métier et schéma physique.
  - Une réalisation commune est possible si elle conserve ces intentions explicites ; une table par intention ou la multiplication
    des objets ne sont pas des exigences.
  market_judgment: Préférence Microsoft sur la lisibilité des intentions d’apport et d’acquisition dans le cas étudié ; pas
    un déni de couverture SAP.
  historical_opinion: Laurent estime que Microsoft, arrivé après, a corrigé cette faiblesse de design. La causalité et l’intention
    historique ne sont pas établies par les documentations fonctionnelles consultées.
implementation_U395: audits/2026-09-18-consignment-U395/implementation.yaml
business_visibility_U397:
  source_refs:
  - U397
  - C104
  rule: Expliciter les comportements métier pour chaque Order. Une mutualisation informatique, un traitement commun ou le
    recours à une capacité transverse ne suffit pas à écarter un comportement utile à la compréhension métier.
  benefit: La lisibilité des intentions, parcours et résultats constitue un bénéfice ciblé recevable pour la décomposition.
  boundary: Conserver les responsabilités métier distinctes et la maille des comportements ; ni duplication automatique du
    cycle transversal ni catalogue de boutons. Listes nouvelles à qualifier séparément.
clarification_U608:
  source_refs:
  - U608
  - U393
  - U394
  - U607
  - CMP262
  principle: 'Construire Demand depuis l’intention de l’acteur qui déclenche la demande : résultat attendu, destinataire,
    droits et engagements.'
  consequence: Un effet de propriété ou document induit ne crée pas automatiquement une nouvelle intention. Consignment Issue
    est un comportement de Sales Order selon U607.
  automation: L’origine commerce ou plan, humaine ou automatique, ne remplace pas l’identification de l’intention métier.
  historical_limit: Les mentions historiques de couches ou Business Services dans cette annexe ne sont pas réactivées ; U455/U472
    et le cadrage courant priment.
clarification_U609:
  source_refs:
  - U609
  label: Demandes par intention
  general_requirement: Tout le modèle a vocation à être lisible ; cette exigence ne qualifie pas spécifiquement Demand.
  scope: Retrait de la précision dans le libellé courant ; conservation des comparaisons et justifications historiques.
adoption_U610:
  status: explicitly_adopted
  author: Laurent
  decided_at: '2026-09-22'
  source_refs:
  - U610
  - U608
  - U609
  approved_fields:
  - label
  - principle
  - general_requirement
  values:
    label: Demandes par intention
    principle: Partir de l’intention de l’acteur qui déclenche la demande.
    general_requirement: La lisibilité concerne tout le modèle.
  context: Validation de la formulation présentée après U609 ; Consignment Issue sous Sales Order déjà adopté U607.
  limit: Accord de principe méthodologique dans cette annexe ; aucune cible canonique fictive pour record_decision, aucun
    accord global sur les descriptions ni publication.
