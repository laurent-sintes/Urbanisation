scope_limit: Recensement des mécanismes pertinents dans le périmètre adopté et les sources consultées ; pas de prétention
  à toutes les politiques imaginables ni à une couverture installée.
decomposition_rationale: Le jalon du parcours, la proximité du besoin, la différenciation des engagements de service et l’adaptation
  au risque changent chacun la façon de sécuriser une promesse et le coût d’immobilisation. Quatre mécanismes combinables
  sont retenus U343 ; durées, seuils, canaux et interfaces restent des paramètres ou des contextes. La complexité visée est
  l’arbitrage de ces mécanismes sans retirer implicitement les garanties existantes.
behaviors:
- node_id: BHV032
  name: Milestone-Based Reservation Policy
  definition: Déterminer les événements du parcours métier à partir desquels la ressource doit être réservée, puis les conditions
    de maintien de cette protection au fil du parcours.
  criterion: Politique de déclenchement par engagement ou événement métier
  benefit: Rendre cohérent ce que le client croit garanti avec le stade atteint dans la vente, tout en limitant les immobilisations
    prématurées.
  mechanism: 'Choisir un jalon significatif : ajout au panier, demande explicite de mise de côté, soumission du paiement,
    acceptation de la commande ou autre engagement convenu. Définir les conditions de passage d’une protection provisoire
    à celle qui accompagne la commande. Un écran n’est pas le jalon métier.'
  inputs:
  - États et événements du parcours
  - Nature de l’engagement client
  - Conditions de paiement et d’annulation
  - Objectifs de service
  outputs:
  - Jalon déclencheur
  - Conditions de maintien, d’expiration et de libération
  - Règle de continuité lors de la confirmation
  example: 'Exemple fictif : une pièce reste vendable pendant la consultation du panier ; la soumission du paiement déclenche
    une réservation de dix minutes. Un paiement accepté prolonge l’engagement pour servir la commande, sans libération intermédiaire
    de la pièce.'
  boundary: 'Choisir le jalon et les conditions ne pilote pas le parcours : les processus les mobilisent ; Reservation établit
    et maintient les engagements. Panier, paiement et commande sont des options de politique, pas trois comportements.'
  market_indices:
  - 0
  - 1
  - 7
  evidence: Mécanismes de déclenchement directement documentés ; nom de regroupement FLOW adopté U343.
  status: adopted_name_responsibility_parent_U343
  adopted_responsibility: À quel événement du parcours commencer à réserver et maintenir la protection.
  adopted_responsibility_sha256: 43ba058907ed8a2ef04e8b7c7e062b90d393cf189dc172380b79ef456d358399
  definition_status: editorial_proposed
- node_id: BHV033
  name: Time-Fenced Reservation Policy
  definition: Déterminer à quelle distance de la date de besoin commencer à réserver, afin de sécuriser l’échéance sans immobiliser
    trop tôt les ressources.
  criterion: Mécanisme de fenêtre temporelle avant le besoin
  benefit: Conserver de la flexibilité pour les demandes proches tout en organisant la sécurisation progressive des échéances
    futures.
  mechanism: Définir une fenêtre de réservation relative à la date de besoin ou d’expédition. Une demande déjà acceptée peut
    rester hors de cette fenêtre ; l’entrée dans la fenêtre déclenche une nouvelle appréciation selon les conditions applicables.
    Distinguer cet horizon du délai d’expiration d’une réservation déjà accordée.
  inputs:
  - Date de besoin ou d’expédition
  - Délais de préparation
  - Engagements déjà pris
  - Disponibilité présente et future admissible
  outputs:
  - Fenêtre avant le besoin
  - Conditions de réexamen à l’entrée dans la fenêtre
  - Traitement d’un changement d’échéance
  example: 'Exemple fictif : pour une livraison dans trente jours, décider de commencer la réservation à J-7. Cela ne signifie
    ni ignorer la demande dans l’ATP avant J-7, ni autoriser une promesse sans ressources crédibles.'
  boundary: La date réalisable reste du ressort des décisions de promesse ; ce comportement choisit quand sécuriser les ressources
    par réservation. Il ne programme pas les opérations logistiques et ne recalcule pas la promesse.
  market_indices:
  - 4
  evidence: Reservation Time Fence est un terme et un mécanisme explicites chez Oracle EBS.
  status: adopted_name_responsibility_parent_U343
  adopted_responsibility: À quelle distance de la date de besoin commencer à réserver.
  adopted_responsibility_sha256: 1e65df033929c7f4870c7765fd4f370f3c3c42279d1fff2d99fc226e2d5060ab
  definition_status: editorial_proposed
- node_id: BHV034
  name: Demand-Differentiated Reservation Policy
  definition: Déterminer des conditions de réservation différentes selon les engagements de service attachés aux demandes,
    aux clients ou aux canaux, en respectant les priorités et droits d’usage établis.
  criterion: Politique différenciée de service
  benefit: Rendre possibles des engagements commerciaux distincts sans appliquer une immobilisation maximale à toutes les
    demandes.
  mechanism: 'Distinguer des régimes de réservation lorsque les conditions de service le justifient : mise de côté convenue
    pour un client professionnel, protection au paiement pour une vente en ligne, réservation dès acceptation d’une demande
    urgente. La différence doit modifier la garantie ou le processus ; un simple filtre client ne suffit pas.'
  inputs:
  - Conditions commerciales et de service
  - Typologie du besoin
  - Priorités déjà décidées
  - Droits et protections applicables
  outputs:
  - Régimes par contexte de demande
  - Jalons et durées différenciés
  - Conditions explicites de dérogation
  example: 'Exemple fictif : un accord professionnel prévoit une mise de côté dès acceptation pendant quarante-huit heures,
    tandis que la vente web standard réserve au paiement. Ces durées illustrent des engagements différents et ne constituent
    pas des règles Beaumanoir constatées.'
  boundary: 'Order Prioritization garde le classement des Orders ; Group Protection Decision garde les enveloppes des groupes.
    Ce comportement ne choisit ni les commandes gagnantes ni les quantités affectées : il décide du régime de réservation
    applicable à la demande.'
  market_indices:
  - 0
  - 5
  evidence: Besoins de réservation différenciés attestés ; leur regroupement comme comportement décisionnel est une interprétation
    FLOW.
  status: adopted_name_responsibility_parent_U343
  adopted_responsibility: Quelles conditions appliquer selon les engagements de service.
  adopted_responsibility_sha256: f46a099e3cd116d2f875178b0dcda0762649ee24a773b835971648565597b27f
  definition_status: editorial_proposed
- node_id: BHV035
  name: Risk-Adaptive Reservation Policy
  definition: Adapter les conditions de déclenchement et de durée de réservation à la tension sur les ressources et au risque
    d’immobilisation inutile, dans les limites des engagements déjà accordés.
  criterion: Mécanisme de décision contextuelle selon le risque
  benefit: Réagir aux évolutions de demande et de disponibilité en arbitrant entre perte de promesse et indisponibilité du
    stock pour d’autres ventes.
  mechanism: Appliquer des règles conditionnelles, réestimer les paramètres ou sélectionner une politique selon la situation.
    Examiner les stocks libres, les engagements concurrents, leur vitesse et variabilité, les entrées attendues et leur fiabilité.
    La probabilité de conversion et les abandons peuvent éclairer le coût d’une réservation précoce. Une politique conditionnelle
    peut être définie à l’avance ; adaptation ne signifie ni apprentissage obligatoire ni réécriture permanente des règles.
  inputs:
  - Disponibilité après engagements et protections
  - Vitesse des demandes et réservations concurrentes
  - Fiabilité des entrées et du stock
  - Durée du parcours et conversion, si connues
  - Objectifs et limites de service
  outputs:
  - Politique sélectionnée ou paramètres recommandés
  - Motif métier du choix et horizon de validité
  - Conditions de réexamen et solution de repli si les informations sont insuffisantes
  example: 'Exemple fictif : une capsule dispose de huit pièces alors que les demandes s’accélèrent. Pour sécuriser le paiement,
    proposer une protection plus précoce et courte ; si les paniers sont surtout abandonnés, retenir au contraire une protection
    plus tardive. Le risque de pénurie seul ne détermine pas le sens de l’adaptation.'
  boundary: Ne pas déduire deux fois les mêmes engagements ; ne pas assimiler sorties physiques et demandes nouvelles. ATP
    reste fournisseur de possibilités, PTP de l’arbitrage économique de satisfaction des Orders. Une révision de politique
    ne révoque pas implicitement les réservations existantes ; leurs modifications suivent les conditions accordées.
  market_indices:
  - 1
  - 2
  - 3
  evidence: Leviers commercetools et adaptations voisines IBM/SAP ; aucun moteur standard de sélection du jalon par risque
    démontré. Mécanisme FLOW issu de U341 et adopté U343, sans revendication d’innovation exclusive.
  status: adopted_name_responsibility_parent_U343
  adopted_responsibility: Comment adapter le déclenchement et la durée selon la tension et le risque d’immobilisation inutile.
  adopted_responsibility_sha256: e00c19d8411dcdd0757379930be1d1712e185dd022c8269450c0fad1f1e4ef4f
  definition_status: editorial_proposed
coverage:
- topic: Panier, paiement, commande, demande explicite de mise de côté
  disposition: BHV032
  rationale: Options de jalon métier ; aucun comportement par écran.
- topic: Réservation progressive au fil des engagements
  disposition: BHV032
  rationale: Conditions de continuité dans le même mécanisme ; ne pas créer une fonction de conversion de statut comme comportement.
- topic: Réservation à l’approche de la date de besoin
  disposition: BHV033
  rationale: Fenêtre avant le besoin distincte de l’expiration après réservation.
- topic: Clients, canaux, types de besoin ou engagements contractuels
  disposition: BHV034
  rationale: Justifié seulement si la garantie ou le processus diffère ; un simple filtre ne suffit pas.
- topic: Stock faible, pic de demande, accélération des engagements
  disposition: BHV035
  rationale: Signaux d’une même décision de risque, pas trois comportements.
- topic: Entrée fournisseur incertaine, stock peu fiable, retards
  disposition: BHV035
  rationale: Autres facteurs de risque ; utiliser les constats et estimations disponibles sans absorber le tracking.
- topic: Probabilité de conversion, abandon, durée du parcours
  disposition: BHV035
  rationale: Hypothèse décisionnelle FLOW ; aucun moteur standard attesté. Pas de scoring obligatoire ni nouveau comportement
    par indicateur.
- topic: Durée fixe, expiration événementielle, prolongation conditionnelle
  disposition: Paramètres communs
  rationale: Le mécanisme choisit les conditions ; Reservation réalise maintien et libération. Une durée chiffrée ne justifie
    pas un comportement.
- topic: Manuel, règles déterministes, optimisation, IA
  disposition: Modes de réalisation
  rationale: Ne différencient pas à eux seuls le résultat métier ni la capacité.
- topic: Politique structurelle versus décision contextuelle
  disposition: Modalités combinables
  rationale: Une règle conditionnelle fixée à l’avance peut produire une décision adaptée au contexte.
- topic: Réservation partielle, complète ou coordonnée d’un ensemble
  disposition: Candidat de frontière à instruire
  rationale: Effet métier possible sur les ensembles indissociables. Oracle et IBM documentent des modalités partielles ;
    le choix quantitatif ou la cohérence de promesse peut relever de D03. Pas ajouté à la capacité sans élargissement explicite
    de son résultat.
- topic: Réseau versus site, quantité générique versus lot ou unité
  disposition: Reservation / Supply Assignment
  rationale: Portée de l’engagement et affectation des ressources ; ne pas confondre avec choix du moment de réservation.
    IBM réseau décompose déjà en sites.
- topic: Stock actuel versus ressources futures
  disposition: ATP / Reservation
  rationale: Admissibilité et portée de l’engagement ; conserver les comportements ATP déjà adoptés.
- topic: FIFO/FEFO, priorité, partage équitable, pourcentage entre Orders
  disposition: D03 / Supply Assignment
  rationale: Choix des ressources ou des bénéficiaires ; les modes éditeurs ne sont pas recopiés dans la décision de politique
    temporelle.
- topic: Reprise d’une réservation au profit d’une autre demande
  disposition: Arbitrage des engagements existants
  rationale: Ne pas présenter la préemption comme un simple paramètre adaptatif. Conditions de révision, Promise Management
    et processus de compensation à mobiliser selon le cas.
- topic: Enveloppes par groupe et stock tampon
  disposition: Supply Protection / décisions D05 existantes
  rationale: Protection préalable des usages, distincte d’un engagement de réservation au bénéfice d’un besoin.
- topic: Créer, modifier, libérer, prolonger, rechercher
  disposition: Fonctions de Reservation
  rationale: Opérations produit à documenter dans les descriptions, pas comportements de décision.
- topic: Tester plusieurs politiques et mesurer leurs effets
  disposition: Inventory Planning
  rationale: Simulation & analyse reste le comportement de Planning ; mobilise cette décision sans duplication.
- topic: Vente sans réservation, backorder ou survente autorisée
  disposition: Option et frontière
  rationale: La décision peut conclure à différer ou ne pas réserver avant un jalon. Autoriser une vente sans ressource et
    modifier la promesse ne sont pas des pouvoirs implicites de cette capacité.
combination_example: Un régime professionnel différencié peut réserver à l’acceptation, seulement dans une fenêtre de sept
  jours avant le besoin, avec une durée adaptée au risque. Ces mécanismes se combinent ; ni niveaux de maturité ni séquence
  obligatoire.
open_questions:
- Arbitrer le porteur de gouvernance et de mise en vigueur des politiques.
- Qualifier les réservations coordonnées/partielles avant tout élargissement de la capacité.
- Instruire les descriptions détaillées et contrats sans confondre la validation des comportements avec celle de toutes les
  modalités.
