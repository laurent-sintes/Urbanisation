change_scope: Discussion et recommandation seulement. Modèle, glossaires, relations et publication courante inchangés.
activation_U486:
  user_direction: Les Orders servent à activer le domaine ; leur ensemble est pratiquement son offre de services.
  interpretation: Une famille d’Orders exprime ce que l’on peut demander au domaine ; un Order concret porte cette demande
    et sa progression. Sa prise en charge mobilise les décisions et les activités nécessaires au résultat.
  proposed_definition: 'Order Management porte les demandes qui activent Supply Chain Orchestration : ce que le domaine est
    sollicité pour accomplir, pour qui, sous quelles conditions et avec quel résultat attendu. Il gouverne leur prise en charge
    et maintient leur sens jusqu’à leur satisfaction ou leur fin.'
  offer_levels:
  - view: Type de demande
    meaning: Une forme de prise en charge offerte par le domaine.
  - view: Demande concrète
    meaning: Une sollicitation déterminée, son contenu applicable et son état de prise en charge.
  - view: Parcours de réalisation
    meaning: Les décisions et activités mobilisées pour obtenir le résultat.
  qualification: 'Activation métier selon le cycle de vie : un brouillon ne déclenche pas nécessairement l’exécution. Aucun
    mode synchrone, API, moteur ou activation exclusivement externe imposé.'
  market_support: TMFC007 est explicitement décrit comme point d’entrée du domaine Production ; sa commande sollicite une
    fourniture de service. Le SOM TM Forum inclut toutefois l’orchestration, répartie entre Areas dans FLOW.
  service_catalog_distinction: Offre de Supply Chain Orchestration aux demandeurs, à distinguer du Service Catalog D14 des
    prestations d’exécutants mobilisables.
naming_U487:
  problem: Management suggère une responsabilité sur l’ensemble du devenir des commandes, alors que promesse, optimisation,
    stocks et orchestration ont leurs responsabilités propres. Un terme générique ne rend pas visible ce que D04 porte.
  preferred_name: Supply Requests
  reader_explanation: Les demandes qui activent Supply Chain Orchestration, avec leur contenu, leur état de prise en charge
    et leur résultat restant à obtenir.
  recommendation_status: proposed_not_adopted
  candidates:
  - name: Supply Requests
    benefit: Exprime les sollicitations adressées à la Supply, cohérent avec l’offre de prises en charge U486.
    tradeoff: Request doit inclure les commandes fermes et leur suivi, au-delà de la demande initiale.
    market_status: Supply request est un terme attesté chez Oracle, mais son périmètre natif est orienté création d’approvisionnement.
      Son emploi pour toute l’Area FLOW, ventes et retours compris, est une proposition locale plus large.
  - name: Orders
    benefit: Supprime Management et conserve le vocabulaire des capacités existantes ; périmètre nommé par les demandes qu’il
      porte.
    tradeoff: Le rôle d’activation doit être expliqué dans la définition ; Order est pris au sens métier large et ne signifie
      pas uniquement commande commerciale.
    market_status: Terme métier courant ; regroupement précis de neuf capacités propre au modèle.
  - name: Order Book
    benefit: Évoque le carnet cohérent et le reste à satisfaire.
    tradeoff: Peut se lire comme les seules commandes ouvertes et suggérer le travail du carnet relevant de Fulfillment Optimization
      ; moins explicite sur l’offre de prises en charge.
    market_status: Image métier attestée ; pas un nom de périmètre équivalent établi.
  - name: Order Intake / Order Capture
    benefit: Rend visible l’entrée des demandes.
    tradeoff: 'Met principalement l’accent sur l’entrée et annonce mal la structuration, les évolutions et la conservation.
      TMFC002 inclut aussi une clôture commerciale : le titre de marché ne fixe pas toute sa portée.'
    market_status: Capture attesté dans TMFC002 ; analogie partielle, aucune modification du périmètre courant proposée.
  discarded:
  - 'Order Governance : suggère surtout politiques et contrôle.'
  - 'Order Lifecycle : ramène l’Area au nom d’une seule de ses capacités.'
  - 'Service Requests : risque de confusion avec les Service Orders des exécutants.'
  - 'Domain Activation : rend le déclenchement visible mais masque les dossiers et leur continuité.'
  proposed_definition: Porte les demandes qui sollicitent Supply Chain Orchestration et maintient ce qui lui est demandé jusqu’à
    leur satisfaction ou leur fin. Les familles de demandes rendent lisibles les prises en charge offertes par le domaine.
  sources:
  - source_refs:
    - ELM364
    title: Use Supply Chain Orchestration in Your Back-to-Back Flows
    url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/25c/fauco/how-orchestration-processes-back-to-back-flows.html
    edition: 25C, complément de lecture lexical ; l’édition 26B enregistrée sous ELM364 reste préservée
    locator: Supply Chain Orchestration and Order Orchestration ; Supply request / Supply order
    consulted_on: '2026-09-19'
    limit: Documentation primaire ouverte ; Supply Requests n’y désigne pas une Area réunissant toutes les familles FLOW.
  - source_refs:
    - ELM491
    title: Product Order Capture And Validation
    url: https://www.tmforum.org/oda/directory/components-map/core-commerce-management/TMFC002
    edition: 2.1.0 affichée
    locator: 'Présentation : capture, validation et clôture commerciale'
    consulted_on: '2026-09-19'
    limit: Composant télécom ; pas une cartographie de capacités Supply adoptée.
backing_services_U488:
  source_ref: U488
  status: user_confirmed_semantics
  statement: Service Catalog décrit les Backing Services appelés par l’orchestration.
  distinction: Les Orders sollicitent une prise en charge du Domain ; l’orchestration mobilise des prestations exécutantes
    pour la réaliser.
  scope: Aucun renommage de D14, aucune restriction aux services logiciels ni déplacement des Service Orders de D06.
naming_U489:
  status: proposed_after_user_preference
  preferred_area_name: Service Orders
  reason: Service indique la prise en charge métier sollicitée auprès de la Supply ; Orders indique les demandes concrètes,
    suivies jusqu’à leur résultat ou leur fin. Le pluriel nomme l’ensemble des familles couvertes sans une action Management
    trop générale.
  proposed_definition: 'Porte les demandes de service prises en charge par Supply Chain Orchestration : leur intention, leur
    contenu applicable, leurs conditions et ce qui reste à satisfaire. Ces demandes activent les capacités du domaine et rendent
    lisible son offre métier.'
  term_distinction:
  - proposed_term: Service Orders
    meaning: Demandes et intentions métier dont la Supply porte la prise en charge.
    current_target: D04
  - proposed_term: Backing Service Orders
    meaning: Demandes de prestation adressées aux exécutants pour satisfaire ces besoins.
    current_target: D07.b / TER066
    status: local_qualification_proposed_not_adopted
  concrete_example:
    domain_request: Faire parvenir 100 pièces au magasin.
    backing_requests: Solliciter la préparation, le transport et, si nécessaire, la production de documents pour réaliser
      cette prise en charge.
    status: illustration_proposed
  impact_if_adopted:
  - 'Le concept Service Order existe déjà dans TER066 avec un sens limité aux exécutants : distinguer les usages avant toute
    substitution.'
  - D07.b Service Order Management reste actuellement dans D06 ; son nom et les liens de TER075 devront être réexaminés explicitement,
    sans déplacement automatique.
  - 'D14 Service Catalog conserve sa fonction confirmée U488 : catalogue des Backing Services.'
  - 'Purchase Order reste une commande contractuellement adressée au fournisseur : ne pas qualifier tous les Orders de flux
    techniquement entrants.'
  - Les types d’Orders et leurs responsabilités restent distincts ; aucun objet universel, catalogue neuf ou processus commun
    déduit.
  market:
    source_refs:
    - ELM492
    - ELM131
    similarity: TMFC007 est le point d’entrée du domaine Production et reçoit des Service Orders ; TMF641 décrit des demandes
      de service avec leurs paramètres et leur suivi.
    difference: Le composant TM Forum inclut l’orchestration ; Service Orders serait le nom d’une Area métier FLOW de portée
      différente. Backing Service Orders est une qualification proposée localement, pas une appellation TM Forum attestée
      par ces sources.
    documents:
    - title: Service Order Management — TMFC007
      edition: 2.0.0 affichée
      url: https://www.tmforum.org/oda/directory/components-map/production/TMFC007
      locator: Présentation du point d’entrée Production et de l’orchestration CFS
      consulted_on: '2026-09-19'
    - title: Service Ordering Management API — TMF641
      edition: v4.2, page affichant publication stable 14 août 2026
      url: https://www.tmforum.org/open-digital-architecture/open-apis/service-ordering-management-api-TMF641/v4.2
      locator: 'Overview : placing a service order ; create/update/retrieve et notifications'
      consulted_on: '2026-09-19'
      limits: Notice publique consultée ; aucune lecture intégrale du guide ou de la spécification API déduite.
internal_requests_U490:
  status: proposed_scope_extension_not_adopted
  user_proposal: Des demandes internes de backoffice activent des opérations orchestrées d’optimisation, par exemple analyse,
    simulation, validation et activation des affectations Supply.
  assessment: 'U491 précise le déclenchement : l’optimisation du carnet peut être une réaction à son état ou à un événement
    de promesse non tenable. L’exemple ne doit pas être présenté comme une sollicitation du commerce. Le dossier éventuel
    porte la réaction sans exiger un Order interne préalable.'
  classification:
    request_intent:
    - Satisfaire une demande métier de vente, achat, transfert, retour ou apport.
    - 'Étudier ou modifier la situation Supply : comparer des scénarios, optimiser, autoriser et appliquer un changement.'
    request_origin: Externe/interne est un axe distinct de l’intention ; des Transfer Orders peuvent être initiés par l’optimisation
      du stock, et une demande d’étude pourrait provenir d’un autre domaine.
  example:
    status: fictional_proposed
    request: Réexaminer les affectations de l’arrivage de lundi aux commandes France, comparer deux hypothèses en préservant
      les affectations gelées et les engagements confirmés, puis appliquer le scénario autorisé.
    business_record:
    - Demandeur, motif et résultat attendu.
    - Périmètre de commandes et de ressources, horizon et contraintes.
    - Hypothèses comparées, scénario retenu et autorisation d’application.
    - Résultat appliqué, écarts et clôture ou abandon.
    possible_outcome_without_activation: Une étude comparative peut être terminée et utile sans décision d’appliquer un changement.
  current_responsibilities:
  - step: Analyse et simulation
    capability: Order Backlog Planning
    id: D03.p
    role: Construire et comparer des scénarios en mobilisant les décisions spécialisées.
  - step: Choix du plan
    capability: Fulfillment Plan Decision
    id: D03.o
    role: Déterminer un scénario cohérent et ses arbitrages.
  - step: Validation / autorisation
    role: Responsable et conditions à expliciter ; ni humain obligatoire, ni nouveau comportement universel, ni assimilation
      automatique à Order Release.
  - step: Activation des affectations
    capability: Supply Assignment
    id: D02.e
    role: Matérialiser le plan autorisé, signaler les écarts, mobiliser application de plan, complément ou réaffectation selon
      le cas.
  modeling_options:
  - option: Étendre l’Area candidate Service Orders
    benefit: Rendre lisibles dans un même périmètre les familles de sollicitations du domaine, opérationnelles ou de pilotage.
    cost: 'Extension réelle de D04 : justifier les nouveaux types, leurs responsabilités et le suivi commun sans déplacer
      les décisions ou leur réalisation.'
  - option: Porter chaque demande dans son Area spécialisée
    benefit: Le dossier d’optimisation reste proche des responsabilités qui le traitent ; D04 conserve ses familles actuelles.
    cost: Une lecture commune de l’offre du Domain doit relier les prises en charge réparties.
  recommendation: Distinguer d’abord sollicitations explicites et réactions du domaine. Éprouver le dossier éventuel d’optimisation
    sans imposer un Order interne, sans étendre automatiquement Service Orders et sans décider son rattachement.
  boundaries:
  - Supply Assignment désigne actuellement l’application des affectations ; le parcours complet d’optimisation traverse plusieurs
    capacités.
  - 'Analyse, simulation, validation et activation décrivent un parcours : ils ne deviennent pas automatiquement quatre capacités
    ou comportements.'
  - D06 Process Orchestration porte actuellement les prestations d’exécutants. Un processus d’optimisation n’y est pas transféré
    implicitement.
  - 'Un calcul élémentaire ou un clic ne justifie pas un Order : la durée, les alternatives, les autorisations et la traçabilité
    justifient le dossier.'
  - Activation du plan ne signifie ni réservation implicite ni nouvelle promesse ni réalisation physique.
  - Aucune reprise des anciennes couches, aucun objet universel Demande adopté, aucun audit U431 rouvert, aucun catalogue
    Informations étendu.
  market_comparisons:
  - source_refs:
    - ELM287
    source: SAP Explaining Supply Assignment
    similarity: 'Modes de simulation et parcours d’affectation avec contrôles de release : la démarche métier dépasse le seul
      calcul.'
    difference: ARun regroupe plusieurs responsabilités ; les effets de blocage SAP diffèrent de FLOW U436. Cela ne prouve
      pas l’existence d’un Order interne universel ni le rattachement proposé.
    url: https://learning.sap.com/courses/exploring-fashion-functions-and-business-processes-in-sap-s-4hana-for-fashion-and-vertical-business/explaining-supply-assignment_af05618d-4954-4f22-9857-3dd12e3940c4
    edition: Cours évolutif sans édition unique affichée
    locator: Supply Assignment Scenarios ; ARun Statuses ; Modes Normal, Preview and Simulation
    consulted_on: '2026-09-19'
  - source_refs:
    - ELM357
    source: Oracle Key Actions on Orders
    similarity: Planifier, revoir, simuler puis enregistrer, marquer et transmettre les résultats retenus. Les simulations
      ne changent pas directement les informations de planification opérationnelles visibles aux clients.
    difference: Fonctions de Backlog Management 25D ; la release transmet des résultats, elle n’est pas une équivalence de
      l’activation des affectations FLOW ni une validation humaine systématique.
    url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/25d/faubm/key-actions-on-orders.html
    edition: 25D
    locator: Plan Run Actions ; Review Actions ; Attribute Data Simulation Actions ; Release Actions
    consulted_on: '2026-09-19'
reactive_operations_U491:
  status: user_clarification_recorded_proposed_modeling
  user_direction: Optimiser le carnet est une réaction à un état particulier du carnet ou à un événement de promesse non tenable
    ; cet exemple n’est pas une sollicitation du commerce.
  distinction:
  - trigger: Sollicitation explicite
    meaning: Une prise en charge est demandée au domaine ; les Orders portent ce qui lui est demandé.
  - trigger: État ou événement du domaine
    meaning: Une situation requiert une action corrective ou une nouvelle décision ; elle peut susciter une opération d’optimisation
      sans demande préalable.
  example:
    status: fictional_proposed
    situation: Un retard d’arrivage remet en cause la couverture de plusieurs commandes et certaines promesses.
    reaction: Qualifier les impacts, comparer les scénarios admissibles, choisir et autoriser une réponse, puis appliquer
      les changements retenus.
    case_if_useful: Un dossier peut conserver le motif, le périmètre touché, les alternatives, la décision et le résultat.
      Il est ouvert pour suivre la réaction ; il ne crée pas rétroactivement une demande du commerce.
  semantic_separation:
    trigger: État ou événement à l’origine de la réaction.
    case: Support éventuel du traitement et de sa traçabilité.
    process: Analyse, simulation, arbitrage, autorisation et application selon le cas.
    capabilities: Savoir-faire métier mobilisés ; leurs frontières actuelles restent inchangées.
  impact_on_naming: Service Orders peut nommer les sollicitations explicites. Les opérations réactives n’ont pas à recevoir
    ce nom pour être orchestrées et suivies. Une notion plus générale de dossier ou opération resterait une proposition à
    instruire.
  limits:
  - 'Pas de déclenchement automatique universel déduit : événement, qualification, décision d’agir et autorisation d’appliquer
    restent distincts.'
  - Pas de dossier obligatoire pour chaque événement ou calcul.
  - Pas de création d’une couche processus ou d’une Area Operations par cette discussion.
  market_interpretation: Les parcours SAP/Oracle consultés en CMP198 étayent analyse/simulation/application, mais ne prouvent
    pas l’existence d’un mécanisme universel état ou événement → Case. Le déclenchement métier U491 reste explicité comme
    direction locale de Laurent.
market_reactive_requests_U493_U495:
  status: proposed_not_adopted
  user_example: 'U495 : une détection de fraude engendre une demande backoffice de vérification d’identité.'
  example_provenance: Exemple de Laurent, pas fonctionnalité Salesforce exacte ou réalisation installée vérifiée.
  correction_of_previous_interpretation: U491 distingue les déclencheurs ; U494/U495 montrent qu’une réaction peut donner
    naissance à une demande interne autonome. Il était trop restrictif d’opposer demande et réaction, ou de réserver les demandes
    aux sollicitations commerciales. L’absence d’Order interne obligatoire dans les références ne justifie pas de l’exclure
    du modèle.
  distinctions:
    trigger: Sollicitation, détection, changement de situation ou échéance.
    request: Travail à prendre en charge, avec une finalité, un périmètre, des conditions et un résultat attendu.
    origin: Interne ou externe ; ne définit pas seule la famille de demande, comme le Transfer Order U492.
    process: Parcours qui mobilise les capacités pour traiter la demande.
  supply_analogy:
    status: fictional_proposed
    trigger: Retard d’approvisionnement rendant certaines promesses intenables.
    request: Réexaminer la satisfaction du carnet concerné et proposer un plan réalisable.
    processing: Analyser et simuler avec Order Backlog Planning ; arbitrer avec Fulfillment Plan Decision ; appliquer les
      affectations autorisées avec Supply Assignment.
    outcome: Plan retenu, application autorisée et résultat tracé, ou décision motivée de ne pas modifier les affectations.
  modeling_recommendation: 'Étudier dans D04 les familles de prises en charge métier, y compris celles nées de réactions internes,
    avec leurs spécificités. Le bénéfice est de rendre visible l’offre du Domain et le suivi du travail. Le compromis est
    une extension réelle de périmètre à définir : ni Area Front Office/Back Office calquée sur l’organisation, ni dossier
    pour chaque calcul, ni cycle universel. Les capacités de décision et de réalisation restent dans leurs Areas.'
  naming_impact: Service Orders reste la piste utilisateur U489 à éprouver sur ces demandes internes. Service Requests constitue
    une alternative étayée par Salesforce ; aucun renommage adopté. Demande métier et commande de prestation à un Backing
    Service restent à distinguer.
  sources:
  - ref: ELM495
    title: SAP S/4HANA Backorder Processing (CA-ATP-BOP)
    edition: 2025 FPS01, février 2026
    url: https://help.sap.com/docs/SAP_S4HANA_ON-PREMISE/f132c385e0234fe68ae9ff35b2da178c/73a1a457ef816b10e10000000a441470.html
    locator: Introduction, exemples de modification de disponibilité, simulation et modes de lancement
    fact: Une production en retard motive la réévaluation des confirmations ; simulations et mises à jour des documents, lancements
      interactifs ou planifiés.
    limit: Ne prouve pas le déclenchement événementiel automatique de aATP BOP. Texte du portail consulté via son index ;
      ouverture directe dynamique sans corps exploitable.
  - ref: ELM495
    title: SAP APO Event-Driven Quantity Assignment
    edition: 7.0 EHP4
    url: https://help.sap.com/docs/PRODUCT_ID/5632d7cbffa04b21be22106e9a212038/49e451df2721751de10000000a42189b.html?locale=en-US&state=PRODUCTION&version=7.0.4
    locator: Events et traitements EDQA
    fact: Des changements de stocks et de documents Supply déclenchent des affectations ou réaffectations.
    limit: Preuve événementielle pour APO ; pas de transposition automatique à S/4HANA. Texte indexé consulté ; ouverture
      directe dynamique sans corps exploitable.
  - ref: ELM496
    title: Oracle Overview of Supply Chain Orchestration
    edition: 25D
    url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/25d/fauco/overview-of-supply-orchestration.html
    locator: Manage Supply for Transfer Flows ; Automate Change Management
    fact: 'Flux de transfert alimentés notamment par planification Supply, min-max ou interfaces. Exemple fournisseur réduisant
      100 à 75 : recherche des 25 manquants, création de document si solution, sinon exception.'
    limit: Exemple back-to-back ; pas preuve d’une optimisation globale du carnet.
  - ref: ELM496
    title: Oracle Change Management in Back-to-Back Fulfillment
    edition: 25C
    url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/25c/famml/change-management-in-back-to-back-fulfillment.html
    locator: 'Supply-side changes ; Exception Case: Reduction of Purchase Order Quantity'
    fact: Retards et réduction Supply pris en charge ; si aucune alternative ne résout le manque, le choix de replanifier
      ou fractionner revient au gestionnaire.
    limit: Automatisation et traitement manuel des exceptions distincts ; pas toute décision déléguée au système.
  - ref: ELM496
    title: Oracle Overview of Backlog Management Processes
    edition: 25C
    url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/25c/faubm/overview-of-backlog-management-processes.html
    locator: Les quatre activités et distinction Planned / Release
    fact: Planifier, examiner, simuler puis publier les résultats ; les simulations ne changent pas les échéances effectives
      avant release.
    limit: Lancement manuel ou planifié ; pas preuve événementielle automatique ni obligation d’un dossier appelé Order.
  - ref: ELM497
    title: Salesforce Service Process Studio Fulfillment Flows
    edition: Documentation évolutive, Industry Service Excellence ; édition non précisée
    url: https://help.salesforce.com/s/articleView?id=ind.spd_fulfillment_flows.htm&language=en_US&type=5
    locator: 'Definition ; Example: Address Update Service Request Fulfillment Flow'
    fact: Case et Service Catalog Request portent la demande ; un parcours peut faire vérifier les pièces par le backoffice
      puis actualiser le système bancaire et clore le Case.
    limit: Cette illustration montre le traitement backoffice d’une demande ; elle ne prouve pas une demande distincte créée
      à la suite d’une fraude.
  - ref: ELM498
    title: Salesforce Explore Service Requests and Resolutions
    edition: Agentforce IT Service, cours évolutif sans édition précisée
    url: https://trailhead.salesforce.com/content/learn/modules/request-management-for-agentforce-it-service/explore-service-requests-and-resolutions
    locator: Service Requests ; Request Tracking ; Resolving Requests
    fact: Les demandes internes des employés peuvent être portées par Service Request, Case ou Incident selon le processus
      ; suivi, approbation éventuelle, tâches et clôture.
    limit: Exemple de service aux employés ; pas de réaction autonome Supply ou de fraude établie par cette source.
  - ref: ELM498
    title: Salesforce Case Fields
    edition: Documentation évolutive sans édition précisée
    url: https://help.salesforce.com/s/articleView?id=service.cases_fields.htm&language=en_US&type=5
    locator: Case Record Type, Origin, Reason, Type, Parent Case
    fact: La documentation distingue le type de dossier, son origine, sa raison et un parent éventuel.
    limit: Pas de taxonomie universelle native Frontoffice / Backoffice déduite.
  consulted_on: '2026-09-19'
  comparison: Oracle et SAP étayent les réactions Supply et leurs parcours ; Salesforce étaye les demandes internes suivies
    et la distinction demande / traitement. Leur rapprochement soutient une proposition FLOW, pas un standard commun de découpage
    en Areas ou de Service Order universel.
adoption_U496_U497:
  source_refs:
  - U496
  - U497
  adopted_area:
    id: D04
    name: Service Requests
    definition: Porter les demandes de travail que le Domain reçoit ou fait naître, préciser le résultat attendu et suivre
      leur prise en charge.
  adopted_scope: Demandes de travail reçues ou nées dans le Domain, y compris demandes internes issues d’une réaction ; finalité,
    origine et déclencheur distingués.
  backing_services:
    D14: 'Service Catalog : offre de Backing Services'
    D07.b: Backing Service Orders
    TER066: Backing Service Order
    TER075: Backing Service
  preserved: Identifiants, rattachements et responsabilités des capacités. Le suffixe historique des identifiants ne définit
    pas le parent. Les noms natifs des références de marché sont conservés.
  proposed_details: Les rédactions complémentaires de fiches, exemples et comparaisons ne sont pas validés globalement. Les
    types supplémentaires de demandes internes et leur cycle propre restent à définir ; aucun catalogue nouveau créé par cet
    accord.
  historical_proposals: Les sections U485 à U495 conservent les propositions et réserves aux dates de la discussion ; cette
    section fixe le choix désormais appliqué.
