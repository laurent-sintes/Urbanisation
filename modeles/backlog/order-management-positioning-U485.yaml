user_intuition: 'U486 précise U485 : les Orders, demandes ou dossiers sont les sollicitations qui activent le domaine. Leurs
  familles rendent lisible son offre de prises en charge métier.'
recommendation:
  retain_area: true
  reason: L’Area rend explicites les sollicitations qui activent le domaine et porte leur sens, leur contenu applicable, leurs
    évolutions autorisées et leur reste à satisfaire. Leur continuité subsiste lorsque les processus changent.
  proposed_definition: Order Management rend explicites les demandes que la Supply Chain doit prendre en charge et conserve
    leur sens jusqu’à leur satisfaction ou leur fin. Chaque demande précise ce qui est attendu, pour qui, sous quelles conditions
    et ce qui reste à accomplir ; les autres Areas déterminent et réalisent la réponse appropriée.
  offer_reading: 'Les familles d’Orders constituent une expression de l’offre de prises en charge métier du domaine : ce que
    l’on peut lui demander. Cette fonction d’activation est le premier angle de lecture, avant la représentation des objets
    ou des processus.'
  benefit: Le métier peut comprendre ce que la Supply prend en charge sans reconstruire l’intention depuis les documents,
    tâches et mouvements.
  tradeoff: La séparation impose d’expliciter les échanges avec optimisation, promesse et exécution ; le suivi de la demande
    doit refléter les réalisations sans les dupliquer.
  naming: 'U489 privilégie l’approche Service Order de TM Forum et écarte Management. Recommandation courante : Service Orders
    au pluriel pour D04 ; qualifier séparément les demandes aux Backing Services. Préférence utilisateur enregistrée, renommages
    non appliqués. Les options U487 restent historiques dans naming_U487.'
boundaries:
- D04 ne devient ni une couche supérieure de processus ni un propriétaire de tous les objets métier.
- Un type de demande peut emprunter plusieurs parcours ; un parcours peut mobiliser plusieurs demandes et objets. Aucun lien
  un pour un imposé.
- 'Service Order Management D07.b reste dans Process Management D06 : sollicitations des exécutants pour satisfaire les demandes,
  à distinguer des demandes principales portées par D04.'
- Service Catalog D14 décrit actuellement l’offre des exécutants ; il ne doit pas être assimilé au catalogue des résultats
  offerts par le Domain Supply.
- Les engagements de promesse restent sous D15 ; porter et faire évoluer une demande ne donne pas seul autorité sur sa promesse
  ou sa réalisation.
- Aucun workflow universel, moteur, API, nouveau catalogue ou déplacement de capacité adopté.
examples:
- model_id: D04.k
  name: Transfer Order
  dossier: Maintenir origine, destination, quantités, échéances et reste à satisfaire.
  process: Implantation, réassort, rééquilibrage, consolidation ou satisfaction d’une commande peuvent mobiliser le même type
    de demande.
- model_id: D04.l
  name: Customer Return
  dossier: Conserver le retour demandé, ses motifs, ses quantités et les suites attendues.
  process: Réparation puis remise en stock peuvent se combiner ; le dossier reste intelligible quand le parcours évolue.
- model_id: D04.r
  name: Consignment Replenishment Order
  dossier: Suivre l’apport fournisseur sans achat, jusqu’au reste à recevoir.
  process: Le dossier d’apport peut être terminé alors que la gestion du stock consigné se poursuit.
comparisons:
- source_refs:
  - ELM491
  source: TM Forum TMFC002 / TMFC003
  similarity: Séparation entre capture et validation d’une commande et orchestration de sa livraison.
  difference: Composants fonctionnels et logiciels télécom, périmètres commerciaux et états de livraison propres ; pas une
    Area métier Supply directement équivalente.
  assessment: Contre-exemple documenté à une absence totale de séparation dans le marché.
- source_refs:
  - ELM011
  source: OMG CMMN 1.1
  similarity: Prise en charge d’un sujet avec informations, actions et résultat visé ; dossier évolutif.
  difference: 'Case comprend CaseFile et CasePlanModel : la notion dépasse les seules informations et peut recouvrir une partie
    de Process Management.'
  assessment: Analogie utile pour expliquer le dossier, sans adopter CMMN ou rebaptiser l’Area.
- source_refs:
  - ELM493
  source: IBM Research — business artifacts
  similarity: Entités métier avec informations et cycle de vie ; appui scientifique à la continuité métier portée par les
    Orders.
  difference: L’approche décrit aussi les services faisant évoluer les artifacts ; elle ne prescrit pas une Area autonome
    de gestion des objets.
  assessment: Appui conceptuel ; séparation des responsabilités FLOW reste notre choix.
- source_refs:
  - ELM494
  source: Object-Centric Process Mining — van der Aalst
  similarity: Plusieurs types d’objets et cycles interagissent dans des processus réels.
  difference: Recherche sur événements et analyse de processus, pas catalogue de capacités ni prescription de niveaux.
  assessment: Appui à la distinction type de dossier / type de processus et à leurs relations multiples.
- source_refs:
  - ELM492
  source: TM Forum TMFC006 / TMFC007
  similarity: Distinction entre spécifications de services offertes et demandes de fourniture ; Service Order Management est
    décrit comme point d’entrée du domaine Production.
  difference: SOM inclut l’orchestration ; les services télécom et leur frontière client/ressource ne s’alignent pas directement
    sur D04/D06/D14.
  assessment: Appui à une lecture de l’offre par les prises en charge, sans confondre catalogue, dossier et processus.
