id: model-coherence-audit-U557
date: '2026-09-21'
source_refs:
- U557
- CMP231
- U757
status: findings_followed_by_U560
scope: Backlog hors Authoritative Data et ses descendants ; audit de cohérence et couverture à maille capacité, sans micro-règles
  ni preuve de réalisation installée.
baseline: audits/2026-09-21-model-coherence-U557/baseline.yaml
technical_checks: audits/2026-09-21-model-coherence-U557/structural-checks.yaml
conclusion: Structure cohérente ; aucune disparition accidentelle de responsabilité établie dans les retraits comparés. Cinq
  frontières ou intégrations incomplètes et un lot de quatre décalages éditoriaux empêchent de qualifier le modèle de complètement
  consolidé.
limitations:
- Couverture évaluée sur 15 parcours et les descriptions de 41 capacités/79 comportements ; aucune garantie d’exhaustivité
  de toute la Supply Chain.
- Référentiels exclus, dépendances contrôlées seulement en frontière.
- Audit U431 non rouvert ; précisions futures et réserves antérieures conservées.
- Les sources marché étayent les recommandations ciblées ; aucun nouvel audit exhaustif de toutes les comparaisons éditeurs.
- Absence de preuve de disparition distincte de preuve de réalisation installée ; Sarenza reste non évalué.
- Les états du 17 et du 19 septembre, le baseline U540 et les manifestes de migration couvrent les retraits examinés ; pas
  de rejeu exhaustif de chaque état historique.
