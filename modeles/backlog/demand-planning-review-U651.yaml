- Nouveaux comportements ou renommage de BHV095
clarification_U652:
  source_refs:
  - U652
  - U10
  - U530
  - U531
  - U532
  - U555
  status: clarification_not_approval
  answer: 'Demand Planning correspond à la partie de MAP qui prévoit les ventes et construit la demande à couvrir. Le périmètre
    déclaré de MAP dépasse cette capacité : protections, stockage et achats planifiés.'
  plain_language: Quelles ventes anticipons-nous, pour quels produits, quels canaux et quelles périodes, compte tenu des ventes
    observées et des précommandes connues ?
  market_context: ELM556 et ELM557, relus lors de U651, confortent cette distinction entre prévision de demande et planification
    de sa couverture. Ils ne prouvent aucune réalisation dans MAP.
