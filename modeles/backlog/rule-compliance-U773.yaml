research_U774:
  status: completed_with_evidence_gaps
  consulted_on: '2026-09-25'
  sources:
  - key: a0
    title: Running an Available-to-Promise (ATP) Check in SAP S/4HANA Sales
    url: https://learning.sap.com/courses/performing-the-availability-check/running-an-available-to-promise-atp-check-in-sap-s-4hana-sales_a2b4c5e3-1618-418d-a4f6-efe5ff43f7f1
    element_id: ELM783
    support: L’ATP confronte quantité et date demandées aux disponibilités, puis propose des échéances confirmables.
    limits: Le produit enchaîne calcul et confirmation ; FLOW sépare évaluation, sélection de proposition et engagement de
      la commande. Les stocks futurs restent dans le périmètre ATP de référence.
    access: primary_passages_read
  - key: a1
    title: Explaining Supply Assignment
    url: https://learning.sap.com/courses/exploring-fashion-functions-and-business-processes-in-sap-s-4hana-for-fashion-and-vertical-business/explaining-supply-assignment_af05618d-4954-4f22-9857-3dd12e3940c4
    element_id: ELM208
    support: Supply Assignment affecte les ressources aux commandes et applique des priorités et critères de libération.
    limits: ARun éclaire l’affectation, pas un master plan FLOW complet. BOP revoit les confirmations ; il ne doit pas être
      confondu avec cette affectation.
    access: primary_passages_read
  - key: a2
    title: Running Materials Requirements Planning
    url: https://learning.sap.com/courses/business-processes-in-sap-s-4hana-sourcing-procurement/running-materials-requirements-planning
    element_id: ELM784
    support: Le MRP couvre les besoins nets et produit des propositions de réapprovisionnement selon les règles de lotissement.
    limits: Les propositions d’approvisionnement sont un appui partiel ; le master plan FLOW porte aussi les affectations,
      et son optimisation ne se réduit pas au MRP.
    access: primary_passages_read
  - key: a3
    title: Using Wave Management in Warehousing
    url: https://learning.sap.com/courses/implementing-sap-s-4hana-cloud-public-edition-warehouse-management/using-wave-management-in-warehousing_f5d66de1-603e-40a0-b6f8-a671760c84ce
    element_id: ELM785
    support: Les vagues regroupent des besoins d’entrepôt pour une libération et un traitement coordonnés.
    limits: 'Mécanisme aval WMS : ne démontre pas à lui seul la rétention amont orchestrée par FLOW ni l’optimisation économique
      d’une palette client complète.'
    access: primary_passages_read
  - key: b0
    title: Introducing Goods Movements
    url: https://learning.sap.com/courses/managing-inventory-movements-and-stock-transfers-in-sap-s-4hana-cloud-public-edition/introducing-goods-movements_ba906e87-54e8-4f56-837e-bde4d82599de
    element_id: ELM786
    support: Les mouvements de stock sont enregistrés avec des documents matériels permettant leur traçabilité.
    limits: Le document matériel est une réalisation du journal métier, pas sa définition universelle ; le journal comptable
      reste distinct.
    access: primary_passages_read
  - key: b1
    title: Conducting Physical Inventory
    url: https://learning.sap.com/courses/inventory-management-and-physical-inventory-in-sap-s-4hana/conducting-physical-inventory
    element_id: ELM787
    support: Le comptage physique est comparé au stock enregistré et les écarts sont rapprochés avant correction.
    limits: Le parcours d’inventaire documenté ne justifie pas toutes les méthodes de comptage ni un comportement par écran.
    access: primary_passages_read
  - key: b2
    title: Setting up a Stock Transfer Process for an Intra-Company Stock Tr
    url: https://learning.sap.com/courses/configuring-cross-application-processes-in-sap-s-4hana-sales-and-procurement/setting-up-a-stock-transfer-process-for-an-intra-company-stock-transfer_ad0e9a99-4f15-42d1-9ba5-8eecac49d235
    element_id: ELM788
    support: Le stock transport order organise un transfert avec expédition, transit et réception.
    limits: Un ordre de transfert ne prouve pas une décision d’optimisation du rééquilibrage des stocks.
    access: primary_passages_read
  - key: b3
    title: Executing Sales Order Management
    url: https://learning.sap.com/courses/executing-basic-erp-processes-with-sap-s-4hana/executing-sales-order-management
    element_id: ELM789
    support: Le sales order porte les articles, quantités, dates et conditions convenus ; la livraison et la facturation poursuivent
      son exécution.
    limits: La structure du document SAP éclaire l’engagement, sans imposer le cycle applicatif ou l’organisation ERP à FLOW.
    access: primary_passages_read
  - key: b4
    title: Executing Purchase Order Management
    url: https://learning.sap.com/courses/executing-basic-erp-processes-with-sap-s-4hana/executing-purchase-order-management
    element_id: ELM790
    support: Le purchase order formalise les articles, quantités et conditions de l’achat, éventuellement à partir de documents
      de référence.
    limits: Le document d’achat ne se confond pas avec la prestation logistique confiée pour exécuter cet achat.
    access: primary_passages_read
  - key: b5
    title: Exploring the Return to Supplier (BMK) Scenario
    url: https://learning.sap.com/courses/establishing-core-supply-chain-processes-in-sap-s-4hana-cloud-public-edition/exploring-the-return-to-supplier-bmk-scenario_c73e0390-45fc-4929-95d1-8af0a467f0a9
    element_id: ELM791
    support: Le retour fournisseur peut donner lieu à crédit ou à remplacement avec une nouvelle commande d’achat.
    limits: Une annulation immédiate de réception est distincte ; la réparation fournisseur n’est pas démontrée par ce seul
      parcours.
    access: primary_passages_read
  - key: c0
    title: Managing Freight Orders and Freight Bookings
    url: https://learning.sap.com/courses/implementing-sap-s-4hana-cloud-public-edition-transportation-management/managing-freight-orders-and-freight-bookings_a83a6371-2f56-4fa2-8e12-ae0aab3c74c2
    element_id: ELM792
    support: Freight orders et bookings portent étapes, transporteurs, dates, échanges de statut et documents de transport.
    limits: Les documents de transport étayent seulement une partie de Document Production ; aucun catalogue universel d’ordres
      FLOW n’est natif de ce produit.
    access: primary_passages_read
  - key: c1
    title: Selecting Carriers and Tendering
    url: https://learning.sap.com/courses/business-processes-in-sap-s-4hana-transportation-management/selecting-carriers-and-tendering_d66f6116-ed5d-491f-b91b-e958fdedf2a5
    element_id: ELM793
    support: La sélection du transporteur rapproche coûts, contraintes et capacités disponibles avant sollicitation.
    limits: Le périmètre documenté est le transport ; il ne prouve pas la visibilité de capacité de toutes les prestations.
    access: primary_passages_read
  - key: c2
    title: Configuring Charge Management and Explaining the Charge Calculati
    url: https://learning.sap.com/courses/implementing-sap-s-4hana-cloud-public-edition-transportation-management/configuring-charge-management-and-explaining-the-charge-calculation-process_d2c3b050-5874-4439-a88e-8dcfa231311c
    element_id: ELM794
    support: Les accords et barèmes permettent de calculer des charges de transport selon les étapes, distances et conditions.
    limits: Appui à la composante coût, pas preuve d’un PTP natif SAP couvrant le dossier économique contextuel FLOW ; ni
      choix de promesse ni marge globale déduits.
    access: primary_passages_read
  - key: c3
    title: Performing Value-Added Services (VAS)
    url: https://learning.sap.com/courses/exploring-business-processes-for-supply-chain-execution-in-sap-s-4hana-cloud-private-edition/performing-value-added-services-vas-
    element_id: ELM795
    support: Les VAS orders encadrent le kitting et les consommations de composants associées.
    limits: Appui au kitting ; le dekitting n’est pas démontré ici. FLOW garde ses familles spécialisées, sans réintroduire
      une capacité générique Value-Added Service Order.
    access: primary_passages_read
  - key: c4
    title: Managing Customer Returns
    url: https://learning.sap.com/courses/functions-innovations-in-sap-s-4hana-sales/managing-customer-returns_f224d287-07ad-41fe-9897-2eb2ee4b33dc
    element_id: ELM455
    support: Le retour client articule inspection, décision de suite et traitement ou restitution au client.
    limits: L’inspection de retour est une partie de la famille Inspection Order ; ce parcours ne démontre pas une optimisation
      financière de la récupération de valeur.
    access: primary_passages_read
  - key: c5
    title: Processing a Goods Receipt in SAP EWM
    url: https://learning.sap.com/courses/exploring-business-processes-in-sap-ewm-for-sap-s-4hana-cloud-private-edition/processing-a-goods-receipt-in-sap-ewm
    element_id: ELM796
    support: La livraison entrante encadre la réception EWM et l’enregistrement de son résultat.
    limits: FLOW distingue demande de prestation, réalisation physique et reconnaissance du stock ; la maille Receiving Order
      est un choix métier local.
    access: primary_passages_read
  - key: d0
    title: Maintaining Materials and Business Partners
    url: https://learning.sap.com/courses/exploring-business-processes-for-supply-chain-execution-in-sap-s-4hana-cloud-private-edition/maintaining-materials-and-business-partners
    element_id: ELM063
    support: Les articles et business partners partagent une identité et des vues ou rôles adaptés aux usages métier.
    limits: Une vue produit n’est pas un sous-domaine ; la source de vérité Supply locale n’implique pas la maîtrise des référentiels
      d’entreprise.
    access: primary_passages_read
  - key: d1
    title: Introducing Service Order Management and Monitoring
    url: https://learning.sap.com/courses/implementing-sap-s-4hana-cloud-public-edition-service-management/introducing-service-order-management-and-monitoring_c75846f1-6c1c-4ae4-b1a7-12f560575119
    element_id: ELM797
    support: Le service product et les transactions de service décrivent des prestations et leurs conditions.
    limits: Les services vendus dans SAP ne se confondent pas avec toutes les prestations achetées ou pilotées par FLOW ;
      appui partiel au Service Catalog.
    access: primary_passages_read
  - key: d2
    title: Configuring Pricing for Service Transactions
    url: https://learning.sap.com/courses/performing-basic-customizing-for-service-in-sap-s-4hana-and-sap-s-4hana-cloud-private-edition/configuring-pricing-for-service-transactions_c9d5bd5a-5032-410b-8632-579a947eedcc
    element_id: ELM798
    support: Les conditions de prix s’appliquent aux produits et services des transactions de service.
    limits: Le calcul de prix SAP ne définit pas une frontière de domaine FLOW ; le Price Book porte les conditions, les capacités
      utilisatrices les évaluent.
    access: primary_passages_read
  - key: d3
    title: Maintaining Sites for Retail (3I3)
    url: https://learning.sap.com/courses/exploring-sap-s-4hana-cloud-public-edition-retail/maintaining-sites-for-retail-3i3-
    element_id: ELM095
    support: Les sites retail identifient les lieux qui commandent, reçoivent, stockent ou distribuent des articles.
    limits: Appui aux nœuds du réseau ; les routes, compatibilités et possibilités d’acheminement ne sont pas toutes démontrées
      par cette fiche site.
    access: primary_passages_read
  - key: d4
    title: Introducing Common Features of Consolidation and Mass Processing
    url: https://learning.sap.com/courses/sap-master-data-governance-on-sap-s-4hana/introducing-common-features-of-consolidation-and-mass-processing
    element_id: ELM799
    support: La consolidation MDG rapproche et contrôle les données maîtres de plusieurs origines.
    limits: La gouvernance d’entreprise du produit est plus large que l’autorité locale du référentiel Supply FLOW.
    access: primary_passages_read
  - key: d5
    title: Analyzing SAP S/4HANA Cloud Public Edition, Warehouse Management
    url: https://learning.sap.com/courses/implementing-sap-s-4hana-cloud-public-edition-warehouse-management/understanding-sap-s-4hana-cloud-public-edition-warehouse-management_ff02ecf3-9fe0-499d-b96d-8cc0f7f66900
    element_id: ELM800
    support: L’intégration WMS échange données maîtres, demandes entrantes et sortantes et retours de réalisation ; le monitoring
      expose l’activité.
    limits: FLOW sépare captation Integration, connaissance Visibility et ordres de prestation ; la documentation WMS ne prescrit
      pas ces capacités comme taxonomie native.
    access: primary_passages_read
  - key: e0
    title: Priority-based planning - Supply Chain Management | Dynamics 365 | Microsoft Learn
    url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/master-planning/planning-optimization/priority-based-planning
    element_id: ELM754
    support: La planification prioritaire ordonne les besoins et l’approvisionnement à partir de priorités configurées.
    limits: Les priorités natives de planification sont un mécanisme ; FLOW garde une décision métier explicite et ne limite
      pas sa valeur à un score unique.
