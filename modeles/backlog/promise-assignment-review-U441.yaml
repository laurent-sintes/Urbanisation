status: clarification_recorded_name_adopted_U445
capability_id: D03.n
domain_id: D15
name: Fulfillment Commitment
name_status: adopted_U445
responsibility: Proposer, confirmer et réviser l’engagement de satisfaction en quantités, dates et conditions.
comparison:
- capability: Supply Assignment
  result: Liens de ressources retenues pour la commande
- capability: Promise Management
  result: Proposition et engagement de satisfaction
- capability: Reservation
  result: Blocage des usages concurrents selon U436
independence_cases:
- Réaffectation A vers B sans changer les quantités et dates promises.
- Révision autorisée de date promise après retard de transport, avec les mêmes ressources affectées.
boundaries: Ne pas recalculer un second échéancier, choisir un second plan, tenir le contenu demandé à la place des Orders
  ni créer une réservation implicite.
market_support:
- vendor: SAP
  source_title: Exploring Backorder Processing
  source_url: https://learning.sap.com/courses/optimizing-advanced-logistics-and-analytics-in-sap-s-4hana-cloud-public-edition/exploring-backorder-processing_fed6ddd5-39be-41ab-a977-e41a1c3715fe
  consulted_on: '2026-09-19'
  finding: La réévaluation des confirmations et des priorités éclaire la responsabilité de révision ; elle ne fixe pas une
    capacité FLOW ni son nom.
- vendor: Oracle
  source_title: Key Actions on Orders
  source_url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/25d/faubm/key-actions-on-orders.html
  consulted_on: '2026-09-19'
  source_version: 25D
  source_locator: Attribute Data Simulation Actions ; Release Actions
  finding: Les simulations de planning restent distinctes des informations de scheduling visibles au client ; appui à la distinction
    scénario/engagement, sans équivalence à Supply Assignment.
- vendor: Microsoft
  source_title: Firm planned orders
  source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/master-planning/planning-optimization/planned-order-firming
  consulted_on: '2026-09-19'
  finding: Le firming transforme des ordres planifiés en ordres effectifs. Il ne constitue pas en lui-même une confirmation
    de satisfaction au sens proposé pour FLOW.
approval_scope: U445 adopte uniquement le nom Fulfillment Commitment. Les clarifications de définition, les détails et les
  comparaisons restent éditoriaux ; U435 autorise leur mise au clair. La mention antérieure d’absence de nom adopté décrivait
  l’état U441/U444, avant U445.
naming_U444:
  status: recommended_name_adopted_U445
  recommended_name: Fulfillment Commitment
  proposed_definition: Proposer, confirmer et réviser les engagements de satisfaction d’une commande, en quantités, dates
    et conditions.
  limits: Candidat de vocabulaire FLOW ; aucun consensus de marché établi couvrant exactement les trois effets. Éviter de
    confondre engagement et réalisation physique.
  alternatives:
  - name: Promise Confirmation
    assessment: Trop étroit pour proposition et révision ; déjà le nom de BHV022.
  - name: Order Confirmation
    assessment: Terme établi, mais ambigu avec confirmation documentaire ou acceptation de commande.
  primary_source:
    title: Confirm sales orders
    url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/sales-marketing/tasks/confirm-sales-orders
    consulted_on: '2026-09-19'
    source_version: Documentation évolutive, mise à jour affichée 2026-07-01
    locator: Confirm a single sales order ; Confirm multiple sales orders
    finding: Le statut documentaire et le document de confirmation appartiennent au processus décrit. Ce nom ne distingue
      donc pas suffisamment la responsabilité FLOW discutée.
