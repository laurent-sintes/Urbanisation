acceptance: Arbitrer le lot proposé avant création ou extension canonique. Les scénarios devront référencer les identifiants
  retenus ; les nouveaux identifiants ne seront attribués qu’à l’application, sans réutilisation d’identifiants retirés.
limitations:
- Aucune preuve de réalisation Beaumanoir et aucune obligation d’implémenter les capacités dans FLOW.
- La page SAP Transportation Planning ciblée a renvoyé 404 ; remplacée par Planning Loads, passages consultés.
- Les familles fashion étudiées U774 ne sont pas réputées absentes du marché faute de sources exactes.
- Aucune publication, aucun commit ni push demandés.
