findings:
- id: GAP-01
  title: Inventory Usage Decision
  status: proposed
  classification: new_capability
  priority: P1
  current_model_ids:
  - D01.f
  - D01.g
  - D01.c
  - D02.c
  - service-order-inspection
  - D05.i
  market_source_refs:
  - ELM828
  - ELM829
  market_keys:
  - a0
  - a1
  diagnosis: Les faits et statuts sont tenus ; Inspection Order fournit un constat et Return Disposition Decision ne traite
    que les retours. La décision de restreindre ou réautoriser l’usage d’un stock hors retour n’a pas de responsabilité explicite.
  recommendation: 'Ajouter Inventory Usage Decision dans Inventory Management, type decision, catégorie Inventory Foundation
    : déterminer les usages autorisés ou interdits, quantités, portée et conditions de levée à partir des constats et autorisations
    applicables. Zéro comportement initial ; bloquer puis libérer constitue un cycle, pas deux variantes artificielles.'
  boundaries: 'La décision peut être prise par un responsable qualité externe : le modèle métier reste indépendant de son
    implantation. Inventory Tracking capte les faits ; le Ledger tient l’état reconnu. Ni réservation pour une demande, ni
    affectation Matching, ni inspection physique. Clarifier U436 : l’exclusivité de réservation concerne les usages concurrents,
    pas toute interdiction qualité ou réglementaire.'
  illustrative_scenario: 'Des boutons présentent un défaut sur 500 vestes déjà reçues : interdire leur usage, faire contrôler
    le lot, puis libérer uniquement les quantités autorisées sans modifier leur présence physique.'
  proposed_behaviors: []
- id: GAP-02
  title: Inventory Traceability
  status: proposed
  classification: new_capability
  priority: P1
  current_model_ids:
  - D01.c
  - D01.g
  - D01.f
  - operations-visibility
  - service-order-kitting
  market_source_refs:
  - ELM830
  - ELM831
  market_keys:
  - a2
  - a3
  diagnosis: Les positions, mouvements et progressions existent. Reconstituer la chaîne des origines, transformations et destinations
    pour identifier les biens et demandes touchés n’est pas explicite ; un journal seul ne produit pas cette réponse.
  recommendation: Ajouter Inventory Traceability dans Inventory Management, type knowledge, catégorie Inventory Visibility.
    Produire une connaissance de provenance et de propagation à partir des faits tracés, sans nouvelle source de vérité concurrente.
  boundaries: Tracking reste de type integration. Les identifiants de lots/unités, liens de transformation et limites de couverture
    sont indispensables ; ne pas inventer une généalogie à partir d’un solde. Les données de production peuvent venir d’un
    exécutant externe ; la production n’entre pas dans le domaine.
  illustrative_scenario: Retrouver les kits contenant un accessoire défectueux, les magasins livrés et les commandes encore
    ouvertes, puis remonter au lot fournisseur.
  proposed_behaviors:
  - name: Backward Traceability
    definition: Reconstituer les origines et transformations ayant contribué aux biens concernés, avec preuves et lacunes.
  - name: Forward Traceability
    definition: Identifier les biens dérivés, destinations, livraisons et demandes exposées à partir d’une origine identifiée.
- id: GAP-03
  title: Transport Plan Decision
  status: proposed
  classification: new_capability
  priority: P1
  current_model_ids:
  - D06.e
  - D06.d
  - D06.f
  - service-order-release-decision
  - service-order-transport
  - transport-multi-stop
  - transport-multi-leg
  market_source_refs:
  - ELM832
  - ELM834
  - ELM805
  market_keys:
  - b1
  - c0
  - c1
  diagnosis: Le modèle conserve la demande de trajet, sélectionne les prestataires et libère des lots d’ordres. Le choix d’un
    ensemble cohérent de chargements, arrêts et acheminements est seulement renvoyé à la coordination, sans capacité explicite.
  recommendation: 'Ajouter Transport Plan Decision dans Fulfilment Orchestration, type decision, catégorie Définir et choisir
    les prestations : déterminer le plan de transport demandé, ses regroupements et acheminements compatibles. Le nom est
    une adaptation FLOW des fonctions Transportation/Load Planning.'
  boundaries: Préserver promesses et affectations Matching. Service Selection Decision garde le choix de services/exécutants
    ; Release Decision garde le moment de sollicitation. Les Transport Orders portent le plan confié. Placement 3D, conduite
    et tournées internes non commandées restent chez le prestataire. Ne pas créer un second master plan de matching.
  illustrative_scenario: 'Six magasins doivent recevoir vendredi : regrouper les expéditions en deux chargements compatibles
    et déterminer les arrêts, plutôt que seulement envoyer six ordres au même moment.'
  proposed_behaviors:
  - name: Load Consolidation
    definition: Constituer des chargements compatibles selon marchandises, capacités, destinations et échéances.
  - name: Routing & Scheduling
    definition: Déterminer les étapes, arrêts et échéances du plan confié selon les trajets et contraintes admissibles.
- id: GAP-04
  title: Scrapping Order
  status: proposed
  classification: new_capability
  priority: P1
  current_model_ids:
  - BHV054
  - D05.i
  - service-order-picking
  - service-order-transport
  - D01.g
  - subdomain-service-orders
  market_source_refs:
  - ELM835
  - ELM833
  market_keys:
  - d0
  - b2
  diagnosis: Scrapping est un comportement de Return Order qui conserve la suite du retour. Il ne constitue pas la demande
    de mise au rebut confiée à un exécutant, notamment pour un stock détérioré sans retour.
  recommendation: 'Ajouter Scrapping Order dans Service Order Management, type action, catégorie Prestations d’entrepôt :
    tenir la prestation autorisée de mise au rebut, les quantités, consignes, justificatifs et reliquats. Zéro comportement
    initial.'
  boundaries: La décision d’orientation reste distincte. Une écriture comptable ou une sortie de stock ne prouve pas la réalisation
    physique. Le nom de famille est un choix FLOW, non un ordre natif commun aux deux éditeurs. Ne pas étendre automatiquement
    aux dons, ventes de déstockage ou à toutes les filières de recyclage.
  illustrative_scenario: Des articles abîmés sur site sont orientés vers une filière autorisée ; confier le traitement et
    attendre la preuve portant sur les quantités effectivement traitées.
  proposed_behaviors: []
- id: GAP-05
  title: Étendre Return Disposition Decision
  status: proposed
  classification: scope_extension
  priority: P1
  current_model_ids:
  - D05.i
  - BHV048
  - BHV049
  - service-order-inspection
  market_source_refs:
  - ELM828
  - ELM829
  - ELM835
  - ELM833
  market_keys:
  - a0
  - a1
  - d0
  - b2
  diagnosis: Le choix du devenir logistique est limité aux produits retournés. Un stock endommagé pendant le stockage ou refusé
    au contrôle peut nécessiter les mêmes arbitrages sans Return Order.
  recommendation: Généraliser D05.i en Inventory Disposition Decision, dans Fulfilment Orchestration, en conservant son identité
    et ses deux stratégies Policy-based Disposition et Value Recovery Optimization. Ne pas ajouter une seconde capacité presque
    identique.
  boundaries: 'GAP-01 décide les droits d’usage ; cette décision choisit réparation, reconditionnement, retour fournisseur
    ou sortie définitive autorisée. Matching conserve les déplacements et affectations ; Commerce et Finance conservent leurs
    décisions. Marché : blocage et orientation sont parfois combinés, leur séparation est un choix de responsabilité FLOW.'
  illustrative_scenario: 'Un dégât des eaux touche des manteaux en réserve : comparer nettoyage, réparation et sortie autorisée,
    même sans retour client.'
  proposed_behaviors: []
- id: GAP-06
  title: Deux variantes de prestation d’inspection
  status: proposed
  classification: behavior_gap
  priority: P2
  current_model_ids:
  - service-order-inspection
  - D07.a
  - D05.i
  market_source_refs:
  - ELM837
  - ELM838
  - ELM839
  market_keys:
  - f0
  - f1
  - f2
  diagnosis: Inspection Order décrit le résultat attendu de façon générique. Il ne distingue pas preuve individuelle et conclusion
    portant sur un lot à partir d’un échantillon.
  recommendation: 'Ajouter deux comportements si cette distinction contractuelle est retenue : Unit-by-Unit Inspection et
    Sampling-Based Inspection. Décrire obligations, portée du résultat et conditions de clôture, plutôt que les techniques
    de prélèvement.'
  boundaries: Un taux, une quantité fixe, un écran ou une méthode de test restent des paramètres. L’intérêt de la décomposition
    est la nature de la preuve attendue ; sinon conserver ces précisions dans le protocole de l’Order. La conclusion d’inspection
    ne remplace pas la décision d’usage ou de disposition.
  illustrative_scenario: Contrôler individuellement 50 vestes réparées exige un résultat pour chacune ; apprécier un lot neuf
    de 2 000 pièces par échantillon exige le protocole, l’échantillon et la portée de la conclusion.
  proposed_behaviors:
  - name: Unit-by-Unit Inspection
    definition: Tenir la demande d’un contrôle de chaque unité du périmètre convenu et rapprocher les résultats individuels
      attendus.
  - name: Sampling-Based Inspection
    definition: Tenir la demande d’une appréciation de lot à partir d’un échantillon convenu, avec protocole, preuves et limites
      de représentativité.
- id: GAP-07
  title: 'Alternatives autorisées : expliciter leur provenance'
  status: proposed
  classification: reference_clarification
  priority: P2
  current_model_ids:
  - D08
  - D08.e
  - D12
  - D03.j
  - D03.l
  - D03
  market_source_refs:
  - ELM836
  - ELM540
  market_keys:
  - d1
  - d2
  diagnosis: Les substitutions autorisées sont supposées par CTP, PTP, Matching et un scénario, mais leur provenance, validité
    et conditions de consommation ne sont pas clairement attribuées au référentiel local.
  recommendation: Expliciter dans Product Reference et son ingestion/Visibility les relations d’alternative reçues, leur sens,
    validité et autorité. Les conditions commerciales restent auprès de leur source ; aucune capacité de substitution supplémentaire
    proposée.
  boundaries: 'La similarité produit n’autorise pas une substitution. Les commandes préservent le demandé et l’accepté ; ATP/CTP
    évaluent les options, Promise Selection choisit une proposition. Source SAP lue surtout sur alternatives de site : correspondance
    partielle, pas preuve complète d’équivalences produit.'
  illustrative_scenario: Une référence remplacée par sa nouvelle version est autorisée pour une période ; une couleur seulement
    ressemblante ne devient pas substituable sans accord.
  proposed_behaviors: []
- id: GAP-08
  title: 'Stocktaking Order : famille conditionnelle'
  status: proposed
  classification: conditional_service_family
  priority: P2
  current_model_ids:
  - D01.d
  - BHV029
  - BHV030
  - BHV031
  - subdomain-service-orders
  market_source_refs:
  - ELM207
  - ELM825
  market_keys:
  - d3
  - e0
  diagnosis: Stocktaking couvre déjà la politique, la demande de contrôle et le rapprochement. Il n’existe pas de famille
    distincte pour le comptage confié avec un engagement de prestation autonome.
  recommendation: Ne pas créer par défaut. Si FLOW commande et suit le comptage comme prestation distincte, envisager Stocktaking
    Order dans Service Order Management ; Stocktaking conserverait politique, rapprochement et corrections.
  boundaries: Les work/document éditeurs prouvent des travaux demandés, pas un besoin d’Order autonome dans tous les contextes.
    Sans engagement propre, la capacité existante suffit ; ne pas dupliquer ses trois comportements.
  illustrative_scenario: Un prestataire accepte d’inventorier quatre magasins à une date, livre des résultats partiels puis
    un solde ; cet engagement pourrait justifier la famille.
  proposed_behaviors: []
not_recommended:
- topic: Order Lifecycle / Order Hold Management
  reason: Suspension, reprise, gel, annulation, reliquat et engagements sont explicitement communs aux familles Order. Ne
    pas recréer une capacité retirée.
  model_ids:
  - D04
  - subdomain-service-orders
- topic: Nouvelles variantes ATP par site, transport ou substitution
  reason: Options déjà évaluables ; les comportements retenus distinguent la profondeur. Une alternative n’est pas automatiquement
    du CTP.
  model_ids:
  - D03.i
  - D03.j
  - D03.k
  - D03.l
- topic: Comptage sur seuil ou anomalie
  reason: BHV030 prévoit déjà un seuil ; BHV031 couvre la sollicitation ponctuelle. Aucun manque démontré.
  model_ids:
  - BHV030
  - BHV031
  source_refs:
  - ELM207
  - ELM825
- topic: Recall Management autonome
  reason: 'Le rappel est d’abord un scénario transverse : retrouver les biens concernés, interdire les usages, suspendre les
    Orders, organiser les retours et leur traitement. La décision de rappel et la communication réglementaire/commerciale
    restent sous leur autorité externe ; ne pas importer tout le Quality Management.'
  model_ids:
  - D04
  - D04.l
  - D06.d
  - D05.i
  depends_on:
  - GAP-01
  - GAP-02
- topic: Putaway / Storage Order systématiques
  reason: Le rangement interne appartient à l’exécutant et Receiving Order ne crée pas implicitement une prestation autonome.
    Une garde avec engagements de durée, conditions et restitution mériterait une famille seulement si elle est réellement
    confiée. Pas de double appui primaire assez précis établi sur ce contrat de service dans cette recherche ; piste conditionnelle,
    non recommandation ferme.
  model_ids:
  - service-order-receiving
  - subdomain-service-orders
- topic: Inventaire statistique
  reason: SAP mentionne une voie externe de sample-based inventory ; l’acceptance sampling Dynamics vérifie la qualité, pas
    une extrapolation des quantités de stock. Ne pas fabriquer une équivalence ni un comportement sur cette preuve.
  source_refs:
  - ELM825
  - ELM838
- topic: Fonctions ERP/WMS/TMS internes
  reason: Comptabilité de stock, paie et charge du personnel, slotting, pilotage machines, conduite et placement 3D ne sont
    pas ajoutés. Leurs contraintes et résultats peuvent alimenter l’orchestration sans absorber leur réalisation.
