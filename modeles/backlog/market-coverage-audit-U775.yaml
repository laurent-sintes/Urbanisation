  - TER075
  required_if_adopted:
  - Distinguer restriction d’usage et réservation ; revoir la portée du mot disponibilité.
  - Définir lot et traçabilité amont/aval sans transformer Tracking integration en connaissance.
  - Distinguer retour, décision de disposition et prestation de mise au rebut.
