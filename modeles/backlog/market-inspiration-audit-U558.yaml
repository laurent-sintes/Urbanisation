- retired_id: BHV046
  successor_ids:
  - D02.e
  previous_inspiration:
    choice: Compléter le manque sans défaire ce qui est déjà affecté stabilise la préparation des commandes. Incremental Supply
      Assignment préserve les liens existants et traite le reliquat, sans créer un gel durable.
    flow_scope: Besoins restant sans affectation.
    flow_approach: Compléter les liens en conservant ceux du périmètre préservé.
    synthesis:
    - 'SAP fournit un exemple direct : sans réaffectation, 70 pièces déjà affectées sont conservées et les 30 manquantes sont
      examinées. Microsoft préserve également des liens pour les demandes confirmées, mais dans une chaîne de planification
      plus large.'
    - FLOW nomme le bénéfice métier de stabilité. Incremental ne prescrit pas un algorithme ; si un lien conservé devient
      irréalisable, l’exception appelle un arbitrage plutôt qu’une révision silencieuse.
    examples:
    - title: SAP — conserver 70 et compléter 30
      situation: Une ligne demande 100 pièces ; 70 sont déjà affectées.
      outcome: Sans option Reassignment, SAP conserve les 70 et recherche les 30 supplémentaires.
      lesson: FLOW retient la politique de conservation pendant ce traitement, sans en déduire un gel permanent.
      source_title: Backorder Processing — Reassignment
      source_url: https://help.sap.com/docs/PRODUCT_ID/f132c385e0234fe68ae9ff35b2da178c/6b8eb017a1d1431abde00056a249f72b.html
      source_refs:
      - U477
