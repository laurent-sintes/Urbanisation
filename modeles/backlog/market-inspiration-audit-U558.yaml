findings:
- id: INS558-01
  priority: à traiter en premier
  title: Transmission incomplète des inspirations des comportements regroupés
  node_ids:
  - D02.e
  - D04.s
  - D03.p
  observation: Les URLs des sources de toutes les fiches conservées sont préservées. En revanche, cinq URLs des comportements
    retirés ne figurent plus dans les comparaisons du périmètre courant. Les autres appuis des comportements retirés ne sont
    pas tous rattachés au successeur ; plusieurs sont ailleurs dans le modèle.
  examples:
  - L’exemple SAP de conservation de 70 pièces et complément de 30, opposé au réexamen des 100 pièces, n’est plus présenté
    dans Supply Assignment.
  - L’appui SAP EDQA au déclenchement par impondérable reste dans les preuves historiques ; le successeur n’en restitue pas
    la comparaison.
  - Le suivi de réalisation issu de Salesforce Service Process Studio n’est plus repris dans les comparaisons courantes.
  interpretation: 'Perte de restitution de certains appuis et exemples ; aucune destruction des sources historiques. Une URL
    absente ne suffit pas à conclure à une fonction non étayée : certaines références se recouvrent ou ont une autre édition.'
  recommendation: Rattacher aux successeurs les apports toujours utiles avec leur limite et leur provenance, ou justifier
    explicitement leur remplacement. Fusionner les comparaisons, pas seulement les descriptions métier ; ne pas recréer les
    comportements retirés.
  source_refs:
  - U558
  - U541
  - U552
  - ELM378
  - ELM381
  - ELM382
  - ELM495
  - ELM496
  - ELM497
- id: INS558-02
  priority: complément éditorial
  title: Deux nouveaux comportements sans synthèse d’inspiration illustrée
  node_ids:
  - BHV094
  - BHV095
  observation: Inventory Plan Application et Demand Plan Publication disposent chacun de deux documents de comparaison, mais
    pas de market_inspiration (choix, périmètre/approche FLOW, synthèse et exemple). Les 126 autres fiches examinées en disposent.
  interpretation: Les sources ne manquent pas ; la présentation est moins complète. Le composant Atlas affiche dans ce cas
    des cartes de comparaison, sans le tableau de synthèse illustré. Ce constat porte sur le rendu possible du backlog lors
    d’une future publication, pas sur un changement déjà publié.
  recommendation: Compléter la synthèse et un exemple clairement qualifié, sans inventer une équivalence éditeur. Conserver
    la distinction export technique / publication métier et transmission / application effective.
  source_refs:
  - U558
  - U552
  - ELM566
  - ELM568
  - ELM569
  - ELM570
  evidence:
  - app/src/components/MarketComparisons.tsx
  - modeles/schemas/urbanism.schema.json
- id: INS558-03
  priority: à corriger avant restitution
  title: Demand Planning mêle approche FLOW et description des sources dans le tableau
  node_ids:
  - D17.a
  observation: Dans la ligne Oracle Demand Plan, approach_summary parle de prise en compte des possibilités et apports planifiés.
    Le passage primaire cité décrit la prévision collaborative/statistique et sa consommation par un plan Supply ou Replenishment
    ; il ne démontre pas cette formulation. La ligne SAP décrit la distinction entre plan, demande connue et engagement, qui
    est surtout notre frontière FLOW.
  interpretation: Proximité fonctionnelle recevable, mais attribution trop large dans la colonne Approche des éditeurs. La
    synthèse actuelle de D17.a ne restitue par ailleurs que les appuis Oracle de publication, alors que SAP reste un appui
    important au cœur de Demand Planning.
  recommendation: Décrire Oracle par prévision collaborative/statistique et alimentation des plans ; SAP par signaux, prévision,
    collaboration et demand sensing. Placer les frontières et adaptations propres à FLOW dans la ligne FLOW et la synthèse
    ; rétablir cette synthèse au niveau de la capacité entière.
  source_refs:
  - U558
  - ELM556
  - ELM557
  primary_evidence:
  - url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/26b/faupc/overview-of-supply-chain-planning-plan-types.html
    consulted_on: '2026-09-21'
    version: 26B
    locator: Tableau, ligne Demand Plan
  - url: https://www.sap.com/products/scm/integrated-business-planning/features/demand-planning.html
    consulted_on: '2026-09-21'
    version: page évolutive
    locator: Forecast ; collaboration ; demand sensing
- id: INS558-04
  priority: qualité de lecture
  title: Éditions en doublon et colonnes répétitives après enrichissement
  node_ids:
  - BHV091
  - BHV092
  - BHV094
  - BHV095
  - D03.p
  - D04.s
  - D05.f
  - D17.a
  observation: BHV091, BHV092 et D03.p présentent un même document Oracle en plusieurs éditions. Seize lignes sur huit fiches
    ont des textes Périmètre et Approche identiques. Même après normalisation des éditions, chaque fiche conserve au moins
    deux documents distincts.
  interpretation: Pas de manque numérique de sources. Ces répétitions allongent le tableau sans expliciter ce que chaque référence
    apporte au choix du modèle.
  recommendation: Présenter l’édition pertinente au premier plan, garder les précédentes en provenance et distinguer couverture
    et manière d’agir dans les colonnes. Préserver les apports spécifiques au lieu d’accumuler les lignes.
  source_refs:
