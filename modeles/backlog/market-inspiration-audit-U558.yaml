- retired_id: BHV047
  successor_ids:
  - D02.e
  previous_inspiration:
    choice: Changer les ressources liées aux commandes permet d’appliquer un nouvel arbitrage sans réécrire leur demande.
      Supply Reassignment révise seulement les affectations modifiables et respecte les engagements, réservations et gels.
    flow_scope: Liens de ressources dont la révision est autorisée.
    flow_approach: Appliquer les nouveaux liens en préservant les restrictions.
    synthesis:
    - 'SAP Reassignment peut remettre en jeu toutes les quantités d’une ligne. Microsoft Keep supply for confirmed demand
      montre le choix inverse : préserver la couverture de demandes confirmées, avec des règles particulières au stock reçu.
      Les sources éclairent la frontière entre révisable et protégé.'
    - FLOW reprend Reassignment sans imposer une suppression et reconstruction complète. La [réaffectation](glossary:VER018)
      applique le choix ; elle ne donne pas à elle seule le droit de dégrader une promesse.
    examples:
    - title: SAP — réexaminer les 100 pièces
      situation: Une ligne de 100 pièces possède déjà 70 pièces affectées.
      outcome: Avec Reassignment, SAP remet en jeu l’affectation de la ligne entière.
      lesson: FLOW peut réviser seulement les liens utiles ; le périmètre révisable doit rester explicite.
      source_title: Backorder Processing — Reassignment
      source_url: https://help.sap.com/docs/PRODUCT_ID/f132c385e0234fe68ae9ff35b2da178c/6b8eb017a1d1431abde00056a249f72b.html
