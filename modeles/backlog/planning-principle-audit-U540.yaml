information_reference_maintenance:
  scope: Correction de deux rôles internes après changement de niveau, sans extension du catalogue Informations ni changement
    de sa visibilité.
  before:
  - id: PINFO-013
    name: Supply Assignment
    label_fr: Affectation de ressources
    question: Quelle ressource est affectée à quelle demande, pour quelle part ?
    definition: Lien retenu entre une ressource et une partie de demande à satisfaire, avec la quantité et les conditions
      d’application de cette affectation.
    context: Une affectation identifiée par son sens ressource–demande, distincte du plan qui l’a choisie, de la promesse
      et du droit de réservation.
    essential_elements:
    - Ressource concernée et demande bénéficiaire.
    - Quantité avec unité et contexte d’application.
    - Conditions particulières de maintien, par exemple un gel, seulement lorsqu’elles sont explicites.
    granularity_rationale: Ressource seule ou quantité seule ne dit pas à quelle demande elle est affectée. Plusieurs liens
      peuvent composer un plan sans fusionner leur sens.
    document_and_fact_boundary: Cette information n’est pas, à elle seule, un fait de gestion. Tout fait de gestion s’appuie
      sur un document métier identifié ; chaque propriété descriptive n’exige pas son propre document.
    boundaries:
    - Un gel limite la modification de l’affectation ; il ne réserve pas automatiquement.
    - L’affectation peut changer sans modifier la promesse si les conditions restent compatibles.
    capability_roles:
    - capability_ref: D02.e
      role: établit et fait évoluer
      meaning: Applique et maintient les liens choisis ; ne décide pas à nouveau le plan.
      source_refs:
      - U345
      - U364
      - U436
    - capability_ref: D03.o
      role: détermine le choix utilisé
      meaning: Fulfillment Plan Decision choisit le scénario dont découlent les affectations à appliquer.
      source_refs:
      - U378
      - U460
    examples:
    - title: Exemple illustratif
      situation: 40 pièces affectées depuis A à la demande L sont réaffectées depuis B. Si la même date et les mêmes conditions
        sont possibles, la promesse reste inchangée. Sans réservation, ce lien ne bloque pas les usages concurrents.
      source_refs:
      - U345
      - U364
      - U436
      - U443
      - U460
      - ELM284
    source_refs:
    - U464
    - U465
    - U345
    - U364
    - U436
    - U443
    - U460
    - ELM284
    - CMP184
    - U468
    review:
      state: proposed
      note: Fiche issue du pilote U465. Définition, granularité, rôles et rapprochements proposés ; exemple illustratif, pas
        une observation installée.
    market_comparisons:
    - vendor: Microsoft
      product: Dynamics 365 Planning Optimization
      element_name: Microsoft — Keep supply for confirmed demand
      element_type: Concept ou exemple documentaire
      relationship: Appui sémantique
      similarities: Un lien ressource–demande peut être maintenu ou réexaminé lors de la planification.
      differences: Le mécanisme produit recoupe plusieurs capacités FLOW. Il ne prouve ni équivalence complète avec Supply
        Assignment ni réservation par une affectation FLOW.
      flow_position: La préservation de liens pour une demande confirmée chez Microsoft éclaire le maintien d’une affectation.
        Son paramétrage ne prescrit ni le gel FLOW ni un blocage implicite.
      term_choice: Supply Assignment conserve le vocabulaire FLOW d’affectation. Pegging est un terme produit de rapprochement
        offre–demande ; Allocation peut désigner d’autres droits ou protections.
      definition_choice: La préservation de liens pour une demande confirmée chez Microsoft éclaire le maintien d’une affectation.
        Son paramétrage ne prescrit ni le gel FLOW ni un blocage implicite.
      source_title: Microsoft — Keep supply for confirmed demand
      source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/master-planning/planning-optimization/keep-supply-for-confirmed-demand
      source_version: Document et passages datés dans le localisateur
      consulted_on: '2026-09-19'
      source_locator: What data is preserved ; Control how on-hand inventory is pegged ; documentation indiquée le 27 juillet
        2026
      evidence_limits: Page officielle consultée ; synthèse sans reproduction du contenu.
      status: proposed
      source_refs:
      - ELM284
      - CMP184
      - U468
  - id: PINFO-014
    name: Reservation
    label_fr: Réservation de ressources
    question: Quelle part de ressource est rendue indisponible aux demandes concurrentes, au bénéfice de qui ?
    definition: Droit établi pour un besoin bénéficiaire sur une quantité de ressources définies par un périmètre, qui bloque
      les usages concurrents selon les conditions de réservation applicables.
    context: Périmètre de ressources suffisamment défini pour comprendre ce qui est réservé ; pas nécessairement un lot ou
      exemplaire déjà affecté.
    essential_elements:
    - Besoin bénéficiaire et périmètre de ressources concerné.
    - Quantité avec unité.
    - Conditions métier de l’opposabilité ; limites de durée seulement lorsqu’elles sont établies.
    granularity_rationale: Quantité, périmètre et bénéficiaire forment le sens du droit. Un lot précis n’est pas indispensable
      à toute réservation ; son attribution répond à une autre question.
    document_and_fact_boundary: Cette information n’est pas, à elle seule, un fait de gestion. Tout fait de gestion s’appuie
      sur un document métier identifié ; chaque propriété descriptive n’exige pas son propre document.
    boundaries:
    - Réservation n’est ni mouvement physique ni simple affectation.
    - Expiration, libération, consommation et effets d’une annulation ne sont pas automatisés par la définition.
    capability_roles:
    - capability_ref: D02.c
      role: établit et fait évoluer
      meaning: Maintient le droit opposable selon les règles métier de réservation.
      source_refs:
      - U436
      - U460
    - capability_ref: D02.e
      role: utilise
      meaning: Tient compte des droits de réservation lors de l’application d’une affectation.
      source_refs:
      - U436
      - U460
    examples:
    - title: Exemple illustratif
      situation: 40 pièces de V sur le périmètre P sont réservées au besoin L, sans lot choisi. Les demandes concurrentes
