status: completed_landscape_review_with_open_editorial_recommendations
scope:
  capabilities_reviewed: 58
  behaviors_scanned: 82
  relations_structurally_reviewed: 369
  method: Lecture de toutes les définitions de capacités et comportements ; scopes, preuves et liens approfondis pour les
    frontières affectées. Revue structurelle des relations et conservation des coopérations incidentes. Ne constitue pas une
    nouvelle expertise de marché exhaustive de chaque fiche ni un rejeu U431.
principle: Application du résultat comme comportement du Planning ; décisions distinctes ; configuration consommée et responsabilités
  métier autonomes extérieures.
findings:
- id: PP01
  title: Application portée par le Planning
  targets:
  - D03.p
  - D05.f
  - D17.a
  - D17.b
  conclusion: 'Principe cohérent pour les quatre Plannings, avec résultats différents : affectations du carnet, actions du
    scénario de stock, demande de référence applicable, couverture/apports à mettre en œuvre. Aucun comportement générique
    identique imposé.'
  action: D03.p intègre Supply Assignment. D05.f est clarifié ; les applications détaillées des autres plans restent à décrire
    au niveau pertinent.
  evidence:
  - U537
  - ELM496
  - ELM566
  status: partially_integrated_remaining_details_proposed
- id: PP02
  title: Supply Assignment devient un comportement du planning du carnet
  targets:
  - D02.e
  - D03.p
  - BHV045
  - BHV046
  - BHV047
  conclusion: U539 suivi de la clarification U541 vise le planning opérationnel conservé sous le nom Order Backlog Planning.
  action: D02.e conserve son identifiant et devient comportement sous D03.p. BHV045–047 sont consolidés comme modalités descriptives,
    avec conservation intégrale dans la baseline et succession explicite ; aucun sous-comportement.
  evidence:
  - U539
  - U541
  - ELM452
  - ELM496
  status: integrated_parent_contextual_interpretation
- id: PP03
  title: Configuration extérieure et décision distincte
  targets:
  - D02.b
  - D05.d
  - D05.a
  - D05.h
  conclusion: Déterminer une protection, en gouverner la validité et l’utiliser dans un plan sont des responsabilités différentes.
    Les quatre comportements de Supply Protection restent extérieurs au Planning.
  action: Maintenir décisions et Supply Protection ; la consommation ou la sollicitation de changements est une coopération,
    pas une décomposition.
  evidence:
  - U538
  - ELM567
  - ELM496
  status: boundary_confirmed
- id: PP04
  title: Engagements et gestion durable ne se réduisent pas à appliquer un plan
  targets:
  - D02.c
  - D03.n
  - D04.o
  - D04.i
  - D04.j
  - D04.k
  - D04.l
  - D04.m
  - D04.r
  - D07.b
  - D01.h
  conclusion: Reservation produit un engagement opposable, Fulfillment Commitment une promesse, les Orders et la consignation
    conservent demandes, engagements et suites au-delà d’une application de plan.
  action: Conserver ces capacités partenaires ; leur mobilisation par Planning ne justifie pas leur absorption. La frontière
    repose sur les résultats métier, pas une couche transactionnelle.
  evidence:
  - U436
  - U443
  - ELM411
  - ELM353
  - ELM566
  status: retention_recommended
- id: PP05
  title: Process Orchestration dépasse le déclenchement du plan
  targets:
  - D06.d
  - D06.f
  - D07.a
  - D06.e
  - D07.d
  conclusion: Coordonner la progression, les dépendances, les attentes et les impondérables pendant les prestations est une
    responsabilité durable. La décision d’adaptation reste distincte.
  action: Conserver Process Orchestration ; ne pas créer Process Planning ni reléguer l’orchestration à un comportement de
    l’Area Planning par simple analogie.
  evidence:
  - ELM330
  - ELM353
  status: retention_recommended
- id: PP06
  title: 'Demande de réexamen et Planning : risque de doublon de lecture'
  targets:
  - D04.s
  - BHV091
  - BHV092
  - BHV093
  - D03.p
  conclusion: Les scopes distinguent déjà faire étudier et suivre une demande de l’étude et application du plan. Les intitulés
    et définitions Simulation & Analysis et Plan Activation Follow-up peuvent toutefois laisser lire une seconde autorité.
  action: 'Proposer une clarification éditoriale : demande porte motif, portée, autorisation et suivi ; Planning porte étude
    du plan et application. Aucun retrait des comportements U501 ou fusion de capacités décidé dans cet audit.'
  evidence:
  - U501
  - ELM496
  - ELM566
  status: editorial_boundary_proposed
- id: PP07
  title: Supply Planning trop large pour la capacité de couverture envisagée
  targets:
  - D17
  - D17.b
  - D03.p
  - D05.f
  conclusion: Supply Planning peut désigner un ensemble de fonctions chez les éditeurs. Le contenu actuel de D17.b vise surtout
    le plan d’ensemble de couverture et les apports ; son nom ne doit pas aspirer le planning du carnet et celui du stock.
  action: Conserver l’Area Planning et le nom Order Backlog Planning. Laisser D17.b en réexamen nominal/de périmètre ; documenter
    ses résultats avant de proposer un nom plus précis. Pas de nouvelle Area déduite de U541.
  evidence:
  - U534
  - U541
  - ELM557
  - ELM564
  status: name_and_scope_open
- id: PP08
  title: 'Décisions : corriger les verbes qui suggèrent une exécution'
  targets:
  - BHV024
  - BHV025
  - D05.c
  conclusion: Les définitions courtes Déplacer/Regrouper semblent réaliser les transferts alors que les scopes précisent une
    recommandation de redistribution. Ce décalage ne justifie pas un déplacement de parent.
  action: Proposer Déterminer les transferts / Déterminer les regroupements pour aligner les fiches sur leurs scopes ; pas
    de nouvelle capacité ni réalisation physique transférée.
  evidence:
  - U318
  - U537
  status: editorial_correction_proposed
