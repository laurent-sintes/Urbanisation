followup_U543:
  analysis_ref: modeles/backlog/inventory-planning-intentions-U543.yaml
  direction: Inventory Planning trop agrégé selon Laurent. Étudier les capacités par intention ; Inventory Plan Application
    générique suspendu, aucune capacité de remplacement adoptée.
followup_U544:
  analysis_ref: modeles/backlog/inventory-optimization-planning-option-U544.yaml
  direction: 'Alternative à la scission : Inventory Optimization Planning pour arbitrer plusieurs ajustements vers un stock
