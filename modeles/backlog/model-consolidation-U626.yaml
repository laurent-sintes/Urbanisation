      similarities: Éclaire la coordination entre besoins, ressources, propositions et contraintes.
      differences: Plusieurs plans et simulations sont possibles ; le document n’impose ni plan technique unique ni optimum
        mathématique.
      flow_position: Le plan Supply de référence peut regrouper satisfaction des demandes et propositions d’apports. Les différentes
        simulations restent possibles ; un plan retenu commun est un choix de gouvernance FLOW.
      source_title: Master plans overview
      source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/master-planning/master-plans
      source_version: Documentation évolutive ; mise à jour affichée 25 mars 2026
      source_locator: Using master plans ; Firming ; Negative days
      consulted_on: '2026-09-21'
      evidence_limits: Document primaire directement consulté. Aucun déploiement Beaumanoir ou optimum universel déduit.
      status: proposed
      source_refs:
      - U567
      - ELM303
      - CMP237
    - vendor: SAP
      product: Integrated Business Planning — Time-Series-Based Supply Planning
      element_name: Time-Series-Based Supply Planning Optimizer
      concept_name: Time-Series-Based Supply Planning Optimizer
      element_type: Mécanisme ou processus de planification documenté dans un produit
      relationship: Recouvrement partiel
      scope_summary: Optimisation conjointe de production, distribution, achats et stock, sous contraintes et coûts du réseau
        modélisé.
      approach_summary: Minimiser les coûts du réseau modélisé sous contraintes.
      similarities: Éclaire la coordination entre besoins, ressources, propositions et contraintes.
      differences: Planification par périodes, pas ARun ni preuve d’affectation transactionnelle à chaque commande. Les coûts
        du modèle ne valent pas toutes les dimensions de valeur FLOW.
      flow_position: Une planification intégrée peut éviter des arbitrages locaux incompatibles. Le nom, les propriétaires
        et la décomposition FLOW restent à reconsidérer à partir de cette responsabilité commune.
      source_title: Time-Series-Based Supply Planning Optimizer
      source_url: https://help.sap.com/docs/SAP_INTEGRATED_BUSINESS_PLANNING/c1fb60cb1e9c49d99ada277ae57e9e6c/deb28978d5ba4c64bad78edcab913228.html
      source_version: IBP 2605 — I_SAPIBP2
      source_locator: Introduction ; Supply distribution ; Optimization ; Planning constraints
      consulted_on: '2026-09-21'
      evidence_limits: Texte primaire indexé consulté ; ouverture directe sans texte exploitable. Aucun déploiement Beaumanoir
        ou optimum universel déduit.
      status: proposed
      source_refs:
      - U567
      - ELM579
      - CMP237
    market_inspiration:
      choice: Supply Planning porte la demande à couvrir dans le périmètre FLOW ; le planning amont producteur de demandes
        planifiées n’est pas dupliqué.
      flow_scope: L’Area regroupe les responsabilités de planification d’ensemble retenues dans Supply Chain Orchestration.
        [Demand Planning](model:D17.a) construit et actualise la demande à couvrir, puis rend le résultat retenu applicable
        aux consommateurs. Le plan est régulièrement mis à jour ; la date ou la cadence de calcul ne définit pas sa frontière.
      flow_approach: Confronter prévisions, demandes connues et faits observés ; distinguer leur planification de la gestion
        des demandes issues d’un plan amont.
      synthesis:
      - Oracle distingue plans de demande, de couverture et plan intégré ; SAP documente la couverture sous contraintes et
        présente Demand planning séparément. Ces références éclairent les responsabilités, sans imposer le périmètre du Domain
        FLOW.
      - FLOW conserve Demand Planning dans Supply Planning, nom d’Area retenu par Laurent. Le planning amont qui produit les
        Planned Orders est déjà pris en charge et n’est pas reproduit. L’Area courante ne correspond donc pas au module Supply
        Planning complet d’un éditeur.
      - Order Backlog Planning et Inventory Optimization Planning gardent leurs périmètres opérationnels. La qualification
        des demandes planifiées et leur transformation éventuelle en commandes fermes ne sont pas inférées de leur seule réception.
      - 'La frontière entre plan amont et gestion/adaptation de ses suites est un choix métier FLOW : les documents produit
        éclairent les mécanismes, sans prouver un flux installé ni imposer les Areas.'
      - Microsoft Master Planning et SAP IBP étayent une planification intégrant ressources existantes, nouveaux apports et
        ajustements de stock. Le plan de référence unique exprime la cohérence recherchée par FLOW ; plusieurs scénarios,
        révisions et moteurs coordonnés restent possibles.
      examples:
      - title: Illustration FLOW — Actualiser la demande sans reconstruire le plan amont
        situation: Les ventes et précommandes font évoluer la demande anticipée ; des apports sont déjà planifiés en amont.
        outcome: Demand Planning révise la demande à couvrir ; la prise en charge des demandes planifiées reste distincte
          de la construction de leur plan d’origine.
        lesson: Distinguer demande, plan d’apports et gestion des demandes issues du plan évite une double responsabilité.
        source_title: Overview of Supply Chain Planning Plan Types
        source_url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/26b/faupc/overview-of-supply-chain-planning-plan-types.html
        source_refs:
        - ELM557
        - U555
        - CMP230
