    market_inspiration:
      choice: Dire ce qui pourra être fourni, quand et sous quelles conditions rend la réponse aux commandes fiable. Order
        Promising réunit l’étude des possibilités, les choix de promesse et le maintien des propositions et engagements.
      flow_scope: Possibilités, coûts, échéancier et engagement de satisfaction.
      flow_approach: Séparer ce qui est possible, proposé puis confirmé.
      synthesis:
      - Microsoft utilise Order promising pour les dates de livraison calculées. Oracle Global Order Promising ajoute une
        recherche de sources, des alternatives et des règles de coût. Le même vocabulaire recouvre donc des périmètres produits
        différents.
      - FLOW retient une area métier centrée sur la réponse faite à la demande. Le plan global d’affectation reste coordonné
        avec Fulfillment Optimization, et la [promesse](glossary:TER014) n’est ni un mouvement physique ni une réservation
        automatique.
      - FLOW conserve les résultats spécialisés ; lorsqu’un scénario collectif est construit, Fulfillment Plan Decision en
        assure la compatibilité et appelle les réexamens nécessaires. Fulfillment Commitment garde les engagements autorisés.
        Ce partage n’impose pas un plan collectif pour toute promesse ni une séquence d’algorithmes.
