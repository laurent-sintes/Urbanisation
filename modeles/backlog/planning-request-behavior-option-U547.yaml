baseline_model_sha256: a04bd6a13198897db87c1e1797b3fefad18e2ee5a99f18b67abb9bf6aa930f2d
user_facts:
- Request est une demande d’optimisation.
- Son traitement doit conserver la logique de suivi des Orders.
user_option: Faire de la prise en charge de cette demande le premier comportement de Order Backlog Planning.
proposed_behavior:
  candidate_id: D04.s
  proposed_parent_id: D03.p
  proposed_name: Optimization Request Management
  proposed_definition: 'Prendre en charge et suivre une demande d’optimisation du carnet : préciser le résultat attendu, son
    périmètre et ses contraintes, puis tenir sa progression et sa conclusion.'
  rationale: Le Planning reçoit un travail à mener et en porte le résultat ; le suivi de la demande distingue ce qui est demandé,
    accepté, réalisé et encore attendu, sans créer une seconde capacité qui décrirait à nouveau le travail du Planning.
  position: Premier comportement au sens du point d’entrée et du cadrage. Sa gestion continue pendant l’étude et la mise en
    application ; pas une étape d’accueil uniquement.
  limits: La demande reste un objet métier ; aucun objet ou document nouveau ajouté au catalogue Informations. Le comportement
    porte sa gestion. Les mécanismes communs de gestion des Orders peuvent être mobilisés selon leur pertinence, sans copier
    un cycle complet ni imposer un dossier manuel.
proposed_distribution:
- current_ids:
  - D04.s
  proposal: Conserver l’identifiant et transformer la capacité en comportement de gestion de demande sous D03.p si l’option
    est adoptée. Le nom anglais est proposé, non adopté.
- current_ids:
  - BHV088
  - BHV089
  - BHV090
  proposal: Conserver réexamen après impondérable, revue périodique et étude volontaire comme modalités de sollicitation décrites
    dans ce comportement, sans sous-comportement.
- current_ids:
  - BHV091
  proposal: Porter Simulation & Analysis directement sous Order Backlog Planning, en adaptant le scope de faire réaliser l’étude
    à réaliser l’étude avec les décisions. Pas de double simulation.
- current_ids:
  - BHV092
  proposal: Porter l’autorisation du scénario directement sous Planning ; autorisation humaine ou déléguée, distincte de la
    décision d’affectation et d’Order Release. Pas de nouvelle capacité Decision déduite.
- current_ids:
  - BHV093
  - D02.e
  proposal: 'Éviter un second mécanisme d’application : Supply Assignment porte les affectations et leur prise en compte ;
    la gestion de demande tient le bilan et la conclusion du travail demandé. Répartir les détails avant consolidation, sans
    perte de suivi.'
preserved_boundaries:
- Fulfillment Plan Decision détermine les arbitrages ; le comportement de demande ne les reproduit pas.
- Supply Protection reste une configuration extérieure.
- Les demandes, les scénarios, leurs autorisations et leurs effets appliqués restent distingués.
- La demande peut aboutir à une étude sans changement opérationnel.
- Le fait de gérer la demande comme un Order ne prescrit pas son rattachement à l’Area Service Requests.
