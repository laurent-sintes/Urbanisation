market_comparison:
  ref: CMP226
  common: Oracle situe étude, simulation et application dans le parcours du Planning ; Salesforce documente le besoin de qualifier
    et suivre une demande et sa résolution.
  difference: Salesforce décrit des services IT, pas un OMS Supply. Aucun de ces documents n’impose un comportement Request
    Management sous Planning ou une capacité Request indépendante.
  flow_position: Rattacher la gestion de la demande au Planning est une option de modélisation FLOW, cohérente si ce Planning
    porte le travail et son résultat. Aucun consensus ni innovation revendiqué.
recommendation: 'Préférer cette option au maintien systématique de deux capacités pour ce même travail : elle conserve une
  véritable demande suivie et rend l’unique responsabilité de Planning plus lisible. Préserver les mécanismes U501 dans la
  migration, sans sous-comportements et sans les assimiler tous à la seule réception de demande.'
implementation_limits:
- Les six comportements ne peuvent pas rester enfants de D04.s si celui-ci devient un comportement ; la décomposition est
  terminale.
- L’origine Backoffice acquise U501 doit être conservée ; son placement descriptif/contractuel doit être adapté, le contrat
  actuel request_origins étant porté par les capacités.
- Conserver ou retirer les identifiants avec succession explicite et archives ; ne pas dupliquer Simulation & Analysis ni
  le suivi d’application.
- Les liens de demande vers Planning, Decision et Assignment devront être requalifiés pour rester des coopérations utiles,
  distinctes de contains.
canonical_changes: Aucun nœud, relation, nom, origine ou accord modifié ; scénario de migration proposé seulement.
