comparisons:
- key: master-data
  name: Master Data
  source_refs:
  - ELM522
  - ELM652
  assessment: Responsabilité bien étayée ; autonomie et périmètre locaux FLOW.
  similarities: Références produit, acteurs et contexte utilisés par l’orchestration, avec sources externes possibles.
  differences: Les éditeurs répartissent ces objets entre plusieurs modules et n’imposent pas un sous-domaine commun unique.
  recommendation: Conserver le regroupement en explicitant autorité locale, sources d’entreprise et maintien des références.
  benefit: Contexte stable partagé par les décisions.
  tradeoff: Le nom Master Data peut laisser entendre une maîtrise d’entreprise plus large ; l’autorité locale doit rester
    explicite.
- key: policies
  name: Policies
  source_refs:
  - ELM394
  - ELM352
  assessment: Règles distinctes des décisions documentées ; sous-domaine commun = choix FLOW.
  similarities: Priorités, protection, admissibilité, sources et fractionnement configurent les choix.
  differences: Ces règles sont souvent distribuées entre les composants de promesse et de fulfillment ; aucune taxonomie unique
    n’est démontrée.
  recommendation: Conserver une responsabilité de définition, version, activation et fourniture des règles ; laisser les résultats
    des décisions aux sous-domaines qui décident.
  benefit: Règles explicites et applicables de façon cohérente.
  tradeoff: Éviter un fourre-tout regroupant tout paramètre technique ou toute règle du système.
- key: plans
  name: Plans
  source_refs:
  - ELM352
  - ELM649
  - ELM415
  assessment: La consommation de données prévisionnelles externes est étayée ; le sens exact de Supply Plan FLOW U668 est
    une définition métier locale, sans équivalence de marché démontrée.
  similarities: Résultats de planification reçus et utilisés par les décisions ; passage de prévisions à des besoins et apports
    futurs.
  differences: Les produits peuvent combiner production et consommation de prévisions. U668 distingue Supply Plan (entrées
    et sorties de stock prévues hors achats) et master plan de matching (affectations internes). Le vocabulaire éditeur Supply
    Planning ne constitue pas une équivalence au Supply Plan FLOW.
  recommendation: Plans gère les données de plans externes ; Supply Plan porte les mouvements de stock prévus hors achats.
    Matching construit et gère son master plan de matching, objet distinct.
  benefit: Utiliser l’anticipation sans reconstruire l’APS dans l’orchestration.
  tradeoff: Versions, fraîcheur et rapprochement prévision/engagement sont à expliciter ; aucun partage court terme/long terme
    automatique.
- key: demand-management
  name: Order Management
  source_refs:
  - ELM648
  - ELM649
  - ELM522
  - ELM652
  - ELM112
  assessment: Responsabilité de cycle de vie défendable ; principal écart terminologique.
  similarities: Les systèmes OMS conservent les demandes opérationnelles, les lignes, les évolutions et les engagements.
  differences: Oracle Demand Management porte la prévision ; SAP emploie le terme pour les besoins planifiés et leur interaction
    avec les commandes. Les documents OMS étudiés gardent Order comme objet métier.
  recommendation: Utiliser Order Management, adopté U666, pour les commandes individualisées, et conserver Demand pour la
    demande face à l’offre. La rédaction et les frontières détaillées restent qualifiées séparément.
  benefit: Continuité de l’intention et traçabilité des engagements malgré les documents et adaptations.
  tradeoff: Le nom Order Management est étayé, mais la généralisation à un objet durable commun et ses spécialisations reste
    un choix FLOW. Si Order devient cet objet, l’engagement devient un état ou une dimension de l’Order ; la formule du PDF
    Order = état est alors remplacée.
  candidate_name_U659: Order Management
  original_name_reviewed: Demand Management
  name_adoption:
    source_refs:
    - U666
    approved_fields:
    - name
    value: Order Management
- key: inventory-management
  name: Inventory Management
  source_refs:
  - ELM449
  - ELM408
  assessment: Nom et noyau fonctionnel bien étayés.
  similarities: Positions, mouvements, états, quantités réservées ou attendues et régimes de stock.
  differences: SAP inclut aussi valorisation financière et transactions ; la vue Microsoft expose de la disponibilité calculée.
    FLOW retient une représentation opérationnelle et sépare la promesse.
  recommendation: Conserver le nom et rendre explicite la frontière entre faits de stock, réservations et possibilités de
    promesse.
  benefit: Connaissance cohérente des ressources détenues.
  tradeoff: La représentation locale ne constitue pas à elle seule la preuve d’une réception ou la maîtrise des opérations
    physiques.
- key: supply-availability
  name: Order Promising
  source_refs:
  - ELM352
  - ELM653
  assessment: Responsabilités étayées par ATP/aATP/GOP ; frontière avec les autres choix à expliciter.
  similarities: Évaluer quantités, dates et alternatives en utilisant ressources présentes/futures, engagements et règles.
  differences: Oracle et SAP incluent choix de sources, substitutions et fractionnements. La disponibilité promettable dépend
    déjà de choix, notamment CTP/PTP chez Oracle.
  recommendation: Décrire les possibilités conditionnelles de réponse et les décisions associées ; articuler avec le plan
    collectif de Matching et la confirmation des engagements.
  benefit: Distinguer ce qui peut être fourni de ce qui est retenu collectivement ou confirmé.
  tradeoff: Une frontière qui reporterait tout sourcing à Fulfilment rendrait la promesse et le plan insuffisamment déterminés.
- key: matching
  name: Demand & Supply Matching
  source_refs:
  - ELM452
  - ELM650
  - ELM654
  - ELM393
  assessment: Planification et arbitrage au cœur du domaine fortement étayés ; nom et regroupement FLOW.
  similarities: Priorisation, affectation de supply présente ou future, plan collectif, simulation, réaffectation et application
    distincte.
  differences: 'Noms natifs : Supply Assignment, Backlog Management, Distributed Order Management et Fulfillment Plan. Les
    périmètres se chevauchent avec aATP et l’orchestration ; SAP donne à certaines affectations un effet de blocage non déduit
    pour FLOW.'
  recommendation: Expliciter la construction et la gestion du master plan de matching. Ne pas le nommer Supply Plan, objet
    distinct défini par U668.
  benefit: Cohérence entre demandes concurrentes et ressources partagées.
  tradeoff: Qualifier affectation, réservation, promesse et application ; les termes Allocation et Supply Plan n’ont pas un
    sens universel.
- key: fulfilment-orchestration
  name: Fulfilment Orchestration
  source_refs:
  - ELM651
  - ELM405
  assessment: Nom et responsabilité de coordination largement étayés dans les documents étudiés.
  similarities: Coordination des systèmes et prestataires, dépendances, événements, changements et suivi de la réalisation.
  differences: Les offres réelles ajoutent souvent optimisation du sourcing, réservation ou facturation. L’orchestration FLOW
    conserve son périmètre métier et ses exécutants distincts.
  recommendation: Conserver pilotage de la réalisation et adaptation ; distinguer les choix préparant le plan et la promesse
    des adaptations de réalisation.
  benefit: Suivre le résultat métier au-delà d’une simple émission de messages.
  tradeoff: Définir comment un changement qui affecte la promesse ou d’autres demandes revient vers les responsabilités concernées.
overall_assessment:
  opinion: 'Conserver comme base de travail : les responsabilités sont documentées, les huit frontières constituent une composition
    FLOW à préciser.'
  strengths:
  - Séparation références/règles/plans entrants cohérente pour clarifier le contexte des décisions.
  - Distinction stock, possibilités de réponse, arbitrage collectif et coordination de réalisation.
  - Matching construit son plan ; l’APS fournit l’anticipation sans remplacer les arbitrages du domaine.
  critical_points:
  - L’ambiguïté Demand Management est reconnue U659/U660 ; Order Management est recommandé, avec objet durable et engagements
    évolutifs.
  - Les choix de sourcing, de fractionnement et d’échéancier traversent Availability, Matching et Fulfilment ; éviter la frontière
    tout sourcing dans Fulfilment.
  - 'Le principe Order comme simple état du PDF est réexaminé : Order devient le candidat pour nommer l’objet durable ; le
    marché documente des Orders brouillons et plusieurs familles, sans imposer une implémentation FLOW.'
  - Les regroupements de données doivent porter une responsabilité de maintien et de fourniture métier, pas seulement nommer
    des ensembles de tables.
  terminology:
    name: Subdomain / Sous-domaine
    source_refs:
    - ELM635
    - ELM634
    assessment: Terme intelligible pour un périmètre métier relatif au Domain ; pas de correspondance automatique à un service
      logiciel ni de déduction d’un découpage DDD standard.
    proposed_definition: Périmètre cohérent de responsabilités métier au sein du Domain, avec une finalité, des frontières
      et des échanges explicites.
boundary_example:
  status: Exemple fictif proposé, non accord métier
  situation: Deux demandes partagent des ressources limitées ; une partie de la réponse dépend d’un apport APS projeté.
  availability: Évaluer les quantités et dates possibles selon les sources, contraintes et hypothèses.
  matching: Construire un plan qui arbitre les quantités, ressources et échéances retenues pour les demandes concurrentes.
  demand: Conserver les engagements effectivement confirmés, distincts des possibilités ou simulations.
  fulfilment: Organiser les prestations du plan retenu et traiter les aléas ; une adaptation affectant les engagements ou
    d’autres demandes appelle les responsabilités concernées.
approval_boundary: Évaluation marché proposée U658 ; accords ciblés U663 sur Availability, U664 sur Fulfilment, U666 sur le
  nom Order Management et la distinction règles/responsabilités. Aucun accord global sur les rédactions, capacités ou rattachements
  ; aucune publication.
naming_clarification_U659_U660:
  user_position: U659/U660 distingue la demande face à l’offre et l’objet individuel ; U666 adopte Order Management pour le
    sous-domaine de gestion des commandes.
  recommended_subdomain_name: Order Management
  proposed_definition: Gérer les commandes de mise à disposition ou de mouvement de produits, depuis leur préparation jusqu’à
    leur clôture, en conservant leur intention, leurs exigences, leurs engagements et leur historique.
  demand_meaning: Besoins à satisfaire, prévisionnels ou exprimés ; ce concept n’est pas réduit à une collection d’Orders.
  order_meaning: Objet métier individualisé portant une intention opérationnelle et son cycle de vie ; son existence ne prouve
    pas à elle seule un engagement ferme.
  evidence:
  - ELM112
  - ELM522
  - ELM652
  draft_evidence: ELM652 décrit des draft order lines devenant submitted order lines ; appui explicite à un Order existant
    avant soumission.
  pdf_consequence: Order peut remplacer Demand comme nom de l’objet durable. L’engagement est alors une dimension de l’Order,
    pas la définition de son existence. L’idée de continuité et les documents nécessaires restent conservés.
  preserved_names: Demand Plan et Demand & Supply Matching restent intelligibles avec Demand au sens demande face à l’offre
    ; aucun renommage mécanique de Demand en Order.
  status: Nom Order Management adopté U666 ; définition développée et autres formulations proposées.
  adopted_name: Order Management
  adoption_source_refs:
  - U666
  name_capture_scope: Accord sur le nom du sous-domaine dans la reprise. Le D04 courant inclut encore Demand Planning ; ne
    pas étendre cet accord à cette composition ou à ses champs. Capturer le nom avec record_decision.py lors de la matérialisation
    du sous-domaine dans le contexte métier correspondant.
boundary_work_U662:
  status: Accords ciblés U663/U664/U666 ; distinction des responsabilités claire sans préciser les règles d’autonomie.
  principle: Distinguer les responsabilités par le résultat porté et le droit de le réviser ; aucune séquence universelle
    ni séparation individuel/collectif.
  availability:
    question: Quelles réponses sont possibles, sous quelles conditions ?
    output: Quantités, dates et alternatives de sources faisables, hypothèses et conditions explicites.
    decisions: Détermine les réponses possibles et sélectionne la réponse de promesse recommandée (U663). La recommandation
      reste soumise aux arbitrages du plan lorsqu’elle affecte des ressources partagées. Les critères détaillés et modalités
      demeurent proposés ; aucune confirmation d’engagement automatique.
    source_refs:
    - ELM352
    - ELM653
    - U663
  matching:
    question: Quel master plan de matching retenons-nous pour affecter les ressources et couvrir les demandes ?
    output: Plan cohérent de couverture, priorités, affectations et échéances retenues, avec contraintes et latitude laissée
      à la réalisation.
    decisions: Arbitre les ressources partagées et conserve la cohérence des affectations ; peut intervenir sur une commande
      ou un ensemble. Le périmètre utile dépend des impacts.
    source_refs:
    - ELM650
    - ELM654
    - ELM452
  fulfilment:
    question: Comment obtenir la réalisation attendue et traiter les aléas ?
    output: Prestations coordonnées, choix de réalisation, suivi des résultats et adaptations.
    decisions: 'U664 : rechercher des solutions locales pour réaliser la promesse portée par l’Order en préservant les grands
      équilibres du Matching. Une adaptation locale peut modifier le détail de réalisation ; elle ne garantit pas de résoudre
      tous les aléas. Les marges et critères précis restent à définir.'
    source_refs:
    - ELM651
    - ELM405
    - U664
  sourcing: Availability examine une source possible ; Matching retient les contraintes d’affectation nécessaires au plan
    ; Fulfilment choisit ou adapte la réalisation dans la latitude explicite. Il ne s’agit pas de trois moteurs de sourcing
    indépendants imposés.
  commitment: L’Order porte la promesse. Possibilité calculée, affectation et engagement confirmé restent distingués. Order
    Management est le nom adopté U666 ; les descriptions détaillées ne sont pas adoptées globalement.
  illustration:
    type: Exemple fictif
    resources: 80 pièces disponibles maintenant et un apport APS projeté de 30 pièces à J+3 ; nature projetée de cet apport
      à considérer selon les policies.
    orders: A demande 60 pièces et B demande 50 pièces.
    availability: Établit les réponses faisables et leurs conditions, notamment la fiabilité de l’apport futur ; une étude
      de faisabilité n’accorde pas deux fois les mêmes 80 pièces.
    matching: À titre de scénario retenu, affecte 60 pièces à A maintenant, 20 à B maintenant et les 30 projetées à B à J+3
      sous les conditions applicables.
    commitment: Ces résultats alimentent la proposition de promesse ; la confirmation reste distincte du plan et respecte
      ses conditions.
    fulfilment: Coordonne les prestations ; un manque déclenche une adaptation. Un secours dans la latitude accordée peut
      être traité localement ; prendre des ressources affectées à B exige un réarbitrage.
  market_position: Oracle GOP et SAP aATP examinent déjà sources et alternatives ; Oracle Backlog Management et Microsoft
    DOM distinguent plan et effets appliqués ; Oracle et Microsoft documentent la coordination des exécutants. La répartition
    proposée est FLOW, sans équivalence aux frontières de produits.
  benefit: Rendre explicite qui établit une possibilité, qui retient une répartition et qui pilote la réalisation, avec une
    responsabilité identifiable sur les engagements.
  tradeoff: Décrire la latitude laissée à la réalisation et les effets qui exigent un réarbitrage ; éviter trois décisions
    incompatibles sur les mêmes ressources.
  next_discussion: 'Aucune précision des marges d’autonomie à demander pour terminer le découpage : ce sont des règles (U666).
    Le nom Order Management est adopté. Les travaux ultérieurs peuvent partir des responsabilités clarifiées.'
  adoption_U663:
    source_refs:
    - U663
    interpretation: explicit
    adopted_responsibility: Availability détermine les réponses possibles et sélectionne la réponse de promesse qu’elle recommande.
    adopted_condition: La recommandation reste soumise aux arbitrages du plan lorsqu’elle affecte des ressources partagées.
    not_adopted_by_extension:
    - Confirmation de la promesse
    - Critères et pondérations de sélection
    - Toutes les formulations de sous-domaines
    - Latitude détaillée de Fulfilment
    - Nom Order Management
    - Exemples et rattachements de capacités
    capture_scope: Accord sur une responsabilité dans la proposition ; Order Promising non matérialisé comme nœud canonique.
    field_capture: record_decision.py ne cible que nodes/relations existants ; capture des champs exactement correspondants
      à réaliser lors de la matérialisation, sans nouvelle validation globale présumée.
  adoption_U664:
    source_refs:
    - U664
    interpretation: explicit
    adopted_responsibility: Fulfilment cherche des solutions locales pour préserver la promesse portée par l’Order et les
      grands équilibres du Matching.
    scope: Priorité d’adaptation locale ; aucune promesse de résolution systématique.
    not_adopted_by_extension:
    - Seuils de perturbation des grands équilibres
    - Marges chiffrées de décision
    - Frontière géographique de local
    - Interdiction de tout changement d’affectation détaillée
    - Modalités complètes de réarbitrage et de révision de promesse
    - Définitions complètes ou rattachements de capacités
    capture_scope: Accord de frontière conservé dans la proposition de sous-domaines ; aucune nouvelle rédaction de champ
      canonique présentée comme adoptée.
    field_capture: Capture via record_decision.py à la matérialisation de champs exactement conformes à l’accord ; ne pas
      étendre cet accord à l’ensemble de D06 ni à ses descriptions existantes.
  local_adaptation_interpretation_U664:
    status: Précisions proposées par Codex
    locality: Local qualifie les effets de l’adaptation sur la réalisation concernée et l’équilibre d’ensemble ; cela peut
      concerner plusieurs sites ou prestataires.
    fallback: Si la promesse ou les grands équilibres ne peuvent être préservés, expliciter l’écart et les alternatives pour
      réarbitrage par Matching et, si nécessaire, révision de l’engagement par le responsable de l’Order.
    scale: Réexaminer le périmètre affecté ; aucun recalcul global systématique.
    open_question: 'Retirée comme préalable au découpage par U666 : les marges et critères d’autonomie relèvent de règles,
      dont le détail n’est pas demandé.'
  adoption_U666:
    source_refs:
    - U666
    interpretation: explicit
    adopted_name: Order Management
    adopted_distinction: Les marges d’autonomie sont des règles, pas des responsabilités ; il n’est pas nécessaire de les
      préciser pour définir le découpage.
    not_adopted_by_extension:
    - Valeurs de règles et seuils
    - Définitions détaillées de tous les sous-domaines
    - Composition du D04 courant
    - Rattachements de capacités
    consequence: Ne plus présenter le détail des marges d’autonomie comme un préalable ou une ambiguïté résiduelle du découpage.
correction_U668:
  source_refs:
  - U668
  supply_plan: Prévisions d’entrées ou de sorties de stock hors achats, dans Plans.
  matching_master_plan: Plan d’affectation construit et géré dans Demand & Supply Matching.
  supersedes: Toute assimilation antérieure du plan interne de Matching au Supply Plan, y compris dans les interprétations
    U657/U667.
  market_limit: Les termes éditeurs Supply Planning ou Master Planning ne démontrent pas une équivalence à ces deux objets
