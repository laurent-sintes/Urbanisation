  capture: Accord de responsabilité dans cette annexe ; aucune capacité canonique créée par cet audit.
naming_discussion_U671:
  status: recommendation_adopted_U672
  recommended_name: Order Promising
  short_name: Promising
  definition_proposed: Déterminer les quantités, dates et conditions auxquelles un besoin peut être satisfait, comparer les
    réponses possibles et recommander une promesse compatible avec les ressources, les règles et les arbitrages applicables.
  benefit: Le nom exprime la décision rendue au consommateur ; Availability peut être compris comme une simple connaissance
    du disponible.
  boundaries: Promising calcule et recommande ; Matching arbitre les affectations dans son master plan ; Order Management
    confirme et conserve les engagements. Le calcul peut être mobilisé avant création d’un Order ou par Matching.
  tradeoff: Le mot Order peut suggérer une commande déjà créée ; préciser que la demande de calcul peut la précéder. Les périmètres
    produits Promising peuvent inclure confirmation ou réservation, sans imposer ces responsabilités à ce sous-domaine FLOW.
  market_sources:
  - element_ref: ELM352
    title: Overview of Global Order Promising
    url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/25c/fascp/overview-of-global-order-promising.html
    version: 25C
    consulted_on: '2026-09-23'
    locator: Introduction et échanges Order Management / Promising
    finding: Promising reçoit une demande de l’application de commandes et renvoie les sources et dates possibles.
  - element_ref: ELM434
    title: Order promising
    url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/sales-marketing/delivery-dates-available-promise-calculations
    version: Documentation évolutive, mise à jour affichée 2026-04-21
    consulted_on: '2026-09-23'
    locator: Introduction, ATP calculations, CTP calculations
    finding: Order promising calcule des dates de fourniture ; ATP et CTP constituent des méthodes de contrôle.
  market_position: Appui lexical interéditeurs pour Order Promising ; SAP emploie aussi aATP. Aucun consensus universel ni
    taxonomie de sous-domaines imposée.
  canonical_change: false
  name_at_discussion: Supply Availability
  current_name: Order Promising
