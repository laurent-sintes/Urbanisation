ingestion_agreement_U669:
  responsibility: Ingérer les Supply et Demand Plans dans Plans.
  external_source: L’APS est uniquement mentionné comme source externe dans les descriptions ; aucun sous-domaine APS.
  not_adopted:
  - Libellé exact Plan Ingestion
  - Définition détaillée de la nouvelle capacité
  - Plan Visibility
