party_naming:
  recommendation: Conserver Party / Role à ce stade ; expliquer en français Référentiel des personnes et de leurs rôles métier.
  options:
  - name: Party / Role
    benefit: Identité et rôles contextuels explicites ; correspondance directe OMG et historique Informatica.
    tradeoff: Vocabulaire à expliquer au lectorat métier.
  - name: Party
    benefit: Terme établi, concis, couvre personnes et organisations.
    tradeoff: Les rôles doivent être rendus visibles par le périmètre.
  - name: Business Partner
    benefit: Nom directement établi chez SAP, immédiatement commercial.
    tradeoff: Peut évoquer surtout le partenaire externe ; catégories et gestion SAP plus larges que FLOW.
  - name: Person
    benefit: Proche du français personne physique ou morale.
    tradeoff: Person est une catégorie distincte d’Organization chez SAP/Informatica ; ambiguïté en anglais. Non recommandé.
  theory: Party et PartyRole séparent identité et participation à une situation ; FIBO précise le rôle contractant. Le périmètre
    juridique de FLOW est un choix local, pas la définition universelle de Party.
  legal_translation_limit: LegalPerson dans FIBO peut inclure une personne physique juridiquement capable ; ne pas traduire
    systématiquement par personne morale.
visibility:
  recommendation: Une capacité de connaissance par référentiel, complémentaire de son ingestion ; recherche, consultation
    et compréhension de la référence locale disponible.
  naming: Visibility par cohérence avec Inventory Visibility et Service Capacity Visibility ; Consultation serait clair en
    français, Lookup trop étroit, Management trop large.
  candidates:
  - D08.e
  - D09.e
  - D11.b
  - D12.b
  - D13.b
  - D14.b
  boundary: Pas d’administration du maître externe, de modification contractuelle, de calcul de disponibilité ni de suivi
    d’exécution. Provenance et validité exposées quand disponibles ; pas de nouvelle garantie de fraîcheur inventée.
  decomposition: 'Aucun comportement ajouté : rechercher, lire et naviguer ne justifient pas à eux seuls une décomposition.'
  status: 'U507 : six capacités Visibility et leur nature knowledge adoptées, chacune dans son référentiel ; seules les valeurs
    name/nature sont reprises comme champs approuvés. Sens commun de lecture adopté, descriptions détaillées proposées.'
  market_limits: Deux documents primaires par capacité ; Catalog repose sur deux documents Microsoft. Fulfillment Network
    étend une consultation de lieux à ses relations déjà définies ; ServiceNow illustre seulement la recherche, pas la nature
    Backing Service.
authoritative_data_structure:
  current: business-references est une Area présentée par Supply Chain Orchestration ; elle présente les six références distinctes,
    chacune contenant ses capacités Ingestion et Visibility.
  recommendation: En faire une Area de Supply Chain Orchestration, au même niveau que les autres Areas, définie par la mise
    à disposition de la vérité locale de référence.
  benefit: Exprimer une responsabilité propre et ses capacités d’ingestion et de visibilité ; la stabilité ou l’origine externe
    des données n’empêche pas cette responsabilité métier.
  tradeoff: Les sujets de référence restent des supports de présentation explicites, sans nouvelle Area imbriquée. Le contrat
    area presents reference permet de conserver leur autonomie et les parents de leurs capacités.
  status: adopted_and_applied_U507
  preserved: Identifiant business-references ; six références distinctes ; identifiants, extrémités et types des relations
    existantes ; publications et preuves historiques inchangées.
  previous: business-references est kind group, relié par presents au Domain et aux six références. U103 avait adopté un regroupement
    de présentation, sans domaine unique ; U482 a adopté le nom sans changer ce statut.
