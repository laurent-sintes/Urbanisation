candidate_capabilities:
- name: Replenishment Planning
  intention: Entretenir la disponibilité pendant la commercialisation, notamment le réassort des magasins.
  result: Plan des apports successifs et de leurs ajustements, puis mise en application de la part retenue.
  decision_refs:
  - D05.e
  - D05.a
  market_refs:
  - ELM375
  - ELM450
  - ELM369
  name_position: Replenishment Planning est attesté chez Oracle et SAP ; périmètre exact de la capacité FLOW proposé.
  boundary: 'Ne pas réduire silencieusement D05.e au magasin : sa portée actuelle inclut d’autres stocks du réseau et des
    compléments fournisseur. Le destinataire ou la source ne suffit pas à créer une capacité par variante.'
- name: Inventory Rebalancing
  intention: Corriger les déséquilibres entre lieux en réutilisant le stock existant.
  result: Plan des transferts retenus entre sites et application des changements autorisés.
  decision_refs:
  - D05.c
  market_refs:
  - ELM375
  - ELM369
  name_position: Inventory Rebalancing est employé par Oracle et rapproché de Store Transfers par Nextail. Sa qualification
    Planning et son autonomie dans FLOW restent proposées.
  boundary: Un transfert peut servir le réassort ; le rééquilibrage vise l’arbitrage collectif donneurs/bénéficiaires. Les
    effets retenus doivent alimenter le plan de réassort pour éviter des apports redondants.
- name: Initial Stocking Planning
  intention: Constituer le stock de départ requis pour un lancement.
  result: Plan des apports initiaux par magasin et échéance, puis mise en application de la part retenue.
  decision_refs:
  - D05.g
  - D05.a
  market_refs:
  - ELM375
  - ELM451
  name_position: 'Marché : First Allocation ou Initial Allocation. Initial Stocking Planning est une formulation candidate
    cohérente avec Initial Stocking Decision déjà adoptée, pas un intitulé standard démontré.'
  boundary: L’implantation reste distincte des apports continus ; le résultat porte la mise en place initiale, pas l’assortiment
    commercial ni la promesse des commandes.
consolidation_question:
  intent: Regrouper des stocks dispersés, reconstituer des assortiments utiles ou concentrer des reliquats.
  current_location: Stock Redistribution Decision D05.c, comportement Stock Consolidation BHV025.
  status: Intention supplémentaire à éprouver avant de créer une capacité Planning autonome.
  evidence_refs:
  - ELM451
  - ELM369
  evidence_limits: 'Rappel de reliquats chez SAP et possibilité de sweep location chez Oracle : appuis partiels à des opérations,
    pas preuve suffisante d’un planning autonome couvrant tout le périmètre FLOW.'
  criterion: Un plan propre, un résultat recherché distinct et un bénéfice de pilotage justifieraient une capacité ; une simple
    modalité de redistribution ne suffit pas.
recommended_structure:
  direction: Remplacer à terme l’agrégat D05.f par des capacités explicites selon les intentions retenues, sans maintenir
    Inventory Planning comme parent obligatoire ou capacité générique doublon.
  parent: Le parent des capacités candidates reste à décider ; le rejet du nom Inventory Planning ne déplace pas automatiquement
    les activités vers l’Area Planning et ne renomme pas Inventory Optimization.
  planning_decision: Les capacités Planning mobilisent les décisions existantes. Pas de copie de décision, ni de Planning
    systématique pour chaque Decision.
  application: Chaque Planning porte l’application de son résultat comme comportement selon U537 ; configurations, gestion
    des Orders et coordination restent partenaires selon U538.
  coordination: Prendre en compte rééquilibrage, apports initiaux et apports continus déjà retenus ; un besoin ou une ressource
    ne doit pas être engagé deux fois. Cette coopération ne nécessite pas automatiquement une nouvelle capacité Inventory
    Planning.
canonical_status: D05.f reste présent pour préserver les identifiants et mécanismes. Réserve courante sur son nom et son agrégation
  ; accord nominal historique conservé dans previous_node. Aucun candidat créé, aucun mécanisme déplacé ou supprimé.
supersedes_in_scope: La proposition Inventory Plan Application U542 est suspendue tant que son parent agrégé est en réexamen
  ; le principe d’application sous Planning reste retenu.
market_conclusion: 'La distinction des intentions est documentée ; leur séparation en capacités Planning autonomes relève
  d’une proposition FLOW. Les éditeurs les regroupent différemment : aucun consensus de structure ou innovation revendiqué.'
