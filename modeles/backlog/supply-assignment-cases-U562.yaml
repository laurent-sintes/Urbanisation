  relationship: Recouvrement partiel
  scope_summary: Ressources reliées à des commandes et des prévisions dans un plan par projet.
  approach_summary: Examiner les quantités reliées aux différentes demandes et les exceptions de couverture.
  similarities: Un besoin prévisionnel peut être la cible d’un lien avec une ressource.
  differences: Planification par projet ; la page ne démontre pas une application transactionnelle autonome ni le contexte
