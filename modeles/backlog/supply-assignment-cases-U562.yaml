cases:
- id: CASE01
  situation: Prévoir 1 000 ventes web en novembre à partir des ventes et précommandes.
  result: Un plan de demande actualisé.
  coverage:
  - id: D17.a
    role: Demand Planning construit la demande attendue.
  status: covered
- id: CASE02
  situation: Protéger une enveloppe de 300 pièces pour le web sans désigner un arrivage.
  result: Des conditions d’accès aux ressources pour un groupe.
  coverage:
  - id: D05.d
    role: Group Protection Decision détermine la protection.
  - id: D02.b
    role: Supply Protection configure et maintient la politique applicable.
  status: covered
- id: CASE03
  situation: Affecter 300 pièces de l’arrivage A aux ventes web prévues en novembre, sans commande.
  result: Un lien entre une ressource et un besoin prévisionnel identifié.
  coverage:
  - id: D03.p
    role: Le Planning commun prépare et suit les scénarios commandes-prévisions.
  - id: D03.o
    role: Fulfillment Plan Decision détermine le scénario avec les décisions spécialisées.
  - id: D02.e
    role: Supply Assignment applique les affectations.
  status: covered_by_common_planning_U565
  qualification: U565 confirme le Planning commun ; propagation vers la décision existante selon le principe Planning/décision.
    Aucun nouveau nom approuvé.
- id: CASE04
  situation: Deux commandes demandent 100 et 200 pièces ; seules 150 sont disponibles.
  result: Un scénario retenu, puis des liens d’affectation appliqués.
  coverage:
  - id: D03.p
    role: Order Backlog Planning construit et suit les scénarios.
  - id: D03.o
    role: Fulfillment Plan Decision choisit le scénario avec les décisions spécialisées.
  - id: D02.e
    role: Supply Assignment applique les affectations.
  status: covered
- id: CASE05
  situation: Réapprovisionner un magasin avec 40 pièces pour éviter une rupture.
  result: Un ajustement de stock retenu puis pris en charge.
  coverage:
  - id: D05.f
    role: Inventory Optimization Planning prépare et applique le plan.
  - id: D05.e
    role: Replenishment Decision détermine le réassort.
  - id: BHV094
    role: Inventory Plan Application applique les suites avec les capacités partenaires.
  status: covered
  boundary: Gestion des Orders et réalisation physique distinctes.
- id: CASE06
  situation: Déplacer 40 pièces d’un magasin surstocké vers un autre qui en manque.
  result: Un plan de redistribution retenu puis pris en charge.
  coverage:
  - id: D05.f
    role: Inventory Optimization Planning porte le plan.
  - id: D05.c
    role: Stock Redistribution Decision détermine les transferts.
  - id: BHV094
    role: Inventory Plan Application applique les suites avec les capacités partenaires.
  status: covered
  boundary: Supply Assignment peut affecter la ressource à l’Order de transfert ; il ne déplace pas physiquement le stock.
- id: CASE07
  situation: Empêcher que 40 pièces engagées pour un besoin soient consommées par un autre.
  result: Un engagement dont les usages concurrents doivent tenir compte.
  coverage:
  - id: D02.c
    role: Reservation établit cet engagement.
  status: covered
  boundary: Une affectation seule ne produit pas cet effet, U436.
- id: CASE08
  situation: 500 pièces attendues doivent couvrir 300 commandées et 300 ventes prévisionnelles restantes en plus des commandes.
  result: Un plan commun arbitre les affectations et explicite les 100 pièces non couvertes.
  coverage:
  - id: D03.p
    role: Le Planning commun prépare et suit les scénarios commandes-prévisions.
  - id: D03.o
    role: Fulfillment Plan Decision détermine le scénario avec les décisions spécialisées.
  - id: D02.e
    role: Supply Assignment applique les affectations.
  status: common_planning_confirmed_U565
  boundary: Les 300 prévisionnelles sont résiduelles. Si les commandes font déjà partie de la prévision totale, les deux quantités
    ne doivent pas être ajoutées. Aucun ratio de répartition ou priorité universelle adopté.
