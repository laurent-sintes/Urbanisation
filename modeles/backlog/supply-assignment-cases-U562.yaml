- vendor: SAP
  product: S/4HANA PP/DS
  element_name: Dynamic Pegging
  concept_name: Dynamic pegging
  element_type: Mécanisme de planification documenté dans un produit
  relationship: Recouvrement partiel
  scope_summary: Besoins d’un produit-lieu liés aux stocks ou réceptions admissibles ; besoins indépendants sans commande
    également traités.
  approach_summary: Recalculer les liens quand les besoins ou ressources changent, pour analyse et planification.
  similarities: Le lien ressource-besoin n’exige pas toujours une commande de vente.
  differences: Les liens dynamiques SAP servent au calcul et ne sont généralement pas durables ; la granularité n’est pas
    spécifique au lot. FLOW décrit l’application des affectations retenues.
  flow_position: L’affectation à un besoin prévisionnel est couverte, sans assimiler toute projection de calcul à une affectation
    appliquée ou réservée.
  source_title: Dynamic Pegging
  source_url: https://help.sap.com/docs/SAP_S4HANA_ON-PREMISE/f899ce30af9044299d573ea30b533f1c/862ac95360267614e10000000a174cb4.html
