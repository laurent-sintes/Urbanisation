- id: BHV062
  revision: 1
  kind: behavior
  layer: transactional
  fields:
    name: Continuous Replenishment
    definition: Prendre en charge les apports successifs de stock consigné pendant l’activité, selon l’évolution du besoin,
      et suivre leur satisfaction.
    finality: Rendre visible l’entretien du stock consigné pendant la période de vente, distinct de sa constitution initiale.
    scope: |-
      Replenishment Decision détermine le besoin ; ce comportement porte les demandes qui en découlent. Aucun VMI ni automatisme obligatoire déduit.

      Exemple fictif : Demander un nouvel apport après des ventes et suivre les quantités reçues et restant attendues, sans imposer une commande par vente.

      Les fonctions de création, révision, annulation, suivi des livraisons partielles et clôture sont décrites pour cet Order et reliées aux capacités responsables. Leur caractère partagé ne dispense pas d’expliciter leur effet métier ; il ne suffit pas non plus à créer un comportement par opération.

      Le stock demeure sous le régime de consignation après réception. Consigned Inventory Management applique les conditions ; l’acquisition éventuelle et les prestations conservent leurs responsabilités distinctes. Aucun sous-comportement, partage de logiciel ou automatisme de commande imposé.
    market_comparisons:
    - vendor: Microsoft
      product: Dynamics 365 SCM
      element_name: Set up consignment
      element_type: Processus, document ou fonction produit
      relationship: Recouvrement partiel
      similarities: Consignment replenishment order demande et suit les quantités à livrer dans un intervalle de dates ; le
        fournisseur conserve la propriété à réception. Le traitement de changement de propriété génère ensuite un Purchase
        Order.
      differences: Document produit illustré en production ; ne justifie pas une capacité Procurement Order générique couvrant
        tous les apports.
      source_title: Set up consignment
      source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/inventory/consignment
