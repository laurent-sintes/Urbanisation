- id: D04
  revision: 6
  kind: domain
  layer: transactional
  fields:
    name: Order Management
    definition: Gérer les Orders transactionnels de la Supply selon leur type métier, gouverner leurs mutations, maintenir
      leurs compositions et assurer leur conservation historique, en distinguant contenu, promesse et exécution.
    finality: Disposer de commandes explicites et traçables pour savoir ce qui doit être satisfait, comment la demande est
      organisée et ce qui peut progresser ou reste bloqué.
    scope: 'Six capacités explicites par type d’Order : Sales Order, Purchase Order, Transfer Order, Customer Return, Supplier
      Return et Consignment Replenishment Order. Order Lifecycle Management, Order Structuring et Order Archiving restent
      trois capacités transverses. Les types ne sont plus des comportements d’une capacité générique Order Type. Chaque capacité
      peut décrire des comportements propres lorsqu’une complexité ou un bénéfice le justifie, sans recopier les mutations
      communes ni imposer un cycle universel. Split transforme les commandes ; Spread répartit des ressources entre commandes
      et relève des décisions et de Supply Assignment.'
