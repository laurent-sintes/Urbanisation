- id: BHV055
  revision: 1
  kind: behavior
  layer: transactional
  fields:
    name: Return for Credit
    definition: Prendre en charge un retour fournisseur donnant lieu à un avoir ou remboursement attendu, sans remplacement
      des marchandises retournées.
    finality: Éviter de compter un apport de remplacement inexistant dans les stocks futurs ou de rouvrir à tort un reste
      à recevoir.
    scope: |-
      Suivre le renvoi et son acceptation, matérialiser l’absence de remplacement attendu pour les quantités concernées et relier les références du règlement financier géré ailleurs.

      Exemple fictif : 100 pièces invendues sont reprises en fin de saison contre avoir. Elles sortent du stock ; aucun arrivage de remplacement n’est attendu pour ces 100 pièces.

      Accord de reprise consommé, non négocié ici ; finance émet, comptabilise et rapproche l’avoir. Retour expédié, accepté et financièrement réglé restent distincts. Ne pas confondre avec Credit only côté client, qui peut ne comporter aucun retour physique.

      Un même retour peut associer avoir pour certaines quantités et remplacement pour d’autres. Pas de comportement autonome pour cette combinaison partielle.

      Ce parcours relève de [Supplier Return](model:D04.m). Les mutations des Orders, la composition et l’archivage restent transverses. D06 conserve l’exécution et D01 les écritures de stock. Les décisions et autorisations applicables sont consommées sans négociation ou réalisation physique implicite. Aucun produit logiciel, statut technique ou séquence obligatoire imposé ; les règles de contrat détaillées restent à préciser.
