    definition: Permettre de préparer, sauvegarder et reprendre un Order avant sa soumission au traitement opérationnel, en
      rendant explicites les effets autorisés dans cet état.
    finality: Préparer une demande incomplète ou à vérifier sans déclencher prématurément son traitement.
    scope: |-
      Préparer une commande par copie, corriger quantités et dates, puis la soumettre selon les règles ; aucun nouvel engagement repris implicitement de l’original.

