- id: BHV006
  revision: 2
  kind: behavior
  layer: transactional
  fields:
    name: Simulation & Analysis
    definition: Projeter les conséquences d’un scénario et analyser leurs impacts sur les indicateurs métier et les processus
      pour éclairer les choix.
    scope: |-
      Critère différenciant : mécanisme. Bénéfice ciblé : Comprendre compromis et effets locaux.

      La projection et son analyse forment un même résultat explicatif ; comparaison et autorisation restent des fonctions utiles, sans calcul dupliqué.

      Exemple fictif : Service 94 à 97 %, stock +120 k€ ; identifier les magasins perdants.

      Simulation & Analysis peut produire des recommandations : ajustements suggérés, raisons, hypothèses et impacts attendus sur les indicateurs ou les processus. Une recommandation n’est ni une décision adoptée ni une modification opérationnelle ; elle éclaire le choix du scénario et les décisions à mobiliser. Exemple fictif : recommander de reporter un apport en expliquant la réduction d’immobilisation et le risque de disponibilité associé. La validation et l’application restent des fonctions distinctes ; aucun comportement Recommendation autonome ajouté.
    market_comparisons:
    - vendor: Microsoft
      product: Dynamics 365 SCM
      element_name: Action messages
      element_type: Mécanisme métier réalisé par un produit
      relationship: Recouvrement partiel
      similarities: Recommandations de changement de quantités ou dates, distinctes de leur application.
      differences: Appui à la notion de recommandation ; ne démontre pas que toute recommandation résulte d’une simulation
        ni ne valide notre hiérarchie de capacités.
      source_title: Action messages
      source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/master-planning/action-messages
      source_version: Mise à jour 2026-03-26
      source_locator: Introduction ; Select action messages
      consulted_on: '2026-09-18'
      evidence_limits: Documentation primaire consultée, texte indexé SAP et page Microsoft ouverte ; aucune réalisation Beaumanoir
        démontrée.
      flow_position: 'U345/C99 : Supply Assignment porte l’application des affectations d’un plan ; décisions spécialisées
        et autres capacités gardent leurs responsabilités. Les recommandations éclairent Simulation & Analysis sans constituer
        un engagement.'
      status: proposed
