      relationship: Appui sémantique
      flow_position: 'U332 adopte trois comportements frères sous Inventory Target Decision : magasin, centre de distribution
        et multi-échelon. La comparaison reste proposée ; SAP Single-Stage/Multi-Stage et les fonctions RELEX ne constituent
        pas une nomenclature équivalente de capacités FLOW.'
      consulted_on: '2026-09-18'
