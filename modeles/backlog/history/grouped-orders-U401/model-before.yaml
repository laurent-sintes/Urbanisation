- id: BHV044
  revision: 1
  kind: behavior
  layer: transactional
  fields:
    name: Order Splitting
    definition: Scinder un Order ou ses éléments en parties traitables distinctement, en préservant la filiation, la cohérence
      des quantités et les engagements applicables.
    finality: Adapter le traitement d’une demande sans la dupliquer ni perdre la trace de ses parties.
    scope: |-
      Exemple fictif : un Order de 100 pièces devient deux Orders de 60 et 40, liés à leur origine. Un split peut également porter sur les lignes ou échéances sans créer deux commandes autonomes. Le parent historique et les fragments ne sont pas comptés comme trois demandes. Définir le devenir de l’original et les conditions de mutation au regard des quantités déjà réalisées et des éléments gelés.

      Le choix des sites, des dates ou des parts reste du ressort des décisions spécialisées. La mutation applique le choix autorisé ; elle ne recalcule pas silencieusement une autre promesse. D06 ou les exécutants gardent leurs tâches. Si un engagement d’ensemble reste actif et sa composition doit être maintenue, mobiliser Structuring.

      Split coupe les commandes ; Spread répartit des ressources entre commandes existantes. Un plan de répartition peut motiver un split ultérieur, sans les confondre. Le clonage peut ajouter une nouvelle demande ; il n’est pas un split. Nom développé Order Splitting éditorial, notion Split adoptée U362/U363.
    market_comparisons:
    - vendor: Oracle
      product: Fusion Cloud Order Management
      element_name: What’s a Split Order Line
      element_type: Fonction produit, verbe descriptif ou stratégie de répartition
      relationship: Appui sémantique
      similarities: Split couvre plusieurs entrepôts, dates ou articles substituts, et peut créer plusieurs lignes et tâches
        de fulfillment.
      differences: Ne signifie pas toujours création de plusieurs commandes autonomes ; la fonction produit combine décisions
        et effets que FLOW sépare.
      source_title: What’s a Split Order Line
      source_url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/26b/fauom/fulfillment-line-splits.html
      source_version: 26B
