- id: BHV025
  revision: 1
  kind: behavior
  layer: transactional
  fields:
    name: Stock Consolidation
    definition: Regrouper des quantités fragmentées pour leur redonner une utilité ou libérer des sites.
    scope: |-
      Mécanisme de décision de regroupement intersites : choisir les stocks à réunir, les lieux destinataires, les quantités et les dates selon le bénéfice attendu de leur concentration. Le résultat est une recommandation de transferts, pas une manutention interne d’entrepôt.

      Deux cas sont retenus U318. Reconstituer des assortiments de tailles dans certains magasins peut rendre un ensemble de pièces plus utile commercialement que des tailles isolées sur plusieurs sites. Regrouper les reliquats vers des lieux adaptés peut libérer les sites donneurs et préparer une utilisation ultérieure, même sans manque immédiat à destination. Ces cas partagent le mécanisme de concentration mais gardent des critères et résultats distincts ; aucun sous-comportement n’est créé.

      Exemples fictifs : réunir des tailles dispersées d’un même modèle dans un magasin où l’assortiment ainsi reconstitué répond aux besoins ; regrouper les reliquats de plusieurs magasins dans un lieu retenu pour leur réemploi. Une fragmentation n’implique pas que chaque quantité soit excédentaire : protéger les besoins locaux et comparer bénéfice, coûts, délais et risques de la concentration.

      Le choix d’assortiment commercial reste une entrée ou une contrainte ; la consolidation ne redéfinit pas à elle seule la collection ou la gamme. Ni liquidation commerciale, ni destruction, ni fixation de prix ne sont ajoutées. D04 porte les Orders et D06 les prestations. La consolidation physique de palettes ou d’emplacements dans SAP EWM relève d’un autre périmètre.
    market_comparisons:
    - vendor: Oracle
      product: Fusion Cloud SCM — Replenishment Planning
      element_name: Inventory Rebalancing / sweep location
      element_type: Fonctionnalité de planification
      relationship: Recouvrement partiel
      similarities: Transferts de lieux en excédent vers des lieux en manque et possibilité de diriger des excédents vers
        un lieu de collecte. Le calcul tient compte des demandes, apports et protections du donneur.
      differences: Oracle décrit un traitement exécuté avant le replenishment et générant des ordres planifiés. FLOW sépare
        décision, application aux Orders et exécution sans adopter cet ordre de traitement. Oracle 26B précise que ce rebalancing
        ne fournit pas de recommandations échelonnées dans le temps.
      source_title: Overview of Inventory Rebalancing
      source_url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/26b/faurp/overview-of-inventory-rebalancing.html
      source_version: Fusion Cloud SCM 26B
      source_locator: Salient Features ; Additional Points About Inventory Rebalancing
      evidence_limits: Documentation primaire consultée ; ne démontre ni un optimum universel, ni la décomposition FLOW, ni
        un déploiement Beaumanoir.
      flow_position: 'U318 adopte deux comportements sous Stock Redistribution Decision : rééquilibrage entre sites et consolidation
        de stocks dispersés, avec reconstitution d’assortiments de tailles et regroupement des reliquats. Les formulations
        anglaises Inventory Rebalancing et Stock Consolidation sont éditoriales ; les correspondances produit restent proposées.
        FLOW décide les transferts intersites ; D04 gère les Orders et D06 l’exécution.'
      consulted_on: '2026-09-18'
      status: proposed
      source_refs:
      - U317
      - ELM201
      - CMP109
      - U318
