- id: D04.n
  revision: 2
  kind: capability
  layer: transactional
  fields:
    name: Order Structuring
    definition: Construire et maintenir la composition métier d’un ensemble d’Orders et la cohérence entre la demande d’ensemble
      et ses composants.
    finality: Conserver une lecture cohérente de l’ensemble, de ses engagements et de sa satisfaction au fil des évolutions
      de ses composants.
    nature: action
    scope: |-
      Maintenir les rattachements et les règles de cohérence d’une composition persistante : agrégation des quantités, lien au besoin d’ensemble, effets des remplacements et regroupements autorisés, lecture de la satisfaction sans double comptage. Un Order chapeau peut porter cet engagement si le métier le requiert ; aucun nouvel objet ou schéma parent-enfants obligatoire n’est introduit.

      Exemple fictif : une demande d’implantation reste suivie comme un ensemble pendant que plusieurs Orders de transfert la réalisent. Remplacer un composant doit conserver la traçabilité et la cohérence de l’engagement d’ensemble. Il ne suffit pas de sommer des demandes indépendantes ni de compter simultanément chapeau et composants.

      Une simple trace de filiation après scission relève de Lifecycle / Order Splitting. La recomposition ou consolidation d’un ensemble durable relève de Structuring ; un simple déplacement d’échéance relève de Rescheduling. « Spread » est réservé ici au sens qualifié SAP ARun : répartition de ressources entre besoins, hors mutation et composition des Orders. Répartir une demande en échéances doit être nommé explicitement.

      Structuring ne décide pas la meilleure promesse ou l’affectation et n’orchestre pas les tâches logistiques. Les périmètres précis de composition, homogènes ou entre types, restent à éprouver ; pas de cycle universel ni de nouveau comportement systématique.
