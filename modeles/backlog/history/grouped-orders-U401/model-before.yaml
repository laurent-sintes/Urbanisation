        et enregistrées.
      differences: Périmètre produit Warehouse Management ; aucune attribution automatique à FLOW des opérations WMS, ni obligation
        comptable ajoutée.
      flow_position: U334 adopte Periodic Physical Inventory, Cycle Counting et Spot Counting sous Stocktaking, ainsi que
        la politique et les demandes de vérification. Réalisation physique par les exécutants ; traitement des écarts commun
        et ajustements tracés par Record Inventory Movements. Comparaison produit proposée ; aucun déploiement déduit.
