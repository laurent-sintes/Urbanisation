- id: BHV005
  revision: 1
  kind: behavior
  layer: transactional
  fields:
    name: Scenario Construction
    definition: Construire plusieurs réponses possibles en explicitant leurs hypothèses, objectifs et contraintes.
    scope: |-
      Critère différenciant : variante. Bénéfice ciblé : Explorer des alternatives avant engagement.

