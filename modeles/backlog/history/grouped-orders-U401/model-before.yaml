- id: BHV053
  revision: 1
  kind: behavior
  layer: transactional
  fields:
    name: Return to Customer
    definition: Prendre en charge la restitution du produit au client, après réparation ou décision de non-reprise.
    finality: Distinguer restitution du bien et envoi d’un nouveau produit de remplacement.
    scope: |-
      Parcours de restitution du même produit, après réparation ou après décision applicable de ne pas le reprendre ; préserver identité, destinataire et preuve de restitution.

      Exemple fictif : Le produit réparé est rendu au client. Un autre cas peut être le retour non accepté, restitué après la décision compétente.

      Ne décide pas du refus commercial. Ne crée pas implicitement une nouvelle vente, ne remplace pas la réservation/promesse d’un article de remplacement. D06 suit l’acheminement.

      Ce comportement appartient à [Customer Return](model:D04.l). Il peut se combiner avec les autres parcours du retour selon le produit ou la quantité. Le choix du devenir est porté par [Return Disposition Decision](model:D05.i). Les preuves de résultat proviennent des responsabilités opérationnelles compétentes. Aucune inspection, écriture de stock, prestation physique ou décision de remboursement absorbée ; aucun logiciel ni traitement manuel imposé.
