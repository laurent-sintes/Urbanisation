- id: BHV057
  revision: 1
  kind: behavior
  layer: transactional
  fields:
    name: Return for Repair
    definition: Prendre en charge l’envoi d’un bien au fournisseur pour réparation puis sa récupération, en préservant son
      identité et l’attendu de restitution.
    finality: Distinguer retour du même bien réparé et fourniture d’un autre produit de remplacement.
    scope: |-
      Préserver le lien entre le bien envoyé, la prestation attendue et le bien restitué. Suivre quantités, dates convenues, avancement et résultat, sans déduire la disponibilité du seul envoi ou d’une date annoncée. Restituer le même bien réparé se distingue de fournir un autre produit de remplacement.

      Exemple fictif : dix pièces sont renvoyées au fournisseur pour reprise de couture. Huit reviennent réparées, deux restent attendues. Si deux pièces ne sont pas réparables, leur autre devenir nécessite une décision autorisée ; le parcours ne transforme pas silencieusement cet attendu en remplacement.

      [Supplier Return](model:D04.m) porte le suivi de l’Order et du bien. [Purchase Order](model:D04.j) porte l’achat de prestation lorsqu’il est nécessaire. [Execution Management](model:D06) coordonne les prestations et remonte leurs faits ; [Inventory Management](model:D01) enregistre mouvements et états. L’exécutant réalise la réparation. La garantie, le coût et l’accord de prise en charge sont des conditions applicables ; ni gratuité ni négociation absorbée.

      Ce parcours peut servir une remise en état issue de [Customer Return](model:D04.l), sans dupliquer la prise en charge client. Les autres retours peuvent suivre Credit ou Replacement selon leurs accords ; aucun sous-comportement ou séquence universelle. Les exemples sont illustratifs.
    market_comparisons:
    - vendor: Oracle
      product: E-Business Suite — Service Parts Planning
      element_name: Repair at sourcing / Repair-Return
      element_type: Processus et fonctions produit
      relationship: Recouvrement partiel
      similarities: La réparation externe peut mobiliser un achat au réparateur et des documents de mouvement du bien.
      differences: Planification de pièces de service et réparation, pas preuve d’un comportement de retour fournisseur dans
        Oracle Fusion ou dans le retail FLOW.
      flow_position: U388 place le suivi du renvoi et de la restitution sous Supplier Return. Achat de prestation et orchestration
