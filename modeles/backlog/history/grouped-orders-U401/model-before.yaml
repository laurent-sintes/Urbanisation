- id: BHV024
  revision: 1
  kind: behavior
  layer: transactional
  fields:
    name: Inventory Rebalancing
    definition: Déplacer du stock vers les lieux qui en ont davantage besoin, en préservant les besoins des donneurs.
    scope: |-
      Mécanisme de décision de transferts intersites : comparer les besoins connus ou prévus, le stock admissible et les apports déjà engagés pour déterminer les quantités, origines, destinations et dates à retenir. Le résultat est une recommandation de redistribution ; le verbe déplacer dans la définition exprime l’effet recherché, pas la réalisation physique par D05.

      Préserver les besoins et engagements du site donneur. Le bénéfice peut être de prévenir une rupture, de mieux couvrir une demande prévue ou d’améliorer l’utilisation du stock selon les objectifs retenus ; il n’exige pas une pénurie déjà constatée. Mettre ce bénéfice en regard des coûts, délais et risques, sans imposer une pondération unique.

      Exemple fictif : transférer 20 pièces d’un magasin peu demandeur vers un magasin dont les ventes risquent d’épuiser le stock, après vérification que le donneur reste correctement couvert. Si le délai rend le transfert inutile ou son coût disproportionné, retenir une autre réponse ou expliciter l’absence de transfert pertinent.

      Coordonner les résultats avec Initial Stocking Decision et Replenishment Decision sans couvrir deux fois le même besoin. D04 gère les Transfer Orders et D06 pilote les prestations. D03 conserve la satisfaction des Orders ; ce comportement vise la répartition du stock, sans affecter à lui seul des ressources à des commandes.
    market_comparisons:
    - vendor: Oracle
      product: Fusion Cloud SCM — Replenishment Planning
      element_name: Inventory Rebalancing / sweep location
      element_type: Fonctionnalité de planification
      relationship: Recouvrement partiel
      similarities: Transferts de lieux en excédent vers des lieux en manque et possibilité de diriger des excédents vers
        un lieu de collecte. Le calcul tient compte des demandes, apports et protections du donneur.
      differences: Oracle décrit un traitement exécuté avant le replenishment et générant des ordres planifiés. FLOW sépare
        décision, application aux Orders et exécution sans adopter cet ordre de traitement. Oracle 26B précise que ce rebalancing
        ne fournit pas de recommandations échelonnées dans le temps.
      source_title: Overview of Inventory Rebalancing
      source_url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/26b/faurp/overview-of-inventory-rebalancing.html
      source_version: Fusion Cloud SCM 26B
      source_locator: Salient Features ; Additional Points About Inventory Rebalancing
      evidence_limits: Documentation primaire consultée ; ne démontre ni un optimum universel, ni la décomposition FLOW, ni
        un déploiement Beaumanoir.
      flow_position: 'U318 adopte deux comportements sous Stock Redistribution Decision : rééquilibrage entre sites et consolidation
        de stocks dispersés, avec reconstitution d’assortiments de tailles et regroupement des reliquats. Les formulations
        anglaises Inventory Rebalancing et Stock Consolidation sont éditoriales ; les correspondances produit restent proposées.
        FLOW décide les transferts intersites ; D04 gère les Orders et D06 l’exécution.'
      consulted_on: '2026-09-18'
      status: proposed
      source_refs:
      - U317
      - ELM201
      - CMP109
      - U318
    - vendor: Nextail
      product: Store Transfers / Inventory Rebalancing — cas Merkal
      element_name: Inventory rebalancing / consolidation
      element_type: Usage produit et témoignage client publié par l’éditeur
      relationship: Appui sémantique et recouvrement partiel
      similarities: Rééquilibrage de fin de saison entre magasins et amélioration de la disponibilité des tailles par consolidation.
        La valeur recherchée dépasse le simple comblement d’un manque global en unités.
      differences: Le témoignage documente le bénéfice de consolidation des tailles, pas les règles de calcul ni une taxonomie
        de comportements. FLOW réunit, selon U318, reconstitution d’assortiments et regroupement des reliquats sous un même
        mécanisme de consolidation intersites, tout en conservant leurs cas et critères distincts.
