- id: D01.h
  revision: 1
  kind: capability
  layer: transactional
  fields:
    name: Consigned Inventory Management
    definition: 'Appliquer au stock consigné les conditions de l’accord : propriété, droits d’usage, échéances et suites autorisées
      ; mobiliser les capacités responsables lorsqu’une acquisition, un retour ou une autre issue devient nécessaire.'
    nature: management
    finality: Respecter les droits et obligations sur le stock fournisseur détenu, pendant sa présence dans le réseau et lors
      de ses suites.
    scope: |-
      La cible initiale concerne le fournisseur propriétaire et le distributeur détenteur. La capacité applique les conditions référencées d’Agreement ; elle ne négocie pas le contrat et n’administre pas son maître. Détention, propriété, droit d’usage, responsabilité et rémunération du stockage sont distincts. [Inventory Tracking](model:D01.f) et [Record Inventory Movements](model:D01.g) conservent les états et mouvements. [Consignment Replenishment Order](model:D04.r) porte la demande d’apport ; [Purchase Order](model:D04.j), [Supplier Return](model:D04.m) ou les autres Orders pertinents portent les suites retenues. Les faits utiles sont transmis à la comptabilité, la facturation et l’assurance sans absorber leurs responsabilités. Les issues autorisées après saison ne se confondent ni avec la décision du devenir ni avec sa réalisation. Location rémunérée, transfert de propriété à chaque vente et droit de destruction ne sont pas des règles universelles déduites de la consignation.

      [Agreement](model:D11) fournit les conditions applicables, y compris celles de l’offre de stockage. [Inventory Optimization](model:D05) décide des besoins d’implantation ou de réassort ; [Order Management](model:D04) porte les demandes correspondantes ; [Inventory Management](model:D01) applique le régime du stock et enregistre ses évolutions ; [Execution Management](model:D06) orchestre les prestations physiques et numériques.

      Exemple fictif présenté et adopté : une demande porte sur 500 pièces pour une implantation. Les réceptions satisfont progressivement la demande d’apport. Les pièces restent ensuite gérées sous l’accord de consignation : vente autorisée, éventuel transfert de propriété, échéance de reprise. La fin de la demande ne met pas fin à la gestion de la consignation. Cet exemple ne décrit pas une pratique installée prouvée chez Beaumanoir.
