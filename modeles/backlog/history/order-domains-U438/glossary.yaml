- id: TER077
  name: Couverture de stock
  short_description: Mesure de la demande qu’un stock peut satisfaire sur un périmètre et un horizon définis.
  definition: Mesure de la capacité d’un stock à satisfaire une demande de référence, exprimée notamment en durée de consommation,
    selon un périmètre et des hypothèses explicites.
  context: Sens métier proposé en U260 pour distinguer l’indicateur de stock de la couverture d’une demande identifiée.
  notes: 'Préciser produit, lieu, demande de référence, horizon et inclusion éventuelle des réceptions prévues. Exemple simplifié
    : 100 pièces utilisables, une consommation constante de 10 pièces par jour et aucune réception correspondent à dix jours
    de couverture. Ce ratio n’est pas une formule universelle et ne garantit pas la satisfaction de chaque Order. Une couverture
    cible constitue un objectif ; elle se distingue de la mesure constatée ou projetée. Voir [Couverture d’une demande](glossary:TER022).'
  source_refs:
  - U260
  source_locator:
    path: marche/atp-aatp-couverture.md
    anchor: couverture-deux-registres-separes
  review:
    state: proposed
    note: Définition et exemple proposés par Codex ; pas de validation détaillée déduite de la demande de glossaire.
- id: TER078
  name: Supply Assignment Plan
  short_description: Plan d’affectation des ressources aux commandes.
  definition: Ensemble cohérent d’affectations proposées ou retenues précisant les ressources, quantités et dates destinées
    aux commandes d’un périmètre, avec les hypothèses et contraintes applicables.
  context: Objet métier descriptif de résultat, pas un niveau supplémentaire de comportement ; convention de vocabulaire U289.
  notes: |-
    Préciser statut proposé/retenu/appliqué, périmètre, version et hypothèses. Exemple fictif : ressource de 100 pièces affectée à deux commandes pour 60 et 40 selon les règles. Il ne s’agit ni d’une enveloppe par canal ni nécessairement d’un transfert entre sites. Décider les affectations, les enregistrer, confirmer la promesse et modifier les Orders ont des effets distincts.

    U290 : la finalité de l’affectation est de maximiser une valeur multidimensionnelle sous contraintes. Service, engagements, coûts et risques sont des exemples éditoriaux ; leurs poids et modes d’arbitrage ne sont pas fixés.

    U436 : seule la réservation bloque les usages concurrents ; l’affectation seule ne les bloque pas. Créer, conserver ou réviser un lien d’affectation ne crée donc pas implicitement une réservation. Les protections de groupe conservent leurs règles d’admissibilité, et un gel d’affectation sa restriction de modification. Expiration, consommation, libération et déclenchement automatique éventuel d’une réservation restent à préciser ; aucun mécanisme technique de concurrence n’est déduit de cette frontière.
  source_refs:
  - U289
  - CMP096
  - U290
  - U436
  source_locator:
    path: marche/assignment-allocation-convention.md
    anchor: convention-flow
  review:
    state: partial
    note: Définition éditoriale sous mandat U289 ; aucune validation détaillée auto-attribuée. U436 adopte uniquement la frontière
      réservation / affectation sur le blocage concurrent. Définitions et autres compléments conservent leur portée antérieure
      ; aucun accord global sur le terme.
