- id: TER085
  name: Fulfillment
  short_description: Satisfaction effective d’une commande selon les quantités, délais et conditions retenus.
  definition: 'Ensemble des activités qui organisent et réalisent la satisfaction d’une commande : mobiliser les ressources
    et services nécessaires, coordonner leur mise à disposition et accomplir le résultat attendu selon les quantités, délais
    et conditions retenus.'
  context: La documentation Microsoft distingue optimisation de la satisfaction et opérations effectives de fulfillment. Formulation
    FLOW proposée ; aucune nouvelle capacité agrégée n’est créée par le terme.
  notes: 'Un calcul ATP, une promesse confirmée ou une affectation seule ne prouve pas la réalisation. Order Backlog Management
    recherche comment satisfaire au mieux ; Fulfillment Strategy fixe le cadre ; les exécutants réalisent les prestations.
    Exemple fictif : choisir un stock et un service puis préparer et livrer les pièces attendues. Le marché décrit souvent
    les commandes clients ; l’application aux transferts, achats, retours ou services numériques de FLOW doit préciser le
    résultat et le point de vue, sans prétendre à une équivalence universelle. Les retours ne sont pas automatiquement inclus
    ou exclus du seul fait du mot. Voir [Supply](glossary:TER083) et [Supply Chain](glossary:TER084). Orthographe canonique
    proposée : Fulfillment ; Fulfilment est une variante orthographique.'
  source_refs:
  - U366
  - U367
  - ELM225
  - CMP136
  - U413
