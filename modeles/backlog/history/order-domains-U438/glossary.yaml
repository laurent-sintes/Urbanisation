terms:
- id: TER001
  name: Capacité métier
  short_description: Ce que sait faire l’entreprise indépendamment de son organisation et de ses outils.
  definition: Ce que sait faire l’entreprise indépendamment de son organisation et de ses outils.
  context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
  notes: 'Définition réaffirmée par Laurent, U33. Précision de lecture proposée : une opération ou une étape ne constitue
    pas automatiquement une capacité ; examiner l’aptitude exprimée et sa maille.'
  source_refs:
  - U203
  source_locator:
    path: connaissance/19-glossaire-metier.md
    anchor: ''
  review:
    state: under_review
    note: Reprise documentaire ; aucune validation supplémentaire par la migration.
- id: TER002
  name: Objet métier
  short_description: Notion sur laquelle l’entreprise raisonne, tient des faits ou prend des décisions.
  definition: Notion sur laquelle l’entreprise raisonne, tient des faits ou prend des décisions.
  context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
  notes: Un objet n’est pas une table, un message ou une application. N1. Sens large du glossaire ; U61 rapproche certains
    objets de la plateforme d’aggregate roots, sans définir leurs frontières. Voir la [note objets/faits](24-capacites-objets-et-faits.md).
  source_refs:
  - U203
  source_locator:
    path: connaissance/19-glossaire-metier.md
    anchor: ''
  review:
    state: under_review
    note: Reprise documentaire ; aucune validation supplémentaire par la migration.
- id: TER003
  name: Ressource
  short_description: Moyen, bien ou droit mobilisable pour obtenir un résultat métier, sous des conditions à préciser.
  definition: Moyen, bien ou droit mobilisable pour obtenir un résultat métier, sous des conditions à préciser.
  context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
  notes: Distinguer la ressource de sa quantité et de sa représentation ; accès, date et admissibilité peuvent limiter son
    usage. N1/N3.
  source_refs:
  - U203
  source_locator:
    path: connaissance/19-glossaire-metier.md
    anchor: ''
  review:
    state: under_review
    note: Reprise documentaire ; aucune validation supplémentaire par la migration.
- id: TER004
  name: Article / unité de gestion
  short_description: Bien décrit à la maille nécessaire à son identification et à sa gestion commerciale ou opérationnelle.
  definition: Bien décrit à la maille nécessaire à son identification et à sa gestion commerciale ou opérationnelle.
  context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
  notes: Sens historique Article / unité de gestion. Le rôle Article du modèle actuel est TER060 ; ne pas confondre les identités
    de notion.
  source_refs:
  - U203
  source_locator:
    path: connaissance/19-glossaire-metier.md
    anchor: ''
  review:
    state: under_review
    note: Reprise documentaire ; aucune validation supplémentaire par la migration.
  historical: true
- id: TER005
  name: Stock
  short_description: Ensemble de biens matériels considéré dans un périmètre et à une date ; ici, principalement les marchandises
    du commerce.
  definition: Ensemble de biens matériels considéré dans un périmètre et à une date ; ici, principalement les marchandises
    du commerce.
  context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
  notes: 'Qualifier stock physique et stock enregistré : le second en est la représentation tenue à partir des faits connus.
    Ni disponibilité ni propriété ne se déduisent du seul mot stock. N2.'
  source_refs:
  - U203
  source_locator:
    path: connaissance/19-glossaire-metier.md
    anchor: ''
  review:
    state: under_review
    note: Reprise documentaire ; aucune validation supplémentaire par la migration.
- id: TER006
  name: Position de stock
  short_description: Quantité de stock décrite à une date, pour une maille et des dimensions métier explicites.
  definition: Quantité de stock décrite à une date, pour une maille et des dimensions métier explicites.
  context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
  notes: Article, unité, lieu ou transit, état, détenteur ou propriétaire selon le besoin ; conserver la provenance. Plusieurs
    copies ne constituent pas plusieurs stocks. N2.
  source_refs:
  - U203
  source_locator:
    path: connaissance/19-glossaire-metier.md
    anchor: ''
  review:
    state: under_review
    note: Reprise documentaire ; aucune validation supplémentaire par la migration.
- id: TER007
  name: Mouvement de stock
  short_description: Fait de changement d’une position de stock, par exemple une réception, une sortie ou un transfert entre
    positions.
  definition: Fait de changement d’une position de stock, par exemple une réception, une sortie ou un transfert entre positions.
  context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
  notes: Une intention de déplacement et son exécution sont distinctes. Une réservation ne signifie pas un mouvement physique.
    N2.
  source_refs:
  - U203
  source_locator:
    path: connaissance/19-glossaire-metier.md
    anchor: ''
  review:
    state: under_review
    note: Reprise documentaire ; aucune validation supplémentaire par la migration.
- id: TER008
  name: Ressource attendue
  short_description: Ressource dont la mise à disposition est attendue à une date et sous des conditions identifiées.
  definition: Ressource dont la mise à disposition est attendue à une date et sous des conditions identifiées.
  context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
  notes: Ne pas l’assimiler au stock déjà présent. Distinguer prévision, approvisionnement commandé et réception annoncée.
    N3.
  source_refs:
  - U203
  source_locator:
    path: connaissance/19-glossaire-metier.md
    anchor: ''
  review:
    state: under_review
    note: Reprise documentaire ; aucune validation supplémentaire par la migration.
- id: TER009
  name: Disponibilité
  short_description: Quantité mobilisable pour un usage et un horizon donnés, compte tenu des faits, engagements et règles
    applicables.
  definition: Quantité mobilisable pour un usage et un horizon donnés, compte tenu des faits, engagements et règles applicables.
  context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
  notes: Ce n’est pas une propriété absolue du stock ; une réponse de disponibilité n’engage pas nécessairement une quantité.
    Une quantité de disponibilité calculée relève du sens Stock virtuel donné en U76 ; son rattachement dépend de l’usage
    (U77/A51). N2/N3.
  source_refs:
  - U203
  source_locator:
    path: connaissance/19-glossaire-metier.md
    anchor: ''
  review:
    state: under_review
    note: Reprise documentaire ; aucune validation supplémentaire par la migration.
- id: TER010
  name: Besoin
  short_description: Résultat recherché ou manque à satisfaire, avant ou après sa formalisation.
  definition: Résultat recherché ou manque à satisfaire, avant ou après sa formalisation.
  context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
  notes: Un besoin peut exister avant une demande identifiable. Convention proposée pour clarifier les échanges. N1/N3.
  source_refs:
  - U203
  source_locator:
    path: connaissance/19-glossaire-metier.md
    anchor: ''
  review:
    state: under_review
    note: Reprise documentaire ; aucune validation supplémentaire par la migration.
- id: TER011
  name: Demande
  short_description: Expression identifiable d’un résultat souhaité, avec objet, quantité, échéance et bénéficiaire lorsque
    ces précisions sont pertinentes.
  definition: Expression identifiable d’un résultat souhaité, avec objet, quantité, échéance et bénéficiaire lorsque ces précisions
    sont pertinentes.
  context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
  notes: Ne prouve ni acceptation, ni promesse, ni couverture. Les familles ci-dessous peuvent avoir des objets et cycles
    distincts. N3/N4.
  source_refs:
  - U203
  source_locator:
    path: connaissance/19-glossaire-metier.md
    anchor: ''
  review:
    state: under_review
    note: Reprise documentaire ; aucune validation supplémentaire par la migration.
- id: TER012
  name: Commande
  short_description: Acte ou document métier formalisant une instruction commerciale ou opérationnelle et ses conditions.
  definition: Acte ou document métier formalisant une instruction commerciale ou opérationnelle et ses conditions.
  context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
  notes: 'Qualifier commande client, commande fournisseur ou ordre opérationnel. L’enregistrement ne garantit pas confirmation,
    réservation ou exécution. Q052 reste ouverte : aucun objet universel Demande n’est adopté. N3/N4.'
  source_refs:
  - U203
  source_locator:
    path: connaissance/19-glossaire-metier.md
    anchor: ''
  review:
    state: under_review
    note: Reprise documentaire ; aucune validation supplémentaire par la migration.
- id: TER013
  name: Engagement
  short_description: Décision tenue envers une demande ou un usage, avec résultat attendu, bénéficiaire et conditions explicites.
  definition: Décision tenue envers une demande ou un usage, avec résultat attendu, bénéficiaire et conditions explicites.
  context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
  notes: Distinguer engagement commercial, de ressource et d’exécution ; leur fermeté et leur révision ne sont pas présumées.
    N3.
  source_refs:
  - U203
  source_locator:
    path: connaissance/19-glossaire-metier.md
    anchor: ''
  review:
    state: under_review
    note: Reprise documentaire ; aucune validation supplémentaire par la migration.
- id: TER014
  name: Promesse
  short_description: Engagement sur ce qui pourra être fourni à une demande, notamment une quantité et une date.
  definition: Engagement sur ce qui pourra être fourni à une demande, notamment une quantité et une date.
  context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
  notes: Une proposition calculée n’est pas encore une promesse prise. Une promesse peut exister sans affectation à une ressource
    précise. N3.
  source_refs:
  - U203
  source_locator:
    path: connaissance/19-glossaire-metier.md
    anchor: ''
  review:
    state: under_review
    note: Reprise documentaire ; aucune validation supplémentaire par la migration.
- id: TER015
  name: Confirmation de promesse
  short_description: Acte ou résultat établissant la quantité et la date promises à une demande dans le contexte défini.
  definition: Acte ou résultat établissant la quantité et la date promises à une demande dans le contexte défini.
  context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
  notes: Distinguer d’une confirmation de réception de message ou de constat d’un fait ; préciser l’effet d’engagement. N3.
  source_refs:
  - U203
  source_locator:
    path: connaissance/19-glossaire-metier.md
    anchor: ''
  review:
    state: under_review
    note: Reprise documentaire ; aucune validation supplémentaire par la migration.
- id: TER016
  name: Réservation de ressource
  short_description: Engagement quantitatif enregistré pour une demande identifiée, avec des effets définis sur les possibilités
    d’engagement pour les demandes concurrentes.
  definition: Engagement quantitatif enregistré pour une demande identifiée, avec des effets définis sur les possibilités
    d’engagement pour les demandes concurrentes.
  context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
  notes: |-
    Préciser modification, consommation et libération. Réviser un engagement existant relève de règles explicites ; ni sortie physique ni irrévocabilité implicite. N2/N3.

    U436 : seule la réservation bloque les usages concurrents ; l’affectation seule ne les bloque pas. Créer, conserver ou réviser un lien d’affectation ne crée donc pas implicitement une réservation. Les protections de groupe conservent leurs règles d’admissibilité, et un gel d’affectation sa restriction de modification. Expiration, consommation, libération et déclenchement automatique éventuel d’une réservation restent à préciser ; aucun mécanisme technique de concurrence n’est déduit de cette frontière.
  source_refs:
  - U203
  - U436
  source_locator:
    path: connaissance/19-glossaire-metier.md
    anchor: ''
  review:
    state: partial
    note: Reprise documentaire ; aucune validation supplémentaire par la migration. U436 adopte uniquement la frontière réservation
      / affectation sur le blocage concurrent. Définitions et autres compléments conservent leur portée antérieure ; aucun
      accord global sur le terme.
- id: TER017
  name: Affectation de ressource
  short_description: Lien entre une demande et une ressource identifiée au degré de précision utile.
  definition: Lien entre une demande et une ressource identifiée au degré de précision utile.
  context: Ressources et commandes ou autres besoins identifiés ; choix lexical Assignment confirmé U275, stabilisé U289.
  notes: |-
    La quantité affectée peut différer de la quantité demandée ou promise. Qualifier l’affectation d’une tâche, qui relève d’un autre objet. N1/N3. U289 : notion résultat associée à Supply Assignment (affectation des ressources aux commandes). Ne pas employer Allocation seul comme synonyme. Un lien peut porter sur une ressource future ; il ne prouve ni promesse confirmée ni mouvement physique. Convention : modeles/backlog/assignment-terminology.yaml.

    U290 : la finalité de l’affectation est de maximiser une valeur multidimensionnelle sous contraintes. Service, engagements, coûts et risques sont des exemples éditoriaux ; leurs poids et modes d’arbitrage ne sont pas fixés.

    U436 : seule la réservation bloque les usages concurrents ; l’affectation seule ne les bloque pas. Créer, conserver ou réviser un lien d’affectation ne crée donc pas implicitement une réservation. Les protections de groupe conservent leurs règles d’admissibilité, et un gel d’affectation sa restriction de modification. Expiration, consommation, libération et déclenchement automatique éventuel d’une réservation restent à préciser ; aucun mécanisme technique de concurrence n’est déduit de cette frontière.
  source_refs:
  - U203
  - U275
  - U289
  - CMP096
  - U290
  - U436
  source_locator:
    path: connaissance/19-glossaire-metier.md
    anchor: ''
  review:
    state: partial
    note: Reprise documentaire ; aucune validation supplémentaire par la migration. U436 adopte uniquement la frontière réservation
      / affectation sur le blocage concurrent. Définitions et autres compléments conservent leur portée antérieure ; aucun
      accord global sur le terme.
- id: TER018
  name: Allocation de groupe
  short_description: Attribution d’une enveloppe à un usage ou une population, avec des règles d’horizon et de consommation.
  definition: Attribution d’une enveloppe à un usage ou une population, avec des règles d’horizon et de consommation.
  context: Terme historique / rapprochement éditeur. Dans le texte FLOW courant, employer enveloppe de protection ou droit
    d’usage par groupe.
  notes: 'Employer le qualificatif ; distinguer cette notion d’une affectation à une demande et d’un plafond de confirmation.
    N2/N3. U289 : Allocation n’est pas un synonyme de Supply Assignment. Cette entrée historique reste résoluble ; le mot
    seul est écarté des nouveaux libellés FLOW.'
  source_refs:
  - U203
  - U289
  - CMP096
  source_locator:
    path: connaissance/19-glossaire-metier.md
    anchor: ''
  review:
    state: under_review
    note: Reprise documentaire ; aucune validation supplémentaire par la migration.
- id: TER019
  name: Protection de ressource
  short_description: Restriction qui préserve une ressource ou une quantité face à certaines demandes concurrentes.
  definition: Restriction qui préserve une ressource ou une quantité face à certaines demandes concurrentes.
  context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
  notes: Une allocation peut porter une protection ; les deux mots ne sont pas des synonymes systématiques. Priorités et horizon
    sont à expliciter. N2/N3.
  source_refs:
  - U203
  source_locator:
    path: connaissance/19-glossaire-metier.md
    anchor: ''
  review:
    state: under_review
    note: Reprise documentaire ; aucune validation supplémentaire par la migration.
- id: TER020
  name: Plafond de confirmation
  short_description: Limite de quantité confirmable pour des critères et une période définis.
  definition: Limite de quantité confirmable pour des critères et une période définis.
  context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
  notes: Une limite n’assure pas l’existence de la ressource ; elle diffère d’une quantité protégée. N3.
  source_refs:
  - U203
  source_locator:
    path: connaissance/19-glossaire-metier.md
    anchor: ''
  review:
    state: under_review
    note: Reprise documentaire ; aucune validation supplémentaire par la migration.
- id: TER021
  name: Pool de ressources
  short_description: Regroupement de ressources selon des critères et des règles explicites, pouvant porter une enveloppe
    et sa consommation.
  definition: Regroupement de ressources selon des critères et des règles explicites, pouvant porter une enveloppe et sa consommation.
  context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
  notes: Définition proposée ; ancien synonyme stock logique retiré après U76 et conservé en C53. Un pool peut contribuer
    à des états ou calculs, sans définir à lui seul le stock logique ou virtuel. N2.
  source_refs:
  - U203
  source_locator:
    path: connaissance/19-glossaire-metier.md
    anchor: ''
  review:
    state: under_review
    note: Reprise documentaire ; aucune validation supplémentaire par la migration.
- id: TER022
  name: Couverture d’une demande
  short_description: Lien qualifié entre une demande et ce qui permet de la satisfaire, avec quantités, dates et conditions.
  definition: Relation qualifiée entre une demande et les éléments qui permettent ou sont prévus pour la satisfaire, pour
    des quantités, dates et conditions définies.
  context: Sens métier précisé en U260 ; distinct de la convention de description du glossaire de modélisation et de la couverture
    de stock.
  notes: 'Préciser le critère : ressources envisageables, ressources affectées, promesse confirmée ou réalisation constatée.
    Exemple : 100 pièces couvertes de manière candidate par 60 sur stock et 40 sur réception attendue ; cela ne prouve ni
    réservation ni promesse confirmée. Une quantité couverte à une date tardive ne satisfait pas une échéance impérative antérieure.
    « Couvert » seul reste insuffisant. Voir aussi [Couverture de stock](glossary:TER077).'
  source_refs:
  - U203
  - U260
  source_locator:
    path: connaissance/19-glossaire-metier.md
    anchor: ''
  review:
    state: proposed
    note: Précision proposée par Codex à la demande U260 ; le principe ATP accepté ne valide pas toute la définition lexicale.
  previous_definition_U260: Relation à qualifier entre une demande et ce qui permet de la satisfaire.
  previous_notes_U260: Toujours préciser couverture par promesse, par ressources affectées ou par un autre critère défini.
    « Couvert » et « uncovered » seuls sont insuffisants. N3.
- id: TER023
  name: Règle métier
  short_description: Condition ou principe qui détermine la validité, l’admissibilité ou les effets d’une décision ou d’un
    fait métier.
  definition: Condition ou principe qui détermine la validité, l’admissibilité ou les effets d’une décision ou d’un fait métier.
  context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
  notes: Sa mise en œuvre peut varier avec les outils. Une variante de politique n’est pas automatiquement une capacité différente.
    N1/N3.
  source_refs:
  - U203
  source_locator:
    path: connaissance/19-glossaire-metier.md
    anchor: ''
  review:
    state: under_review
    note: Reprise documentaire ; aucune validation supplémentaire par la migration.
- id: TER024
  name: Processus
  short_description: Déroulement d’activités, d’événements et de décisions mobilisant des capacités pour atteindre un résultat
    dans un contexte.
  definition: Déroulement d’activités, d’événements et de décisions mobilisant des capacités pour atteindre un résultat dans
    un contexte.
  context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
  notes: Décrit comment le travail s’accomplit ; ne définit pas à lui seul ce que l’entreprise sait faire. N1.
  source_refs:
  - U203
  source_locator:
    path: connaissance/19-glossaire-metier.md
    anchor: ''
  review:
    state: under_review
    note: Reprise documentaire ; aucune validation supplémentaire par la migration.
- id: TER025
  name: Opération métier
  short_description: Action exercée sur des objets métier avec des conditions et des effets déterminés.
  definition: Action exercée sur des objets métier avec des conditions et des effets déterminés.
  context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
  notes: Plusieurs opérations peuvent réaliser une même capacité ; une opération d’API n’est pas automatiquement une capacité.
    N5.
  source_refs:
  - U203
  source_locator:
    path: connaissance/19-glossaire-metier.md
    anchor: ''
  review:
    state: under_review
    note: Reprise documentaire ; aucune validation supplémentaire par la migration.
- id: TER026
  name: Réalisation d’une capacité
  short_description: 'Moyens concrets mobilisés pour exercer une capacité : acteurs, pratiques, outils et échanges.'
  definition: 'Moyens concrets mobilisés pour exercer une capacité : acteurs, pratiques, outils et échanges.'
  context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
  notes: Une réalisation peut évoluer sans changer l’aptitude métier. N1/N5/N6.
  source_refs:
  - U203
  source_locator:
    path: connaissance/19-glossaire-metier.md
    anchor: ''
  review:
    state: under_review
    note: Reprise documentaire ; aucune validation supplémentaire par la migration.
- id: TER027
  name: Fonction
  short_description: 'Mot à qualifier avant emploi : il ne désigne pas un niveau unique adopté dans notre modèle.'
  definition: 'Mot à qualifier avant emploi : il ne désigne pas un niveau unique adopté dans notre modèle.'
  context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
  notes: Dans les réponses A19–A21 sur les produits, l’assistant désignait surtout une fonctionnalité de produit. « Fonction
    métier » pourrait recevoir un autre sens explicite, sans le présumer. U34, C34.
  source_refs:
  - U203
  source_locator:
    path: connaissance/19-glossaire-metier.md
    anchor: ''
  review:
    state: under_review
    note: Reprise documentaire ; aucune validation supplémentaire par la migration.
- id: TER028
  name: Fonctionnalité de produit
  short_description: Comportement ou ensemble de comportements offert par un produit dans une édition et une configuration
    données.
  definition: Comportement ou ensemble de comportements offert par un produit dans une édition et une configuration données.
  context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
  notes: 'Peut contribuer à une ou plusieurs capacités, ou à une partie de capacité. Exemple : BOP comme fonctionnalité SAP
    ; aucune équivalence automatique avec une boîte métier. N5/N6.'
  source_refs:
  - U203
  source_locator:
    path: connaissance/19-glossaire-metier.md
    anchor: ''
  review:
    state: under_review
    note: Reprise documentaire ; aucune validation supplémentaire par la migration.
- id: TER029
  name: Regroupement de capacités
  short_description: Ensemble de capacités rapprochées selon un critère métier explicite pour faciliter la lecture de la carte.
  definition: Ensemble de capacités rapprochées selon un critère métier explicite pour faciliter la lecture de la carte.
  context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
  notes: Le nom, la maille et le critère sont à préciser ; une catégorie de regroupement n’est pas automatiquement une capacité
    mère. Aucun étage nommé Fonction n’est adopté. U34, N6.
  source_refs:
  - U203
  source_locator:
    path: connaissance/19-glossaire-metier.md
    anchor: ''
  review:
    state: under_review
    note: Reprise documentaire ; aucune validation supplémentaire par la migration.
- id: TER030
  name: Domaine
