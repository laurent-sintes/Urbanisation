- id: TER035
  name: Supply — sens fonctionnel du projet
  short_description: Couche transactionnelle de contrôle, d’orchestration et d’optimisation de la logistique.
  definition: Couche transactionnelle de contrôle, d’orchestration et d’optimisation de la logistique.
  context: Convention fonctionnelle locale FLOW, distincte du sens ressources de Supply et du périmètre global de la Supply
    Chain.
  notes: |-
    Définition explicite de Laurent en U56 ; U57 ajoute exécution pour le commerce et intelligence de backoffice : rééquilibrage, prévision, impondérables. U58 distingue ce modèle fonctionnel du développement FLOW : logistique hors réalisation de la plateforme, en adhérence ; attribution détaillée des aptitudes à préciser.

    Clarification U367 : ce sens local demeure conservé. Voir [Supply](glossary:TER083) pour le côté ressources, [Supply Chain](glossary:TER084) pour le système étendu et [Fulfillment](glossary:TER085) pour la satisfaction des commandes. L’emploi local ne transforme pas ces trois notions en synonymes et ne prouve pas que FLOW couvre toute la Supply Chain.
  source_refs:
  - U203
  - U56
  - U57
  - U58
  - U366
  - U367
  - ELM225
  - CMP136
  source_locator:
    path: connaissance/19-glossaire-metier.md
    anchor: ''
  review:
    state: under_review
    note: Reprise documentaire ; aucune validation supplémentaire par la migration. U367 précise le contexte et les renvois
      sans réécrire la définition historique.
  market_comparisons:
