      entrants et retours clients. Supply orders alimente ce côté du bilan.'
    differences: Sémantique de planification Business Central, pas définition d’un périmètre organisationnel FLOW.
    source_title: Balancing supply and demand
    source_url: https://learn.microsoft.com/en-us/dynamics365/business-central/design-details-balancing-demand-and-supply
    source_version: Documentation évolutive
    source_locator: Supply and demand ; Process orders ; Priorities on the supply side
    consulted_on: '2026-09-18'
    evidence_limits: Documentation primaire ouverte ou passage primaire indexé consulté ; synthèse sélective, aucune réalisation
      Beaumanoir déduite.
    flow_position: Le sens fonctionnel FLOW est une convention locale ; Microsoft emploie ici supply au sens ressources. Aucune
      équivalence.
    status: proposed
    source_refs:
    - U366
    - U367
    - ELM225
    - CMP136
  - vendor: CSCMP
