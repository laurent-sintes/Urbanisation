lifecycle_redesign_U422:
  status: alternative_not_preferred_after_U423
  source_refs:
  - U421
  - U422
  - ELM249
  - CMP160
  catalogue_unchanged: true
  catalogue_sha256: 1e9c33665250100dad1c6a047a91513866c861778c33510184a25c31836edda1
  diagnosis: Lifecycle agrège maturité de la demande, engagement planifié, contrôle de prise en charge et fin du besoin. Les
    déplacements en bloc masquent ces frontières. Aucun statut ne détermine à lui seul une capacité.
  adopted_principle: 'U421 : distinguer des dimensions d’état combinables, soumises à des contraintes de cohérence.'
  capabilities:
  - name: Order Change Management
    domain_id: D04
    implementation_option: Recentrer D04.o en préservant son identifiant après accord.
    definition: Gouverner la préparation et les modifications autorisées des demandes, en distinguant contenu applicable,
      changements en préparation et effets sur les engagements existants.
    decomposition_rationale: Préparer une demande non engagée, réviser une demande engagée, changer son échéance, retirer
      son reliquat ou établir sa fin ont des effets métier différents. La révision contrôlée évite qu’un brouillon devienne
      implicitement applicable aux traitements en cours.
    naming: Appui sur change management et Purchase order preparation Microsoft ; nom transverse FLOW proposé, pas intitulé
      d’une capacité Microsoft documentée.
    boundary: Les capacités par intention portent parties, clauses et parcours métier. Pas de mutualisation informatique motivant
      cette capacité. Les décisions spécialisées évaluent les options, D06 gère les conséquences sur les processus.
  - name: Order Backlog Control
    domain_id: D03
    implementation_option: Nouvelle capacité proposée, sans identifiant réservé avant accord.
    definition: Gouverner l’engagement des demandes dans le carnet, leur protection contre les réoptimisations et l’autorisation
      ou la suspension de leur prise en charge.
    decomposition_rationale: Firming engage une intention, Freezing protège un contenu désigné, Release autorise une prise
      en charge, Hold suspend une progression. Ces effets se combinent et ne forment pas les étapes d’un statut unique.
    naming: Intitulé descriptif FLOW proposé ; pas d’équivalence lexicale Microsoft établie. Appuis fonctionnels distincts
      Firming, Hold, Release et Freeze.
    boundary: Planning prépare les scénarios ; les décisions calculent les réponses ; Control applique engagements et autorisations
      ; Process Orchestration coordonne les services. Control ne signifie pas décider une nouvelle stratégie de fulfillment.
  behavior_mapping:
  - behavior_id: BHV038
    name: Order Drafting
    proposed_target: D04 / Order Change Management
    reason: Préparer le contenu avant soumission ; distinguer brouillon initial et révision d’une demande engagée.
    status: proposed
    preserve_identifier: true
  - behavior_id: BHV036
    name: Order Firming
    proposed_target: D03 / Order Backlog Control
    reason: Engager une intention planifiée dans le carnet ; mobiliser la capacité par type pour établir l’Order applicable.
      Affermir ne vaut ni approuver un avenant ni libérer.
    status: proposed
    preserve_identifier: true
  - behavior_id: BHV037
    name: Order Freezing
    proposed_target: D03 / Order Backlog Control
    reason: Protéger les éléments désignés contre les réoptimisations ; ne pas en faire un verrou universel de modification.
    status: proposed
    preserve_identifier: true
  - behavior_id: BHV039
    name: Order Release
    proposed_target: D03 / Order Backlog Control
    reason: Autoriser la prise en charge individuelle ou collective d’une part de demande ; ne constate pas son démarrage.
    status: proposed
    preserve_identifier: true
  - behavior_id: BHV040
    name: Order Hold & Resume
    proposed_target: D03 / Order Backlog Control
    reason: Suspendre ou réautoriser une progression désignée ; Process Adaptation traite les conséquences sur les services
      en cours.
    status: proposed
    preserve_identifier: true
  - behavior_id: BHV041
    name: Order Rescheduling
    proposed_target: D04 / Order Change Management
    reason: La définition actuelle modifie l’échéance DU BESOIN. Une date de satisfaction calculée relève de Delivery Schedule
      Decision et de Planning ; une promesse révisée de Promise Management.
    status: proposed
    preserve_identifier: true
  - behavior_id: BHV042
    name: Order Cancellation
    proposed_target: D04 / Order Change Management
    reason: Retirer le besoin ou son reliquat autorisé. Retirer une affectation ou une sélection d’un scénario ne signifie
      pas annuler la demande.
    status: proposed
    preserve_identifier: true
  - behavior_id: BHV043
    name: Order Closure
    proposed_target: D04 / Order Change Management
    reason: Établir la fin de la demande opérationnelle et le devenir du reliquat à partir des faits et engagements. Ce n’est
      ni constater la seule fin d’une Task ni archiver.
    status: proposed
    preserve_identifier: true
  additional_behavior:
    name: Order Amendment
    target: D04 / Order Change Management
    status: proposed
    definition: Préparer et rendre applicable une modification d’un Order déjà engagé, en préservant la distinction entre
      proposition, contenu en vigueur et réalisations acquises.
    benefit: Permettre la révision contrôlée d’une demande déjà prise en charge sans appliquer silencieusement un brouillon
      ; exposer impacts, portée et conditions de prise d’effet.
    limits: Pas de clone technique imposé, d’exécution simultanée toujours autorisée ni d’approbation humaine systématique.
      L’impact est établi via les capacités responsables ; compensation et adaptation restent en D06.
  preserved:
  - Structuring et Split dans D03
  - Order Archiving dans D03
  - Capacités par type et leurs comportements métier
  - Décisions, Planning, affectation, promesse et processus distincts
  - Un parent par comportement, sans sous-comportement
  - Pas de nouveau comportement pour chaque statut ou opération CRUD
  market_comparisons:
  - id: MS_CHANGE
    vendor: Microsoft
    product: Dynamics 365 Supply Chain Management
    title: Approve and confirm purchase orders
    url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/procurement/purchase-order-approval-confirmation
    edition: Documentation en ligne évolutive
    consulted_on: '2026-09-19'
    locator: Approval of purchase orders ; Changing purchase orders ; Canceling purchase orders
    nature: Mécanisme ou processus produit
    finding: Avec change management, Request change ramène en Draft ; réapprobation configurable, annulation du reliquat limitée
      par les réalisations. Journaux des confirmations successives.
    limits: Périmètre Purchase Orders ; ne prouve pas que toute exécution continue pendant une révision ni que les dimensions
      sont indépendantes.
  - id: MS_IMPACT
    vendor: Microsoft
    product: Dynamics 365 Supply Chain Management
    title: Review and accept changes to confirmed purchase orders
    url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/procurement/purchase-order-changes-after-confirmation
    edition: Documentation en ligne évolutive
    consulted_on: '2026-09-19'
    locator: The Confirmed purchase orders with changes workspace ; Review changes
    nature: Mécanisme ou processus produit
    finding: Les changements confirmés sont examinés selon leurs impacts directs sur les besoins aval, puis reconfirmés.
    limits: Mécanisme produit, pas nouvelle décision FLOW ni preuve de couverture de tous les impacts indirects.
  - id: MS_FIRM
    vendor: Microsoft
    product: Dynamics 365 Supply Chain Management
    title: Firm planned orders
    url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/master-planning/planning-optimization/planned-order-firming
    edition: Documentation en ligne évolutive
    consulted_on: '2026-09-19'
    locator: Introduction
    nature: Mécanisme ou processus produit
    finding: Firming transforme les ordres planifiés en commandes d’achat, transfert ou production effectives.
    limits: Microsoft emploie aussi release pour cette opération ; FLOW distingue affermissement et autorisation de prise
      en charge. Pas tous les types d’Orders.
  - id: MS_HOLD
    vendor: Microsoft
    product: Dynamics 365 Supply Chain Management
    title: Manage order holds
    url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/sales-marketing/tasks/manage-order-holds
    edition: Documentation en ligne évolutive
    consulted_on: '2026-09-19'
