    locator: Purchase order statuses
    consulted_on: '2026-09-19'
    finding: Purchase order status, Document status et Approval status coexistent sur une commande.
    relationship: Appui méthodologique
    limits: 'Données et processus produit : ne prouvent pas une capacité Microsoft découpée selon nos dimensions.'
  - vendor: Microsoft
    product: Dynamics 365 Intelligent Order Management
    title: State framework architecture
    url: https://learn.microsoft.com/en-us/dynamics365/intelligent-order-management/state-framework
    version: '2026-01-30'
