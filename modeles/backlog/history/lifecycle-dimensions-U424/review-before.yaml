lifecycle_dimensions_U423:
  status: proposed
  source_refs:
  - U421
  - U422
  - U423
  - ELM250
  - CMP161
  preferred_direction: Conserver une capacité Order Lifecycle Management ; revoir ses comportements par dimension métier plutôt
    que déplacer la capacité entière ou créer un comportement pour chaque état.
  definition_proposed: Gouverner les évolutions autorisées des Orders selon leurs dimensions de maturité, d’engagement, de
    protection et de prise en charge, en préservant la cohérence entre contenu applicable, modifications en préparation et
    réalisations acquises.
  dimension_examples:
  - dimension: Maturité et révision de la demande
    responsibility: Gouverner la préparation et la prise d’effet des versions et modifications du besoin.
    existing_behaviors:
    - BHV038
    - BHV041
    note: Drafting et changement de date du besoin ; révision contrôlée à préciser sans créer une machine d’état universelle.
  - dimension: Engagement
    responsibility: Transformer une intention planifiée en ordre ferme selon le type d’Order.
    existing_behaviors:
    - BHV036
  - dimension: Protection contre la réoptimisation
    responsibility: Définir et appliquer les éléments gelés et les conditions de leur révision.
    existing_behaviors:
    - BHV037
  - dimension: Autorisation de prise en charge
    responsibility: Autoriser le traitement d’une part de demande, individuellement ou collectivement.
    existing_behaviors:
    - BHV039
  - dimension: Suspension de la progression
    responsibility: Suspendre et réautoriser une progression désignée avec son motif et sa portée.
    existing_behaviors:
    - BHV040
  - dimension: Fin de la demande opérationnelle
    responsibility: Distinguer retrait du besoin et clôture, en préservant faits et engagements acquis.
    existing_behaviors:
    - BHV042
    - BHV043
    note: Regroupement descriptif à arbitrer ; aucune fusion implicite de Cancellation et Closure.
  benefit: Rendre possible une commande engagée et partiellement libérée dont une modification se prépare, sans confondre
    autorisation, suspension, protection et réalisation.
  boundaries:
  - Le domaine courant de Lifecycle reste D04. Une capacité et ses comportements gardent un parent unique ; ils ne sont pas
    distribués artificiellement entre D03 et D04.
  - D03 mobilise les comportements de Lifecycle pour mettre en action le scénario retenu. Ce lien de responsabilité ne présume
    pas un composant logiciel mutualisé.
  - Les politiques, décisions et calculs de D03 restent distincts des transitions appliquées par Lifecycle.
  - D06 orchestre les services et fournit les faits de réalisation ; une autorisation ne prouve pas un démarrage.
  - Order Archiving et Order Structuring restent distincts en D03, conformément aux choix acquis.
  - Un tableau de dimensions ne vaut pas liste de comportements adoptée ; aucune sous-décomposition, duplication ni fusion
    implicite.
  - Les contraintes entre dimensions s’apprécient par type, version, ligne et quantité. Une révision ne permet pas de réécrire
    les réalisations acquises.
  market_comparisons:
