  consulted_on: '2026-09-18'
- id: OI-S1
  vendor: Microsoft
  product: Dynamics 365 SCM
  title: Set up consignment
  url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/inventory/consignment
  edition: Documentation évolutive, mise à jour affichée 2026-05-06
  locator: Overview of the consignment process ; Consignment replenishment orders
  access: Page primaire ouverte
  finding: Demande d’apport distincte du Purchase Order généré au changement de propriété ; quantités et dates selon demande
    prévue/réelle.
  limit: L’exemple comporte une création manuelle en contexte production ; il ne prouve ni Case Management généralisé, ni
