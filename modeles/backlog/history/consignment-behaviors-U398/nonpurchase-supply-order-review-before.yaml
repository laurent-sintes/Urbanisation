    Retraits, vente, transfert au stock propre et rebut sont distingués.
  limit: Réutilisation de document ERP attestée ; motivations historiques de conception/conformité et incapacité au pilotage
    par les besoins non démontrées. Aucun droit de destruction déduit des options du produit.
  consulted_on: '2026-09-18'
- id: OI-S3
