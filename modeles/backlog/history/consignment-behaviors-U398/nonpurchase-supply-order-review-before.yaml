  finding: Le fournisseur peut déterminer le réassort selon demande brute, stock et min/max.
  limit: Illustration que signal de demande et acteur de décision sont deux axes distincts ; ne valide pas un VMI pour FLOW.
  consulted_on: '2026-09-18'
catalog_changed: true
architecture_U393:
  principle_ref: modeles/backlog/order-intent-principles.yaml
  status: principle_recorded_names_subsequently_adopted_U395
  intent: Distinguer service de stockage offert au fournisseur, demande d’apport et éventuelle acquisition.
  context:
    status: target_intent_expressed_by_user_not_installed_fact
    source_refs:
    - U393
    perspective: Le fournisseur dispose d’un espace de stockage distant dans le réseau du distributeur ; le distributeur propose
      une offre de mise à disposition de cet espace.
    commercial_model: Location/rémunération d’espace évoquée par Laurent ; nature précise, assiette, montant et conditions
      non définis. Ne pas la transformer en condition universelle de consignation.
    ownership: L’apport en consignation n’est pas un achat de marchandises ; un éventuel changement de propriété ultérieur
      reste distinct, selon le montage retenu.
    replenishment: Les ventes et l’évolution du besoin déclenchent ou alimentent le réassort demandé dans la cible décrite
      ; pas de poussée fournisseur unilatérale présumée.
    limits:
    - Aucun automatisme une vente = une unité immédiatement commandée.
    - Réassort tiré par la demande ne désigne pas, à lui seul, l’acteur responsable du calcul ou de la décision.
    - Ne pas déduire de VMI, de transfert automatique à chaque vente, de tarif de stockage ou de responsabilité assurantielle
      non explicités.
    - Stockage, propriété, pilotage du réassort et rémunération sont des dimensions séparées de l’offre.
business_visibility_U394:
  source_refs:
  - U394
  - C103
  criterion: Visibilité du métier au travers du design
  rule: Rendre identifiables dans les concepts, noms, relations, états et événements l’intention de la demande, les parties,
    leurs engagements et la progression métier. Ne pas obliger à reconstruire le sens du processus à partir des seules transactions
    ou d’un paramétrage implicite.
  distinction: Évaluer la lisibilité sémantique séparément de la couverture fonctionnelle ; savoir exécuter un processus ne
    prouve pas que son sens est visible dans le modèle.
  application:
  - Pouvoir distinguer une demande d’apport en consignation d’un engagement d’achat et relier leur évolution éventuelle.
  - Montrer le lien entre intention, accord, demande, exécution et résultat, sans confondre modèle métier et schéma physique.
  - Une réalisation commune est possible si elle conserve ces intentions explicites ; une table par intention ou la multiplication
    des objets ne sont pas des exigences.
  market_judgment: Préférence Microsoft sur la lisibilité des intentions d’apport et d’acquisition dans le cas étudié ; pas
    un déni de couverture SAP.
  historical_opinion: Laurent estime que Microsoft, arrivé après, a corrigé cette faiblesse de design. La causalité et l’intention
    historique ne sont pas établies par les documentations fonctionnelles consultées.
current_U395:
  node_id: D04.r
  adopted_fields:
  - name
  - definition
  behaviors: not_decomposed
  evidence: audits/2026-09-18-consignment-U395/implementation.yaml
  remaining: Comportements à instruire avec bénéfice ou complexité démontrés ; contrats détaillés éditoriaux.
current_U396:
  node_id: D04.r
  status: superseded_by_U397
  source_refs:
  - U396
  decision: Conserver la capacité sans comportement tant qu’aucune variante de processus ne démontre une complexité ou un
    bénéfice ciblé.
  rationale: La distinction apport initial / continu porte sur la finalité et les décisions D05 ; les opérations de suivi
    restent communes à la demande d’apport.
  preserved_scope: Premier apport et alimentation continue, avec réceptions éventuellement fractionnées.
  boundaries:
  - Initial Stocking Decision et Replenishment Decision restent distinctes dans D05.
  - 'Création, modification, annulation et clôture : fonctions communes et mutations d’Order Lifecycle Management.'
  - 'Réception complète ou partielle : suivi des quantités, pas comportement autonome à ce stade.'
  - 'Acquisition : Consigned Inventory Management, avec Purchase Order lorsque nécessaire.'
  market_comparison:
    source_ids:
    - NP-S1
    - NP-S3
    finding: Microsoft et Oracle décrivent une demande d’apport sous consignation avec quantités, lieux, dates et réception
      distincte du changement de propriété.
    limit: Les passages consultés ne décrivent pas deux parcours d’Order distincts pour implantation/réassort ; ne pas déduire
      une absence universelle de variantes.
    flow_position: La non-décomposition découle du critère FLOW de bénéfice/complexité, conforté par les processus documentés
      ; elle reste réexaminable.
  next_topic: 'Instruire les mécanismes contractuels de Consigned Inventory Management : déclenchement de l’acquisition et
    devenir des quantités non consommées. Aucune décomposition adoptée implicitement.'
  superseded_by: U397 — visibilité des comportements métier de l’Order indépendamment des traitements communs ; contenu antérieur
    conservé comme historique.
current_U397:
  node_id: D04.r
  status: decomposition_direction_corrected_candidates_proposed
  source_refs:
  - U397
  - C104
  rule: Expliciter les comportements métier pour l’Order ; les capacités transverses mobilisées et la mutualisation informatique
    ne justifient pas leur omission.
  decomposition_rationale: 'Rendre lisibles les deux intentions d’apport : établir le stock de départ à une échéance de lancement,
    puis entretenir son alimentation pendant l’activité. La différence de finalité et de résultat attendu est utile même si
    le traitement est commun.'
  proposal_status: Noms et définitions proposés par Codex après la correction ; pas encore adoptés.
  proposals:
  - name: Initial Stocking
    definition: Prendre en charge la demande d’apport initial de stock consigné pour une saison, une capsule ou un lancement,
      et suivre les quantités attendues et reçues au regard de l’échéance de démarrage.
    benefit: Rendre visible la constitution du stock de départ et les manquants susceptibles de compromettre le lancement.
    example: Demander 500 pièces consignées avant l’ouverture de saison et suivre les apports restant à recevoir.
    boundary: Initial Stocking Decision détermine le besoin ; ce comportement porte la demande fournisseur et son suivi, sans
      acquisition implicite.
  - name: Continuous Replenishment
    definition: Prendre en charge les demandes successives d’apport de stock consigné pour alimenter les lieux de stockage
      pendant l’activité, selon l’évolution du besoin, et suivre leur satisfaction.
    benefit: Rendre visible l’entretien du stock consigné pendant la période de vente, distinct de sa constitution initiale.
    example: Demander un nouvel apport après des ventes et suivre les quantités reçues et restant attendues, sans imposer
      une commande par vente.
    boundary: Replenishment Decision détermine le besoin ; ce comportement porte les demandes qui en découlent. Aucun VMI
      ni automatisme obligatoire déduit.
  common_description: Les fonctions de création, révision, annulation, suivi des livraisons partielles et clôture sont décrites
    pour cet Order et reliées aux capacités responsables. Leur caractère partagé ne dispense pas d’expliciter leur effet métier
    ; il ne suffit pas non plus à créer un comportement par opération.
  market_comparison:
    source_ids:
    - NP-S1
    - NP-S3
    consulted_on: '2026-09-18'
    finding: Microsoft relie les demandes d’apport à la demande prévue/réelle et suit les quantités reçues ; Oracle décrit
      des demandes périodiques sous accord avec quantités, lieux et dates.
    difference: Les deux comportements proposés ne sont pas une taxonomie native attestée de ces documents. Ils explicitent
      les intentions implantation/réassort déjà distinguées dans FLOW.
    limit: L’absence de deux objets ou parcours nommés dans ces pages ne permet pas de conclure à l’inutilité de la distinction
      dans une cartographie métier.
  preserved_boundaries: Décisions D05, gestion de demande D04, régime et mouvements D01, exécution D06 restent distincts.
    Les deux intentions sont visibles dans l’Order sans recopier le calcul des décisions ni imposer une réalisation informatique.
