- id: NP-S4
  vendor: Oracle
  product: Fusion Cloud SCM
  title: How Supply Chain Orchestration Works
  url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/26a/fauco/how-supply-orchestration-works.html
  edition: 26A
  locator: Transform and assign request ; Orchestrate supply order ; Fulfill
  access: Page primaire ouverte
  finding: Un Supply Order orchestre plusieurs modes, notamment achat, fabrication et transfert, avec leurs documents d’exécution.
  limit: Plus large que l’apport consigné ; empièterait sur les responsabilités d’orchestration si recopié comme simple type
