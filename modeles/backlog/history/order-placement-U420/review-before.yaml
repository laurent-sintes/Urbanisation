  adopted_definition: Construire, comparer et maintenir les scénarios de satisfaction du carnet d’Orders, en mobilisant les
    décisions spécialisées, puis préparer et autoriser la prise en charge de la part retenue par les processus.
  parent_id: D03
  behavior_id: BHV039
  previous_behavior_parent: D04.o
  decomposition_rationale: 'La complexité du carnet exige de travailler plusieurs hypothèses de satisfaction et leurs impacts
    avant engagement. Order Release rend explicite le passage d’une satisfaction envisagée à une prise en charge autorisée,
    avec conditions individuelles et collectives ; son bénéfice est la maîtrise de cet engagement. Il reste le seul comportement
    directement rattaché à ce stade : aucun comportement ajouté pour chaque opération, ni reprise automatique des comportements
    d’Inventory Planning.'
