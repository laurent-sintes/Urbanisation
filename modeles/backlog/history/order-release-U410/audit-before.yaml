feedback_U293:
  source_refs:
  - U293
  - C94
  - ELM192
  - CMP099
  scope: Corrections de l’audit. Aucun changement du catalogue actif ; nouvelles formulations et décomposition Transit Visibility
    restent proposées.
  points:
  - topic: Execution Tracking
    market_sources:
    - S29
    - S30
    conclusion: La visibilité de la marchandise en mouvement est un résultat à part entière ; la détection d’exception complète
      ce suivi normal.
    proposal: 'Transit Visibility : rendre consultables la localisation connue ou estimée, l’étape du trajet, les quantités
      concernées, la destination et l’arrivée attendue, avec source et fraîcheur. Comportement candidat sous Execution Tracking,
      à discuter ; pas de renommage de toute la capacité.'
    boundary: Execution Tracking suit aussi les prestations non physiques. Inventory Visibility conserve les quantités et
      états de stock, y compris en transit selon le périmètre ; les deux vues partagent les faits sans ajouter deux fois la
      même ressource. Disponible à consulter à tout moment ne signifie pas mesure GPS permanente.
  - topic: Order Lifecycle Management
    market_sources:
    - S31
    conclusion: Gérer les états métier de l’Order et appliquer leurs transitions autorisées, avec conditions, portée et effets
      sur le reste à satisfaire.
    proposal: 'Exemple : 100 pièces, 60 expédiées, demande d’annulation des 40 restantes. Lifecycle enregistre le devenir
      autorisé du reliquat ; le processus traite les activités affectées ; l’orchestration coordonne les prestations nécessaires.'
    boundary: Coordinated Order Release P11 reste à clarifier, pas recommandé en l’état. Une condition de libération ne suffit
      pas à justifier un comportement distinct. La responsabilité des états ne commande pas directement les étapes de préparation
      ou de transport.
  - topic: Excédent
    market_sources:
    - S12
    conclusion: Employer excédent dans les propositions courantes, selon la préférence U293.
    proposal: 'Définition proposée : quantité de ressource dépassant le besoin ou la cible retenue pour un périmètre et un
      horizon donnés, après prise en compte des engagements pertinents.'
    boundary: Un excédent local peut être utile ailleurs ou plus tard ; il ne présume ni anomalie globale ni destruction.
      Les citations et archives restent intactes. Entrée de glossaire non créée dans cette discussion.
  - topic: Adaptabilité des processus / Case Management
    market_sources:
    - S17
    - S32
    - S33
    conclusion: Retirer P05 Execution Compensation comme comportement métier Supply autonome. Dans le cas discuté, l’Order
      est le case ; changement d’état et de contenu peuvent nécessiter d’adapter son traitement.
    proposal: L’adaptation du processus peut interrompre les travaux devenus inutiles, compenser les effets déjà produits
      lorsque nécessaire, puis poursuivre ou reprendre les parties affectées conformément à l’état actualisé de l’Order.
    boundary: Compensation est un mécanisme de réalisation de l’adaptabilité ; elle existe aussi en BPMN. D06.f conserve le
      choix métier de la variation et D06.d la coordination des prestations. Aucun transfert global de l’orchestration vers
      Business Services ; aucune assimilation universelle Order/Case ni effacement d’un fait physique.
  current_summary: P05 retiré ; P11 à clarifier ; P10 conservé comme complément, Transit Visibility proposé séparément dans
    ce feedback. Neuf candidats ciblés initiaux restent proposés, cinq options conditionnelles ; Transit Visibility n’est
    pas encore ajouté comme fiche P ni comme BHV.
feedback_U294:
  source_refs:
  - U294
  - C95
  - ELM193
  - CMP100
  rule: Reprendre le terme établi du marché lorsque notion et périmètre correspondent ; toute déviation doit être justifiée
    par une innovation explicitée. Distinguer nom de produit, catégorie de marché et notion métier.
  evidence: 'SAP : produit Global Track and Trace et notion Logistics Visibility ; Oracle : Track and Trace dans Order/Shipment
    Visibility ; project44/FourKites : Transportation Visibility. Les sources ne démontrent pas de nom unique Global Track.'
  recommendation: Remplacer la proposition de nom Transit Visibility par Track and Trace, terme partagé SAP/Oracle. Il s’agit
    d’une proposition corrigée, pas d’un renommage adopté du catalogue.
  proposed_definition: Suivre la localisation et la progression des marchandises et expéditions, restituer leur parcours et
    les événements associés, et rendre visibles les arrivées estimées et écarts utiles aux Orders concernés.
  scope: 'Périmètre logistique : localisation connue ou estimée, jalons datés, parcours, ETA et écarts. La continuité GPS
    n’est pas présumée. Execution Tracking conserve aussi les prestations sans mouvement physique.'
  modeling_limit: Rattachement sous Execution Tracking toujours proposé. Les exceptions logistiques appartiennent au périmètre
    Track and Trace ; ne pas en créer une copie sous un second comportement sans bénéfice distinct. Le découpage doit être
    réexaminé avant adoption.
  market_sources:
  - S29
  - S34
  - S35
  - S36
  access_limit: Recherche GS1 EPCIS identifiée mais ouverture refusée (403) ; non utilisée pour prétendre à une appellation
    normative universelle.
feedback_U295:
  source_refs:
  - U295
  - CMP101
  market_sources:
  - S29
  - S35
  - S36
  verified: 'D01.c conserve Inventory Visibility : stocks physiques, états logiques et ressources futures, avec provenance,
    fraîcheur et absence de double compte.'
  conclusion: Transportation Visibility est cohérent avec le vocabulaire établi et offre un parallèle lisible avec Inventory
    Visibility. La proposition Track and Trace de U294 n’est pas exclusive ni adoptée.
  recommendation: Pour le besoin précis de suivi des marchandises en mouvement, préférer Transportation Visibility. Logistics
    Visibility est une option de portée plus large si le périmètre inclut les étapes logistiques autour du transport ; ce
    repère FLOW ne prétend pas normaliser des usages éditeurs qui se recouvrent.
  scope: Localisation et progression des marchandises pendant leur acheminement, jalons, arrivées estimées et écarts, reliés
    aux Orders concernés. Le choix du nom ne décide pas à lui seul du niveau capacité/comportement.
  boundary: D07.d Execution Tracking couvre aussi des prestations non physiques. Aucun renommage global ni nouvelle capacité
    ou comportement créé. Les vues stock et transport peuvent partager les mêmes ressources et événements sans les compter
    deux fois.
feedback_U296:
  source_refs:
  - U296
  - ELM194
  - CMP102
  market_sources:
  - S29
  - S37
  - S38
  - S39
  - S40
  requested_scope: Suivi physique continu depuis le prélèvement dans l’espace de stockage, à travers picking, préparation,
    conditionnement, chargement, transport, étapes de dépôt et remise au point final.
  recommendation: Logistics Visibility est le nom recommandé pour le périmètre physique précisé. Transportation Visibility
    suggère un périmètre plus restreint ; Fulfillment Visibility est établi mais peut inclure l’ensemble de la satisfaction
    d’un Order et ses apports. Aucun terme n’est déclaré universellement normalisé.
  proposed_definition: Rendre visible et traçable la progression physique des marchandises depuis leur prélèvement dans un
    espace de stockage jusqu’à leur remise au point de destination, à travers les opérations de préparation, de manutention,
    de transport et les étapes intermédiaires ; restituer localisation, quantités, état d’avancement, événements, échéances
    estimées et écarts.
  comparison: CSCMP inclut entreposage et manutention dans la logistique. SAP prévoit des événements Picking/Packing/Load_Begin
    pour GTT. Manhattan utilise Fulfillment Visibility pour magasin/entrepôt ; Oracle l’utilise aussi pour les achats et fabrications
    alimentant une commande. Les termes seuls ne prouvent donc pas une couverture homogène.
  boundaries: 'FLOW reçoit et relie les événements des exécutants sans reprendre leur exécution interne. Le stock en préparation
    ou en transit reste décrit selon ses états dans Inventory Visibility : le début du tracking ne supprime pas le stock.
    Les vues répondent à des questions complémentaires.'
  verification: 'Éprouver la continuité sur un cas : 100 pièces prélevées, 60 préparées, 40 en attente ; colis séparés puis
    regroupés ; départ, passage par un dépôt, livraison partielle puis solde. Conserver les liens marchandises/colis/contenants/expéditions/Orders
    selon la granularité utile, les dates et la fraîcheur ; pas une géolocalisation permanente présumée.'
  decision_scope: Périmètre demandé U296 ; libellé, définition et rattachement proposés. Aucun catalogue renommé, aucun nouveau
    BHV et aucune release. Ne pas réduire Execution Tracking aux prestations physiques ni créer des comportements par étape
    de picking/packing/transport.
feedback_U297:
  source_refs:
  - U296
  - U297
  - CMP102
  name: Logistics Visibility
  state: adopted_name
  validated_fields:
  - name
  value_sha256:
    name: d73403d9c7bd0e39c09752393ead5005b1bf91b2a741d6710106af1c8f29c916
  recorded_at: '2026-09-17T19:17:14.307567+00:00'
  scope: 'Nom adopté pour le parcours physique demandé U296 : du prélèvement/picking au point final, via préparation, manutention,
    chargement, transport et étapes intermédiaires.'
  proposed_definition: Rendre visible et traçable la progression physique des marchandises depuis leur prélèvement dans un
    espace de stockage jusqu’à leur remise au point de destination, à travers les opérations de préparation, de manutention,
    de transport et les étapes intermédiaires ; restituer localisation, quantités, état d’avancement, événements, échéances
    estimées et écarts.
  validation_boundary: U297 valide explicitement le nom. La définition éditoriale détaillée, le niveau capacité/comportement
    et le rattachement restent proposés ; pas de renommage de D07.d ni de suppression du suivi des services non physiques.
  distinction: Inventory Visibility D01.c conserve la connaissance des quantités et états ; Logistics Visibility décrit leur
    progression dans les opérations physiques, sans double compte ni transfert des opérations internes des exécutants.
  catalog_changed: false
  publication_changed: false
current_synthesis_U298:
  source_refs:
  - U298
  - U293
  - U296
  - U297
  - CMP102
  - U299
  - U402
  conclusion: Conserver le socle et mettre à jour les conclusions ; pas de nouvelle étude générale nécessaire à ce stade.
    Reprendre les sources de façon ciblée si un périmètre change ou avant l’adoption d’une proposition.
  unchanged_basis: 'Socle historique et intégrations successives conservés. Catalogue courant U334 : 40 capacités et 22 comportements.'
  retained_candidate_ids:
  - P01
  - P02
  - P03
  retained_scope: P01–P03 restent à réexaminer selon U324 ; P06/P07, P13 et P08/P09 intégrés respectivement U318, U332 et
    U334. Les autres propositions conservent leurs réserves.
  conditional_candidate_ids:
  - P12
  reassess_candidate_ids:
  - P04
  - P10
  - P11
  withdrawn_candidate_ids:
  - P05
  adopted_name:
    name: Logistics Visibility
    source_ref: U297
    validated_fields:
    - name
    scope: Parcours physique demandé U296, du picking au point final.
    open: U305 tranche les trois comportements directs ; U308 adopte Warehouse Visibility, Transportation Visibility et le
      nom simplifié Store Visibility à périmètre constant. Logistics Visibility reste englobant.
  targeted_revisions:
  - subject: Logistics Visibility
    result: Nom adopté ; intégrer le parcours physique complet et les liens de continuité, plutôt que l’ancien périmètre limité
      au transit. Ne pas supprimer les prestations non physiques du parent.
  - subject: P10 Execution Exception Detection
    result: Les exceptions logistiques font partie du périmètre de Logistics Visibility. Un comportement distinct ne doit
      pas les dupliquer et doit justifier un bénéfice supplémentaire, notamment si sa portée concerne d’autres prestations.
      Correction validée U299 ; proposition initiale à réexaminer selon cette règle.
  - subject: P04 Dependency-driven Execution
    result: La coordination par dépendances ne constitue pas à elle seule un comportement métier distinct d’Execution Orchestration.
      Une décomposition exige un mécanisme ou bénéfice métier distinct du fonctionnement normal du parent et des mécanismes
      génériques de processus. Correction validée U299 ; proposition initiale à réexaminer selon cette règle.
  - subject: P05 Execution Compensation
    result: Retiré comme comportement métier Supply autonome ; mécanisme de réalisation de l’adaptabilité du processus dans
      le cas discuté U293.
