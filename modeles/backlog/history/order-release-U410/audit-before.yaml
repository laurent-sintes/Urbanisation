  status: proposal_reassessment
  recommendation: 'U324/C98 : distinguer détermination des objectifs et seuils (Coverage Target Decision), gouvernance et
    application de leurs versions opérationnelles (Supply Protection), puis décision des quantités et dates d’apport (Replenishment
    Decision). Les min/max peuvent dépendre des besoins et varier par période ; la politique Min/Max utilise aussi une position
    de stock projetée. Requirement/Period et Min/Max restent des méthodes différentes, pas une chaîne où la première calcule
    les paramètres de la seconde. La création de deux comportements recommandée U323 est suspendue faute de bénéfice supplémentaire
    établi ; conserver les modalités dans les descriptions. Aucun comportement créé ni retiré.'
