feedback_U323:
  source_refs:
  - U323
  - CMP110
  status: proposed
  recommendation: 'Proposition U323 : distinguer Requirement-based Replenishment (besoins datés, éventuellement regroupés)
    et Target-based Replenishment (seuil et restauration d’une cible). Les noms sont des formulations FLOW appuyées sur les
    méthodes Microsoft, pas une nomenclature universelle. Les besoins restent liés à un objectif de stock ; aucune satisfaction
    d’Order transférée depuis D03. Réduire, augmenter ou décaler les apports prévus reste à ce stade une faculté des deux
    politiques, sans comportement autonome Supply Adjustment justifié. Proposition à valider ; aucun BHV créé.'
  proposed_names:
  - Requirement-based Replenishment
  - Target-based Replenishment
  adjustment: Conserver dans les descriptions des deux politiques, sans comportement autonome à ce stade ; D04 applique les
    changements autorisés.
  catalog_structure_changed: false
  superseded_by: 'U324/C98 : suspendre la recommandation de créer deux comportements ; clarifier paramètres et apports avant
    décomposition.'
