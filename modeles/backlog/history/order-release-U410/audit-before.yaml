feedback_U310:
  status: user_vocabulary_recorded_decomposition_proposed
  source_refs:
  - U310
  - CMP106
  market_sources:
  - S08
  - S51
  - S52
  glossary_ids:
  - TER079
  - TER080
  conclusion: Retenir implantation initiale et réassort continu comme politiques métier à examiner pour la décomposition de
    Replenishment Decision. Ne pas les identifier aux méthodes besoins nets / seuils-cibles.
  reason: Implantation prépare la disponibilité au lancement ; réassort entretient la disponibilité pendant la commercialisation.
    Les deux peuvent mobiliser besoins, cibles et calcul net. Un seuil déclaré ne suffit pas à conclure au Min/Max Microsoft.
  current_context: 'Deux saisons été/hiver selon Laurent. Découpages plus fins et capsules : possibilité future. Pas de règle
    de modèle limitant à deux saisons et pas de nouveau domaine de planification de saison.'
  market: SAP Initial Allocation et In-Season Fill-In ; RELEX initial allocation et in-season replenishment. Il s’agit de
    scénarios ou fonctions éditeurs, pas d’une hiérarchie métier native. Allocation retail est conservé comme terme éditeur
    qualifié.
  boundary: D05 décide des quantités/dates des apports ; D04 gère les Orders ; D06 et les exécutants organisent/réalisent
    les prestations. Les choix de collection et d’assortiment restent des entrées, sans élargissement implicite au domaine
    de planification de saison. La distribution contrainte entre demandes peut mobiliser Supply Assignment sans rendre l’implantation
    synonyme d’affectation.
  audit_impact: P01/P02 ne se traduisent pas un à un par Implantation/Réassort. Réexaminer leur découpage ; conserver les
    mécanismes de calcul utiles dans les descriptions. P03 reste une question transverse aux deux politiques. Les libellés
    anglais et la décomposition complète ne sont pas adoptés.
  catalog_changed: false
  superseded_by: 'U313 : deux décisions distinctes demandées ; proposition de comportements sous un parent unique retirée.'
