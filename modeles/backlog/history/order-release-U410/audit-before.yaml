granularity_review_U375:
  status: editorial_reclassification_proposed
  source_refs:
  - U375
  scope: A01/A05/A06 correspondent aux trois premiers points présentés, pas A01/A02/A03.
  principle: Séparer responsabilité métier, mécanisme justifié et règles détaillées. La précision d’une règle ne bloque pas
    la cartographie si responsabilité, résultat et frontière sont intelligibles.
  items:
  - arbitration_id: A01
    catalogue_question: Affecter une ressource et garantir son usage réservé sont-ils correctement distingués ?
    rule_examples:
    - Déclenchement
    - Durée
    - Conditions de libération et de dérogation
    position: Conserver les responsabilités déjà modélisées ; ne pas rouvrir toute leur définition pour fixer chaque règle.
  - arbitration_id: A05
    catalogue_question: Possibilités dans une référence et faisabilité sous adaptation sont-elles distinguées ?
    rule_examples:
    - Sites admissibles
    - Substitutions autorisées
    - Contraintes de date et de coût
    position: Les listes de cas et paramètres relèvent des règles ; un mécanisme d’alternative ne devient comportement que
      si sa valeur descriptive est démontrée.
  - arbitration_id: A06
    catalogue_question: Enregistrer un engagement reçu et réexaminer les conséquences sur les promesses ont-ils des responsables
      identifiables ?
    rule_examples:
    - Tolérances de quantité/date
    - Acceptation automatique
    - Déclenchement des réexamens
    position: Mobiliser la gestion des commandes d’achat et les décisions existantes ; une responsabilité réellement orpheline
      reste à démontrer avant création.
  preserved:
  - Reservation Policy Decision et autres décisions fines adoptées
  - Critères Mécanisme/Politique/Variante/Bénéfice pour les comportements
  - Absence d’adoption automatique de toute reclassification par une question
  market_evidence:
  - vendor: Microsoft
    title: Reserve inventory quantities
    url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/inventory/reserve-inventory-quantities
    edition: Documentation évolutive
    locator: Reservation policy
    consulted_on: '2026-09-18'
    nature: Politiques produit
    fact: Réservation manuelle ou automatique paramétrable.
    limit: Passage primaire indexé ; ne détermine pas la taxonomie de capacités FLOW.
  - vendor: SAP
    title: Outlining Alternative-based Confirmation
    url: https://learning.sap.com/courses/exploring-aatp-in-sap-s-4hana/outlining-alternative-based-confirmation
    edition: Cours évolutif décrivant plusieurs versions aATP
    locator: Configure Substitution Strategy ; Configure Alternative Control ; building rules
    consulted_on: '2026-09-18'
    nature: Mécanisme produit et règles de sélection
    fact: Recherche d’alternatives encadrée par des stratégies, caractéristiques et règles configurables.
    limit: Page primaire consultée ; ni équivalence ABC/CTP ni une capacité par règle.
  - vendor: Microsoft
    title: Review and accept changes to confirmed purchase orders
    url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/procurement/purchase-order-changes-after-confirmation
    edition: Documentation évolutive
    locator: Revue des changements fournisseur et nouvelle confirmation
