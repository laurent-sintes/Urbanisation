  - D04.n
  recommendation: Distinguer scission/composition de la demande et organisation des fractions ou ensembles à satisfaire. Découper
    la satisfaction ne crée pas automatiquement de nouveaux Orders ; ne pas déplacer toute la composition commerciale en D03.
  status: placement_proposed
  open_point: Déterminer quels résultats sont des mutations d’Orders et lesquels sont portés par le plan ; préserver parent
    unique et pas de copie par contexte.
- ids:
  - BHV036
  - BHV037
  - BHV040
  - BHV041
  - BHV042
  recommendation: 'Réexaminer la portée réelle avant déplacement : engagement de l’Order, protection contre optimisation,
    suspension, modification de date demandée ou planifiée, retrait de demande ou de son lancement sont distincts. L’usage
    collectif ne suffit pas à changer le propriétaire métier.'
  status: editorial_review
  open_point: Pas de transfert en bloc. Montrer les effets sur demande et plan à partir des définitions existantes.
