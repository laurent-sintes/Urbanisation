- id: D05
  revision: 2
  kind: domain
  layer: transactional
  fields:
    name: Inventory Optimization
    definition: 'Déterminer le stock souhaitable et les ajustements nécessaires de ses niveaux et de sa répartition : fixer
      les objectifs de couverture, établir les manques ou excédents nets et décider des redistributions utiles, en tenant
      compte du stock connu et des ressources attendues.'
    finality: Décider du stock souhaitable et des ajustements nécessaires.
    scope: |-
      Le stock à obtenir et à maintenir guide le domaine. Les objectifs et ajustements portent sur les périmètres et horizons opérationnels considérés ; leur détail reste à préciser. Les besoins peuvent prendre en compte des prévisions ou des Orders connus : la frontière avec D03 dépend de la finalité, pas de l’absence de commandes ni d’un partage global/individuel. La planification de saison demeure hors de ce périmètre.

      Exemple fictif : déplacer 50 pièces pour corriger un surstock sur un site et un manque sur un autre. Le résultat recherché est une répartition de stock adaptée. [Order Promising](model:D03) peut envisager la même opération pour satisfaire une commande précise, avec une autre question de décision. D05.c est conservée ; partager des données ou des moyens de calcul ne suffit pas à la déclarer redondante avec le CTP.

      [Inventory Management](model:D01) connaît et fiabilise le stock, enregistre ses mouvements, protège et réserve ; D05 détermine ce que le stock devrait devenir. Un objectif ou une redistribution décidée ne modifie pas à lui seul la position de stock et ne constitue pas une promesse. Le dossier Demande de réassort relève du modèle processus. Les Orders éventuellement mobilisés sont gérés dans D04 ; leurs possibilités de satisfaction et promesses dans D03 ; les prestations et mouvements physiques relèvent de D07 et des exécutants. Aucun type d’Order, cycle obligatoire ou transfert de responsabilité logistique à FLOW n’est déduit.

      Piste U221 — réapprovisionnement automatique : déterminer le complément de stock puis déclencher une demande de [réapprovisionnement](glossary:TER074) selon des règles et autorisations définies. Exemple fictif : cible de 100 pièces, 30 disponibles et 20 déjà attendues ; envisager un complément de 50, sous réserve des règles de calcul. Une nouvelle évaluation tient compte de ce qui a déjà été demandé ou commandé pour éviter de déclencher plusieurs fois le même complément.

      Les règles peuvent conduire à une demande de réassort ou à des Orders, selon les autorités et parcours à définir. D04 gère les Orders correspondants ; D03 cherche à les satisfaire ; les exécutants réalisent les mouvements, dont D01 restitue les effets. Automatique qualifie le déclenchement selon les règles : cela ne vaut ni confirmation automatique d’une promesse, ni affermissement systématique, ni capacité autonome déjà adoptée. La granularité de cette aptitude et ses conditions restent à instruire.
