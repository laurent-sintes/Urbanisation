- id: D04.l
  revision: 1
  kind: capability
  layer: transactional
  fields:
    name: Customer Return Management
    definition: 'Gérer les commandes de retour provenant des clients : représenter les biens et quantités attendus en retour,
      leur origine et leur destination, intégrer les évolutions autorisées et rapprocher les réceptions effectives.'
    finality: Connaître le retour client attendu, son avancement et la part qui reste à traiter.
    nature: action
    scope: |-
      Type de commande : [Customer Return Order](glossary:TER072).

      Enregistrer l’origine et le contenu applicable, intégrer les modifications autorisées avec leur historique, rendre la situation consultable et rapprocher les réalisations pour déterminer le reste à satisfaire. Les transformations de structure mobilisent [Order Structuring](model:D04.n) ; les autorisations et restrictions de progression mobilisent [Order Lifecycle Management](model:D04.o). Ces capacités transversales sont des responsabilités complémentaires, pas des sous-capacités répétées sous chaque type.

      Exemple fictif : un retour porte sur 10 pièces d’une vente antérieure ; 6 sont reçues et 4 restent attendues, sous réserve des règles de rapprochement. Le motif, le lien à la vente et les autorisations disponibles permettent d’expliquer le dossier. La commande de retour porte son propre traitement : elle n’annule pas rétroactivement la vente. Autorisation commerciale de reprise, remboursement, remplacement et décision sur le sort des biens restent à délimiter ; réception physique et contrôle par l’exécutant ne sont pas réalisés par cette capacité.

      Les conditions contractuelles restent des références ; cette capacité ne confère pas l’autorité de négocier ou de modifier un Agreement. Priorités, couverture et promesses restent dans Order Promising ; prestations, engagements et faits d’exécution dans D07 et le contexte Services. Les règles d’imputation, tolérances, autorisations et effets sur les réservations sont à instruire. Les exemples sont fictifs et ne prouvent aucun déploiement.
