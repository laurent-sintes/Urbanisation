alternatives:
- id: D03-BACKLOG-DOMAIN-U158
  kind: alternative_labels
  target_id: D03
  state: proposed
  source_refs:
  - U157
  - U158
  field_overrides:
  - target_id: D03
    field: name
    value: Backlog Management
  - target_id: D03
    field: definition
    value: Arbitrer la réalisation d’un carnet de commandes en tenant compte de leurs priorités, des ressources, des contraintes
      et des engagements ; établir et faire évoluer leur couverture et leurs promesses.
  - target_id: D03
    field: finality
    value: Établir un ensemble cohérent de commandes réalisables et d’engagements soutenables, puis l’adapter lorsque la situation
      évolue.
  note: 'Nom de domaine proposé par Laurent U158 ; définition/finalité proposées par Codex. D03.arbitrage du carnet versus
    D04.contenu et cycle de vie des Orders : frontière à éprouver, aucune fusion décidée. Supply Assignment et simulation
    à revoir par résultats ; les capacités U154 restent actives. Aucun rang natif Oracle de domaine métier n’est affirmé.'
principles:
- id: PRINCIPLE-REFERENCE-PROJECTIONS
  statement: Les référentiels de la Supply sont des projections de sources de vérité maîtrisées par des produits tiers. Chaque
    référentiel comporte au moins une ingestion ; visibilité et recherche sont en lecture seule. L’ingestion actualise la
    projection sans transférer la maîtrise ; administration et validation métier des données maîtresses restent externes.
    Cette règle ne préjuge pas de l’autorité sur les commandes ni des états transactionnels propres à la Supply.
  source_refs:
  - U134
  - C75
- id: PRINCIPLE-TWO-LAYERS
  statement: Socle transactionnel et modèle processus distincts ; chacun possède ses objets, sa persistance et son urbanisation.
  source_refs:
  - U18
  - U19
  - U20
  - U49
  - U50
  - U62
- id: PRINCIPLE-CAPABILITY
  statement: Une capacité décrit ce que sait faire l’entreprise indépendamment de son organisation et de ses outils.
  source_refs:
  - U33
- id: PRINCIPLE-SUPPLY-DOCUMENTS
  statement: Supply générique orientée documents d’autorisation ; les parcours commerciaux appartiennent au modèle processus.
  source_refs:
  - U100
- id: PRINCIPLE-FLOW-LOGISTICS
  statement: Logistique hors développement FLOW, en adhérence ; autonomie C-Log conservée.
  source_refs:
  - U58
- id: PRINCIPLE-ORDER-AGREEMENT
  statement: Commandes distinctes des Agreements de référence.
  source_refs:
  - U98
- id: PRINCIPLE-CASE-SUPPLY-ORDERS
  statement: Business Services porte le traitement des demandes et problèmes des parties prenantes ; le Case en est un dossier
    de traitement. Supply pilote ses Orders, pour toutes natures de commandes, clients et volumes. Les Service Orders portent
    les prestations confiées au contexte Services exécutant. Les modèles gardent leurs définitions propres et des contrats
    explicites, sans cardinalité ni cycle universel imposé.
  source_refs:
  - U169
  - U173
  - U202
- id: PRINCIPLE-TO-PROMISE
  statement: 'D03 distingue ATP, CTP et PTP : établir une promesse dans les ressources et engagements admissibles, proposer
    un plan d’adaptation, puis comparer les conséquences économiques des scénarios. Le CTP local est plus large que les acceptions
    éditeur consultées.'
  source_refs:
  - U154
  - U156
  - U202
limitations:
- Les propositions et illustrations ne sont pas validées par leur extraction.
- Le modèle processus détaillé reste à construire.
- Les synthèses de domaines importées de la présentation sont identifiées comme éditoriales.
- D01.a/D01.b et leurs relations de rattachement sont historiques, remplacés dans le backlog par D01.e selon U116 ; états
  antérieurs dans modeles/revisions/2026-09-13.1/backlog.json et modeles/release/2026-09-13.2/model.json. Ne pas réutiliser
  ces identifiants.
- U125 scinde à son tour D01.e en D01.f (état du stock) et D01.g (mouvements). D01.e reste historique dans la publication
  v001. Le nom Record Inventory Movements de D01.g est adopté en U129 ; définition et finalité restent proposées. Aucun choix
  technique Event Sourcing adopté.
- U141 retire D04.a–d, conservés dans modeles/backlog/history/pre-U141.json ; D04.e–h nouveaux identifiants. Les quatre noms
  et descriptions courtes sont approuvés, les détails ajoutés restent proposés. Q077 ouverte ; aucune publication implicite.
- 'U145 retire D02, D02.a et D02.d du backlog sans renumérotation. État antérieur : modeles/backlog/history/pre-U145.json
  ; ne pas réutiliser les identifiants retirés. D02.b/D02.c restent en D01, D02.e en D03. Reprise conceptuelle et précisions
  encore à instruire : audits/2026-09-14-d02-couverture.md. Aucun changement des définitions consommatrices ni des releases.'
- 'U147 rouvre le placement ATP/CTP précédemment différé en U95. Ordre des actions : Promise Proposal, Promise Confirmation,
  Promise Revision, Supply Assignment ; ordre de lecture, pas processus. Propositions de vocabulaire et de décisions dans
  modeles/backlog/d03-review.json ; définitions validées conservées en attente d’arbitrage.'
- 'U154 adopte D03-ALIGNMENT-U151 : D03.d–h retirées, D03.i–l nouvelles. Snapshot antérieur modeles/backlog/history/pre-U154.json
  ; aucun identifiant réutilisé. Les quatre actions restent inchangées. Les anciennes indications neuf capacités et proposition
  U151 sont historiques. Vocabulaire Case/Demand/Command/Order à instruire ; aucune release implicite.'
- U214 retire D04.e–h et leurs cinq relations incidentes, conservés dans history/pre-U214.yaml. D04.i–o sont de nouvelles
  capacités, sans réutilisation des anciens identifiants ni transfert de validation. Noms et rattachements adoptés ; descriptions
  détaillées U215 et liens aux faits d’exécution proposés. Correspondances dans d04-refactoring.yaml. Aucune publication implicite.
- U219 précise D01/D03/D05 et les trois capacités D05 sans changement d’identité ni de rattachement. Nom Inventory Optimization
  retenu U220 ; Coverage Target Decision et Stock Redistribution Decision restent proposés. Ancienne alternative P86-D05 conservée
  dans stock-order-boundary.yaml. Finalités des domaines adoptées ; descriptions et règles détaillées proposées. Réapprovisionnement
  automatique envisagé U221 dans D05, sans capacité supplémentaire instanciée. Aucune publication implicite.
