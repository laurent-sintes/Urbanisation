- id: D05.c
  revision: 2
  kind: capability
  layer: transactional
  fields:
    name: Stock Redistribution Decision
    definition: Décider des quantités de stock à redistribuer et des destinations à privilégier pour corriger des déséquilibres
      de répartition, selon les objectifs de stock et les contraintes applicables.
    finality: Obtenir une répartition du stock mieux adaptée aux besoins des périmètres concernés.
    nature: decision
    scope: |-
      Examiner où le stock est excédentaire ou insuffisant, puis retenir un ajustement de quantités et de destinations. Exemple fictif : déplacer 50 pièces d’un site excédentaire vers un site en manque pour rééquilibrer leurs stocks. Les critères, tolérances, autorisations, contraintes d’acheminement et effets sur les engagements restent à instruire.

      La finalité de rééquilibrage justifie cette responsabilité même si [Order Promising](model:D03) envisage aussi des transferts. Le CTP cherche une solution pour satisfaire les Orders ; cette capacité cherche une meilleure répartition du stock. Supply Assignment affecte ou réaffecte des ressources à des besoins ou engagements : cette affectation n’est pas, à elle seule, une redistribution physique.

      Une décision de redistribution peut nécessiter des Orders, dont le type et la responsabilité de création ne sont pas présumés. D04 en gère la structure et la progression ; D03 en examine la satisfaction et les promesses ; D07 et Services portent les prestations et leurs réalisations. Aucun mouvement effectif, arrêt d’exécution, calcul logistique installé ou réalisation FLOW n’est déduit de cette décision.
