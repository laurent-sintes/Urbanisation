diagnosis:
- Backlog désigne le carnet travaillé ; il ne suffit pas à délimiter le problème métier du domaine.
- D03 regroupe possibilités et engagements de promesse, arbitrage de satisfaction, structure et conservation des Orders.
- Les recouvrements de sélection doivent être clarifiés par résultat et autorité ; changer les parents ne suffit pas.
recommendation:
  status: structure_adopted_U438
  option: two_domains
  justification: Distinguer la responsabilité des promesses de celle des choix de satisfaction, pour rendre les revues PO
    et métier plus lisibles.
  domains:
  - proposed_name: Order Promising
    identifier: D15
    responsibility: Établir ce qui peut être promis et sous quelles conditions, puis maintenir les propositions et engagements
      de quantités et de dates.
    capability_ids:
    - D03.i
    - D03.j
    - D03.k
    - D03.l
    - D03.n
  - proposed_name: Fulfillment Optimization
    identifier: D03
    responsibility: Arbitrer la satisfaction des Orders sous contraintes, déterminer un plan cohérent et matérialiser les
      affectations retenues.
    capability_ids:
    - D03.m
    - D03.o
    - D03.p
    - D02.e
  proposed_other_moves:
  - capability_id: D04.n
    current_domain: D03
    proposed_domain: D04
    reason: Structurer les Orders relève de leur tenue ; une optimisation mobilise cette capacité sans posséder toute la structure.
  - capability_id: D04.q
    current_domain: D03
    proposed_domain: D04
    reason: La conservation historique ne détermine ni une promesse ni un choix de satisfaction.
  planning_name_candidate: Fulfillment Planning
  planning_name_status: Piste lexicale proposée, pas de renommage automatique ni de terme universel établi par les sources
    retenues
  benefit: Deux responsabilités directrices identifiables, sans supprimer les décisions fines ni créer une capacité par fonction
    éditeur.
  tradeoff: Interfaces dans les deux sens et dépendances fortes ; les choix économiques, temporels et collectifs doivent rester
    compatibles.
alternative:
  option: one_domain
  proposed_name: Fulfillment Optimization
  capability_ids:
  - D03.i
  - D03.j
  - D03.k
  - D03.l
  - D03.n
  - D03.m
  - D03.o
  - D03.p
  - D02.e
  same_proposed_moves_to_D04:
  - D04.n
  - D04.q
  benefit: Un seul domaine autour de la satisfaction des Orders ; moins de frontières de domaine.
  tradeoff: La tenue des engagements reste sous une bannière Optimization ; les deux responsabilités sont moins visibles.
boundaries_to_arbitrate:
- elements:
  - D03.i
  - D03.j
  - D03.l
  proposal: ATP/CTP établissent des possibilités réalisables ; Delivery Schedule Decision choisit un échéancier compatible
    avec les arbitrages applicables.
  risk: Ne pas attribuer le même choix définitif de quantités et de dates à trois décisions.
- elements:
  - D03.k
  - D03.o
  proposal: PTP porte le choix économique contextualisé ; Fulfillment Plan Decision compose le compromis final de satisfaction
    multidimensionnelle.
  risk: Une préférence économique ne doit pas devenir un veto implicite ni un second plan final indépendant ; règles de compatibilité
    à préciser.
- elements:
  - D03.p
  - D03.o
  proposal: Planning organise hypothèses, simulations, comparaison et maintien des scénarios en mobilisant les décisions ;
    Fulfillment Plan Decision détermine la cohérence des choix d’affectation.
  risk: Ne pas créer deux optimiseurs ou réduire Planning à un calcul.
- elements:
  - D03.o
  - D03.n
  proposal: Le plan ressources-commandes soutient une proposition de promesse ; confirmer ou réviser l’engagement reste à
    Promise Management.
  risk: Une possibilité ou un plan retenu ne vaut pas engagement confirmé ; leur actualité doit être vérifiable.
invariants:
- 'La scission ne repose pas sur individuel/collectif : ATP couvre plusieurs demandes ; une optimisation peut en traiter une
  seule.'
- Seule Reservation bloque les usages concurrents, conformément à U436 ; priorité, plan, affectation et promesse restent distincts.
- D04 conserve les Orders et leur autorisation de prise en charge ; D06 conserve la coordination des services ; D05 optimise
  le stock.
- Les correspondances SAP/Microsoft sont des appuis partiels, pas une taxonomie d’entreprise adoptée.
- Aucune fusion ni suppression de capacité ou de comportement proposée dans ce premier choix de domaines.
review_scenarios:
- case: Deux commandes de 60 pour 80 disponibles, avec une réservation existante.
  check: Établir les possibilités, arbitrer les priorités et le plan, appliquer les affectations, puis gérer les engagements
    autorisés sans lever la réservation par priorité seule.
- case: Un fournisseur retarde 40 pièces soutenant plusieurs commandes.
  check: Examiner les alternatives et leurs conséquences, recomposer le plan retenu et traiter les révisions de promesse autorisées
    ; aucune modification automatique des engagements.
- case: Une demande de 100 satisfaite par 60 vendredi et 40 lundi.
  check: Distinguer possibilités, échéancier retenu, promesse, liens d’affectation et éventuel découpage des Orders ; deux
    échéances ne créent pas automatiquement deux commandes.
