    - vendor: Microsoft
      element_name: Firming planned orders
      relationship: Recouvrement partiel
      similarity: Transformation des propositions retenues en Orders et suivi de cette transformation.
      difference: Mécanisme plus étroit que toute l’application du Master Plan ; aucune équivalence avec changements de politiques
        ou réalisation physique.
      flow_position: Confirme la frontière entre proposition et prise en charge ; le regroupement de toutes les familles reste
        une proposition FLOW.
      source_ref: ELM588
      source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/master-planning/maintain-planned-orders
