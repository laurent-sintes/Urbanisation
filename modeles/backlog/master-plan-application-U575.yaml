effect_families:
- result: Liens ressources-besoins
  examples:
  - Affectation initiale aux commandes ou prévisions identifiées
  - Complément, libération et réaffectation admissibles
  continuity: D02.e est repris comme contenu de l’application ; la couverture des prévisions U562/U565 est conservée.
- result: Structure et engagements de satisfaction
  examples:
  - Fractionnement
  - Dates et quantités confirmées ou révisées
  responsible_ids:
  - D04.n
  - BHV044
  - D03.n
- result: Demandes d’approvisionnement et Orders
  examples:
  - Création
  - Avancement, report, variation de quantité ou annulation autorisée
  responsible_ids:
  - D04.j
  - D04.k
  - D04.o
- result: Politiques applicables
  examples:
  - Objectifs/minima de stock retenus
  - Protections de groupes retenues
  responsible_ids:
  - D02.b
  limit: Le plan propose et fait appliquer les changements autorisés ; administration des politiques extérieure. Calcul optimal
    conjoint des quotas toujours non démontré.
clarifications:
- Supply Assignment était un cas d’application limité aux liens de ressources ; Master Plan Application reprend cette responsabilité
  dans un ensemble plus large. Ce n’est pas un simple synonyme.
- Les décisions définissant le contenu restent distinctes ; leur regroupement de principe U572 n’est pas remis en cause.
- Les onze catégories U574 restent documentées comme exemples et couverture fonctionnelle, sans onze capacités ni sous-comportements.
- Planning Management conserve ici le pilotage du travail de planification ; son nouveau nom ne lui attribue pas implicitement
  tous les autres comportements.
- La simulation peut conclure sans application ; un arrêt de calcul ne défait pas les effets déjà engagés.
