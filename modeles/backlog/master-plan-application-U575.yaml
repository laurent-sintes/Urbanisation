proposed_capability:
  proposal_key: master-plan-management
  name: Master Plan Management
  kind: capability
  nature: planning
  parent: proposal:Master Planning
  definition: Construire et maintenir un plan Supply de référence pour satisfaire les demandes, arbitrer les ressources et
    faire appliquer les recommandations retenues en suivant leurs résultats.
  market_refs:
  - ELM584
  - ELM585
  - ELM587
  - ELM588
  source_refs:
  - U570
  - U572
  - U573
  - U574
  - CMP239
  - CMP240
  - U575
  - CMP241
  decomposition_rationale: Six comportements directs distinguent pilotage du calcul, simulation/analyse, autorisation, versions,
    suivi/révision et application. Les catégories d’effets du plan ne sont pas une décomposition en sous-comportements.
  tradeoff: Application regroupée, plus lisible au niveau landscape ; sa description conserve les différents effets, responsables
    et limites afin de ne pas devenir une boîte noire.
  status: proposed
  behaviors:
  - proposal_key: request
    name: Planning Management
    kind: behavior
    parent: proposal:master-plan-management
    definition: Cadrer la demande de planification, choisir le périmètre et les données de référence, lancer ou programmer
      le calcul, suivre son avancement, l’arrêter ou le relancer.
    source_refs:
    - U573
    - U574
    - ELM582
    - ELM585
    - ELM583
    - U575
    market_refs:
    - ELM582
    - ELM585
    - ELM583
    predecessor_ids:
    - D04.s
    decomposition_rationale: Piloter un travail pouvant durer, échouer ou devenir inutile ; lancement et arrêt sont des modalités
      de ce comportement.
    boundary: Choisit les politiques applicables et leurs versions ; ne les administre pas. Une annulation du calcul ne défait
      aucune action déjà appliquée.
    status: proposed
    name_agreement:
      source_ref: U575
      status: explicit_user_instruction
      field: name
      value: Planning Management
      scope: Nom de ce comportement dans la proposition ; pas validation des autres champs ou de la capacité parente.
  - proposal_key: simulation
    name: Simulation & Analysis
    kind: behavior
    parent: proposal:master-plan-management
    definition: Construire des alternatives et comparer leurs conséquences sur service, promesse, économie, stock et risques
      pour le même problème Supply.
    source_refs:
    - U573
    - U574
    - ELM584
    - ELM587
    market_refs:
    - ELM584
    - ELM587
    predecessor_ids:
    - BHV005
    - BHV006
    - BHV091
    decomposition_rationale: Garder ensemble construction des alternatives et lecture de leurs conséquences ; ne pas créer
      une capacité par simulation.
    boundary: Les décisions spécialisées calculent les options ; une simulation ne rend pas ses résultats applicables.
    status: proposed
  - proposal_key: authorization
    name: Plan Authorization
    kind: behavior
    parent: proposal:master-plan-management
    definition: Retenir, refuser ou demander la révision d’un scénario et préciser quelles recommandations sont autorisées
      à être appliquées.
    source_refs:
    - U573
    - U574
    - ELM416
    - ELM566
    - ELM587
    market_refs:
    - ELM416
    - ELM566
    - ELM587
    predecessor_ids:
    - BHV092
    decomposition_rationale: Distinguer résultat calculé, référence retenue et autorisation de ses effets ; autorisation humaine
      ou déléguée.
    boundary: 'Appuis marché partiels : approbation de Planned Orders, promotion de scénario et release ; aucun workflow humain
      universel.'
    status: proposed
  - proposal_key: versions
    name: Plan Version Management
    kind: behavior
    parent: proposal:master-plan-management
    definition: Identifier la référence retenue, les scénarios et révisions qui en dérivent, partager leurs hypothèses et
      conserver ou clôturer leur historique utile.
    source_refs:
    - U573
    - U574
    - ELM584
    - ELM586
    market_refs:
    - ELM584
    - ELM586
    predecessor_ids: []
    decomposition_rationale: Plusieurs variantes peuvent coexister sans plusieurs références contradictoires.
    boundary: Pas une version complète immuable garantie par chaque éditeur ; archivage métier à distinguer du journal technique.
    status: proposed
  - proposal_key: monitoring
    name: Plan Monitoring & Replanning
    kind: behavior
    parent: proposal:master-plan-management
    definition: Comparer le plan retenu aux suites effectivement prises en compte et aux nouvelles conditions, puis préparer
      sa révision face aux écarts et aux impondérables.
    source_refs:
    - U573
    - U574
    - ELM566
    - ELM418
    - ELM583
    market_refs:
    - ELM566
    - ELM418
    - ELM583
    predecessor_ids:
    - BHV016
    decomposition_rationale: Conserver le bénéfice d’adaptation, y compris quand l’application est partielle.
    boundary: Les événements opérationnels et la réalisation physique gardent leurs responsables ; le recalcul mobilise les
      autres comportements sans sous-comportement.
    status: proposed
  - proposal_key: application
    name: Plan Implementation
    kind: behavior
    parent: proposal:master-plan-management
    definition: Faire appliquer les recommandations autorisées du Master Plan retenu, en mobilisant les capacités responsables
      et en établissant les effets effectivement pris en compte ainsi que les écarts.
    source_refs:
    - U537
    - U572
    - U574
    - U575
    - CMP241
    - ELM589
    - ELM363
    - ELM418
    - ELM571
    - ELM574
