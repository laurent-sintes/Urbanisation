naming_review_U576:
  source_ref: U576
  previous_name: Master Plan Application
  proposed_name: Plan Implementation
  french_meaning: Mise en œuvre du plan
  rationale: Désigne le passage des recommandations autorisées aux effets pris en compte, sans répéter Master ni employer
    Application.
  definition: Mettre en œuvre les recommandations autorisées du plan en mobilisant les capacités responsables et en vérifiant
    les effets effectivement pris en compte.
  alternatives:
  - name: Plan Execution
    assessment: Compréhensible, mais peut inclure la réalisation physique des livraisons ou opérations ; moins précis pour
      la frontière retenue.
  - name: Plan Release
    assessment: Établi chez Oracle, mais peut évoquer seulement la transmission des recommandations ; plus étroit que le résultat
      attendu FLOW.
  - name: Plan Activation
    assessment: Peut évoquer une simple mise en service ou un changement de statut ; ne décrit pas suffisamment les effets.
  market_refs:
  - ELM593
  - ELM594
  - ELM566
  market_position: Appui lexical historique Oracle et rapprochement fonctionnel Microsoft ; aucun consensus sur un nom de
    capacité identique revendiqué.
  name_status: adopted_U577
  approved_principle:
    interpretation: contextual
    source_ref: U576
    statement: Regrouper la mise en œuvre du plan en un comportement, en conservant les catégories d’effets et les responsables
      distincts.
    verbatim: C'est top. Sauf "Master Plan Application".
    exclusions:
    - Nom de remplacement
    - Descriptions complètes des annexes
    - Autres noms et nouvelle décision achat
  canonical_recording: Accord de principe en annexe ; aucun champ canonique correspondant à ce comportement consolidé ne peut
    encore être capturé avec record_decision.py. Ne pas enregistrer la définition plus étroite de D02.e comme accord sur le
    plan complet.
  name_agreement_source: U577
naming_note: audits/2026-09-21-master-plan-management-U573/naming-U576.md
