    - ELM371
    - ELM410
    - ELM592
    - ELM593
    - ELM594
    predecessor_ids:
    - D02.e
    - BHV094
    decomposition_rationale: Distinguer le contenu retenu du plan de ses effets effectifs. Les familles d’effets expliquent
      le périmètre sans devenir des sous-comportements ou des plannings autonomes.
    boundary: L’application respecte les autorisations et vérifie que les recommandations restent applicables. Les commandes,
      engagements, réservations et politiques gardent leurs responsables ; une application partielle peut conduire à un réexamen
      du plan. Aucun retour arrière global ni transaction atomique n’est supposé.
    status: name_validated_details_proposed
    market_comparisons:
    - vendor: Oracle
      element_name: Release plan recommendations
      relationship: Recouvrement partiel
      similarity: Un même processus transmet des recommandations de création, replanification et annulation et permet de suivre
        les exceptions.
      difference: Le passage porte sur les Orders ; il ne démontre pas l’application globale de toutes les protections et
        affectations FLOW.
      flow_position: Appui au regroupement par application du plan, avec capacités responsables distinctes.
      source_ref: ELM566
      source_url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/26b/faupc/manually-release-plan-recommendations.html
