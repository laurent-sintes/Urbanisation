state: ai_proposed
requirement: Les libellés, définitions et autres textes référencent explicitement les éléments du glossaire.
observed_state:
  texts: 'Champs name/definition/finality/scope et autres : chaînes dans urbanism.schema.json.'
  glossary: Catalogue courant YAML dans glossary.yaml ; Markdown historique conservé.
proposed_contract:
  glossary: Catalogue YAML identifié, descriptions courtes, définitions, contexte, statuts et sources ; termes et catalogue
    versionnés dans les releases.
  rich_text: Chaînes YAML ordinaires avec [texte](glossary:IDENTIFIANT) ou [texte](model:IDENTIFIANT#definition). Réponses
    API JSON.
  example_only:
    definition: Consulter le [stock](glossary:TER005).
  reference_resolution: 'La cible glossary:IDENTIFIANT vise une notion du glossaire de la même publication. Le texte entre
    crochets est explicite : traduction et pluriel peuvent différer du libellé canonique sans changer la cible. Aucune réécriture
    automatique des phrases après renommage.'
  meaning: Le lien lexical explicite le sens du texte ; ce n’est ni une relation contains du modèle ni la preuve d’un objet
    métier instancié.
  versioning: Figer le glossaire avec le modèle publié. Une ancienne release résout ses liens dans sa propre capture. Détecter
    aussi les définitions de termes modifiées utilisées par des champs inchangés pour instruire l’impact sémantique sur leurs
    validations.
  atlas: Page Glossaire, recherche, infobulle au survol et au focus, navigation par clic/Entrée et liens profonds dans la
    même publication.
  compatibility: Le type string des champs JSON reste inchangé. Adapter les contrôles des liens, la publication du glossaire
    et les rendus Atlas/Markdown, recherche et exports texte. Les textes historiques sans balise restent lisibles ; aucun
    enrichissement depuis le backlog pour une release historique.
  syntax:
    form: '[texte affiché](glossary:IDENTIFIANT)'
    identifier: Identifiant stable existant, notamment TER/VER ; ne pas inventer une référence à partir du mot.
    escaping: Un antislash devant le crochet initial conserve un lien littéral ; dans le libellé, antislash devant crochet,
      parenthèse ou antislash. Pas de HTML interprété.
    scope: Syntaxe de lien ciblée, sans imposer tout Markdown ni autoriser du HTML dans les champs.
proposed_checks:
- Toutes les cibles glossary:IDENTIFIANT sont résolues dans le glossaire du bon espace et de la bonne publication.
- Identifiants uniques et non réutilisés pour un autre sens ; conserver TER/VER si identité sémantique compatible.
- 'Les sens homonymes sont distingués par contexte : pas de liaison automatique par simple égalité de mots.'
- Texte visible dérivé de la chaîne balisée en conservant le texte des liens ; pas de copie manuelle concurrente.
- Tout champ référencé, y compris définition de terme, peut utiliser le même contrat sans expansion récursive des définitions.
migration_caution: Le glossaire narratif conserve des sens historiques remplacés, notamment Article après U195. Consolider
  les portées et corrections avant extraction ; ne pas prendre la première ligne Markdown pour définition courante.
implementation_status: 'U203 : catalogue YAML, contrôle des cibles, gel et versionnement, rapport des impacts lexicaux, page
  Atlas et liens avec infobulles implémentés. Publication métier inchangée ; v003 sans glossaire.'
