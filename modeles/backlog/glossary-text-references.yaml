user_preference: Textes en chaînes YAML lisibles avec des liens reconnaissables de type Markdown ; JSON pour les API.
serialization_review:
  source_ref: U198
  state: implemented
  distinction: Le format du document (YAML/JSON) est indépendant de la syntaxe des liens au glossaire. YAML ne résout pas
    les références sans convention et contrôles.
  yaml_benefits:
  - Textes multiligne lisibles avec des blocs littéraux.
  - Moins de ponctuation structurelle et commentaires possibles.
  current_constraint: Lecteur partagé scripts/structured_io.py ; schémas JSON appliqués aux valeurs décodées, réponses API
    JSON.
  possible_direction: Autorité éditable en YAML dans le backlog ; instantanés publiés en YAML. Aucun JSON métier concurrent.
    Manifestes techniques et preuves restent en JSON.
  migration_scope:
  - Choisir et documenter une représentation canonique pour le calcul des révisions et empreintes sans toucher aux preuves
    publiées.
  - Adapter lecture, édition, contrôles et gel des entrées ; rejeter les clés dupliquées et borner les types implicites.
  - Conserver les releases historiques JSON et tester la conservation exacte des textes et des références.
  decision: 'U200/U202 : backlog et nouvelles releases métier en YAML ; serveur convertissant les réponses API en JSON. Historique
    inchangé.'
remaining_work:
