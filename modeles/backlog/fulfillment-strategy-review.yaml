user_direction: Donner un cadre à l’application de l’ATP aux commandes ; préférer une finalité explicite Fulfillment.
proposal:
  name: Fulfillment Strategy Decision
  nature: decision
  proposed_domain_id: D03
  definition: 'Déterminer la stratégie de satisfaction applicable à une commande ou un ensemble de commandes : objectifs à
    privilégier, périmètre de ressources admissibles, règles de répartition et marges de révision autorisées.'
  result: Une stratégie applicable, ses paramètres de décision et ses conditions de validité ; pas le plan d’affectation calculé.
  benefit: Séparer le choix du cadre de l’établissement des possibilités et de l’application des affectations. Permettre un
    choix structurel ou contextuel explicable.
  boundaries:
  - Mobiliser les priorités, objectifs et restrictions fournis par leurs responsables ; ne pas recalculer toutes les décisions
    spécialisées.
  - ATP recherche les possibilités dans la référence et le cadre applicable ; CTP garde l’adaptation et PTP l’arbitrage économique.
  - Supply Assignment matérialise les liens retenus ; sa gestion n’est pas renommée Fulfillment Optimization.
  - Choisir une stratégie, administrer ses versions et simuler des scénarios sont des responsabilités distinctes ; aucun nouveau
    Management ou Planning créé automatiquement.
  - Fulfillment Optimization désigne une responsabilité d’optimisation plus large ; aucun domaine renommé.
  - Une stratégie ne peut pas lever une réservation ou un gel sans autorisation applicable.
  example: 'Pour des besoins de 100 et 200 pièces face à 150 disponibles : cadre séquentiel ou proportionnel ; résultats simplifiés
    100/50 ou 50/100 si aucune autre contrainte. Les décisions établissent le résultat et Supply Assignment applique les liens.'
  naming: Fulfillment Strategy reprend un terme Microsoft ; le suffixe Decision matérialise le découpage FLOW, sans prétendre
    à un consensus de marché.
prior_proposal_disposition: 'Supply Assignment Decision, proposée pour calculer le plan au tour précédent, non retenue en
  l’état : réexamen vers une décision de stratégie. Aucun nœud de cette proposition n’existait.'
