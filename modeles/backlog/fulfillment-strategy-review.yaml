global_plan_review_U377:
  status: name_definition_nature_adopted_U378
  source_refs:
  - U377
  - ELM228
  - CMP139
  replaces: Le cadrage seul des propositions U365/U376 est trop étroit pour la responsabilité précisée par Laurent ; conservé
    comme historique.
  user_result: Scénario de plan d’affectation issu d’une décision globale sur les ressources supply, mobilisant décisions
    spécialisées et paramétrage référentiel.
  proposed_name: Fulfillment Plan Decision
  proposed_definition: Déterminer un scénario cohérent d’affectation des ressources Supply aux commandes, en mobilisant les
    décisions spécialisées et les politiques applicables, afin de maximiser la valeur multidimensionnelle de leur satisfaction.
  rationale: Le résultat est un plan candidat ; Strategy désigne plutôt le cadre utilisé chez Microsoft. Plan Decision explicite
    le résultat selon la convention FLOW ; ce nom n’est pas présenté comme un intitulé éditeur établi.
  boundaries:
  - Vision globale des ressources admissibles et des demandes dans le périmètre/horizon examiné ; aucune obligation de recalcul
    intégral à chaque événement ou garantie d’optimum mathématique.
  - Mobiliser ATP, CTP, PTP, priorités et échéancier en conservant leurs résultats propres ; ordre de mobilisation et liens
    précis à instruire.
  - Proposition de plan distincte de son adoption, des affectations appliquées par Supply Assignment, des réservations et
    de la promesse confirmée.
  - Sous-décisions signifie dépendances entre capacités ; aucune hiérarchie supplémentaire au-delà des comportements.
  - Décision opérationnelle collective distincte de la planification globale externe ; aucun S&OP réintroduit.
  market_comparisons:
  - vendor: Microsoft
    product: Dynamics 365 Intelligent Order Management
    element_name: Intelligent Fulfillment Optimization / Fulfillment plan
    element_type: Service d’optimisation et résultat produit
    relationship: Recouvrement partiel
    similarities: Le service mobilise configurations et stocks, optimise des commandes groupées et produit un fulfillment
      plan.
    differences: La stratégie est une entrée. La page ne prouve ni l’examen exhaustif de toutes les ressources de l’entreprise
      ni la décomposition FLOW en ATP/CTP/PTP.
    source_title: Intelligent Fulfillment Optimization architecture
    source_url: https://learn.microsoft.com/en-us/dynamics365/intelligent-order-management/ifo-arch
    source_version: Documentation mise à jour le 30 janvier 2026
    source_locator: Fulfillment strategies ; Fulfillment optimization in order orchestration flows
    consulted_on: '2026-09-18'
    evidence_limits: Page primaire ouverte ; comparaison du résultat, aucune identité de capacités ou garantie d’optimum global.
    flow_position: Appui au résultat plan et à la séparation du paramétrage ; capacité proposée non créée.
    status: proposed
    source_refs:
    - U377
    - ELM228
    - CMP139
  - vendor: Microsoft
    product: Dynamics 365 Intelligent Order Management
    element_name: Fulfillment and Returns Optimization provider
    element_type: Service produit
    relationship: Appui fonctionnel
    similarities: Détermine les sources de satisfaction selon objectifs et configuration métier.
    differences: Service logiciel intégré ; absence de preuve d’une correspondance niveau par niveau au modèle FLOW.
