  conclusion: Les sources documentent un cadre de règles, sa sélection contextuelle et son utilisation par les calculs. Elles
    ne définissent pas un catalogue de capacités contenant le libellé exact Fulfillment Strategy Decision.
  distinctions:
  - concept: Fulfillment strategy
    nature: Objet de politique regroupant objectifs, contraintes et sources admissibles
  - concept: Gérer les stratégies
    nature: Responsabilité de maintenance, validité et gouvernance ; pas de nouvelle capacité créée
  - concept: Déterminer la stratégie applicable
    nature: Réponse métier contextuelle pouvant être humaine, déterministe ou adaptative
  - concept: Calculer la solution dans le cadre
    nature: Responsabilités des décisions spécialisées ; résultat différent de la stratégie
  proposed_refinement:
    name: Fulfillment Strategy Decision
    definition: Déterminer le cadre de satisfaction applicable à une commande ou à un ensemble de commandes, selon leur contexte
      et les politiques métier en vigueur.
    result: Stratégie applicable et conditions de validité, distinctes du plan d’affectation.
    benefit: Identifier la responsabilité du choix du cadre, même lorsque plusieurs décisions spécialisées le consomment.
    boundary: Mobiliser les politiques et protections fournies par leurs responsables ; ne pas absorber Order Prioritization,
      PTP, Supply Protection ou Reservation Policy Decision. Ne pas assimiler la résolution du plan à une sélection de stratégie.
    example: 'Exemple FLOW fictif : appliquer un cadre entrepôts pour un flux B2B, un cadre entrepôts/magasins pour un flux
      web, puis calculer la solution sous les contraintes actives.'
    condition: 'La responsabilité doit être utile et distincte dans FLOW ; une interface de configuration éditeur ne suffit
      pas à la prouver. Une décision stable ou déterministe peut être métier : IA et adaptation ne sont pas des conditions
      nécessaires.'
