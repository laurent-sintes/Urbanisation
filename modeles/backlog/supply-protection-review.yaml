decomposition_rationale_proposed: Distinguer les résultats métier de partage des droits, configuration de couverture, applicabilité
  des règles et contrôle de leur usage. Chaque ligne conserve sa complexité ou son bénéfice ciblé ; aucune hiérarchie supplémentaire
  et aucun comportement automatique par paramètre.
scope_limits:
- Aucune liste publique n’établit l’exhaustivité universelle. Couverture recherchée par mécanisme métier sur un panel de neuf
  éditeurs.
- Les présentations spécialistes servent de contrôle de couverture, pas de preuve d’opérations transactionnelles détaillées.
- 'IBM : accès par texte indexé ; monitor 9.5.0 historique. Oracle Retail latest non figé ; ne pas en déduire une version.'
- Les noms et rattachements P06–P17 sont proposés. P15 et P17 requièrent un arbitrage de maille ou de responsabilité.
