boundaries:
- Coverage Target Decision détermine les valeurs ; Coverage Threshold Setting configure les valeurs retenues. Stock Allocation
  Decision reste distincte des opérations sur enveloppes.
- Replenishment Decision détermine les apports nécessaires. Configurer une méthode ou un plafond ne crée ni ne lance un Order.
  D04 et D06 conservent leurs responsabilités.
- Supply Assignment lie les ressources aux besoins ; Reservation engage une quantité. Le fait consommant les droits et les
  corrections doivent prévenir les doubles déductions.
- Protection Scheduling programme une applicabilité ; Inventory Planning construit et éprouve des scénarios. Aucune simulation,
  analyse d’impact ou validation de scénario copiée sous Protection.
- Allocation Release restitue des droits encore inutilisés ; Consumption Reversal corrige des droits consommés ; Protection
  Deactivation arrête une règle. Aucun effet automatique sur un engagement existant présumé.
- Replenishment Rule Setting configure les contraintes déjà connues ; les maîtres Product, Agreement et Network restent externes.
  Les décisions de fournisseur, substitution ou service ne sont pas absorbées.
- Les plafonds de stock souhaitables, les cibles Min/Max, les plafonds de consommation et les capacités physiques sont différents.
  Une cible haute peut être dépassée par des contraintes de lots ; un plafond strict doit être explicitement qualifié.
- 'La configuration d’une limite de place ne mesure pas la capacité opérationnelle : D06 fournit le contexte exécutant pertinent.
  La conception du planogramme ou de l’assortiment ne devient pas une responsabilité Supply Protection.'
- La surveillance de seuils peut utiliser Inventory Visibility et des projections ; elle ne recalcule pas une optimisation.
  Le rattachement exact de P17 reste un arbitrage.
- Un surstock existant peut nécessiter redistribution, retour, report/annulation d’apport ou écoulement. Les règles orientent
  ces réponses mais ne les exécutent pas. La décision de réduire ou reporter des apports reste à vérifier dans D05 ; ne pas
  la prétendre couverte par la seule définition actuelle de Replenishment Decision.
- Finance, démarque commerciale, disposition/destruction, conformité, planification de saison et création de prévision ne
  sont pas intégrées implicitement à cette capacité. Leurs contraintes utiles peuvent être reçues.
not_separate_behaviors:
- Un comportement par seuil, SKU, magasin, API, écran ou canal technique
- Créer/modifier/copier/supprimer chaque paramètre sans résultat métier propre
- ABC/XYZ, DDMRP, Min/Max ou IA comme niveaux de maturité
- Un comportement Planning dupliquant les six comportements D05.f
recommended_review_order:
- 'P07 Coverage Threshold Setting : sécurité, déclencheur, cible, plafond'
- P08 Replenishment Rule Setting et P09 Consumption Rule Setting
- P06 correction de consommation et frontière Reservation
- 'P10–P14 et P16 : portée et vie des règles'
- 'P15 et P17 : utilité et rattachement à arbitrer'
