candidates:
- key: P01
  name: Allocation
  result: Attribuer une enveloppe initiale à un groupe.
  example: Le web reçoit 300 pièces.
  complexity_or_targeted_benefit: Créer des droits utilisables distincts de ressources affectées à une commande.
  market_source_ids:
  - S01
  state: adopted
  existing_node_id: BHV011
  evidence_relation: appui fonctionnel ; décomposition FLOW, pas équivalence normative
- key: P02
  name: Reallocation
  result: Transférer des droits disponibles entre groupes.
  example: 50 pièces de droits web passent aux magasins.
  complexity_or_targeted_benefit: Conserver un total partagé tout en changeant de bénéficiaire.
  market_source_ids:
  - S01
  state: adopted
  existing_node_id: BHV012
  evidence_relation: appui fonctionnel ; décomposition FLOW, pas équivalence normative
- key: P03
  name: Allocation Release
  result: Restituer les droits inutilisés au disponible commun.
  example: 20 pièces non utilisées cessent d’être protégées.
  complexity_or_targeted_benefit: Différencier restitution et changement de bénéficiaire.
  market_source_ids:
  - S01
  state: adopted
  existing_node_id: BHV013
  evidence_relation: appui fonctionnel ; décomposition FLOW, pas équivalence normative
- key: P04
  name: Allocation Consumption
  result: Imputer un usage à une enveloppe.
  example: 80 pièces de droits sont consommées.
  complexity_or_targeted_benefit: Maintenir un solde sans confondre consommation de droits et sortie physique.
  market_source_ids:
  - S01
  state: adopted
  existing_node_id: BHV014
  evidence_relation: appui fonctionnel ; décomposition FLOW, pas équivalence normative
- key: P05
  name: Allocation Visibility
  result: Consulter les droits alloués, consommés et restants.
  example: Le canal consulte son solde et les mouvements qui l’expliquent.
  complexity_or_targeted_benefit: Lire la disponibilité des droits, distincte de celle du stock.
  market_source_ids:
  - S01
  state: adopted
  existing_node_id: BHV015
  evidence_relation: appui fonctionnel ; décomposition FLOW, pas équivalence normative
- key: P06
  name: Allocation Consumption Reversal
  result: Corriger ou annuler une imputation de consommation et rétablir les droits selon les règles applicables.
  example: Une annulation de commande rend 10 droits à une enveloppe encore valide.
  complexity_or_targeted_benefit: La libération de droits inutilisés ne corrige pas un usage déjà enregistré.
  market_source_ids:
  - S05
  state: proposed
  existing_node_id: null
  evidence_relation: appui fonctionnel ; décomposition FLOW, pas équivalence normative
- key: P07
  name: Coverage Threshold Setting
  result: Enregistrer et réviser les niveaux de sécurité, déclencheurs, cibles et limites hautes retenus, avec leurs unités
    et leurs effets.
  example: 'Pour un magasin : sécurité 40, réassort sous 60, cible 100 ; préciser séparément un éventuel plafond strict.'
  complexity_or_targeted_benefit: Distinguer les sémantiques de seuils pour éviter pénurie ou apports excessifs.
  market_source_ids:
  - S02
  - S03
  - S06
  - S07
  state: proposed
  existing_node_id: null
  evidence_relation: appui fonctionnel ; décomposition FLOW, pas équivalence normative
- key: P08
  name: Replenishment Rule Setting
  result: Configurer la méthode de réassort, les contraintes et conditions de renouvellement à appliquer.
  example: Révision chaque lundi, complément jusqu’à la cible, multiples de colis et arrêt à la date de retrait.
  complexity_or_targeted_benefit: Un même seuil donne des résultats différents selon méthode, fréquence et contraintes.
  market_source_ids:
  - S02
  - S07
  - S08
  - S10
  state: proposed
  existing_node_id: null
  evidence_relation: appui fonctionnel ; décomposition FLOW, pas équivalence normative
- key: P09
  name: Consumption Rule Setting
  result: Configurer qui peut utiliser les protections et selon quelles restrictions ou priorités de groupes.
  example: Un groupe prioritaire peut utiliser une ressource sous conditions ; un autre reste plafonné.
  complexity_or_targeted_benefit: Distinguer minimum protégé, plafond et priorité, sans arbitrer les commandes individuellement.
  market_source_ids:
  - S01
  - S05
  state: proposed
  existing_node_id: null
  evidence_relation: appui fonctionnel ; décomposition FLOW, pas équivalence normative
- key: P10
  name: Protection Scope Assignment
  result: Rattacher une politique de protection à des produits, lieux ou groupes, avec les règles de priorité des rattachements.
  example: Une règle commune couvre un groupe de magasins ; une exception identifie un article-lieu.
  complexity_or_targeted_benefit: Maîtriser les héritages et éviter qu’une règle s’applique au mauvais périmètre.
  market_source_ids:
  - S07
  - S08
  - S16
  state: proposed
  existing_node_id: null
  evidence_relation: appui fonctionnel ; décomposition FLOW, pas équivalence normative
- key: P11
  name: Protection Scheduling
  result: Programmer les valeurs et changements de règles sur leurs périodes de validité.
  example: La cible passe de 100 à 60 après la promotion puis revient à 40.
  complexity_or_targeted_benefit: Préparer des changements futurs sans altérer la règle applicable aujourd’hui.
  market_source_ids:
  - S03
  - S05
  - S09
  state: proposed
  existing_node_id: null
  evidence_relation: appui fonctionnel ; décomposition FLOW, pas équivalence normative
- key: P12
  name: Protection Activation
  result: Rendre une configuration applicable à son périmètre.
  example: Les nouveaux seuils deviennent effectifs à la date retenue.
  complexity_or_targeted_benefit: Distinguer donnée préparée et règle utilisée ; automatisation possible.
  market_source_ids:
  - S05
  - S08
  - S09
  state: proposed
  existing_node_id: null
  evidence_relation: appui fonctionnel ; décomposition FLOW, pas équivalence normative
- key: P13
  name: Protection Deactivation
  result: Suspendre ou arrêter l’application d’une configuration pour son périmètre.
  example: Arrêter le réassort automatique d’un article en retrait, tout en conservant d’autres protections.
  complexity_or_targeted_benefit: Un arrêt de règle diffère d’une suppression de données ou d’une libération de droits.
  market_source_ids:
  - S05
  - S08
  - S09
  state: proposed
  existing_node_id: null
  evidence_relation: appui fonctionnel ; décomposition FLOW, pas équivalence normative
- key: P14
  name: Protection Override
  result: Appliquer une dérogation explicite à une règle, avec périmètre, priorité et durée maîtrisés.
  example: Un magasin conserve temporairement une cible différente du groupe.
  complexity_or_targeted_benefit: Préserver la règle commune tout en rendant l’exception visible et réversible.
  market_source_ids:
  - S07
  state: proposed
  existing_node_id: null
  evidence_relation: appui fonctionnel ; décomposition FLOW, pas équivalence normative
- key: P15
  name: Protection Mass Update
  result: Appliquer une modification à un ensemble de protections et rendre compte de ce qui a été appliqué ou rejeté.
