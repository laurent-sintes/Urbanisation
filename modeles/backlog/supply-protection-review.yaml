  - S08
  state: conditional
  existing_node_id: null
  evidence_relation: appui fonctionnel ; décomposition FLOW, pas équivalence normative
- key: P16
  name: Protection Visibility
  result: Consulter la configuration effectivement applicable, sa validité et les dérogations qui l’expliquent.
