user_direction: 'Les sept référentiels initiaux constituent plutôt un découpage Core Data ; Price Books à examiner. Sources
  Ingestion : Commerce, Design (PLM), Logistics, autres à rechercher.'
core_data:
  existing_subjects:
  - D08 Product Reference
  - D09 Party / Role
  - D12 Product Catalog
  - D16 Assortment
  - D11 Agreement
  - D13 Fulfillment Network
  - D14 Service Catalog
  interpretation: Ensembles de données conservées ; point de départ du stockage logique, sans sept bases physiques imposées
    ni reclassification canonique.
  price_book:
    status: recommended_candidate_not_adopted
    name: Price Book
    market_alternative: Price List
    definition: Ensemble identifié de tarifs de référence reçus pour des produits, avec les unités, devises et conditions
      d’application disponibles.
    existing_overlap: D12/TER049 décrivent déjà des prix d’offre ; D11/TER048 portent les conditions convenues. Rendre le
      tarif autonome exige de préciser ces frontières.
    distinction:
      Product Catalog: Offre de produits présentée dans un contexte commercial.
      Price Book: Tarifs de référence identifiés et réutilisables ; montants ou définitions tarifaires selon les sources.
      Agreement: Conditions convenues entre parties ; peut référencer un tarif ou préciser des conditions particulières.
      transaction_price: Résultat appliqué à une commande ; autorité et règles ouvertes Q072.
    benefit: Permettre plusieurs tarifs pour une même offre et réutiliser un tarif sans le confondre avec le catalogue ou
      l’accord.
    limits: Pas de nouvelle administration de prix, promotion, négociation ou moteur de calcul ; extension aux prestations
      à examiner séparément. Aucun huitième couple Ingestion/Visibility créé.
    evidence:
    - ELM530
    - ELM531
    - ELM532
  party_restrictions:
    name: Party Restrictions
    placement: Core Data
    status: retained_U518
    definition: Conserver les règles de restriction reçues concernant les clients ou fournisseurs et, lorsqu’ils sont fournis,
      les listes ou statuts de tiers concernés, avec leur portée et leur validité disponibles.
    definition_status: proposed_editorial_detail
    distinctions:
      Party / Role: Identifie le tiers et ses rôles métier ; la restriction s’y rattache sans modifier cette identité.
      received_rule: Décrit les conditions et effets d’une restriction.
      received_restriction: Liste ou statut déjà évalué lorsqu’il est fourni par la source.
      Supply_application: L’effet sur une opération demeure porté par la capacité Supply concernée ; l’autorité d’évaluation
        reste à préciser.
    source_candidate:
      name: Contrôle de gestion
      source_ref: U517
      status: possible_source_identified_by_user
    market_evidence:
    - ELM536
    - ELM537
    - CMP211
    open_details:
    - Règles et données exactement reçues
    - Opérations concernées et portée client/fournisseur
    - Identité, période, motifs et exceptions disponibles
    - Responsabilité d’évaluation et de levée
    - Organisation détaillée du stockage
    source_refs:
    - U517
    - U518
    - CMP211
ingestion_candidates:
- domain: Commerce
  origin: U516
  proposed_contributions:
  - Product Catalog
  - Assortment
  - Price Book de vente candidat
  - Accords clients
  - Parties et rôles commerciaux
  limits: Selon responsabilité réelle ; pas développement du Domain Commerce différé.
- domain: Design
  origin: U516
  context: PLM éclaire la responsabilité, sans être un nom de domaine fournisseur à lui seul.
  proposed_contributions:
  - Identité et caractéristiques de conception des produits
  - Variantes et structures pertinentes selon contrat
  limits: Product Reference peut recevoir des attributs provenant de plusieurs domaines ; aucune maîtrise PLM exclusive présumée.
  evidence:
  - ELM533
- domain: Logistics
  origin: U516
  proposed_contributions:
  - Lieux et relations de référence
  - Caractéristiques logistiques
  - Prestations et conditions de service logistiques
  limits: Stocks courants, charge et faits d’exécution restent hors de cette ingestion de références ; ni maître C-Log ni
    flux installé déduit.
  evidence:
  - ELM518
  - ELM523
  - ELM526
- domain: Procurement / Sourcing
  origin: Codex recommendation
  proposed_contributions:
  - Références fournisseurs et rôles achat
  - Accords d’achat
  - Conditions ou tarifs d’achat
  condition: Si cette responsabilité source est distincte de Commerce dans le découpage retenu ; ne pas lui transférer automatiquement
    Purchase Order du Domain Supply.
  evidence:
  - INF19
  - ELM534
  - ELM535
- domain: Controlling
  label_fr: Contrôle de gestion
  name_status: Libellé anglais proposé ; nom canonique non adopté.
  origin: U517
  status: user_identified_possible_source
  proposed_contributions:
  - Règles de blacklist de clients ou fournisseurs
  meaning: Fourniture possible de règles ; la réception d’une liste ou d’un statut déjà évalué est une variante à distinguer,
    pas un fait supplémentaire attribué à Laurent.
  limits: Domaine source externe ; aucune propriété universelle de ces règles ni preuve de flux installé déduite.
cross_domain_questions:
- 'Party / Role : source commune d’identité ou contributions de Commerce/Procurement/autres domaines ; autorité par attribut
  et rôle à préciser (INF18).'
- 'Fulfillment Network : lieux logistiques et points de vente peuvent avoir des autorités distinctes ; contenu exact ouvert
  Q076.'
- 'Service Catalog : Logistics peut fournir les prestations physiques mais ne couvre pas nécessairement les Backing Services
  humains ou numériques ; domaines fournisseurs à identifier.'
- U517 identifie le contrôle de gestion comme source possible de règles de restriction de tiers. Les autres apports financiers
  éventuels restent à préciser.
example:
  status: fictional_FLOW_illustration
  inputs: Design fournit des caractéristiques produit ; Commerce fournit assortiment et tarif.
  storage: Product Reference, Assortment et Price Book candidat conservent ces sujets.
  view: Une vue pour une capacité consommatrice réunit les produits du périmètre, leurs caractéristiques et leurs tarifs de
    référence.
  limit: Aucune éligibilité, disponibilité ni prix final calculé par cette seule agrégation.
