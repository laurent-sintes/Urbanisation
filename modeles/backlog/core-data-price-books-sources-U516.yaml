decision: U518 retient le nom Party Restrictions et son rattachement à Core Data dans la structure de travail. Définition
  détaillée et autres options restent proposées ; aucune refonte canonique globale adoptée.
clarification_U517:
  source: Contrôle de gestion, explicitement identifié par Laurent comme source possible.
  distinctions:
    policy: Conditions et effets définis par une règle reçue.
    restriction: Liste ou statut d’un tiers déjà évalué, si la source fournit ce résultat.
    application: Effet sur une opération porté par la capacité Supply concernée ; qui évalue la règle reste à préciser si
      seul son énoncé est reçu.
  core_data_option:
    name: Party Restrictions
    status: retained_U518
    scope: Restrictions liées aux tiers, avec portée et validité effectivement reçues ; règles et états de restriction restent
      distinguables.
    relation: Référence à Party / Role pour l’identité et le rôle concernés ; restriction distincte de leur identité.
    storage: Ressource ajoutée à Core Data dans la structure de travail U518 ; organisation détaillée et représentation canonique
      restent à préciser.
    current_record: core_data.party_restrictions
  visibility: Fournir aux capacités consommatrices la règle ou restriction pertinente et sa portée, sans déduire un blocage
    universel du tiers.
  open_points:
  - Règle générale ou liste/statut évalué reçu
  - Opérations visées et rôle client/fournisseur
  - Validité, motif et exceptions disponibles
  - Responsabilité d’évaluation et de levée éventuelle
  example:
    status: fictional_FLOW_illustration
    case: Une restriction reçue interdit de nouvelles commandes à un fournisseur.
    lesson: Elle ne signifie pas automatiquement que les opérations ou paiements déjà engagés doivent être bloqués.
  limits: L’exemple de crédit Microsoft ne réduit pas toute blacklist au crédit. Les effets natifs éditeur ne sont pas adoptés.
