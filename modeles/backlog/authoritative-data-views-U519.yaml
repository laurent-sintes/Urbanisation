scope_U520: Rester au niveau des capacités, y compris pour les référentiels. Les besoins consommateurs illustrent Visibility
  ; aucun catalogue de vues, Behavior, champ ou règle de gestion détaillée n’est proposé à cette étape.
capability_proposal:
  name: Visibility
  status: proposed_not_adopted
  service: Rendre les références utiles à l’orchestration consultables sous une forme adaptée aux capacités Supply qui les
    consomment.
  responsibilities:
  - Rechercher et consulter les références pertinentes pour un usage Supply.
  - Rapprocher plusieurs sujets de Core Data lorsque le besoin consommateur le justifie.
  - Restituer les informations de référence avec leur contexte et leurs limites de connaissance disponibles.
  boundary: La capacité expose les références ; les capacités consommatrices conservent leurs responsabilités de décision,
    de tenue des états opérationnels et d’action.
  benefit: Permettre aux capacités Supply d’accéder à une lecture métier utile, indépendamment des domaines sources et de
    l’organisation du stockage.
  evidence_keys:
  - LOC1
  - LOC2
  - FLU1
  - FLU2
  - OMS1
  - OMS3
  market_source_refs:
  - ELM228
  - ELM538
  - ELM541
  - ELM542
  - ELM524
  - ELM546
  market_inspiration:
    choice: Visibility rend les références utiles à l’orchestration consultables sous une forme adaptée aux capacités Supply
      consommatrices.
    flow_scope: Contexte de demande, approvisionnement, Network et prestations, retours et bases économiques utiles à l’orchestration.
    flow_approach: Rapprocher les sujets de référence nécessaires à un usage, en conservant les responsabilités propres aux
      états opérationnels et aux décisions.
    synthesis:
    - Oracle possède une couverture ERP/SCM plus large que l’orchestration étudiée. Ses fonctions de planification expliquent
      des besoins supplémentaires ; elles ne sont pas assimilées automatiquement au périmètre FLOW. La présence d’analytics
      ne suffit pas, à elle seule, à définir une frontière métier.
    - 'Le sourcing Fluent correspond au Network FLOW : il éclaire les lieux et réseaux utilisés pour satisfaire les demandes.
      Il ne doit pas être confondu avec le contexte d’achat ou d’apport fournisseur.'
    - Oracle et Fluent documentent des lectures croisant plusieurs sujets pour la demande, le fulfillment et les retours.
      Ils ne proposent pas une nomenclature commune de vues de référence identique à FLOW.
    - Oracle Global Order Promising étaye la consommation de bases économiques pour la promesse. Une vue de coûts équivalente
      n’est pas établie dans les documents Fluent consultés ; cette limite documentaire ne prouve pas une absence de fonction.
    - Les fonctions natives combinent parfois références, état du dossier et décision. Visibility conserve le service de consultation
      des références ; leur application au cas appartient aux capacités consommatrices.
    examples:
    - title: Exemple Fluent — contexte de sourcing et Network FLOW
      situation: Responsive Sourcing mobilise les lieux, leurs réseaux et le contexte de demande pour préparer la satisfaction.
      outcome: Le produit utilise ces informations pour évaluer les lieux candidats.
      lesson: 'Lecture FLOW : Network fournit le contexte de référence ; la décision de satisfaction reste distincte.'
      source_title: Getting Started with Reference Sourcing Criteria
      source_url: https://docs.fluentcommerce.com/by-type/getting-started-with-reference-sourcing-criteria
      source_refs:
      - ELM541
      - U524
      - CMP213
    - title: Exemple Oracle — bases économiques de la promesse
      situation: Global Order Promising utilise des coûts pour comparer les possibilités de satisfaction.
      outcome: Le moteur produit une décision à partir de ces bases et du contexte opérationnel.
      lesson: Une référence économique et la décision qui l’utilise sont deux responsabilités différentes.
      source_title: Set Attributes on Your Supply Chain Search
      source_url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/26b/fascp/promising-attributes-for-supply-chain-availability-searches.html
      source_refs:
      - ELM549
      - CMP213
