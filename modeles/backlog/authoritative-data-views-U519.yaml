market_conclusion:
  observation: Les documents consultés montrent des consommations croisant plusieurs sujets de référence selon le besoin d’orchestration,
    de promesse, de sourcing, de planification ou de retour.
  interpretation: Le principe de Visibility orientée consommateurs est cohérent avec ces usages. Il ne dépend pas d’un découpage
    identique aux sources ou au stockage.
  naming: Visibility est ici une capacité métier FLOW proposée. Les éditeurs documentent surtout contextes, données collectées,
    fonctions et APIs ; aucune nomenclature commune de vues n’est établie.
  limits: Échantillon ciblé de cinq éditeurs ; pas d’exhaustivité ni preuve de réalisation Beaumanoir. Aucun nombre de vues,
    technologie de stockage, séparation physique ou mécanisme de règle déduit.
  scope_correction_U524: 'À lire avec U525 : la couverture supplémentaire Oracle ne justifie pas automatiquement une vue FLOW
    ; la frontière précise de PLAN reste à arbitrer Q078.'
boundary_examples:
- Le contexte de référence d’une promesse est distinct de la promesse calculée.
- Le référentiel d’un lieu ou d’un service est distinct de son stock ou de sa capacité disponible.
- Les conditions d’un retour sont distinctes du dossier et de son issue décidée.
detail_deferred_U520:
- Nombre et noms des vues.
- Décomposition éventuelle de Visibility en Behaviors.
- Champs, clés, contrats d’accès et mécanismes techniques.
- Micro-détail des règles de gestion et effets sur les opérations.
- Ajouts détaillés de ressources Core Data et déplacement des liens hérités.
