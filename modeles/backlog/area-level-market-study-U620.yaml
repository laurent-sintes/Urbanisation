id: area-level-market-study-U620
date: '2026-09-22'
source_refs:
- U620
- U621
- CMP265
- U757
status: terminology_superseded_by_subdomain_U673
author: Codex
scope: Définition et justification du niveau intermédiaire entre Domain et Capability ; comparaison élargie avant toute migration.
sources:
- id: ELM633
  reference: MKT04
  framework: SAP Reference Business Architecture
  native_concept: Business Domain → Business Area → Business Capability
  url: https://learning.sap.com/courses/intelligent-enterprise-architecture-fundamentals/defining-business-architecture
  version: Cours évolutif ; consulté le 22 septembre 2026
  locator: Business Capability Model, niveaux 1–3 ; distinction avec Business Process Segment
  access: Texte primaire ouvert
  consulted_on: '2026-09-22'
  finding: Area regroupe les capacités ; chaque capacité appartient à une Area puis à un Domain. SAP fixe trois niveaux de
    granularité.
  limit: La structure est explicite ; elle ne fournit pas un test universel pour décider où couper une Area. Le Business Process
    Segment est un objet différent, même si son nom peut coïncider.
- id: ELM634
  reference: MKT85
  framework: DDD — Nick Tune
  native_concept: Domain et Subdomain
  url: https://nick-tune.me/blog/2020-11-25-domain-subdomain-bounded-context-problem-solution-space-in-d/
  version: Article du 25 novembre 2020
  locator: Subdomains ; Subdomains vs Bounded Contexts ; Problem Space vs Solution Space
  access: Texte original de l’auteur ouvert
  consulted_on: '2026-09-22'
  finding: 'Subdomain est relatif : un domaine est qualifié de sous-domaine par rapport à son parent. Plusieurs découpages
    restent possibles.'
  limit: Point de vue argumenté d’un praticien, pas norme DDD. L’auteur conteste lui-même la séparation trop simple entre
    espaces du problème et de la solution.
- id: ELM635
  reference: MKT69
  framework: Microsoft — analyse DDD
  native_concept: Subdomain / Bounded Context
  url: https://learn.microsoft.com/en-us/azure/architecture/microservices/model/domain-analysis
  version: Documentation évolutive
  locator: Analyze the domain ; Define bounded contexts
  access: Texte primaire ouvert
  consulted_on: '2026-09-22'
  finding: Identifier fonctions proches et dépendances pour dégager les sous-domaines. Le bounded context délimite l’application
    d’un modèle particulier.
  limit: Guide orienté conception de microservices ; aucune obligation de convertir une Area FLOW en service logiciel. Core/supporting/generic
    qualifie l’importance stratégique, pas la profondeur.
- id: ELM636
  reference: MKT01
  framework: The Open Group — TOGAF
  native_concept: Stratification / Leveling
  url: https://governance.foundation/assets/frameworks/togaf/g189%20-%20Business%20Capbility.pdf
  version: G189, juin 2018
  locator: §§3.2.1–3.2.2, pages imprimées 9–10
  access: Document primaire historique ouvert sur hébergement tiers
  consulted_on: '2026-09-22'
  finding: Sépare classement en catégories et décomposition des capacités. La profondeur répond aux besoins des lecteurs et
    des décisions.
  limit: Guide V2 sur le site officiel inaccessible pendant cette étude. Aucun détail de 2018 attribué automatiquement à une
    édition actuelle ; aucune classe Area imposée par ces passages.
- id: ELM637
  reference: MKT03
  framework: Business Architecture Guild
  native_concept: Capability decomposes into capability
  url: https://cdn.ymaws.com/www.businessarchitectureguild.org/resource/resmgr/whitepapers/Business_Architecture_Metamo.pdf
  version: Metamodel Guide v3.0, septembre 2024
  locator: §5.2, pages imprimées 17–18 ; §6.3, page 45
  access: PDF primaire ouvert
  consulted_on: '2026-09-22'
  finding: Décomposition récursive de capacités centrées sur un objet métier. Les enfants restent dans le périmètre de l’objet
    parent.
  limit: Livre blanc public, pas lecture intégrale du BIZBOK. FLOW distingue déjà Area et Capability ; une Area réunissant
    plusieurs objets ne doit pas être déclarée équivalente à cette décomposition.
- id: ELM638
  reference: MKT18
  framework: BIAN / Van Haren
  native_concept: Business Area → Business Domain → Service Domain
  url: https://www.vanharen.net/wp-content/uploads/2026/02/syllabus-BIAN-Foundation-v3.8.pdf
  version: Syllabus BIAN Foundation v3.8
  locator: Key terms and concepts, pages imprimées 24–26
  access: Syllabus primaire de certification ouvert
  consulted_on: '2026-09-22'
  finding: Area et Domain organisent la présentation du Service Landscape. Le Service Domain porte une responsabilité fonctionnelle
    élémentaire.
  limit: Ordre Area/Domain inverse de SAP ; cadre bancaire. La structure de présentation ne suffit pas à attribuer une responsabilité
    opérationnelle au regroupement.
- id: ELM639
  reference: MKT07
  framework: APQC
  native_concept: Category → Process group → Process → Activity → Task
  url: https://www.apqc.org/How-Can-Organizations-Classify-and-Organize-Their-Processes-Using-a-Common-Framework
  version: Page créée septembre 2026 ; PCF 8.0 cité
  locator: Common hierarchy ; paragraphes sur management, accountability, measurement et improvement
  access: Texte primaire ouvert
  consulted_on: '2026-09-22'
  finding: La catégorie regroupe les processus au plus haut niveau ; le groupe de processus contribue à cette catégorie. Le
    détail sert pilotage, mesure et amélioration.
  limit: Taxonomie de processus ; Process Group ne devient pas automatiquement une Area de capacités. La page générale ne
    constitue pas une lecture du catalogue Retail complet.
- id: ELM640
  reference: MKT06
  framework: IBM Component Business Model
  native_concept: Business Competency × Accountability Level
  url: https://public.dhe.ibm.com/software/emea/dk/frontlines/g510-6163-component-business-models.pdf
  version: Publication historique, ©2005
  locator: The CBM framework ; figure 5, page imprimée 7
  access: Passage primaire indexé consulté ; ouverture directe en échec 502
  consulted_on: '2026-09-22'
  finding: Les compétences regroupent l’activité ; un axe distinct distingue Direct, Control et Execute. Les composants coopèrent
    selon des niveaux de service convenus.
  limit: Matrice de conception et réalisation métier ; pas une hiérarchie Domain/Area/Capability. N’impose pas de réintroduire
    des couches dans FLOW.
- id: ELM641
  reference: MKT25
  framework: SAP LeanIX
  native_concept: Business Capability L1 / L2 / L3
  url: https://help.sap.com/docs/leanix/ea/business-capability-modeling-guidelines?locale=en-US
  version: Métamodèle v4 ; documentation évolutive
  locator: Guidelines and Best Practices ; Antipatterns
  access: Texte primaire indexé détaillé ; ouverture directe vide
  consulted_on: '2026-09-22'
  finding: Hiérarchie de capacités ; recommande généralement trois niveaux au plus et une affectation non ambiguë des enfants.
    Distingue organisation, processus et technologie.
  limit: Conseil d’usage produit, pas contrainte ontologique universelle. Même groupe SAP que RBA, donc pas une preuve indépendante
    de consensus.
- id: ELM642
  reference: MKT26
  framework: Ardoq
  native_concept: Business Capability récursive
  url: https://help.ardoq.com/en/articles/44050-business-capability-modeling-and-realization-metamodel
  version: Article du 19 novembre 2025
  locator: Business Capability Workspace ; Component Level
  access: Texte primaire indexé détaillé ; ouverture directe 401
  consulted_on: '2026-09-22'
  finding: Un même type Business Capability se décline en hiérarchie à profondeur libre ; le niveau sert notamment aux vues
    et filtres.
  limit: Métamodèle d’outil ; la flexibilité ne prouve pas la pertinence métier d’un découpage. Contenu conservé après intégration
    de l’ancien bundle dans Foundation.
additional_source:
  url: https://learning.sap.com/courses/sap-enterprise-architecture-framework-foundation-introduction/discovering-the-reference-architecture-content
  consulted_on: '2026-09-22'
  access: Texte primaire ouvert
  support: Confirme les trois objets SAP Business Domain, Business Area et Business Capability.
synthesis:
- Les références consultées justifient des regroupements intermédiaires, sans leur donner une nature ni un nom universels.
- Distinguer regroupement de présentation, décomposition d’une aptitude et partition des responsabilités métier.
- Le sous-domaine DDD est relatif à un domaine parent ; ce terme ne fixe ni rang universel ni taille. Le bounded context porte
  une frontière de validité du modèle.
- La stabilité et la cohérence des responsabilités sont une justification FLOW plus forte que le seul confort visuel. Les
  échanges transversaux restent nécessaires.
recommendation:
  status: proposed_not_adopted
  definition: Une Area est un périmètre cohérent de responsabilités métier à l’intérieur d’un Domain. Elle regroupe les capacités
    qui concourent à une même finalité et précise ce qu’elles prennent en charge ainsi que leurs échanges avec les autres
    Areas.
  tests:
  - Finalité commune exprimable indépendamment de la liste des capacités.
  - Responsabilités incluses et exclues explicites, distinguables de celles des Areas voisines.
  - Cohérence des concepts, règles et décisions nécessaires à cette finalité ; un même objet peut être utilisé dans plusieurs
    Areas sous des responsabilités différentes.
  - Rattachement principal des capacités justifiable sans recopier les capacités transversales.
  - Interactions explicables par informations, demandes, résultats et engagements échangés.
  - Stabilité lorsque changent organisation, fournisseurs, applications et processus.
  benefit: Conserver une lecture synthétique du Domain et éprouver la répartition de responsabilités avant de détailler les
    capacités.
  tradeoff: Niveau méthodologique propre à FLOW à entretenir ; ne pas présenter chaque Area comme une capacité macroscopique,
    un bounded context ou une simple catégorie universellement équivalente.
  exclusions:
  - Pas une étape obligatoire d’un processus.
  - Pas une équipe, un module logiciel ou une frontière de déploiement.
  - Pas un regroupement uniquement par type de capacité ou par gouvernance des données.
  - Pas de nombre minimal de capacités ni de profondeur marché universelle.
flow_examples:
- area: Demand Management
  purpose: Porter les besoins, exigences et promesses de satisfaction des demandes.
  test: La cohérence vient de la responsabilité sur la demande, y compris achat et transfert, et non d’un type de client.
- area: Inventory Management
  purpose: Établir les états et mouvements du stock.
  test: Les demandes et décisions consomment ces informations sans absorber cette responsabilité.
- area: Fulfillment Orchestration
  purpose: Conduire l’exécution des demandes en gouvernant les sollicitations de services et leur suivi.
  test: Tâches, déclenchement, suivi et reprise relèvent de la même finalité ; la nature numérique ou physique du service
    ne suffit pas à scinder l’Area.
- area: Référentiels et policies — nom détaillé non réarbitré
  purpose_proposed: Fournir les références et le cadre de règles nécessaires au Domain.
  test: U618 maintient une seule Area ; il reste utile de formuler sa finalité commune. Les distinctions de type et gouvernance
    restent internes, sans réouvrir son regroupement.
canonical_model_changed: false
approval_boundary: U620/U621 autorisent l’étude. La définition proposée, les tests et les formulations d’exemples ne sont
  pas des accords sur MOD013 ni sur les Areas.
clarification_U622:
  source_refs:
  - U622
  adopted_scope: Association du niveau Area à une finalité.
  not_adopted: Nouveau nom, ensemble des tests proposés, exemples et totalité de la définition éditoriale.
  canonical_update: MOD013 précise désormais la finalité ; nom Area conservé dans l’attente du choix.
  naming_proposal:
    status: proposed_not_adopted
    preferred: Subdomain
    rationale: Nom indépendant d’un éditeur, relation au Domain explicite ; la finalité désormais adoptée précise le critère
      de découpage local.
    tradeoff: Terme connu en DDD, sans assimilation automatique à un bounded context ni adoption d’une méthode logicielle.
    alternative: Capability Group
    alternative_tradeoff: Décrit le regroupement des capacités ; exprime moins directement le périmètre de responsabilités
      et la finalité.
    sources:
    - ref: ELM634
      url: https://nick-tune.me/blog/2020-11-25-domain-subdomain-bounded-context-problem-solution-space-in-d/
      consulted_on: '2026-09-22'
      support: Subdomain exprime une relation à un domaine parent.
    - title: SKF — Toolbox for Architecture Framework, Discussions at The Open Group
      url: https://blog.opengroup.org/wp-content/uploads/2018/03/blog_architecture_toolbox.pdf
      version: Février 2018
      consulted_on: '2026-09-22'
      access: PDF primaire ouvert ; métamodèle Architecture Entity Cards
      support: Business Capability Group L2 attesté dans le métamodèle SKF.
      limit: Pratique d’entreprise présentée à The Open Group, pas norme TOGAF ni consensus universel.
naming_review_U623:
  source_refs:
  - U623
  - U622
  supersedes: 'clarification_U622.naming_proposal.preferred : Subdomain rejeté par Laurent, surcharge du sens DDD.'
  status: alternatives_compared_no_name_adopted
  comparison:
  - name: Purpose
    assessment: Meilleur des quatre pour exprimer une finalité durable. Employer ce mot comme niveau contenant des capacités
      reste une convention FLOW, et non un standard marché établi.
  - name: End Goal
    assessment: 'Évoque surtout un état cible ultime ; exprime moins bien une responsabilité permanente. Ne pas assimiler
      absence d’échéance à absence de Goal : les goals BMM peuvent être continus.'
  - name: Outcome
    assessment: Désigne un résultat ou effet, auquel plusieurs capacités ou périmètres peuvent contribuer ; risque de confondre
      regroupement et résultat.
  - name: Intent
    assessment: Exprime l’intention ; ambiguïté locale avec l’intention de l’acteur à l’origine d’une demande, déjà structurante
      dans Demand.
  recommendation:
    name: Purpose
    status: proposed_not_adopted
    definition_proposed: Finalité métier durable au sein d’un Domain, autour de laquelle sont regroupées les responsabilités
      et capacités qui concourent à sa réalisation.
    tradeoff: Le niveau serait nommé par sa finalité, plutôt que par le périmètre qui la porte ; distinguer ce rôle d’un objectif
      ponctuel ou d’un résultat mesuré.
  market_sources:
  - title: OMG Business Motivation Model 1.3
    url: https://www.omg.org/spec/BMM/1.3/PDF
    consulted_on: '2026-09-22'
    locator: '§§8.2.3–8.2.5 : Desired Result, Goal, Objective'
    support: Goal et Objective qualifient des résultats souhaités ; appui à la distinction entre motivation et regroupement
      de capacités.
    limit: Ne définit pas Purpose comme niveau de la hiérarchie FLOW.
  - ref: ELM637
    url: https://cdn.ymaws.com/www.businessarchitectureguild.org/resource/resmgr/whitepapers/Business_Architecture_Metamo.pdf
    version: 3.0, septembre 2024
    consulted_on: '2026-09-22'
    locator: '§5.2 : Outcome'
    support: Outcome désigne un résultat ou produit final conséquent à une action ou un événement ; pas une Area.
  canonical_name_changed: false
adoption_U624:
  source_refs:
  - U624
  status: explicit_user_adoption
  target: MOD013
  approved_fields:
  - name
  - label_fr
  - definition
  - hierarchy
  values:
    name: Purpose
    label_fr: Finalité
    definition: Finalité métier durable au sein d’un Domain, autour de laquelle sont regroupées les responsabilités et capacités
      qui concourent à sa réalisation.
    hierarchy:
    - Domain
    - Purpose
    - Capability
    - Behavior
  supersedes: Nom Area U482 et propositions de noms U622/U623 ; historique conservé.
  boundary: Convention méthodologique FLOW ; aucun déplacement ni renommage individuel des capacités. Le registre record_decision.py
    cible nodes/relations et ne capture pas les entrées méthodologiques ; accord champ par champ conservé dans cette annexe.
  technical_alignment: Les codes techniques area et les restitutions publiées restent ceux de leur schéma/snapshot ; leur
    migration sera traitée lors de la mise en cohérence du catalogue.
status_reconciliation_U757:
  previous_status: research_completed_recommendation_not_adopted
  reason: Le niveau courant est Subdomain ; l’ancienne proposition Area n’est plus un choix terminologique en attente. Les
    comparaisons historiques restent conservées.
  source_refs:
  - U673
  - U757
  note: Mise en cohérence du suivi ; ne vaut ni nouvel accord métier ni adoption des formulations historiques.
  current_reference: modeles/backlog/capability-subdomain-audit-U667.yaml
