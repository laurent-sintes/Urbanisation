comparisons:
- target: D04 / D07.b
  sources:
  - ELM133
  - ELM659
  relation: recouvrement partiel
  common: Demande amont distincte de la prestation confiée et de son compte rendu.
  difference: FLOW couvre aussi des prestations humaines et documentaires ; pas seulement des expéditions.
  proposal: 'U679 : Service Orders dans Service Order Management, distinct d’Order Management et de Fulfilment Orchestration.'
- target: D07.b / D06.d
  sources:
  - ELM492
  - ELM659
  relation: recouvrement partiel
  common: Gestion d’une sollicitation concrète et coordination de sa réalisation.
  difference: TMFC007 inclut son orchestration ; les composants logiciels ne prescrivent pas des sous-domaines FLOW.
  proposal: 'U679 : Service Order Management distinct pour les engagements de prestation ; Fulfilment Orchestration pour leur
    coordination. Répartition détaillée des capacités existantes à instruire.'
- target: D14
  sources:
  - ELM129
  - ELM492
  relation: appui méthodologique
  common: Offre de services séparée des instances commandées et de leur exécution.
  difference: API et composant télécom, pas catalogue logistique.
  proposal: Décrire les familles de prestations, résultats, conditions et niveaux de service ; ne pas y mettre les ordres,
    engagements individuels ou réalisations.
- target: D07.a / D07.b — picking et packing
  sources:
  - ELM656
  - ELM659
  - ELM660
  - ELM661
  relation: recouvrement partiel
  common: Prestations et travaux explicites, avec résultats et suivi.
  difference: La frontière fournisseur peut porter un ensemble pick-pack-ship alors que les tâches opérateur sont séparées.
  proposal: 'U677–U679 : familles Picking Order et Packing Order au niveau capacité ; la maille des documents ne détermine
    pas celle des responsabilités.'
- target: D07.a / D07.b — light touch
  sources:
  - ELM658
  - ELM661
  relation: appui sémantique
  common: Étiquetage, reconditionnement léger et opérations VAS.
  difference: Périmètres VAS variables et parfois plus larges, incluant assemblage ; U675 ne les adopte pas tous.
  proposal: Famille Value-Added Services ; nommer le résultat exigé de chaque prestation et suivre sa conformité.
- target: D07.a / D07.b / D03 — cross-docking
  sources:
  - ELM657
  - ELM133
  relation: recouvrement partiel
  common: Demande de transit articulant des entrées et des sorties sans stockage conventionnel.
  difference: Deux documents Microsoft ne prouvent pas un consensus ; leurs affectations WMS ne se confondent pas avec le
    master plan FLOW.
  proposal: Matching arbitre la couverture et les affectations ; Fulfilment pilote le passage et ses aléas en respectant ces
    choix.
findings:
- id: F1
  target: D07.b
  assessment: Couverture présente, lisibilité insuffisante
  evidence: Service Task Management gère déjà activation, demandes, réponses, reprises et vérification de fin ; TER066 décrit
    Service Order comme formalisation facultative. Le nom Task masque la responsabilité de prestation confiée.
- id: F2
  target: D14
  assessment: Complément nécessaire, insuffisant seul
  evidence: Le catalogue décrit préparation, réception, transport et documents, sans rendre les familles picking, packing,
    VAS et cross-docking aussi visibles que demandé. Il exclut correctement les engagements et résultats individuels.
- id: F3
  target: D06 / D07.a / D07.d / D07.c
  assessment: Responsabilités déjà distribuées
  evidence: Déterminer les prestations, les coordonner, suivre les constats et rapprocher les résultats sont distincts. Ne
    pas les recopier dans une nouvelle capacité générique par opération.
- id: F4
  target: REL-SERVICE-CATALOG-PROMISING / D06.b / D07.a / D07.b
  assessment: Formulations héritées à corriger dans un lot ultérieur
  evidence: Le lien D14 vers D04 attribue encore la construction de promesse à D04 ; des scopes utilisent Availability ou
    Demand. Revoir les usages avec Order Promising D18 et Order Management D04, sans supposer que tout lien direct D14-D04
    soit invalide.
- id: F5
  target: TER066 / D07.b
  assessment: Ambiguïté objet métier et document
  evidence: TER066 définit Service Order comme un document facultatif. Rendre la prestation commandée explicite impose de
    distinguer son instance métier, sa formalisation, sa contribution au processus et les tâches internes ; un simple renommage
    Task serait insuffisant.
options:
- option: Enrichir Service Catalog seul
  recommendation: insuffisant
  reason: Décrit l’offre, pas les engagements individuels de prestation.
- option: Gestion générique des ordres conservée dans Fulfilment
  recommendation: superseded_U677_U679
  reason: La présence actuelle de D07.b ne justifie pas la frontière cible ; elle masque les familles à la maille des capacités
    entrantes.
- option: Service Order Management distinct de Fulfilment Orchestration
  recommendation: adopted_U679
  benefit: Distingue gestion des engagements de prestation et coordination d’ensemble ; maille cohérente avec Order Management.
  tradeoff: Coopérations explicites entre ordres de service et orchestration ; pas de transfert implicite du pilotage interne
    des exécutants.
proposal:
  subdomain: Service Order Management
  status: adopted_U679
  definition: Gérer les prestations confiées aux exécutants, leurs exigences, leurs engagements propres et leurs évolutions.
  capability_families:
  - service: Picking
    result: Quantités et références prélevées, manquants identifiés.
    split_condition: Prestation confiée et suivie séparément ; sinon composante explicite d’un ordre de préparation.
    capability_name: Picking Order
    name_status: Nom présenté dans l’accord U679 ; famille au niveau capacité, pas comportement.
    detail_status: Résultat et critère de séparation proposés, non adoptés globalement.
  - service: Packing
    result: Unités logistiques constituées conformément au conditionnement demandé.
    split_condition: Engagement autonome de conditionnement ; sinon composante de la préparation.
    capability_name: Packing Order
    name_status: Nom présenté dans l’accord U679 ; famille au niveau capacité, pas comportement.
    detail_status: Résultat et critère de séparation proposés, non adoptés globalement.
  - service: Value-Added Services
    result: Étiquetage, reconditionnement ou autre transformation légère conforme à la spécification demandée.
    split_condition: Traitement propre pouvant être accepté, suivi ou repris ; un ordre peut porter plusieurs activités.
    capability_name: Value-Added Service Order
    name_status: Nom présenté dans l’accord U679 ; famille au niveau capacité, pas comportement.
    detail_status: Résultat et critère de séparation proposés, non adoptés globalement.
  - service: Cross-Docking
    result: Marchandises reçues dirigées vers les départs affectés dans la fenêtre attendue.
    split_condition: Instruction de transit autonome ou exigences liées aux ordres entrants et sortants.
    capability_name: Cross-Docking Order
    name_status: Nom présenté dans l’accord U679 ; famille au niveau capacité, pas comportement.
    detail_status: Résultat et critère de séparation proposés, non adoptés globalement.
  naming: Familles au niveau Capability, noms sans suffixe Management comme les Orders entrants. Les objets Order ne constituent
    pas un niveau supplémentaire.
  boundaries:
    Order Management: Gérer les demandes à satisfaire et porter les engagements correspondants.
    Service Order Management: Gérer les prestations confiées aux exécutants, leurs exigences, leurs engagements propres et
      leurs évolutions.
    Fulfilment Orchestration: Composer et coordonner ces prestations, suivre leurs dépendances et rechercher les adaptations
      qui préservent la promesse et les équilibres du Matching.
    Service Catalog: Description de l’offre mobilisable.
    Executants: Organisation de leurs opérations internes.
  granularity_rule: Définir des ordres distincts quand les prestations se confient, acceptent, suivent ou reprennent indépendamment
    ; ne pas imposer un ordre FLOW pour chaque tâche opérateur.
  granularity_rule_status: Proposition de mise en œuvre ; non condition à la reconnaissance du sous-domaine validé.
  example: 'Exemple fictif : une commande de 100 pièces exige un nouvel étiquetage et un conditionnement magasin. Fulfilment
    peut confier une préparation composite avec ces exigences, ou des prestations distinctes si leurs prises en charge sont
    autonomes. Un prélèvement confirmé ne prouve ni l’étiquetage ni le conditionnement. Aucun cardinalité un Order = un Execution
    Order imposée.'
  example_status: Illustration fictive proposée, non accord supplémentaire.
limits:
- Aucune preuve de pratiques installées chez Beaumanoir, C-Log, Boardriders ou Sarenza.
- Étude ciblée SAP, Microsoft, Oracle et analogie TM Forum, pas classement exhaustif du marché.
- Les gestes physiques et le dispatch opérateur restent chez les exécutants au périmètre FLOW courant. Leur cartographie en
  capacités propres exigerait d’élargir explicitement le périmètre étudié.
- Découpage et frontières adoptés U679 ; application partielle au modèle réalisée U682 puis U692 ; les publications sont suivies
  par leur index. Détails non présentés encore proposés.
naming_U676:
  question: Le marché désigne-t-il un sous-domaine Execution Services ou un terme voisin ?
  finding: Des périmètres voisins sont attestés, mais aucun sous-domaine transversal standard nommé Execution Services n’a
    été établi dans le corpus consulté. Les sources décrivent des périmètres produit, une suite ou un composant ODA, pas une
    même taxonomie de sous-domaines.
  candidates:
  - name: Logistics Execution
    sources:
    - ELM662
    - ELM664
    assessment: Nom attesté SAP ; le plus direct pour regrouper picking, packing, VAS et opérations logistiques. Comprend
      une exécution opérationnelle au-delà des ordres de prestation. Deux documents SAP, pas consensus interéditeurs.
  - name: Supply Chain Execution
    sources:
    - ELM663
    - ELM662
    assessment: Catégorie englobante dont une utilisation Oracle est documentée historiquement ; périmètre entrepôt/transport
      et autres fonctions plus large que Fulfilment FLOW. SAP LE est un voisin de périmètre, pas preuve du libellé exact SCE.
  - name: Service Order Management
    sources:
    - ELM492
    - ELM129
    assessment: Nom explicite TM Forum, composant distinct du catalogue et incluant une orchestration. Analogie de prestations
      commandées, pas standard logistique ni preuve de nécessité d’un nouveau sous-domaine FLOW.
  - name: Execution Services
    sources:
    - ELM662
    - ELM492
    assessment: Composition compréhensible, sans correspondance exacte suffisamment établie dans les sources étudiées. Peut
      désigner l’offre des exécutants plus que le pilotage des engagements.
  recommendation: U679 adopte Service Order Management pour les prestations confiées, distinct de Fulfilment Orchestration.
    Appui lexical TM Forum ; frontière FLOW choisie localement, sans consensus logistique universel.
  status: updated_by_agreement_U679
agreement_U679:
  source: U679
  author: Laurent
  recorded_by: Codex
  date: '2026-09-23'
  status: accepted_scoped
  values:
    subdomain_name: Service Order Management
    boundaries:
      Order Management: Gérer les demandes à satisfaire et porter les engagements correspondants.
      Service Order Management: Gérer les prestations confiées aux exécutants, leurs exigences, leurs engagements propres
        et leurs évolutions.
      Fulfilment Orchestration: Composer et coordonner ces prestations, suivre leurs dépendances et rechercher les adaptations
        qui préservent la promesse et les équilibres du Matching.
      Service Catalog: Description de l’offre mobilisable.
      Executants: Organisation de leurs opérations internes.
    capability_level: Capability
    capability_names:
    - Picking Order
    - Packing Order
    - Value-Added Service Order
    - Cross-Docking Order
    capability_naming: Sans suffixe Management ; familles citées selon les familles retenues, pas liste exhaustive.
  values_sha256: 13e37c655c0907a2768fd1bdc64a6a9e83feadbf0dc5ef7bfbc71bed547c1f47
  exclusions:
  - Descriptions détaillées, cycles et comportements non présentés.
  - Répartition des capacités existantes non présentée.
  - Liste exhaustive des familles et preuve de réalisation installée.
  - Application au YAML canonique ou publication déduite du seul accord.
  capture_note: Accord sur proposition d’annexe. record_decision.py cible uniquement les nodes/relations existants ; capturer
    les champs canoniques sur le lot final lors de l’application, à partir de cette portée explicite.
superseded_recommendation: 'U674–U676 : conservation des ordres dans Fulfilment et seul renommage générique D07.b. Remplacée
