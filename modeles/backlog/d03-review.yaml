atp_information_U261:
  source_refs:
  - U261
  target_id: D03.i
  state: under_review
  user_clarifications:
  - ATP calcule les engagements possibles pour une promesse ou un ensemble de promesses.
  - Considérer le stock physique et ses allocations/réservations pour apprécier ce qui reste libre.
  - Considérer tout espace de stockage admissible, dont entrepôt, magasin et darkstore.
  - Considérer la disponibilité réelle, dont le délai de mobilisation selon la position et les conditions opérationnelles.
  - 'Considérer les ressources futures : exemple utilisateur d’un arrivage dans 7 jours pouvant satisfaire une promesse dans
    60 jours.'
  scope_note: Reformulation des précisions utilisateur, verbatim U261. Aucune formule, interface ou nouvelle définition intégrale
    de D03.i adoptée.
  modeling_question:
    preference: Éviter sous-capacité ; examiner variante ou niveau.
    status: resolved_by_U262
    market_comparison: CMP088
    resolution: Comportement retenu comme niveau terminal sous la capacité ; voir capability_behavior_U262.
  proposed_response:
    status: historical_proposal_superseded_by_U262
    dimensions:
    - Admissibilité des quantités
    - Périmètre spatial
    - Disponibilité opérationnelle
    - Disponibilité future
    structure: Capacité stable, dimensions combinables et variantes ou profils contextualisés ; profondeur de décomposition
      et maturité distinguées.
    study: marche/capacites-variantes-niveaux-atp.md
  limits:
  - Aucun nouveau niveau, type de nœud ou relation créé.
  - Pas de soustraction mécanique allocations/réservations sans connaître leurs recouvrements.
  - Pour plusieurs promesses, prise en compte commune des consommations ; pas de double engagement implicite.
  - RFID demeure une illustration ; D03 ne pilote pas par déduction les opérations internes des exécutants.
