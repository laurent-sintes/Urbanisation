    finality: Expliciter les apports supplémentaires qui rendraient la commande satisfaisable et les conditions nécessaires
      avant engagement.
    detail: Un arrivage déjà prévu et admissible dans la situation de référence reste pris en compte par ATP. Ici, l’apport
      supplémentaire est une hypothèse à rendre réalisable. La capacité ne crée pas l’achat ou la demande d’apport ; elle
      ne suppose pas une acquisition quand le régime est consigné. Le fournisseur ou l’exécutant concerné fournit les possibilités
      utiles. Replenishment Decision conserve l’objectif d’optimisation du stock ; tout apport pour satisfaire un Order ne
      passe pas nécessairement par cette décision.
  - id: BHV076
    candidate: P15
    source: S05
    name: Fulfillment Alternative Feasibility
    definition: Les possibilités obtenues en modifiant les modalités de satisfaction par rapport à la situation de référence.
    example: La livraison standard ne permet pas de respecter la date ; une prestation express pourrait le permettre, sous
      réserve de sa disponibilité et de son autorisation.
    finality: Rendre visibles les solutions de satisfaction nécessitant une adaptation, leurs conditions et leurs effets sur
      le service attendu.
    detail: 'Un autre magasin déjà admissible dans la référence relève d’ATP : le caractère alternatif ne suffit pas à classer
      une option dans CTP. Une substitution de produit exige une équivalence autorisée ; proximité de taille, couleur ou apparence
      ne vaut pas acceptabilité. Execution Service Decision et Execution Capacity Visibility conservent respectivement choix
      de service et information de capacité contextualisée. CTP exploite leurs résultats sans créer une seconde décision de
      service. Un changement de date déjà possible dans la référence ne devient pas automatiquement CTP.'
  - id: BHV077
    candidate: P16
    source: S06
    name: Commitment Rebalancing Feasibility
    definition: Les possibilités obtenues en révisant des engagements modifiables, en explicitant les conséquences sur les
      commandes concernées.
    example: Une commande urgente pourrait être satisfaite si une autre accepte un décalage de deux jours ; les engagements
      gelés restent préservés.
    finality: Rendre visibles les possibilités et conséquences croisées d’une révision d’engagements avant l’arbitrage collectif.
    detail: CTP ne choisit pas seul quelle commande sacrifier. Il explicite les possibilités et impacts permettant à Fulfillment
      Plan Decision d’arbitrer, avec Order Prioritization, PTP et les autres décisions utiles. La modifiabilité est une condition
      à établir, non une autorisation déduite de l’urgence. Une même ressource ne peut soutenir des possibilités collectivement
      incompatibles. Réservation opposable et gel restent respectés ; aucune libération ou révision implicite. Promise Revision
      conserve la modification autorisée de l’engagement et Supply Reassignment l’application des liens révisés.
  boundary: '[CTP](model:D03.j) établit les possibilités sous adaptation et leurs conséquences. [Fulfillment Plan Decision](model:D03.o)
    détermine le scénario collectif cohérent maximisant la valeur multidimensionnelle, en mobilisant les décisions spécialisées.
    [Supply Assignment](model:D02.e) applique les affectations retenues ; [Promise Management](model:D03.n) porte les modifications
    autorisées de promesse. Le résultat de faisabilité ne réserve pas, ne modifie pas un Order ou une politique et ne déclenche
    pas l’exécution. Les trois comportements peuvent se combiner sans séquence imposée.'
  decomposition_rationale: 'Distinguer trois leviers métier : obtenir davantage de ressources, changer la solution de satisfaction,
    ou réexaminer des engagements existants. Les conditions, les parties concernées et les conséquences diffèrent réellement.
    La décomposition rend explicite ce qui doit changer pour rendre une commande satisfaisable, sans confondre faisabilité,
    choix collectif et application. Plusieurs leviers peuvent se combiner.'
