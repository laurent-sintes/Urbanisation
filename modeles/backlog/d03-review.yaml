    D03: Satisfaction des Orders.
    D05: Gestion du stock.
  proposed_interpretation: D05 cherche les niveaux et la répartition souhaitables du stock et les ajustements nécessaires
    ; D03 cherche les solutions de satisfaction des Orders, y compris les adaptations de ressources envisagées par CTP. Une
    même opération de transfert peut servir les deux finalités sans établir un doublon de capacité.
  limits: U219 adopte les finalités des domaines ; U220 retient Inventory Optimization comme nom de D05. Noms des capacités,
    descriptions détaillées et règles restent proposés. Le réapprovisionnement automatique est une piste de périmètre U221
    ; aucun ajout de capacité, fusion ou publication.
  analysis_path: marche/operational-balancing-order-promising.md
  history_before_U219:
    date: '2026-09-15'
    source_refs:
    - U218
    state: user_clarified
    user_statement: |-
      D03 tente d'assouvir les orders.
      D05 tente de gérer le stock
    adopted_orientation:
      D03: Satisfaction des Orders.
      D05: Gestion du stock.
    proposed_interpretation: D05 cherche les niveaux et la répartition souhaitables du stock et les ajustements nécessaires
      ; D03 cherche les solutions de satisfaction des Orders, y compris les adaptations de ressources envisagées par CTP.
      Une même opération de transfert peut servir les deux finalités sans établir un doublon de capacité.
    limits: Aucun nom, définition détaillée, fusion, retrait ou publication adopté par cette clarification. D01 conserve suivi,
      mouvements, visibilité, inventaire, protection et réservation ; frontière détaillée avec D05 à préciser. La formulation
      existante de Supply Assignment incluant des besoins prévisionnels reste à éprouver face à ce repère, sans changement
      automatique de sa portée validée.
    analysis_path: marche/operational-balancing-order-promising.md
  adopted_finalities_U219:
    D01: Connaître et fiabiliser le stock, enregistrer ses mouvements, le protéger et le réserver.
    D03: Décider comment satisfaire les Orders avec les ressources disponibles ou adaptables.
    D05: Décider du stock souhaitable et des ajustements nécessaires.
