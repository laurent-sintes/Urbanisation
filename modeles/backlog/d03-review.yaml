  supply_assignment_review:
    question: Quelles aptitudes durables distinctes sont masquées par le nom ?
    candidate_outcomes:
    - name: Scenario Simulation
      state: under_instruction
      definition: Mesurer les conséquences globales d’un scénario de promesse ou d’adaptation sur le carnet de commandes,
