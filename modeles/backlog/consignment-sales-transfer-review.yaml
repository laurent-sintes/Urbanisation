common_boundaries: D04 porte les demandes et leur résultat attendu, D03/D05 les décisions, D01 les faits/régimes de stock,
  D06 les prestations. Lifecycle/Structuring/Archiving restent disponibles et les opérations utiles doivent être expliquées
  dans chaque contexte métier.
combination: Les comportements ne sont ni une séquence obligatoire ni tous exclusifs. Intercompany est un axe de relation
  commerciale ; les autres parcours décrivent principalement le mode de satisfaction. Identifier les quantités concernées
  et ne pas additionner des stocks ou attendus deux fois.
deferred_details: Règles de gestion, cas spécifiques et nouveaux liens détaillés restent à instruire si nécessaires ; pas
  de chantier de requalification des liens au titre de U398/U399.
