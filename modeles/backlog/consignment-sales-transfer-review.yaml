id: GROUPED-CONSIGNMENT-SALES-TRANSFER-U400
as_of: '2026-09-18'
status: integrated_U401
source_refs:
- U400
- U399
- U398
- ELM240
- CMP151
- U401
purpose: Traiter ensemble les trois capacités restantes, sans nouvel audit ni remaniement des liens.
groups:
- capability_id: D01.h
  name: Consigned Inventory Management
  decomposition_rationale: Les obligations sur le stock diffèrent selon consommation, durée contractuelle ou sortie sans acquisition
    ; expliciter ce qui change la propriété et ce qui met fin à la détention évite de confondre mouvement et achat.
  market_position: Microsoft et Oracle documentent acquisition à consommation, échéance et retours. Les sorties vers soldeur,
    seconde main ou destruction sont le besoin FLOW U391 ; couverture globale de ces issues non établie. Consignment Exit
    est un libellé de synthèse FLOW, plus large que les retours documentés.
  candidates:
  - name: Consumption-Based Ownership Transfer
    definition: Appliquer le transfert de propriété lors de la vente ou consommation prévue par l’accord, en identifiant les
      quantités et faits déclencheurs.
    example: Vingt pièces vendues deviennent acquises au fournisseur selon les conditions convenues ; les autres restent consignées.
    benefit: Distinguer utilisation autorisée, acquisition et stock restant fournisseur.
    source_ids:
    - G01
    - G02
    boundary: Le contrat fixe l’événement ; Purchase Order et finance portent leurs suites. Aucun automatisme vente = acquisition
      universel.
    status: integrated_U401
    node_id: BHV063
    adopted_definition: Appliquer le transfert de propriété lors de la vente ou consommation prévue par l’accord.
  - name: Aging-Based Ownership Transfer
    definition: Appliquer l’acquisition des quantités encore consignées lorsque leur durée contractuelle de détention arrive
      à échéance.
    example: Un accord prévoit l’acquisition des pièces encore présentes après 90 jours.
    benefit: Rendre visibles les obligations liées au temps indépendamment des ventes.
    source_ids:
    - G02
    boundary: Illustration conditionnelle, sans acquisition forcée de tout stock à échéance ni règle Beaumanoir présumée.
    status: integrated_U401
    node_id: BHV064
    adopted_definition: Appliquer l’acquisition à l’échéance d’une durée contractuelle.
  - name: Consignment Exit
    definition: Appliquer une sortie autorisée du régime de consignation ou de la détention, par reprise fournisseur ou autre
      filière prévue, en conservant les droits, autorisations et liens aux opérations nécessaires.
    example: En fin de saison, un reliquat est repris et un autre orienté vers une filière seconde main autorisée.
    benefit: Expliciter le devenir des quantités non consommées sans achat fictif ni autorisation implicite.
    source_ids:
    - G03
    boundary: Renvoi, soldeur, seconde main, destruction seulement selon accord/décision ; cette capacité applique l’issue
      retenue, elle n’en optimise pas le choix. Supplier Return, Sales Order, Transfer Order et D06 mobilisés selon le cas.
    status: integrated_U401
    node_id: BHV065
    adopted_definition: 'Prendre en charge une sortie autorisée de la consignation ou de la détention : reprise fournisseur,
      orientation vers un soldeur, seconde main ou destruction selon l’accord et la décision retenue.'
  behavior_ids:
  - BHV063
  - BHV064
  - BHV065
- capability_id: D04.i
  name: Sales Order
  decomposition_rationale: Livraison, retrait, livraison fournisseur et relation intersociétés changent la prise en charge
    de la commande, la preuve de satisfaction et les engagements à coordonner. Ces parcours doivent se lire dans la capacité.
  market_position: Shipping/Pickup et Direct delivery sont documentés par Microsoft ; Intercompany constitue une dimension
    de relation commerciale combinable avec un parcours de livraison. Il ne s’agit pas de quatre catégories mutuellement exclusives.
  candidates:
  - name: Ship to Customer
    definition: Prendre en charge une commande à livrer au client depuis le réseau de stockage et suivre les quantités remises
      au client et restant à servir.
    example: Une commande est expédiée depuis un entrepôt ou un magasin.
    benefit: Expliciter la satisfaction par livraison à destination.
    source_ids:
    - G04
    boundary: D03 décide source/promesse ; D06 orchestre préparation et transport. Pas de comportement par entrepôt ou magasin.
    status: integrated_U401
    node_id: BHV066
    adopted_definition: 'Prendre en charge la commande à livrer au client depuis le réseau : entrepôt, magasin ou autre lieu
      admissible.'
  - name: Customer Pickup
    definition: Prendre en charge une commande à mettre à disposition puis à remettre au client dans le lieu convenu, en distinguant
      disponibilité pour retrait et retrait effectif.
    example: Commande web retirée en magasin ; prête ne signifie pas remise au client.
    benefit: Expliciter l’engagement de mise à disposition et la preuve de retrait.
    source_ids:
    - G04
    boundary: Pas de règle universelle de paiement ou de réservation ; non-retrait traité selon politique et cycle de vie.
    status: integrated_U401
    node_id: BHV067
    adopted_definition: Prendre en charge la mise à disposition et le retrait au lieu convenu. Une commande prête reste distincte
      d’une commande effectivement retirée.
  - name: Direct Delivery
    definition: Prendre en charge une commande dont le fournisseur livre directement le client, en coordonnant les attendus
      de vente et d’achat.
    example: Une commande client est servie par le fournisseur sans passage par notre stock.
    benefit: Conserver la responsabilité envers le client tout en suivant une livraison externe.
    source_ids:
    - G05
    boundary: 'Comportement distinct de Direct Delivery sous Purchase Order : ici attendu client, là engagement fournisseur
      ; réalisations liées, pas fusion.'
    status: integrated_U401
    node_id: BHV068
    adopted_definition: Prendre en charge la commande dont le fournisseur livre directement le client, en coordonnant les
      attendus de vente et d’achat.
  - name: Intercompany Sales
    definition: Prendre en charge la vente entre entités juridiques du groupe et maintenir la cohérence avec la demande d’achat
      correspondante.
    example: Une entité vend à une autre, éventuellement avec livraison directe au client final.
    benefit: Rendre explicites les engagements réciproques entre sociétés.
    source_ids:
    - G06
    boundary: Peut se combiner avec un mode de livraison ; ni simple transfert de lieu ni reprise de la fiscalité/comptabilité.
    status: integrated_U401
    node_id: BHV069
    adopted_definition: Prendre en charge une vente entre entités juridiques du groupe, avec cohérence entre engagements de
      vente et d’achat.
  behavior_ids:
  - BHV066
  - BHV067
  - BHV068
  - BHV069
- capability_id: D04.k
  name: Transfer Order
  decomposition_rationale: 'Les transferts servent des intentions distinctes : démarrer un stock, l’alimenter, le rééquilibrer,
    le regrouper ou satisfaire une commande identifiée. L’attendu et la justification doivent rester lisibles même lorsque
    le transport ou l’outil est commun.'
  market_position: Microsoft documente le réassort, le rééquilibrage et les transferts liés aux ventes ; Oracle et Nextail
    documentent rééquilibrage/regroupement ; SAP Retail historique appuie l’implantation. Les cinq comportements forment une
    proposition FLOW, pas une taxonomie éditeur copiée.
  candidates:
  - name: Initial Stocking
    definition: Prendre en charge les transferts constituant le stock de départ d’un lieu pour un lancement, une saison ou
      une capsule.
    example: Acheminer les quantités d’implantation depuis l’entrepôt vers les magasins.
    benefit: Expliciter l’attendu de démarrage.
    source_ids:
    - G11
    boundary: Initial Stocking Decision dimensionne le besoin ; Transfer Order porte les départs et arrivées attendus.
    status: integrated_U401
    node_id: BHV070
    adopted_definition: 'Porter les transferts constituant le stock de départ : implantation d’une saison, d’une capsule ou
      d’un nouveau lieu.'
  - name: Continuous Replenishment
    definition: Prendre en charge les transferts successifs alimentant un lieu pendant l’activité selon le besoin retenu.
    example: Réassortir un magasin depuis l’entrepôt au fil de la saison.
    benefit: Expliciter l’alimentation récurrente.
    source_ids:
    - G07
    - G08
    boundary: Replenishment Decision décide le besoin ; mêmes noms que l’apport consigné, mais ressource déjà présente ailleurs
      dans le réseau.
    status: integrated_U401
    node_id: BHV071
    adopted_definition: Porter les transferts alimentant régulièrement un lieu pendant l’activité.
  - name: Inventory Rebalancing
    definition: Prendre en charge les transferts retenus pour rééquilibrer les stocks entre lieux en conservant leur justification
      donneur/receveur.
    example: Déplacer des pièces d’un magasin disposant d’un excédent vers un magasin qui en manque.
    benefit: Rendre visible la correction d’un déséquilibre.
    source_ids:
    - G09
    - G08
    boundary: Stock Redistribution Decision choisit ; ce comportement gère les Orders et leur satisfaction.
    status: integrated_U401
    node_id: BHV072
    adopted_definition: Porter les transferts corrigeant un déséquilibre entre lieux, par exemple d’un magasin disposant d’un
      excédent vers un magasin qui manque de stock.
  - name: Stock Consolidation
    definition: Prendre en charge les transferts regroupant des stocks dispersés pour reconstituer un assortiment ou concentrer
      des reliquats vers des lieux adaptés.
    example: Rassembler des tailles dispersées sur les magasins retenus, ou rapatrier des reliquats.
    benefit: Distinguer regroupement et simple alimentation courante.
    source_ids:
    - G09
    - G10
    boundary: Décision de redistribution distincte ; ni consolidation de bacs interne entrepôt ni automatisme de fin de saison.
    status: integrated_U401
    node_id: BHV073
    adopted_definition: 'Porter les transferts regroupant des stocks dispersés : reconstitution de tailles, concentration
      ou rapatriement de reliquats.'
  - name: Order-Driven Transfer
    definition: Prendre en charge un transfert nécessaire à la satisfaction d’une commande identifiée, en conservant le lien
      et l’échéance de cette commande.
    example: Acheminer une pièce dans le magasin où le client doit la retirer.
    benefit: Distinguer un engagement pour une demande identifiée d’un apport au stock général.
    source_ids:
    - G08
    boundary: D03 retient la réponse ; la promesse client et la réservation restent distinctes du transfert.
    status: integrated_U401
    node_id: BHV074
    adopted_definition: Porter un transfert nécessaire à une commande identifiée, en conservant son lien et son échéance.
  behavior_ids:
  - BHV070
  - BHV071
  - BHV072
  - BHV073
  - BHV074
