      transversales. Enregistrement, révision, visibilité et rapprochement sont absorbés dans ce découpage selon U214. Les
      [Supply Orders](glossary:TER065) restent distincts des Cases, Agreements et [Service Orders](glossary:TER066). D03 conserve
      priorités, couverture et promesse ; D07 les besoins, engagements et faits de prestation. Les règles détaillées par type,
      les effets croisés, les cardinalités et la volumétrie restent à instruire en Q077. Aucun ordre de production ou de transport
      ajouté par déduction.'
