    name: Order Management
    definition: Piloter les Orders transactionnels de la Supply par type de commande — vente, achat, transfert, retour client
      et retour fournisseur — et maîtriser leur structuration et leur progression. Connaître leur contenu applicable, leurs
      évolutions, leur situation et leur reste à satisfaire, en distinguant conditions contractuelles, promesses et prestations
      d’exécution.
    finality: Disposer de commandes explicites et traçables pour savoir ce qui doit être satisfait, comment la demande est
      organisée et ce qui peut progresser ou reste bloqué.
