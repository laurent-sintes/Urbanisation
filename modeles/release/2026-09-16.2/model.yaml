      les apports nécessaires ; les capacités opérationnelles appliquent les décisions, déclenchent les Orders utiles et organisent
      leur mise en action selon les règles et autorisations applicables.
    context: Sens de travail proposé, aligné sur la frontière analytique/opérationnelle U224 et la refonte D05 U235.
    notes: '[Replenishment Decision](model:D05.e) intègre les calculs des besoins nets et détermine les quantités et dates
      à retenir. La décision, la mise à jour transactionnelle, les Orders nécessaires, leurs promesses et les mouvements physiques
      restent distincts. Une application automatique est possible ; aucune création directe de Purchase Order ni validation
      humaine systématique n’est présumée.'
