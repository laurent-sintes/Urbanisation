- id: D04.i
  revision: 1
  kind: capability
  layer: transactional
  fields:
    name: Sales Order Management
    definition: 'Gérer les commandes clients à satisfaire : enregistrer ce qui est demandé, maintenir les quantités, destinations
      et échéances applicables, suivre les évolutions autorisées et déterminer ce qui reste à servir.'
    finality: Disposer d’une commande client exploitable et d’un reste à satisfaire explicable pendant son traitement.
    nature: action
    scope: |-
      Type de commande : [Sales Order](glossary:TER069).

      Enregistrer l’origine et le contenu applicable, intégrer les modifications autorisées avec leur historique, rendre la situation consultable et rapprocher les réalisations pour déterminer le reste à satisfaire. Les transformations de structure mobilisent [Order Structuring](model:D04.n) ; les autorisations et restrictions de progression mobilisent [Order Lifecycle Management](model:D04.o). Ces capacités transversales sont des responsabilités complémentaires, pas des sous-capacités répétées sous chaque type.

      Une commande client peut comporter plusieurs lignes et échéances. Exemple fictif : sur 100 pièces commandées, 60 sont livrées et 40 restent à servir, avant prise en compte des annulations ou ajustements autorisés. Une demande de report des 40 pièces doit préciser la date demandée ; elle ne change pas automatiquement la promesse confirmée. Un retour ultérieur donne lieu à une commande de retour distincte, reliée à l’origine lorsque connue, et non à l’effacement de la livraison.

      Les conditions contractuelles restent des références ; cette capacité ne confère pas l’autorité de négocier ou de modifier un Agreement. Priorités, couverture et promesses restent dans Order Promising ; prestations, engagements et faits d’exécution dans D07 et le contexte Services. Les règles d’imputation, tolérances, autorisations et effets sur les réservations sont à instruire. Les exemples sont fictifs et ne prouvent aucun déploiement.
