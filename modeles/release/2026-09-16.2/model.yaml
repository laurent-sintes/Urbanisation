    definition: 'Gérer les commandes d’achat adressées aux fournisseurs : maintenir les biens, quantités, destinations et
      échéances attendus, intégrer les évolutions autorisées et rapprocher les réceptions pour connaître le reste à recevoir.'
    finality: Suivre ce qui est commandé au fournisseur, ce qui a évolué et ce qui reste attendu.
