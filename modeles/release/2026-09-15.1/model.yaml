principles:
- id: PRINCIPLE-REFERENCE-PROJECTIONS
  statement: Les référentiels de la Supply sont des projections de sources de vérité maîtrisées par des produits tiers. Chaque
    référentiel comporte au moins une ingestion ; visibilité et recherche sont en lecture seule. L’ingestion actualise la
    projection sans transférer la maîtrise ; administration et validation métier des données maîtresses restent externes.
    Cette règle ne préjuge pas de l’autorité sur les commandes ni des états transactionnels propres à la Supply.
  source_refs:
  - U134
  - C75
  revision: 1
  last_modified: '2026-09-13T17:35:31.972815Z'
  content_sha256: d95ae42f5a33eaba83763612c47896ff11f906721aa48f8d17a24cd2a5c931e1
- id: PRINCIPLE-TWO-LAYERS
  statement: Socle transactionnel et modèle processus distincts ; chacun possède ses objets, sa persistance et son urbanisation.
  source_refs:
  - U18
  - U19
  - U20
  - U49
  - U50
  - U62
  revision: 1
  last_modified: '2026-09-13T15:39:21.359705Z'
  content_sha256: 2eff74ee15b64139872ef75cbd61b73e25d1178433231110530d09b1f7e7414d
- id: PRINCIPLE-CAPABILITY
  statement: Une capacité décrit ce que sait faire l’entreprise indépendamment de son organisation et de ses outils.
  source_refs:
  - U33
  revision: 1
  last_modified: '2026-09-13T15:39:21.359705Z'
  content_sha256: 8c62457d9da8dc7e2defc990f5f1e4efb3c1e5eaf51ff3dbc1138b58f508916b
- id: PRINCIPLE-SUPPLY-DOCUMENTS
  statement: Supply générique orientée documents d’autorisation ; les parcours commerciaux appartiennent au modèle processus.
  source_refs:
  - U100
  revision: 1
  last_modified: '2026-09-13T15:39:21.359705Z'
  content_sha256: 876694c80b423265ff73a38f9f588c9560acef7a44ce498acbcc4d9e92b95afd
- id: PRINCIPLE-FLOW-LOGISTICS
  statement: Logistique hors développement FLOW, en adhérence ; autonomie C-Log conservée.
  source_refs:
  - U58
  revision: 1
  last_modified: '2026-09-13T15:39:21.359705Z'
  content_sha256: 1be43e545fa8b13b1ec05e04e9dfa2f19a8144d0a950ff9c5e65fe6e7fbfeeec
- id: PRINCIPLE-ORDER-AGREEMENT
  statement: Commandes distinctes des Agreements de référence.
  source_refs:
  - U98
  revision: 1
  last_modified: '2026-09-13T15:39:21.359705Z'
  content_sha256: 3564bac9498b5f1a36db799cc5bb62633830dcf82ee38e80bc7eb42902e62eca
- id: PRINCIPLE-CASE-SUPPLY-ORDERS
  statement: Business Services porte le traitement des demandes et problèmes des parties prenantes ; le Case en est un dossier
    de traitement. Supply pilote ses Orders, pour toutes natures de commandes, clients et volumes. Les Service Orders portent
    les prestations confiées au contexte Services exécutant. Les modèles gardent leurs définitions propres et des contrats
    explicites, sans cardinalité ni cycle universel imposé.
  source_refs:
  - U169
  - U173
  - U202
  revision: 2
  last_modified: '2026-09-14T14:48:57.795811Z'
  content_sha256: cea58040eb90c84a908a36aa60aa11e7f0f5755173bc33aaefa4caa96903e468
- id: PRINCIPLE-TO-PROMISE
  statement: 'D03 distingue ATP, CTP et PTP : établir une promesse dans les ressources et engagements admissibles, proposer
    un plan d’adaptation, puis comparer les conséquences économiques des scénarios. Le CTP local est plus large que les acceptions
    éditeur consultées.'
  source_refs:
  - U154
  - U156
  - U202
  revision: 1
  last_modified: '2026-09-14T14:48:57.795811Z'
  content_sha256: 3a33188a18bab605568fea95e55f02af072b182030059b4034479e54119bffc0
limitations:
- Les 37 capacités du modèle figé sont publiées ; la publication ne valide pas leurs définitions, noms ou rattachements.
- approved_fields et les décisions associées délimitent les aspects validés ; proposed_fields restent à valider.
- Les validations contextuelles restent partielles ; le réexamen du rattachement de Reservation demeure visible.
- Les alternatives non intégrées et les illustrations restent dans le backlog.
- Le modèle processus détaillé reste à construire ; les autorités et frontières ouvertes ne sont pas arbitrées par cette publication.
