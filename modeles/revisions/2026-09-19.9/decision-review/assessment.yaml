reviewer: Codex — réexamen explicite U484 de la portée du nom Authoritative Data
items:
- decision_id: ADOPT-U482-AUTHORITATIVE-DATA-NAME
  action: retain
  rationale: Le nom Authoritative Data adopté U482 est strictement inchangé, empreinte comprise. La fiche décrit désormais
    sa finalité, sa définition, ses limites et son autorité locale U479, avec un exemple de conditionnement ; les six référentiels
    restent distincts, la maîtrise d’entreprise externe et les responsabilités transactionnelles inchangées. Les relations,
    le glossaire, les sources d’inspiration et le niveau de groupe sont conservés. Reprise limitée au seul nom ; aucune adoption
    des nouvelles formulations ou de l’exemple.
