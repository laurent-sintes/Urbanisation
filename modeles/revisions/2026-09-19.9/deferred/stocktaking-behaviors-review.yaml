    name: Periodic Physical Inventory
    definition: Fiabiliser l’ensemble du stock d’un périmètre défini lors d’une campagne à une date ou période de référence,
      en rapprochant constats physiques et quantités enregistrées.
    decomposition_rationale: 'Politique de vérification complète : établir une référence cohérente pour le périmètre choisi,
      sans imposer une fréquence annuelle ou une fermeture.'
