scope:
- SAP S/4HANA Material/Product
- SAP Retail Article
- SAP EWM Handling Unit
- Microsoft Dynamics 365 SCM
- Microsoft Business Central
- GS1 identities and packaging
concepts:
- id: product_reference
  candidate_name: Product / Item Reference
  candidate_definition: Référence décrivant ce dont on gère des quantités ; modèle, variante et unité commerciale à distinguer
    selon le contexte.
  source_ids:
  - S01
  - S02
  - M01
  - M02
  - G01
  state: ai_proposed
- id: quantity_uom
  candidate_name: Quantity + Unit of Measure
  candidate_definition: Quantité et unité de mesure ; conversions et règles de quantité propres aux opérations.
  source_ids:
  - S03
  - M04
  - M07
  state: ai_proposed
- id: physical_goods
  candidate_name: Goods
  candidate_definition: Biens matériels ; suivi en quantités ou par occurrences identifiées selon les besoins.
  source_ids:
  - S05
  - S06
  - M06
  - G01
  state: ai_proposed
- id: packaging_reference
  candidate_name: Packaging / Pack Configuration
  candidate_definition: Type ou composition de conditionnement de référence ; distinct du colis réellement constitué.
  source_ids:
  - S02
  - M02
  - G03
  state: ai_proposed
- id: logistic_unit
  candidate_name: Logistic Unit
  candidate_definition: Ensemble physique constitué pour être manutentionné, stocké ou transporté ; identité et contenu propres.
  source_ids:
  - S04
  - M05
  - G02
  state: ai_proposed
- id: inventory_position
  candidate_name: Inventory Position
  candidate_definition: Représentation de quantités selon dimensions de position et état ; ne constitue pas un bien supplémentaire.
  source_ids:
  - S05
  - M06
  state: ai_proposed
- id: shipment
  candidate_name: Shipment / Delivery
  candidate_definition: Regroupement ou opération d’acheminement à définir dans son contexte ; les deux termes ne sont pas
    synonymes adoptés.
  source_ids:
  - M05
  - G02
  state: ai_proposed
findings:
- id: F-U176-01
  statement: Le SKU ne désigne pas universellement une pièce physique indivisible.
  basis:
  - S02
  - S03
  - M03
  - M04
  - M07
  - G03
  - G04
  qualification: documented_counterexamples
  local_status: ai_proposed
- id: F-U176-02
  statement: Material Master SAP est une référence transversale ; Material ne se réduit pas à matière première.
  basis:
  - S01
  qualification: documented
  local_status: ai_proposed
- id: F-U176-03
  statement: Le nom Article chez SAP Retail couvre plusieurs catégories et grains ; il ne suffit pas à identifier la variante
    stockée.
  basis:
  - S02
  qualification: documented
  local_status: ai_proposed
- id: F-U176-04
  statement: D365 SCM et Business Central utilisent des concepts et sens de SKU qu’il faut distinguer.
  basis:
  - M01
  - M02
  - M03
  qualification: documented
  local_status: ai_proposed
- id: F-U176-05
  statement: Référence, quantité, lot/exemplaire et unité logistique sont distincts ; leurs rôles peuvent se combiner.
  basis:
  - S04
  - S05
  - S06
  - M05
  - M06
  - G01
  - G02
  qualification: cross_model_synthesis
  local_status: ai_proposed
- id: F-U176-06
  statement: La divisibilité doit être qualifiée par règle de gestion et opération, sans la déduire du code de référence.
  basis:
  - S02
  - M04
  - M07
  - G03
  - G04
  qualification: local_recommendation
  local_status: ai_proposed
- id: F-U176-07
  statement: Resource peut exprimer un rôle mobilisable sans imposer un type d’objet commun aux articles et aux lieux.
  basis:
  - U175
  - U176
  qualification: local_recommendation
  local_status: ai_proposed
