- local_concept: product_reference
  sap: Material/Product ; Article générique, variante ou structuré en Retail
  microsoft_scm: Product/master/variant ; Released product par entité
  microsoft_business_central: Item et variantes ; SKU pour données spécifiques lieu/variante
  gs1: Trade item class / GTIN
  source_ids:
