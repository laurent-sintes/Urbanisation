  - S02
  - M01
  - M02
  - M03
  - G01
  equivalence: partial
- local_concept: quantity_uom
  sap: Base UoM, appelée aussi stockkeeping unit en MM-IM
  microsoft_scm: Unités, conversion, précision
  microsoft_business_central: Base unit et alternatives
  gs1: Quantités, mesures et qualifications commerciales
  source_ids:
  - S03
  - M04
  - M07
  - G03
  - G04
  equivalence: partial
- local_concept: physical_goods
  sap: Material + quantité, Batch/Serial lorsque suivis
  microsoft_scm: Item et dimensions Batch/Serial, quantité
  microsoft_business_central: Suivi détaillé non audité
  gs1: Lot ou exemplaire identifié en complément du GTIN
  source_ids:
  - S05
  - S06
  - M06
  - G01
  equivalence: partial
- local_concept: logistic_unit
  sap: Handling Unit
  microsoft_scm: Container ; License plate selon le processus
  microsoft_business_central: Non audité
  gs1: Logistic Unit / SSCC
  source_ids:
  - S04
  - M05
  - G02
  equivalence: partial
  note: Objet et identifiant ne sont pas interchangeables ; aucune identité HU=Container=License plate=SSCC.
examples:
- id: EX-U176-01
  context: Produits finis Beaumanoir
  scenario: Un modèle décliné couleur/taille ; douze pièces dans un carton.
  lesson: Référence opérationnelle, quantité et identité du carton distinctes.
  status: illustrative_not_installed
- id: EX-U176-02
  context: Fabrication à façon, U48
  scenario: Référence de tissu avec 27,5 mètres suivis et un rouleau physique.
  lesson: La longueur commandée ne se confond pas avec l’identité du rouleau.
  status: illustrative_not_installed
- id: EX-U176-03
  context: Assortiment de tailles
  scenario: Un pack commercial contient plusieurs tailles et peut être déconditionné si autorisé.
  lesson: Composition commerciale et colis physique distincts ; règles à établir.
  status: illustrative_not_installed
- id: EX-U176-04
  context: Reconditionnement
  scenario: Douze vêtements passent d’un carton à deux cartons.
  lesson: Regroupements logistiques modifiés, quantité de vêtements conservée dans cet exemple.
  status: illustrative_not_installed
- id: EX-U176-05
  context: Besoins Boardriders de promesse sur ressources futures
  scenario: Promesse examinée avant constitution des colis finaux.
  lesson: Ne pas imposer une HU existante pour représenter toutes les ressources candidates ; admissibilité à vérifier.
  status: illustrative_not_installed
model_impacts:
- target_ids:
  - D08
  - D08.d
  assessment: Autorité externe et autonomie des références cohérentes.
  proposal: Préciser grain de la référence et convention SKU ; examiner unités et compositions reçues.
  change_now: false
- target_ids:
  - TER004
  assessment: Définition locale article/unité de gestion ambiguë entre bien et référence.
  proposal: Décrire une référence opérationnelle permettant de distinguer et gérer des quantités de biens.
  change_now: false
- target_ids:
  - D01
  assessment: Différencier les vues du contenu, de l’unité logistique et de la position.
  proposal: Qualifier les règles de comptage et la représentation des emballages.
  change_now: false
- target_ids:
  - D03
  - D02.e
  assessment: Ressources présentes/futures et conditionnements physiques sont des grains différents.
  proposal: Qualifier les ressources sans exiger des colis déjà constitués.
  change_now: false
- target_ids:
  - D07
  - D13
  assessment: Prestations exécutantes, lieux et biens ont leurs responsabilités propres.
  proposal: Éprouver les liens utiles sans fusion Resource ni nouvelles capacités techniques.
  change_now: false
open_questions:
- Quel sens local précis donner à Item/SKU et à sa divisibilité selon les opérations ?
- Quels conditionnements sont de simples unités de mesure, des références commerciales composées ou des unités logistiques
  physiques ?
- Quel niveau de traçabilité FLOW doit-il recevoir des exécutants, sans porter leur organisation interne ?
constraints:
- Point 6 clos ; aucune reprise de son débat.
- Domaines Business Services différés.
- Aucun nouveau nœud ou lien du modèle actif, ni capacité proposée automatiquement depuis une fonction produit.
- Aucune maîtrise des références transférée à FLOW.
- Aucune équivalence universelle des schémas ni configuration installée supposée.
definition_clarification:
  source_ref: U181
  path: marche/etudes/2026-09-14-articles-biens-unites-logistiques/article-definition-comparison.json
  finding: SAP possède une définition explicite proche de l’intuition U176 ; la synthèse par les catégories et la réserve
    sur SKU doivent être lues avec ce complément.
  adoption: false
