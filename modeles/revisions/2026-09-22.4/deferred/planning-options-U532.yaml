b2b_interpretation:
  meaning: Le plan de demande combine anticipation et demandes connues ; Demand Planning ne se réduit pas à une extrapolation
    statistique des ventes.
  market_support: Oracle Forecast Processing illustre le rapprochement de prévisions et commandes ouvertes, situé dans le
    traitement pour Supply Planning. Cela confirme le besoin de cohérence, pas le même mécanisme dans MAP.
  open: Aucune règle de consommation, de pondération ou d’affermissement des précommandes définie ici.
  source_refs:
  - U532
  - ELM558
preserved_boundaries:
- Order Backlog Planning reste dans l’opérationnel (U528).
- Inventory Planning reste à examiner ; aucune assimilation automatique à Supply Planning.
- 'Réassort opérationnel : piste U529, sans transfert implicite.'
- Les décisions spécialisées demeurent distinctes ; les deux capacités de Planning peuvent les mobiliser.
- La piste PLM reste ouverte ; un produit logiciel ne définit pas un Domain.
- Aucun chantier commerce anticipé ni extension du catalogue Information.
