as_is_fact:
  application: MAP
  statement: Demand Planning dans MAP prend également en compte les précommandes B2B reçues tôt dans le processus d’allocation.
  source_refs:
  - U532
  limits: Statut ferme ou provisoire, sens exact d’allocation, interfaces et effets de consommation des prévisions non établis.
recommendation:
  option: A
  summary: Une Area Planning dans Supply Chain Orchestration, regroupant deux capacités candidates Demand Planning et Supply
    Planning.
  rationale: Les deux responsabilités participent au même plan d’ensemble régulièrement actualisé. Les besoins et les possibilités
    de couverture doivent se confronter sans imposer un Domain transverse non encore défini.
  benefit: Lisibilité des responsabilités et coopération rapprochée, continuité avec le rattachement U530, sans duplication
    du même Planning dans plusieurs périmètres.
  tradeoff: Expliciter ce qui relève de la prévision/du plan de demande, des objectifs commerciaux ou financiers, et du plan
    de couverture. Deux capacités constituent un point de départ, pas une exhaustivité démontrée.
option_A:
  domain: Supply Chain Orchestration
  area_name_proposed: Planning
  existing_area_id_if_adopted: D17
  capabilities_proposed:
  - name: Demand Planning
    definition: Construire, comparer et actualiser le plan de demande à couvrir en rapprochant les prévisions, les ventes
      observées et les demandes déjà connues, dont les précommandes B2B.
    question: Quels besoins anticipe-t-on, pour quels produits et à quelles échéances ?
    boundary: Le plan de demande ne crée pas l’engagement client, ne suit pas le cycle de vie de sa commande et ne réalise
      pas l’affectation Supply. Les statuts des demandes reçues sont conservés.
    source_refs:
    - U532
    - U531
    - ELM557
    - ELM556
  - name: Supply Planning
    definition: Construire, comparer et actualiser le plan de couverture des besoins par les approvisionnements et ressources
      mobilisables, en coordonnant les décisions spécialisées.
    question: Comment couvrir ces besoins, avec quels apports et à quelles échéances ?
    boundary: Le plan prépare la mise en action par les capacités responsables ; il ne reprend pas automatiquement leurs décisions,
      l’émission ou le cycle de vie des Orders, les affectations ni les engagements.
    source_refs:
    - U530
    - U529
    - ELM557
    - ELM552
  cooperation: Le plan de demande éclaire la couverture ; les possibilités et écarts Supply alimentent le réexamen des scénarios.
    Pas de chaîne strictement à sens unique ni de logiciel imposé.
  name_rationale: Planning est lisible dans le contexte du Domain Supply. Le nom de travail D17 Supply Planning pourrait alors
    être réservé à la capacité ; aucun renommage automatique.
  market_comparisons:
  - vendor: Oracle
    product: Fusion Cloud Supply Chain Planning
    element_name: Overview of Supply Chain Planning Plan Types
    element_type: Périmètre fonctionnel ou type de plan de produit
    relationship: Recouvrement partiel
    similarities: Distinguer la demande à anticiper et les moyens Supply pour la couvrir, tout en permettant un plan intégré.
    differences: Oracle catalogue des types de plans ; les niveaux Area et Capability sont propres à FLOW.
    flow_position: Proposer une Area Planning contenant Demand Planning et Supply Planning ; conserver les responsabilités
      opérationnelles spécialisées.
    source_title: Overview of Supply Chain Planning Plan Types
    source_url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/26b/faupc/overview-of-supply-chain-planning-plan-types.html
