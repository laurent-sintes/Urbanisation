      Backlog Plan, Replenishment Plan.'
    evidence_limits: Types de plans et espaces fonctionnels du produit, pas hiérarchie de capacités ou de Domains FLOW. Ne
      prescrit ni le nombre de capacités ni leurs parents.
    status: proposed
    source_refs:
