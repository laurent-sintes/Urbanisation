    evidence_limits: Présentation fonctionnelle S&OP, pas preuve d’un Domain PLAN standard séparant Demand Planning et Supply
      Planning ; n’établit aucune responsabilité installée chez Beaumanoir.
    status: proposed
    source_refs:
