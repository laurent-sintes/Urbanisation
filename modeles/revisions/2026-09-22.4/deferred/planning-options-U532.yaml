    - ELM557
    concept_name: Overview of Supply Chain Planning Plan Types
    scope_summary: Distinguer la demande à anticiper et les moyens Supply pour la couvrir, tout en permettant un plan intégré.
    approach_summary: Proposer une Area Planning contenant Demand Planning et Supply Planning ; conserver les responsabilités
      opérationnelles spécialisées.
  - vendor: SAP
    product: Integrated Business Planning — S&OP
    element_name: Sales and operations planning
    element_type: Périmètre fonctionnel ou type de plan de produit
    relationship: Recouvrement partiel
    similarities: Faire coopérer les plans et comparer leurs conséquences.
    differences: SAP couvre une coordination commerciale, financière et opérationnelle plus large que le besoin Supply établi
      ; ce périmètre n’est pas intégré automatiquement.
    flow_position: Réserver l’hypothèse d’un Domain transverse à une responsabilité explicite de pilotage des plans d’entreprise.
      La collaboration avec commerce/finance ne suffit pas à imposer ce Domain.
    source_title: Sales and operations planning
    source_url: https://www.sap.com/products/scm/integrated-business-planning/features/sales-and-operations-planning.html
