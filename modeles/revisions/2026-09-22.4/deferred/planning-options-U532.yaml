option_B:
  user_proposal: Un Domain PLAN portant Demand Planning et une Area de planification Supply dans Supply Chain Orchestration.
  when_relevant: Si un périmètre autonome est responsable d’un plan de demande de référence et d’arbitrages d’entreprise partagés
    entre commerce, finance et Supply, au-delà des besoins d’orchestration étudiés.
  benefit: Rendre explicite une responsabilité transverse de planification si elle existe ou constitue une cible choisie.
  tradeoff: Définir une frontière inter-Domains entre prévision, objectifs, plans et engagements, ainsi que leurs révisions.
    Un seul outil, un horizon long ou une contribution commerciale ne suffit pas.
  market_limit: Les appuis S&OP/IBP consultés réunissent les équilibres demande, Supply et finance. Ils ne prescrivent pas
    l’asymétrie consistant à placer seulement Demand Planning dans PLAN.
  name_position: PLAN est un intitulé large, qui demande une finalité métier précise. Integrated Business Planning pourrait
    être étudié uniquement si son périmètre transverse est réellement visé ; ce n’est pas un renommage recommandé à ce stade.
  hierarchy: Si B était retenue, préciser une Area d’accueil de Demand Planning dans le nouveau Domain ; ne pas sauter le
    niveau Area.
