history_U524_scope:
  scope: Comparer les grands besoins de lecture de Visibility à la maille capacité, selon U520. U524 exclut PLAN ; la matrice
    courante compte cinq familles proposées, sans nouveaux Behaviors ni règles détaillées.
  product_scope:
    oracle: 'Oracle possède une couverture ERP/SCM complète, plus large que l’orchestration Supply FLOW. Comparaison active
      : Order Management et Global Order Promising 26B ; Replenishment Planning est un repère hors périmètre PLAN.'
    fluent: Fluent Order Management et fonctions Inventory/Returns documentées ; dates et versions dans les relevés U519.
    comparison_limit: Évaluer à périmètre comparable ; ne pas présenter les vues PLAN supplémentaires d’Oracle comme une lacune
      à combler dans FLOW ou chez Fluent.
  excluded_from_active_comparison:
    view: Inventory Planning Context
    reference: ELM371
    reason: PLAN hors orchestration Supply selon U524 ; preuve conservée pour expliquer le périmètre plus large d’Oracle.
    canonical_impact: Question de clarification en cours sur Inventory Planning et les décisions opérationnelles de réassort
      déjà canoniques ; aucun retrait automatique.
  decision: U523 retient la cible Visibility pour la comparaison. U524 retient le rapprochement Fluent Sourcing → FLOW Network
    et l’exclusion PLAN. Les cinq familles, leurs noms et les autres correspondances restent proposés ; la portée sur les
    capacités canoniques de planification attend clarification.
  key_findings:
  - Fluent Sourcing correspond au Network FLOW dans la lecture retenue par Laurent (U524).
  - Oracle a une couverture ERP/SCM plus large qui explique des vues supplémentaires ; PLAN est exclu de l’orchestration étudiée.
  - Order Context, Sourcing Context au sens approvisionnement, Fulfillment & Service Context, Return Context et Economic Context
    restent cinq familles de besoins proposées ; leur découpage n’est pas une nomenclature éditeur.
  - Le contexte économique est étayé dans Oracle Global Order Promising ; la preuve d’un contexte de coûts comparable n’est
    pas établie dans le corpus Fluent.
