    n’est établie.
  - Les appuis Fluent sont les plus directs pour le contexte de demande et le fulfillment, avec un appui partiel sur les retours.
  - Les modules Oracle consultés étayent en plus l’approvisionnement, la planification et les coûts mobilisés dans la promesse.
  - Sourcing Context FLOW vise achats/apports ; Sourcing Context Fluent n’est pas une preuve équivalente. Les six noms restent
    des formulations proposées FLOW.
