  capacité U520, sans nouveaux Behaviors ni détail de règles.
product_scope:
  oracle: Oracle possède une couverture ERP/SCM plus large que l’orchestration FLOW. Order Management, Global Order Promising
    et Replenishment Planning sont distingués ; les fonctions de PLAN ne sont pas transférées automatiquement au périmètre
    FLOW.
  fluent: Fluent Order Management et fonctions Inventory/Returns documentées ; dates et versions dans les relevés U519.
  comparison_limit: Comparer les finalités et responsabilités ; la séparation analytics/production ne suffit pas à trancher
    la frontière. Le périmètre exact de PLAN demeure ouvert en U525/Q078.
rows:
- view: Order Context
  oracle: 'Recouvrement partiel : les données collectées et Assignments and Rules rapprochent produit, client et organisation
    pour l’orchestration et la promesse.'
  oracle_refs:
  - ELM228
  - ELM538
  fluent: 'Recouvrement partiel : Sourcing Context rapproche les caractéristiques produit/client et le contexte de demande.'
  fluent_refs:
  - ELM542
  interpretation: Besoin transversal documenté chez les deux ; pas de vue de références pure portant ce nom.
- view: Sourcing Context
  oracle: 'Rapprochement fonctionnel avec Source Your Supply Chain : achat, fabrication ou transfert.'
  oracle_refs:
  - ELM550
  fluent: Le sourcing Fluent correspond au Network FLOW (U524), pas au contexte d’achat/apport fournisseur proposé sous ce
    nom.
  fluent_refs:
  - ELM541
  interpretation: Séparer la lecture du Network et le contexte d’approvisionnement ; la proximité du mot sourcing ne fonde
    pas une équivalence.
- view: Fulfillment & Service Context
  oracle: Rapprochement pour le réseau de satisfaction et les informations utilisées par Global Order Promising.
  oracle_refs:
  - ELM228
  - ELM550
  - ELM549
  fluent: Fluent Sourcing se rapproche du Network FLOW ; les options de fulfillment illustrent la préparation de livraison/retrait.
  fluent_refs:
  - ELM541
  - ELM543
  interpretation: Correspondance Network retenue U524 ; les décisions de sélection Fluent ne deviennent pas pour autant des
    données de référence.
- view: Return Context
  oracle: 'Rapprochement partiel : qualification du produit pour retour, lieu de retour et dossier d’origine.'
  oracle_refs:
  - ELM548
  fluent: 'Rapprochement partiel : Returns Component associe références de qualification et dossier de retour.'
  fluent_refs:
  - ELM545
  interpretation: Besoin de contexte étayé, sans prouver une vue autonome ni toute la politique de retour/disposition FLOW.
- view: Economic Context
  oracle: 'Appui explicite avec Profitable to Promise : coûts utilisés pour comparer les possibilités de satisfaction.'
  oracle_refs:
  - ELM549
  fluent: 'Non établi pour une vue de coûts comparable : valeur commerciale prise en compte dans les critères et montants
    du retour ne démontrent pas les coûts d’achat, de possession ou d’exécution.'
  fluent_refs:
  - ELM541
  - ELM545
  interpretation: La famille FLOW reste une proposition transversale ; bases économiques et décision optimisée doivent rester
    distinctes.
key_findings:
- Fluent Sourcing correspond au Network FLOW (U524), sans assimiler les décisions natives aux références du réseau.
- Oracle possède une couverture ERP/SCM plus large, qui explique des fonctions supplémentaires.
- La frontière PLAN/orchestration est à arbitrer U525/Q078 ; l’analytics ne constitue pas à lui seul un critère d’exclusion.
- Cinq familles restent proposées et Inventory Planning Context reste en attente ; aucun découpage de vues adopté.
new_primary_documents:
- id: ELM548
  mkt: MKT20
  vendor: Oracle
  product: Fusion Cloud SCM — Order Management
  title: Guidelines for Processing Return Orders
  url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/26b/faiom/guidelines-for-processing-return-orders.html
  version: 26B
  locator: Manually Reference the Original Order ; Set Up the Item So It's Returnable ; Specify the Return-to Location, lignes
    9–30 et 59–61.
  observation: Le traitement des retours mobilise une qualification de référence du produit, une destination de retour et,
    selon le parcours, la commande d’origine.
  similarities: Réunir les références utiles à l’instruction d’un retour.
  differences: La fonction produit gère aussi la transaction et l’orchestration ; elle n’est pas une vue de références autonome.
    Retours fournisseurs et disposition complète non démontrés par cette page.
  consulted_on: '2026-09-21'
  nature: Fonctionnalité documentée d’un produit ; pas vue ou capacité FLOW native.
  evidence_status: consulted_primary
  reuse_limits: Synthèse sélective et liens, sans reproduction intégrale.
- id: ELM549
  mkt: MKT20
  vendor: Oracle
  product: Fusion Cloud SCM — Global Order Promising
  title: Set Attributes on Your Supply Chain Search
  url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/26b/fascp/promising-attributes-for-supply-chain-availability-searches.html
  version: 26B
  locator: Profitable to Promise, lignes 13–46 ; Search Components and Resources, lignes 5–12.
  observation: Profitable to Promise utilise des coûts de référence pour comparer les possibilités de satisfaction ; le moteur
    produit ensuite le choix.
  similarities: Appui fonctionnel à la consommation de bases économiques pour la promesse.
  differences: Calcul et choix font partie du moteur Oracle, pas d’une vue Economic Context distincte. Sa logique de coût
    sous contrainte de date n’est pas adoptée dans FLOW ; ni prix de vente ni comptabilité complète.
  consulted_on: '2026-09-21'
  nature: Fonctionnalité documentée d’un produit ; pas vue ou capacité FLOW native.
  evidence_status: consulted_primary
  reuse_limits: Synthèse sélective et liens, sans reproduction intégrale.
