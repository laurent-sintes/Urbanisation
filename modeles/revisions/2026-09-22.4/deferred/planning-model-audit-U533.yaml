findings:
- id: PA01
  priority: high
  title: Articuler Inventory Planning et Supply Planning
  targets:
  - D05.f
  - D17.b
  observation: D05.f construit déjà des scénarios mobilisant cibles, protections, implantation, réassort et redistribution
    ; D17.b ajoute le plan de couverture d’ensemble.
  recommendation: Conserver D05.f comme planification spécialisée du stock, mobilisée par Supply Planning. Définir les résultats
    respectifs pour éviter deux scénarios applicables concurrents. Aucun transfert ni fusion automatique.
  status: proposed_boundary_arbitration
  source_refs:
  - U533
  - ELM560
  - ELM552
- id: PA02
  priority: high
  title: Qualifier les décisions propres aux deux nouveaux plans
  targets:
  - D17.a
  - D17.b
  observation: Aucune des 16 décisions existantes ne porte explicitement le choix de demande de référence ni le compromis
    de couverture d’ensemble avant commandes. Les deux nouvelles capacités assurent leur construction/actualisation à maille
    large ; les porteurs des résultats de décision restent implicites.
  recommendation: Étudier Demand Plan Decision et Supply Plan Decision comme responsabilités candidates dans Planning, si
    leur résultat distinct justifie des capacités. Ne pas créer une décision par calcul ni déplacer les décisions de stock
    pour combler ce point.
  status: candidate_responsibilities_not_created
  source_refs:
  - U533
  - ELM557
  - ELM562
  - ELM552
- id: PA03
  priority: high
  title: Couvrir explicitement les achats anticipés du réseau
  targets:
  - D17.b
  - D05.g
  - D05.e
  - D04.j
  observation: Initial Stocking Decision vise le stock de départ des magasins ; Replenishment Decision vise les apports continus.
    Leur réunion ne démontre pas une responsabilité explicite de tout le plan d’achat fournisseur initial du réseau illustré
    par MAP.
  recommendation: Inclure ce besoin dans l’étude du résultat de couverture de Supply Planning/Supply Plan Decision ; articuler
    ensuite les demandes avec Purchase Order. Ne pas étendre Initial Stocking Decision par simple analogie de lancement.
  status: responsibility_to_qualify
  source_refs:
  - U530
  - U533
  - ELM561
  - ELM552
- id: PA04
  priority: high
  title: Distinguer scénario, demande planifiée, engagement et ressource future
  targets:
  - D17.b
  - D04.j
  - D04.o
  - D01.c
  - D03.i
  - D03.n
  - D02.c
  observation: Un plan peut recommander un apport avant sa prise en charge opérationnelle. Le modèle possède les responsabilités
    de commandes, de connaissance et de promesse, mais l’interface de D17 est nouvelle.
  recommendation: Qualifier le passage vers les Orders et le retour de prise en compte ; définir quelles ressources futures
    sont utilisables pour les promesses. Une hypothèse ne devient ni stock certain ni engagement par le seul recalcul.
  status: cooperation_to_define
  source_refs:
  - U533
  - ELM561
- id: PA05
  priority: medium
  title: Relier demande connue, ventes et prévisions sans confusion
  targets:
  - D17.a
  - D04.i
  - business-references
  observation: MAP mobilise ventes et précommandes B2B ; le modèle n’explicite pas encore toutes les responsabilités d’alimentation
    du nouveau plan.
  recommendation: Identifier les informations et responsabilités sources au niveau capacité. Garder les statuts B2B, distinguer
    ventes et commandes, rendre cohérentes demande connue et anticipation. Ne pas faire des prévisions une ressource Core
    Data ni inventer les flux MAP.
  status: cooperation_to_define
  source_refs:
  - U531
  - U532
  - U533
  - ELM558
  - ELM556
- id: PA06
  priority: medium
  title: Formaliser les relations métier de Planning
  targets:
  - D17.a
  - D17.b
  - D05
  - D04
  - D01
  - D06
  - D15
  - business-references
  observation: L’intégration ajoute deux relations contains, sans transférer les relations existantes. Les liens transversaux
    des nouvelles capacités restent à qualifier.
  recommendation: Consigner des liens de coopération avec conditions, effets et provenance ; les relations proposées ci-dessous
    ne sont pas des décompositions et ne sont pas ajoutées automatiquement au canonique par l’audit.
  status: proposed_links
  source_refs:
  - U533
- id: PA07
  priority: medium
  title: Corriger les anciennes exclusions générales de planification
  targets:
  - D03.o
  - D05.f
  - D05
  observation: Le scope de Fulfillment Plan Decision parle encore de planification globale externe. Les restrictions locales
    de saison/horizon dans Inventory Planning et D05 doivent être relues comme limites de ces responsabilités, pas comme exclusion
    du Domain.
  recommendation: Remplacer le repère externe par la distinction avec le plan d’ensemble dans Planning. Préciser les frontières
    D05/D17 selon les résultats, sans supprimer automatiquement les limites spécialisées.
  status: editorial_follow_up_not_applied
  source_refs:
  - U530
  - U531
  - U533
- id: PA08
  priority: high
  title: Réexaminer le périmètre trop large de Supply Planning
  targets:
  - D17.b
  observation: U534 met le nom en réserve. SAP Supply Planning couvre achats, production et distribution ; le besoin MAP discuté
    porte notamment les achats fournisseurs.
  recommendation: Conserver D17.b comme capacité de travail à qualifier. Si son résultat couvre tout le réseau, Supply Planning
    reste cohérent ; si le résultat vise les apports fournisseurs, étudier un nom de procurement en vérifiant son périmètre.
    Ne pas adopter Procurement Planning sur une simple proximité lexicale.
  status: name_and_scope_under_review
  source_refs:
  - U534
  - ELM564
  - ELM565
  - ELM561
- id: PA09
  priority: high
  title: Assignment Planning recouvre un ensemble existant
  targets:
  - D03.p
  - D03.o
  - D02.e
  - D15
  - D05
  observation: U535 vise la répartition des ressources limitées aux commandes de vente avec compromis promesse/profit/stock.
    D03.p organise déjà les scénarios, D03.o détermine un plan collectif et D02.e en applique les affectations.
  recommendation: Traiter Assignment Planning comme une clarification ou un candidat de nom pour D03.p, pas comme une nouvelle
    capacité. Conserver le rattachement opérationnel U528. Le périmètre ventes seules de U535 est plus étroit que le carnet
    d’Orders actuel et doit être arbitré avant tout renommage.
  status: overlap_and_name_to_arbitrate
  source_refs:
  - U535
  - U536
  - ELM496
  - ELM381
  - ELM563
- id: PA10
  priority: medium
  title: Étayer le compromis promesse/profit/stock sans revendiquer une innovation non démontrée
  targets:
  - D03.o
  - D03.p
  - D03.k
  - D05.a
  - D05.d
  - D05.c
  observation: Oracle documente dates et marges, SAP des simulations d’affectation et des cibles de stock. Les passages consultés
    ne démontrent pas une optimisation unifiée des trois dimensions.
  recommendation: Rendre explicites dans la proposition les objectifs et décisions mobilisées, sans pondération imposée. Qualifier
    ce rapprochement d’adaptation FLOW justifiée par le besoin et la séparation des responsabilités ; ne revendiquer ni standard
    complet ni innovation exclusive. Une innovation éventuelle exige un bénéfice distinct et une comparaison complémentaire.
  status: documented_partial_market_coverage
  source_refs:
  - U535
  - U536
  - ELM563
  - ELM381
  - ELM560
- id: PA11
  priority: high
  title: Revoir le découpage entre Planning, application et configuration
  targets:
  - D05.f
  - D03.p
  - D02.e
  - D02.b
  observation: U537 porte l’application du plan comme comportement de Planning ; U538 maintient la configuration consommée
    à l’extérieur.
  recommendation: Réexaminer les capacités justifiées seulement par l’application d’un plan, dont Supply Assignment, en préservant
    leurs mécanismes. Maintenir Supply Protection comme capacité partenaire extérieure. Aucun déplacement automatique.
  status: principles_recorded_structural_review_pending
  source_refs:
  - U537
  - U538
  - CMP220
