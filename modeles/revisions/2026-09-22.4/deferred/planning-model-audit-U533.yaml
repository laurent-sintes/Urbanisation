market_documents:
- id: ELM560
  reference: MKT24
  title: Inventory optimisation
  url: https://www.sap.com/uk/products/scm/integrated-business-planning/features/inventory-optimization.html
  version: Page évolutive ; édition non indiquée
  locator: Develop item-level inventory targets ; Monitor all types of variabilities ; Multistage optimisation ; Response
    and supply planning.
  observation: SAP distingue le calcul de cibles de stock dans le réseau et leur utilisation par Supply Planning ; les horizons
    couvrent court, moyen et long terme.
  limit: Fonctions d’une offre intégrée, pas prescription du parent FLOW d’Inventory Target Decision ou d’Inventory Planning.
  consulted_on: '2026-09-21'
  native_id: null
  evidence_level: primary_passage_consulted
- id: ELM561
  reference: MKT20
  title: Import Planned Orders
  url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/26b/fascp/import-planned-orders.html
  version: 26B
  locator: Introduction ; utilisation par Promising ; planned buy/make/transfer orders ; avertissement sur import de plusieurs
    plans.
  observation: Oracle décrit des recommandations de plans utilisées par Promising avant la création effective de certains
    approvisionnements, puis leur articulation avec commandes et demandes d’achat.
  limit: Oracle suppose certaines ressources planifiées admissibles à la promesse ; cette convention n’est pas adoptée pour
    FLOW. Planifié, engagé, attendu et réalisé doivent être qualifiés séparément.
  consulted_on: '2026-09-21'
  native_id: null
  evidence_level: primary_passage_consulted
- id: ELM562
  reference: MKT20
  title: Create a Forecasting Profile
  url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/26b/faurp/create-a-forecasting-profile.html
  version: 26B
  locator: Introduction ; Predefined Forecasting Profiles ; Input Measure et Output Measure.
  observation: Les profils distinguent données historiques d’entrée, méthodes et résultats de prévision, avec des usages de
    bookings et de shipments.
  limit: Configuration de produit et génération de prévisions ; ne prouve ni une capacité nommée Demand Plan Decision ni une
    méthode installée dans MAP.
  consulted_on: '2026-09-21'
  native_id: null
  evidence_level: primary_passage_consulted
- id: ELM563
  reference: MKT20
  title: Key Order Attributes
  url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/26b/faubm/key-order-attributes.html
  version: 26B
  locator: Planned Attributes ; Calculated Attributes ; Backlog Planning Control Attributes.
  observation: Backlog Management compare notamment dates prévues, retards, revenus et marges ; les dates planifiées se distinguent
    des dates programmées.
  limit: Mesures disponibles et paramètres de planification ; ne démontre pas un solveur optimisant conjointement promesse,
    profit et équilibre de stock.
  consulted_on: '2026-09-21'
  native_id: null
- id: ELM564
  reference: MKT24
  title: Supply Planning
  url: https://help.sap.com/docs/SAP_INTEGRATED_BUSINESS_PLANNING/c1fb60cb1e9c49d99ada277ae57e9e6c/66a038fcf40f4f779c6b4696aede83a6.html
  version: SAP IBP ; édition non restituée
  locator: 'Présentation du supply planning order-based : purchasing, production and distribution plan.'
  observation: SAP attribue à Supply Planning la construction d’un plan réalisable d’achats, de production et de distribution.
  limit: Passage primaire indexé consulté ; ouverture directe sans texte exploitable. Périmètre produit, pas définition universelle
    d’une capacité.
  consulted_on: '2026-09-21'
  native_id: null
- id: ELM565
  reference: MKT13
  title: Overview — SAP Ariba Procurement Planning
  url: https://help.sap.com/docs/SAP_PROCUREMENT_PLANNING/aad8ff6e4e0c404591864a751c877d34/a728566dc02e4f4b91745878c3a40e05.html
  version: Page évolutive ; édition non restituée
  locator: About SAP Ariba Procurement Planning.
  observation: L’offre prépare les activités de procurement et leurs échéances, ainsi que les investissements à partir d’une
    nomenclature.
  limit: Passage primaire indexé consulté ; ouverture directe sans texte exploitable. Atteste le terme Procurement Planning,
    avec un périmètre plus large et différent d’un simple plan de quantités d’achat textile ; pas équivalence FLOW.
  consulted_on: '2026-09-21'
  native_id: null
limits:
- Comparaison ciblée des responsabilités affectées ; pas benchmark exhaustif de toutes les fonctions éditeurs.
- Les rapprochements détaillés préexistants des capacités non modifiées ne reçoivent pas une nouvelle validation globale.
- MAP est documenté par les apports utilisateur ; aucune preuve d’implémentation ni de flux technique supplémentaire.
