integration:
  area: D17
  name: Planning
  new_capabilities:
  - D17.a
  - D17.b
  existing_capabilities_moved: []
  approved_fields: Noms, définitions courtes présentées des deux capacités et relations de composition ; compléments proposés.
  reserved_after_U534: Le nom et le périmètre de D17.b Supply Planning sont en réexamen. Accord U533 historique conservé,
    sans confirmation courante de ces deux champs.
decision_placement_principle:
  rule: Rattacher une décision à la responsabilité du résultat qu’elle produit, pas à tous les plans qui l’utilisent.
  recommendation: Conserver les 16 décisions existantes dans leurs Areas actuelles. Les décisions propres à la demande retenue
    et à la couverture d’ensemble pourraient relever de Planning après qualification.
  criteria:
  - Résultat métier distinct et autorité responsable.
  - Réutilisation par plusieurs plans ou parcours opérationnels.
  - Différence entre détermination, maintien du plan et mise en action.
  not_criteria:
  - Horizon long ou court
  - Cadence de recalcul
  - Humain ou automatique
  - Présence dans MAP/Camunda
  - Mot Plan ou Planning dans le nom
