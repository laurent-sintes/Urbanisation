assignment_planning_U535:
  status: proposal_mapped_to_existing_capabilities
  proposed_name: Assignment Planning
  meaning: Planifier la distribution de ressources limitées aux commandes de vente selon un compromis entre promesse, profit
    et équilibre/optimisation du stock.
  mapping:
  - id: D03.p
    role: Construction, comparaison et révision des scénarios.
  - id: D03.o
    role: Détermination du plan collectif d’affectation et du compromis multidimensionnel.
  - id: D02.e
    role: Application des affectations ressources-commandes.
  - id: D15
    role: Possibilités et engagements de promesse, conséquences économiques et échéanciers.
  - id: D05
    role: Cibles, protections et arbitrages spécialisés de stock.
  market_name_assessment: Supply Assignment est un terme SAP établi ; la simulation d’affectation est documentée. Backlog
    Planning/Management est documenté par Oracle. Le libellé exact Assignment Planning n’est pas établi comme appellation
    commune par les passages consultés.
  preferred_current_position: Conserver Order Backlog Planning dans Fulfillment Optimization ; présenter Assignment Planning
    comme candidat de clarification, sans doublon ni restriction silencieuse aux Sales Orders.
  innovation_assessment: Aucune innovation démontrée à ce stade ; correspondances fonctionnelles partielles et découpage FLOW
    explicite.
  source_refs:
  - U535
  - U536
  - CMP219
  - ELM496
  - ELM381
  - ELM563
justification_matrix:
- choice: Planning avec Demand Planning et Supply Planning
  evidence:
  - ELM557
  - ELM556
  - ELM552
  assessment: Responsabilités établies du marché ; regroupement en Area FLOW adapté à la hiérarchie locale, sans revendication
    d’innovation.
- choice: Nom Supply Planning
  evidence:
  - ELM564
  - ELM557
  assessment: Terme établi, périmètre large ; adéquation au besoin plus étroit en réexamen U534.
- choice: Nom Procurement Planning éventuel
  evidence:
  - ELM565
  - ELM561
  assessment: Terme attesté et fonction d’apports d’achat documentée, mais portée exacte non équivalente ; piste à instruire,
    non adoptée.
- choice: Assignment Planning
  evidence:
  - ELM381
  - ELM496
  - ELM563
  assessment: Fonctions de simulation/planification d’affectation établies ; nom exact proposé localement et chevauchement
    D03.p à arbitrer.
- choice: Maintien des décisions spécialisées
  evidence:
  - ELM560
  - ELM557
  - ELM496
  assessment: Le marché distingue cibles de stock, plans Supply et plans du carnet ; FLOW formalise des décisions réutilisées.
    Leur parent précis relève d’une adaptation argumentée, pas d’un consensus éditeur.
- choice: Demand Plan Decision / Supply Plan Decision candidates
  evidence:
  - ELM562
  - ELM556
  - ELM552
  - ELM557
  assessment: Résultats métier à qualifier et calculs documentés ; noms et découpage de décisions proposés selon la convention
    FLOW. Pas deux capacités marché équivalentes démontrées, aucune création à ce stade.
- choice: Promesse / profit / équilibre de stock
  evidence:
  - ELM563
  - ELM381
  - ELM560
  assessment: Dimensions et mécanismes partiellement documentés. Optimisation conjointe complète non démontrée par ces sources
    ; pas d’innovation revendiquée par défaut.
