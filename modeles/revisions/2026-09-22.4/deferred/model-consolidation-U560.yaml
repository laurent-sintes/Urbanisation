working_decisions:
- id: DEC1
  topic: Gouvernance de la politique de réservation
  recommendation: Reservation Policy Decision détermine les conditions ; Supply Protection les configure, les maintient et
    les rend applicables ; Reservation applique la politique active aux engagements individuels.
  node_ids:
  - D05.h
  - D02.b
  - D02.c
  affected_fields:
  - fields.scope
  - fields.market_comparisons
  - fields.market_inspiration
  - relations
  benefit: Réutilise le management des politiques déjà présent, à l’extérieur des Plannings.
  tradeoff: La couverture de Supply Protection doit expliciter ces politiques sans les confondre avec les protections de groupe
    ; aucun nouveau comportement imposé par la présence d’un paramètre.
  market_position: Microsoft et commercetools étayent politiques configurées et application ; le propriétaire Supply Protection
    est une recommandation de cohérence FLOW, pas une organisation imposée par ces éditeurs.
  source_refs:
  - U538
  - ELM334
  - ELM412
  status: appliqué comme choix de travail Codex sous U560 ; pas de validation de Laurent inférée
- id: DEC2
  topic: Autorité des décisions de satisfaction
  recommendation: PTP conserve l’arbitrage économique, Delivery Schedule Decision le choix d’échéancier ; lorsqu’un plan collectif
    est construit, Fulfillment Plan Decision porte la compatibilité du scénario d’ensemble et appelle le réexamen des résultats
    incompatibles. Fulfillment Commitment conserve l’autorité de proposer, confirmer ou réviser les engagements selon les
    conditions applicables.
  node_ids:
  - D03.k
  - D03.l
  - D03.o
  - D03.n
  - D15
  affected_fields:
  - fields.scope
  - fields.market_comparisons
  - fields.market_inspiration
  - relations
  benefit: Évite des choix localement valides mais collectivement incompatibles en conservant les décisions spécialisées.
  tradeoff: Aucune fusion, pondération universelle ou obligation de construire un plan collectif pour toute réponse de promesse
    ; l’application et les engagements restent distincts du résultat calculé.
  market_position: Oracle et Microsoft illustrent les compromis et le travail collectif, sans prescrire cette répartition
    de responsabilités FLOW.
  source_refs:
  - ELM372
  - ELM393
  - ELM496
  status: appliqué comme choix de travail Codex sous U560 ; pas de validation de Laurent inférée
- id: DEC3
  topic: Affectations aux besoins sans commande
  recommendation: Confirmer Supply Assignment sur les commandes identifiées. Pour chaque besoin prévisionnel historique, distinguer
    anticipation de demande (Demand Planning), ajustement de stock (Inventory Optimization Planning), protection d’accès (Supply
    Protection) ou demande déjà gérée. Ne convertir aucun forecast automatiquement en Order.
  node_ids:
  - D02.e
  - D03.p
  - D17.a
  - D05.f
  - D02.b
  affected_fields:
  - fields.scope
  - fields.market_comparisons
  - fields.market_inspiration
  - relations
  benefit: Aligne Supply Assignment et son parent Order Backlog Planning tout en conservant les besoins métier.
  tradeoff: Les besoins historiques insuffisamment décrits restent explicitement ouverts ; ne pas leur inventer une destination
    pour fermer l’audit.
  market_position: Les sources SAP et Oracle consultées étayent l’affectation et le travail du carnet d’Orders ; elles ne
    suffisent pas à attribuer tous les besoins prévisionnels à un même mécanisme.
  source_refs:
  - ELM452
  - ELM496
  status: appliqué comme choix de travail Codex sous U560 ; pas de validation de Laurent inférée ; cas historiques non identifiés
    laissés ouverts
remaining_open:
- finding: AUD557-05
  scope: Cas historiques de besoins prévisionnels non identifiés
  reason: La frontière cible est précisée ; aucune liste de cas métier suffisamment qualifiée ne permet de garantir leur redistribution
    exhaustive. Aucun forecast transformé en Order par hypothèse.
