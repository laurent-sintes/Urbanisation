  common: Oracle documente une application des résultats dans le parcours de planning et des règles de protection utilisées
    par le calcul.
  difference: Oracle documente des fonctions produit ; ces pages ne prescrivent pas une hiérarchie Capability/Behavior ni
    une capacité de configuration extérieure à un module Planning.
  flow_position: La distinction fonctionnelle est documentée ; placement en comportements et capacités partenaires est une
