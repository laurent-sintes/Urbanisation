targeted_review:
- target: D02.b
  name: Supply Protection
  disposition: Maintenir extérieure au Planning ; configuration et validité propres, déjà cohérentes avec U538. Aucun renommage
    Stock Protection.
- target: D05.f
  name: Inventory Planning
  disposition: Prendre en compte le comportement d’application dans la prochaine décomposition précise ; consommer les protections
    et mobiliser leur gestion sans les absorber.
- target: D03.p
  name: Order Backlog Planning
  disposition: L’application du plan appartient à sa responsabilité de Planning ; examiner le rattachement des mécanismes
    existants sans créer de doublon.
- target: D02.e
  name: Supply Assignment
  disposition: Réexaminer son autonomie si sa finalité se limite à appliquer le plan. BHV045 porte déjà cette application
    ; BHV046 et BHV047 doivent être préservés et qualifiés avant tout reparentage. Ni suppression ni maintien autonome définitivement
    validé par le seul triptyque Planning/Decision/Application.
- target: D17.a / D17.b
  disposition: Décrire la mise en effet propre à chaque résultat avant d’ajouter des comportements ; pas de gabarit identique
    automatique.
