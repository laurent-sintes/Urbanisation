user_directions:
- source_ref: U537
  principle: Planning et Decision restent distincts ; application du plan comme comportement du Planning.
- source_ref: U538
  principle: Apporter une configuration au Planning, exemple Stock Protection, reste extérieur au Planning.
editorial_interpretation:
  planning: Porte la construction, l’analyse, l’actualisation et l’application du résultat retenu ; décomposition précise
    selon le bénéfice métier.
  decision: Détermine une réponse métier, calculs inclus ; demeure une capacité distincte mobilisée.
  configuration: La capacité partenaire définit, maintient et fournit règles et paramètres consommés. Leur consommation ne
    transfère pas cette responsabilité au Planning.
  application: Rendre le résultat du plan effectif et connaître sa prise en compte. Une capacité partenaire peut réaliser
    les changements qui relèvent de sa responsabilité sans devenir un enfant du Planning.
  boundary: Appliquer le plan ne donne pas au Planning l’autorité de modifier librement la configuration qui le contraint.
    Si un plan propose une nouvelle protection, sa mise en vigueur demeure portée par Supply Protection.
  name_status: Plan Application est un libellé proposé, pas un terme de marché universel ni un nom de comportement adopté.
