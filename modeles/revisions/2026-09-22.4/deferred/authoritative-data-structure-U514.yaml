- id: ELM529
  mkt: MKT69
  title: Materialized View pattern
  url: https://learn.microsoft.com/en-us/azure/architecture/patterns/materialized-view
  version: Page évolutive, date de mise à jour non affichée dans le texte consulté
  consulted_on: '2026-09-21'
  locator: Context and problem ; Solution ; Issues and considerations ; When to use this pattern
  finding: Une vue adapte et combine des données d’un ou plusieurs stockages aux besoins de requêtes.
  similarity: Appui à des vues définies par la consommation, indépendamment des frontières de stockage.
  difference: Patron technique de vues préconstruites ; les vues FLOW ne sont pas obligatoirement matérialisées.
  limits: Ne démontre pas trois capacités métier ni leur décomposition par Behavior. Texte principal consulté malgré un bandeau
    générique de connexion ; synthèse sélective sans reproduction substantielle.
decision: U515 fixe le sens des axes discutés. Aucune implémentation détaillée, nouvelle garantie, technologie ou transformation
  canonique déduite ; les interprétations U514 remplacées sont conservées dans history_U514.
history_U514:
  assessment:
    three_responsibilities: Option cohérente si réception, maintien de la référence locale et connaissance fournie ont des
      résultats distincts. Ne pas transformer leur articulation en pipeline obligatoire.
    ingestion: Une source peut désigner une autorité ou une famille de données métier. Une différence de contrat de réception,
      de portée ou d’effet peut justifier un comportement ; un connecteur ou un format différent ne suffit pas.
    visibility: Une vue peut distinguer une question et un résultat de connaissance métier. Elle peut croiser plusieurs sujets
      ; un écran, filtre, endpoint ou schéma matérialisé ne suffit pas.
    core_data: Responsabilité possible de maintenir la cohérence et la version applicable des références locales. Si storage
      désigne des bases, tables ou technologies, il relève de la réalisation ; si le mot désigne un ensemble logique par sujet,
      ce sujet ne devient pas automatiquement un comportement.
    boundary: Les Ingestion actuelles intègrent déjà les évolutions et maintiennent la référence locale. Isoler Core Data
      exige de redistribuer explicitement ces responsabilités, sans doublon.
    scope_limit: Aucune certification des données, résolution des conflits, historisation exhaustive, correction du maître
      ou nouvelle garantie de fraîcheur adoptée.
  candidate_contracts:
  - name: Ingestion
    result: Prendre en compte les références communiquées par les sources et conserver leur origine.
    boundary: Règles de réception et traduction du sens reçu ; partage avec le maintien local à préciser.
  - name: Core Data
    result: Maintenir la référence locale utilisable dans la durée, avec les identités, liens et conditions de validité nécessaires.
    boundary: Service à définir avant de choisir son nom et ses comportements ; cycle de vie du maître externe préservé.
  - name: Visibility
    result: Fournir une connaissance intelligible des références connues, adaptée aux questions des utilisateurs et activités
      Supply.
    boundary: Les vues composent les références ; elles ne prennent pas implicitement une décision de promesse, de prix ou
      de disponibilité.
  example:
    status: fictional_FLOW_illustration
    situation: Un assortiment reçu doit devenir applicable le mois prochain.
    ingestion: Recevoir la sélection, ses destinataires et sa période.
    core_data: Conserver la sélection reçue et permettre de distinguer la référence actuelle de la future.
    visibility: Présenter les sélections reçues pour un magasin et une date avec les produits et conditions référencés.
    limits: Exemple pour éprouver les frontières, pas règle de gestion adoptée ni preuve Beaumanoir.
  decision: Aucun accord ni changement canonique. Trois responsabilités recommandées comme hypothèse à éprouver ; axes de
    Behavior conditionnels.
  decomposition_rule: Un Behavior doit expliciter ce qui change dans la manière d’agir ou le résultat, avec bénéfice ou complexité
    ciblée U265/MOD006. Pas de comportement automatique par application, objet, écran ou stockage.
clarification_U515:
  Ingestion: Découpage selon les domaines sources.
  Visibility: Vues découpées ou agrégées selon les besoins des capacités de Supply Chain Orchestration.
  Core Data: Découpage du stockage ; aucune technologie présumée.
  scope: Axes explicités par Laurent. Les découpages détaillés et leur représentation dans le modèle restent à établir.
