previous_review: authoritative-data-landscape-U512.yaml
user_proposal:
  Ingestion: décomposition des comportements par datasource
  Visibility: décomposition des comportements par vue
  Core Data: décomposition des comportements par storage
assessment:
  three_axes: 'Trois axes distincts : provenance par domaine source, organisation du stockage, consommation par les capacités
    Supply.'
  ingestion: La frontière pertinente est le domaine fournisseur ; ne pas la remplacer par une famille de données ou une application
    par défaut.
  visibility: Les vues répondent aux besoins des capacités consommatrices ; une vue peut agréger plusieurs ensembles stockés.
  core_data: Core Data organise le stockage. Le maintien métier de validité, cohérence ou version n’est pas ajouté comme définition
    obligatoire par cette clarification.
  relationships: 'Interprétation : les correspondances entre sources, ensembles stockés et vues peuvent être plusieurs-à-plusieurs
    ; leur nombre et leur cardinalité ne sont pas fixés.'
  boundary: Aucune correspondance automatique avec les sept sujets actuels. Une séparation logique ne prescrit ni déploiements
    ni technologies distincts.
  modeling_question: La structure fonctionnelle est claire. Assimiler un ensemble stocké à un Behavior métier reste une question
    de représentation à résoudre, sans modifier le sens donné par Laurent à Core Data.
candidate_contracts:
- name: Ingestion
  result: Recevoir les données fournies par les domaines sources.
  decomposition_axis: Domaine source.
- name: Core Data
  result: Organiser les données conservées par le domaine.
  decomposition_axis: Stockage.
- name: Visibility
  result: Exposer les vues nécessaires aux capacités de Supply Chain Orchestration.
  decomposition_axis: Besoins des capacités consommatrices ; découpage ou agrégation des vues.
example:
  status: fictional_FLOW_illustration
  source: Deux domaines externes fournissent respectivement des références produit et des sélections commerciales.
  storage: Ces apports alimentent des ensembles locaux produits et assortiments.
  view: Une vue pour une capacité Supply réunit la sélection applicable à un magasin et les caractéristiques des produits
    concernés.
  limits: Illustre le croisement des axes, sans imposer domaines amont réels, cardinalité, calcul métier, bases ou réalisation
    installée.
decomposition_rule: Conserver les trois axes clarifiés. Distinguer organisation fonctionnelle et qualification Behavior au
  sens de MOD006 ; ne pas renommer le stockage en gestion métier pour le faire entrer artificiellement dans ce type.
