ctp_and_procurement_U581:
  date: '2026-09-22'
  source_refs:
  - U581
  - CMP246
  - ELM417
  - ELM588
  - ELM566
  status: documented_answer_and_flow_recommendation_not_adopted
  market_findings:
  - Microsoft Batch CTP calcule les dates lorsque le plan dynamique est exécuté ; la méthode de contrôle des dates se choisit
    globalement ou par produit/commande/ligne. Un mode proche du temps réel est aussi documenté.
  - Microsoft master planning produit des Planned Orders ; leur firming crée les Orders réels. Proposer un achat est donc
    distinct de calculer une date CTP.
  - Oracle distingue recommandations nouvelles ou révisées, release et traitement aval des exceptions.
  flow_recommendation:
    activation: 'Le cadrage du calcul sélectionne les politiques autorisant les adaptations : achats, transferts, alternatives
      ou modifications admissibles. Ces politiques restent configurées à l’extérieur du Planning.'
    trigger: Mobiliser CTP lorsqu’il faut examiner une satisfaction sous adaptation, notamment après manque, retard ou changement
      de demande ; pas de séquence ATP puis CTP obligatoire.
    feasibility_owner: D03.j — CTP et ses comportements établissent les possibilités conditionnelles et impacts.
    plan_owner: D03.o — coordination du scénario commun ; pas de décision isolée qui consommerait plusieurs fois une ressource.
    procurement_owner: Supply Procurement Decision, capacité proposée dans U573/U574, détermine les suites d’achat à retenir
      avec les autres décisions.
    application: Plan Authorization puis Apply Plan selon les autorités applicables ; Purchase Order et Order Lifecycle Management
      gardent la tenue et les transitions des demandes. Fulfillment Commitment porte les promesses autorisées.
    forecast_boundary: Les achats destinés aux prévisions ou au stock peuvent être proposés par le plan sans CTP associé à
      une commande client.
  limits:
  - 'Aucune garantie que toute promesse existante puisse être tenue : dates, capacités, disponibilités et engagements peuvent
    rendre le problème infaisable.'
  - Un achat planifié ne prouve ni acceptation fournisseur ni disponibilité effective ; hypothèses et conditions restent visibles.
  - Si une date promise n’est pas tenable, le plan expose le manque, une alternative ou une révision à autoriser ; il ne rend
    pas la promesse valide en changeant silencieusement sa date.
  - Aucune activation réelle de paramètre ERP ni création de commande n’est effectuée.
  example:
    kind: illustration fictive FLOW
    demand: 100 pièces promises vendredi, 60 couvertes.
    candidate: Acheter 40 avec arrivée et mise à disposition compatibles.
    if_feasible: Le plan propose cet achat et une couverture conditionnelle des 100 pièces.
    if_not_feasible: Si l’achat arrive mardi suivant, le manque vendredi demeure ; examiner une autre source ou une livraison
      partielle et une révision autorisée du solde.
  market_documents:
  - id: ELM417
    title: Calculate sales order delivery dates using CTP
    url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/master-planning/planning-optimization/calculate-delivery-dates-using-ctp
    version: Documentation évolutive, lue le 22 septembre 2026
    locator: How CTP differs ; Set default delivery date control methods ; Schedule Batch CTP calculations
    consulted_on: '2026-09-22'
    access: Texte primaire directement consulté
    limit: CTP Microsoft centré sur dates et faisabilité matériaux/capacités ; pas identité de toutes les adaptations FLOW.
  - id: ELM588
    title: Maintain planned orders
    url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/master-planning/maintain-planned-orders
    version: Documentation évolutive ; 2025-08-05
    locator: Planned order status ; Firming planned orders
    consulted_on: '2026-09-22'
    access: Texte primaire directement consulté
    limit: Création d’un Order et acceptation ou réalisation fournisseur restent distinctes.
  - id: ELM566
    title: Manually Release Plan Recommendations
    url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/26b/faupc/manually-release-plan-recommendations.html
    version: 26B
    locator: Introduction ; release results ; Release Planned Buy Orders
    consulted_on: '2026-09-22'
    access: Texte primaire directement consulté
    limit: Transmission des recommandations et prise en compte aval non assimilées à satisfaction certaine.
