area_naming_review_U580:
  date: '2026-09-22'
  source_refs:
  - U580
  - CMP245
  status: recommended_name_adopted_U581_other_fields_not_adopted
  scope: 'Nom et responsabilité de l’Area entière : rapprocher besoins, ressources et engagements, arbitrer leurs adaptations
    et maintenir un résultat commun. La gestion du plan est une capacité contributrice.'
  candidates:
  - name: Demand & Supply Reconciliation
    market_basis: SAP emploie reconciliation pour la revue et convergence S&OP ; pas de nom d’Area commun établi dans le corpus.
    fit: Rend explicite la mise en cohérence des besoins et ressources.
    tradeoff: Peut être compris comme une étape d’alignement de plans ; exprime moins directement le choix entre solutions
      de valeurs différentes.
    assessment_kind: Interprétation sémantique FLOW à partir de ELM597.
  - name: Demand & Supply Optimization
    market_basis: SAP et Oracle documentent optimisation, contraintes et arbitrages sous des titres comprenant Supply Planning.
      Le nom exact n’est pas établi comme catégorie commune.
    fit: Met au premier plan le compromis entre satisfaction, engagements, économie, stock et risque.
    tradeoff: À définir comme optimisation de la couverture de la demande et des ressources ; ne pas déduire influence commerciale
      sur la demande ni garantie d’optimum mathématique.
    assessment_kind: Recommandation de vocabulaire FLOW, pas terme normalisé ni innovation démontrée.
  - name: Demand & Supply Planning
    market_basis: Oracle utilise Demand and Supply Planning et Demand and Supply Plan ; Microsoft et SAP utilisent d’autres
      intitulés Planning.
    fit: Option plus directement alignée sur les intitulés observés pour un périmètre intégré.
    tradeoff: Met la planification au premier plan et peut faire attendre la prévision de demande ; ne décide pas à elle seule
      le placement de Demand Planning.
  - name: Master Planning
    market_basis: Terme Microsoft établi pour calculer les besoins et préparer les apports, pas seulement administrer un plan.
    fit: Couvre déjà un contenu métier d’équilibrage.
    tradeoff: Sa lecture comme gestion du seul objet plan dans FLOW motive la recherche d’un nom exprimant davantage la finalité.
  recommendation:
    author: Codex
    preferred_between_user_options: Demand & Supply Optimization
    reason: 'La finalité FLOW dépasse la cohérence : choisir les adaptations de couverture et de ressources au regard de plusieurs
      dimensions de valeur, sans pondération implicite.'
    more_directly_market_aligned_alternative: Demand & Supply Planning
    draft_definition: Déterminer et actualiser le meilleur compromis de couverture des demandes et d’emploi ou d’adaptation
      des ressources Supply, dans le respect des engagements et contraintes applicables.
    market_status: Adaptation terminologique FLOW fondée sur des responsabilités documentées ; aucun consensus sur le nom
      exact revendiqué.
    approval_status: name_adopted_U581_only
  boundaries:
  - Gestion du plan, décisions contributrices, configuration et réalisation conservent leurs distinctions.
  - Demand Planning reste une responsabilité de prévision ; ni son déplacement ni la prise en charge de prix et promotions
    ne sont déduits du nom.
  - Réconciliation peut expliciter la responsabilité de cohérence au sein de l’optimisation, sans ajouter automatiquement
    une nouvelle capacité.
  - Un plan commun est maintenu ; aucun nouveau planning autonome.
