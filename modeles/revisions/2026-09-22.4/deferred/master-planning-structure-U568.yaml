decision_content_U579:
  date: '2026-09-22'
  source_refs:
  - U579
  - CMP244
  status: diagnosis_and_decomposition_proposed_not_adopted
  finding: La présentation de Master Plan Management a masqué le contenu des arbitrages. D03.o couvre déjà le scénario collectif
    mais ses mécanismes ne sont pas décomposés ; le regroupement Apply Plan porte les effets, pas le choix des affectations.
  core_decision:
    existing_id: D03.o
    name: Fulfillment Plan Decision
    kind: capability
    nature: decision
    proposed_parent: proposal:Demand & Supply Optimization
    definition: Déterminer un scénario cohérent de couverture des commandes et prévisions restantes, en coordonnant ressources,
      priorités et décisions contributrices.
    definition_status: synthèse proposée ; définition canonique et autres champs non modifiés
    decomposition_rationale: Trois comportements terminaux combinables rendent visibles couverture, partage de la rareté et
      réexamen ; ils produisent un résultat commun, pas trois plans indépendants.
    behaviors:
    - proposal_key: demand-coverage
      name: Demand Coverage
      definition: Déterminer quelles ressources présentes ou futures couvrent quels besoins, avec quantités, dates et reste
        non couvert.
      example: Couvrir 80 pièces d’une demande de 100 et rendre explicites les 20 manquantes.
      market_refs:
      - ELM223
      - ELM363
      boundary: Les prévisions restantes sont incluses selon U565 ; les sources ARun et Backlog Management citées portent
        ici sur des Orders, sans prouver à elles seules ce périmètre prévisionnel.
      kind: behavior
      parent: D03.o
      status: proposed_not_created
      source_refs:
      - U579
      - CMP244
      - ELM223
      - ELM363
      decomposition_rationale: Rendre visible le résultat de couverture et les manques.
    - proposal_key: scarce-supply-distribution
      name: Scarce Supply Distribution
      definition: Déterminer les parts de ressources limitées attribuables aux besoins concurrents selon priorités, protections
        et critères de valeur.
      example: Pour des besoins de 100 et 200 et une ressource de 150, un prorata peut proposer 50 et 100 ; ce résultat n’impose
        pas le prorata comme politique générale.
      market_refs:
      - ELM222
      - ELM223
      boundary: Spread est une logique SAP ERP Fashion de répartition ; pas une découpe des Orders ni un synonyme du processus
        ARun. Les politiques sont des entrées et leur administration reste extérieure.
      kind: behavior
      parent: D03.o
      status: proposed_not_created
      source_refs:
      - U579
      - CMP244
      - ELM222
      - ELM223
      decomposition_rationale: Expliciter l’arbitrage de rareté, au-delà d’un simple classement des demandes.
    - proposal_key: backlog-reconciliation
      name: Backlog Reconciliation
      definition: Réexaminer la couverture du carnet quand les ressources, besoins ou priorités changent, et déterminer les
        réaffectations admissibles et leurs conséquences.
      example: Après un retard d’arrivage, réexaminer la couverture de deux commandes et proposer le rééquilibrage compatible
        avec les engagements.
      market_refs:
      - ELM458
      - ELM363
      boundary: 'Rapprochement partiel avec BOP : SAP couvre aussi des modifications de confirmations. La décision FLOW propose
        ; Apply Plan et Fulfillment Commitment portent les suites autorisées.'
      kind: behavior
      parent: D03.o
      status: proposed_not_created
      source_refs:
      - U579
      - CMP244
      - ELM458
      - ELM363
      decomposition_rationale: Distinguer le réexamen d’une couverture existante en préservant contraintes et engagements.
  other_contributing_capabilities:
  - id: D03.m
    name: Order Prioritization
