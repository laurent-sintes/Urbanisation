boundaries:
- Trois comportements au même niveau terminal, sans sous-comportement ni chaîne obligatoire magasin puis entrepôt puis réseau.
- Le multi-échelon peut reconsidérer les cibles locales ; il ne se limite pas à additionner des résultats locaux figés.
- Entrepôt qualifié par son rôle de centre de distribution ; aucun Warehouse Optimization de picking, de rangement ou de main-d’œuvre
  transféré depuis les exécutants.
- Prendre en compte les besoins aval localement n’équivaut pas à décider conjointement toutes les cibles du réseau.
- Les objectifs restent distincts des apports, transferts et affectations aux Orders.
other_contexts: Dark store, hub régional, réserve magasin ou stock de retours à qualifier par rôle et bénéfice ; aucun comportement
  supplémentaire à partir du seul type de lieu.
