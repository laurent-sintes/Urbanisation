    url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/procurement/tasks/record-receipt-goods-purchase-order
    locator: Record receipt of goods, étapes 4–7 ; consultation U461, mise à jour indiquée le 1er juillet 2026
    consulted_on: '2026-09-19'
    limit: Appui repris de ELM285/CMP178, consulté pendant U461 le même jour. Une tentative de réouverture U465 n’a pas abouti
      ; aucun constat nouveau.
  relationship: semantic_or_methodological_support
  observed: L’exemple produit décrit un document identifié qui rend compte de la réception enregistrée.
  common_ground: Illustre un constat de réception documenté et son rapprochement avec l’achat.
  flow_difference: Le lien obligatoire fait–document vient de U461. Les informations conceptuelles de prestation et de solde
    ne sont pas présentées comme des objets Microsoft identiques.
  status: comparison_proposed
  author: Codex
  as_of: '2026-09-19'
- id: MS-PRODUCT
  source_refs:
  - ELM280
  sources:
  - title: Microsoft — Product information overview
    url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/pim/product-information
    locator: Product definition ; Product masters and product variants ; page indiquée mise à jour le 1er juillet 2026
    consulted_on: '2026-09-19'
    limit: Page officielle consultée ; synthèse sans reproduction du contenu.
  relationship: semantic_or_methodological_support
  observed: La documentation distingue produits, variantes, propriétés et identifiants ; les variantes se définissent selon
    des combinaisons de dimensions.
  common_ground: Aide à distinguer référence concernée et caractéristiques utiles.
  flow_difference: Le produit Microsoft inclut l’administration de maîtres. Les référentiels Supply FLOW sont des projections
    ; leurs autorités externes ne sont pas attribuées ici.
  status: comparison_proposed
  author: Codex
  as_of: '2026-09-19'
- id: GS1-IDENTITY
  source_refs:
  - ELM282
  - ELM280
  sources:
  - title: GS1 — Serialisation and unique identification
    url: https://support.gs1.org/support/solutions/articles/43000734238-how-does-serialisation-differ-from-unique-identification-in-the-gs1-system-
    locator: FAQ, distinction GTIN et identification sérialisée ; modification indiquée le 28 août 2024
    consulted_on: '2026-09-19'
    limit: FAQ officielle, pas lecture exhaustive des spécifications normatives GS1.
  relationship: semantic_or_methodological_support
  observed: GS1 illustre l’identification d’une instance par l’association du GTIN et d’un numéro de série.
  common_ground: Un identifiant de référence ne suffit pas toujours à identifier un exemplaire.
  flow_difference: Aucun format GS1 imposé aux références FLOW ni obligation de sérialisation de chaque unité.
  status: comparison_proposed
  author: Codex
  as_of: '2026-09-19'
- id: FLOW-PROJECTION
  source_refs:
  - U460
  - ELM269
  - ELM276
  - CMP183
  sources:
  - title: TOGAF — Information Mapping, G190
    url: https://governance.foundation/assets/frameworks/togaf/g190%20-%20Information%20Mapping.pdf
    locator: Chapitres 1–2 et 4–6 ; lecture U464
    consulted_on: '2026-09-19'
    limit: Document primaire de 2019 sur miroir tiers, relu en U464 ; aucune vérification de toute la 10e édition ni de règle
      d’autorité locale.
  relationship: semantic_or_methodological_support
  observed: La cartographie d’information relie concepts métier et capacités indépendamment des réalisations informatiques.
  common_ground: Autorité et provenance rendent la projection intelligible pour ses capacités utilisatrices.
  flow_difference: Le découpage Reference Authority / Reference Receipt est une proposition FLOW motivée par les cas U460
    ; aucun objet normalisé homonyme ni autorité Beaumanoir prouvée.
  status: comparison_proposed
  author: Codex
  as_of: '2026-09-19'
- id: MARKET-PROMISE
  source_refs:
  - ELM220
  - ELM248
  - U466
  sources:
  - title: Microsoft — Delivery schedules
    url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/sales-marketing/delivery-schedules
    locator: Delivery schedules ; répartition en plusieurs livraisons ; mise à jour indiquée le 7 mai 2025
    consulted_on: '2026-09-19'
    limit: Page officielle consultée ; synthèse sans reproduction du contenu.
  - title: Oracle 26B — What’s a Split Order Line
    url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/26b/fauom/fulfillment-line-splits.html
    locator: Introduction et éclatement selon ressources ou dates
    consulted_on: '2026-09-19'
    limit: Page officielle consultée ; synthèse sans reproduction du contenu.
  relationship: semantic_or_methodological_support
  observed: Microsoft et Oracle documentent des répartitions d’une demande en quantités associées à des dates ou ressources
    différentes.
  common_ground: Les associations quantité–date doivent conserver leur sens dans une proposition comme dans un engagement.
  flow_difference: Ces sources illustrent les échéances ; elles ne démontrent pas deux concepts universels Proposal/Commitment.
    La distinction est adoptée par U466, avec versions et confirmations encore ouvertes.
  status: comparison_proposed
  author: Codex
  as_of: '2026-09-19'
- id: MS-ASSIGNMENT
  source_refs:
  - ELM284
  sources:
  - title: Microsoft — Keep supply for confirmed demand
    url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/master-planning/planning-optimization/keep-supply-for-confirmed-demand
    locator: What data is preserved ; Control how on-hand inventory is pegged ; documentation indiquée le 27 juillet 2026
    consulted_on: '2026-09-19'
    limit: Page officielle consultée ; synthèse sans reproduction du contenu.
  relationship: semantic_or_methodological_support
  observed: Microsoft décrit le maintien de liens de couverture pour les demandes confirmées et un contrôle du pegging du
    stock disponible.
  common_ground: Un lien ressource–demande peut être maintenu ou réexaminé lors de la planification.
  flow_difference: Le mécanisme produit recoupe plusieurs capacités FLOW. Il ne prouve ni équivalence complète avec Supply
    Assignment ni réservation par une affectation FLOW.
  status: comparison_proposed
  author: Codex
  as_of: '2026-09-19'
- id: MS-RESERVATION
  source_refs:
  - ELM283
  - U436
  sources:
  - title: Microsoft — Inventory Visibility reservations
    url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/inventory/inventory-visibility-reservations
    locator: Introduction ; Sample use case
    consulted_on: '2026-09-19'
    limit: Page officielle consultée ; synthèse sans reproduction du contenu.
  relationship: semantic_or_methodological_support
  observed: La réservation souple affecte la quantité disponible à réserver sans changer la quantité physique. Le service
    propose aussi des options de comportement.
  common_ground: Le droit de réservation et le mouvement physique restent distincts.
  flow_difference: U436 définit l’opposabilité FLOW. Aucune option d’overselling, libération ou consommation Microsoft n’est
    adoptée ; le fonctionnement installé n’est pas évalué.
  status: comparison_proposed
  author: Codex
  as_of: '2026-09-19'
