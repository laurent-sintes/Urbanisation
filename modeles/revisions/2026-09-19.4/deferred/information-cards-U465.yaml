additional_examples:
- id: CASE-U465-01
  information_refs:
  - PINFO-011
  - PINFO-012
  title: Révision proposée, engagement encore valable
  example: 100 vendredi reste engagé pendant l’examen d’une proposition 60 vendredi / 40 lundi.
  expected_reading: Deux informations reliées ; l’existence de la proposition ne remplace pas l’engagement.
  source_refs:
  - U466
- id: CASE-U465-02
  information_refs:
  - PINFO-007
  - PINFO-009
  - PINFO-010
  title: Émetteur intermédiaire et autorité distincts
  example: Un distributeur transmet une caractéristique dont l’autorité déclarée est un autre rôle externe.
  expected_reading: Transmission, autorité et validité ont des sens distincts. Le cas ne prouve aucune source installée.
  source_refs:
  - U460
- id: CASE-U465-03
  information_refs:
  - PINFO-006
  - PINFO-008
  title: Référence partagée, exemplaires distincts
  example: Dix exemplaires de la même variante portent le même identifiant de référence.
  expected_reading: La correspondance à la référence ne suffit pas à identifier chacun des dix exemplaires.
  source_refs:
  - U460
  - ELM282
- id: CASE-U465-04
  information_refs:
  - PINFO-011
  - PINFO-012
  title: Préserver les associations quantité–date
  example: 60 vendredi et 40 lundi ne signifient pas la même chose que 40 vendredi et 60 lundi.
  expected_reading: Le lien quantité–date est indispensable ; cela ne prouve pas qu’un échéancier complet est un fait élémentaire
    unique.
  source_refs:
  - U464
  - ELM220
  - ELM248
recommendation:
  result: Les cinq pilotes permettent de distinguer des sens autonomes sans ajouter de niveau à Univers/Domaine/Capacité/Comportement.
  next_step: 'Préparer le contrat minimal de catalogue et la lecture métier dans Atlas à partir de ces fiches : question,
    définition, contexte, liens, usages, exemples et marché. Conserver les règles non établies comme inconnues explicites,
    sans inventer de réalisation.'
  human_review: Faire relire les frontières et les mots par PO et experts ; cet exercice documentaire ne remplace pas leur
    revue.
  open_business_rules:
  - 'V0-P02 : autorités des projections, conflits, fraîcheur par usage.'
  - 'V0-P03 : acceptation fournisseur et confirmation/révision des engagements ; reconnaissance des prestations.'
  - 'V0-A01/V0-A02/V0-A06 : coordination des affectations et droits, expiration, consommation et libération.'
  excluded: Pas de généralisation à tout le modèle, schéma implémentable, réouverture de l’audit des comportements ou publication
    implicite.
