id: information-cards-U465
as_of: '2026-09-19'
status: pilot_proposals_with_bounded_U466_adoption
source_refs:
- U464
- U465
- U466
- U436
- U460
- U461
- CMP183
- CMP184
scope: Cinq pilotes métier ; quatorze types d’information proposés pour éprouver la maille MOD012. Ces fiches ne constituent
  ni le catalogue exhaustif ni un modèle de données implémentable.
authority: Annexe YAML du backlog ; les identifiants PINFO/PILINK sont propres au pilote, sans insertion dans les nœuds ou
  relations canoniques.
review_boundary: U466 adopte seulement deux informations reliées, proposition et engagement de satisfaction, avec coexistence
  possible. Les rédactions, autres découpages, rôles et comparaisons restent proposés.
reading_rules:
- Lire la question métier avant les éléments essentiels ; ces derniers décrivent le sens, pas des colonnes obligatoires.
- Le minimum est relatif à la question et aux capacités. Il n’établit ni normalisation de données ni irréductibilité logique
  SBVR/ORM.
- Les liens décrivent une signification, ses conditions et son effet ; leur flèche n’est ni un flux technique ni une séquence
  imposée.
- Les rôles des capacités décrivent leur contribution ; aucun propriétaire exclusif, acteur installé ou architecture de composants
  n’est inféré.
- Objet, information, document et fait restent distincts. Les documents peuvent formaliser plusieurs informations ; tout fait
  de gestion a son document identifié U461.
- Les exemples sont illustratifs et contextualisés à partir des échanges ; aucune observation installée ni validation humaine
  des scénarios.
cards:
- id: PINFO-001
  pilot_ref: PILOT-PURCHASE
  name: Purchase Requirement
  label_fr: Attendu d’achat
  question: Qu’est-ce qui est demandé au fournisseur pour cette partie de l’achat ?
  definition: 'Attendu exprimé envers un fournisseur pour une partie identifiée d’un achat : bien ou prestation, quantité
    ou résultat attendu, destinataire et conditions de réalisation demandées.'
  context: Une partie de Purchase Order dont l’attendu peut être expliqué séparément. Une commande peut en réunir plusieurs
    ; aucune structure de ligne informatique imposée.
  essential_elements:
  - Commande et partie concernées ; fournisseur sollicité.
  - Bien ou prestation et quantité avec unité, ou résultat attendu si la prestation n’est pas quantifiée.
  - Destinataire, échéance et conditions nécessaires pour comprendre l’attendu.
  granularity_rationale: Conserver ensemble l’objet demandé, son étendue et ses conditions évite de confondre deux demandes
    du même bien. Une autre échéance autonome se décrit avec son propre attendu.
  separate_meanings:
  - La réponse fournisseur, les conditions acceptées et la réalisation répondent à d’autres questions.
  - Prix ou modalités de paiement ne sont décrits ici que s’ils changent le sens de l’attendu étudié ; aucun dossier achat
    exhaustif.
  capability_roles:
  - capability_ref: D04.j
    role: établit et fait évoluer
    meaning: Maintient l’attendu de l’achat selon les changements autorisés.
    qualification: proposed_from_current_responsibility
    source_refs:
    - U391
    - U403
  - capability_ref: D07.c
    role: utilise
    meaning: Rapproche les résultats de service de ce qui était attendu.
    qualification: proposed_from_current_responsibility
    source_refs:
    - U460
  document_and_fact_boundary: Aucun fait de gestion nouveau n’est qualifié par cette fiche. Le lien U461 s’applique dès qu’un
    fait de gestion est décrit ; il n’exige pas un document propre à chaque propriété.
  example:
    kind: illustrative_not_observed
    text: La partie A de l’achat PO-EXEMPLE-01 demande 100 pièces de la variante V au fournisseur F, livrées au site S vendredi.
      « 100 » seul ne dit ni quoi, ni pour qui, ni quand.
    source_refs:
    - U391
    - U403
    - U460
  market_comparison:
    support_ref: MS-PURCHASE
    term_choice: Purchase Requirement est un libellé descriptif proposé pour l’attendu au sein d’un Purchase Order ; ce n’est
      ni une Purchase Requisition distincte ni un nom normalisé revendiqué.
    definition_choice: La documentation Microsoft distingue commande envoyée et réponse du fournisseur. FLOW en extrait l’attendu
      métier sans reprendre les états, lignes ou écrans du produit.
    status: proposed_not_validated
  source_refs:
  - U464
  - U465
  - U391
  - U403
  - U460
  - CMP184
  open_items:
  - V0-P03
  review:
    definition: proposed
    granularity: proposed
    roles: proposed
    example: editorial_illustration
    limits: Ni identité technique, ni cardinalité, ni autorité installée déduite.
- id: PINFO-002
  pilot_ref: PILOT-PURCHASE
  name: Supplier Response
  label_fr: Réponse fournisseur
  question: Quelle réponse le fournisseur apporte-t-il à cet attendu d’achat ?
  definition: 'Position reçue d’un fournisseur sur une partie d’achat demandée : acceptation, refus ou proposition de conditions
    différentes.'
  context: Une réponse attribuée à un fournisseur et rattachée à l’attendu auquel elle répond ; ses conditions conservent
    leurs associations quantité–date.
  essential_elements:
  - Fournisseur répondant et attendu concerné.
  - Position exprimée et conditions proposées ou motif de refus utile.
  - Moment ou contexte permettant de distinguer cette réponse de celles qu’elle réexamine.
  granularity_rationale: Une réponse peut être reçue et étudiée sans être acceptée. Son sens autonome justifie une fiche distincte
    de l’engagement accepté.
  separate_meanings:
  - Réception d’une réponse ne vaut pas acceptation.
  - Identité des révisions, délai de réponse et pouvoir d’acceptation restent ouverts.
  capability_roles:
  - capability_ref: D04.j
    role: reçoit et connaît
    meaning: Supplier Confirmation BHV078 explicite les réponses et écarts à l’attendu.
    qualification: proposed_from_current_responsibility
    source_refs:
    - U403
    - U460
  document_and_fact_boundary: Aucun fait de gestion nouveau n’est qualifié par cette fiche. Le lien U461 s’applique dès qu’un
    fait de gestion est décrit ; il n’exige pas un document propre à chaque propriété.
  example:
    kind: illustrative_not_observed
    text: Pour 100 pièces demandées vendredi, F propose 60 vendredi et 40 mardi. La réponse est connue ; aucune acceptation
      de ces nouvelles conditions n’est supposée.
    source_refs:
    - U403
    - U460
  market_comparison:
    support_ref: MS-PURCHASE
    term_choice: Supplier Response conserve le sens métier des vendor responses Microsoft, avec Supplier déjà utilisé dans
      FLOW. L’information ne se limite pas à une confirmation positive.
    definition_choice: Acceptation, refus et changements documentés par Microsoft étayent la séparation entre réponse et conditions
      retenues. U466 ne valide pas cette séparation côté achats par extension.
    status: proposed_not_validated
  source_refs:
  - U464
  - U465
  - U403
  - U460
  - CMP184
  open_items:
  - V0-P03
  review:
    definition: proposed
    granularity: proposed
    roles: proposed
    example: editorial_illustration
    limits: Ni identité technique, ni cardinalité, ni autorité installée déduite.
- id: PINFO-003
  pilot_ref: PILOT-PURCHASE
  name: Supplier Commitment
  label_fr: Engagement fournisseur accepté
  question: Quelles conditions de réalisation de cet achat sont actuellement retenues ?
  definition: Conditions de réalisation retenues comme engagement du fournisseur pour une partie identifiée d’un achat, après
    l’acceptation requise dans ce contexte métier.
  context: Engagement relatif à l’achat fournisseur. Il ne se confond pas avec la promesse faite au bénéficiaire d’une autre
    commande.
  essential_elements:
  - Fournisseur et partie d’achat concernée.
  - Quantité et unité, ou résultat attendu, associés aux échéances et conditions retenues.
  - Référence au contexte d’acceptation qui permet de distinguer engagement et simple réponse.
  granularity_rationale: L’engagement peut rester valable pendant l’examen d’une réponse différente. Les preuves et règles
    permettant de le reconnaître restent à préciser, sans inférer une nouvelle règle d’autorisation.
  separate_meanings:
  - Ne désigne pas tout le dossier fournisseur.
  - N’entraîne ni réception, ni nouvelle promesse client, ni réservation automatique.
  capability_roles:
  - capability_ref: D04.j
    role: maintient
    meaning: Distingue l’attendu initial des conditions fournisseur effectivement acceptées.
    qualification: proposed_from_current_responsibility
    source_refs:
    - U403
    - U460
  - capability_ref: D03.n
    role: utilise
    meaning: Prend en compte les conditions fournisseur pertinentes pour examiner la promesse de satisfaction, sans copie
      automatique.
    qualification: proposed_from_current_responsibility
    source_refs:
    - U441
    - U460
  document_and_fact_boundary: Aucun fait de gestion nouveau n’est qualifié par cette fiche. Le lien U461 s’applique dès qu’un
    fait de gestion est décrit ; il n’exige pas un document propre à chaque propriété.
  example:
    kind: illustrative_not_observed
    text: Les 60 pièces vendredi et 40 mardi sont acceptées pour cet achat. Une promesse client de 100 vendredi reste un engagement
      distinct à réexaminer ; elle n’est pas réécrite silencieusement.
    source_refs:
    - U403
    - U441
    - U460
  market_comparison:
    support_ref: MS-PURCHASE
    term_choice: Supplier Commitment reprend le candidat existant en précisant ici « accepté ». Confirmed Purchase Order serait
      plus documentaire et trop large pour cette partie d’achat.
    definition_choice: Microsoft distingue réponse fournisseur et commande confirmée. L’engagement conceptuel proposé ne reprend
      ni la confirmation automatique du produit ni son modèle de versions.
    status: proposed_not_validated
  source_refs:
  - U464
  - U465
  - U403
  - U441
  - U460
  - CMP184
  open_items:
  - V0-P03
  review:
    definition: proposed
    granularity: proposed
    roles: proposed
    example: editorial_illustration
    limits: Ni identité technique, ni cardinalité, ni autorité installée déduite.
- id: PINFO-004
  pilot_ref: PILOT-PURCHASE
  name: Purchase Fulfillment Result
  label_fr: Réalisation d’achat constatée
  question: Qu’a-t-on constaté comme réalisé pour cet attendu d’achat ?
  definition: Résultat de réception d’un bien ou de réalisation d’une prestation, rapproché d’un attendu d’achat et qualifié
    avec ses éventuels écarts.
  context: Un résultat métier constaté pour une partie d’achat et un moment donnés ; aucune réalisation physique exécutée
    par la seule cartographie.
  essential_elements:
  - Attendu concerné et bien reçu ou prestation réalisée.
  - Quantité avec unité ou résultat observé, moment et écarts utiles.
  - Document métier identifié qui consigne le fait de gestion correspondant.
  granularity_rationale: Sans attendu, moment et quantité ou résultat, le constat ne permet pas de dire ce qui a été réalisé.
    Un autre constat indépendant garde son propre sens.
  separate_meanings:
  - Un résultat n’est ni l’engagement fournisseur ni le solde restant.
  - Le lieu de constat, la validation de qualité et les corrections ne sont détaillés que si les règles métier l’exigent.
  capability_roles:
  - capability_ref: D07.c
    role: rapproche et qualifie
    meaning: Rapproche les réalisations reçues des attendus et qualifie les écarts ; ne devient pas le réceptionnaire physique.
    qualification: proposed_from_current_responsibility
    source_refs:
    - U460
  - capability_ref: D04.j
    role: utilise
    meaning: Explique la progression de l’achat à partir des réalisations reconnues.
    qualification: proposed_from_current_responsibility
    source_refs:
    - U391
    - U461
  document_and_fact_boundary: Le résultat rend compte d’un fait de gestion. U461 impose un document identifié ; son auteur,
    le nombre exact de documents, les corrections et les preuves d’acceptation ne sont pas inventés.
  example:
    kind: illustrative_not_observed
    text: REC-EXEMPLE-01 consigne la réception de 60 pièces sur les 100 attendues. Pour une prestation, un document identifié
      pourrait consigner le résultat observé ; son type et son auteur restent à établir.
    source_refs:
    - U391
    - U460
    - U461
  market_comparison:
    support_ref: MS-RECEIPT
    term_choice: Purchase Fulfillment Result est proposé pour couvrir biens et prestations. Product receipt serait trop étroit
      ; Receipt Fact reste le cas illustré de réception.
    definition_choice: Le document de réception Microsoft fournit un exemple concret de constat documenté. Le lien obligatoire
      fait–document vient de U461 ; la généralisation aux prestations reste conceptuelle.
    status: proposed_not_validated
  source_refs:
  - U464
  - U465
  - U391
  - U460
  - U461
  - CMP184
  open_items:
  - V0-P03
  review:
    definition: proposed
    granularity: proposed
    roles: proposed
    example: editorial_illustration
    limits: Ni identité technique, ni cardinalité, ni autorité installée déduite.
- id: PINFO-005
  pilot_ref: PILOT-PURCHASE
  name: Purchase Fulfillment Balance
  label_fr: Reste à réaliser d’achat
  question: Que reste-t-il à réaliser au regard de l’attendu actuellement applicable ?
  definition: Part encore attendue d’un achat, expliquée à partir de l’attendu applicable et des réalisations reconnues dans
    un contexte d’appréciation donné.
  context: Une partie d’achat et une situation de référence explicites ; le reste peut être quantitatif ou exprimé comme résultat
    restant à atteindre.
  essential_elements:
  - Attendu applicable et contexte d’appréciation.
  - Réalisations reconnues et ajustements métier applicables, lorsqu’ils sont établis.
  - Reste à réaliser, avec unité ou résultat attendu et explication du rapprochement.
  granularity_rationale: Le solde répond à une question différente du dernier constat. On conserve ses bases d’interprétation
    pour ne pas confondre restant demandé, accepté et réalisé.
  separate_meanings:
  - Aucune formule universelle pour retours, annulations, dépassements ou prestations.
  - Une information calculée n’est pas automatiquement un nouveau fait de gestion.
  capability_roles:
  - capability_ref: D04.j
    role: connaît et fait évoluer
    meaning: Rend lisible la part restant à réaliser dans le suivi de l’achat.
    qualification: proposed_from_current_responsibility
    source_refs:
    - U391
    - U460
  document_and_fact_boundary: Aucun fait de gestion nouveau n’est qualifié par cette fiche. Le lien U461 s’applique dès qu’un
    fait de gestion est décrit ; il n’exige pas un document propre à chaque propriété.
  example:
    kind: illustrative_not_observed
    text: 'Dans le cas simple sans autre changement : 100 pièces encore applicables, 60 reconnues reçues, donc 40 restantes.
      Une annulation autorisée de 10 demanderait une règle explicite ; elle n’est pas déduite de cette soustraction.'
    source_refs:
    - U391
    - U460
    - U461
  market_comparison:
    support_ref: MS-RECEIPT
    term_choice: Purchase Fulfillment Balance est descriptif et proposé. Le vocabulaire exact d’un solde de réception ERP
      n’est pas adopté comme terme universel.
    definition_choice: Le suivi des réceptions éclaire le besoin ; la fiche FLOW est motivée par la question « que reste-t-il
      ? ». La source ne prouve pas une information autonome identique pour toutes les prestations.
    status: proposed_not_validated
  source_refs:
  - U464
  - U465
  - U391
  - U460
  - U461
  - CMP184
  open_items:
  - V0-P03
  review:
    definition: proposed
    granularity: proposed
    roles: proposed
    example: editorial_illustration
    limits: Ni identité technique, ni cardinalité, ni autorité installée déduite.
- id: PINFO-006
  pilot_ref: PILOT-PRODUCT
  name: Product Reference Identity
  label_fr: Identité de référence produit
  question: De quelle référence de produit ou variante parle-t-on ?
  definition: Identification métier du produit ou de la variante auxquels se rapportent les informations projetées dans Supply,
    avec les distinctions nécessaires pour les reconnaître.
  context: Une référence partagée de produit ou variante, distincte d’un exemplaire physique et de sa présence dans un catalogue.
  essential_elements:
  - Référence reconnue et nature Produit ou Variante.
  - Pour une variante, produit de rattachement et combinaison de caractéristiques qui la distingue dans ce contexte.
  granularity_rationale: La référence fournit le sujet des autres informations sans absorber toutes ses caractéristiques.
    La combinaison distinctive d’une variante est utile à sa reconnaissance, sans prétendre être un fait logique élémentaire.
  separate_meanings:
  - Présence dans un catalogue, identifiant commercial et unité physique gardent des sens distincts.
  - Article et Container restent des rôles déjà définis, sans créer ici de nouveaux types de produits.
  capability_roles:
  - capability_ref: D08.d
    role: reçoit et projette
    meaning: Reconnaît les références externes dans la projection Supply.
    qualification: proposed_from_current_responsibility
    source_refs:
    - U460
  - capability_ref: D04.j
    role: utilise
    meaning: Désigne la référence concernée par l’achat sans devenir maître de sa définition.
    qualification: proposed_from_current_responsibility
    source_refs:
    - U460
  document_and_fact_boundary: Aucun fait de gestion nouveau n’est qualifié par cette fiche. Le lien U461 s’applique dès qu’un
    fait de gestion est décrit ; il n’exige pas un document propre à chaque propriété.
  example:
    kind: illustrative_not_observed
    text: La variante V « modèle M, bleu, taille 38 » apparaît dans deux catalogues. Il s’agit d’une référence de variante,
      pas de deux variantes ni d’un exemplaire physique unique.
    source_refs:
    - U460
    - ELM280
    - ELM282
  market_comparison:
    support_ref: MS-PRODUCT
    term_choice: Product et Product Variant sont déjà définis dans FLOW et présents chez Microsoft. Product Reference Identity
      décrit leur reconnaissance ; ce composé n’est pas revendiqué comme standard.
    definition_choice: La distinction produit/variante étaye le sujet projeté. La création et l’administration de maîtres
      décrites par Microsoft restent extérieures à Supply.
    status: proposed_not_validated
  source_refs:
  - U464
  - U465
  - U460
  - ELM280
  - ELM282
  - CMP184
  open_items:
  - V0-P02
  review:
    definition: proposed
    granularity: proposed
    roles: proposed
    example: editorial_illustration
    limits: Ni identité technique, ni cardinalité, ni autorité installée déduite.
- id: PINFO-007
  pilot_ref: PILOT-PRODUCT
  name: Product Characteristic
  label_fr: Caractéristique produit
  question: Quelle caractéristique est affirmée pour cette référence dans ce contexte ?
  definition: Valeur d’une propriété d’un produit ou d’une variante, reliée à son sujet et au contexte dans lequel cette valeur
    s’applique.
  context: Une assertion de caractéristique utile aux capacités étudiées. Deux propriétés autonomes ou deux contextes contradictoires
    ne sont pas fusionnés en une valeur unique.
  essential_elements:
  - Référence concernée et propriété décrite.
  - Valeur et unité lorsqu’elle est nécessaire au sens.
  - Périmètre et période d’application utiles ; origine permettant de qualifier l’affirmation.
  granularity_rationale: « 0,4 kg » ne porte pas le sens étudié sans sujet et propriété. Couleur et poids répondent à deux
    questions autonomes ; on ne déclare pas toute la fiche produit insécable.
  separate_meanings:
  - Réception récente ne garantit pas validité actuelle.
  - Une propriété n’exige pas un document distinct au titre de U461.
  capability_roles:
  - capability_ref: D08.d
    role: reçoit et met à jour la projection
    meaning: Conserve les caractéristiques reçues avec le contexte permettant de les interpréter.
    qualification: proposed_from_current_responsibility
    source_refs:
    - U460
  document_and_fact_boundary: Aucun fait de gestion nouveau n’est qualifié par cette fiche. Le lien U461 s’applique dès qu’un
    fait de gestion est décrit ; il n’exige pas un document propre à chaque propriété.
  example:
    kind: illustrative_not_observed
    text: 'L’émetteur A affirme « poids net de V : 0,4 kg, applicable au lot de fabrication considéré » ; B affirme 0,5 kg
      dans le même contexte. Les deux assertions sont compréhensibles, mais leur conflit ne se tranche pas par la date de
      réception seule.'
    source_refs:
    - U460
    - ELM280
    - U464
  market_comparison:
    support_ref: MS-PRODUCT
    term_choice: Product Characteristic désigne le sens métier commun des propriétés et attributes documentés. Attribute pourrait
      évoquer un champ de produit ; aucun schéma de champs n’est prescrit.
    definition_choice: Microsoft fournit des exemples de propriétés produit. Le choix d’une assertion contextualisée est la
      proposition de granularité FLOW, pas une équivalence avec son stockage des attributs.
    status: proposed_not_validated
  source_refs:
  - U464
  - U465
  - U460
  - ELM280
  - CMP184
  open_items:
  - V0-P02
  review:
    definition: proposed
    granularity: proposed
    roles: proposed
    example: editorial_illustration
    limits: Ni identité technique, ni cardinalité, ni autorité installée déduite.
- id: PINFO-008
  pilot_ref: PILOT-PRODUCT
  name: Product Identifier Association
  label_fr: Association d’identifiant produit
  question: À quelle référence correspond cet identifiant dans ce système d’identification ?
  definition: Correspondance entre un identifiant interprété dans son système ou contexte d’attribution et la référence produit
    ou variante qu’il désigne.
  context: Identification d’une référence ; aucune unicité mondiale d’un code local ni identification implicite d’un exemplaire.
  essential_elements:
  - Valeur de l’identifiant et système ou contexte d’attribution.
  - Référence désignée et périmètre d’application utile.
  granularity_rationale: Le même texte de code peut avoir des sens différents selon son émetteur. Sujet désigné et système
    d’identification sont indispensables à la correspondance.
  separate_meanings:
  - Identité métier et code qui la désigne ne sont pas synonymes.
  - Une association GTIN–référence ne prouve pas l’identité d’une unité physique.
  capability_roles:
  - capability_ref: D08.d
    role: reçoit et projette
    meaning: Conserve les correspondances reçues pour reconnaître les références.
    qualification: proposed_from_current_responsibility
    source_refs:
    - U460
  document_and_fact_boundary: Aucun fait de gestion nouveau n’est qualifié par cette fiche. Le lien U461 s’applique dès qu’un
    fait de gestion est décrit ; il n’exige pas un document propre à chaque propriété.
  example:
    kind: illustrative_not_observed
    text: Le code fournisseur F:123 renvoie à V. Un identifiant de référence partagé par dix exemplaires ne suffit pas à distinguer
      ces dix unités ; GS1 illustre cette autre question par GTIN et numéro de série.
    source_refs:
    - U460
    - ELM280
    - ELM282
  market_comparison:
    support_ref: GS1-IDENTITY
    term_choice: Identifier est établi dans les sources Microsoft/GS1 ; Association explicite ici la correspondance métier.
      Aucun format d’identifiant FLOW n’est imposé.
    definition_choice: La distinction GS1 référence/instance borne le sens de cette fiche. Il ne s’agit ni d’une conformité
      GS1 ni d’une obligation de sérialiser toutes les unités.
    status: proposed_not_validated
  source_refs:
  - U464
  - U465
  - U460
  - ELM280
  - ELM282
  - CMP184
  open_items:
  - V0-P02
  review:
    definition: proposed
    granularity: proposed
    roles: proposed
    example: editorial_illustration
    limits: Ni identité technique, ni cardinalité, ni autorité installée déduite.
- id: PINFO-009
  pilot_ref: PILOT-PRODUCT
  name: Reference Authority
  label_fr: Autorité sur l’information de référence
  question: Quelle autorité fait foi pour cette information dans ce périmètre ?
  definition: Attribution d’une autorité métier sur un contenu de référence et un périmètre donnés, permettant d’expliciter
    à quel titre une information est tenue pour référence.
  context: Autorité sur une information ou un ensemble cohérent de propriétés ; aucune autorité unique sur toute la fiche
    produit supposée.
  essential_elements:
  - Rôle métier faisant autorité, s’il est établi.
  - Contenu et périmètre couverts par cette autorité.
  - Conditions de reconnaissance de l’autorité, lorsqu’elles sont connues.
  granularity_rationale: Un nom d’émetteur seul ne dit ni sur quoi il fait foi ni à quel titre. L’autorité a un sens distinct
    de la réception d’une valeur.
  separate_meanings:
  - L’émetteur peut être un intermédiaire.
  - Pas de PIM, d’équipe, de système maître ou d’arbitre Beaumanoir inventé.
  capability_roles:
  - capability_ref: D08.d
    role: utilise
    meaning: Interprète la projection à la lumière des autorités établies ; ne les attribue pas par simple ingestion.
    qualification: proposed_from_current_responsibility
    source_refs:
    - U460
  document_and_fact_boundary: Aucun fait de gestion nouveau n’est qualifié par cette fiche. Le lien U461 s’applique dès qu’un
    fait de gestion est décrit ; il n’exige pas un document propre à chaque propriété.
  example:
    kind: illustrative_not_observed
    text: Une autorité externe pourrait faire foi sur les dimensions physiques, une autre sur une classification commerciale.
      Cet exemple illustre la portée d’une autorité ; il ne décrit aucune organisation installée.
    source_refs:
    - U460
    - U464
  market_comparison:
    support_ref: FLOW-PROJECTION
    term_choice: Reference Authority est une formulation descriptive proposée de la responsabilité faisant foi. Aucun objet
      éditeur homonyme n’a été établi dans les sources consultées.
    definition_choice: La séparation est motivée par la convention FLOW de projection et par V0-P02. Les références d’architecture
      soutiennent la description métier ; elles ne désignent pas les autorités locales.
    status: proposed_not_validated
  source_refs:
  - U464
  - U465
  - U460
  - CMP184
  open_items:
  - V0-P02
  review:
    definition: proposed
    granularity: proposed
    roles: proposed
    example: editorial_illustration
    limits: Ni identité technique, ni cardinalité, ni autorité installée déduite.
- id: PINFO-010
  pilot_ref: PILOT-PRODUCT
  name: Reference Receipt
  label_fr: Réception d’information de référence
  question: Quel contenu de référence a été reçu, de qui et quand ?
  definition: 'Contexte de réception d’un contenu de référence dans la projection Supply : contenu concerné, émetteur et moment
    de réception, avec l’origine connue utile à son interprétation.'
  context: Une réception métier d’information ; pas un message technique ou un journal d’interface. Deux réceptions du même
    contenu peuvent éclairer sa fraîcheur sans changer sa validité.
  essential_elements:
  - Contenu de référence reçu, identifié sans en recopier tout le dossier.
  - Émetteur et moment de réception.
  - Origine déclarée et contexte de transmission lorsqu’ils sont utiles et connus.
  granularity_rationale: La fraîcheur de réception est relative à un contenu précis. Une date seule ne dit pas ce qui a été
    reçu ; une réception ne suffit pas à établir la vérité du contenu.
  separate_meanings:
  - Validité du contenu et heure de réception sont distinctes.
  - Le seuil de fraîcheur dépend de l’usage ; aucune règle automatique d’acceptation ou de rejet.
  capability_roles:
  - capability_ref: D08.d
    role: connaît
    meaning: Conserve le contexte utile de l’information reçue pour expliquer la projection.
    qualification: proposed_from_current_responsibility
    source_refs:
    - U460
  document_and_fact_boundary: La fiche décrit le contexte de provenance. Si l’arrivée est également modélisée comme fait de
    gestion, U461 exige son document identifié ; ce classement et ce document ne sont pas inventés ici.
  example:
    kind: illustrative_not_observed
    text: Une caractéristique valable au 1er septembre est reçue le 19 septembre par un distributeur. Sa réception est récente
      ; sa validité aujourd’hui et l’autorité de son origine restent à examiner.
    source_refs:
    - U460
    - U464
  market_comparison:
    support_ref: FLOW-PROJECTION
    term_choice: Reference Receipt décrit la provenance de réception pour les lecteurs métier ; aucun terme standard unique
      n’est revendiqué. Ce n’est pas Product Receipt, qui concerne les biens.
    definition_choice: La séparation réception/validité répond aux cas du pilote. Le besoin de provenance ne prescrit pas
      un flux, un mécanisme d’intégration ou un journal applicatif.
    status: proposed_not_validated
  source_refs:
  - U464
  - U465
  - U460
  - CMP184
  open_items:
  - V0-P02
  review:
    definition: proposed
    granularity: proposed
    roles: proposed
    example: editorial_illustration
    limits: Ni identité technique, ni cardinalité, ni autorité installée déduite.
- id: PINFO-011
  pilot_ref: PILOT-COMMITMENT
  name: Fulfillment Proposal
  label_fr: Proposition de satisfaction
  question: Quelles conditions de satisfaction sont proposées pour cette demande ?
  definition: Conditions de satisfaction proposées pour une partie identifiée d’une demande, soumises à confirmation sans
    valoir à elles seules engagement.
  context: Une proposition relative à une demande. Elle peut concerner un engagement initial ou une révision ; un engagement
    actuel peut rester valable pendant son examen.
  essential_elements:
  - Demande et partie concernées ; destinataire de la proposition.
  - Quantité avec unité associée à la date et aux conditions proposées.
  - Contexte de proposition ; engagement concerné en cas de réexamen.
  granularity_rationale: Proposition et engagement ont des sens et effets distincts, adoptés U466. Dans chacun, préserver
    l’association partie–quantité–date ; un échéancier peut réunir plusieurs parties sans devenir un fait élémentaire unique.
  separate_meanings:
  - La proposition n’est pas une réservation ni une affectation.
  - Identités, versions, durée de validité et acceptation partielle restent à préciser.
  capability_roles:
  - capability_ref: D03.n
    role: établit et révise
    meaning: Promise Proposal BHV021 formalise ce qui peut être proposé sans refaire la décision d’échéancier.
    qualification: proposed_from_current_responsibility
    source_refs:
    - U441
    - U443
    - U466
  - capability_ref: D03.l
    role: détermine les conditions utilisées
    meaning: Delivery Schedule Decision choisit la distribution quantité–date qui alimente la proposition ; ne la confirme
      pas pour autant.
    qualification: proposed_from_current_responsibility
    source_refs:
    - U441
    - U460
  document_and_fact_boundary: Aucun fait de gestion nouveau n’est qualifié par cette fiche. Le lien U461 s’applique dès qu’un
    fait de gestion est décrit ; il n’exige pas un document propre à chaque propriété.
  example:
    kind: illustrative_not_observed
    text: L’engagement actuel prévoit 100 pièces vendredi. Une proposition de révision prévoit 60 vendredi et 40 lundi. Tant
      que le changement n’est pas confirmé selon les règles applicables, l’engagement actuel reste distinct et valable.
    source_refs:
    - U441
    - U443
    - U466
  market_comparison:
    support_ref: MARKET-PROMISE
    term_choice: Fulfillment Proposal est proposé en cohérence avec Fulfillment Commitment et Promise Proposal BHV021. Delivery
      Schedule ne distinguerait pas à lui seul proposition et engagement.
    definition_choice: Microsoft et Oracle illustrent les répartitions quantité–date ; U466 fonde la séparation des deux informations.
      Les sources ne prouvent pas une taxonomie commune à tous les éditeurs.
    status: proposed_not_validated
  source_refs:
  - U464
  - U465
  - U441
  - U443
  - U466
  - CMP184
  open_items:
  - V0-P03
  - V0-A02
  review:
    definition: proposed
    granularity: proposed
    roles: proposed
    example: editorial_illustration
    limits: Ni identité technique, ni cardinalité, ni autorité installée déduite.
    adopted_scope:
      source_ref: U466
      meaning: Deux informations métier reliées ; une proposition peut être examinée pendant que l’engagement actuel reste
        valable.
      excluded: Noms anglais, rédaction des définitions, identités, versions, cardinalités et autorisations détaillées.
- id: PINFO-012
  pilot_ref: PILOT-COMMITMENT
  name: Fulfillment Commitment
  label_fr: Engagement de satisfaction
  question: Quelles conditions de satisfaction sont actuellement promises pour cette demande ?
  definition: 'Conditions de satisfaction confirmées pour une partie identifiée d’une demande : ce qui est promis, à qui,
    pour quelle quantité et quelle date, sous les conditions métier applicables.'
  context: Engagement métier distingué de la capacité homonyme qui le maintient. Une proposition peut préparer sa révision
    sans le remplacer automatiquement.
  essential_elements:
  - Demande et partie concernées ; bénéficiaire de l’engagement.
  - Quantité avec unité associée à la date et aux conditions confirmées.
  - Contexte de confirmation permettant de reconnaître l’engagement applicable.
  granularity_rationale: 'Le même couple quantité–date peut être proposé ou engagé : son effet métier diffère. L’engagement
    n’inclut pas toute la ressource choisie pour l’honorer.'
  separate_meanings:
  - N’attribue pas de ressource précise et ne bloque pas les usages concurrents.
  - Les règles de confirmation, correction, remplacement et effets sur d’autres commandes restent ouvertes.
  capability_roles:
  - capability_ref: D03.n
    role: confirme et fait évoluer
    meaning: Promise Confirmation BHV022 et Promise Revision BHV023 maintiennent les conditions engagées.
    qualification: proposed_from_current_responsibility
    source_refs:
    - U441
    - U443
    - U466
  document_and_fact_boundary: Aucun fait de gestion nouveau n’est qualifié par cette fiche. Le lien U461 s’applique dès qu’un
    fait de gestion est décrit ; il n’exige pas un document propre à chaque propriété.
  example:
    kind: illustrative_not_observed
    text: 60 pièces vendredi et 40 lundi sont confirmées. Affecter demain une autre ressource compatible peut conserver exactement
      cet engagement. Une nouvelle proposition de dates reste une information distincte.
    source_refs:
    - U441
    - U443
    - U445
    - U436
    - U466
  market_comparison:
    support_ref: MARKET-PROMISE
    term_choice: Fulfillment Commitment reprend le nom adopté de la capacité U445 pour l’information qu’elle entretient ;
      la nature Information évite de les confondre.
    definition_choice: Le nom et le périmètre restent FLOW. Confirmation de commande chez un éditeur n’est pas une équivalence
      complète ; l’absence de réservation implicite est la convention U436.
    status: proposed_not_validated
  source_refs:
  - U464
  - U465
  - U441
  - U443
  - U445
  - U436
  - U466
  - CMP184
  open_items:
  - V0-P03
  - V0-A02
  review:
    definition: proposed
    granularity: proposed
    roles: proposed
    example: editorial_illustration
    limits: Ni identité technique, ni cardinalité, ni autorité installée déduite.
    adopted_scope:
      source_ref: U466
      meaning: Deux informations métier reliées ; une proposition peut être examinée pendant que l’engagement actuel reste
        valable.
      excluded: Noms anglais, rédaction des définitions, identités, versions, cardinalités et autorisations détaillées.
- id: PINFO-013
  pilot_ref: PILOT-ASSIGNMENT
  name: Supply Assignment
  label_fr: Affectation de ressources
  question: Quelle ressource est affectée à quelle demande, pour quelle part ?
  definition: Lien retenu entre une ressource et une partie de demande à satisfaire, avec la quantité et les conditions d’application
    de cette affectation.
  context: Une affectation identifiée par son sens ressource–demande, distincte du plan qui l’a choisie, de la promesse et
    du droit de réservation.
  essential_elements:
  - Ressource concernée et demande bénéficiaire.
  - Quantité avec unité et contexte d’application.
  - Conditions particulières de maintien, par exemple un gel, seulement lorsqu’elles sont explicites.
  granularity_rationale: Ressource seule ou quantité seule ne dit pas à quelle demande elle est affectée. Plusieurs liens
    peuvent composer un plan sans fusionner leur sens.
  separate_meanings:
  - Un gel limite la modification de l’affectation ; il ne réserve pas automatiquement.
  - L’affectation peut changer sans modifier la promesse si les conditions restent compatibles.
  capability_roles:
  - capability_ref: D02.e
    role: établit et fait évoluer
    meaning: Applique et maintient les liens choisis ; ne décide pas à nouveau le plan.
    qualification: proposed_from_current_responsibility
    source_refs:
    - U345
    - U364
    - U436
  - capability_ref: D03.o
    role: détermine le choix utilisé
    meaning: Fulfillment Plan Decision choisit le scénario dont découlent les affectations à appliquer.
    qualification: proposed_from_current_responsibility
    source_refs:
    - U378
    - U460
  document_and_fact_boundary: Aucun fait de gestion nouveau n’est qualifié par cette fiche. Le lien U461 s’applique dès qu’un
    fait de gestion est décrit ; il n’exige pas un document propre à chaque propriété.
  example:
    kind: illustrative_not_observed
    text: 40 pièces affectées depuis A à la demande L sont réaffectées depuis B. Si la même date et les mêmes conditions sont
      possibles, la promesse reste inchangée. Sans réservation, ce lien ne bloque pas les usages concurrents.
    source_refs:
    - U345
    - U364
    - U436
    - U443
    - U460
    - ELM284
  market_comparison:
    support_ref: MS-ASSIGNMENT
    term_choice: Supply Assignment conserve le vocabulaire FLOW d’affectation. Pegging est un terme produit de rapprochement
      offre–demande ; Allocation peut désigner d’autres droits ou protections.
    definition_choice: La préservation de liens pour une demande confirmée chez Microsoft éclaire le maintien d’une affectation.
      Son paramétrage ne prescrit ni le gel FLOW ni un blocage implicite.
    status: proposed_not_validated
  source_refs:
  - U464
  - U465
  - U345
  - U364
  - U436
  - U443
  - U460
  - ELM284
  - CMP184
  open_items:
  - V0-A02
  review:
    definition: proposed
    granularity: proposed
    roles: proposed
    example: editorial_illustration
    limits: Ni identité technique, ni cardinalité, ni autorité installée déduite.
- id: PINFO-014
  pilot_ref: PILOT-RESERVATION
  name: Reservation
  label_fr: Réservation de ressources
  question: Quelle part de ressource est rendue indisponible aux demandes concurrentes, au bénéfice de qui ?
  definition: Droit établi pour un besoin bénéficiaire sur une quantité de ressources définies par un périmètre, qui bloque
    les usages concurrents selon les conditions de réservation applicables.
  context: Périmètre de ressources suffisamment défini pour comprendre ce qui est réservé ; pas nécessairement un lot ou exemplaire
    déjà affecté.
  essential_elements:
  - Besoin bénéficiaire et périmètre de ressources concerné.
  - Quantité avec unité.
  - Conditions métier de l’opposabilité ; limites de durée seulement lorsqu’elles sont établies.
  granularity_rationale: Quantité, périmètre et bénéficiaire forment le sens du droit. Un lot précis n’est pas indispensable
    à toute réservation ; son attribution répond à une autre question.
  separate_meanings:
  - Réservation n’est ni mouvement physique ni simple affectation.
  - Expiration, libération, consommation et effets d’une annulation ne sont pas automatisés par la définition.
  capability_roles:
  - capability_ref: D02.c
    role: établit et fait évoluer
    meaning: Maintient le droit opposable selon les règles métier de réservation.
    qualification: proposed_from_current_responsibility
    source_refs:
    - U436
    - U460
  - capability_ref: D02.e
    role: utilise
    meaning: Tient compte des droits de réservation lors de l’application d’une affectation.
    qualification: proposed_from_current_responsibility
    source_refs:
    - U436
    - U460
  document_and_fact_boundary: Aucun fait de gestion nouveau n’est qualifié par cette fiche. Le lien U461 s’applique dès qu’un
    fait de gestion est décrit ; il n’exige pas un document propre à chaque propriété.
  example:
    kind: illustrative_not_observed
    text: 40 pièces de V sur le périmètre P sont réservées au besoin L, sans lot choisi. Les demandes concurrentes doivent
      tenir compte de ce droit ; l’annulation de L ne prouve pas à elle seule une règle de libération automatique.
    source_refs:
    - U436
    - U460
    - ELM283
  market_comparison:
    support_ref: MS-RESERVATION
    term_choice: Reservation est un terme établi ; FLOW conserve le nom de la capacité et précise son effet métier. Soft reservation
      est un mécanisme particulier, pas le nom imposé à toute réservation.
    definition_choice: Microsoft illustre la diminution de la quantité disponible à réserver sans mouvement de stock. La portée
      exclusive du blocage dans FLOW vient de U436 ; les options produit d’overselling ou de libération ne sont pas importées.
    status: proposed_not_validated
  source_refs:
  - U464
  - U465
  - U436
  - U460
  - ELM283
  - CMP184
  open_items:
  - V0-A01
  - V0-A02
  - V0-A06
  review:
    definition: proposed
    granularity: proposed
    roles: proposed
    example: editorial_illustration
    limits: Ni identité technique, ni cardinalité, ni autorité installée déduite.
