clarifications_U346_U347:
  status: discussion_no_catalogue_adoption
  source_refs:
  - U346
  - U347
  - ELM216
  - CMP124
  api: Une API expose une opération. Affecter immédiatement ne signifie ni figer la promesse ni éviter tout recalcul global.
  incremental_computation: Réutiliser des résultats et propager les changements est une optimisation technique. Un changement
    global ou des ressources partagées peuvent élargir fortement le périmètre. Détecter les dépendances et mesurer les impacts
    métier sont distincts.
  incremental_assignment: SA-INCREMENTAL décrit une politique de complément préservant les affectations existantes, pas un
    algorithme de calcul incrémental. Nom encore proposé.
  firming: Chez Microsoft, transformer un ordre planifié en commande effective ; ne signifie pas que toute promesse ou tout
    lien ressources-commandes devient immuable.
  business_preservation: Préserver des engagements ou affectations face aux réoptimisations est une contrainte métier durable,
    distincte d’un verrou technique. L’objet protégé et les conditions de révision doivent être explicites.
  proposed_boundaries:
  - 'D04 : changement d’état ou affermissement de l’Order.'
  - 'D03 Promise Management : conditions de révision de l’engagement date/quantité.'
  - 'Supply Assignment : préserver les liens ressources-commandes déclarés non révisables. La ressource précise peut rester
    substituable si seul le résultat de la promesse est protégé.'
  example: Une livraison de 100 pièces vendredi peut être préservée tout en changeant le site fournisseur. Figer le résultat
    promis et figer sa source de satisfaction sont deux contraintes distinctes.
  proposal_status: Principe discuté, pas nouveau comportement créé ni rattachement validé. Aucun nom anglais supplémentaire
    adopté.
