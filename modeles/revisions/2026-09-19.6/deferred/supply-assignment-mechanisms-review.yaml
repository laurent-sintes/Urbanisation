- id: SA-REBALANCE
  name: Assignment Rebalancing
  principle_status: proposed
  wording_status: proposed
  definition: Mettre en œuvre une révision coordonnée des affectations révisables pour refléter les nouveaux arbitrages entre
    demandes, ressources et engagements.
  benefit: Adapter un ensemble d’affectations à un changement de situation sans traiter isolément chaque demande ni perdre
    les effets sur les autres.
  example: Après retard d’un arrivage, appliquer les nouvelles affectations retenues sur plusieurs commandes et conserver
    les affectations protégées par leurs conditions.
  boundary: La capacité ne devient pas un optimiseur concurrent de CTP/PTP/priorités. Les décisions établissent les arbitrages
    et impacts ; Supply Assignment matérialise les liens. Les réservations ou promesses protégées ne sont pas révoquées par
    simple réaffectation.
