mechanisms:
- id: SA-PLAN
  name: Supply Assignment Plan Application
  principle_status: adopted_U345
  wording_status: proposed
  definition: Matérialiser les liens ressources-commandes définis par un plan d’affectation retenu, en vérifiant les conditions
    encore applicables et en explicitant les écarts d’application.
  benefit: Passer d’un ensemble de décisions cohérent à des affectations opérationnelles traçables sans recalculer silencieusement
    un autre plan.
  example: 'Plan retenu : 60 pièces sur le stock présent et 40 sur un arrivage futur pour une commande. Appliquer ces liens
    ; si seules 55 pièces restent admissibles, restituer l’écart et solliciter un arbitrage selon les règles.'
  boundary: Ne confirme pas seul la promesse, ne réserve pas implicitement et ne change pas seul la structure ou l’état des
    Orders. Les capacités responsables restent mobilisées.
  market_comparisons:
  - vendor: SAP
    product: S/4HANA aATP
    element_name: Supply Assignment (ARun)
    element_type: Mécanisme métier réalisé par un produit
    relationship: Recouvrement partiel
    similarities: Affectation des ressources aux besoins ; accès par BOP, ITA, affectation immédiate et API.
    differences: Fonctionnalité intégrée ; ni couverture de toutes les capacités FLOW ni réalisation exclusivement batch démontrées.
    source_title: Supply Assignment (ARun)
    source_url: https://help.sap.com/docs/SAP_S4HANA_ON-PREMISE/f132c385e0234fe68ae9ff35b2da178c/d335e3418f4348ffbae9f11888a62cc7.html
