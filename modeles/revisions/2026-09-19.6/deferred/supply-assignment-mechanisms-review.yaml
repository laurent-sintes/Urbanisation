- id: SA-INCREMENTAL
  name: Incremental Supply Assignment
  principle_status: proposed
  wording_status: proposed
  definition: Compléter les besoins encore non affectés en préservant les affectations existantes, selon les disponibilités
    et décisions applicables.
  benefit: Servir les nouveaux besoins et reliquats tout en limitant l’instabilité des engagements déjà organisés.
  example: Sur une commande de 100 pièces, conserver les 70 affectées et compléter les 30 restantes avec les ressources admissibles.
  boundary: Ne constitue pas simplement le bouton affecter ; la préservation de l’existant est la politique différenciante.
    Le choix des priorités et de la faisabilité reste aux décisions responsables.
