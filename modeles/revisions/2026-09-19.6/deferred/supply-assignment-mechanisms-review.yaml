decomposition_rationale: Application fidèle d’un plan, complément avec stabilité et remise en jeu coordonnée de l’existant
  répondent à des pratiques et bénéfices distincts. Ils peuvent se combiner ; aucune séquence ni exclusivité imposée.
combination: 'Un plan peut prescrire une application incrémentale ou un rééquilibrage : application de plan et politique de
  préservation de l’existant sont des axes combinables, pas des étapes.'
not_separate_behaviors:
- 'Batch, API, écran et temps réel : modalités de réalisation.'
- 'Affecter, désaffecter, modifier : opérations au service des mécanismes.'
- 'FIFO/FEFO, priorité, équité : règles et décisions à rattacher selon leur objet, pas nouveaux comportements automatiquement.'
- 'Stock présent ou futur, site ou réseau : périmètres de ressources ; bénéfice supplémentaire requis avant décomposition.'
