naming_review_U327:
  state: proposed
  user_position: Coverage rejeté pour le nom de D05.a ; Threshold soumis comme piste, pas adopté.
  finding: Threshold nomme une limite ou un déclencheur ; une cible de stock à atteindre est un résultat distinct. Min/Max
    peut combiner un seuil déclencheur et une cible de reconstitution, révisables selon la période.
  recommendation: Inventory Target Decision, avec objectifs de stock et seuils explicites dans la définition. Formulation
    FLOW appuyée sur les notions marché de niveau/cible de stock, pas intitulé universel de capacité éditeur.
  alternative: Inventory Threshold Decision si le périmètre est volontairement limité aux seuils ; cela exclurait les cibles
    actuelles et demanderait un arbitrage explicite.
  catalogue_changed: false
