catalogue_changed: true
interpretation:
  need: Distinguer demande de référence, objectif de stock et besoin net. Coverage Target Decision détermine actuellement
    objectifs et seuils ; Replenishment Decision inclut les besoins nets et les apports recommandés.
  response: La réponse possible peut affecter des ressources présentes ou futures, mais aussi recommander de nouveaux apports
    ou leur adaptation. Supply Assignment conserve son périmètre ressources-commandes ; aucune fusion de capacités proposée
    implicitement.
  coverage: Couverture de stock en durée et couverture de demande par des ressources sont deux sens distincts ; TER022 et
    TER077 les séparent déjà. Uncovered dans la source SAP MRP consultée qualifie des besoins selon des règles, pas un statut
    universel de tout Order.
  example: 'Illustration fictive : cible de stock 100, position projetée admissible 40, besoin net 60 ; si seules 35 unités
    sont mobilisables dans le délai, arbitrer leur destination et examiner une réponse pour les 25 restantes. Ne pas déduire
    à nouveau les demandes déjà intégrées dans la position projetée.'
