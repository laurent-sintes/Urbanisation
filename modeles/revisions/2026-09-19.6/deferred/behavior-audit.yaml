refactoring_U285:
  state: proposed
  source_refs:
  - U285
  - U282
  - U283
  - U284
  - CMP094
  - CMP093
  diagnosis: Une refonte de la granularité et des descriptions est nécessaire ; les règles ont évolué plus vite que le catalogue.
    La méthode Capacité → Comportement reste suffisante dans les cas examinés.
  verified_scope:
    capabilities: 41
    behaviors: 15
    planning_behaviors_to_reconcile: 6
    protection_behaviors_to_requalify: 5
    atp_behaviors_to_check: 4
  preserve:
  - Domaines et frontières adoptés sauf défaut démontré
  - Décisions spécialisées distinctes des capacités d’action
  - Un seul niveau terminal Comportement
  - Identifiants, provenance et accords historiques
  review_scope:
  - Examiner les 41 capacités sans imposer leur modification ni une décomposition systématique
  - Migrer Planning vers les trois directions retenues U283/U284
  - Reconstruire Protection par mécanismes et couvrir pénurie et surstock
  - Réexaminer ATP et les anciennes propositions Promise Management, Reservation/Assignment, Lifecycle et Structuring avec
    les nouveaux critères
  - Revoir les dépendances après stabilisation des responsabilités
  - Aligner définitions, justifications, exemples, correspondances marché et restitution Atlas
  autonomous_work:
  - Établir une table avant/après exhaustive et des fiches cibles proposées
  - Distinguer les accords applicables des compléments nouveaux
  - Retirer les recommandations obsolètes du texte prescriptif tout en conservant leur historique
  - Vérifier les liens, empreintes et cohérence des données
  joint_arbitrations:
  - Fusions ou requalification de capacités en comportements
  - Liste et périmètre des mécanismes de Protection
  - Définitions nouvelles et limites des comportements
  - Frontière Reservation/Assignment et propriétés des engagements
  - Dépendances impliquant une responsabilité métier nouvelle
  proposed_deliverable: 'Une matrice par capacité : responsabilité, maintien/regroupement/requalification, comportements justifiés,
    fonctions conservées en description, dépendances, preuve marché et portée d’adoption.'
  recommended_order:
  - Cible complète proposée sur les 41 capacités, étalonnée sur Planning et Protection
  - Arbitrages regroupés par frontière métier
  - Migration traçable des éléments retenus, validation et restitution
  - Release Atlas sur demande distincte
  acceptance_criteria:
  - Aucun comportement justifié par la seule existence d’une opération produit
  - Chaque décomposition porte mécanisme, politique, variante ou bénéfice concret et respecte U265
  - Besoins fonctionnels utiles préservés sans niveau supplémentaire
  - Relations et exemples cohérents avec les responsabilités
  - Aucune portée de validation étendue implicitement
  technical_scope: Le besoin établi porte sur le contenu et sa cohérence. Aucune réécriture du moteur Atlas ni nouveau niveau
    de schéma justifié à ce stade ; vérifier la restitution après migration.
