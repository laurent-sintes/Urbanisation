schema_version: 1.0.0
version: 2026-09-19.8
review_sha256: 241320ede10eac4722a67efa979b2ef9baceecd76d384191135f5dda911f556d
reviewer: Codex — réexamen explicite U483 des 122 accords suspendus, avec contrôle des champs, frontières, relations et termes
  liés ; aucune validation métier nouvelle
items:
- decision_id: ADOPT-U467-UNCHANGED-001
  action: retain
  rationale: Party / Role et mastership external sont inchangés. Le référentiel expose les partenaires et rôles utiles à la
    Supply ; U479 confirme les maîtres externes et une autorité locale de projection, sans administration des maîtres. TER046
    conserve sa définition. Les nouvelles inspirations restent proposées ; aucun lien ni périmètre approuvé ne change.
- decision_id: ADOPT-U467-UNCHANGED-002
  action: retain
  rationale: Fulfillment Network et la distinction Party / lieu sont inchangés. La définition remplace uniquement domaines
    consommateurs par areas consommatrices ; TER053 conserve son sens. Les inspirations éclairent lieux, réseau et responsabilités
    sans fusionner lieu et partenaire. Aucun changement de relation ; seul le nom et l’indépendance historiquement approuvés
    sont repris.
- decision_id: ADOPT-U467-UNCHANGED-003
  action: defer
  rationale: Le nom Business References a changé. Son ancien accord est conservé historiquement et ne peut être transcrit
    sur une autre valeur. U482 donne un nouvel accord explicite sur Authoritative Data, porté par ADOPT-U482-AUTHORITATIVE-DATA-NAME.
    Le regroupement de présentation et les six référentiels restent distincts.
- decision_id: ADOPT-U467-UNCHANGED-004
  action: retain
  rationale: Agreement et mastership external sont inchangés. TER048 conserve sa définition ; les inspirations ne font pas
    de la projection locale une administration des contrats maîtres. L’autorité locale U479 est compatible avec la maîtrise
    externe. Aucun changement de relation ; reprise limitée au nom et à la maîtrise approuvés.
- decision_id: ADOPT-U467-UNCHANGED-005
  action: retain
  rationale: Catalog et mastership external sont inchangés. Les nouvelles inspirations distinguent sélection métier de produits,
    présentation et données maîtresses ; elles ne transfèrent pas la maîtrise produit au référentiel Supply. Aucun lien ou
    champ approuvé ne change. Reprise du nom et de la maîtrise historiques uniquement.
- decision_id: ADOPT-U467-UNCHANGED-008
  action: retain
  rationale: Customer Return conserve son nom et sa définition de prise en charge du retour et de ses suites logistiques.
    Les nouvelles inspirations maintiennent la distinction avec remboursement et décision de disposition. TER072 conserve
    sa définition de commande distincte de la vente ; son ajout comparatif ne transforme pas le retour en annulation de cette
    vente. La note de relation revient à sa formulation source sans changer le rattachement. Valeurs et empreintes contrôlées
    identiques pour definition, name. Reprise de ces seuls champs de l’accord historique ; les inspirations U477 restent proposées.
    U482 renomme les niveaux sans déplacer les responsabilités.
- decision_id: ADOPT-U467-UNCHANGED-009
  action: retain
  rationale: L’accord porte uniquement sur le nom Supplier Return, conservé pour la même responsabilité de renvoi fournisseur.
    Les comparaisons distinguent crédit, remplacement et réparation sans adopter leurs formulations détaillées. TER073 garde
    sa définition de commande distincte de l’achat ; les exemples ne réouvrent pas implicitement un achat. Le rattachement
    est identique malgré la réécriture de sa note. Valeurs et empreintes contrôlées identiques pour name. Reprise de ces seuls
    champs de l’accord historique ; les inspirations U477 restent proposées. U482 renomme les niveaux sans déplacer les responsabilités.
- decision_id: ADOPT-U467-UNCHANGED-010
  action: retain
  rationale: 'Le nom et la définition de détermination des objectifs et seuils de stock restent identiques. Les inspirations
    séparent explicitement la décision de cible, son maintien par Supply Protection et les apports décidés ailleurs. U479
    ne transfère pas cette décision aux référentiels : leur autorité locale ne vaut pas définition des seuils. La relation
    de mobilisation par Inventory Planning conserve son sens et ses extrémités. Valeurs et empreintes contrôlées identiques
    pour definition, name. Reprise de ces seuls champs de l’accord historique ; les inspirations U477 restent proposées. U482
    renomme les niveaux sans déplacer les responsabilités.'
- decision_id: ADOPT-U467-UNCHANGED-011
  action: retain
  rationale: Le nom Initial Stocking Decision et la définition de calcul des premiers apports et dates depuis l’assortiment
    retenu restent inchangés. Les comparaisons distinguent lancement et réassort sans absorber la production de l’assortiment
    ou des prévisions. TER079 conserve le sens de livraison initiale ; son inspiration distingue bien la décision de l’apport
    et sa réalisation. Aucune relation métier ne change. Valeurs et empreintes contrôlées identiques pour definition, name.
    Reprise de ces seuls champs de l’accord historique ; les inspirations U477 restent proposées. U482 renomme les niveaux
    sans déplacer les responsabilités.
- decision_id: ADOPT-U467-UNCHANGED-012
  action: retain
  rationale: Process Orchestration conserve son nom et sa définition de coordination des prestations et dépendances. Le scope
    remplace seulement « domaines » par « areas » selon U482. Les inspirations préservent la décision séparée d’adaptation
    et la réalisation par les exécutants. Les définitions inchangées de TER066 et TER075 maintiennent la distinction demande
    de service, résultat métier et appel informatique. Aucune relation métier ne change. Valeurs et empreintes contrôlées
    identiques pour definition, name. Reprise de ces seuls champs de l’accord historique ; les inspirations U477 restent proposées.
    U482 renomme les niveaux sans déplacer les responsabilités.
- decision_id: ADOPT-U467-UNCHANGED-013
  action: retain
  rationale: Service Catalog et sa définition approuvée (liste des services et SLA globaux en configuration) sont inchangés.
    Le scope remplace domaines par areas. REL-SERVICE-CATALOG-EXECUTION désigne désormais explicitement Process Management,
    sans changement d’extrémité, de type ou de responsabilité. Le catalogue reste distinct des prestations exécutées. Les
    nouvelles inspirations ne sont pas approuvées par cette reprise.
- decision_id: ADOPT-U467-UNCHANGED-014
  action: retain
  rationale: Le nom et la définition de choix des situations, moments et durées de réservation restent inchangés. Les inspirations
    distinguent horizon avant besoin et durée d’une réservation prise ; elles ne donnent pas à la décision le rôle de créer
    l’engagement ni de classer elle-même toutes les commandes. Le sens de l’accord historique est conservé et aucune relation
    ne change. Valeurs et empreintes contrôlées identiques pour definition, name. Reprise de ces seuls champs de l’accord
    historique ; les inspirations U477 restent proposées. U482 renomme les niveaux sans déplacer les responsabilités.
- decision_id: ADOPT-U467-UNCHANGED-015
  action: retain
  rationale: Le nom, la définition et la nature decision de Return Disposition Decision restent identiques. Les comparaisons
    conservent l’orientation logistique selon l’état, les règles et la valeur récupérable, en séparant inspection, autorisation
    commerciale, remboursement et traitement physique. Aucune relation métier ne change ; les extensions produit citées ne
    deviennent pas des responsabilités adoptées. Valeurs et empreintes contrôlées identiques pour definition, name, nature.
    Reprise de ces seuls champs de l’accord historique ; les inspirations U477 restent proposées. U482 renomme les niveaux
    sans déplacer les responsabilités.
- decision_id: ADOPT-U467-UNCHANGED-017
  action: retain
  rationale: L’accord sur le nom Supply Assignment et sa nature action demeure applicable à la tenue des liens entre ressources
    et commandes. Les nouvelles comparaisons SAP/pegging expliquent leurs effets sans reprendre les protections produit ;
    TER017 garde sa définition et la frontière U436 selon laquelle seule la réservation bloque les usages concurrents. La
    relation reste identique, sa note seule est reformulée. Valeurs et empreintes contrôlées identiques pour name, nature.
    Reprise de ces seuls champs de l’accord historique ; les inspirations U477 restent proposées. U482 renomme les niveaux
    sans déplacer les responsabilités.
- decision_id: ADOPT-U467-UNCHANGED-019
  action: retain
  rationale: Nom, définition, finalité et nature decision de CTP restent inchangés. Les nouvelles inspirations conservent
    la faisabilité après adaptation, plus large que le CTP industriel de certains éditeurs, en mobilisant les décisions spécialisées
    sans appliquer l’adaptation ni confirmer la promesse. Le rattachement ne change pas ; sa note n’ajoute aucune portée d’accord.
    Valeurs et empreintes contrôlées identiques pour definition, finality, name, nature. Reprise de ces seuls champs de l’accord
    historique ; les inspirations U477 restent proposées. U482 renomme les niveaux sans déplacer les responsabilités.
- decision_id: ADOPT-U467-UNCHANGED-023
  action: retain
  rationale: L’accord limité au nom Sales Order est conservé pour la même gestion de commande client. Les variantes de remise,
    de livraison directe et de parties décrites restent des comparaisons proposées, distinctes des décisions de solution,
    de promesse et de réalisation. TER069 conserve sa définition et explicite objet versus capacité homonyme. La relation
    de rattachement reste identique. Valeurs et empreintes contrôlées identiques pour name. Reprise de ces seuls champs de
    l’accord historique ; les inspirations U477 restent proposées. U482 renomme les niveaux sans déplacer les responsabilités.
- decision_id: ADOPT-U467-UNCHANGED-024
  action: retain
  rationale: L’accord limité au nom Purchase Order demeure applicable à la gestion de l’attendu acheté au fournisseur. Les
    inspirations distinguent commande, accord de référence et réponse encore à accepter. TER070 conserve sa définition incluant
    biens ou prestations et ne transforme pas l’apport consigné sans achat en achat ferme. Aucune extrémité ou qualification
    métier de relation ne change. Valeurs et empreintes contrôlées identiques pour name. Reprise de ces seuls champs de l’accord
    historique ; les inspirations U477 restent proposées. U482 renomme les niveaux sans déplacer les responsabilités.
- decision_id: ADOPT-U467-UNCHANGED-025
  action: retain
  rationale: L’accord porte uniquement sur le nom Transfer Order, inchangé pour la gestion du déplacement demandé. Les inspirations
    gardent la séparation origine/destination, ordre/départ/arrivée et ne restreignent pas le transfert au seul réassort.
    TER071 garde sa définition d’ordre, distincte des faits de réalisation. La relation reste identique, seule sa note est
    reformulée. Valeurs et empreintes contrôlées identiques pour name. Reprise de ces seuls champs de l’accord historique
    ; les inspirations U477 restent proposées. U482 renomme les niveaux sans déplacer les responsabilités.
- decision_id: ADOPT-U467-UNCHANGED-026
  action: retain
  rationale: Order Structuring conserve le nom approuvé pour la même responsabilité de structure des commandes. Les nouveaux
    exemples distinguent fractionnement, traitement groupé et fusion, en préservant quantités, filiation et engagements ;
    ils n’adoptent pas automatiquement les conditions des éditeurs. Le rattachement ne change pas. Les autres champs demeurent
    hors de cet accord de nom. Valeurs et empreintes contrôlées identiques pour name. Reprise de ces seuls champs de l’accord
    historique ; les inspirations U477 restent proposées. U482 renomme les niveaux sans déplacer les responsabilités.
- decision_id: ADOPT-U467-UNCHANGED-027
  action: retain
  rationale: Nom, définition et nature management d’Order Lifecycle Management restent inchangés. Les inspirations conservent
    plusieurs dimensions de cycle et les droits de transition, engagements et réalisations acquis ; elles ne transposent pas
    un cycle éditeur universel. La note de rattachement est reformulée sans changement de relation. L’accord ne s’étend pas
    aux nouvelles comparaisons ni aux exemples. Valeurs et empreintes contrôlées identiques pour definition, name, nature.
    Reprise de ces seuls champs de l’accord historique ; les inspirations U477 restent proposées. U482 renomme les niveaux
    sans déplacer les responsabilités.
- decision_id: ADOPT-U467-UNCHANGED-029
  action: retain
  rationale: Le nom Replenishment Decision reste appliqué à la décision des apports successifs, distincte de leur mise en
    commande et déplacement. TER080 conserve sa définition locale de réassort guidé par des seuils ; sa nouvelle inspiration
    n’importe aucune formule min/max universelle. La relation de mobilisation par Planning ne change pas. Aucun autre champ
    de la capacité n’est adopté par cet accord de nom. Valeurs et empreintes contrôlées identiques pour name. Reprise de ces
    seuls champs de l’accord historique ; les inspirations U477 restent proposées. U482 renomme les niveaux sans déplacer
    les responsabilités.
- decision_id: ADOPT-U467-UNCHANGED-030
  action: retain
  rationale: Le nom Stock Redistribution Decision demeure identique pour le choix des transferts de stock déjà présent dans
    le réseau. Les inspirations ajoutent les perspectives de rééquilibrage et de réunion des tailles, sans assimiler achats
    nouveaux, Orders et réalisation à la décision. La relation de mobilisation par Planning reste identique. La reprise reste
    limitée au nom, sans adoption des nouveaux bénéfices illustrés. Valeurs et empreintes contrôlées identiques pour name.
    Reprise de ces seuls champs de l’accord historique ; les inspirations U477 restent proposées. U482 renomme les niveaux
    sans déplacer les responsabilités.
- decision_id: ADOPT-U467-UNCHANGED-033
  action: retain
  rationale: Service Requirements Decision conserve nom et définition de détermination des prestations nécessaires. Les inspirations
    explicitent les résultats attendus avant le choix des exécutants et distinguent besoin, demande de service et réalisation.
    Aucun lien ni définition liée ne change ; les structures Field Service/TM Forum restent des rapprochements proposés, sans
    cycle universel adopté. Valeurs et empreintes contrôlées identiques pour definition, name. Reprise de ces seuls champs
    de l’accord historique ; les inspirations U477 restent proposées. U482 renomme les niveaux sans déplacer les responsabilités.
- decision_id: ADOPT-U467-UNCHANGED-035
  action: retain
  rationale: L’accord de nom Operations Tracking reste applicable à la visibilité des opérations et contributions au processus.
    Le scope remplace uniquement « domaines » par « areas » selon U482. Les inspirations distinguent faits, estimations et
    engagements et laissent adaptation, orchestration et tenue du stock à leurs responsables. Aucune relation ne change ;
    les réalisations GS1/Azure ne deviennent pas une architecture approuvée. Valeurs et empreintes contrôlées identiques pour
    name. Reprise de ces seuls champs de l’accord historique ; les inspirations U477 restent proposées. U482 renomme les niveaux
    sans déplacer les responsabilités.
- decision_id: ADOPT-U467-UNCHANGED-036
  action: retain
  rationale: Order Management conserve exactement son nom et sa responsabilité de tenue et de cycle de vie des Orders. Le
    kind devient area par U482, sans changement de descendants ni des extrémités et types des relations ; leurs notes de revue
    ne constituent pas une extension métier. Les comparaisons proposées distinguent cette responsabilité des suites OMS plus
    larges. Seul le nom est repris.
- decision_id: ADOPT-U467-UNCHANGED-037
  action: retain
  rationale: La finalité approuvée de connaissance, fiabilisation, mouvements, protection et réservation du stock est strictement
    inchangée. Le niveau devient area par U482, sans changer les liens ni confondre tenue de stock, optimisation et réalisation
    physique. Les inspirations restent proposées ; aucune autre description n’est approuvée par cette reprise.
- decision_id: ADOPT-U467-UNCHANGED-038
  action: retain
  rationale: 'Process Management et sa définition approuvée sont inchangés : coordination de l’exécution, suivi et adaptation
    en articulation avec la promesse. Le niveau devient area et le scope remplace domaines par areas. La relation au Service
    Catalog nomme explicitement Process Management au lieu du domaine, avec mêmes extrémités et même effet. Les inspirations
    ne déplacent ni la réalisation physique ni les décisions de promesse ; reprise du nom et de la définition uniquement.'
- decision_id: ADOPT-U467-UNCHANGED-039
  action: retain
  rationale: Order Promising conserve son nom et sa frontière de promesse distincte de l’exécution. Le kind devient area par
    U482 ; les relations ne changent que leurs notes de revue. TER014 garde sa définition. Les nouvelles inspirations comparent
    les approches de disponibilité et engagement sans élargir l’accord historique, limité au nom.
- decision_id: ADOPT-U467-UNCHANGED-040
  action: retain
  rationale: Fulfillment Optimization et sa finalité approuvée (décider comment satisfaire les Orders avec des ressources
    disponibles ou adaptables) sont inchangés. Le kind et le scope passent lexicalement à area ; les extrémités et types des
    relations sont préservés. Les inspirations restent des rapprochements proposés et ne confondent pas optimisation, promesse
    et exécution. Reprise limitée au nom et à la finalité.
- decision_id: ADOPT-U467-UNCHANGED-041
  action: retain
  rationale: Inventory Optimization conserve son nom, sa définition de compromis entre disponibilité, immobilisation et risque,
    et sa finalité de décision du stock souhaitable et des ajustements. Le kind et le scope deviennent area sans changer la
    responsabilité ni les liens. Les inspirations proposées éclairent les arbitrages sans imposer une politique ou un algorithme
    ; reprise limitée aux trois champs approuvés.
- decision_id: ADOPT-U467-UNCHANGED-043
  action: retain
  rationale: Le nom Process Adaptation Decision et la définition de détermination des variations du plan sont inchangés. Le
    seul changement de scope est lexical « domaines » vers « areas » selon U482. Les inspirations gardent coordination et
    choix séparés, avec réexamen de la promesse par son responsable lorsque nécessaire. Aucune relation ne change et aucune
    latitude supplémentaire d’engagement n’est adoptée. Valeurs et empreintes contrôlées identiques pour definition, name.
    Reprise de ces seuls champs de l’accord historique ; les inspirations U477 restent proposées. U482 renomme les niveaux
    sans déplacer les responsabilités.
- decision_id: ADOPT-U467-UNCHANGED-044
  action: retain
  rationale: Fulfillment Commitment conserve le nom adopté pour la même tenue des propositions, confirmations et révisions
    autorisées. Les inspirations distinguent exploration et engagement, sans absorber décisions de faisabilité ou d’échéancier
    ni créer de réservation implicite. La relation de rattachement reste identique malgré le retour de sa note source. La
    reprise de l’accord de nom ne valide pas le nouveau texte détaillé. Valeurs et empreintes contrôlées identiques pour name.
    Reprise de ces seuls champs de l’accord historique ; les inspirations U477 restent proposées. U482 renomme les niveaux
    sans déplacer les responsabilités.
- decision_id: ADOPT-U467-UNCHANGED-045
  action: retain
  rationale: Order Archiving garde le nom approuvé et sa responsabilité de conservation historique. Les inspirations maintiennent
    la distinction archivage, clôture, purge et restauration conditionnelle. Elles n’imposent pas les critères produit Microsoft.
    Le rattachement ne change pas ; l’accord reste limité au nom, sans adoption de règles nouvelles de conservation. Valeurs
    et empreintes contrôlées identiques pour name. Reprise de ces seuls champs de l’accord historique ; les inspirations U477
    restent proposées. U482 renomme les niveaux sans déplacer les responsabilités.
- decision_id: ADOPT-U467-UNCHANGED-046
  action: retain
  rationale: Nom, définition et nature decision de Fulfillment Plan Decision sont inchangés. Les inspirations conservent le
    scénario cohérent et la valeur multidimensionnelle sans optimum ni pondération universelle, en séparant application, promesse
    et réservation. TER078 garde sa définition de plan d’affectations proposées ou retenues ; son ajout comparatif précise
    le statut sans effet automatique. Aucune relation ne change. Valeurs et empreintes contrôlées identiques pour definition,
    name, nature. Reprise de ces seuls champs de l’accord historique ; les inspirations U477 restent proposées. U482 renomme
    les niveaux sans déplacer les responsabilités.
- decision_id: ADOPT-U467-UNCHANGED-047
  action: retain
  rationale: Le nom Consignment Replenishment Order et la définition de demande d’apport sans engagement d’achat sont identiques.
    Les inspirations maintiennent la distinction entre réception, détention et transfert ultérieur de propriété ; le montage
    d’achat Microsoft n’est pas universalisé. Aucune relation ni définition liée ne change. Les exemples nouveaux restent
    hors de la portée de l’accord historique. Valeurs et empreintes contrôlées identiques pour definition, name. Reprise de
    ces seuls champs de l’accord historique ; les inspirations U477 restent proposées. U482 renomme les niveaux sans déplacer
    les responsabilités.
- decision_id: ADOPT-U467-UNCHANGED-048
  action: retain
  rationale: 'Nom et définition de Consigned Inventory Management restent inchangés : appliquer les conditions de l’accord
    et mobiliser les responsables des issues. Les comparaisons distinguent propriété, utilisation et échéance, sans achat
    automatique de tous les invendus. Aucune relation ne change et l’autorité locale U479 ne transfère pas la négociation
    des accords ou la maîtrise d’entreprise à cette capacité. Valeurs et empreintes contrôlées identiques pour definition,
    name. Reprise de ces seuls champs de l’accord historique ; les inspirations U477 restent proposées. U482 renomme les niveaux
    sans déplacer les responsabilités.'
- decision_id: ADOPT-U467-UNCHANGED-049
  action: retain
  rationale: Le nom Order Backlog Planning et sa nature planning restent identiques. Les inspirations préservent la préparation
    et la comparaison de scénarios en mobilisant les décisions, puis la prise en charge par les responsables de libération,
    affectation et promesse. La relation reste inchangée, seule sa note est rétablie. Les actions de release propres aux produits
    cités ne sont pas adoptées. Valeurs et empreintes contrôlées identiques pour name, nature. Reprise de ces seuls champs
    de l’accord historique ; les inspirations U477 restent proposées. U482 renomme les niveaux sans déplacer les responsabilités.
- decision_id: ADOPT-U467-UNCHANGED-050
  action: retain
  rationale: Le nom Record Inventory Movements demeure identique pour l’enregistrement et l’explication des mouvements reconnus.
    Les inspirations distinguent fait/document, correction/histoire et enregistrement/calcul des positions, sans imposer un
    stockage technique. Aucune relation ne change. La reprise porte sur le seul nom et n’adopte pas les exemples de correction
    ou de changement de propriété. Valeurs et empreintes contrôlées identiques pour name. Reprise de ces seuls champs de l’accord
    historique ; les inspirations U477 restent proposées. U482 renomme les niveaux sans déplacer les responsabilités.
- decision_id: ADOPT-U467-UNCHANGED-051
  action: retain
  rationale: Nom, définition et finalité de Stocktaking conservent le rapprochement des comptages avec les quantités enregistrées,
    la qualification des écarts et les corrections justifiées. Les inspirations maintiennent la réalisation des constats par
    les exécutants et n’imposent ni arrêt systématique ni correction automatique. Aucune relation ne change ; seuils et procédures
    éditeurs restent illustratifs. Valeurs et empreintes contrôlées identiques pour definition, finality, name. Reprise de
    ces seuls champs de l’accord historique ; les inspirations U477 restent proposées. U482 renomme les niveaux sans déplacer
    les responsabilités.
- decision_id: ADOPT-U467-UNCHANGED-053
  action: retain
  rationale: 'BHV001 : reprise limitée à definition. Valeurs exactes avant/après inchangées et empreintes identiques à celles
    approuvées : definition = « Établir les quantités admissibles pour la demande en tenant compte des allocations, protections
    et réservations, sans double décompte. ». Le décompte des quantités admissibles conserve la distinction allocation, protection
    et réservation. Les exemples SAP/Oracle explicitent le risque de double compte sans changer les droits ni leur responsable.
    Aucun changement de relation. Aucun impact de glossaire lié à la fiche n’est signalé ; les définitions du glossaire sont
    préservées, et les actualisations générales de Domain/Area ne changent pas son sens. Les principes U479/U482 maintiennent
    les responsables et le niveau terminal Capability → Behavior ; les sources de vérité locales n’absorbent pas les décisions
    ni les transactions. Les comparaisons, synthèses, exemples et autres champs éditoriaux U477 restent proposés ; la note
    historique ne vaut pas accord élargi.'
- decision_id: ADOPT-U467-UNCHANGED-054
  action: retain
  rationale: 'BHV002 : reprise limitée à definition. Valeurs exactes avant/après inchangées et empreintes identiques à celles
    approuvées : definition = « Établir les possibilités de satisfaction à partir des lieux admissibles, entrepôts, magasins,
    darkstores ou autres espaces de stockage. ». La recherche reste limitée aux lieux admissibles ; les nouveaux exemples
    distinguent cette possibilité ATP du choix de source et de son éventuelle adaptation CTP. Aucun changement de relation.
    Aucun impact de glossaire lié à la fiche n’est signalé ; les définitions du glossaire sont préservées, et les actualisations
    générales de Domain/Area ne changent pas son sens. Les principes U479/U482 maintiennent les responsables et le niveau
    terminal Capability → Behavior ; les sources de vérité locales n’absorbent pas les décisions ni les transactions. Les
    comparaisons, synthèses, exemples et autres champs éditoriaux U477 restent proposés ; la note historique ne vaut pas accord
    élargi.'
- decision_id: ADOPT-U467-UNCHANGED-055
  action: retain
  rationale: 'BHV003 : reprise limitée à definition. Valeurs exactes avant/après inchangées et empreintes identiques à celles
