decision_scope: U290 autorise la refonte présentée et adopte la valeur multidimensionnelle. Les nouveaux détails éditoriaux
  et contrats gardent leurs statuts proposés ; les accords antérieurs ne sont conservés que pour leurs valeurs inchangées.
open_questions:
- 'A3 : articulation réservation/affectation et décompte sans doublon.'
- 'A6 : quatre comportements optionnels Stocktaking/Orchestration non créés.'
- 'A7 : contrats détaillés intégrés sous instruction, données/conditions à éprouver.'
- 'A8 : application de plan explicitée dans D04 ; parent transverse du comportement encore ouvert.'
migration_choices:
- D03.n est une nouvelle capacité ; D03.a/b/c redirigent vers leurs comportements respectifs pour conserver la précision des
  liens métier.
- D05.d renommé Group Protection Decision à périmètre conservé.
- D04.o nature management ; D05.e ajustements des apports futurs explicités sous contraintes.
- Les 133 propositions de contrats sont tracées, coalescées après fusion seulement si résultat/condition/effet identiques
  ; les liens métier de sens différent sont conservés.
next_step_U291: Après clôture de la refonte, examiner les capacités manquant de comportements, avec comparaison marché et
  justification par complexité ou bénéfice ; ne pas lancer dans cette passe.
