conclusion: Correspondances de problèmes et de couverture possibles ; aucune équivalence hiérarchique gamme/produit/module
  avec univers/domaine/capacité.
current_universes:
- id: universe-case
  name: Business Services
  note: Domaines détaillés différés.
- id: universe-supply
  name: Supply
candidates:
- microsoft_scope: Dynamics 365
  scope_type: portfolio
  local_targets: []
  assessment: Pas d’équivalent de niveau sémantique local.
  basis:
  - MFIT01
- microsoft_scope: Business Central
  scope_type: product
  local_targets:
  - D01
  - D04
  assessment: Produit couvrant plusieurs problèmes, dont finance et opérations ; D01/D04 sont des exemples de rapprochement
    à instruire, sans couverture exhaustive démontrée.
  basis:
  - MFIT02
- microsoft_scope: Supply Chain Management
  scope_type: product
  local_targets:
  - universe-supply
  - universe-case
  assessment: Le produit réunit transactionnel, workflows organisationnels et exécution ; ces cibles indiquent des recouvrements
    partiels, pas un rattachement d’urbanisation adopté.
  basis:
  - MFIT03
  - MFIT06
  - MFIT07
- microsoft_scope: Inventory management
  scope_type: functional_module
  local_targets:
  - D01
  assessment: Proximité de problème et de nom ; réception, sortie et qualité imposent un examen des frontières. Ne prouve
    pas la couverture de toutes les capacités D01.
  basis:
  - MFIT04
- microsoft_scope: Product information management
  scope_type: functional_module
  local_targets:
  - D08
  assessment: Identité produit et ingestion pertinentes ; administration du maître Microsoft au-delà de la responsabilité
    de projection FLOW. Microsoft permet aussi une origine PLM/PDM/PIM.
  basis:
  - MFIT05
- microsoft_scope: Warehouse management
  scope_type: functional_module
  local_targets:
  - D06
  - D07
  assessment: Exécution logistique en adhérence ; rapprochement à examiner pour options/engagements/faits, sans transférer
    l’exécution dans D06/D07 ou le développement FLOW.
  basis:
  - MFIT07
- microsoft_scope: Business process catalog
  scope_type: process_reference
  local_targets: []
  assessment: Scénarios et activités organisés en processus ; pas une hiérarchie directe de domaines problématiques et capacités.
    Utile pour éprouver la couverture.
  basis:
  - MFIT08
principles_used:
- PRINCIPLE-REFERENCE-PROJECTIONS
- PRINCIPLE-TWO-LAYERS
- PRINCIPLE-CAPABILITY
- PRINCIPLE-FLOW-LOGISTICS
limitations:
- Évaluation de concepts, pas audit exhaustif fonctionnel ou validation d’implémentation.
- Aucun nouveau domaine Business Services ni univers Services créé.
- Business References reste un groupe de présentation.
- Pas d’équivalence automatique Microsoft Sales = Business Services, ni SCM = Supply.
- Les statuts et périmètres du modèle restent inchangés.
