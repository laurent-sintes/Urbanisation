definition_ref: modeling-glossary.yaml#MOD006
field: fields.nature
scope: 76 formes principales proposées ; les formes peuvent se combiner. Aucun changement de noms, définitions, parents, comportements
  ou audit clos U431.
review:
  state: partial
  adopted_scope: Grille des formes propres aux comportements U451.
  proposed_scope: Qualifications individuelles par Codex, à partir des résultats et exemples de MOD006.
classification:
- id: BHV001
  nature: decision_dimension
  rationale: Établir les quantités admissibles pour la demande en tenant compte des allocations, protections et réservations,
    sans double décompte.
- id: BHV002
  nature: decision_dimension
  rationale: Établir les possibilités de satisfaction à partir des lieux admissibles, entrepôts, magasins, darkstores ou autres
    espaces de stockage.
- id: BHV003
  nature: decision_dimension
  rationale: Déterminer quand une quantité peut effectivement contribuer à la promesse selon sa disponibilité opérationnelle.
- id: BHV004
  nature: decision_dimension
  rationale: Établir les possibilités à l’échéance en intégrant les réceptions attendues et les engagements concurrents, pour
    une promesse ou un ensemble.
- id: BHV005
  nature: planning_practice
  rationale: Construire plusieurs réponses possibles en explicitant leurs hypothèses, objectifs et contraintes.
- id: BHV006
  nature: planning_practice
  rationale: Projeter les conséquences d’un scénario et analyser leurs impacts sur les indicateurs métier et les processus
    pour éclairer les choix.
- id: BHV016
  nature: planning_practice
  rationale: Adapter le scénario de stock en cours aux écarts observés, compte tenu des actions engagées et des décisions
    spécialisées.
- id: BHV017
  nature: intervention_mechanism
  rationale: Configurer les droits préservant l’accès d’un groupe à des ressources face aux usages concurrents.
- id: BHV018
  nature: intervention_mechanism
  rationale: Configurer les limites de consommation d’un groupe sur le périmètre et la période retenus.
- id: BHV019
  nature: intervention_mechanism
  rationale: Configurer le stock tampon et ses conditions d’utilisation pour absorber les incertitudes.
- id: BHV020
  nature: intervention_mechanism
  rationale: Configurer les règles de déclenchement et de limitation du réassort qui encadrent le renouvellement du stock.
- id: BHV021
  nature: business_effect
  rationale: Formaliser les quantités, dates et conditions proposées pour satisfaire une commande, à partir des possibilités
    et arbitrages établis, sans confirmer encore l’engagement.
- id: BHV022
  nature: business_effect
  rationale: établir les quantités et dates promises, en distinguant la part confirmée de celle qui ne l’est pas.
- id: BHV023
  nature: business_effect
  rationale: Réexaminer les promesses lorsque les ressources, commandes, dates ou priorités changent et établir les modifications
    autorisées.
- id: BHV024
  nature: intervention_mechanism
  rationale: Déplacer du stock vers les lieux qui en ont davantage besoin, en préservant les besoins des donneurs.
- id: BHV025
  nature: intervention_mechanism
  rationale: Regrouper des quantités fragmentées pour leur redonner une utilité ou libérer des sites.
- id: BHV026
  nature: business_scope
  rationale: Déterminer les objectifs et seuils de stock d’un magasin pour assurer la disponibilité client, selon la demande
    locale, l’assortiment retenu, les contraintes de présentation et de capacité, les délais de réassort et le risque d’excédent.
- id: BHV027
  nature: business_scope
  rationale: Déterminer les objectifs et seuils de stock d’un centre de distribution pour servir les magasins ou canaux desservis,
    selon leurs besoins prévus, les délais fournisseurs, les aléas d’approvisionnement et les contraintes de stockage.
- id: BHV028
  nature: business_scope
  rationale: Déterminer conjointement les objectifs de stock de plusieurs échelons du réseau, en tenant compte de leurs dépendances,
    pour atteindre le service recherché au meilleur compromis de stock et de risque.
- id: BHV029
  nature: policy_strategy
  rationale: Vérifier l’ensemble du stock d’un périmètre lors d’une campagne, pour établir une référence fiable.
- id: BHV030
  nature: policy_strategy
  rationale: Vérifier régulièrement des sélections d’articles ou d’emplacements, avec une fréquence adaptée aux enjeux.
- id: BHV031
  nature: policy_strategy
  rationale: Vérifier ponctuellement un stock ciblé lorsqu’une situation le justifie.
- id: BHV032
  nature: policy_strategy
  rationale: Déterminer les événements du parcours métier à partir desquels la ressource doit être réservée, puis les conditions
    de maintien de cette protection au fil du parcours.
- id: BHV033
  nature: policy_strategy
  rationale: Déterminer à quelle distance de la date de besoin commencer à réserver, afin de sécuriser l’échéance sans immobiliser
    trop tôt les ressources.
- id: BHV034
  nature: policy_strategy
  rationale: Déterminer des conditions de réservation différentes selon les engagements de service attachés aux demandes,
    aux clients ou aux canaux, en respectant les priorités et droits d’usage établis.
- id: BHV035
  nature: policy_strategy
  rationale: Adapter les conditions de déclenchement et de durée de réservation à la tension sur les ressources et au risque
    d’immobilisation inutile, dans les limites des engagements déjà accordés.
- id: BHV036
  nature: business_effect
  rationale: Transformer une intention planifiée en ordre ferme, avec les engagements et restrictions de révision associés.
- id: BHV037
  nature: business_effect
  rationale: Protéger les éléments désignés d’un Order contre leur modification par les réoptimisations, en explicitant la
    portée du gel et les conditions autorisées de révision.
- id: BHV038
  nature: business_effect
  rationale: Gouverner la préparation et la prise d’effet du contenu initial ou révisé d’un Order, en distinguant le contenu
    applicable des modifications en préparation et en préservant les engagements et réalisations acquis.
- id: BHV039
  nature: business_effect
  rationale: Autoriser la prise en charge de tout ou partie d’un Order, ou d’un ensemble d’Orders liés, lorsque les conditions
    de lancement individuelles et collectives sont satisfaites.
- id: BHV040
  nature: business_effect
  rationale: Suspendre une progression désignée pour un motif métier puis permettre sa reprise lorsque les conditions de levée
    sont réunies.
- id: BHV043
  nature: business_effect
  rationale: Gouverner le retrait autorisé de tout ou partie du besoin et la clôture de son suivi opérationnel, en préservant
    les réalisations acquises et en explicitant le devenir du reliquat.
- id: BHV044
  nature: intervention_mechanism
  rationale: Scinder un Order ou ses éléments en parties traitables distinctement, en préservant la filiation, la cohérence
    des quantités et les engagements applicables.
- id: BHV045
  nature: intervention_mechanism
  rationale: Appliquer les affectations d’un plan retenu, en contrôlant qu’elles restent applicables et en signalant les écarts.
- id: BHV046
  nature: intervention_mechanism
  rationale: Compléter les besoins non affectés tout en préservant les affectations existantes.
- id: BHV047
  nature: intervention_mechanism
  rationale: Réviser les affectations modifiables pour appliquer de nouveaux arbitrages entre commandes.
- id: BHV048
  nature: policy_strategy
  rationale: Déterminer l’orientation selon une politique établie, en fonction de l’état du produit, de sa catégorie et des
    conditions applicables.
- id: BHV049
  nature: policy_strategy
  rationale: Comparer plusieurs devenirs autorisés selon la valeur récupérable, les coûts, les délais et les risques.
- id: BHV050
  nature: process_variant
  rationale: Prendre en charge la remise en disponibilité du produit.
- id: BHV051
  nature: process_variant
  rationale: Prendre en charge une remise en état, suivre son résultat et la suite attendue.
- id: BHV052
  nature: process_variant
  rationale: Relier le retour client à sa prise en charge par Supplier Return.
- id: BHV053
  nature: process_variant
  rationale: Prendre en charge la restitution du produit au client, après réparation ou décision de non-reprise.
- id: BHV054
  nature: process_variant
  rationale: 'Prendre en charge la mise au rebut retenue : conserver l’autorisation, suivre la réalisation et rapprocher la
    preuve avec la sortie de stock.'
- id: BHV055
  nature: process_variant
  rationale: Prendre en charge un retour fournisseur donnant lieu à un avoir ou remboursement attendu, sans remplacement des
    marchandises retournées.
- id: BHV056
  nature: process_variant
  rationale: Prendre en charge un retour associé à un remplacement attendu, en conservant les liens entre marchandises renvoyées
    et apports de remplacement.
- id: BHV057
  nature: process_variant
  rationale: Prendre en charge l’envoi d’un bien au fournisseur pour réparation puis sa récupération, en préservant son identité
    et l’attendu de restitution.
- id: BHV058
  nature: process_variant
  rationale: Acheter des marchandises destinées au stock du réseau ; suivre les quantités et dates restant à recevoir.
- id: BHV059
  nature: process_variant
  rationale: Acheter des marchandises livrées directement par le fournisseur au client ; coordonner les attentes des commandes
    d’achat et de vente.
- id: BHV060
  nature: process_variant
  rationale: Acheter une prestation ; suivre ce qui est attendu puis reconnu réalisé.
- id: BHV061
  nature: process_variant
  rationale: Prendre en charge l’apport initial de stock consigné pour une saison, une capsule ou un lancement, et suivre
    sa satisfaction avant l’échéance de démarrage.
- id: BHV062
  nature: process_variant
  rationale: Prendre en charge les apports successifs de stock consigné pendant l’activité, selon l’évolution du besoin, et
    suivre leur satisfaction.
- id: BHV063
  nature: business_effect
  rationale: Appliquer le transfert de propriété lors de la vente ou consommation prévue par l’accord.
- id: BHV064
  nature: business_effect
  rationale: Appliquer l’acquisition à l’échéance d’une durée contractuelle.
- id: BHV065
  nature: business_effect
  rationale: 'Prendre en charge une sortie autorisée de la consignation ou de la détention : reprise fournisseur, orientation
    vers un soldeur, seconde main ou destruction selon l’accord et la décision retenue.'
- id: BHV066
  nature: process_variant
  rationale: 'Prendre en charge la commande à livrer au client depuis le réseau : entrepôt, magasin ou autre lieu admissible.'
- id: BHV067
  nature: process_variant
  rationale: Prendre en charge la mise à disposition et le retrait au lieu convenu. Une commande prête reste distincte d’une
    commande effectivement retirée.
- id: BHV068
  nature: process_variant
  rationale: Prendre en charge la commande dont le fournisseur livre directement le client, en coordonnant les attendus de
    vente et d’achat.
- id: BHV069
  nature: process_variant
  rationale: Prendre en charge une vente entre entités juridiques du groupe, avec cohérence entre engagements de vente et
    d’achat.
- id: BHV070
  nature: process_variant
  rationale: 'Porter les transferts constituant le stock de départ : implantation d’une saison, d’une capsule ou d’un nouveau
    lieu.'
- id: BHV071
  nature: process_variant
  rationale: Porter les transferts alimentant régulièrement un lieu pendant l’activité.
- id: BHV072
  nature: process_variant
  rationale: Porter les transferts corrigeant un déséquilibre entre lieux, par exemple d’un magasin disposant d’un excédent
    vers un magasin qui manque de stock.
- id: BHV073
  nature: process_variant
  rationale: 'Porter les transferts regroupant des stocks dispersés : reconstitution de tailles, concentration ou rapatriement
    de reliquats.'
- id: BHV074
  nature: process_variant
  rationale: Porter un transfert nécessaire à une commande identifiée, en conservant son lien et son échéance.
- id: BHV075
  nature: decision_dimension
  rationale: Les possibilités de satisfaire la demande en obtenant des ressources supplémentaires, avec quantités, dates et
    conditions de disponibilité.
- id: BHV076
  nature: decision_dimension
  rationale: Les possibilités obtenues en modifiant les modalités de satisfaction par rapport à la situation de référence.
- id: BHV077
  nature: decision_dimension
  rationale: Les possibilités obtenues en révisant des engagements modifiables, en explicitant les conséquences sur les commandes
    concernées.
- id: BHV078
  nature: business_effect
  rationale: Prendre en charge l’établissement et les révisions de l’engagement fournisseur sur une commande d’achat, en distinguant
    la demande, la réponse fournisseur et les conditions finalement acceptées.
- id: BHV079
  nature: business_scope
  rationale: Réception, manutention, préparation et expédition dans les entrepôts et plateformes.
- id: BHV080
  nature: business_scope
  rationale: Acheminements, progression, arrivées estimées et remise au destinataire.
- id: BHV081
  nature: business_scope
  rationale: Réception magasin, passage en réserve, mise en rayon et réassort de la surface de vente.
- id: BHV082
  nature: business_scope
  rationale: Suivre l’avancement des processus d’exécution Supply et de leurs Tasks métier, en reliant chaque Task aux prestations
    et appels de services qui contribuent à sa réalisation, pour rendre explicites les résultats acquis, les attentes, les
    échecs et leurs conséquences sur la progression.
- id: BHV083
  nature: policy_strategy
  rationale: Déterminer les apports pour satisfaire des besoins datés, après déduction des ressources utilisables et des apports
    attendus.
- id: BHV084
  nature: policy_strategy
  rationale: Déterminer les apports pour retrouver une cible de stock selon les seuils applicables, sans nécessiter une commande
    identifiée pour chaque apport.
- id: BHV085
  nature: intervention_mechanism
  rationale: Déterminer comment modifier les apports déjà prévus pour éviter pénuries, excédents ou décalages, en respectant
    les engagements.
- id: BHV086
  nature: intervention_mechanism
  rationale: Relier des Orders ou leurs éléments dans un ensemble à traiter selon des conditions communes, tout en conservant
    chaque demande distincte.
- id: BHV087
  nature: intervention_mechanism
  rationale: Réunir plusieurs Orders compatibles, ou leurs éléments, dans une demande unique qui les remplace pour la suite
    du traitement, en conservant leur origine.
market_comparison:
  common: BIZBOK définit le comportement comme une façon d’agir selon les circonstances ; Microsoft illustre des politiques
    de comptage.
  difference: Les sept formes et les 76 classifications sont une convention FLOW, pas une taxonomie prescrite par ces sources.
  consulted_on: '2026-09-19'
  source_refs:
  - ELM052
  - ELM234
  - CMP170
