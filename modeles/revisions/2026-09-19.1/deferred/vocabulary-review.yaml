  state: under_instruction
  topic: point_5
  user_preference: Ressource plutôt que fourniture, à préciser selon U147.
  candidate_term: Resource
  candidate_definition: Bien ou ensemble de biens, présents ou futurs, pouvant contribuer à satisfaire un Supply Order, sous
    des conditions de quantité, de lieu, de date et d’usage.
  scope_note: U175 insiste sur le sens générique et contextualisé de Resource, qui peut aussi qualifier un magasin. La définition
    candidate U174 concerne seulement les biens de Supply et n’est pas une définition générale adoptée.
  distinctions:
  - term: Item / Product Reference
    meaning: Référence qui décrit et identifie ce dont on parle ; pas la quantité de biens présente ou attendue.
    state: ai_proposed
  - term: Goods
    meaning: 'Biens matériels eux-mêmes : produits finis, tissus, composants ou accessoires.'
    state: ai_proposed
  - term: Inventory
    meaning: Stock et représentation de ses quantités et états selon le modèle local.
    state: ai_proposed
  - term: Resource
    meaning: Les biens envisagés sous leur aptitude à contribuer à la satisfaction d’un Order, avec leurs conditions de mobilisation.
    state: ai_proposed
  certainty_cases:
  - case: 100 pièces en entrepôt
    qualification: Ressources présentes ; leur existence ne prouve pas leur admissibilité pour tout usage.
  - case: 100 pièces attendues sur achat ferme
    qualification: Ressources futures avec origine et date prévues ; distinguer fermeté et garantie.
  - case: 100 pièces encore achetables dans un contrat
    qualification: Possibilité d’approvisionnement ; ne pas la traiter comme réception engagée ou stock existant.
  market_support:
    url: https://learning.sap.com/courses/exploring-fashion-functions-and-business-processes-in-sap-s-4hana-for-fashion-and-vertical-business/explaining-supply-assignment_af05618d-4954-4f22-9857-3dd12e3940c4
    access: Texte consulté auparavant et extrait revérifié le 2026-09-14 ; version de cours non figée.
    observation: SAP rapproche stocks et ressources futures issues notamment de commandes d’achat dans Supply Assignment.
      Resource est la proposition de vocabulaire local, pas une traduction canonique SAP.
  limits:
  - Pas de nouvel objet ou de capacité créé.
  - 'Ne pas remplacer globalement fourniture ou supply : selon la phrase, il peut s’agir de l’approvisionnement, de la mise
    à disposition ou de la réalisation, plutôt que du bien.'
  - Examiner les notions une par une ; les exemples ne sont pas des statuts ou types validés.
  stock_transit_review:
    source_refs:
    - U175
    state: ai_proposed
    recommendation: Ne pas créer deux natures de biens selon qu’ils sont stockés ou transportés. Distinguer la représentation
      de leur position/état de stock et l’objet qui organise ou suit leur acheminement.
    distinctions:
    - concept: Goods / biens
      meaning: Ce qui existe matériellement ; le départ ne change pas à lui seul la nature du bien.
    - concept: Inventory position / position de stock
      meaning: Quantités et qualifications selon référence, lieu ou position, propriétaire, statut et date pertinents ; nom
        et grain à instruire.
    - concept: Shipment / Delivery
      meaning: Objet de l’acheminement ou document de livraison selon le contexte, avec origine, destination, contenu prévu/effectif
        et avancement ; ces deux noms ne sont pas déclarés équivalents.
    key_points:
    - En transit et en stock ne sont pas nécessairement exclusifs ; le périmètre de stock et le point de vue comptent.
    - Une livraison peut être planifiée avant le départ ; le document ne prouve pas un mouvement physique.
    - Identité du bien, détention, propriété, disponibilité et localisation sont des axes distincts.
    - Des articles fongibles peuvent être suivis en quantités, lots ou unités logistiques sans identifiant individuel par
      pièce.
    - Les mêmes biens peuvent être décrits dans plusieurs modèles contextualisés, reliés par une traçabilité explicite, sans
      objet logiciel unique imposé.
    illustration:
      initial: 100 pièces en entrepôt A
      after_dispatch: 60 pièces restent en A ; 40 sont en transit vers B.
      destination_view: 'B attend 40 pièces : une autre vue des 40 en transit, pas 40 biens supplémentaires.'
      assumptions: Exemple sans perte, transformation ni changement de périmètre de propriété ; aucune règle comptable universelle
        imposée.
    market_sources:
    - url: https://www.gs1.org/standards/id-keys/sscc
      title: GS1 — Serial Shipping Container Code
      access: Extrait officiel consulté le 2026-09-14 ; unité logistique constituée pour stockage et/ou transport.
      support: Une unité physique/logistique n’est pas définie exclusivement par l’état stocké ou transporté.
    - url: https://help.sap.com/docs/SAP_ERP/00b86df2555f4c83b47b97a5c1223904/ed7dc1536ca9b54ce10000000a174cb4.html
      title: SAP ERP — Stock Transport Order with Delivery via Shipping
      access: Extrait officiel consulté le 2026-09-14 ; version détaillée non établie.
      support: Coexistence d’un processus de livraison et d’un suivi de quantité en transit, puis réception.
    limits: Pas de nouvelle classe de modèle, relation, attribut obligatoire ni frontière d’agrégat adoptés ; vocabulaire
      détaillé à instruire après cette première distinction.
