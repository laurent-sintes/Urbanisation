upstream_universe_review:
  source_refs:
  - U165
  - U170
  - U171
  - U172
  - U173
  target_id: universe-case
  state: urbanist_validated
  current_name: Business Services
  candidate_name: Business Services
  candidate_origin: Proposition Codex à partir de la précision de Laurent U171 sur l’offre de services adressée aux parties
    prenantes.
  assessment: U173 adopte Business Services et la définition actualisée après U172. Offre aux parties prenantes, travail collectif
    et pilotage des grands processus transverses ; domaines différés. Case Management reste l’approche de réalisation, distincte
    du nom métier.
  proposed_definition: Prendre en charge et piloter les grands processus transverses de l’entreprise, de la demande d’une
    partie prenante au résultat attendu, en coordonnant les contributions des services et en mobilisant les moyens nécessaires
    à leur réalisation.
  definition_state: urbanist_validated
  proposed_boundary: Le périmètre amont porte le sens de la demande, son contexte et son traitement ; Supply porte la satisfaction
    de ses Orders ; Services porte les prestations confiées. Le traitement amont reste actif pendant les échanges et adaptations.
  constraints:
  - Le périmètre ne se réduit pas à la capture des intentions ou à un simple moteur de workflow.
  - Un problème peut émerger sans intention préalable explicitement formulée.
  - Case reste utilisable comme objet ou approche de traitement, indépendamment du nom d’univers.
  - Aucun nouveau domaine, objet, relation ou niveau créé.
  - La plateforme de Case Management peut matérialiser l’offre sans devenir propriétaire de tous les objets métier ni réaliser
    elle-même toutes les prestations.
  - Décrire une offre de services ne transforme pas la carte de capacités Supply en catalogue d’API ou d’étapes de processus.
  - Ne pas déduire de nouvel univers ou contexte borné unique à partir de l’offre.
  - U173 valide le nom et les définitions ; Business Processes reste historique. Domaines à explorer plus tard.
  previous_proposal_U170:
    candidate_name: Business Processes
    candidate_origin: Laurent propose Processus métier ; traduction anglaise par Codex.
    assessment: Nom compréhensible pour la couche qui organise le traitement métier. Comme nom d’univers, il décrit encore
      une manière de fonctionner et ne distingue pas à lui seul ce périmètre des processus internes de Supply ou de Services.
    proposed_definition: Prendre en charge les intentions des parties prenantes, les préciser en demandes ou en problèmes
      à résoudre, puis organiser leur traitement jusqu’au résultat attendu, en mobilisant notamment la Supply et les prestations
      nécessaires.
  candidate_name_state: urbanist_validated
  platform_orientation_U171:
    source_refs:
    - U171
    state: user_stated
    approach: S’appuyer sur une plateforme de Case Management pour implémenter les processus métier de durée moyenne ou longue
      qui impactent l’entreprise.
    audiences:
    - clients
    - fournisseurs
    - partenaires
    - services internes
    duration_scope: Aucun seuil de durée fixé ; durée et impact ne suffisent pas à définir un domaine de capacités.
  proposed_distinctions:
    Business Services: Offre et résultat métier proposés aux parties prenantes ; nom de l’univers amont adopté U173.
    Business Processes: Organisation du traitement nécessaire à la réalisation de cette offre.
    Case Management: Approche et plateforme retenues comme orientation de réalisation de ces traitements.
    Services downstream: Prestations confiées aux exécutants, selon U169 ; pas de renommage adopté.
  previous_definition_U171: Porter les services métier proposés par l’entreprise à ses clients, fournisseurs, partenaires
    et services internes, et organiser le traitement de leurs demandes ou problèmes jusqu’au résultat attendu.
  platform_scope_U172:
    source_refs:
    - U172
    state: user_stated
    requirements:
    - Portail
    - Espaces par utilisateur
    - Management des demandes
    - Planification et affectation lorsque plusieurs services participent au traitement
    - Représenter les grands processus transverses de l’entreprise
    analogy: Service desk, sans restriction aux services informatiques ni adoption d’ITIL.
    proposed_interpretation:
      stakeholder_access: Exprimer et suivre les demandes, fournir informations et réponses.
      team_work: Organiser les contributions et responsabilités des participants.
      coordination: Planifier le travail et affecter les contributions aux équipes ou acteurs, selon des règles à préciser.
      end_to_end_management: Suivre la demande et le résultat global au-delà des étapes locales.
    boundaries:
    - Affecter le travail et ses responsabilités dans la couche processus est distinct de Supply Assignment qui couvre les
      commandes avec des ressources Supply.
    - Planifier les contributions des services n’est pas le même problème que choisir l’échéancier de fourniture dans D03.
    - Service organisationnel interne, service métier proposé et prestation d’un exécutant sont des sens distincts à qualifier
      selon le contexte.
    - Ne pas déduire un catalogue de capacités depuis les écrans, étapes ou contrôles de cette plateforme.
    - Le support des processus transverses n’impose pas que tous leurs traitements ou objets soient centralisés dans cette
      plateforme.
    - Aucune implémentation de portail ou modification d’Atlas autorisée par cette seule exploration.
