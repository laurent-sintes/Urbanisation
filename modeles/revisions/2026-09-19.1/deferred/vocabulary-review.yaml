context_boundaries_U168:
  source_refs:
  - U168
  - U169
  state: urbanist_validated
  orientation: Supply et Services portent des Orders avec des définitions propres à leur contexte.
  scope: U169 valide la frontière sémantique, les définitions courtes et responsabilités présentées, le vocabulaire contextualisé
    et les contrats entre modèles. Granularité interne ouverte ; attributs détaillés U167, cardinalités et déploiements non
    validés.
  labels:
    Supply Order: Commande dans le contexte Supply
    Service Order: Commande de prestation dans le contexte Services
  ddd_precision: La différence de sens justifie une frontière de modèle ; elle ne démontre pas que chacun des deux grands
    périmètres constitue exactement un seul bounded context. Univers, domaines et bounded contexts restent des axes distincts.
  source:
    url: https://martinfowler.com/bliki/BoundedContext.html
    access: 'Extrait de la référence primaire de Martin Fowler consulté le 2026-09-14 : modèles distincts et relations explicites,
      langage contextualisé.'
  id: CONTEXT-BOUNDARIES-SUPPLY-SERVICES
  order_definitions:
    Supply Order: Commande dont on travaille la couverture, les priorités et la promesse.
    Service Order: Commande de prestations confiées à un exécutant.
  responsibilities:
    Supply: Décider comment satisfaire les commandes avec les ressources et possibilités disponibles.
    Services: Organiser et réaliser les prestations demandées, puis rendre compte des résultats.
  adopted_implications:
  - Dans chaque contexte, Order peut être le nom local ; qualifier Supply Order / Service Order dans les échanges et comparaisons.
  - Contrats explicites entre modèles ; ne pas imposer un objet Order partagé avec un cycle unique.
  - Les engagements et faits d’exécution alimentent les décisions Supply sans imposer l’identité des états.
  domain_context_distinction: Les domaines de capacités délimitent des espaces problématiques ; les bounded contexts délimitent
    la validité des modèles. Ils ne sont pas automatiquement les mêmes découpages.
