  state: ai_proposed
  candidate_name: Service Order
  definition: Commande métier adressée à un prestataire pour réaliser une ou plusieurs prestations, précisant les résultats
    attendus et les conditions de réalisation.
  alternative: Service Request reste un terme possible pour une sollicitation ; les usages du marché ne fixent pas une succession
    universelle Request puis Order.
  content_candidates:
  - Identité et version de la commande de service
  - Demandeur, bénéficiaire et prestataire destinataire, lorsque déterminé
  - Origine métier et références aux Orders concernés, sans cardinalité imposée
  - Prestations demandées et résultats attendus
  - Objets concernés, quantités et lieux lorsque pertinents
  - Dates souhaitées, contraintes et critères de réalisation
  - Historique de la demande et références aux réponses, engagements et faits
  distinctions:
  - Résultat métier attendu versus moyens internes de l’exécutant
  - Conditions demandées versus conditions acceptées
  - Commande émise versus prise en charge ou réalisation constatée
  - Objet métier durable versus représentation documentaire ou message technique
  boundary: 'D07 est un point d’appui à instruire : prestations attendues, prise en charge et rapprochement des faits. Aucun
    lien exclusif à D07 créé. Les contenus détaillés et éventuels autres types de prestations restent des illustrations proposées.'
