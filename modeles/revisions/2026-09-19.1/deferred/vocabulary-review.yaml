analysis_path: marche/requirement-case-demand-order-command.md
terms:
- term: Requirement
  proposed_meaning: Besoin à satisfaire ; dans notre contexte Supply, préciser la ressource requise et, lorsque connus, la
    quantité, le lieu et la date.
  boundary: Ne désigne pas automatiquement une exigence logicielle ni une demande d’achat ; peut provenir d’une commande,
    d’une prévision ou d’un autre besoin. Recouvrement Demand à instruire, pas deux objets imposés.
- term: Demand
  proposed_meaning: Demande adressée aux ressources Supply, constatée ou anticipée ; peut être individuelle ou agrégée.
  boundary: Ne pas réserver le terme à la couche Case ni à une phase précédant les Orders. Demand et Requirement se recouvrent
    dans les usages de planification ; pas de séparation universelle brut/formalisé établie.
- term: Case
  proposed_meaning: Dossier de traitement d’une situation en vue d’un résultat, avec son contexte, ses décisions, ses activités
    et son suivi.
  boundary: 'Précision proposée au raccourci local Case = demande : le Case organise le traitement, il ne se réduit pas au
    besoin exprimé. La distinction normative Case/CaseFile reste conservée ; aucune cardinalité avec Order décidée.'
- term: Order
  proposed_meaning: 'Commande métier durable de pilotage Supply : contenu applicable de ce qui est demandé ou autorisé, évolutions
    et situation de réalisation.'
  boundary: Orientation locale U140/U141 conservée ; la présence d’un Order ne prouve ni promesse confirmée, ni couverture
    complète. Tous types de commandes ; Order ne désigne pas exclusivement notre couche Supply chez les éditeurs.
- term: Command
  proposed_meaning: Objet métier matérialisant une demande d’exécution adressée par la Supply à une plateforme exécutante,
    logistique ou autre.
  boundary: Hypothèse de Laurent U165, distincte du pattern logiciel exclu de la cartographie. Objet candidat, pas capacité
    ni nom adopté. Ne présume pas acceptation, engagement de l’exécutant, exécution effective ou cardinalité avec Order.
  previous_proposal_U164:
    meaning: Instruction demandant une action, par exemple réviser une commande ou réserver une quantité.
    boundary: Peut exprimer une intention métier ; le sens logiciel CQRS est un usage particulier. Ne pas remplacer Order
      par Command ni assimiler une instruction à un fait réalisé ou une capacité.
  state: under_instruction
  source_refs:
  - U165
sources:
- title: OMG CMMN 1.1, sections 4.1 et 5.3.1
  url: https://www.omg.org/spec/CMMN/1.1/PDF
  access: Texte des sections consulté le 2026-09-14 ; Case comme traitement d’une situation, CaseFile comme informations du
    dossier. Le titre de métadonnées fourni par le moteur est erroné, le corps est bien CMMN v1.1.
- title: SAP S/4HANA — Net Requirements Calculation for MRP
  url: https://help.sap.com/docs/SAP_S4HANA_ON-PREMISE/fe39e10a9a864a8f8dc9537704f0fa13/46abce5314894208e10000000a174cb4.html
  access: Extrait indexé consulté le 2026-09-14 ; ouverture sans texte. Besoins indépendants, clients, dépendants, réservations
    et prévisions ; édition détaillée non établie.
- title: Microsoft Business Central — Plan for new demand order by order
  url: https://learn.microsoft.com/en-us/dynamics365/business-central/production-how-to-plan-for-new-demand
  access: Texte consulté le 2026-09-14, notamment sources de demande (ventes, composants, assemblage, services, projets) et
    Supply Orders ; documentation en ligne, version produit non figée.
- title: Microsoft — CQRS pattern
  url: https://learn.microsoft.com/en-us/azure/architecture/patterns/cqrs
  access: Texte consulté le 2026-09-14 ; les Commands représentent des tâches métier et portent une intention de changement.
    Appui de vocabulaire logiciel, aucun choix de CQRS pour la plateforme.
limits:
- Pas de nouveaux objets, documents, événements ou relations créés dans le modèle actif.
- Pas de chaîne obligatoire Demand puis Requirement puis Case puis Order puis Command.
- Le mot Order peut porter une demande sur une ressource et une ressource attendue pour une autre partie ; perspective et
  lieu comptent.
- Requisition reste la demande interne d’achat examinée U155, distincte de Requirement.
