execution_market_review:
  source_refs:
  - U165
  - U166
  analysis_path: marche/logistics-order-et-demande-execution.md
  state: ai_proposed
  comparisons:
  - reference: SAP Digital Manufacturing
    terms:
    - Logistics Order
    meaning: Ordre de transport de matières et encours entre emplacements de l’atelier.
    fit: Nom exact attesté ; périmètre atelier plus étroit que la demande générique adressée à toute plateforme logistique.
    url: https://help.sap.com/docs/sap-digital-manufacturing/execution/manage-logistics-orders?locale=en-US&state=PRODUCTION&version=latest
    version: Documentation latest, édition non figée
    access: Texte indexé détaillé consulté le 2026-09-14.
  - reference: Microsoft Dynamics 365 Supply Chain Management, Warehouse management only mode
    terms:
    - Inbound Shipment Order
    - Outbound Shipment Order
    meaning: Documents dédiés à l’exécution en entrepôt, utilisés notamment avec un ERP ou un OMS externe.
    fit: 'Fort rapprochement : documents logistiques pouvant remplacer les documents généraux achat, vente et transfert du
      seul point de vue WMS. Pas une couverture générale de toutes prestations ; restrictions retours, production et transport
      documentées.'
    url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/warehousing/wms-only-mode-overview
    version: Documentation en ligne, version produit non figée
    access: Texte indexé détaillé consulté le 2026-09-14.
  - reference: SAP EWM
    terms:
    - Warehouse Request
    - Outbound Delivery Order
    - Outbound Delivery Request
    meaning: Warehouse Request porte le travail demandé au WMS ; Outbound Delivery Order en est un type. Messages de demande
      et document interne du WMS sont distingués dans la version consultée.
    fit: Rapprochement pertinent au niveau entrepôt, sans mapping universel avec un objet unique FLOW.
    url: https://help.sap.com/docs/SAP_SUPPLY_CHAIN_MANAGEMENT/ce32eae1b3db423fb4625f3d692cae6f/39cecb53ad377114e10000000a174cb4.html?locale=en-US&state=PRODUCTION&version=7.0.2VERSIONFORSAPHANA
    version: SCM 7.0.2 version for SAP HANA
    access: Texte indexé détaillé consulté le 2026-09-14 ; variantes récentes possibles.
  - reference: SAP Transportation Management
    terms:
    - Freight Order
    meaning: Document de planification et réalisation du transport routier ou ferroviaire ; peut être affecté à un transporteur.
    fit: Spécifique au transport ; Freight Booking également présent pour aérien/maritime.
    url: https://help.sap.com/docs/SAP_TRANSPORTATION_MANAGEMENT/54cf405c9d9e4c96bf091967ea29d6a7/ff8bbbea9bd0421b9f833793d8d52b3d.html
    version: 9.6 FPS02
    access: Texte indexé détaillé consulté le 2026-09-14.
  - reference: Oracle Fusion Cloud Inventory Management
    terms:
    - Shipment Request
    meaning: Demande d’expédition transmise à un WMS ou à un prestataire logistique tiers, avec retour de confirmation.
    fit: Appui direct pour la frontière Supply/exécution sortante ; ne couvre pas seul toute prestation logistique.
    url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/25c/faims/Chunk1514687883.html
    version: 25C
    access: Page ouverte et texte consulté le 2026-09-14.
  - reference: GS1 EDI
    terms:
    - Transport Instruction
    - Transport Instruction and Response
    meaning: Vocabulaire standard d’instruction et de réponse pour le transport.
    fit: Appui de nom et de distinction instruction/réponse ; guide complet non consulté dans cette recherche.
    url: https://www.gs1.org/standards/edi
    version: Index des standards, édition du guide non établie
    access: Index officiel consulté via résultat indexé le 2026-09-14 ; ouverture du guide spécifique en erreur.
  - reference: SAP EWM — Warehouse Order
    terms:
    - Warehouse Order
    meaning: Lot de travail exécutable constitué de tâches d’entrepôt ou de postes d’inventaire pour un opérateur.
    fit: Granularité interne d’exécution ; ne pas le confondre avec la demande amont de prestation.
    url: https://help.sap.com/docs/SAP_SUPPLY_CHAIN_MANAGEMENT/ce32eae1b3db423fb4625f3d692cae6f/65cccb53ad377114e10000000a174cb4.html?version=7.0.2VERSIONFORSAPHANA
    version: SCM 7.0.2 version for SAP HANA
    access: Texte indexé détaillé consulté le 2026-09-14.
  recommendation: Logistics Order est un candidat local compréhensible pour une prestation logistique confiée, attesté avec
    un périmètre plus étroit chez SAP Digital Manufacturing. Pour un concept couvrant aussi des prestations non logistiques,
    Execution Request reste un candidat de généralisation locale. Aucun nom interéditeur universel établi ni adoption.
  limits:
  - Les différents Orders/Requests/Instructions ne sont ni synonymes exacts ni capacités.
  - Le rôle à la frontière entre donneur d’ordre et exécutant compte davantage que le suffixe Order.
  - Une demande, sa prise en charge et les faits de réalisation restent distincts.
