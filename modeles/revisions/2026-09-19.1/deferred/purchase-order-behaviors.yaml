supplier_confirmation_U403:
  status: integrated
  node_id: BHV078
  parent_id: D04.j
  source_refs:
  - U403
  - ELM242
  - CMP153
  name: Supplier Confirmation
  definition: Prendre en charge l’établissement et les révisions de l’engagement fournisseur sur une commande d’achat, en
    distinguant la demande, la réponse fournisseur et les conditions finalement acceptées.
  adopted_explanation:
    mechanism: La construction d’un engagement avec une autre partie, qui peut répondre autrement que ce qui lui est demandé.
    example: On demande 100 pièces vendredi. Le fournisseur propose 60 vendredi et 40 mardi.
    boundaries:
    - responsibility: Demande initiale, réponse fournisseur et engagement accepté
      owner: D04.j
      behavior: BHV078
    - responsibility: Étude des conséquences sur les commandes à satisfaire et des alternatives
      owner: D03
    - responsibility: Application d’un report ou d’une scission autorisée de l’Order
      owner: D04.o
    - responsibility: Modification éventuelle de notre promesse client
      owner: D03.n
    - responsibility: Expédition et réception réellement constatées
      owner: D06
    - responsibility: Enregistrement des effets sur le stock
      owner: D01
    rejected_change: Refuser le report ne rend pas le fournisseur capable de livrer vendredi. Son annonce reste une information
      de risque, même si la modification contractuelle n’est pas acceptée.
    accepted_change: Accepter le nouvel engagement fournisseur ne modifie pas automatiquement notre promesse client.
    operations: Accepter, refuser, proposer une modification et reconfirmer restent les opérations de ce comportement.
  source_comparisons:
  - id: SC-S1
    vendor: Microsoft
    product: Dynamics 365 Supply Chain Management
    title: Vendor collaboration with external vendors
    url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/procurement/vendor-collaboration-work-external-vendors
    edition: Documentation évolutive ; mise à jour affichée 2025-07-21
    locator: Working with POs when vendor collaboration is used ; Changing a PO ; Updating a PO when a vendor suggests changes
    finding: Le processus distingue envoi de la commande, réponse fournisseur (acceptation, refus, changements) et confirmation,
      avec versions et historique. Les changements peuvent porter sur quantités, dates et échéanciers.
    limit: Vendor collaboration couvre plus que ce comportement (notamment RFQ et factures). FLOW conserve le mécanisme d’engagement
      sur Purchase Order, sans copier l’interface, les étapes manuelles ou tous les statuts produit.
    access: Texte primaire ouvert et consulté
    consulted_on: '2026-09-19'
  - id: SC-S2
    vendor: Microsoft
    product: Dynamics 365 Supply Chain Management
    title: Review and accept changes to confirmed purchase orders
    url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/procurement/purchase-order-changes-after-confirmation
    edition: Documentation évolutive ; mise à jour affichée 2026-07-01
    locator: Review changes to confirmed purchase orders ; Step 3, note on direct downstream impacts
    finding: L’examen de modifications d’achats confirmés s’appuie sur leurs conséquences sur les demandes aval avant reconfirmation
      et permet des échanges avec le fournisseur.
    limit: Cette fonction documente les impacts directs, pas tous les impacts indirects. FLOW répartit engagement fournisseur,
      analyse des possibilités, décision collective et promesse client entre capacités distinctes. Aucune capacité Copilot
      ou écran créée.
    access: Texte primaire ouvert et consulté
    consulted_on: '2026-09-19'
  - id: SC-S3
    vendor: SAP
    product: SAP S/4HANA Cloud Best Practices / Direct Procurement with Inbound Delivery (2TX)
    title: Create Supplier Confirmation (Optional)
    url: https://help.sap.com/docs/s4hana-cloud-best-practices/direct-procurement-with-inbound-delivery-2tx-hr/create-supplier-confirmation-optional
    edition: Édition non affichée dans le passage indexé consulté
    locator: Enter Reference Purchase Order ; Create Supplier Confirmation Item ; Create Confirmation Line Data
    finding: Le passage expose une Supplier Confirmation rattachée au Purchase Order, avec date de livraison et quantité confirmées.
    limit: Appui au nom et aux données d’engagement ; le passage ne démontre pas à lui seul la totalité du mécanisme FLOW,
      ses révisions et impacts. Supplier Confirmation y est un objet/processus produit, pas une taxonomie de comportements
      d’entreprise.
    access: Passage primaire indexé consulté ; ouverture directe du portail sans texte exploitable
    consulted_on: '2026-09-19'
