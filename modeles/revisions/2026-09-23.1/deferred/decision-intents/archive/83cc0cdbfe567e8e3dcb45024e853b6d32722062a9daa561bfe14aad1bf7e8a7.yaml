            differences: Cas particulier de scission, sans création obligatoire de commandes séparées.
            flow_position: Couper une commande ou certains de ses éléments en parties identifiables. Split conserve leur filiation
              ; il ne signifie pas répartir un stock entre des commandes déjà distinctes.
