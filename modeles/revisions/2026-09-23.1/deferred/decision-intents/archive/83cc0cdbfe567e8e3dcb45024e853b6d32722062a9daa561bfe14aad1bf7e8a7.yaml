            universel d’approvisionnement ni de Supply Chain.
          notes: 'Exemple fictif : 80 pièces en stock et une réception de 40 constituent des ressources à examiner ; elles
            ne sont pas nécessairement toutes libres, fiables ou mobilisables à la date voulue. Un même transfert est sortant
            pour le lieu donneur et entrant pour le receveur : la perspective compte. À distinguer du [sens fonctionnel local
