            scope_summary: Premier apport de produits, tailles et assortiments aux magasins.
            approach_summary: Distinguer distribution initiale et réassort selon les lieux.
          market_inspiration:
            choice: Nommer le premier apport qui permet de démarrer la saison en stock. Implantation garde le sens donné par
              Laurent ; Initial Stocking est le terme anglais retenu dans FLOW.
            flow_scope: Livraison initiale de stock au début de la période concernée.
            flow_approach: Distinguer choix des apports, commandes de déplacement et livraison effective.
            synthesis:
            - Nextail emploie First Allocation, RELEX Initial allocation et Logility Initial distribution. Les trois distinguent
              premier apport et réassort ; leurs noms insistent différemment sur le choix ou la distribution.
            - FLOW garde Initial Stocking pour l’intention métier d’implantation. Décider les apports et réaliser la livraison
              restent séparés ; ces sources ne prouvent aucune cadence cible ni pratique locale supplémentaire.
            examples:
            - title: Première distribution chez Groupe Dynamite
              situation: La présentation Logility évoque une meilleure distribution initiale et des courbes style/couleur/taille
                adaptées aux canaux.
              outcome: Premier apport et réassort sont présentés comme deux moments à améliorer.
              lesson: FLOW retient cette distinction d’intention, sans reprendre un gain mesuré ni assimiler le calcul à la
                livraison.
              source_title: Retail Optimization Gives Groupe Dynamite an Edge
              source_url: https://www.logility.com/webcast/retail-optimization-gives-groupe-dynamite-an-edge/
        - id: TER080
