              approach_summary: Rendre disponibles des références cohérentes ; une consolidation peut conserver la maîtrise
                des sources amont.
              relationship: Appui sémantique
              flow_position: Porter les références qui font foi dans Supply Chain Orchestration, en articulation avec les
                sources de vérité d’entreprise et les décisions des areas consommatrices.
              status: proposed
            - vendor: EDM Council
              product: Cloud Data Management Capabilities (CDMC)
              source_title: 'CDMC Information Model: Controls, Tests and Mappings'
              source_url: https://edmcouncil.org/wp-content/uploads/2023/02/CDMC-Information-Model-Controls-Tests-Mappings-V1.1.pdf
              evidence_limits: Modèle de contrôle de gestion des données cloud ; appui sur la notion d’autorité, pas prescription
                de domaine Supply ni déclaration de conformité FLOW.
              element_name: Authoritative Data Source / Authoritative Provisioning Point
              element_type: Qualification de gouvernance d’un actif de données
              similarities: Rendre explicite quelles données font autorité pour leurs consommateurs.
              differences: Le contrôle qualifie des actifs et points de fourniture ; il ne délimite pas les références stables
                par rapport aux transactions.
              concept_name: Authoritative Data Source
              scope_summary: Actifs reconnus comme source ou point de fourniture faisant autorité.
              approach_summary: Attribuer explicitement l’autorité ; la simple présence d’une donnée ne suffit pas.
              relationship: Appui sémantique
              flow_position: Porter les références qui font foi dans Supply Chain Orchestration, en articulation avec les
                sources de vérité d’entreprise et les décisions des areas consommatrices.
              status: proposed
            market_inspiration:
              choice: 'Authoritative Data porte la source de vérité locale de Supply Chain Orchestration : les références
                partagées sur lesquelles s’appuient ses décisions et opérations. Cette Area les reçoit et les rend consultables,
                en articulation avec les sources de vérité de l’entreprise, qui restent externes au domaine.'
              flow_scope: Références des produits, parties, catalogues, accords, lieux et services utilisées par les areas
                Supply.
              flow_approach: Recevoir les évolutions des maîtres externes et rendre consultable une référence commune au domaine,
                avec une origine connue et une autorité locale explicite.
              synthesis:
              - EDM Council éclaire la responsabilité et la reconnaissance de l’autorité ; Oracle éclaire le contexte de référence
                donné aux opérations. Le terme Authoritative Data Domain est attesté dans les deux familles documentaires,
                avec des portées différentes.
              - Pour FLOW, l’utilité recherchée est de savoir quelles références utiliser dans le domaine. La nature des données
                ne suffit pas à tracer cette frontière ; les commandes, les stocks courants et les engagements individuels
                restent portés par leurs areas.
              - 'Le choix d’une Area Authoritative Data est propre à FLOW : il exprime une responsabilité de référence et
                ses capacités, sans fusionner les six référentiels ni reprendre une taxonomie de gouvernance comme hiérarchie
                métier.'
              examples:
              - title: Illustration FLOW — une référence produit commune à la Supply
                situation: Le maître produit d’entreprise fournit une unité de conditionnement. Les commandes et la préparation
                  doivent utiliser la référence applicable dans le domaine.
                outcome: Le référentiel Supply porte la référence locale consommée par ces areas et conserve son lien avec
                  la source d’entreprise.
                lesson: Porter la référence locale et maîtriser le produit à l’échelle de l’entreprise sont deux responsabilités
                  distinctes. Les règles de prise en compte des changements restent à préciser.
                source_title: ORA Information Management — Consolidated Hub ; illustration FLOW construite
                source_url: https://www.oracle.com/technetwork/topics/entarch/oracle-ra-info-mgmt-r3-1-1980395.pdf
            finality: Permettre aux activités de Supply Chain Orchestration de s’appuyer sur les mêmes références pour savoir
              de quel produit on parle, avec quel partenaire, dans quel lieu et sous quelles conditions.
            definition: Mettre à disposition les références qui font foi pour les décisions et opérations de Supply Chain
              Orchestration. Authoritative Data porte la source de vérité locale du domaine pour les produits, les personnes,
              les offres, les accords, les lieux et les services, en articulation avec les sources de vérité d’entreprise
              externes.
            scope: |-
              Six référentiels composent ce périmètre : [Product Reference](model:D08), [Party / Role](model:D09), [Catalog](model:D12), [Agreement](model:D11), [Fulfillment Network](model:D13) et [Service Catalog](model:D14). Ils restent distincts au sein de cette Area. Chacun dispose d’une ingestion des évolutions reçues et d’une capacité Visibility pour rechercher, consulter et comprendre la référence locale disponible. Les références organisent la lecture de ces capacités par sujet ; elles ne créent pas un niveau d’Area supplémentaire.

              Les [commandes](glossary:TER012), le [stock](glossary:TER005) courant, les engagements pris pour une commande et les résultats d’exécution restent portés par leurs activités respectives. Un délai de service configuré fait référence ; la promesse faite pour une commande et le délai réellement constaté sont des informations différentes.
            mastership: 'Les sources de vérité de l’entreprise restent en dehors de Supply Chain Orchestration. Les référentiels
              Supply reçoivent leurs données, en conservent l’origine et portent la référence locale utilisée dans le domaine.
              Cette autorité locale ne leur transfère pas l’administration des données maîtresses d’entreprise. Porter une
              valeur de référence ne signifie pas la décider : le rattachement de paramètres comme les seuils de réassort
              reste à préciser.'
            examples:
            - title: Un même conditionnement pour interpréter les commandes
              situation: Dans cet exemple illustratif, une référence produit précise qu’un carton contient six pièces. Une
                commande de deux cartons doit donc être comprise comme portant sur douze pièces.
              outcome: Authoritative Data porte la référence de conditionnement issue du maître produit externe. Les activités
                Supply peuvent s’y référer pour interpréter la quantité commandée et organiser sa satisfaction.
              lesson: Le référentiel indique ce qu’est le produit et comment ses unités se correspondent. Il ne constate pas
                le stock disponible et ne décide pas de la quantité à fournir.
        universe-supply:
          id: universe-supply
          kind: domain
          fields:
            name: Supply Chain Orchestration
            definition: 'Décider quels produits fournir, en quelle quantité, depuis quel lieu et à quelle date, puis coordonner
              les prestations nécessaires jusqu’à leur réalisation. La [Supply Chain](glossary:TER084), ou chaîne d’approvisionnement,
              relie les fournisseurs, les entrepôts, les transporteurs, les magasins et les clients. Ce domaine en assure
              l’[orchestration](glossary:TER031) : il suit les [commandes](glossary:TER012) et les [stocks](glossary:TER005),
              établit les engagements et adapte les choix lorsque la situation change.'
            market_comparisons:
            - vendor: Zacharia, Sanders et Nix
              product: Recherche — Journal of Business Logistics
              element_name: The Emerging Role of the Third-Party Logistics Provider (3PL) as an Orchestrator
              element_type: Article scientifique
              relationship: Appui sémantique et recouvrement partiel
              similarities: L’orchestration coordonne un réseau de partenaires et facilite leur coopération par le partage
                de l’information.
              differences: L’article étudie le rôle d’un prestataire logistique coordonnant plusieurs entreprises. FLOW décrit
                des responsabilités métier sans imposer ce prestataire ni cette organisation.
              flow_position: La finalité de coordination éclaire notre choix de vocabulaire ; le périmètre FLOW reste défini
                par ses responsabilités propres.
              term_choice: Orchestrator atteste un usage scientifique de la notion d’orchestration, distinct d’un nom de logiciel.
              definition_choice: Décrire les responsabilités et leur coopération sans présupposer l’acteur qui les réalisera.
              concept_name: Orchestrator
              scope_summary: Un prestataire logistique coordonne plusieurs entreprises.
              approach_summary: Partager l’information et organiser la coopération entre partenaires. L’article étudie un
                rôle d’acteur.
              source_title: The Emerging Role of the Third-Party Logistics Provider (3PL) as an Orchestrator
              source_url: https://bpb-us-w2.wpmucdn.com/wordpress.lehigh.edu/dist/e/653/files/2018/01/Zacharia-JBL-3PL-Orchestrator-Role-2011-27dqkbl.pdf
              status: proposed
              evidence_limits: Entretiens dans un seul prestataire spécialisé transport. Cet appui ne définit pas un consensus
