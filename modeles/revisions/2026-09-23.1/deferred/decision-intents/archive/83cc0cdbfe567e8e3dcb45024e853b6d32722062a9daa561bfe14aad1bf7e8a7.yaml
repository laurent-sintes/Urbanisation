            relationship: Recouvrement partiel
            similarities: Réassort intégré au cycle saisonnier.
            differences: Le produit inclut aussi allocation initiale et fin de saison, hors du seul terme Réassort.
            flow_position: Alimenter les stocks magasin au fil des ventes selon les seuils retenus. Réassort conserve ce sens
