              source_url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/26b/fauco/overview-of-supply-orchestration.html
              status: proposed
              evidence_limits: Passage primaire consulté ; rapprochement limité au périmètre décrit, sans équivalence de catalogue,
                choix de solution ni réalisation Beaumanoir déduite.
              concept_name: Supply Chain Orchestration
              scope_summary: Coordonner les approvisionnements et leurs changements en réponse aux demandes.
              approach_summary: Faire coopérer plusieurs applications pour satisfaire les demandes.
            examples:
            - title: Livrer 100 tee-shirts à un magasin vendredi
              situation: Le magasin attend 100 tee-shirts pour vendredi. Un entrepôt en détient 60 et un fournisseur doit
                en livrer 40 jeudi.
              outcome: La Supply vérifie si les 100 peuvent être livrés à temps, établit la quantité et la date promises,
                puis coordonne préparation et transport. Si les 40 sont retardés, elle examine les alternatives et les conséquences
                sur la commande.
              lesson: La Supply organise et suit la satisfaction de la demande ; les exécutants réalisent les opérations physiques.
                La promesse ne réserve pas implicitement le stock.
            - title: Recevoir une nouvelle référence produit
              situation: Une nouvelle variante de tee-shirt, bleu taille M, est créée dans l’application qui fait autorité
                sur les produits.
              outcome: Son identifiant et ses caractéristiques utiles sont reçus dans [Product Reference](glossary:TER052).
                La Supply peut alors utiliser cette référence dans ses commandes et ses stocks.
              lesson: La projection sert aux opérations Supply. La création et les corrections de la référence restent dans
                la source de vérité externe.
            finality: Organiser l’approvisionnement, la répartition et la livraison des produits pour tenir les quantités
              et les dates promises.
            scope: |-
              Les applications externes restent les sources de vérité des référentiels : c’est là que leurs données sont créées, modifiées ou supprimées. La Supply en reçoit des projections, c’est-à-dire les références utiles à ses opérations, par [Reference Ingestion](glossary:TER050). Elle ne les administre pas à leur place.

              Le périmètre se concentre ainsi sur l’orchestration : commandes, stocks, promesses, optimisation et coordination des services. Les exécutants préparent, transportent et remettent les produits ; la Supply reçoit leurs faits de réalisation pour suivre les engagements et traiter les écarts.
            market_inspiration:
              choice: 'Nous appelons ce domaine Supply Chain Orchestration parce qu’il organise comment satisfaire les demandes
                : quelles quantités fournir, depuis où, à quelle date et avec quels moyens. Il coordonne les [commandes](glossary:TER012),
                les [stocks](glossary:TER005), les engagements et les prestations, tandis que les applications de référence
                gèrent les données produit et partenaires, et que les entrepôts et transporteurs réalisent les opérations
                physiques.'
              flow_scope: Commandes, stocks, engagements, optimisation et coordination de la réalisation.
              flow_approach: Décrire les responsabilités métier et leur coopération, indépendamment des outils.
              synthesis:
              - CSCMP et Microsoft utilisent un nom large, pour une discipline et une suite logicielle respectivement. Notre
                périmètre est plus ciblé, notamment parce que la gestion des données de référence et la réalisation physique
                restent chez les responsables concernés.
              - 'La recherche et SCOR éclairent la coopération entre acteurs, avec des angles différents : rôle du prestataire
                pour l’article, stratégie et organisation de la chaîne pour SCOR. FLOW décrit les responsabilités à assurer
                sans imposer cette organisation.'
              - Oracle utilise exactement notre nom, avec d’autres frontières. Son module coopère avec des applications distinctes
                pour les commandes, les stocks et les promesses ; notre domaine réunit aussi ces responsabilités.
              examples:
              - title: 75 pièces livrables sur les 100 attendues
                situation: Un fournisseur ne peut livrer que 75 pièces sur les 100 attendues.
                outcome: Oracle décrit une orchestration qui recherche une autre source pour les 25 manquantes et, si elle
                  n’en trouve pas, signale l’écart au responsable de la commande.
                lesson: Dans FLOW, ce cas permet d’expliquer comment relier les approvisionnements attendus, les solutions
                  alternatives et les conséquences sur la quantité ou la date promises. La préparation et le transport sont
                  ensuite réalisés par les exécutants.
                source_title: Oracle — Overview of Supply Chain Orchestration, exemple de réduction de 100 à 75 unités (26B)
                source_url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/26b/fauco/overview-of-supply-orchestration.html
      principles:
      - id: PRINCIPLE-REFERENCE-PROJECTIONS
        statement: 'Les référentiels de la Supply sont des projections de sources de vérité maîtrisées par des produits tiers.
          Chaque référentiel comporte au moins une ingestion ; visibilité et recherche sont en lecture seule. L’ingestion
          actualise la projection sans transférer la maîtrise ; administration et validation métier des données maîtresses
          restent externes. Cette règle ne préjuge pas de l’autorité sur les commandes ni des états transactionnels propres
          à la Supply. U479 : ces référentiels portent et gèrent la source de vérité locale de Supply Chain Orchestration
          ; l’origine externe des données n’exclut pas leur autorité dans ce domaine.'
      - id: PRINCIPLE-CAPABILITY
        statement: Une capacité décrit ce que sait faire l’entreprise indépendamment de son organisation et de ses outils.
      - id: PRINCIPLE-SUPPLY-DOCUMENTS
        statement: Supply porte les Orders selon leur intention métier, les parties, les engagements et le résultat attendu.
          Les documents d’autorisation contribuent à leur traitement sans dicter le découpage des responsabilités. Les parcours
          transverses articulent les responsabilités des areas par leurs interactions explicites, sans constituer une couche
          processus.
      - id: PRINCIPLE-FLOW-LOGISTICS
        statement: Logistique hors développement FLOW, en adhérence ; autonomie C-Log conservée.
      - id: PRINCIPLE-ORDER-AGREEMENT
        statement: Commandes distinctes des Agreements de référence.
      - id: PRINCIPLE-CASE-SUPPLY-ORDERS
        statement: Un Case est un dossier de traitement d’une demande ou d’un problème ; cette notion ne présume aucun domaine
          de rattachement. Supply pilote ses Orders, pour toutes natures de commandes, clients et volumes. Les Service Orders
          portent les prestations confiées au contexte Services exécutant. Les modèles gardent leurs définitions propres et
          des contrats explicites, sans cardinalité ni cycle universel imposé.
      - id: PRINCIPLE-TO-PROMISE
        statement: 'D15 distingue ATP, CTP et PTP : ATP établit les possibilités dans la situation de référence ; CTP détermine
          la faisabilité après adaptation en mobilisant les décisions spécialisées ; PTP porte l’arbitrage économique des
          scénarios. Les priorités, l’échéancier, les politiques de stock et les services conservent leurs responsables d’arbitrage.
          Le CTP local reste plus large que les acceptions éditeur consultées, sans séquence universelle ni application automatique
          des adaptations.'
      - id: PRINCIPLE-EXECUTION-ORCHESTRATION
        statement: Le référentiel des services porte l’offre et les SLA configurés ; D06 décrit la capacité contextuelle et
          orchestre l’exécution, son tracking et son adaptation. D15 utilise D06 pour la promesse Supply et son réexamen ;
          les exécutants gardent leurs opérations internes. Un SLA compatible n’empêche pas un échec opérationnel. La latitude
          d’adaptation relève des règles de fonctionnement sans impact sur le catalogue des capacités.
      - id: PRINCIPLE-EXECUTION-DECISION-AND-COORDINATION
        statement: La visibilité sur la capacité rend accessibles les informations communiquées par les exécutants. La décision
          de besoins détermine les prestations nécessaires ; Backing Service Orders tient les demandes et leur cycle. Orchestration
          coordonne les prestations et leurs dépendances ; Adaptation Decision détermine les variations du plan. D15 conserve
          la promesse Supply et les exécutants leurs opérations internes.
      - id: PRINCIPLE-CAPABILITY-BEHAVIOR
        statement: Une capacité peut être précisée par des comportements, dernier niveau de décomposition descriptive. Décrire
          factuellement les conditions prises en compte et les résultats ; aucun niveau promotionnel Advanced ATP. Les objets,
          documents et événements restent distincts.
      - id: PRINCIPLE-JUSTIFIED-BEHAVIOR
        statement: Toute décomposition en comportements est justifiée par une complexité ou un bénéfice ciblé. Mécanisme,
          politique, variante ou bénéfice différencient les façons d’agir. Les opérations produit et modalités unité/masse/interface
          ne justifient pas seules un comportement. Capacité → Comportement est terminal.
      - id: PRINCIPLE-INVENTORY-SCENARIO-APPLICATION
        statement: Inventory Planning comporte construction de scénarios alternatifs, Simulation & Analysis et adaptation
          du scénario en cours. Comparaison, autorisation et mise en action restent des fonctions utiles. L’application mobilise
          Supply Protection, les gestions d’Orders et D06 sans absorber leurs responsabilités.
      - id: PRINCIPLE-SUPPLY-ASSIGNMENT-VALUE
        statement: Supply Assignment affecte les ressources aux commandes afin de maximiser une valeur multidimensionnelle
          sous contraintes. Les critères, règles de priorité et arbitrages économiques restent explicites et mobilisent les
          décisions spécialisées ; aucune pondération universelle ni optimum garanti. Supply Assignment Plan signifie plan
          d’affectation, distinct des enveloppes de protection de groupes.
      - id: PRINCIPLE-RESERVATION-CONCURRENCY
        statement: Seule la réservation bloque les usages concurrents ; l’affectation seule ne les bloque pas.
      - id: PRINCIPLE-CAPABILITY-NATURE
        statement: Chaque capacité porte un type explicite dans fields.nature. Les icônes correspondent à ce type ; les décisions
          sont présentées après les autres capacités de chaque area, avec une séparation visuelle légère lorsque les deux
          groupes sont présents. Cet ordre de lecture ne définit ni séquence d’exécution ni hiérarchie supplémentaire.
      - id: PRINCIPLE-BEHAVIOR-NATURE
        statement: Chaque comportement porte une forme principale explicite dans fields.nature, parmi les formes propres aux
          comportements de MOD006. Cette forme pilote son icône ; elle n’interdit pas des dimensions complémentaires et ne
          crée ni niveau supplémentaire ni comportement supplémentaire.
      - id: PRINCIPLE-DOMAIN-INTERACTIONS
        statement: Le modèle métier se structure par domaines, areas et capacités en interaction, sans couches transactionnelle/processus.
          Les processus décrivent des progressions pouvant traverser ces responsabilités. Les interactions explicitent intentions,
          demandes, engagements, informations, résultats et faits, avec leurs conditions et effets. L’exemple Commerce, Supply
          et logistique n’impose ni nouveaux niveaux ni rattachements. Les marqueurs historiques layer sont ignorés pour la
          lecture métier des anciennes publications ; ils sont absents des données courantes.
      - id: PRINCIPLE-ATLAS-BUSINESS-SCOPE
        statement: 'Atlas explicite le métier : domaines, areas, capacités, comportements, responsabilités, interactions,
          objets, structures conceptuelles d’information, documents, faits et règles. Les références comparatives au marché
          sont visibles : points communs, différences, positionnement FLOW, appuis méthodologiques ou produits et sources
          primaires externes. Elles ne constituent ni un catalogue d’applications, ni un schéma technique, ni un choix ou
          une preuve de réalisation installée. Une absence de comparaison signifie non documenté, jamais innovation ou conformité
          présumée. Réserves internes, statuts de revue et liens vers le backlog restent internes.'
      - id: PRINCIPLE-MANAGEMENT-FACT-DOCUMENT
        statement: Tout fait de gestion est associé à un document métier identifié. Ce document peut être un enregistrement
          structuré, sans fichier PDF. Objet métier, document et fait restent distincts ; cette convention ne fixe ni nombre
          exact de documents, ni règles de version ou de correction, ni responsabilité d’autorisation.
      - id: PRINCIPLE-SUPPLY-FIRST
        statement: Le périmètre actuellement travaillé est Supply Chain Orchestration. Le commerce sera étudié après la Supply
          Chain ; aucun domaine Commerce n’est créé par anticipation.
