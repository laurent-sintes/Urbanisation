          - vendor: CNCF
            product: CloudEvents
            element_name: Event / Occurrence
            concept_name: Event / Occurrence
            element_type: Notion ou usage documenté
            relationship: Rapprochement de sens
            scope_summary: Fait signalé et contexte transmis.
            approach_summary: Décrire le fait dans un format commun.
            similarities: Plusieurs messages peuvent représenter un même fait.
            differences: La représentation technique ne définit pas le sens métier du fait FLOW.
            flow_position: FLOW ne prescrit pas son format pour définir le terme.
            source_title: CloudEvents Specification
            source_url: https://github.com/cloudevents/spec/blob/v1.0.2/cloudevents/spec.md
            evidence_limits: Spécification d’interopérabilité des messages ; ni contrat métier exhaustif ni protocole imposé
