            les intervenants, suivre leur avancement et adapter la suite en cas d’écart.'
          context: 'Exemple Supply : demander la préparation de 100 tee-shirts, coordonner leur transport puis suivre leur
            remise au magasin. L’orchestration s’appuie sur les faits transmis par les exécutants ; elle ne réalise pas elle-même
            la préparation ou le transport.'
