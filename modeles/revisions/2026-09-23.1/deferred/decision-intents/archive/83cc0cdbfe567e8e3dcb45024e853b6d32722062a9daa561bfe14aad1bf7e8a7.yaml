      target:
        id: D12.b
        kind: capability
        fields:
          name: Catalog Visibility
          definition: Retrouver un catalogue et consulter les offres, produits et conditions commerciales enregistrées pour
            comprendre ce qui est proposé et dans quel périmètre.
          finality: Partager la connaissance de l’offre de référence utilisée par les accords et demandes Supply.
          scope: |-
            Rechercher un catalogue et parcourir son contenu ; consulter ses références produit, conditions commerciales et critères d’applicabilité reçus, notamment périodes, clientèles ou zones lorsqu’ils sont renseignés. La même référence produit peut figurer dans plusieurs catalogues.

            La consultation ne crée pas le produit, ne compose pas l’offre, ne calcule pas un prix contextualisé et ne choisit pas l’offre à appliquer à une commande. L’administration commerciale des catalogues demeure externe au domaine.

            Exemple fictif : consulter deux catalogues contenant le même produit et lire leurs périodes et clientèles de référence, sans décider lequel appliquer.
          nature: knowledge
          market_comparisons:
          - vendor: Microsoft
            product: Dynamics 365 Commerce
            source_title: Create Commerce catalogs for B2B sites
            source_url: https://learn.microsoft.com/en-us/dynamics365/commerce/catalogs-b2b-sites
            evidence_limits: Texte primaire relu ; consultation seule retenue, pas administration commerciale ni ouverture
              du chantier Domain Commerce.
            element_name: B2B catalogs / Searchable attributes
            concept_name: B2B catalogs / Searchable attributes
            element_type: Fonction documentée par la source primaire
            scope_summary: Contenu et attributs visibles, recherchables et filtrables.
            approach_summary: Organiser les informations utiles à la consultation de l’offre.
            similarities: Même besoin de comprendre les produits proposés et leur périmètre.
            differences: Microsoft configure et publie le catalogue commercial ; FLOW en reçoit la référence.
            relationship: Recouvrement partiel
            flow_position: Rendre lisibles les offres et leurs conditions de référence. Catalog Visibility permet de retrouver
              un catalogue et d’en comprendre le contenu et l’applicabilité renseignée.
            status: proposed
          - vendor: Microsoft
            product: Dynamics 365 Commerce
            source_title: Catalog picker module
            source_url: https://learn.microsoft.com/en-us/dynamics365/commerce/catalog-picker
            evidence_limits: Texte primaire consulté. Illustration de consultation ; ne prescrit pas une interface ni une
              capacité par composant. Deux documents Microsoft ne prouvent pas un consensus interéditeurs.
            element_name: Catalog picker
            concept_name: Catalog picker
            element_type: Fonction documentée par la source primaire
            scope_summary: Liste des catalogues accessibles dans un site B2B.
            approach_summary: Parcourir les catalogues puis accéder à leur contenu.
            similarities: Plusieurs catalogues peuvent être retrouvés et distingués.
            differences: Composant d’interface commerciale, sans équivalence de capacité ni prescription de portail FLOW.
            relationship: Recouvrement partiel
            flow_position: Rendre lisibles les offres et leurs conditions de référence. Catalog Visibility permet de retrouver
              un catalogue et d’en comprendre le contenu et l’applicabilité renseignée.
            status: proposed
          market_inspiration:
            choice: Rendre lisibles les offres et leurs conditions de référence. Catalog Visibility permet de retrouver un
              catalogue et d’en comprendre le contenu et l’applicabilité renseignée.
            flow_scope: Catalogues, offres, références produit et conditions d’applicabilité enregistrées.
            flow_approach: Rechercher et parcourir l’offre reçue, sans recalculer ni administrer ses conditions.
            synthesis:
            - 'Ces deux documents Microsoft se complètent : l’un décrit les informations consultables, l’autre l’accès à plusieurs
              catalogues. Ils ne constituent pas une preuve de consensus interéditeurs.'
            - FLOW transpose ce besoin à la référence locale utilisée par la Supply. Le rapprochement n’ouvre pas le chantier
              Commerce et ne transfère pas l’administration de l’offre au domaine.
            examples:
            - title: Illustration FLOW — Catalog Visibility
              situation: Le même produit figure dans deux catalogues reçus.
              outcome: Leurs périodes et clientèles de référence permettent de comprendre la différence.
              lesson: Lire l’applicabilité renseignée ne décide pas automatiquement du catalogue à appliquer.
              source_title: Create Commerce catalogs for B2B sites
              source_url: https://learn.microsoft.com/en-us/dynamics365/commerce/catalogs-b2b-sites
