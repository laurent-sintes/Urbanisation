        - id: TER081
          name: Split
          short_description: Scission d’une commande ou de ses éléments en parties distinctes, avec préservation de leur filiation.
          definition: Scission d’une commande ou de ses éléments en parties distinctes, avec préservation de leur filiation.
          context: Convention U362 intégrée U363 ; formulations développées éditoriales.
          notes: 'U362 : « coupe des commandes ». Ne crée pas une demande supplémentaire ; contrôler les quantités et préciser
            le devenir de l’original. Les réalisations déjà acquises sont conservées. Le nom du comportement est Order Splitting.'
          market_comparisons:
          - vendor: Microsoft
