          market_inspiration:
            choice: Nommer l’ensemble des acteurs et activités qui conduisent les produits des fournisseurs aux destinataires,
              avec leurs retours. Supply Chain est plus large que le domaine de coordination Supply Chain Orchestration de
              FLOW.
            flow_scope: Approvisionnement, transformation éventuelle, stockage, transport, distribution et retours.
            flow_approach: Lire la chaîne dans son ensemble et ses coopérations.
            synthesis:
            - Le CSCMP décrit un périmètre de management intégrant achats, transformation, logistique et partenaires. SCOR
