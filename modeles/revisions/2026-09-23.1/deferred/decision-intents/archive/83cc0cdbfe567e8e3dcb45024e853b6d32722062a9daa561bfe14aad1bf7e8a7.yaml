          market_inspiration:
            choice: Prévenir un destinataire de ce qui vient de se produire lui permet de réagir avec les bonnes références.
              Notification d’événement désigne ce message, distinct du fait lui-même.
            flow_scope: Message qui signale un fait à un destinataire.
            flow_approach: Transmettre le contexte utile sans confondre informer et demander une action.
            synthesis:
            - Fowler distingue la notification d’événement d’une demande d’action déguisée ; le message peut ne contenir que
              les références utiles pour consulter les détails. CloudEvents distingue le fait capté par un système de sa représentation
              transmise et admet plusieurs événements pour ce même fait.
            - Le premier explique l’intention du message ; le second facilite son échange entre systèmes. FLOW retient l’intention
              métier et les références nécessaires, sans prescrire de format, de protocole ou de mode de conservation.
            examples:
