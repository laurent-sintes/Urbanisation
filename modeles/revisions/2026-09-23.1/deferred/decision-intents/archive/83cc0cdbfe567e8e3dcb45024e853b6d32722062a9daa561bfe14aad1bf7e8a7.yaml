              pour FLOW, distinct de la mise en place initiale et de la seule sortie de réserve vers le rayon.
            flow_scope: Apports continus aux stocks magasin.
            flow_approach: Calculer le besoin selon les règles métier applicables.
            synthesis:
            - SAP In-Season Fill-In vise les apports après les premières ventes. RELEX In-season replenishment les inscrit
              dans un cycle comprenant aussi présaison et fin de saison. Les deux sont proches du réassort, avec des méthodes
