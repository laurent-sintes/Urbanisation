          notes: 'U260 accepte le principe d’une couverture explicative des quantités/dates ; le niveau d’identification des
            ressources et le choix final restent à préciser. Ce calcul ne prouve pas une affectation ou une promesse confirmée.
            SAP aATP est un ensemble de fonctions plus large, et non un synonyme de cette seule capacité. Synthèse proposée
            et sources : marche/atp-aatp-couverture.md, CMP087 ; APICS CPIM 2019 et documentation Microsoft/SAP consultés
            le 16 septembre 2026. U264 : synthèse alignée sur la capacité et les quatre comportements d’ATP ; terminologie
            factuelle, pas de niveau marketing Advanced ATP.'
          previous_definition: Quantité non engagée disponible pour soutenir une promesse à un horizon donné, dans le périmètre
            et selon les règles considérés. Son calcul et son contrôle contribuent à évaluer une possibilité de fourniture.
          previous_notes_U260: Actualisé selon le modèle courant ; formulation détaillée proposée et périmètre local, pas
            une définition éditeur universelle.
          previous_definition_U264: Établir les quantités et dates proposées pour honorer une commande avec les stocks et
            engagements admissibles, en appliquant les protections et règles existantes, sans modifier ces engagements ou
            politiques.
