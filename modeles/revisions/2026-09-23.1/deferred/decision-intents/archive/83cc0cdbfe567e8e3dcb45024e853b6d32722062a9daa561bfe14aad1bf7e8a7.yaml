              situation: Dix pièces étaient demandées ; sept ont été servies et les trois restantes ne sont plus voulues.
              outcome: L’annulation porte sur les trois encore attendues.
              lesson: Les sept réalisées restent connues ; leur éventuel retour relève d’un autre traitement.
