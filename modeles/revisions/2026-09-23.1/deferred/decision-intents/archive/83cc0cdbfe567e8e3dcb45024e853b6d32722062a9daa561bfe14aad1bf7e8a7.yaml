            concept_name: Delivery schedule / Delivery line
            scope_summary: Quantité d’une ligne répartie en plusieurs livraisons.
            approach_summary: Conserver la ligne commerciale comme origine.
          - vendor: Oracle
            product: Fusion Cloud Global Order Promising
            source_title: Overview of Global Order Promising
            source_url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/25c/fascp/overview-of-global-order-promising.html
            evidence_limits: Document primaire consulté ; rapprochement de concepts, sans preuve de réalisation Beaumanoir.
            element_name: Split order line
            element_type: Concept documenté par la source primaire
            relationship: Recouvrement partiel
            similarities: Satisfaction d’une ligne en plusieurs parties.
            differences: Le produit combine décision de promesse et scission ; FLOW distingue ces responsabilités.
            flow_position: Couper une commande ou certains de ses éléments en parties identifiables. Split conserve leur filiation
              ; il ne signifie pas répartir un stock entre des commandes déjà distinctes.
            status: proposed
            concept_name: Split order line
            scope_summary: Satisfaction d’une ligne en plusieurs parties.
            approach_summary: Limiter le retard par produit ou date selon les règles.
          market_inspiration:
            choice: Couper une commande ou certains de ses éléments en parties identifiables. Split conserve leur filiation
              ; il ne signifie pas répartir un stock entre des commandes déjà distinctes.
            flow_scope: Scission de commandes, lignes ou livraisons selon le contexte.
            flow_approach: Préserver origine, quantités et réalisations acquises.
            synthesis:
            - Microsoft Delivery schedules divise une ligne commerciale en lignes de livraison. Oracle Global Order Promising
              peut scinder la satisfaction d’une ligne pour limiter le retard. Les deux utilisent une scission, à des moments
              et avec des finalités différents.
            - FLOW retient ce sens de découpage sans supposer que chaque split crée plusieurs commandes autonomes. Il le distingue
              de Spread, qui répartit des ressources entre des demandes.
            examples:
            - title: Exemple Microsoft — 600 chaises en six livraisons
              situation: Microsoft décrit 600 chaises livrées par lots de 100 pendant six mois.
              outcome: Six lignes de livraison restent rattachées à la ligne commerciale.
              lesson: Le split conserve la filiation et ne multiplie pas le besoin total.
              source_title: Delivery schedules
              source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/sales-marketing/delivery-schedules
