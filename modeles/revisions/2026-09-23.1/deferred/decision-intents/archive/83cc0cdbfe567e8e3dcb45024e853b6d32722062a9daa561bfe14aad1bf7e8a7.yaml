            flow_scope: Problèmes, notions et responsabilités qui gagnent à être compris ensemble.
            flow_approach: Justifier le regroupement par le métier et préciser ses relations avec les autres domaines.
            synthesis:
            - Evans emploie domain pour le champ de connaissance ou d’activité auquel s’applique le modèle. Fowler explique
              ensuite pourquoi un même vocabulaire peut prendre des sens différents dans plusieurs contextes. Les deux invitent
              à regarder le sens des problèmes avant leur représentation.
            - FLOW retient le domaine comme périmètre de cohérence métier. Il ne le confond pas avec le bounded context de
              DDD, qui délimite un modèle utilisé pour concevoir du logiciel ; les frontières applicatives ne sont pas arrêtées
              par ce terme.
            examples:
            - title: Fowler — les différents sens du compteur
              situation: Dans son exemple d’un fournisseur d’électricité, « compteur » peut désigner l’équipement ou une relation
                du réseau avec un lieu ou un client.
              outcome: Le vocabulaire doit être précisé pour éviter des modèles contradictoires.
              lesson: L’illustration aide FLOW à expliciter les problèmes et notions de chaque domaine ; elle ne prescrit
                pas ses frontières.
              source_title: Bounded Context
              source_url: https://martinfowler.com/bliki/BoundedContext.html
        - id: TER031
