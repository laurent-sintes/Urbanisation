            concept_name: Order processing and fulfillment
            scope_summary: Activités allant du traitement de commande au produit arrivé à destination.
            approach_summary: Organiser et réaliser préparation, emballage et expédition.
          market_inspiration:
            choice: Parler de la satisfaction effective d’une commande, depuis son organisation jusqu’à sa réalisation. Fulfillment
              ne se réduit ni à calculer une promesse ni à réserver un stock.
            flow_scope: Activités qui organisent et réalisent le résultat attendu.
            flow_approach: Préciser la commande et son résultat ; distinguer choix, engagement et exécution.
            synthesis:
            - Microsoft décrit le fulfillment en magasin ; ASCM l’inscrit dans la chaîne des activités logistiques jusqu’à
              destination. Les deux incluent une réalisation physique, avec une maille opérationnelle pour l’un et plus générale
              pour l’autre.
            - FLOW conserve un sens large, à préciser selon le résultat de chaque commande. Ce terme ne crée pas une nouvelle
              capacité qui absorberait les responsabilités déjà distinguées.
            examples:
            - title: Illustration FLOW — Du choix du stock à la remise
              situation: Une commande est affectée à un magasin, préparée puis remise au client.
              outcome: Le résultat attendu est accompli lorsque les conditions de service sont réalisées.
              lesson: La sélection du magasin prépare la satisfaction ; elle n’en est pas la preuve.
              source_title: Store order fulfillment
              source_url: https://learn.microsoft.com/en-us/dynamics365/commerce/order-fulfillment-overview
        - id: TER086
          name: Purchase Order Document
          short_description: 'Bon de commande : document exprimant le contenu d’une commande d’achat à un moment donné.'
          definition: 'Bon de commande : document exprimant le contenu d’une commande d’achat à un moment donné. Le document,
            la commande métier et la capacité qui la prend en charge sont des notions distinctes.'
          context: Se rapporte à l’objet [Purchase Order](glossary:TER070), pris en charge par la capacité [Purchase Order](model:D04.j).
            Le document ne désigne pas toute l’activité d’achat.
          notes: 'Ajout lexical proposé pour U458, sans création de nœud documentaire, cardinalité ou règle de correction.
            Usage français « bon de commande » vérifié dans Microsoft Learn, Vue d’ensemble des approvisionnements, section
            Accusé de réception de marchandises et facture : https://learn.microsoft.com/fr-fr/dynamics365/supply-chain/procurement/procurement-sourcing-overview
            (consulté le 19 septembre 2026). Distinction conceptuelle document/objet/capacité issue de U61/U384 ; la terminologie
            Microsoft n’impose pas cette convention FLOW.'
          market_comparisons:
          - vendor: OASIS
            product: Universal Business Language
            source_title: Universal Business Language Version 2.4
            source_url: https://docs.oasis-open.org/ubl/UBL-2.4.html
            evidence_limits: Standard d’échange documentaire ; ne normalise ni toutes les responsabilités FLOW ni les termes
              français locaux.
            element_name: Order document
            element_type: Concept et usage documentés
            relationship: Recouvrement partiel
            similarities: Order est explicitement un document échangé.
            differences: Le format UBL ne prescrit pas la séparation conceptuelle objet/capacité choisie par FLOW.
            flow_position: Identifier la version représentée sans assimiler le document au cycle de vie complet de la commande.
