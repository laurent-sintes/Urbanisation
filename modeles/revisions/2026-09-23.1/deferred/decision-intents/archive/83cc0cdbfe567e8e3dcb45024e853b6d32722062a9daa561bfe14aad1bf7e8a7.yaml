            source_title: Archive documents
            source_url: https://learn.microsoft.com/en-us/dynamics365/business-central/across-how-to-archive-documents
            evidence_limits: Documentation primaire consultée ; périmètre du produit, sans preuve de déploiement Beaumanoir.
            element_name: Document archive
            element_type: Concept et usage documentés
            relationship: Recouvrement partiel
            similarities: Les documents d’achat peuvent conserver plusieurs versions.
            differences: La restauration dépend du produit ; tout document n’est pas une commande réactivable.
            flow_position: Identifier la version représentée sans assimiler le document au cycle de vie complet de la commande.
            status: proposed
            concept_name: Document archive
            scope_summary: Versions des documents de vente et d’achat.
            approach_summary: Conserver, consulter et parfois restaurer une version.
          market_inspiration:
            choice: Nommer le bon qui représente la commande d’achat à un moment donné. Purchase Order Document distingue
              ce support, la commande suivie et la capacité qui la gère.
            flow_scope: Représentation datée du contenu d’une commande d’achat.
            flow_approach: Identifier la version représentée sans assimiler le document au cycle de vie complet de la commande.
            synthesis:
            - OASIS décrit ce qu’un document Order transmet ; Business Central montre que ses versions peuvent être conservées.
              Les deux éclairent la représentation d’un contenu, avec des objectifs différents.
            - FLOW emploie Purchase Order Document pour lever l’ambiguïté du bon de commande. Un document émis hier peut rester
              une preuve sans représenter le contenu actuellement applicable.
            examples:
            - title: Illustration FLOW — Deux bons, une commande
              situation: Un bon initial prévoit vendredi ; une version ultérieure porte lundi après changement accepté.
              outcome: Les deux documents peuvent expliquer l’histoire d’une même commande.
              lesson: Le nombre de versions ne doit pas être pris pour le nombre d’achats.
