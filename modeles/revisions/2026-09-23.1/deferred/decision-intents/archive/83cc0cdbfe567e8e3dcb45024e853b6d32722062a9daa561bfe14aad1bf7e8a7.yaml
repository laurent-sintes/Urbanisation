            similarities: Ressources examinées pour satisfaire une demande.
            differences: L’existence d’une ressource ne garantit pas une promesse réalisable.
            flow_position: Nommer les ressources présentes ou attendues qui peuvent répondre à une demande. Supply, dans ce
