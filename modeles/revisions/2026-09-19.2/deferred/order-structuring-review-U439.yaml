unresolved_conditions:
- topic: Besoins et types d’Orders
  question: Quels parcours doivent réellement regrouper ou fusionner, et pour quelle valeur métier ?
  priority: Avant adoption du périmètre
- topic: Identités et quantités
  question: Nouvel Order ou Order cible existant ; fusion partielle ; devenir des sources et des quantités déjà satisfaites
    ?
  priority: Avant implémentation
- topic: Compatibilité et engagements
  question: Quelles conditions identiques ou compatibles concernant parties, articles, destination, échéances, contrat, propriété,
    prix et monnaie ?
  priority: Avant implémentation ; ces critères ne sont pas adoptés
- topic: Droits et états
  question: Qui autorise la mutation et à quels états, avec quel traitement des gels, réservations et réalisations partielles
    ?
  priority: Avant implémentation
- topic: Effets et liens
  question: Comment préserver ou réviser explicitement promesses, affectations, réservations, exécution et filiation sans
    double demande ?
  priority: Avant implémentation
- topic: Ensembles
  question: Quelles conditions communes, possibilités de chevauchement et modalités de retrait sont utiles ?
  priority: Avant implémentation
