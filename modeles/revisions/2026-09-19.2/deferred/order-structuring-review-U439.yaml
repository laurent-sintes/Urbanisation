existing_behavior_reference:
  id: BHV044
  name: Order Splitting
  status: existing
  plain_explanation: Une demande devient plusieurs parties traitables distinctement, avec filiation et conservation des quantités.
  example: 100 unités deviennent deux parties de 60 et 40 ; pas nécessairement deux commandes commerciales autonomes.
  change: Aucune modification ni duplication du comportement dans cette annexe.
parent_wording_proposal:
  id: D04.n
  status: proposed
  definition: Organiser les Orders et leurs éléments en les séparant, en les reliant dans un ensemble ou en réunissant des
    demandes compatibles, tout en conservant leur origine, leurs quantités et leurs engagements.
  decomposition_rationale: Trois effets métier distincts justifient le découpage proposé. Split rend des parties traitables
    séparément ; Grouping maintient plusieurs demandes avec des conditions communes ; Merging remplace plusieurs demandes
    par une demande active unique. Chacun décrit un mécanisme et son effet, sans comportement par bouton ni sous-comportement.
  naming_position: Conserver Order Structuring est défendable si Grouping et Merging correspondent à des besoins retenus.
    Order Splitting reste le nom précis si la capacité est finalement limitée au split.
naming_review:
- name: Order Grouping
  status: proposed
  basis: Grouping est attesté pour des besoins SAP et des lignes Oracle. La portée persistante entre plusieurs Orders reste
    une proposition FLOW ; aucun consensus universel de nom ou de périmètre n’est affirmé.
  ambiguity: Order Consolidation seul peut désigner une livraison, une facture ou une fusion.
- name: Order Merging
  status: proposed
  basis: Merging est un verbe marché, notamment en planification SAP. Infor nomme Commingling la fusion de Purchase Orders.
    Order Merging est proposé pour sa lisibilité sans présenter ce nom générique comme un standard de capacité.
  ambiguity: Une consolidation logistique ou un Group by de Planned Orders ne prouve pas la fusion de commandes transactionnelles.
proposed_nodes:
- id: BHV086
  revision: 1
  kind: behavior
  layer: transactional
  fields:
    name: Order Grouping
    definition: Relier des Orders ou leurs éléments dans un ensemble à traiter selon des conditions communes, tout en conservant
      chaque demande distincte.
    finality: Suivre et respecter une attente d’ensemble sans confondre les demandes qui la composent.
    scope: |
      Proposition à instruire. Exemple fictif : deux Transfer Orders, l’un pour des vêtements et l’autre pour des accessoires d’ouverture d’un magasin, restent distincts mais sont rattachés à un ensemble avec une condition commune de disponibilité. L’ensemble ne crée pas une troisième demande et ne double pas les quantités.

      Maintenir les membres, les liens, les conditions communes et une lecture de la satisfaction de l’ensemble. Ajouter ou retirer un membre reste soumis aux engagements applicables ; ce ne sont pas des comportements supplémentaires. Aucun Order chapeau ni nouveau type d’objet n’est imposé.

      Order Structuring matérialise le regroupement autorisé. Les décisions conservent le choix des dates, ressources et priorités ; Order Lifecycle Management conserve les transitions et Order Release l’autorisation de lancement. Le regroupement ne réserve pas les ressources : seule la réservation bloque les usages concurrents. Les gels et protections applicables demeurent.

      Groupe de calcul ponctuel, consolidation d’expéditions et fusion de demandes restent distincts. Types d’Orders compatibles, chevauchements de groupes, droits de modification, sortie d’un membre et effets sur les engagements restent à instruire. Aucun flux installé n’est affirmé.
