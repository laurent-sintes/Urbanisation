schema_version: '1.0'
review_id: AUTHORITATIVE-DATA-U478-U479
as_of: '2026-09-19'
status: proposed
target_id: business-references
authority:
  user_sources:
  - U478
  - U479
  confirmed_scope: Les sources de vérité d’entreprise restent externes ; le périmètre des références porte et gère la source
    de vérité locale de Supply Chain Orchestration.
  not_yet_chosen: Nom final, conversion du groupe de présentation en domaine unique, rattachements et règles de gestion détaillées.
recommendation:
  name: Authoritative Data Domain
  reason: Nom attesté chez une autorité de gouvernance et un éditeur ; il exprime la responsabilité de faire référence et
    accepte un périmètre local explicite.
  definition: Fournir aux domaines de Supply Chain Orchestration les données relativement stables qui font référence pour
    leurs décisions et leurs opérations. Ce périmètre porte leur version applicable dans l’univers, en articulation avec les
    sources de vérité de l’entreprise et les responsabilités métier qui les définissent.
  boundary: Les références décrivent le contexte applicable aux opérations ; les commandes, positions de stock courantes et
    engagements individuels restent dans leurs domaines. La stabilité seule ne détermine pas le rattachement.
  tradeoff: Authoritative demande une explication en français ; Domain peut être redondant si le type est déjà affiché. Le
    mot ne signifie pas à lui seul « données stables ».
alternatives:
- name: Authoritative Data
  assessment: Forme courte du nom recommandé, lisible dans l’arbre ; la responsabilité de domaine doit apparaître dans la
    définition.
- name: Authoritative Data Source
  assessment: Exprime ce qui fait foi mais nomme une source, pas le périmètre qui la gère ; moins adapté au nom de domaine.
- name: Reference Data
  assessment: Lisible, mais risque de compréhension limitée aux codes et nomenclatures, au sens étroit retenu notamment dans
    Oracle ORA.
flow_example:
  status: proposed_illustration
  situation: Inventory Target Decision retient un seuil de réassort de 60 pièces pour un produit, un magasin et une période.
  local_reference: Le périmètre pourrait porter la valeur applicable et ses conditions de validité, pour que les consommateurs
    utilisent le même repère.
  consumer: Replenishment Decision mobilise ce repère pour décider du réassort.
  boundary: Porter le seuil ne signifie pas calculer ou choisir 60. L’inclusion et le rattachement de cette gestion de paramètre
    restent une proposition ; aucune capacité n’est déplacée.
model_shape:
  current: business-references est un groupe de présentation ; D08, D09, D11, D12, D13 et D14 restent des référentiels distincts.
  consequence: Renommer le groupe et le transformer en domaine sont deux modifications différentes. U479 clarifie l’autorité
    locale, sans décider à lui seul leur fusion ni de nouvelles capacités.
