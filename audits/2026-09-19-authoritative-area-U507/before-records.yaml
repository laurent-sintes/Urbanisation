- id: D09
  revision: 3
  kind: reference
  fields:
    name: Party / Role
    definition: Identifier les [personnes physiques et morales](glossary:TER046) auxquelles se rattachent les accords et les
      opérations Supply, et connaître les [rôles métier](glossary:TER047) qu’elles y jouent, par exemple client ou fournisseur.
      Une même personne conserve son identité lorsqu’elle intervient dans plusieurs rôles.
    finality: Savoir avec qui l’entreprise s’engage et à quel titre chaque personne participe aux échanges, sans confondre
      son identité, son rôle et les engagements d’un accord.
    mastership: external
    market_comparisons:
    - vendor: SAP
      product: S/4HANA — Financial Accounting
      source_title: Managing Business Partners
      source_url: https://learning.sap.com/courses/customizing-core-settings-in-financial-accounting-in-sap-s4hana/managing-business-partners
      source_version: Cours web ; numéro de release non affiché
      source_locator: Business Partner Categories ; Business Partner Roles ; Customer/Vendor Integration
      consulted_on: '2026-09-19'
      evidence_limits: Texte primaire consulté ; appui sélectif, sans conformité ni réalisation Beaumanoir déduite.
      element_name: Business Partner / Business Partner Role
      concept_name: Business Partner / Business Partner Role
      element_type: Concept documenté par la source primaire
      scope_summary: Une identité partagée entre plusieurs contextes métier, dont client et fournisseur.
      approach_summary: Rattacher les données propres à chaque rôle à une identité commune.
      similarities: Une même personne peut intervenir sous plusieurs rôles sans devenir plusieurs personnes.
      differences: SAP administre un maître et des données comptables ; FLOW utilise une référence locale alimentée depuis
        les maîtres externes. Les catégories SAP sont plus larges que notre périmètre juridique.
      relationship: Recouvrement partiel
      flow_position: Identifier les personnes physiques et morales et comprendre à quel titre elles interviennent dans les
        [accords](glossary:TER048) et les opérations Supply. Party / Role distingue leur identité commune des [rôles](glossary:TER047)
        qu’elles jouent, par exemple client ou fournisseur.
      status: proposed
