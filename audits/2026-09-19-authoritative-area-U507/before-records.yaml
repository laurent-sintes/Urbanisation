      differences: Composant d’interface commerciale, sans équivalence de capacité ni prescription de portail FLOW.
      relationship: Recouvrement partiel
      flow_position: Rendre lisibles les offres et leurs conditions de référence. Catalog Visibility permet de retrouver un
        catalogue et d’en comprendre le contenu et l’applicabilité renseignée.
      status: proposed
      source_refs:
      - U505
      - ELM510
      - CMP204
    market_inspiration:
