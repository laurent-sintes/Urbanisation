- id: D11.b
  revision: 1
  last_modified: '2026-09-19T17:22:35.945608Z'
  kind: capability
  fields:
    name: Agreement Visibility
    definition: Retrouver un [accord](glossary:TER048) et consulter les personnes engagées, les conditions, les périodes et
      les engagements contractuels enregistrés pour comprendre ce qu’il prévoit.
    finality: Donner aux décisions et opérations Supply une lecture partagée des accords de référence disponibles.
    scope: |-
      Rechercher un accord par numéro, partie ou attribut disponible ; lire les conditions, engagements en quantité ou valeur, dates et versions transmises, avec leur provenance. Les droits et obligations se lisent dans leur contexte contractuel.

      Cette capacité ne négocie, ne modifie ni ne renouvelle le contrat. Elle ne calcule pas sa consommation ou son reliquat, ne décide pas de son application à une commande et ne produit pas une promesse opérationnelle.

      Exemple fictif : retrouver l’accord d’Alpha et consulter la période et la quantité prévues, sans en déduire le restant à commander.
    nature: knowledge
    market_comparisons:
    - vendor: Microsoft
      product: Dynamics 365 Supply Chain Management
      source_title: Purchase agreements
      source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/procurement/purchase-agreements
      source_version: Mise à jour du 8 septembre 2026
      source_locator: Introduction ; Commitment types ; Confirmations and version history for purchase agreements
      consulted_on: '2026-09-19'
      evidence_limits: Texte primaire relu. Les calculs de consommation et reliquat décrits ailleurs sur la page ne sont pas
        repris dans Visibility.
      element_name: Purchase agreements / Version history
      concept_name: Purchase agreements / Version history
      element_type: Fonction documentée par la source primaire
      scope_summary: Accords d’achat, périodes, engagements et versions.
      approach_summary: Consulter le contrat et les versions conservées.
      similarities: Même besoin de connaître ce que prévoit l’accord.
      differences: Microsoft inclut des calculs de consommation ; FLOW les exclut de cette consultation de référence.
      relationship: Recouvrement partiel
      flow_position: Rendre les accords de référence retrouvables et compréhensibles. Agreement Visibility expose ce qui est
        convenu avant que les capacités opérationnelles l’utilisent.
      status: proposed
      source_refs:
      - U505
      - ELM426
      - CMP204
    - vendor: Oracle
      product: Fusion Cloud — Enterprise Contracts
      source_title: Contracts Search Options
      source_url: https://docs.oracle.com/en/cloud/saas/sales/facup/contracts-search-options.html
      source_version: Documentation évolutive ; édition non affichée
      source_locator: Search by Enterprise Contract Attributes ; Search Contracts by Text ; Search Contracts with Global Search
      consulted_on: '2026-09-19'
      evidence_limits: Texte primaire consulté. La recherche textuelle dépend de la configuration et des habilitations ; aucun
        choix de moteur ou d’interface imposé.
      element_name: Contracts Search
      concept_name: Contracts Search
      element_type: Fonction documentée par la source primaire
      scope_summary: Contrats retrouvés par attribut, partie ou contenu.
      approach_summary: Rechercher puis ouvrir le contrat et ses documents.
      similarities: Le contrat peut être retrouvé autrement que par son seul numéro.
      differences: Les modalités de recherche et de sécurité Oracle ne sont pas imposées ; FLOW ne décrit pas la gestion du
        cycle contractuel.
      relationship: Recouvrement partiel
      flow_position: Rendre les accords de référence retrouvables et compréhensibles. Agreement Visibility expose ce qui est
        convenu avant que les capacités opérationnelles l’utilisent.
      status: proposed
      source_refs:
      - U505
      - ELM509
      - CMP204
    market_inspiration:
      choice: Rendre les accords de référence retrouvables et compréhensibles. Agreement Visibility expose ce qui est convenu
        avant que les capacités opérationnelles l’utilisent.
      flow_scope: Parties, conditions, périodes, engagements et versions contractuelles disponibles.
      flow_approach: Rechercher l’accord et consulter la référence transmise, sans changer ses termes.
      synthesis:
      - Microsoft éclaire le contenu et les versions d’un accord d’achat ; Oracle documente les chemins pour retrouver un
        contrat. Ces fonctions se situent dans des produits plus larges de gestion contractuelle.
      - FLOW limite Visibility à la connaissance des accords reçus. Lire un engagement contractuel et calculer son utilisation
        par les opérations sont des responsabilités distinctes.
      examples:
      - title: Illustration FLOW — Agreement Visibility
        situation: Un approvisionneur veut comprendre l’engagement de quantité convenu avec Alpha.
        outcome: Il retrouve l’accord, sa période et la version disponible.
        lesson: La quantité contractuelle consultée n’est pas le reliquat calculé.
        source_title: Purchase agreements
        source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/procurement/purchase-agreements
        source_refs:
        - U505
        - ELM426
        - CMP204
