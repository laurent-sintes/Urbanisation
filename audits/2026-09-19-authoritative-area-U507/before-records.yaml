        expose la structure connue avant les décisions de stock, capacité ou acheminement.
      status: proposed
      source_refs:
      - U505
      - ELM512
      - CMP204
    market_inspiration:
      choice: Comprendre les points du réseau et les relations de référence qui les relient. Fulfillment Network Visibility
        expose la structure connue avant les décisions de stock, capacité ou acheminement.
      flow_scope: Points, caractéristiques, responsabilités et relations de référence du réseau.
      flow_approach: Rechercher un point et consulter la structure locale reçue.
      synthesis:
      - GS1 US montre la recherche de lieux partagés ; Microsoft la lecture d’emplacements organisés en arborescence. Ces
        deux échelles étayent la consultation, sans couvrir à elles seules toutes les relations d’un réseau Supply.
      - FLOW étend cette lecture aux relations déjà définies dans Fulfillment Network. Cette adaptation ne crée ni nouveaux
        flux ni connaissance de la charge ou du stock réel.
      examples:
      - title: Illustration FLOW — Fulfillment Network Visibility
        situation: Une demande mentionne un point de préparation.
        outcome: Ses caractéristiques et ses rattachements reçus sont retrouvés.
        lesson: La place dans le réseau ne prouve pas sa disponibilité opérationnelle.
        source_title: Location View/Use Instructions
        source_url: https://www.help.gs1us.org/location-view-use
        source_refs:
        - U505
        - ELM511
        - CMP204
