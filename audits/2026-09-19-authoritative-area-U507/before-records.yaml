- id: D08.e
  revision: 1
  last_modified: '2026-09-19T17:22:35.945608Z'
  kind: capability
  fields:
    name: Product Reference Visibility
    definition: Retrouver un produit ou une variante et consulter les caractéristiques de référence nécessaires pour comprendre
      de quel produit parlent une offre, un accord ou une commande.
    finality: Partager la même compréhension du produit et de ses variantes dans les décisions et opérations Supply.
    scope: |-
      Rechercher par identifiant, nom ou caractéristiques disponibles ; consulter les descriptions, variantes, unités et relations de référence reçues, avec leur provenance et leur validité lorsqu’elles sont connues.

      La consultation ne crée pas de produit et ne corrige pas le maître externe. Les unités physiques, quantités en stock, disponibilité et engagements relèvent d’autres capacités.

      Exemple fictif : retrouver la variante bleue en taille M mentionnée dans un accord, puis consulter ses caractéristiques sans en déduire les quantités disponibles.
    nature: knowledge
    market_comparisons:
    - vendor: Microsoft
      product: Dynamics 365 Supply Chain Management
      source_title: Product information overview
      source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/pim/product-information
      source_version: Mise à jour du 1er juillet 2026
      source_locator: Product masters and product variants ; Product variant model definition workspace ; Released product
        maintenance workspace
      consulted_on: '2026-09-19'
      evidence_limits: Texte primaire relu. Le produit inclut création et maintenance ; seule la lecture est rapprochée de
        FLOW.
      element_name: Product information / Product variants
      concept_name: Product information / Product variants
      element_type: Fonction documentée par la source primaire
      scope_summary: Produits, variantes et caractéristiques.
      approach_summary: Naviguer vers le détail et identifier les variantes par leurs dimensions.
      similarities: Même besoin de retrouver la bonne référence produit.
      differences: Microsoft administre aussi les produits ; FLOW ne retient ici que leur consultation.
      relationship: Recouvrement partiel
