- id: D14.b
  revision: 1
  last_modified: '2026-09-19T17:22:35.945608Z'
  kind: capability
  fields:
    name: Service Catalog Visibility
    definition: Retrouver un [Backing Service](glossary:TER075) et consulter son résultat attendu, son fournisseur et les
      conditions de référence de sa réalisation pour comprendre ce que l’orchestration peut mobiliser.
    finality: Permettre aux activités Supply de connaître les prestations de référence et leurs conditions avant de les mobiliser.
    scope: |-
      Rechercher et parcourir les Backing Services ; consulter résultats attendus, fournisseurs, éligibilité et engagements de service définis, avec leurs périodes de validité lorsqu’elles sont reçues. Il s’agit de l’offre de prestations mobilisables par l’orchestration.

      La disponibilité réelle et la charge relèvent de Service Capacity Visibility. Cette consultation ne sélectionne pas l’exécutant, ne crée pas de Backing Service Order, ne fixe pas de promesse individuelle et n’exécute pas la prestation. Elle ne décrit pas le catalogue des demandes prises en charge par Service Requests.

      Exemple fictif : consulter une prestation de préparation et son délai de référence ; confirmer qu’un exécutant peut la réaliser demain nécessite une autre connaissance et une décision.
    nature: knowledge
    market_comparisons:
    - vendor: TM Forum
      product: ODA — TMFC006
      source_title: Service Catalog Management v1.2.0
      source_url: https://oda-production.s3.eu-west-2.amazonaws.com/v1.0.0/TMFC006_Service_Catalog_Management_v1.2.0.pdf
      source_version: 1.2.0, approuvé le 26 novembre 2024, Production/GA
      source_locator: §1 Overview, p. 5
      consulted_on: '2026-09-19'
      evidence_limits: PDF primaire consulté. Composant télécom comprenant aussi conception et cycle de vie ; ces responsabilités
        ne sont pas importées dans la consultation FLOW.
      element_name: Service Catalog / Service Specification
      concept_name: Service Catalog / Service Specification
      element_type: Fonction documentée par la source primaire
      scope_summary: Services et spécifications organisés dans un catalogue.
      approach_summary: Permettre la recherche et l’accès aux spécifications.
      similarities: Même besoin de retrouver et comprendre une prestation avant de la mobiliser.
      differences: Le composant TM Forum comprend conception et cycle de vie ; FLOW se limite ici à la consultation des Backing
        Services.
      relationship: Recouvrement partiel
      flow_position: Rendre l’offre de Backing Services consultable par les activités d’orchestration. Service Catalog Visibility
        explique ce que chaque prestation prévoit et sous quelles conditions de référence.
      status: proposed
      source_refs:
      - U505
      - ELM513
      - CMP204
    - vendor: ServiceNow
      product: Service Portal
      source_title: Catalog Homepage Search widget
      source_url: https://www.servicenow.com/docs/r/platform-user-interface/service-portal/cat-homepage-search-widget.html
      source_version: Australia ; mise à jour du 12 mars 2026
      source_locator: Using the widget
      consulted_on: '2026-09-19'
      evidence_limits: Texte primaire consulté ; analogie de consultation uniquement. Le catalogue de demandes ServiceNow
        n’est pas assimilé aux Backing Services de FLOW, ni au périmètre de D14.
      element_name: Catalog search / Categories
      concept_name: Catalog search / Categories
      element_type: Fonction documentée par la source primaire
      scope_summary: Offres retrouvées par mots-clés et catégories.
      approach_summary: Faciliter la recherche et le parcours d’un catalogue.
      similarities: Analogie du besoin de retrouver une offre intelligible.
      differences: Le catalogue de demandes ServiceNow a une autre finalité ; son contenu n’est pas assimilé aux Backing Services
        de FLOW.
      relationship: Recouvrement partiel
      flow_position: Rendre l’offre de Backing Services consultable par les activités d’orchestration. Service Catalog Visibility
        explique ce que chaque prestation prévoit et sous quelles conditions de référence.
      status: proposed
      source_refs:
      - U505
      - ELM514
      - CMP204
    market_inspiration:
      choice: Rendre l’offre de Backing Services consultable par les activités d’orchestration. Service Catalog Visibility
        explique ce que chaque prestation prévoit et sous quelles conditions de référence.
      flow_scope: Prestations, résultats, fournisseurs, éligibilité et engagements de service définis.
      flow_approach: Retrouver une prestation dans le catalogue reçu et lire ses conditions.
      synthesis:
      - TM Forum décrit l’accès aux spécifications des services ; ServiceNow illustre la recherche dans un catalogue d’une
        autre nature. Le rapprochement ServiceNow porte sur la consultation, pas sur l’objet métier catalogué.
      - FLOW expose les Backing Services nécessaires à l’orchestration. Le catalogue décrit l’offre de référence ; il ne donne
        pas la capacité disponible ni un engagement pris pour une demande précise.
      examples:
      - title: Illustration FLOW — Service Catalog Visibility
        situation: Une orchestration envisage une prestation de préparation.
        outcome: Elle retrouve son résultat attendu et son délai de référence.
        lesson: Le délai de référence ne vaut pas engagement pour une réalisation demain.
        source_title: Service Catalog Management v1.2.0
        source_url: https://oda-production.s3.eu-west-2.amazonaws.com/v1.0.0/TMFC006_Service_Catalog_Management_v1.2.0.pdf
        source_refs:
        - U505
        - ELM513
        - CMP204
