        et d’en comprendre le contenu et l’applicabilité renseignée.
      flow_scope: Catalogues, offres, références produit et conditions d’applicabilité enregistrées.
      flow_approach: Rechercher et parcourir l’offre reçue, sans recalculer ni administrer ses conditions.
