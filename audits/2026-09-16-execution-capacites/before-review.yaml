user_direction:
  reference: 'Plateforme de services d’exécution : offre logistique entrepôt/transport et autres services, notamment production
    de documents.'
  access: Pour chaque service, endpoint informatique de sollicitation et feedback continu.
  service_level: SLA effectif du service, notamment lorsqu’il est en prise avec le physique et non totalement informatisé.
  domain: Un seul domaine de pilotage de l’exécution.
identity_question:
  stated_ids:
  - D05
  - D06
  current_names:
    D05: Inventory Optimization
    D06: Execution Options
    D07: Execution Commitments and Facts
  proposed_interpretation: D06/D07 semblent les domaines visés ; D05 serait conservé.
  state: resolved_U238
