  commitment_explanation:
    state: ai_proposed
    meaning: Tenir ce qui a été demandé à un exécutant, ce qu’il a accepté de réaliser et les évolutions de cette prise en
      charge.
    example: 'Demander la préparation de 100 colis avant 16 h ; enregistrer l’acceptation de l’entrepôt, un refus ou une proposition
      différente ; tenir les demandes de modification ou d’annulation et les réponses. Le tracking fournit ensuite les faits
      : préparation commencée, 60 colis prêts, retard annoncé.'
    naming_issue: Commitment Management met l’accent sur l’engagement mais décrit insuffisamment la gestion de la demande
      de prestation et de son cycle.
    candidate_name: Service Order Management
    candidate_definition: 'Gérer les demandes de prestation adressées aux exécutants et leur cycle de vie : émission, acceptation
      ou refus, modification, annulation et clôture, selon le service.'
    boundaries:
    - Requirements Decision détermine les prestations nécessaires ; Service Order Management tient les demandes et les réponses
      associées.
    - Orchestration coordonne les prestations ; Tracking renseigne leur réalisation ; Adaptation Decision détermine la variation
      du plan.
    - La gestion porte les demandes confiées aux exécutants et la connaissance de leur prise en charge ; elle ne reprend pas
      leurs opérations internes ni la promesse Supply D03.
    - Cycles et opérations autorisées dépendent du service ; aucun cycle universel ni acceptation en deux temps obligatoire.
    market_status: Piste de nom et de périmètre proposée localement ; aucune équivalence de marché nouvelle affirmée.
  model_mutation: false
