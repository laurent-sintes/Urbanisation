    reading: Réception, validité et fraîcheur utile sont trois questions distinctes ; il faut qualifier l’usage.
    boundary: Aucune durée de fraîcheur ni autorisation de poursuivre inventée.
    status: business_rule_open
    open_items:
    - V0-P02
    source_refs:
    - U460
  - id: CASE-07
    pilot: PILOT-COMMITMENT
    title: Proposition sans confirmation
    given: 60 vendredi et 40 lundi sont proposés pour une demande de 100 vendredi.
    reading: Les possibilités et la proposition n’établissent pas seules un engagement confirmé.
    boundary: La confirmation ne produit pas implicitement une réservation.
