scope: Cinq cas pilotes internes du lot 3. Synthèses proposées des responsabilités courantes, exemples fictifs et informations
  candidates ; aucune autorité installée, cardinalité, nouvelle entité canonique ou validation globale déduite. Product Reference
  est un référentiel, examiné avec sa capacité d’ingestion, et non une capacité renommée.
source_of_truth: modeles/backlog/model.yaml
tracking: modeles/backlog/v0-readiness.yaml
publication: Aucune ; le lecteur Atlas reste lié à son snapshot.
conventions:
  established:
  - Une capacité, l’objet métier homonyme et un document qui l’exprime restent distincts.
  - Les référentiels Supply sont des projections ; les autorités sont extérieures à Supply.
  - Seule Reservation bloque les usages concurrents ; affectation et promesse ne la créent pas implicitement.
  - Une information ou un fait n’est pas un sous-comportement.
  - Tout fait de gestion est associé à un document métier identifié, éventuellement structuré sans PDF (U461). Versions, correction
    et nombre exact de documents restent à préciser.
  proposed_minimum_information_card:
  - Sens et exemple métier.
  - Identité et maille utiles ; cardinalités seulement lorsqu’elles sont établies.
  - Informations essentielles et relations avec d’autres notions.
  - Responsabilités qui consultent, établissent, modifient ou constatent.
  - États, effets et règles utiles à la compréhension.
  - Pour une projection, autorité métier, alimentation, validité et fraîcheur utiles.
  excluded: Schémas de tables, contrats API, messages techniques, produits et applications.
  information_definition_proposal:
    term_ref: MOD012
    analysis_ref: modeles/backlog/information-definition-U464.yaml
    status: proposed_not_applied_to_all_candidates
    rule: Éprouver la maille des informations candidates par leur sens et leurs usages. Product, Order ou un dossier entier
      ne sont pas déclarés insécables par défaut. Les candidats existants restent conservés, sans nouveau nœud canonique.
pilots:
- id: PILOT-PURCHASE
  node_ref: D04.j
  glossary_refs:
  - TER070
  - TER086
  source_refs:
  - U384
  - U391
  - U403
  - U436
  - U460
  - U461
  result: Maintenir les attentes d’achat et expliquer ce qui reste à satisfaire.
  responsibilities:
  - Distinguer ce qui est demandé au fournisseur, sa réponse et les conditions acceptées.
  - Conserver biens ou prestations, quantités ou unités, destinations et échéances applicables.
  - Rapprocher les résultats reçus avec les attendus de la commande.
  boundaries:
  - Order Lifecycle Management conserve les évolutions du cycle de vie.
  - Order Structuring conserve scission, regroupement et fusion ; Order Archiving la conservation.
  - Service Reconciliation qualifie les résultats des prestations ; Inventory Management tient les mouvements de stock.
  - La négociation contractuelle, la finance et la réalisation physique ne sont pas absorbées.
  information_candidates:
  - name: Purchase Order
    role: Objet commande, distinct de la capacité ; référence lexicale TER070.
    essentials:
    - Parties et rôles
    - Biens ou prestations attendus
    - Quantités et unités
    - Destinations
    - Échéances
    - Conditions applicables
    granularity: Attendus ou lignes ; plusieurs parcours peuvent coexister. Identité des lignes et cardinalités à éprouver.
  - name: Supplier Commitment
    role: Réponse puis engagement fournisseur accepté ; distinct de la demande et de notre promesse client.
    essentials:
    - Quantités
    - Dates
    - Conditions
    - Lien avec les attendus concernés
    granularity: Proposition conceptuelle ; aucun second objet canonique créé.
  - name: Purchase Order Document
    role: Bon de commande exprimant le contenu de la commande à un moment donné ; proposition lexicale TER086.
    granularity: Aucune règle de version, signature, immutabilité ou cardinalité nouvelle.
  - name: Receipt Fact
    role: Fait de réception associé à un document métier identifié, à rapprocher de l’attendu (convention U461).
    essentials:
    - Quantité et unité constatées
    - Attendu concerné
    - Moment du constat
    - Écart expliqué
    - Document métier associé identifié
    granularity: Exemple métier, pas un message ni un nouveau nœud.
  - name: Receipt Document
    role: Document identifié qui consigne la réception ; peut être structuré sans PDF.
    essentials:
    - Référence du document
    - Constat de réception consigné
    - Attendus concernés
    granularity: Exemple candidat du pilote ; pas un nouveau nœud. Identité, version, correction et nombre exact de documents
      à instruire.
  example: 100 pièces demandées vendredi ; le fournisseur propose 60 vendredi et 40 mardi. Accepter sa réponse ne révise pas
    automatiquement la promesse client. Lorsque 60 pièces sont réellement reçues, le constat explique les 40 restantes, sans
    confondre confirmation fournisseur et réalisation. Le fait « 60 pièces reçues » est associé au document de réception identifié
    REC-EXEMPLE-01, sous forme structurée dans cet exemple ; ce document ne remplace ni le bon de commande ni l’engagement
    fournisseur.
  open_items:
  - V0-P03
  resolved_items:
  - V0-P01
  information_responsibilities:
  - information: Attendus d’achat
    node_ref: D04.j
    role: Établit et maintient
    boundary: Biens ou prestations, quantités, échéances et reste à satisfaire.
    status: proposed_reading_of_current_model
  - information: Résultats de prestation et écarts
    node_ref: D07.c
    role: Rapproche et qualifie
    boundary: Transmet les faits utiles à Purchase Order ; ne se substitue pas à la réception physique.
    status: proposed_reading_of_current_model
  - information: Document de réception associé au fait
    node_ref: D04.j
    role: Utilise pour le rapprochement
    boundary: Porteur de production et règles de correction du document à préciser ; aucune propriété exclusive déduite.
    status: proposed_reading_of_current_model
- id: PILOT-PRODUCT
  node_ref: D08
  capability_ref: D08.d
  glossary_refs:
  - TER052
  - TER057
  - TER058
  - TER059
  result: Mettre à disposition de Supply des références produit communes, reçues de leurs autorités externes.
  responsibilities:
  - Recevoir et projeter les références Product et Product Variant.
  - Préserver la distinction avec Product Unit, exemplaire physique individuel.
  - Distinguer une référence produit du catalogue qui la propose.
  boundaries:
  - Aucune administration implicite de maître produit dans Supply.
  - Aucun PIM, ERP, propriétaire Beaumanoir ou flux installé supposé.
  information_candidates:
  - name: Product Reference
    role: Projection d’informations de référence, à relier à leur origine métier.
    essentials:
    - Identité Product
    - Déclinaisons Product Variant
    - Rôle Article ou Container
    - Identifiants applicables
    granularity: Product, Product Variant et Product Unit conservent leurs sens du glossaire ; aucune nouvelle clé technique.
  - name: Reference Origin
    role: Informations de provenance métier de la projection, sans nouveau maître dans Supply.
    essentials:
    - Autorité déclarée sur le contenu
    - Source qui le transmet
    - Contexte concerné
    granularity: Attributs conceptuels à éprouver ; ni application ni identité d’acteur réelle supposée.
  - name: Reference Validity
    role: Situer le contenu dans le temps et son contexte d’usage.
    essentials:
    - Validité applicable lorsqu’elle est connue
    - Moment de réception
    - Fraîcheur requise selon l’usage
    granularity: Aucun champ technique obligatoire, seuil universel ou stratégie de conflit imposé.
  projection:
    authority: Extérieure à Supply ; responsabilité métier précise non établie dans ce pilote.
    feeding_source: Information transmise par une autorité ou un relais à identifier ; ne pas assimiler automatiquement émetteur
      et autorité.
    context: Sens, périmètre et validité des références utilisées par les commandes et les opérations.
    freshness: Ancienneté de l’information disponible par rapport au besoin métier. Recevoir maintenant une ancienne description
      ne la rend pas récente ; aucun délai universel ni arrêt automatique des commandes adopté.
    contradiction: 'Exemple à instruire : une même déclinaison est reçue avec deux caractéristiques contradictoires. Qui fait
      autorité, qui arbitre et quel usage reste permis pendant la résolution ?'
    missing_information: Distinguer une référence inconnue d’une indisponibilité physique. Le comportement opérationnel permis
      en cas de référence absente reste à déterminer par usage.
    validity: Période ou contexte dans lequel la caractéristique vaut ; distinct du moment de réception de l’information.
  example: Une commande mentionne une déclinaison taille M. Supply utilise la référence reçue pour la reconnaître ; elle ne
    crée pas pour autant une nouvelle définition maîtresse du produit.
  open_items:
  - V0-P02
  source_refs:
  - U460
  - ELM280
  - ELM281
  - ELM282
  - CMP175
  - CMP176
  - CMP177
  information_responsibilities:
  - information: Product / Product Variant
    node_ref: D08.d
    role: Reçoit et actualise la projection
    boundary: L’autorité sur les maîtres reste externe.
    status: proposed_reading_of_current_model
  - information: Référence produit utile à l’achat
    node_ref: D04.j
    role: Consulte
    boundary: La dépendance publiée ne constitue pas une preuve de flux installé.
    status: proposed_reading_of_current_model
- id: PILOT-COMMITMENT
  node_ref: D03.n
  result: Proposer, confirmer et réviser les quantités, dates et conditions de satisfaction.
  source_refs:
  - U441
  - U443
  - U445
  - U436
  - U460
  responsibilities:
  - Rendre distincts demande initiale, proposition et engagement confirmé.
  - Mobiliser les décisions de faisabilité et d’échéancier sans refaire leurs arbitrages.
  boundaries:
  - Ne choisit pas une seconde fois l’échéancier ; ne modifie pas généralement le contenu de l’Order.
  - Aucun mouvement physique ni réservation automatique.
  information_candidates:
  - name: Fulfillment Commitment
    role: Engagement de satisfaction ; le nom est aussi celui d’une capacité, sans identité entre les deux notions.
    essentials:
    - Commande concernée
    - Quantités
    - Dates
    - Conditions
    - Distinction proposition et confirmation
    granularity: Les engagements peuvent exprimer des parts de satisfaction ; identités et cardinalités à préciser.
  example: Pour 100 pièces demandées vendredi, proposer 60 vendredi et 40 lundi. Remplacer une ressource affectée peut préserver
    cet engagement si ses conditions restent tenues.
  open_items:
  - V0-P03
  - V0-A02
  information_responsibilities:
  - information: Proposition et engagement de satisfaction
    node_ref: D03.n
    role: Propose, confirme et révise
    boundary: Quantités, dates et conditions distinctes de la demande ; autorisations détaillées à préciser.
    status: proposed_reading_of_current_model
- id: PILOT-ASSIGNMENT
  node_ref: D02.e
  glossary_refs:
  - TER078
  result: Maintenir les ressources retenues pour des commandes identifiées.
  source_refs:
  - U345
  - U364
  - U436
  - U443
  - U460
  responsibilities:
  - Matérialiser les affectations retenues et leurs modifications autorisées.
  - Mobiliser les décisions spécialisées qui déterminent les choix.
  boundaries:
  - Une affectation ne bloque pas les usages concurrents.
  - Gel de modification, réservation de ressource et engagement de satisfaction ont des effets distincts.
  information_candidates:
  - name: Supply Assignment
    role: Lien métier entre ressource et commande ; résultat maintenu par la capacité homonyme.
    essentials:
    - Commande concernée
    - Ressource retenue
    - Quantité
    - Conditions temporelles applicables
    granularity: Aucun objet technique ni identité de ligne imposés ; la maille dépend des ressources et commandes du cas.
  example: Remplacer l’affectation de 40 pièces de l’arrivage A par celle de l’arrivage B sans changer la promesse.
  open_items:
  - V0-A02
  information_responsibilities:
  - information: Lien ressource–commande
    node_ref: D02.e
    role: Établit et modifie selon choix autorisé
    boundary: Ne bloque pas les usages concurrents ; ne choisit pas à nouveau le plan.
    status: proposed_reading_of_current_model
- id: PILOT-RESERVATION
  node_ref: D02.c
  result: Donner effet à un engagement de quantité dont les usages concurrents doivent tenir compte.
  source_refs:
  - U436
  - U460
  responsibilities:
  - Établir l’engagement de ressource pour le besoin identifié.
  - Le rendre opposable aux usages concurrents selon la frontière adoptée.
  boundaries:
  - Un droit exclusif peut précéder l’affectation d’un lot précis.
  - Ne pas déduire expiration, consommation, libération ou déclenchement automatique.
  information_candidates:
  - name: Reservation
    role: Engagement portant sur la ressource ; distinct de la promesse de satisfaction et de l’affectation.
    essentials:
    - Besoin bénéficiaire
    - Quantité
    - Périmètre de ressource concerné
    - Conditions applicables
    granularity: Les droits et leur évolution restent à qualifier ; aucun mécanisme de concurrence technique.
  example: Une réservation de 40 pièces exclut leur usage concurrent même si le lot précis sera affecté ultérieurement.
  open_items:
  - V0-A01
  - V0-A06
  information_responsibilities:
  - information: Engagement de ressource opposable
    node_ref: D02.c
    role: Établit
    boundary: Effet de blocage concurrent adopté ; détails de libération et de consommation ouverts.
    status: proposed_reading_of_current_model
scenario:
  qualification: Exemple pédagogique fictif ; pas un workflow universel ni des flux installés.
  steps:
  - Commerce exprime une intention de 100 pièces vendredi.
  - Supply détermine les possibilités ; Fulfillment Commitment propose 60 vendredi et 40 lundi.
  - Une réponse est confirmée selon les autorisations applicables, encore à préciser.
  - Supply Assignment matérialise les ressources retenues. Leur usage concurrent reste possible tant qu’aucune réservation
    ne le bloque.
  - Reservation peut établir le droit opposable ; son déclenchement n’est pas réputé automatique.
  - Les prestations attendues sont adressées aux responsabilités de réalisation concernées, sans confondre attente et réalisation.
  - Les constats et écarts alimentent le rapprochement des prestations et des commandes, chacun dans sa responsabilité.
  exceptions:
  - Un refus fournisseur n’efface pas la demande et ne restaure aucune capacité physique.
  - Un retard conduit à réexaminer les engagements ; il ne les modifie pas automatiquement.
  - Une réception partielle explique le restant à satisfaire sans devenir une nouvelle promesse.
