    - U443
  - id: CASE-03
    pilot: PILOT-PURCHASE
    title: Achat d’une prestation
    given: Une prestation achetée est annoncée terminée ; un écart est constaté.
    reading: Purchase Order conserve l’attendu d’achat ; Service Reconciliation qualifie le résultat. Le fait de gestion est
      associé à un document identifié.
    boundary: Ne pas transformer une prestation en quantité de stock ; le document métier exact reste à qualifier.
    status: business_rule_open
    open_items:
    - V0-P03
    source_refs:
    - U391
    - U461
  - id: CASE-04
    pilot: PILOT-PRODUCT
