    ni validation humaine. Les suites ouvertes restent explicitement visibles.
  cases:
  - id: CASE-01
    pilot: PILOT-PURCHASE
    title: Réception partielle documentée
    given: 100 pièces attendues ; 60 réellement reçues.
    reading: Le document REC-EXEMPLE-01 consigne le fait de réception ; le rapprochement explique 40 restantes.
    boundary: Une confirmation fournisseur ne constitue pas une réception.
    status: boundary_explained
    open_items: []
    source_refs:
    - U391
    - U461
  - id: CASE-02
    pilot: PILOT-PURCHASE
    title: Réponse fournisseur différente de la demande
    given: 100 vendredi demandées ; réponse de 60 vendredi et 40 mardi.
    reading: Demande, réponse et conditions acceptées restent distinguées ; la promesse client ne change pas automatiquement.
    boundary: Qui accepte une révision et comment l’identifier restent à qualifier.
    status: business_rule_open
    open_items:
