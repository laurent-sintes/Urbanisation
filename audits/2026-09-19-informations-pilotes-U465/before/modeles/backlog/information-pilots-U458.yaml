    reading: Une même référence de variante peut servir aux offres ; les deux exemplaires restent deux Product Units.
    boundary: Ni identité individuelle déduite du catalogue, ni fusion d’exemplaires.
    status: boundary_explained
    open_items: []
    source_refs:
    - U191
    - U193
    - U202
  - id: CASE-05
