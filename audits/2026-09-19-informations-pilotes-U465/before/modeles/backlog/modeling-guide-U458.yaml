lessons:
- id: business-first
  label: Le métier d’abord
  title: Des responsabilités métier qui coopèrent
  rule: Une capacité décrit ce que l’entreprise sait faire durablement. Univers et domaines regroupent des responsabilités
    qui coopèrent par des informations, des demandes et des engagements.
  established_at: '2026-09-19'
  scene:
    kind: responsibilities
    caption: 'Illustration métier : possibilités, refus et écarts peuvent circuler en retour. Cet exemple ne crée pas trois
      nouveaux domaines dans le catalogue.'
    items:
    - label: Commerce
      text: Exprimer l’intention et les attentes
    - label: Supply
      text: Établir un engagement de satisfaction
    - label: Logistique
      text: Concrétiser les prestations attendues
  question: Plusieurs domaines contribuent à satisfaire une commande. Cela les transforme-t-il en une hiérarchie de couches
    ?
  choices:
  - label: Non, ils coopèrent avec des responsabilités distinctes
    feedback: Une interaction indique ce qui est attendu ou partagé. Elle ne crée ni parent-enfant ni responsabilité unique.
  - label: Oui, chaque étape devient une couche du modèle
    feedback: L’ordre d’un parcours ne définit pas la structure de la carte. Les retours, refus et écarts mobilisent aussi
      plusieurs responsabilités.
  explanation: La carte organise des problèmes métier durables. Les interactions expliquent leur coopération. Un parcours
    traverse plusieurs responsabilités sans créer un étage supplémentaire dans la décomposition.
  contributor:
    criterion: Décris le résultat, les limites et les informations échangées ; distingue ce qui est demandé, décidé, engagé
      et constaté.
    boundary: Atlas reste une référence métier. Les choix de produits, applications et réalisations sont documentés séparément,
      hors d’Atlas.
    scope: Principes U455/U456 appliqués ; exemple de coopération et formulation pédagogique proposés, aucun domaine ajouté.
    source_refs:
    - U33
    - U455
    - U456
  model_links:
  - id: D03.n
    label: Fulfillment Commitment
  - id: D04.i
    label: Sales Order
- id: useful-detail
  label: Le bon détail
  title: Décomposer doit apporter quelque chose
  rule: Un comportement explique une façon d’agir utile. Il est le dernier niveau descriptif sous une capacité ; son ajout
    doit être justifié.
  established_at: '2026-09-17'
  scene:
    kind: decomposition
    parent: Fulfillment Commitment · capacité
    caption: Des responsabilités distinctes · aucune séquence universelle imposée par la carte
    items:
    - label: Comportement
      text: Proposer la promesse
    - label: Comportement
      text: Confirmer la promesse
    - label: Comportement
      text: Réviser la promesse
  question: On ajoute un bouton « Exporter ». Faut-il créer un comportement ?
  choices:
  - label: Le bouton suffit à justifier le découpage
    feedback: Une opération d’interface ne suffit pas. La question utile est ce qu’un comportement supplémentaire permet de
      comprendre du métier.
  - label: Seulement si un bénéfice métier distinct le justifie
    feedback: Le découpage demande une complexité ou un bénéfice ciblé. Mécanisme, politique ou variante peuvent le justifier
      ; un bouton seul ne le fait pas.
  explanation: Le découpage demande une complexité ou un bénéfice ciblé. Mécanisme, politique ou variante peuvent le justifier
    ; un bouton seul ne le fait pas.
  contributor:
    criterion: Énonce la complexité ou le bénéfice précis de la décomposition, puis explique ce qui distingue chaque manière
      d’agir.
    boundary: Un comportement appartient à une seule capacité, explicitement reliée à son parent. Il n’a pas de sous-comportement
      ; plusieurs comportements peuvent se combiner.
    scope: Niveau terminal et critères retenus le 17 septembre. Promise Management est l’exemple adopté U288, postérieur à
      v007 ; il ne représente pas un extrait de cette publication. Formulations pédagogiques proposées.
    source_refs:
    - U262
    - U265
    - U283
    - U288
    - AGENTS-2026-09-18
    - U455
  model_links:
  - id: D03.n
    label: Fulfillment Commitment
- id: meaningful-links
  label: Le sens des liens
  title: Avoir besoin de ne veut pas dire contenir
  rule: Les liens d’appartenance construisent l’arbre. Les dépendances expliquent comment des responsabilités distinctes se
    mobilisent.
  established_at: '2026-09-16'
  scene:
    kind: dependency
    connector: mobilise
    caption: Un lien de mobilisation, pas un nouveau niveau de décomposition.
    items:
    - label: Capacité
      text: Inventory Planning
    - label: Capacité distincte
      text: Replenishment Decision
  question: Planning mobilise une décision spécialisée. Cette décision devient-elle son comportement ?
  choices:
  - label: Elle reste une capacité distincte
    feedback: La décision garde sa responsabilité propre. On explique le lien de mobilisation sans la transformer en comportement
      du Planning.
  - label: Elle devient un enfant de Planning
    feedback: Ce placement confondrait dépendance et décomposition. Une relation métier n’ajoute pas automatiquement une branche
      dans l’arbre.
  explanation: La décision garde sa responsabilité propre. On explique le lien de mobilisation sans la transformer en comportement
    du Planning.
  contributor:
    criterion: 'Précise le sens du lien : contient, présente, utilise une information ou mobilise une décision. Décris les
      conditions et effets connus.'
    boundary: Business References est un groupe de présentation. Un regroupement visuel ne prouve ni propriété exclusive ni
      relation parent-enfant.
    scope: Mobilisation des décisions explicitée U229 ; la scène illustre ce principe sans ajouter de relation au catalogue.
      Formulations pédagogiques proposées.
    source_refs:
    - U229
    - AGENTS-2026-09-18
  model_links:
  - id: D05.f
    label: Inventory Planning
  - id: D05.e
    label: Replenishment Decision
- id: responsibilities
  label: Les responsabilités
  title: Un choix, une mise à jour, une action physique
  rule: Décider d’un ajustement, l’enregistrer et le réaliser portent des effets différents, même lorsque tout est automatisé.
  established_at: '2026-09-16'
  scene:
    kind: responsibilities
    caption: Trois effets à distinguer · pas de workflow universel dessiné ici
    items:
    - label: Décision
      text: Choisir de transférer 20 unités
    - label: Transaction
      text: Enregistrer la commande de transfert
    - label: Réalisation
      text: Déplacer les unités
  question: La commande de transfert est enregistrée. Les unités ont-elles nécessairement bougé ?
  choices:
  - label: Oui, l’enregistrement prouve la réalisation
    feedback: L’enregistrement ne prouve pas le déplacement. Il faut distinguer le résultat de la transaction et celui de
      l’exécution.
  - label: Non, la réalisation doit être constatée
    feedback: L’enregistrement change les données transactionnelles. La réalisation physique est un autre fait, dont il faut
      pouvoir connaître le résultat.
  explanation: L’enregistrement change les données transactionnelles. La réalisation physique est un autre fait, dont il faut
    pouvoir connaître le résultat.
  contributor:
    criterion: 'Pour chaque responsabilité, demande quel effet elle produit : une réponse métier, des données mises à jour
      ou une prestation réalisée.'
    boundary: Planning mobilise les décisions et les capacités opérationnelles. Écran, batch ou streaming ne créent pas à
      eux seuls de nouvelles capacités.
    scope: L’effet transactionnel est précisé U231. Le transfert de 20 unités est un exemple pédagogique proposé, sans processus
      universel, organisation humaine ni automatisation imposée.
    source_refs:
    - U231
    - AGENTS-2026-09-18
  model_links:
  - id: D05.c
    label: Stock Redistribution Decision
  - id: D04.k
    label: Transfer Order
- id: business-objects
  label: Les objets du métier
  title: Les objets gravitent autour des capacités
  rule: Objet métier, document et fait de gestion restent distincts. Dans FLOW, tout fait de gestion est associé à un document
    métier identifié, éventuellement structuré sans PDF ; aucun n’est un sous-comportement.
  established_at: '2026-09-19'
  scene:
    kind: objects
    caption: 'Exemple fictif : le document de réception identifié consigne le fait ; la commande porte ce qui était attendu.'
    items:
    - label: Objet métier
      text: La commande d’achat attendue
    - label: Document
      text: Le document de réception REC-EXEMPLE-01
    - label: Fait de gestion
      text: 60 pièces reçues vendredi
  question: Un comportement utilise un document. Le document devient-il un niveau en dessous ?
  choices:
  - label: Non, il est relié avec un sens explicite
    feedback: Le document reste un document. Le lien indique par exemple qu’il est produit ou utilisé, sans en faire un sous-comportement.
  - label: Oui, il prolonge la décomposition
    feedback: Cela mélangerait la manière d’agir et l’objet utilisé. Leur relation mérite d’être décrite, pas transformée
      en décomposition.
  explanation: Le document reste un document. Le lien indique par exemple qu’il est produit ou utilisé, sans en faire un sous-comportement.
    Un document métier peut être un enregistrement structuré sans PDF. La convention FLOW relie chaque fait de gestion à un
    document identifié. Une Information explicite le sens métier utile à une capacité, avec les éléments et le contexte nécessaires.
    Sa maille minimale se juge sur ce sens ; la cartographie ne prescrit pas de modèle de données implémentable.
  contributor:
    criterion: Décris ce que représente l’élément, puis précise s’il est produit, utilisé, référencé ou constaté. Ne déduis
      pas le lien de sa position visuelle.
    boundary: Le lien fait–document est requis dans FLOW ; il ne fixe ni nombre exact de documents, ni règles de version/correction,
      ni propriétaire unique. Ces détails se précisent selon le contexte.
    scope: 'U461 confirme le lien fait–document. Exemple et formulation pédagogique proposés ; aucun objet canonique ajouté,
      aucune autre convention de cycle de vie adoptée. U464 : notion Information et règle de granularité proposées, sans assimiler
      tout fait logique à un fait de gestion.'
    source_refs:
    - U61
    - U62
    - U262
    - AGENTS-2026-09-18
    - U461
    - U464
  model_links: []
- id: two-vocabularies
  label: Deux vocabulaires
  title: Distinguer le méta modèle du modèle métier
  rule: Le méta modèle décrit comment la carte est construite. Le modèle métier décrit les notions et responsabilités de l’entreprise.
  established_at: '2026-09-19'
  scene:
    kind: objects
    caption: Deux vocabulaires complémentaires, consultables séparément.
    items:
    - label: Méta modèle
      text: Domaine · Capacité · Comportement · Relation
    - label: Modèle métier
      text: Stock · Commande · Réservation · Promesse
  question: Où chercher la différence entre une capacité et un comportement ?
  choices:
  - label: Dans le glossaire du méta modèle
    feedback: Il définit les éléments de la carte et leurs relations.
  - label: Dans le glossaire métier
    feedback: Le glossaire métier explique les notions de l’entreprise, par exemple un stock ou une commande.
  explanation: Utilise le glossaire du méta modèle pour comprendre la structure ; utilise le glossaire métier pour comprendre
    les responsabilités Supply.
  contributor:
    criterion: Décris une notion métier dans le glossaire métier et une règle de construction dans le méta modèle.
    boundary: Une relation métier ne crée pas une décomposition ; un terme du méta modèle ne devient pas une capacité.
    scope: Présentation demandée U450 ; formulation pédagogique proposée.
    source_refs:
    - U450
    - U451
  model_links: []
sources:
- id: U319
  title: Demande d’étude pour expliquer les principes de modélisation dans Atlas
  excerpt: |-
    Je voudrais espace dans atlas qui explique les principes de modélisation retenus. Il faut imaginer qq chose de compact, ludique, didactique, pas juste un glossaire verbeux et indigeste.
    Je veux juste une étude et des propositions sans modification du source.
  scope: Verbatim figé de connaissance/01-contributions-utilisateur.md, section U319. Lecture arrêtée au 18 septembre 2026
    ; la portée de l’accord est précisée dans la clé concernée.
- id: U320
  title: Deux profondeurs de lecture pour le guide Atlas
  excerpt: Les deux, avec deux profondeurs de lecture
  scope: Verbatim figé de connaissance/01-contributions-utilisateur.md, section U320. Lecture arrêtée au 18 septembre 2026
    ; la portée de l’accord est précisée dans la clé concernée.
- id: U321
  title: Intégrer Les clés du modèle dans Atlas
  excerpt: Go
  scope: Verbatim figé de connaissance/01-contributions-utilisateur.md, section U321. Lecture arrêtée au 18 septembre 2026
    ; la portée de l’accord est précisée dans la clé concernée.
- id: U33
  title: Définition stricte des capacités et vocabulaire métier commun
  excerpt: |-
    Il faut absolument qu'on reste sur la définition de capacité : ce que sait faire l'entreprise indépendamment de son organisation et de ses outils.

    Mais c'est bien de chercher plus loin pour expliquer et illustrer les capacités.

    A mon avis, il faut ensuite un glossaire clair sur les mots qu'on retrouve dans les capacités : ressource, stock, demande en tout genre etc. Ainsi que sur les verbes afin de normaliser les actions.

    Qu'en penses-tu ?
  scope: Verbatim figé de connaissance/01-contributions-utilisateur.md, section U33. Lecture arrêtée au 18 septembre 2026
    ; la portée de l’accord est précisée dans la clé concernée.
- id: U45
  title: Donner au domaine le sens d’un espace problématique
  excerpt: En tout cas il faut donner du sens à ces niveaux. Le plus important c'est "domaine" => la définition d'evans (DDD)
    qui le décrit comme un espace problématique est ce qui me guide dans la catégorisation. Qu'en penses-tu ?
  scope: Verbatim figé de connaissance/01-contributions-utilisateur.md, section U45. Lecture arrêtée au 18 septembre 2026
    ; la portée de l’accord est précisée dans la clé concernée.
- id: U46
  title: Problèmes liés dans un périmètre cohérent et étape de cartographie
  excerpt: |-
    La notion d'espace problématique est dans son livre si je me souviens bien : un ensemble de problèmes définissables dans un périmètre cohérent car les problèmes sont liés.

    Bounded context me semble trop précis et fait état d'un certain niveau d'avancement dans la conception de l'application et ce n'est pas ce qu'on veut à mon humble avis.
  scope: Verbatim figé de connaissance/01-contributions-utilisateur.md, section U46. Lecture arrêtée au 18 septembre 2026
    ; la portée de l’accord est précisée dans la clé concernée.
- id: U322
  title: Indépendance du modèle métier et de l’architecture de solution
  excerpt: Attention au modèle business qui est complètement décorrélé de la solution. Souvent on a une capacité implémentée
    par une brique logiciel/ solution mais pas nécessairement. Il peut parfois y avoir dans les solution de la mutualisation,
    de la généricité, des choix et des contraintes techniques qui font qu'il y a des regroupements forts ou des dispersions
    (microservices) justifiés.
  scope: Verbatim figé de connaissance/01-contributions-utilisateur.md, section U322. Lecture arrêtée au 18 septembre 2026
    ; la portée de l’accord est précisée dans la clé concernée.
- id: U262
  title: Retenir Comportement comme dernier niveau de détail d’une capacité
  excerpt: Comportement est exactement ce que je cherche pour mon niveau de décomposition complémentaire. Et je ne crois pas
    qu'il faille descendre plus bas.
  scope: Verbatim figé de connaissance/01-contributions-utilisateur.md, section U262. Lecture arrêtée au 18 septembre 2026
    ; la portée de l’accord est précisée dans la clé concernée.
- id: U265
  title: Audit de granularité avec comportements et simplification des instructions
  excerpt: 'P.S. : Il faut que la décomposition en comportement soit justifiée par une complexité ou un bénéfice ciblé =>
    cette notion est en enregistrer dans le modèle.'
  scope: Verbatim figé de connaissance/01-contributions-utilisateur.md, section U265. Lecture arrêtée au 18 septembre 2026
    ; la portée de l’accord est précisée dans la clé concernée.
- id: U283
  title: Critères différenciants des comportements et réexamen de Planning
  excerpt: |-
    Mécanisme, Politique, Variante, ou benefice sont les critères différenciants qui permettent de décomposer une capacité. Je suis très satisfait de ta proposition.
    Pour les capacité de "planification", les mécanismes de construction de scénarios alternatifs, d'adaptation de l'execution d'un scénario, et de simulation sont vraiment des comportements dans le sens où ça implique des impacts sur les comportements humains de l'entreprise et de ses processus. Les autres comportements sont des fonctions qu'on retrouvera dans les produits.
  scope: Verbatim figé de connaissance/01-contributions-utilisateur.md, section U283. Lecture arrêtée au 18 septembre 2026
    ; la portée de l’accord est précisée dans la clé concernée.
- id: U288
  title: Promise Management avec trois comportements de promesse
  excerpt: |-
    "J’ai retenu une fusion à soumettre à ton arbitrage : les trois capacités de gestion de promesse pourraient devenir Promise Management, en gardant proposition, confirmation et révision comme fonctions.   ". Comme comportement tu veux dire :)

    Oui c'est une bonne idée.
  scope: Verbatim figé de connaissance/01-contributions-utilisateur.md, section U288. Lecture arrêtée au 18 septembre 2026
    ; la portée de l’accord est précisée dans la clé concernée.
- id: U229
  title: Conserver Decision et distinguer Planning des capacités qui le nourrissent
  excerpt: Ce qui m'ennuie c'est que j'aimerais garder "Décision" du manière générale et éviter "Calculation". Et "Planning"
    est un terme qui désigne le fait de "reconfigurer, simuler, valider". Les capacités "Planning" se nourrissent de "Décision"
  scope: Verbatim figé de connaissance/01-contributions-utilisateur.md, section U229. Lecture arrêtée au 18 septembre 2026
    ; la portée de l’accord est précisée dans la clé concernée.
- id: U231
  title: Préciser l'application transactionnelle des données de Stock Protection
  excerpt: '**"Stock Protection — management** : gouverner les politiques, leur validité et leur application.  " => "application"
    signifie mettre à jour transactionnellement les données unitairement, en groupe ou en masse par plusieurs types d''interfaces
    possibles (écrans, batch, flux, stereaming)'
  scope: Verbatim figé de connaissance/01-contributions-utilisateur.md, section U231. Lecture arrêtée au 18 septembre 2026
    ; la portée de l’accord est précisée dans la clé concernée.
- id: U61
  title: Objets métier, faits de gestion, documents et émergence depuis les capacités
  excerpt: |-
    Dans la plateforme qu'on veut développer, on fait la différence entre les objets métier (sorte d'aggregateRoot) et les faits de gestion qui sont des événements associés à des documents qui sont des états d'aggregateRoot ou des objets non modifiables produits ou captés.

    Ma question est : est-ce que les capacités, dans leur définition, leur expression, font émerger ces éléments ou on considère que c'est la conception IT qui les fera émerger ?

    Que peut on constater dans l'urbanisme SAP, BIZBOK ou TM ?
  scope: Verbatim figé de connaissance/01-contributions-utilisateur.md, section U61. Lecture arrêtée au 18 septembre 2026
    ; la portée de l’accord est précisée dans la clé concernée.
- id: U62
  title: Objets métier dans les modèles processus et transactionnels
  excerpt: |-
    Oui, les processus s'appuient souvent sur des objets métier (approche Case Management) : par exemple "Demande de réassort".

    Mais d'autres objets existent aussi dans les domaines transactionnels.
  scope: Verbatim figé de connaissance/01-contributions-utilisateur.md, section U62. Lecture arrêtée au 18 septembre 2026
    ; la portée de l’accord est précisée dans la clé concernée.
- id: U111
  title: Publier les 36 capacités avec leur statut de validation
  excerpt: Même si les 36 capacités n'ont pas été releasées, publie les dans la release avec le statut "non validé" par exemple
  scope: Verbatim figé de connaissance/01-contributions-utilisateur.md, section U111. Lecture arrêtée au 18 septembre 2026
    ; la portée de l’accord est précisée dans la clé concernée.
- id: AGENTS-2026-09-18
  title: Conventions de modélisation et portée des accords
  excerpt: |-
    - **Capacité → Comportement** est la décomposition descriptive terminale (U262). Un comportement appartient explicitement à une seule capacité de même couche ; aucun sous-comportement. Plusieurs comportements peuvent se combiner sans former une séquence.

    - Objets métier, documents et événements restent distincts ; ils ne sont pas des niveaux inférieurs de comportement. Leurs liens ne présument ni possession exclusive, ni cardinalité, ni ordre d’exécution.

    - Déduire l’arbre uniquement des relations explicites. `contains`, `presents` et les liens métier transversaux ont des sens différents. Business References est un groupe de présentation ; Universe est un niveau d’urbanisme. Un lien « a besoin de » n’est pas une décomposition.

    Publier ne vaut pas valider. Un Go s’applique au contenu présenté et à sa portée : champs, valeurs et rattachements explicites. Ne pas étendre un accord aux compléments éditoriaux, descendants ou nouvelles valeurs. Conserver empreintes et accords historiques ; `lifecycle`, `review` et décisions `ADOPT-*` ne remplacent pas la qualification champ par champ.

    - Distinguer décision, mise à jour transactionnelle, déclenchement et réalisation physique, sans imposer une organisation humaine, un découpage logiciel, l’atomicité d’un lot ou un contrôle manuel. L’automatisation est possible.
  scope: Extraits figés d’AGENTS.md, sections 2, 3 et 5, au 18 septembre 2026. Ils restituent les règles courantes à cette
    date ; ils ne réécrivent pas la publication métier du 16 septembre.
- id: U450
  title: Présentation Atlas et types de comportements
  excerpt: Présenter séparément le glossaire du méta modèle et le glossaire métier ; Comprendre le méta modèle doit être accessible
    dans Atlas.
  scope: 'U450 : synthèse de la demande, pas un verbatim intégral ; U451 : réponse exacte. Sources internes conservées, non
    affichées dans Atlas.'
- id: U451
  title: Présentation Atlas et types de comportements
  excerpt: Les formes propres aux comportements
  scope: 'U450 : synthèse de la demande, pas un verbatim intégral ; U451 : réponse exacte. Sources internes conservées, non
    affichées dans Atlas.'
- id: U455
  title: Abandonner les couches transactionnelle/processus au profit des interactions entre univers et domaines
  excerpt: Concernant "Couches transactionnelle/processus", je pense qu'il faut oublier le concept qui est très "SAP". Il
    n'y a pas de "couches" à proprement parler, ce sont des domaines et univers qui sont en interaction. Par exemple, Commerce
    capte des intentions et les transforme en engagement via la Supply qui elle même le concrétise via la logistique.
  scope: Verbatim de la contribution ; principe adopté, formulation pédagogique proposée.
- id: U456
  title: Conserver Atlas dans un périmètre strictement métier
  excerpt: D'autre pas part, je souhaite qu'Atlas reste dans un scope métier et de déborde pas sur les solutions ou les produits.
  scope: Verbatim de la contribution ; principe adopté, formulation pédagogique proposée.
- id: U461
  title: Lien fait de gestion–document confirmé
  excerpt: Oui, conserver le lien fait–document
  scope: 'Réponse du 19 septembre 2026 : tout fait de gestion est associé à un document métier identifié, éventuellement structuré
    sans PDF. Versions, correction et nombre exact de documents non adoptés par extension.'
- id: U464
  title: Définir les informations métier indépendamment de leur implémentation
  excerpt: |-
    Prochaine étape : la data. Ou plutot les informations métier. Il faut définir la notion d'Information dans le méta modèle et dire que ce n'est pas un modèle de données implémentable, une information est groupe de données insécables minimum, portant son propre sens et explicitant les capacités.
    Recherche dans la théorie des données la définition exacte et limpide de cette notion
  scope: Demande et intention ; la définition proposée et l’interprétation précise de la maille minimale ne sont pas adoptées
    par anticipation.
glossary:
  terms:
  - id: MOD001
    name: Decision
    label_fr: Décision
    definition: Déterminer une réponse métier à partir d’hypothèses, d’objectifs et de contraintes.
    role: Qualifier une responsabilité de décision dans le modèle.
  - id: MOD002
    name: Planning
    label_fr: Planification
    definition: Construire des scénarios alternatifs, simuler et analyser leurs conséquences, puis adapter le scénario en
      cours en mobilisant les décisions spécialisées et les capacités responsables de sa mise en action.
    role: Qualifier les responsabilités de planification qui utilisent les décisions.
  - id: MOD003
    name: Management
    label_fr: Gestion / gouvernance
    definition: Gérer les règles et leur validité, et tenir transactionnellement les données qui les matérialisent.
    role: Qualifier une responsabilité de gestion, à préciser selon l’objet concerné.
  - id: MOD004
    name: Application transactionnelle
    definition: Mettre à jour transactionnellement les données, unitairement, en groupe ou en masse, par plusieurs types d’interfaces
      possibles.
    role: Préciser le sens de l’application des résultats dans une capacité de management.
  - id: MOD005
    name: Couverture — convention de description
    definition: Qualifier toute affirmation de couverture en indiquant ce qui est couvert, par quoi, dans quel périmètre et
      horizon, et selon quel critère de satisfaction.
    role: Rendre explicites le sens et le degré de réalisation d’une couverture dans la description des objets et capacités.
  - id: MOD006
    name: Capability Behavior
    label_fr: Comportement
    definition: 'Un comportement décrit une manière métier identifiable dont une capacité agit dans certaines circonstances
      : politique ou stratégie, mécanisme, variante de prise en charge, périmètre significatif, dimension de raisonnement,
      effet sur un engagement ou pratique de planification. Il précise ce qui change dans la réponse, l’action ou le résultat
      attendu, sans détailler les fonctions du produit.'
    role: Niveau complémentaire de détail sous une capacité ; dernier niveau de sa décomposition descriptive.
    examples:
    - 'Politique ou stratégie métier : Distinguer une logique de choix, de protection ou de contrôle qui change la réponse
      ou la façon d’agir.'
    - 'Variante de processus ou de prise en charge : Distinguer un parcours par son résultat attendu, ses obligations, ses
      acteurs ou ses flux métier, sans détailler toutes ses étapes.'
    - 'Mécanisme d’intervention : Distinguer comment une capacité produit son effet métier, notamment en préservant ou en
      révisant un état existant.'
    - 'Périmètre métier d’intervention ou d’arbitrage : Distinguer une portée qui change les contraintes, interdépendances,
      faits observés ou responsabilités ; ce critère vaut aussi pour les décisions.'
    - 'Dimension de raisonnement ou d’information prise en compte : Distinguer les informations ou contraintes qui changent
      les possibilités établies par une décision ; les dimensions sont combinables.'
    - 'Effet sur l’état métier ou l’engagement : Distinguer des effets substantiels sur les obligations, l’autorisation, la
      stabilité ou la continuité du traitement.'
    - 'Pratique de planification et d’adaptation : Distinguer une manière de travailler sur un scénario qui transforme l’analyse,
      la coordination humaine ou les interactions avec l’exécution.'
  - id: MOD007
    name: Capability Nature
    label_fr: Type de capacité
    definition: Qualifier une capacité selon son résultat métier dominant, indépendamment de son nom, de ses comportements
      et de sa réalisation technique.
    role: Fournir une grille de lecture explicite et stable pour les icônes et la présentation des capacités.
    examples:
    - 'Action : Effectuer une opération métier ou matérialiser une évolution autorisée des données et engagements.'
    - 'Gestion : Maintenir dans la durée un ensemble cohérent de règles, états, engagements ou obligations et gouverner ses
      évolutions.'
    - 'Connaissance / visibilité : Établir, actualiser et rendre accessible une connaissance fiable des états, faits et résultats
      attendus.'
    - 'Orchestration : Coordonner les prestations, leurs dépendances et leur progression dans un processus.'
    - 'Planification : Construire, comparer et maintenir des scénarios en mobilisant les décisions spécialisées.'
    - 'Décision : Déterminer une réponse métier à partir des faits, règles, objectifs et contraintes applicables, en incluant
      les calculs nécessaires.'
  - id: MOD008
    name: Universe
    label_fr: Univers
    definition: Grand périmètre d’urbanisation qui présente des domaines et des groupes de référentiels.
    role: Situer les domaines sans les imbriquer.
  - id: MOD009
    name: Business Reference
    label_fr: Référentiel métier
    definition: Ensemble cohérent de données de référence nécessaires aux capacités métier ; dans Supply, projection de sources
      maîtresses externes.
    role: Distinguer les références des commandes, décisions et réalisations.
  - id: MOD010
    name: Model Relationship
    label_fr: Relation du modèle
    definition: Lien explicite décrivant une appartenance, une présentation ou une interaction métier entre éléments.
    role: Distinguer la structure de lecture des échanges et dépendances métier.
  - id: MOD011
    name: Behavior Nature
    label_fr: Type de comportement
    definition: Forme qui explique ce qui distingue une manière d’agir au sein d’une capacité.
    role: Rendre lisible la différence entre politique, parcours, mécanisme, périmètre, raisonnement, effet et pratique de
      planification.
    examples:
    - 'Politique ou stratégie métier : Distinguer une logique de choix, de protection ou de contrôle qui change la réponse
      ou la façon d’agir.'
    - 'Variante de processus ou de prise en charge : Distinguer un parcours par son résultat attendu, ses obligations, ses
      acteurs ou ses flux métier, sans détailler toutes ses étapes.'
    - 'Mécanisme d’intervention : Distinguer comment une capacité produit son effet métier, notamment en préservant ou en
      révisant un état existant.'
    - 'Périmètre métier d’intervention ou d’arbitrage : Distinguer une portée qui change les contraintes, interdépendances,
      faits observés ou responsabilités ; ce critère vaut aussi pour les décisions.'
    - 'Dimension de raisonnement ou d’information prise en compte : Distinguer les informations ou contraintes qui changent
      les possibilités établies par une décision ; les dimensions sont combinables.'
    - 'Effet sur l’état métier ou l’engagement : Distinguer des effets substantiels sur les obligations, l’autorisation, la
      stabilité ou la continuité du traitement.'
    - 'Pratique de planification et d’adaptation : Distinguer une manière de travailler sur un scénario qui transforme l’analyse,
      la coordination humaine ou les interactions avec l’exécution.'
  - id: MOD012
    name: Information
    label_fr: Information métier
    definition: |-
      Ensemble minimal d’éléments qui, reliés dans un contexte donné, portent un sens métier déterminé et explicitent ce qu’une capacité connaît, utilise, produit ou fait évoluer.

      L’information est décrite indépendamment de sa représentation informatique. La cartographie des informations métier ne constitue pas un modèle de données implémentable.
    role: Expliciter le contenu métier des capacités et de leurs interactions.
    examples:
    - « 60 » seul ne précise pas l’information recherchée. « 60 pièces promises pour le 25 septembre sur la ligne L » explicite
      un engagement, dans le contexte de cette ligne.
    - 'Pour une même ligne, 60 pièces promises le 25 septembre et 40 le 28 septembre : les liens quantité–date sont indispensables.
      Les séparer en deux listes non reliées ferait perdre le sens. L’échéancier rassemble deux échéances ; ce n’est pas un
      fait élémentaire unique démontré.'
    - 'Une commande complète regroupe plusieurs informations : quantités demandées, engagements, réalisations. Demande, engagement
      et réalisation gardent leurs sens distincts même quand un document les rapproche.'
