id: flow-modeling-keys
version: 2026-09-19.2
as_of: '2026-09-19'
title: Comprendre le méta modèle
subtitle: Six repères pour comprendre la structure du modèle et son vocabulaire.
editorial_status: proposed_wording
scope: Principes retenus et formulations pédagogiques proposées restent distincts. Ce guide méthodologique ne crée aucun élément
  du catalogue métier. Brouillon U458 pour une future publication ; aucune association au modèle publié courant.
