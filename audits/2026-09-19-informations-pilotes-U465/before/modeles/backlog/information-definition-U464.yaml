proposal:
  term: Information
  definition: |-
    Ensemble minimal d’éléments qui, reliés dans un contexte donné, portent un sens métier déterminé et explicitent ce qu’une capacité connaît, utilise, produit ou fait évoluer.

    L’information est décrite indépendamment de sa représentation informatique. La cartographie des informations métier ne constitue pas un modèle de données implémentable.
  boundary: L’information est décrite indépendamment de sa représentation informatique. La cartographie des informations métier
    ne constitue pas un modèle de données implémentable.
  granularity: Retenir le plus petit ensemble nécessaire à un sens métier explicite, avec ses liens et son contexte. Écarter
    les détails sans rôle pour les capacités étudiées ; distinguer les sens autonomes plutôt que regrouper tout le dossier.
  examples:
  - « 60 » seul ne précise pas l’information recherchée. « 60 pièces promises pour le 25 septembre sur la ligne L » explicite
    un engagement, dans le contexte de cette ligne.
  - 'Pour une même ligne, 60 pièces promises le 25 septembre et 40 le 28 septembre : les liens quantité–date sont indispensables.
    Les séparer en deux listes non reliées ferait perdre le sens. L’échéancier rassemble deux échéances ; ce n’est pas un
    fait élémentaire unique démontré.'
  - 'Une commande complète regroupe plusieurs informations : quantités demandées, engagements, réalisations. Demande, engagement
    et réalisation gardent leurs sens distincts même quand un document les rapproche.'
alternatives:
- name: Information Concept
  fit: Très bon ancrage pour une carte métier et ses liens aux capacités.
  limit: Ne garantit pas la maille minimale demandée.
- name: Elementary Fact
  fit: Critère théorique précis d’insécabilité logique.
  limit: Granularité parfois trop fine ; une information composite utile au métier n’est pas toujours un fait élémentaire.
    Le mot fait risquerait aussi de brouiller U461.
- name: Information — convention FLOW
  fit: Nom demandé ; sens, contexte et minimum utile explicités.
  limit: Recommandation locale, sans équivalence normative. Les découpages concrets doivent être éprouvés sur les pilotes.
  recommendation: true
selection_checks:
- Formuler la question métier à laquelle l’information répond et donner une occurrence compréhensible.
- Identifier sujet, sens des valeurs et contexte indispensables ; rendre explicites les relations qui portent ce sens.
- Écarter les éléments sans rôle pour cette question et séparer les sens autonomes ; ne pas descendre à chaque champ technique.
- Nommer les capacités qui connaissent, utilisent ou font évoluer l’information ; ne pas inférer un propriétaire exclusif.
- Distinguer demande, hypothèse, proposition, engagement, règle et constat selon le cas, sans leur imposer un cycle universel.
preserved:
- Objet métier, Information, document et fait de gestion distincts.
- Convention U461 limitée aux faits de gestion, pas à tout fait au sens de la logique.
- Capacité → Comportement reste la décomposition terminale ; Information ne la prolonge pas.
- Pas de schéma de tables, classes, messages ou API prescrit ; une représentation ultérieure reste possible.
- Aucune correspondance 1:1 Information/table, Information/document ou Information/capacité imposée.
next_step: Éprouver cette règle sur les cinq pilotes ; arbitrer les frontières concrètes avant d’étendre le schéma ou le catalogue
  métier.
