fields:
  name: Authoritative Data
  market_comparisons:
  - vendor: EDM Council
    product: Data Management / DCAM
    source_title: 'Prioritizing Data Based on Criticality: Critical Data Elements (CDEs) in Context'
    source_url: https://ortecha.com/wp-content/uploads/2023/07/EDM-Council-Prioritizing-Data-Based-on-Criticality-Critical-Data-Elements-CDEs-in-Context.pdf
    source_version: Novembre 2018, vF1.1
    source_locator: 'Pages 19, 28–29 et 37 : Data Producer ; Validate Data in Scope ; Glossary'
    evidence_limits: Rapport EDM Council primaire hébergé par Ortecha, co-auteur. Emploi exact du terme dans le glossaire
      ; ni définition autonome détaillée de ce terme ni consultation du DCAM actuel réservé aux membres.
    element_name: Authoritative Data Domain / Authoritative Provisioning Point
    element_type: Vocabulaire et responsabilités de gouvernance des données
    similarities: Désigner les données qui font référence et la responsabilité de leur fourniture.
    differences: La gouvernance décrite peut concerner toutes les données ; FLOW circonscrit ce périmètre à ses références
      relativement stables.
    concept_name: Authoritative Data Domain
    scope_summary: Données d’un périmètre identifié, y compris reçues d’un propriétaire amont.
    approach_summary: Définir les responsabilités et les conditions de fourniture aux consommateurs.
    consulted_on: '2026-09-19'
    relationship: Appui sémantique
    flow_position: Porter les références qui font foi dans Supply Chain Orchestration, en articulation avec les sources de
      vérité d’entreprise et les décisions des areas consommatrices.
    status: proposed
    source_refs:
    - U478
    - U479
    - ELM483
    - CMP194
  - vendor: Oracle
    product: Oracle Reference Architecture — Information Management
    source_title: ORA Information Management
    source_url: https://www.oracle.com/technetwork/topics/entarch/oracle-ra-info-mgmt-r3-1-1980395.pdf
    source_version: Release 3.1, juillet 2013, E26368-03
    source_locator: §2.3.4, pages 2-3/2-4 ; §6.3.3.4.3, pages 6-49/6-50
    evidence_limits: Architecture de référence historique, pas catalogue métier Supply ni recommandation de produit actuel.
      La définition réunit master et reference data ; les seuils de politiques métier ne sont pas explicitement inclus.
    element_name: Authoritative Data Domain
    element_type: Catégorie d’architecture de données
    similarities: Donner aux opérations un contexte de référence fiable.
    differences: Oracle classe master et reference data. FLOW part de leur utilité dans le domaine, avec une autorité locale
      explicitée par U479.
    concept_name: Authoritative Data Domain
    scope_summary: Entités maîtresses et données de classification qui donnent leur contexte aux opérations.
    approach_summary: Rendre disponibles des références cohérentes ; une consolidation peut conserver la maîtrise des sources
      amont.
    consulted_on: '2026-09-19'
    relationship: Appui sémantique
    flow_position: Porter les références qui font foi dans Supply Chain Orchestration, en articulation avec les sources de
      vérité d’entreprise et les décisions des areas consommatrices.
    status: proposed
    source_refs:
    - U478
    - U479
    - ELM484
    - CMP194
  - vendor: EDM Council
    product: Cloud Data Management Capabilities (CDMC)
    source_title: 'CDMC Information Model: Controls, Tests and Mappings'
    source_url: https://edmcouncil.org/wp-content/uploads/2023/02/CDMC-Information-Model-Controls-Tests-Mappings-V1.1.pdf
    source_version: Version 1.1, octobre 2022
    source_locator: 'Contrôle 3, pages 13–14 : Authoritative Indication ; Authority'
    evidence_limits: Modèle de contrôle de gestion des données cloud ; appui sur la notion d’autorité, pas prescription de
      domaine Supply ni déclaration de conformité FLOW.
    element_name: Authoritative Data Source / Authoritative Provisioning Point
    element_type: Qualification de gouvernance d’un actif de données
    similarities: Rendre explicite quelles données font autorité pour leurs consommateurs.
    differences: Le contrôle qualifie des actifs et points de fourniture ; il ne délimite pas les références stables par rapport
      aux transactions.
    concept_name: Authoritative Data Source
    scope_summary: Actifs reconnus comme source ou point de fourniture faisant autorité.
    approach_summary: Attribuer explicitement l’autorité ; la simple présence d’une donnée ne suffit pas.
    consulted_on: '2026-09-19'
    relationship: Appui sémantique
    flow_position: Porter les références qui font foi dans Supply Chain Orchestration, en articulation avec les sources de
      vérité d’entreprise et les décisions des areas consommatrices.
    status: proposed
    source_refs:
    - U478
    - U479
    - ELM485
    - CMP194
  market_inspiration:
    choice: Les référentiels Supply portent les données relativement stables qui font foi pour les décisions et les opérations
      de Supply Chain Orchestration. Leur autorité locale s’articule avec les sources de vérité de l’entreprise, qui restent
      externes au domaine.
    flow_scope: Références des produits, parties, catalogues, accords, lieux et services utilisées par les areas Supply.
    flow_approach: Porter une référence commune au domaine, avec une origine connue et une distinction entre responsabilité
      d’entreprise et autorité locale.
    synthesis:
    - EDM Council éclaire la responsabilité et la reconnaissance de l’autorité ; Oracle éclaire le contexte de référence donné
      aux opérations. Le terme Authoritative Data Domain est attesté dans les deux familles documentaires, avec des portées
      différentes.
    - Pour FLOW, l’utilité recherchée est de savoir quelles références utiliser dans le domaine. La nature des données ne
      suffit pas à tracer cette frontière ; les commandes, les stocks courants et les engagements individuels restent portés
      par leurs areas.
    examples:
    - title: Illustration FLOW — une référence produit commune à la Supply
      situation: Le maître produit d’entreprise fournit une unité de conditionnement. Les commandes et la préparation doivent
        utiliser la référence applicable dans le domaine.
      outcome: Le référentiel Supply porte la référence locale consommée par ces areas et conserve son lien avec la source
        d’entreprise.
      lesson: Porter la référence locale et maîtriser le produit à l’échelle de l’entreprise sont deux responsabilités distinctes.
        Les règles de prise en compte des changements restent à préciser.
      source_title: ORA Information Management — Consolidated Hub ; illustration FLOW construite
      source_url: https://www.oracle.com/technetwork/topics/entarch/oracle-ra-info-mgmt-r3-1-1980395.pdf
      source_refs:
      - U479
      - ELM484
      - CMP194
