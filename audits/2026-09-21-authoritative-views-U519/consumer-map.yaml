    role: Contextualiser la capacité communiquée avec service, unité, période et calendrier.
    support: existing_reference_relation_and_scope
  - id: D07.a
    name: Service Requirements Decision
    parent_ids:
    - D06
    role: Décrire les prestations nécessaires dans le réseau connu.
    support: existing_reference_relations
  - id: D06.e
    name: Service Selection Decision
    parent_ids:
    - D06
    role: Évaluer les services et exécutants selon l’offre de référence et les contraintes.
    support: existing_reference_relations_and_scope
  - id: D07.b
    name: Backing Service Orders
    parent_ids:
    - D06
    role: Référencer correctement la prestation sollicitée.
