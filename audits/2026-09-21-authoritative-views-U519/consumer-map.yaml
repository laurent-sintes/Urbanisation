families:
- key: order_context
  candidate_name: Order Context
  status: proposed_family_not_canonical_node
  business_question: Quelles références décrivent la demande, ses parties, son contenu et ses conditions de prise en charge
    ?
  reference_content:
  - Identité des parties et rôles dans le contexte concerné.
  - Produit/variante, offre, sélection et conditions contractuelles référencées ; garder leurs distinctions.
  - Restrictions reçues liées au tiers et portée connue, sans déterminer automatiquement leur effet sur cet Order.
  core_data_inputs:
  - id: D09
    name: Party / Role
  - id: D08
    name: Product Reference
  - id: D12
    name: Product Catalog
  - id: D16
    name: Assortment
  - id: D11
    name: Agreement
  - name: Party Restrictions
    status: Ressource retenue dans la structure de travail U518 ; aucun identifiant canonique.
  consumers:
  - id: D04.i
    name: Sales Order
    parent_ids:
    - D04
    role: Reconnaître client, produits, offre et conditions de la commande.
    support: existing_reference_relations
  - id: D04.k
    name: Transfer Order
    parent_ids:
    - D04
    role: Reconnaître les produits, lieux et responsabilités utiles au transfert ; ne pas forcer une offre commerciale dans
      tous les cas.
    support: existing_reference_relations
  - id: D03.m
    name: Order Prioritization
    parent_ids:
    - D03
    role: Lire les accords et critères de priorité, avant établir la priorité.
    support: existing_relation_and_scope
  - id: D04.o
    name: Order Lifecycle Management
    parent_ids:
    - D04
    role: Comprendre la portée des restrictions si une règle d’application leur donne un effet sur la progression.
    support: candidate_use_no_adopted_restriction_effect
  - id: D04.n
    name: Order Structuring
    parent_ids:
    - D04
    role: Lire les contraintes de compatibilité utiles à une composition lorsque leur autorité est définie.
    support: candidate_use_open_compatibility_rules
  excluded_live_state:
  - Quantités commandées, reste à servir, état de Lifecycle et promesses déjà établies.
  - Faits d’exécution, réservations et affectations.
  excluded_decisions:
  - Admissibilité finale de la demande ou effet précis d’une restriction.
  - Choix du prix appliqué, ordre de priorité, autorisation de transition ou décision de satisfaction.
  evidence:
  - node_id: D04.i
    field: definition
    exact_excerpt: 'Gérer les commandes clients à satisfaire : enregistrer ce qui est demandé, maintenir les quantités, destinations
      et échéances applicables, suivre les évolutions autorisées et déterminer ce qui reste à servir.'
    adoption_limit: Texte courant du modèle ; son existence ne prouve pas un accord détaillé sur tous ses champs.
  - node_id: D03.m
    field: scope
    exact_excerpt: Mobiliser les engagements, dates demandées ou promises, accords et critères de priorité applicables ; distinguer
      obligations impératives, préférences et éventuelles dérogations autorisées.
    adoption_limit: Texte courant du modèle ; son existence ne prouve pas un accord détaillé sur tous ses champs.
  - node_id: D04.n
    field: scope
    exact_excerpt: Les conditions de compatibilité et d’autorisation restent à instruire ; la fusion n’est pas réputée applicable
      à tous les types et états d’Orders.
    adoption_limit: Texte courant du modèle ; son existence ne prouve pas un accord détaillé sur tous ses champs.
  existing_relations:
  - id: REL-NEEDS-U290-045
    source_id: D03.m
    target_id: D11.a
    type: relates-to
    meaning: A besoin de conditions contractuelles et validité.
  - id: REL-NEEDS-U290-050
    source_id: D04.i
    target_id: D08.d
    type: relates-to
    meaning: A besoin de produits/variantes et caractéristiques utiles.
  - id: REL-NEEDS-U290-051
    source_id: D04.i
    target_id: D09.d
    type: relates-to
    meaning: A besoin de parties et rôles externes.
  - id: REL-NEEDS-U290-052
    source_id: D04.i
    target_id: D11.a
    type: relates-to
    meaning: A besoin de conditions contractuelles et validité.
  - id: REL-NEEDS-U290-053
    source_id: D04.i
    target_id: D12.a
    type: relates-to
    meaning: A besoin de offre commerciale externe.
  - id: REL-NEEDS-U290-063
    source_id: D04.k
    target_id: D13.a
    type: relates-to
    meaning: A besoin de lieux et liens du réseau.
  - id: REL-NEEDS-U290-064
    source_id: D04.k
    target_id: D08.d
    type: relates-to
    meaning: A besoin de produits/variantes et caractéristiques utiles.
  open_questions:
  - Quelle responsabilité identifie les références applicables lorsque plusieurs offres, accords ou restrictions se recouvrent
    ?
  - La lecture d’un ancien Order doit-elle viser les références actuelles, celles convenues ou celles connues à une date donnée
    ? Aucun choix de version automatique.
- key: sourcing_context
  candidate_name: Sourcing Context
  status: proposed_family_not_canonical_node
  business_question: Quelles références fournisseur, produit, destination et conditions encadrent un apport ou un achat envisagé
    ?
  reference_content:
  - Fournisseur et rôle, produits ou services concernés, conditions d’achat ou d’apport reçues.
  - Restrictions fournisseur connues, lieux et conditions de référence utiles si la source fournit ces relations.
  - 'Pour la consignation : propriété, droits d’usage, échéances et suites autorisées issues de l’accord.'
  core_data_inputs:
  - id: D09
    name: Party / Role
  - id: D08
    name: Product Reference
  - id: D11
    name: Agreement
  - id: D13
    name: Fulfillment Network
  - id: D14
    name: Service Catalog
  - name: Price Books
    status: Candidat U516 ; autonomie et périmètre à instruire.
  - name: Party Restrictions
    status: Ressource retenue U518 dans la structure de travail.
  consumers:
  - id: D04.j
    name: Purchase Order
    parent_ids:
    - D04
    role: Préparer et tenir une demande d’achat de biens ou de prestations sous conditions référencées.
    support: existing_reference_relations_and_scope
  - id: D04.r
    name: Consignment Replenishment Order
    parent_ids:
    - D04
    role: Lire les conditions de l’apport fournisseur consigné sans le transformer en achat.
    support: existing_reference_relation_and_scope
  - id: D01.h
    name: Consigned Inventory Management
    parent_ids:
    - D01
    role: Appliquer au stock consigné les droits et obligations reçus de l’accord.
    support: existing_reference_relation_and_scope
  excluded_live_state:
  - Disponibilité fournisseur, confirmation reçue, quantités attendues ou reçues.
  - État du stock consigné, consommation, reste à recevoir et propriété effectivement transférée.
  excluded_decisions:
  - Choix du fournisseur, quantités d’apport, date de promesse ou acquisition des marchandises.
  - Déduire une relation fournisseur-produit-site autorisée de la seule coexistence des trois références.
  evidence:
  - node_id: D04.j
    field: definition
    exact_excerpt: Prendre en charge les commandes d’achat de biens ou de prestations adressées aux fournisseurs, maintenir
      les attentes et les évolutions autorisées et rapprocher les réalisations pour connaître le reste à satisfaire.
    adoption_limit: Texte courant du modèle ; son existence ne prouve pas un accord détaillé sur tous ses champs.
  - node_id: D04.r
    field: scope
    exact_excerpt: '[Agreement](model:D11) fournit les conditions applicables, y compris celles de l’offre de stockage.'
    adoption_limit: Texte courant du modèle ; son existence ne prouve pas un accord détaillé sur tous ses champs.
  - node_id: D01.h
    field: definition
    exact_excerpt: 'Appliquer au stock consigné les conditions de l’accord : propriété, droits d’usage, échéances et suites
      autorisées ; mobiliser les capacités responsables lorsqu’une acquisition, un retour ou une autre issue devient nécessaire.'
    adoption_limit: Texte courant du modèle ; son existence ne prouve pas un accord détaillé sur tous ses champs.
  existing_relations:
  - id: REL-NEEDS-U290-057
    source_id: D04.j
    target_id: D08.d
    type: relates-to
    meaning: A besoin de produits/variantes et caractéristiques utiles.
  - id: REL-NEEDS-U290-058
    source_id: D04.j
    target_id: D09.d
    type: relates-to
    meaning: A besoin de parties et rôles externes.
  - id: REL-NEEDS-U290-059
    source_id: D04.j
    target_id: D11.a
    type: relates-to
    meaning: A besoin de conditions contractuelles et validité.
  - id: REL-NEEDS-U395-01
    source_id: D01.h
    target_id: D11.a
    type: relates-to
    meaning: A besoin des conditions de l’accord ingérées depuis le maître externe pour appliquer au stock les droits, obligations
      et échéances.
  - id: REL-NEEDS-U395-02
    source_id: D04.r
    target_id: D11.a
    type: relates-to
    meaning: A besoin des conditions de l’accord ingérées depuis le maître externe pour formuler et suivre la demande d’apport
      consigné.
  open_questions:
  - Le modèle établit produits/parties/accords comme entrées de Purchase Order ; il n’établit pas encore une référence complète
    fournisseur-produit-site.
  - Distinguer tarif de référence, prix négocié et prix finalement appliqué ; Q072 reste ouverte.
  - Cette famille justifie une vue autonome si les questions d’achat/apport diffèrent suffisamment d’Order Context ; sinon
    conserver une déclinaison de la même famille.
- key: fulfillment_service_context
  candidate_name: Fulfillment & Service Context
  status: proposed_family_not_canonical_node
  business_question: Quels lieux, relations, prestations et conditions de réalisation de référence peut-on examiner pour satisfaire
    le besoin ?
  reference_content:
  - Points du réseau, relations reçues, responsables, prestations physiques/humaines/numériques et conditions configurées.
  - Résultat rendu, unité de service, conditions d’éligibilité et SLA de référence.
  - Calendriers, jours d’ouverture, heures limites, fuseaux et validité reçue lorsque ces informations existent.
  core_data_inputs:
  - id: D13
    name: Fulfillment Network
  - id: D14
    name: Service Catalog
