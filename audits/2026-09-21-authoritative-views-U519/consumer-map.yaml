cross_cutting_rules:
- 'Les trois axes sont indépendants : domaines sources, organisation du stockage, usages Supply ; relations plusieurs-à-plusieurs
  possibles, aucune symétrie imposée.'
- Une famille est une question réutilisable, pas un endpoint, une table, un écran, un Behavior ou une vue matérialisée obligatoire.
- Une vue peut assembler plusieurs références et n’expose que les données utiles à son usage. Produit, parties, calendrier
  et restrictions peuvent être réutilisés entre familles.
- Lire une condition reçue ne signifie pas décider de son application au cas ; rendre explicites contexte, version, provenance
  et limites disponibles sans garantie nouvelle inventée.
- Restriction reçue, résultat d’évaluation, décision de bloquer et effet appliqué restent distincts. Aucun effet global de
  blacklist déduit de U518.
- Les états vivants peuvent être rapprochés des références dans une expérience utilisateur ; leur autorité reste chez les
  capacités qui les produisent.
- Les droits/propriété/échéances de consignation sont couverts par Sourcing Context et réutilisés avec Inventory Planning
  Context ; aucun septième contexte imposé.
- Groupes/canaux et critères de priorité sont à rendre explicites dans Inventory Planning Context et Order Context sans supposer
  leurs sources établies.
granularity_assessment:
  six_families: Cohérentes comme familles de questions. Sourcing Context se distingue si les conditions d’apport/achat et
    la relation fournisseur-produit-destination ont un contenu propre documenté.
  five_family_variant:
    merge:
    - order_context
    - sourcing_context
    candidate_merged_name: Order & Supply Reference Context
    preserved_variants: Client, achat, transfert et apport consigné selon les informations et conditions utiles ; aucune vue
      automatique par type d’Order.
    benefit: Réutiliser le noyau produit/parties/accords/restrictions tant que la distinction sourcing n’apporte pas un besoin
      autonome prouvé.
    tradeoff: Risque de masquer les particularités de l’achat/apport fournisseur ; conserver des projections ciblées lorsque
      les consommateurs les exigent.
  return_context: Finalité distincte soutenue par les accords de reprise et les politiques de disposition ; le détail des
    sources externes reste incomplet.
