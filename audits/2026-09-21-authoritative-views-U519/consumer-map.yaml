    name: Party / Role
  - id: D11
    name: Agreement
  - name: Calendars / cutoffs / time zones
    status: Besoins explicites D03.l et D06.b ; rattachement précis et sources à identifier, aucun nouveau sujet adopté.
  consumers:
  - id: D03.i
    name: Available-to-Promise (ATP)
