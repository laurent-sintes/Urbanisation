    adoption_limit: Texte courant du modèle ; son existence ne prouve pas un accord détaillé sur tous ses champs.
  - node_id: D06.b
    field: scope
    exact_excerpt: Expliciter le service, l’unité, la période, l’origine et la fraîcheur des informations disponibles.
    adoption_limit: Texte courant du modèle ; son existence ne prouve pas un accord détaillé sur tous ses champs.
