  - Prise en charge, engagement individuel, estimation, jalon ou résultat réel d’un service.
  excluded_decisions:
  - Admissibilité contextualisée finale, choix d’itinéraire/service/exécutant, ATP ou échéancier retenu.
  - Confondre SLA configuré et promesse faite à la commande.
  evidence:
  - node_id: D06.e
    field: scope
    exact_excerpt: Exploiter le catalogue des services, les lieux et relations du réseau, les conditions applicables et la
