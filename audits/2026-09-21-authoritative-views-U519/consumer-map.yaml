  business_question: Quelles conditions, droits et voies de traitement de référence encadrent le retour examiné ?
  reference_content:
  - Produit, client/fournisseur et accords de reprise lorsqu’ils sont fournis.
  - Politiques de retour, conditions d’acceptation, filières et services de référence lorsque leur responsabilité source est
    identifiée.
  - Destinations et prestations possibles décrites dans les références, sans décider le devenir du bien.
  core_data_inputs:
  - id: D08
    name: Product Reference
  - id: D09
    name: Party / Role
  - id: D11
    name: Agreement
  - id: D13
    name: Fulfillment Network
  - id: D14
    name: Service Catalog
  - name: Return policies / acceptance rules / disposition routes
