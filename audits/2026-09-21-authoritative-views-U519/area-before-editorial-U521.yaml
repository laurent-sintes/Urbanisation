    market_inspiration:
      choice: 'Authoritative Data porte la source de vérité locale de Supply Chain Orchestration : les références partagées
        sur lesquelles s’appuient ses décisions et opérations. Cette Area les reçoit et les rend consultables, en articulation
        avec les sources de vérité de l’entreprise, qui restent externes au domaine.'
      flow_scope: Références des produits, parties, catalogues, assortiments, accords, lieux et services utilisées par les
        areas Supply.
      flow_approach: Recevoir les évolutions des maîtres externes et rendre consultable une référence commune au domaine,
        avec une origine connue et une autorité locale explicite.
      synthesis:
      - 'EDM Council éclaire la responsabilité et la reconnaissance de l’autorité ; Oracle éclaire le contexte de référence
        donné aux opérations. Authoritative Data est un terme d’architecture et de gouvernance : son emploi ne démontre pas
        qu’il soit un nom courant des périmètres d’un OMS.'
      - 'Microsoft Intelligent Order Management peut utiliser un ERP maître et, pour certains parcours, fonctionner sans catalogue
        local de produits ou comptes. Fluent organise les données nécessaires aux workflows en produits/catalogues et lieux/réseaux
        ; IBM Sterling distingue notamment organisations, rôles et nœuds. Ces structures sont différentes : les documents
        consultés ne définissent pas une taxonomie commune à sept référentiels.'
      - Les sept sujets FLOW distinguent identité produit, parties, offre commerciale, sélection applicable, conditions convenues,
        réseau et prestations exécutantes. Leur utilité tient aux informations nécessaires aux décisions, même lorsque les
        cycles de vie maîtres sont externes. Le découpage ne prescrit ni sept applications ni sept administrations autonomes.
      - Séparer les sujets ne suffit pas à imposer un couple Ingestion/Visibility par sujet. La granularité des capacités
        se justifie par leurs résultats et responsabilités métier ; un format technique ou une réalisation commune ne tranche
        pas cette question. Les rattachements actuels restent le découpage FLOW, sans équivalence de capacités déduite des
        objets des OMS.
      - 'L’alimentation externe ne supprime pas toute responsabilité locale : il faut préciser quelle référence utiliser et
        ce que l’on sait de son origine et de son applicabilité. Les commandes, le stock courant, les engagements individuels
        et l’exécution restent dans leurs Areas. Les données de configuration documentées dans les OMS ne transfèrent pas
        automatiquement leur administration au périmètre FLOW.'
      - DMN permet de distinguer les données d’entrée et la logique des décisions. Cette séparation est compatible avec des
        références communes, mais ne prescrit ni sept référentiels ni le rattachement de toutes les règles à cette Area. L’autorité
        sur d’éventuels paramètres partagés reste à préciser ; aucune technologie n’est imposée.
      examples:
      - title: Illustration FLOW — une référence produit commune à la Supply
        situation: Le maître produit d’entreprise fournit une unité de conditionnement. Les commandes et la préparation doivent
          utiliser la référence applicable dans le domaine.
        outcome: Le référentiel Supply porte la référence locale consommée par ces areas et conserve son lien avec la source
          d’entreprise.
        lesson: Porter la référence locale et maîtriser le produit à l’échelle de l’entreprise sont deux responsabilités distinctes.
          Les règles de prise en compte des changements restent à préciser.
        source_title: ORA Information Management — Consolidated Hub ; illustration FLOW construite
        source_url: https://www.oracle.com/technetwork/topics/entarch/oracle-ra-info-mgmt-r3-1-1980395.pdf
        source_refs:
        - U479
        - ELM484
        - CMP194
      - title: Exemple Microsoft — orchestration sans catalogue maître local obligatoire
        situation: La documentation IOM décrit des parcours avec un ERP maître, voire des informations produit ou client portées
          par la commande.
        outcome: L’orchestration peut disposer de ce dont elle a besoin sans administrer un catalogue maître local complet.
        lesson: 'Lecture FLOW : préciser l’information nécessaire et l’autorité applicable avant d’imposer une administration
          ou un référentiel autonome par sujet. Cette possibilité produit ne décide pas de la réalisation FLOW.'
        source_title: Data management
        source_url: https://learn.microsoft.com/en-us/dynamics365/intelligent-order-management/data-management
        source_refs:
        - ELM522
        - CMP207
    finality: Permettre aux activités de Supply Chain Orchestration de s’appuyer sur les mêmes références pour savoir de quel
      produit on parle, avec quel partenaire, dans quel lieu et sous quelles conditions.
    definition: Mettre à disposition les références qui font foi pour les décisions et opérations de Supply Chain Orchestration.
      Authoritative Data porte la source de vérité locale du domaine pour les produits, les personnes, les offres, les assortiments,
      les accords, les lieux et les services, en articulation avec les sources de vérité d’entreprise externes.
    scope: |-
      Sept référentiels composent ce périmètre : [Product Reference](model:D08), [Party / Role](model:D09), [Product Catalog](model:D12), [Assortment](model:D16), [Agreement](model:D11), [Fulfillment Network](model:D13) et [Service Catalog](model:D14). Ils restent distincts au sein de cette Area. Chacun dispose d’une ingestion des évolutions reçues et d’une capacité Visibility pour rechercher, consulter et comprendre la référence locale disponible. Les références organisent la lecture de ces capacités par sujet ; elles ne créent pas un niveau d’Area supplémentaire.

      Les [commandes](glossary:TER012), le [stock](glossary:TER005) courant, les engagements pris pour une commande et les résultats d’exécution restent portés par leurs activités respectives. Un délai de service configuré fait référence ; la promesse faite pour une commande et le délai réellement constaté sont des informations différentes.
    mastership: 'Les sources de vérité de l’entreprise restent en dehors de Supply Chain Orchestration. Les référentiels Supply
      reçoivent leurs données, en conservent l’origine et portent la référence locale utilisée dans le domaine. Cette autorité
      locale ne leur transfère pas l’administration des données maîtresses d’entreprise. Porter une valeur de référence ne
      signifie pas la décider : le rattachement de paramètres comme les seuils de réassort reste à préciser.'
    examples:
    - title: Un même conditionnement pour interpréter les commandes
      situation: Dans cet exemple illustratif, une référence produit précise qu’un carton contient six pièces. Une commande
        de deux cartons doit donc être comprise comme portant sur douze pièces.
      outcome: Authoritative Data porte la référence de conditionnement issue du maître produit externe. Les activités Supply
        peuvent s’y référer pour interpréter la quantité commandée et organiser sa satisfaction.
      lesson: Le référentiel indique ce qu’est le produit et comment ses unités se correspondent. Il ne constate pas le stock
        disponible et ne décide pas de la quantité à fournir.
      source_refs:
      - U479
      - U482
      - U484
      - ELM484
      - CMP194
