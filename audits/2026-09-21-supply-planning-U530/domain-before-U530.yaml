fields:
  name: Supply Chain Orchestration
  definition: 'Décider quels produits fournir, en quelle quantité, depuis quel lieu et à quelle date, puis coordonner les
    prestations nécessaires jusqu’à leur réalisation. La [Supply Chain](glossary:TER084), ou chaîne d’approvisionnement, relie
    les fournisseurs, les entrepôts, les transporteurs, les magasins et les clients. Ce domaine en assure l’[orchestration](glossary:TER031)
    : il suit les [commandes](glossary:TER012) et les [stocks](glossary:TER005), établit les engagements et adapte les choix
    lorsque la situation change.'
