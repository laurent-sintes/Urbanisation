      approach_summary: Supply Planning mobilise les décisions spécialisées et prépare les actions des capacités responsables.
    market_inspiration:
      choice: Planning regroupe Demand Planning et Supply Planning au sein de Supply Chain Orchestration.
      flow_scope: Plan de demande et plan de couverture régulièrement actualisés.
      flow_approach: Coordonner les deux plans et mobiliser les décisions spécialisées dans leur périmètre.
      synthesis:
      - Oracle distingue Demand Plan, Supply Plan et plan intégré ; SAP distingue Demand planning et Response and supply planning.
        Ces responsabilités éclairent les deux capacités FLOW, sans correspondance obligatoire des niveaux de catalogue.
      - Les objectifs de stock, la promesse et les opérations conservent leurs responsables. Planning est un regroupement
        par finalité du plan d’ensemble, pas le parent automatique de toute activité de simulation ou de toute décision.
      examples:
      - title: Réviser la couverture après une nouvelle demande
        situation: La demande anticipée évolue alors que les possibilités d’approvisionnement sont contraintes.
        outcome: Le plan de demande et le plan Supply sont réexaminés ensemble pour comparer les besoins et leur couverture.
        lesson: L’intégration des plans n’exige pas de fusionner les responsabilités de décision et de mise en action.
        source_title: Oracle — Overview of Supply Chain Planning Plan Types
        source_url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/26b/faupc/overview-of-supply-chain-planning-plan-types.html
