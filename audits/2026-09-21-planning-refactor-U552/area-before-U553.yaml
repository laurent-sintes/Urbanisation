node:
  id: D17
  revision: 2
  kind: area
  fields:
    name: Planning
    definition: Construire et actualiser le plan de demande et le plan de couverture de la Supply, en confrontant besoins
      anticipés, demandes connues et possibilités d’approvisionnement.
    finality: Maintenir une trajectoire cohérente entre besoins à couvrir et ressources mobilisables, à partir des faits et
      des hypothèses actualisés.
    scope: |-
      [Demand Planning](model:D17.a) prépare la demande à couvrir ; [Supply Planning](model:D17.b) prépare sa couverture. Les deux plans sont régulièrement actualisés et se confrontent, sans découpage imposé par la cadence de calcul ou l’outil.

      Les Areas opérationnelles gardent leur adaptabilité aux impondérables. Les décisions spécialisées conservent leurs responsabilités et peuvent être mobilisées par les plans. [Order Backlog Planning](model:D03.p) demeure dans Fulfillment Optimization. La planification de stock reste portée par [Inventory Optimization Planning](model:D05.f) dans son périmètre courant.
