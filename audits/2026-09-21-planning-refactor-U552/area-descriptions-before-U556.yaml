- id: D05
  revision: 8
  kind: area
  fields:
    name: Inventory Optimization
    definition: Optimiser le stock consiste à choisir un compromis entre disponibilité, immobilisation et risque, puis à décider
      des ajustements nécessaires.
    finality: Décider du stock souhaitable et des ajustements nécessaires.
    scope: |-
      L’area produit les paramètres et ajustements de stock à retenir selon le compromis entre disponibilité, immobilisation et risque. Les décisions spécialisées portent les cibles de couverture, les droits de protection des groupes, les apports initiaux de lancement, le réassort continu et la redistribution du stock existant. [Inventory Optimization Planning](model:D05.f) les mobilise pour construire, simuler, évaluer et valider un scénario cohérent, puis en déclencher l’application via les capacités responsables ; cette mobilisation n’est pas une décomposition en sous-capacités.

      Les calculs font partie des décisions. [Initial Stocking Decision](model:D05.g) détermine les apports du lancement ; [Replenishment Decision](model:D05.e) détermine les apports continus. Chacune intègre les besoins nets, contraintes, quantités et dates utiles à sa finalité. La redistribution et le réapprovisionnement demeurent distincts et coordonnés : leurs effets sur les stocks et manques sont pris en compte sans doublon. Les horizons restent opérationnels ; les prévisions et coûts peuvent être des entrées sans ajouter la planification de saison.

      Exemple fictif : retenir une cible magasin de 100 pièces et un seuil de réassort de 60 ; protéger une enveloppe pour un canal ; puis arbitrer entre apports et transfert depuis un site excédentaire. Une reconfiguration du service attendu peut conduire Inventory Optimization Planning à mobiliser de nouveau plusieurs décisions et comparer leurs effets ensemble.

      Stock Protection désigne la gouvernance/management discutée en U230/U231 ; la capacité courante reste [Supply Protection](model:D02.b), sans renommage implicite. Son application signifie mettre à jour transactionnellement les données correspondantes, à l’unité, par groupe ou en masse, par écrans, batch, flux ou streaming. Décider les paramètres ou valider un scénario ne réalise pas ces mises à jour à lui seul.

      La mise en action du réapprovisionnement engage les Orders ; [Service Requests](model:D04) les gère, [Fulfillment Optimization](model:D03) travaille leur satisfaction, les exécutants réalisent les prestations et [Inventory Management](model:D01) tient la connaissance des stocks et mouvements. La fonction de mise en action d’Inventory Optimization Planning déclenche les actions retenues et connaît leur prise en compte via ces capacités responsables ; aucune nouvelle capacité autonome de déclenchement n’est ajoutée dans D05. D03 cherche à satisfaire les Orders ; D05 cherche le stock souhaitable et ses ajustements. La distinction ne repose ni sur l’absence de commandes dans les entrées ni sur un partage global/individuel. La portée actuelle de Supply Assignment, incluant les besoins prévisionnels, est conservée.

      La mise en application peut être automatique selon les règles et autorités ; aucun contrôle humain systématique, séquencement fixe ou découpage logiciel imposé. Les notions transversales soutenant la définition des objets du modèle restent dans le glossaire de modélisation séparé.

      Inventory Optimization Planning est décrit par trois comportements : Scenario Construction, Simulation & Analysis et Scenario Execution Adaptation. Comparaison, validation et déclenchement restent dans son périmètre ; aucune nouvelle capacité de décision ni application transactionnelle absorbée.

      [Return Disposition Decision](model:D05.i) détermine le devenir logistique des produits retournés selon leur état, les politiques et la récupération de valeur. Inspection, décision et réalisation restent distinctes ; aucun remboursement ou remplacement client absorbé. Rattachement adopté U380.
