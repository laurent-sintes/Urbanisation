- id: D17
  revision: 4
  kind: area
  fields:
    name: Supply Planning
    definition: Établir et actualiser la demande à couvrir pour orienter les plans et décisions Supply, en rapprochant besoins
      anticipés, demandes connues et faits observés.
    finality: Maintenir une trajectoire cohérente entre besoins à couvrir et ressources mobilisables, à partir des faits et
      des hypothèses actualisés.
    scope: |-
      L’Area regroupe les responsabilités de planification d’ensemble retenues dans Supply Chain Orchestration. [Demand Planning](model:D17.a) construit et actualise la demande à couvrir, puis rend le résultat retenu applicable aux consommateurs. Le plan est régulièrement mis à jour ; la date ou la cadence de calcul ne définit pas sa frontière.

      La construction du plan amont qui produit les Planned Orders n’est pas reproduite dans une seconde capacité de couverture. Les demandes issues de ce plan sont prises en charge selon leur nature et leur qualification ; une demande planifiée ne vaut pas automatiquement commande ferme, réception ou engagement de ressources. La création du plan reste distincte de la gestion et de l’orchestration de ses suites.

      Les Areas opérationnelles gardent leur adaptabilité aux impondérables. [Order Backlog Planning](model:D03.p) demeure dans Fulfillment Optimization ; [Inventory Optimization Planning](model:D05.f) garde les ajustements opérationnels du stock. Les décisions spécialisées conservent leurs responsabilités et peuvent être mobilisées par les plans. Le nom Supply Planning ne justifie pas de déplacer toute activité de simulation ou de décision dans cette Area.
    market_comparisons:
    - vendor: Oracle
      product: Fusion Cloud Supply Chain Planning
      element_name: Supply Chain Planning plan types
      element_type: Responsabilité fonctionnelle documentée dans un produit
      relationship: Recouvrement partiel
      similarities: Oracle organise des plans de demande, de couverture et un plan intégré rapprochant les deux.
      differences: Les sources éditeur décrivent une planification plus large. FLOW conserve Demand Planning dans cette Area
        et ne reproduit pas le plan amont de couverture déjà producteur des Planned Orders. Le périmètre local ne se déduit
        pas d’un module produit.
      flow_position: Supply Planning est le nom de l’Area FLOW, centrée dans le périmètre courant sur la demande à couvrir.
        Le planning amont producteur de Planned Orders n’est pas dupliqué ; les Plannings opérationnels gardent leurs parents.
      source_title: Overview of Supply Chain Planning Plan Types
      source_url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/26b/faupc/overview-of-supply-chain-planning-plan-types.html
      source_version: 26B
      consulted_on: '2026-09-21'
      source_locator: 'Tableau : Demand Plan et Demand and Supply Plan.'
      evidence_limits: Le document distingue aussi backlog et réassort ; il ne prescrit pas de les déplacer dans cette Area
        FLOW.
      status: proposed
      source_refs:
      - U533
      - CMP218
      - ELM557
      - U553
      - CMP230
      - U555
      concept_name: Demand, Supply and integrated plans
      scope_summary: Plans de demande, de couverture et plan intégré au sein de Supply Chain Planning.
      approach_summary: Articuler prévision, besoins à couvrir et couverture, avec possibilités de plans séparés ou intégrés.
    - vendor: SAP
      product: Integrated Business Planning
      element_name: Response and supply planning
      element_type: Responsabilité fonctionnelle documentée dans un produit
      relationship: Recouvrement partiel
      similarities: SAP documente un plan de couverture sous contraintes, des scénarios, une collaboration et un lien vers
        les suites opérationnelles.
      differences: Les sources éditeur décrivent une planification plus large. FLOW conserve Demand Planning dans cette Area
        et ne reproduit pas le plan amont de couverture déjà producteur des Planned Orders. Le périmètre local ne se déduit
        pas d’un module produit.
      flow_position: Supply Planning est le nom de l’Area FLOW, centrée dans le périmètre courant sur la demande à couvrir.
        Le planning amont producteur de Planned Orders n’est pas dupliqué ; les Plannings opérationnels gardent leurs parents.
      source_title: Response and supply planning
      source_url: https://www.sap.com/sea/products/scm/integrated-business-planning/features/response-and-supply-planning.html
      source_version: Page évolutive ; édition non indiquée
      consulted_on: '2026-09-21'
      source_locator: Supply planning ; collaboration and simulations ; executional alignment.
      evidence_limits: Page fonctionnelle produit, pas référentiel d’Areas ; elle ne démontre pas que Supply Planning inclut
        universellement Demand Planning.
      status: proposed
      source_refs:
      - U533
      - CMP218
      - ELM552
      - U553
      - CMP230
      - U555
      concept_name: Response and supply planning
      scope_summary: Planification de couverture sous contraintes, simulation et articulation avec les suites opérationnelles.
      approach_summary: Comparer les possibilités de couverture et actualiser le plan à partir des contraintes et faits.
    market_inspiration:
      choice: Conserver Supply Planning comme Area du plan d’ensemble retenu dans FLOW, avec Demand Planning, sans recréer
        le planning amont qui produit déjà les Planned Orders.
      flow_scope: Construction et actualisation de la demande à couvrir, rendue applicable aux consommateurs.
      flow_approach: Confronter prévisions, demandes connues et faits observés ; distinguer leur planification de la gestion
        des demandes issues d’un plan amont.
      synthesis:
      - Oracle distingue plans de demande, de couverture et plan intégré ; SAP documente la couverture sous contraintes et
        présente Demand planning séparément. Ces références éclairent les responsabilités, sans imposer le périmètre du Domain
        FLOW.
      - FLOW conserve Demand Planning dans Supply Planning, nom d’Area retenu par Laurent. Le planning amont qui produit les
        Planned Orders est déjà pris en charge et n’est pas reproduit. L’Area courante ne correspond donc pas au module Supply
        Planning complet d’un éditeur.
      - Order Backlog Planning et Inventory Optimization Planning gardent leurs périmètres opérationnels. La qualification
        des demandes planifiées et leur transformation éventuelle en commandes fermes ne sont pas inférées de leur seule réception.
      examples:
      - title: Illustration FLOW — Actualiser la demande sans reconstruire le plan amont
        situation: Les ventes et précommandes font évoluer la demande anticipée ; des apports sont déjà planifiés en amont.
        outcome: Demand Planning révise la demande à couvrir ; la prise en charge des demandes planifiées reste distincte
          de la construction de leur plan d’origine.
        lesson: Distinguer demande, plan d’apports et gestion des demandes issues du plan évite une double responsabilité.
        source_title: Overview of Supply Chain Planning Plan Types
        source_url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/26b/faupc/overview-of-supply-chain-planning-plan-types.html
