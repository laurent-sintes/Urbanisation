  kind: capability
  fields:
    name: Supply Planning
    definition: Construire et actualiser le plan de couverture de ces besoins, compte tenu des approvisionnements possibles,
      des ressources et des contraintes.
    nature: planning
    scope: |-
      Le plan d’ensemble met en regard les besoins connus ou anticipés et les possibilités de couverture. Il peut préparer des demandes d’achat planifiées et réviser les apports envisagés. Une hypothèse d’approvisionnement ne vaut ni commande ferme, ni réception, ni ressource automatiquement réservable.

      Mobiliser les décisions spécialisées selon leur résultat : cibles et protections de stock, apports ou transferts, possibilités de services et contraintes des engagements. Leur utilisation par Planning ne change pas leur parent métier. [Inventory Optimization Planning](model:D05.f) porte actuellement les scénarios de stock ; leur articulation avec le plan d’ensemble doit éviter deux autorités concurrentes sur les mêmes choix.

      [Order Backlog Planning](model:D03.p) conserve les scénarios de satisfaction du carnet. [Purchase Order](model:D04.j), [Transfer Order](model:D04.k), [Consignment Replenishment Order](model:D04.r) et [Order Lifecycle Management](model:D04.o) conservent la prise en charge et les changements autorisés des demandes. La promesse, l’affectation, la réservation et la réalisation des prestations restent distinctes.

      Exemple fictif : une disponibilité fournisseur réduite conduit à comparer des apports et dates alternatifs, puis à soumettre les modifications retenues aux capacités responsables. Les faits de prise en compte et de réalisation alimentent la révision du plan.
