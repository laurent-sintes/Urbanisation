- id: BHV091
  revision: 1
  kind: behavior
  fields:
    name: Simulation & Analysis
    definition: Comparer les scénarios et leurs conséquences, avec possibilité de conclure sans appliquer.
    finality: Éclairer le choix en comparant les effets de scénarios avant d’en engager les conséquences.
