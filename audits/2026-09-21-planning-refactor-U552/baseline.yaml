- id: D03.p
  revision: 7
  kind: capability
  fields:
    name: Order Backlog Planning
    definition: Construire, comparer et maintenir les scénarios de satisfaction du carnet d’Orders, en mobilisant les décisions
      spécialisées, puis appliquer les affectations du plan retenu et suivre leur prise en compte.
    nature: planning
    finality: Transformer les scénarios de satisfaction du carnet en une préparation cohérente de leur prise en charge, en
      conservant la maîtrise des engagements.
    scope: |-
      Construire, comparer et maintenir les scénarios de satisfaction du carnet en mobilisant Fulfillment Plan Decision et les décisions spécialisées. Planning peut être humain, automatisé ou mixte ; il travaille les hypothèses et leurs impacts et porte la mise en application du scénario retenu.

      Exemple fictif : comparer une hypothèse privilégiant les ouvertures de magasins et une autre préservant davantage les dates promises. Les décisions produisent les scénarios cohérents ; Planning organise leur examen et prépare celui qui sera engagé.

      Planning prépare et applique le scénario retenu ; Order Lifecycle Management porte Order Release, qui autorise la prise en charge ; Process Orchestration coordonne les services. Son comportement Supply Assignment applique les affectations, Fulfillment Commitment gère les engagements de promesse. Structuring organise les découpages et compositions autorisés, dont Split. Préparer 60 pièces maintenant et 40 plus tard n’impose pas deux commandes clients.

      U420 : Order Release demeure sous Lifecycle, désormais dans D04 ; Planning le mobilise pour autoriser la prise en charge du scénario préparé. Supply Assignment est un comportement direct de Planning. Compléter sans remettre en jeu les liens existants et réviser les liens modifiables sont des modalités conservées dans ce comportement, sans sous-niveau supplémentaire. Maintenir les scénarios du carnet reste distinct du choix d’adaptation des processus opérationnels.

      La configuration des protections reste portée par [Supply Protection](model:D02.b), extérieure à ce Planning. Appliquer un plan ne donne pas autorité pour modifier silencieusement ces règles, les réservations, les promesses ou les restrictions des Orders. La validation d’un scénario ne prouve pas son application effective.
