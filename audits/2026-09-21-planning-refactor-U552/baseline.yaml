      status: proposed
      source_refs:
      - U533
      - CMP218
      - ELM556
      concept_name: Demand planning
      scope_summary: Actualiser un plan de demande à partir de prévisions et signaux connus.
      approach_summary: Distinguer plan de demande, demandes connues et engagements ; le calcul de prévision ne constitue
