- id: BHV092
  revision: 1
  kind: behavior
  fields:
    name: Scenario Authorization
    definition: Retenir, faire revoir ou abandonner une proposition et préciser ses conditions d’application.
    finality: Rendre explicites les conditions auxquelles un scénario peut être appliqué ou doit être revu.
    scope: |-
      Recueillir le scénario proposé et les conséquences exposées, puis déterminer s’il peut être appliqué, doit être modifié ou doit être abandonné. Conserver la décision, sa portée et ses conditions. Une personne peut intervenir, ou une politique déléguée peut autoriser les suites selon le contexte.

      [Fulfillment Plan Decision](model:D03.o) établit la cohérence du plan ; ce comportement porte l’autorisation de ses suites dans la demande. Les règles de délégation et les contraintes applicables restent explicites. Il ne reprend pas automatiquement l’Order Release des commandes concernées et ne lève aucune réservation, protection ou engagement.

      Exemple fictif : autoriser une nouvelle répartition uniquement si les commandes déjà engagées sont préservées ; sinon demander une nouvelle simulation. Une autorisation ne prouve pas l’application effective.
