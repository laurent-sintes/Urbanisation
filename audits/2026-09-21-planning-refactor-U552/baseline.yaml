- id: D17.a
  revision: 1
  kind: capability
  fields:
    name: Demand Planning
    definition: Construire et actualiser le plan de demande à couvrir, en rapprochant prévisions, ventes observées et demandes
      connues, dont les précommandes B2B.
    nature: planning
    scope: |-
      Le plan rapproche les besoins anticipés et les demandes déjà connues, selon leurs horizons et leur qualification. Les faits de vente et les précommandes B2B peuvent alimenter son actualisation ; la prise en compte d’une précommande ne la transforme pas en engagement ferme.

      Construire des scénarios, en comparer les effets et réviser le plan demeure distinct de la tenue des commandes dans [Sales Order](model:D04.i), de leur priorité dans [Order Prioritization](model:D03.m) et de leur promesse dans [Order Promising](model:D15). Les résultats de prévision et les références produit sont de natures différentes.

      Le plan est confronté aux possibilités et contraintes de [Supply Planning](model:D17.b). Les décisions spécialisées déterminent leurs résultats propres ; les arbitrages portant sur la demande à retenir restent à expliciter sans les attribuer aux décisions de stock ou de satisfaction.

      Exemple fictif : des précommandes professionnelles reçues tôt éclairent la demande d’une future saison, avec les ventes observées et les autres prévisions. Le plan est révisé sans modifier à lui seul le contenu ni les engagements de ces commandes.
    market_comparisons:
    - vendor: SAP
      product: Integrated Business Planning
      element_name: Demand planning
      element_type: Responsabilité fonctionnelle documentée dans un produit
      relationship: Recouvrement partiel
      similarities: Actualiser un plan de demande à partir de prévisions et signaux connus.
      differences: Offre incluant des algorithmes et du demand sensing ; pas preuve des méthodes de MAP ni d’une taxonomie
        de décisions FLOW.
      flow_position: Distinguer plan de demande, demandes connues et engagements ; le calcul de prévision ne constitue pas
        un engagement client.
