- id: D04.s
  revision: 1
  kind: capability
  fields:
    name: Order Backlog Optimization Request
    nature: action
    request_origins:
    - backoffice
    definition: Prendre en charge une demande de réexamen du carnet, préciser son objectif, son périmètre et ses contraintes,
      et suivre les scénarios étudiés, les décisions prises et les suites autorisées.
    finality: Donner un objectif, un périmètre et un suivi explicites aux travaux internes qui réexaminent la satisfaction
      du carnet de commandes.
    scope: |-
      Cette demande interne porte le réexamen d’un carnet de commandes : le motif, les commandes et ressources concernées, les objectifs, les contraintes et le résultat attendu. Elle conserve les hypothèses comparées, les décisions et le suivi des suites autorisées.

      Le réexamen peut être motivé par une promesse menacée, une revue régulière ou une étude volontaire. Un retard fournisseur est un événement externe, mais l’initiative de réoptimisation de la Supply est ici Backoffice. Une étude peut se terminer utilement sans appliquer de changement. Les comportements de déclenchement et d’activité peuvent se combiner ; ils ne forment pas un cycle obligatoire.

      [Order Backlog Planning](model:D03.p) construit et examine les scénarios ; [Fulfillment Plan Decision](model:D03.o) détermine un plan cohérent ; [Supply Assignment](model:D02.e) applique les affectations autorisées. La demande précise le travail à mener et en suit la prise en charge, sans absorber ces responsabilités. L’autorisation d’un scénario ne vaut ni réservation de ressources ni modification de promesse ; [Reservation](model:D02.c) et [Fulfillment Commitment](model:D03.n) conservent leurs effets propres.

      Exemple fictif : un arrivage est reporté de deux jours. La Supply engage une étude sur les commandes touchées, compare le maintien des priorités et une autre répartition admissible, puis suit soit l’application autorisée, soit la décision de ne pas modifier le plan. Aucun seuil, responsable organisationnel ou recalcul systématique n’est présumé.
    decomposition_rationale: Les trois modes de déclenchement distinguent reprise ciblée après une difficulté, revue régulière
      et étude volontaire. Les trois activités distinguent exploration sans effet opérationnel, autorisation du scénario et
      suivi de sa prise en compte. Cette lecture rend le métier de la demande explicite, même lorsque plusieurs activités
      mobilisent des capacités existantes ; aucun sous-comportement ou enchaînement obligatoire n’est créé.
    market_comparisons:
    - source_title: Explore Service Requests and Resolutions
      source_url: https://trailhead.salesforce.com/content/learn/modules/request-management-for-agentforce-it-service/explore-service-requests-and-resolutions
      source_version: Agentforce IT Service ; cours évolutif sans édition précisée
      source_locator: Service Requests ; Request Tracking ; Resolving Requests
      consulted_on: '2026-09-19'
      evidence_limits: Cours primaire consulté. Services aux employés ; aucune taxonomie Supply ou Backoffice universelle
        imposée.
      source_refs:
      - ELM498
      - U501
      - CMP202
      vendor: Salesforce
      product: Agentforce IT Service
      element_name: Service Request
      element_type: Concept et fonctionnement documentés
      relationship: Recouvrement partiel
      similarities: Une demande interne a un objectif et une progression.
      differences: Le service aux employés diffère de l’optimisation Supply.
      flow_position: La demande porte le travail interne à mener, ses décisions et ses suites ; les capacités spécialisées
        assurent le traitement.
      status: proposed
      concept_name: Service Request
      scope_summary: Demandes internes suivies.
      approach_summary: Qualifier, approuver si nécessaire et suivre la demande.
    - source_title: Why You Use Backlog Management
      source_url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/25d/faubm/why-you-use-backlog-management.html
      source_version: Oracle Fusion Cloud SCM 25D
      source_locator: Pain Points in Order Management ; How Backlog Management Helps
      consulted_on: '2026-09-19'
      evidence_limits: Documentation primaire consultée. Parcours produit de réexamen du carnet ; aucun dossier FLOW ou type
        de comportement imposé.
      source_refs:
      - ELM496
      - U501
      - CMP202
      vendor: Oracle
      product: Backlog Management
      element_name: Backlog Management
      element_type: Concept et fonctionnement documentés
      relationship: Recouvrement partiel
      similarities: Le carnet existant peut nécessiter une nouvelle étude.
      differences: Oracle décrit le traitement ; FLOW explicite aussi la demande qui le porte.
      flow_position: La demande porte le travail interne à mener, ses décisions et ses suites ; les capacités spécialisées
        assurent le traitement.
      status: proposed
      concept_name: Backlog Management
      scope_summary: Commandes dont la satisfaction mérite un réexamen.
      approach_summary: Comparer des possibilités avant application.
    market_inspiration:
      choice: Donner une prise en charge explicite au travail d’optimisation du carnet. Order Backlog Optimization Request
        porte son objectif, les scénarios étudiés, les décisions et les suites autorisées.
      flow_scope: Demandes internes de réexamen du carnet, jusqu’à une conclusion avec ou sans application.
      flow_approach: Distinguer déclenchement, étude, autorisation et prise en compte, en mobilisant les capacités responsables.
      synthesis:
      - Salesforce illustre la demande interne comme travail suivi ; Oracle éclaire le besoin de réexaminer les commandes.
        Les deux approches soutiennent des aspects différents de notre choix.
      - FLOW nomme cette famille pour rendre sa finalité lisible. Le nom composé et le regroupement en six comportements sont
        nos choix de modèle, sans taxonomie commune imposée par les éditeurs.
      examples:
      - title: Illustration FLOW — Un arrivage retardé menace plusieurs commandes
        situation: Un arrivage retardé menace plusieurs commandes.
        outcome: Une demande cadre le réexamen et conserve les scénarios, la décision et son résultat.
        lesson: Le retard est le motif ; la demande porte le travail de réponse. Cet exemple FLOW ne décrit aucun déploiement
          installé.
        source_title: Why You Use Backlog Management
        source_url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/25d/faubm/why-you-use-backlog-management.html
