      choice: Rechercher un stock adapté demande d’arbitrer ensemble apports, rééquilibrages et autres ajustements. Inventory
        Optimization Planning porte ce plan et son application, sans objectif systématique de remplissage ou de vidage.
      flow_scope: Plans d’ajustement du stock conciliant disponibilité, capital immobilisé, coûts et risques.
      flow_approach: Construire, comparer, actualiser et appliquer le plan en mobilisant les décisions spécialisées et les
        capacités partenaires.
      synthesis:
      - SAP et RELEX décrivent Inventory Optimization comme un compromis entre disponibilité, niveau et positionnement du
        stock, incertitude et coûts. SAP insiste sur les cibles qui alimentent les plans Supply ; ces cibles restent portées
        par une décision spécialisée dans FLOW.
      - Oracle illustre les variantes de scénario et la mise en application ; Microsoft la coexistence de plans. FLOW distingue
        le travail sur le plan, les décisions mobilisées, la configuration consommée et les gestions partenaires. Le nom complet
        Inventory Optimization Planning explicite ce choix de modèle, sans revendiquer une nomenclature universelle.
