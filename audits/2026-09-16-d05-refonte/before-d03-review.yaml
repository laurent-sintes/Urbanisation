proposals:
- topic: ATP/CTP
  state: ai_proposed
  candidates:
  - name: ATP Decision
    result: Établir les quantités et dates admissibles pour une promesse à partir des ressources présentes et des réceptions
      prévues admissibles.
  - name: CTP Decision
    result: Établir les quantités et dates réalisables en tenant compte des matières, capacités et délais nécessaires à une
      ressource supplémentaire.
  open_issue: Deux capacités autonomes ou deux modalités de faisabilité ? Préserver Promise Proposal comme composition d’une
    proposition et Promise Confirmation comme engagement.
- topic: Supply Creation Decision
  target_id: D03.h
  state: ai_proposed
  candidate_name: Resource Provisioning Decision
  meaning: Décider de recourir à un approvisionnement ou une production supplémentaire pour rendre la promesse possible. Ne
    vaut pas autorisation de commande d’achat. Articulation CTP à éprouver.
- topic: Fractionnement et échéancement
  state: ai_proposed
  candidate_name: Delivery Schedule Decision
  meaning: Choisir une réponse complète ou partielle et les couples quantité/date admissibles. Une commande peut porter plusieurs
    échéances ; plusieurs commandes ne sont pas imposées. Séparation éventuelle du choix multi-source déjà couvert par Fulfillment
    Source Decision.
- topic: Allocation Eligibility Decision
  target_id: D03.d
  state: ai_proposed
  candidate_name: Allocation Decision
  meaning: 'Nom court à éprouver : quelle quantité l’Order peut-il mobiliser au regard des protections et droits ? Distinguer
    cet arbitrage de l’affectation aux ressources identifiées dans Supply Assignment.'
- topic: Vocabulaire
  state: ai_proposed
  terms:
    Resource: Notion générique de moyen mobilisable ; préciser Material Resource pour les biens physiques présents ou futurs.
    Goods: 'Marchandises : biens qui circulent physiquement, produits finis, matières et composants.'
    Item: Référence de ce qui est commandé ou stocké ; pas une quantité de biens.
    Supply: Mise à disposition ou approvisionnement d’une ressource ; pas synonyme du bien.
    Case: Demande de la couche processus.
    Order: Commande de pilotage Supply.
    Requirement: Besoin exprimé, éventuellement issu d’une commande, d’une prévision ou d’une simulation ; ne crée pas automatiquement
      un Case.
  open_issue: La promesse peut-elle être interrogée avant enregistrement d’un Order ? Ne pas imposer un Order pour toute simulation.
- topic: Complétude
  state: ai_proposed
  open_issue: Examiner priorité entre commandes, arbitrage entre scénarios et acceptation d’un reliquat ; déterminer si aptitudes
    autonomes ou règles des capacités existantes. Aucun catalogue exhaustif revendiqué.
discussion_U148:
  state: under_instruction
  source_refs:
  - U148
  outcomes:
  - name: ATP Decision
    meaning: Proposer les quantités/dates réalisables à partir du stock et des engagements admis, sous les politiques applicables
      ; aucune modification des engagements tiers ni des protections dans ce scénario.
    open_issue: Le périmètre limité aux achats fermes est une règle locale à confirmer, plus restrictive que certaines méthodes
      de marché.
  - user_name: CTP
    candidate_name: Promise Feasibility Planning
    candidate_state: ai_proposed
    meaning: Proposer un plan cohérent d’adaptation des entrées, sorties et protections pour honorer une commande ; identifier
      impacts et conditions, sans appliquer automatiquement ces changements.
    market_limit: Plus large que le CTP décrit par Microsoft ; redistribution des confirmations documentée par SAP sous Backorder
      Processing. Aucun nom de marché équivalent exact établi.
  retirement_hypotheses:
  - target_id: D03.d
    condition: Intégrer droits et protections dans ATP ; conserver les règles même sans capacité autonome.
  - target_id: D03.h
    condition: Intégrer le choix de ressources supplémentaires dans le plan d’adaptation ; Supply Assignment seul ne crée
      ni approvisionnement ni production.
  delivery_schedule:
    state: under_instruction
    user_position: Besoin confirmé
    definition_status: Proposition de définition à préciser ; liste active inchangée
  preserved_boundaries:
  - Calculer/proposer ne vaut pas confirmer ni réserver/affecter.
  - Modifier une confirmation ne vaut pas modifier ou annuler la commande.
  - Proposer un changement de protection ne vaut pas administrer sa source de vérité.
  - CTP ne doit pas devenir un nom de marché revendiqué pour toute adaptation.
