domain_proposal_U233:
  date: '2026-09-16'
  state: ai_proposed
  source_refs:
  - U233
  basis_source_refs:
  - U223
  - U224
  - U229
  - U230
  - U231
  - U232
  domain_id: D05
  domain_name: Inventory Optimization
  definition_rule: Conserver exactement la définition adoptée U223.
  scope_proposal: Évaluer le stock souhaitable et les ajustements sur les horizons opérationnels ; produire des décisions
    et permettre leur reconfiguration, simulation et validation. Prévisions et coûts sont des entrées, sans ajouter la planification
    de saison.
  capabilities:
  - name: Coverage Target Decision
    definition: Déterminer les niveaux de stock et seuils à retenir par produit, lieu et horizon, selon les objectifs de service,
      les délais et les risques.
    result: Cibles et seuils de couverture, de sécurité et de réassort.
  - name: Stock Allocation Decision
    definition: Déterminer les quantités protégées ou limites d’usage à retenir pour les canaux et groupes de bénéficiaires.
    result: Répartition des droits d’usage, quotas et protections ; distincte d’une réservation pour un Order.
  - name: Replenishment Decision
    definition: Déterminer les apports de réapprovisionnement à prévoir, en quantités et dates, compte tenu des besoins, des
      stocks admissibles et des apports déjà engagés.
    result: Compléments recommandés pour remplir le stock, par achat ou réassort du réseau habituel.
  - name: Stock Redistribution Decision
    definition: Déterminer les transferts de stock existant à retenir pour corriger les excédents et insuffisances entre sites.
    result: Rééquilibrages recommandés, avec quantités, origines, destinations et dates pertinentes.
  - name: Inventory Planning
    definition: Reconfigurer les hypothèses et contraintes, mobiliser les décisions de stock, simuler leurs conséquences et
      valider un scénario cohérent.
    result: Scénario retenu avec paramètres et ajustements ; maintien de leur cohérence, sans application transactionnelle
      implicite.
  relationships: Inventory Planning mobilise les quatre décisions ; relation fonctionnelle proposée, pas une relation contains
    ou une hiérarchie adoptée.
  boundaries:
  - Stock Protection conserve son rôle de gouvernance/management et de mise à jour transactionnelle selon U230/U231.
  - La mise en action engage les Orders ; D04 gère leur cycle, D03 leur satisfaction et les exécutants les prestations.
  - Une décision ou validation de scénario ne modifie pas à elle seule les données opérationnelles et ne déclenche pas nécessairement
    un Order.
  - Réapprovisionnement et redistribution sont coordonnés afin de ne pas couvrir deux fois le même manque.
  - Le Planning ne suppose ni revue humaine systématique, ni processus séquentiel fixe, ni moteur logiciel distinct.
  existing_model_delta_proposed:
  - Préciser Coverage Target Decision et conserver Stock Redistribution Decision comme responsabilités distinctes.
  - Ajouter Stock Allocation Decision, Replenishment Decision et Inventory Planning.
  - Ne plus exposer Net Requirements Calculation comme capacité autonome ; préserver son calcul dans les décisions concernées.
    Identités et historique à traiter lors d’une application autorisée.
  market_status: Noms et définitions locaux proposés. Les comparaisons U225 appuient la séparation fonctionnelle, pas une
    équivalence complète de ces cinq capacités avec un catalogue éditeur.
  implementation: Aucun nœud, relation, glossaire ou publication modifié. Les sens transversaux restent exclusivement dans
    modeling-glossary.yaml.
