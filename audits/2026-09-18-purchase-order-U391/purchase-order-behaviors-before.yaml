id: PURCHASE-ORDER-BEHAVIORS-U390
status: proposed
source_refs:
- U390
- U389
- ELM235
- CMP146
capability_id: D04.j
baseline_sha256: 5cab3e681cedef51aabcc136f42511ec084f9845a4d871e9e80c377dd998a647
proposed_definition: Prendre en charge les commandes d’achat de biens ou de prestations adressées aux fournisseurs, maintenir
  les attentes et les évolutions autorisées et rapprocher les réalisations pour connaître le reste à satisfaire.
decomposition_rationale: 'Les parcours changent la nature de l’attendu, la destination, les dépendances entre commandes et
  les preuves de réalisation : apport en stock, livraison directe au client, prestation. Cette différence métier justifie
  la décomposition sans recopier le cycle de vie commun.'
proposals:
- id: PO-P01
  name: Stock Procurement
  definition: Prendre en charge l’achat de marchandises destinées à entrer dans le stock du réseau et suivre les apports attendus
    jusqu’à leur réception.
  mechanism: Parcours d’approvisionnement physique avec quantités et échéances restant à recevoir.
  benefit: Fiabiliser les apports futurs sans confondre commande fournisseur, arrivée et stock disponible.
  example: 'Exemple fictif : achat de 2 000 vestes destinées à un entrepôt ou directement à des magasins.'
  boundary: D05/D03 déterminent les besoins ou réponses ; D06 suit les prestations et D01 enregistre le stock. Aucun comportement
    distinct par type de site.
  source_ids:
  - PO-S1
  naming: Libellé descriptif FLOW proposé ; la source établit le mécanisme, pas ce nom comme niveau de capacité.
  status: proposed
  parent_id: D04.j
  differentiating_form: process_variant
- id: PO-P02
  name: Direct Delivery
  definition: Prendre en charge un achat dont le fournisseur livre directement le client, en conservant le lien avec la commande
    de vente concernée.
  mechanism: Coordination des attentes achat et vente, des destinations et des preuves de livraison.
  benefit: Éviter un faux apport au stock interne et rendre explicables les conséquences d’un écart fournisseur pour le client.
  example: 'Exemple fictif : un fournisseur livre 100 pièces directement à un client wholesale.'
  boundary: Livrer un magasin de notre réseau relève du premier parcours lorsque l’objectif est son stock. La décision de
    sourcing, la promesse et l’orchestration restent distinctes ; pas de propagation automatique implicite.
  source_ids:
  - PO-S2
  naming: Terme natif Microsoft ; variante FLOW à valider.
  status: proposed
  parent_id: D04.j
  differentiating_form: process_variant
- id: PO-P03
  name: Service Procurement
  definition: Prendre en charge l’achat d’une prestation et suivre ce qui est attendu puis reconnu réalisé, selon les conditions
    applicables.
  mechanism: Attente de prestation et constat de réalisation, au lieu d’un apport d’articles à recevoir.
  benefit: Distinguer engagement d’achat, réalisation opérationnelle et résultat du service.
  example: 'Exemple fictif : commande de réparation de 50 pièces auprès d’un prestataire.'
  boundary: D04 porte l’achat ; D06 sollicite, orchestre et suit les services via les Service Orders. Pas de Purchase Order
    imposée pour chaque appel de service ; comptabilité et négociation contractuelle hors périmètre. Extension explicite de
    la définition actuelle centrée sur les biens.
  source_ids:
  - PO-S1
  - PO-S3
  naming: Vocabulaire SAP de procurement de services ; sélection à la maille FLOW proposée.
  status: proposed
  parent_id: D04.j
  differentiating_form: process_variant
additional_candidate:
  name: Consignment Procurement
  status: boundary_to_examine
  source_ids:
  - PO-S4
  rationale: Acquérir du stock déjà détenu physiquement sous propriété fournisseur ; différence métier pertinente.
  unresolved: Séparer gestion du stock fournisseur et acte d’acquisition. Ne pas placer tout le cycle de consignation sous
    Purchase Order ni présumer l’applicabilité Beaumanoir.
exclusions:
- Brouillon, affermissement, gel, attente et annulation restent dans Order Lifecycle Management.
- Livraisons partielles et échéanciers restent des explications communes tant qu’un bénéfice de décomposition supplémentaire
  n’est pas démontré.
- Un remplacement à la suite d’un Supplier Return est une origine de besoin ; il ne justifie pas seul un comportement d’achat
  supplémentaire.
- Sous-traitance industrielle et achats indirects généraux non instruits dans cette passe ; ne pas étendre implicitement FLOW
  à tout Procurement.
market_comparisons:
- comparison_ref: CMP146
  source_ids:
  - PO-S1
  - PO-S2
  - PO-S3
  relationship: Recouvrement partiel
  similarities: Biens et services achetés ; livraison directe avec lien achat/vente ; preuve de prestation réalisée.
  differences: Les éditeurs décrivent documents, processus et fonctions. FLOW propose trois comportements sous une capacité
    d’action sans adopter leur taxonomie produit.
  flow_position: Socle de trois variantes proposé ; frontière Service Procurement / Service Order explicitée.
  status: proposed
- comparison_ref: CMP146
  source_ids:
  - PO-S4
  relationship: Piste de décomposition
  similarities: Acquisition dissociée de la réception physique.
  differences: Consignation traverse plusieurs capacités et ne se résume pas au Purchase Order.
  flow_position: Candidat conservé à instruire ; aucun quatrième comportement adopté.
  status: under_review
