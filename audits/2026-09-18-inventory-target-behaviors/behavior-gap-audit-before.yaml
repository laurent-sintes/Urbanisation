  user_requirement: '"Le mandat de traçabilité numérique reste également acquis." => Je pense que c''est une visibilité explicite.
    Si on appelle par exemple un service numérique de vérification quelconque comme un code barre, un dispositif anti fraude,
    une vérification d''identité, une production documentaire numérique etc. on doit pouvoir en avoir une visibilité claire.'
  requirement_sha256: c1df8fd728d900910eb0a9396f9db3db03927369e100308186c7c329ee1ad0ca
  name: Digital Service Visibility
  kind: behavior
  parent_id: D07.d
  definition: Rendre visibles la progression et les résultats des prestations numériques sollicitées, en reliant chaque demande,
    ses tentatives et ses réponses aux objets et opérations métier concernés.
  scope: Vérification de code-barres, contrôle antifraude, vérification d’identité, production documentaire et autres prestations
    numériques. Exposer sollicitation, prise en charge connue, traitement en cours, résultat ou absence de réponse ; ces situations
    ne constituent pas un cycle universel imposé.
  rationale: Une demande acceptée peut rester sans résultat ; un appel techniquement réussi peut produire un résultat métier
    défavorable. Relier demande, réponses asynchrones, tentatives et objet métier permet de savoir si la prestation attendue
    a réellement abouti et avec quel effet.
  example: Le service antifraude a répondu correctement, mais son résultat est une suspicion à examiner. La prestation est
    terminée ; la commande peut rester en attente. Un service documentaire peut avoir accepté la demande sans avoir encore
    produit le document.
  boundary: La visibilité constate faits, progression et résultats ; elle ne décide ni l’acceptation d’un risque ni la suite
    de l’Order. Orchestration et adaptation gardent leurs responsabilités. D14 décrit les services offerts ; ce comportement
    observe leurs sollicitations effectives. Ne pas créer un comportement par service ou interface. Les traces numériques
    des opérations physiques peuvent alimenter leur visibilité sans changer leur nature.
  market_comparison: Microsoft documente le suivi des exécutions et la corrélation avec des étapes métier ; Camunda emploie
    Process Observability. Ces périmètres étayent le besoin, mais les sources consultées ne donnent pas un intitulé normalisé
    exactement équivalent. Digital Service Visibility est un libellé FLOW proposé, plus ciblé que le suivi de tout un processus
    et cohérent avec les trois Visibility adoptés.
  validation_scope: Besoin explicite issu de Laurent ; nom, définition éditoriale, bénéfice formulé et quatrième rattachement
    proposés. Accord U305 sur les trois comportements logistiques inchangé.
  catalog_changed: false
