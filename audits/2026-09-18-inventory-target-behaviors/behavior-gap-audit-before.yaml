- id: P08
  parent_id: D01.d
  name: Recurring Stock Verification
  status: proposed
  priority: P2
  definition: Fiabiliser le stock par une vérification organisée et récurrente des quantités sur un périmètre défini.
  differentiating_criterion: politique
  decomposition_rationale: La récurrence assure une couverture de contrôle indépendamment des incidents visibles.
  example: Vérifier régulièrement les articles à enjeu, rapprocher les quantités constatées et instruire les écarts.
  boundary: Programme et mandat à préciser ; FLOW ne récupère pas automatiquement le comptage physique du WMS.
  market_sources:
  - S01
  needs:
  - D01.c
  - D01.f
  - D01.g
  validation_question: FLOW porte-t-il la politique de fiabilisation ou seulement le traitement des constats fournis par l’exécutant
    ?
  source_refs:
  - U292
  - CMP098
- id: P09
  parent_id: D01.d
  name: Triggered Stock Verification
  status: proposed
  priority: P2
  definition: Fiabiliser une quantité lorsque des signaux rendent sa crédibilité insuffisante pour les usages métier.
  differentiating_criterion: mécanisme
  decomposition_rationale: Concentrer un contrôle sur une situation à risque et non seulement sur un calendrier.
  example: 'Un picking échoue alors que le stock est annoncé disponible : solliciter un constat, puis traiter l’écart établi.'
  boundary: Microsoft documente le seuil ; l’échec de picking est notre cas proposé. Détecter le signal ne donne pas autorité
    de correction automatique.
  market_sources:
  - S01
  - S21
  needs:
  - D07.d
  - D01.c
  - D01.g
  validation_question: Quels signaux autorisent une demande de vérification et qui peut faire corriger la quantité ?
  source_refs:
  - U292
  - CMP098
- id: P10
  parent_id: D07.d
  name: Execution Exception Detection
  status: needs_reassessment_U298
  priority: P2
  definition: Identifier les écarts de progression et l’absence de retours attendus afin d’alimenter la réaction opérationnelle.
  differentiating_criterion: bénéfice ciblé
  decomposition_rationale: Un tracking qui enregistre uniquement les événements reçus ne révèle pas les silences qui mettent
    le plan en risque.
  example: 'À 14 h, aucun retour de préparation attendu à 13 h : signaler un manque d’information ; confirmer le retard physique
    séparément.'
  boundary: 'Pas de nouvelle promesse ni de décision d’adaptation. Le catalogue de services doit préciser retours attendus
    et tolérances. U293 : ce comportement ne résume pas Execution Tracking ; la visibilité normale du transit reste essentielle.'
  market_sources:
  - S19
  - S20
  needs:
  - D07.b
  - D14.a
  - D06.b
  validation_question: Valider la détection ; préciser ensuite les signaux probants, estimés et absents ? Source SAP historique,
    validation métier particulièrement importante.
  source_refs:
  - U292
  - CMP098
  review_note: Les exceptions logistiques font partie du périmètre de Logistics Visibility. Un comportement distinct ne doit
    pas les dupliquer et doit justifier un bénéfice supplémentaire, notamment si sa portée concerne d’autres prestations.
    Correction validée U299 ; fiche initiale conservée pour réexamen, pas de création autonome adoptée.
  correction_source_refs:
  - U299
- id: P11
