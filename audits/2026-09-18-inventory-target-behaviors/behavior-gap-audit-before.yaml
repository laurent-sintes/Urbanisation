as_of: '2026-09-17'
purpose: Analyse comparative des comportements manquants après refonte U290.
status: proposed
author: Codex
source_refs:
- U292
- ELM191
- CMP098
- U293
- CMP099
- U294
- CMP100
- U295
- CMP101
- U296
- CMP102
- U297
- U298
- U299
- U300
- CMP103
decision_boundary: Étude autorisée ; aucun nouveau comportement, nom ou rattachement adopté. Catalogue actif et publications
  inchangés. U297 adopte le nom Logistics Visibility dans la portée de feedback_U297 ; autres propositions et rattachements
  non adoptés. U299 valide les deux corrections P04/P10 dans adopted_corrections_U299, sans adoption de leurs fiches comme
  comportements autonomes.
baseline:
  path: modeles/backlog/model.yaml
  sha256: a75cec76a3d7aaba9fd8a8e38709053dd26887cb9e6fe7a6b043005174d068cf
  nodes: 74
  capabilities: 40
  behaviors: 16
  relations: 227
  scope: Backlog refondu U290 ; pas la release Atlas. Six projections de référentiels incluses. Business Services non décomposé
    exclu de toute conclusion de complétude.
  market_enrichment_source: U311
methodology:
  comparison_unit: Mécanisme, politique, variante ou bénéfice ciblé ; pas opération, API, écran ou modalité technique.
  inference: Les faits éditeurs sont séparés de nos rattachements proposés. Les niveaux de leurs produits ne sont pas équivalents
    aux niveaux FLOW.
  evidence: Guides documentaires privilégiés ; pages commerciales utilisées comme indices de principe avec limites. Aucun
    score de couverture ou de déploiement.
  completeness: Revue des 39 capacités FLOW, échantillon documentaire ciblé de sept éditeurs. Pas inventaire exhaustif de
    toutes les versions ou fonctionnalités du marché. U293 ajoute Camunda comme appui de réalisation des processus, pas comme
    huitième catalogue Supply.
  scenarios: Cas fictifs d’épreuve du modèle ; aucune observation de GBM, Boardriders ou Sarenza. Sarenza reste non évalué.
findings:
- Capacité → Comportement reste suffisante pour les mécanismes étudiés ; aucune nécessité démontrée d’un niveau supplémentaire.
- 35 capacités sans comportement ne constituent pas 35 lacunes ; décomposition seulement avec bénéfice ou complexité justifiée.
- Sept candidats à instruire, cinq options conditionnelles, trois candidats à réexaminer et un retrait parmi les seize fiches
  initiales. Aucun candidat nouveau adopté collectivement.
- 'Logistics Visibility : nom adopté U297 pour le parcours U296 ; niveau, rattachement et détails éditoriaux encore à instruire.'
- Les quatorze comportements existants restent utiles ; enrichir leurs contrats avant de multiplier les nœuds.
- Les sept arbitrages de responsabilité et de contrat restent ouverts ; ils ne se résolvent pas par un changement de vocabulaire.
- 'Synthèse consolidée U298 : les propositions et comptes antérieurs sont conservés dans les feedbacks datés et les captures
  historiques, sans redevenir la recommandation courante.'
- 'U299 adopte les corrections P04/P10 : pas de doublon des exceptions logistiques ; pas de comportement autonome de coordination
  par dépendances sans bénéfice distinct.'
