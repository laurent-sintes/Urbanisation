positioning_U300:
  status: granularity_reopened_U303
  source_refs:
  - U300
  - U296
  - U297
  - U299
  - CMP103
  market_sources:
  - S29
  - S38
  - S41
  name: Logistics Visibility
  name_approval: U297
  kind: behavior
  parent_id: D07.d
  parent_name: Execution Tracking
  domain_id: D06
  domain_name: Execution Management
  recommendation: Décrire Logistics Visibility comme comportement d’Execution Tracking dans D06 Execution Management. Maintenir
    la capacité générique de suivi des prestations physiques et non physiques.
  definition: Rendre visible et traçable la progression physique des marchandises depuis leur prélèvement dans un espace de
    stockage jusqu’à leur remise au point de destination, en reliant les événements de préparation, manutention, transport
    et étapes intermédiaires, avec leur localisation, quantités, jalons, estimations et écarts.
  differentiating_criterion: mécanisme
  decomposition_rationale: La continuité du parcours physique nécessite de relier les marchandises, unités logistiques, prestations
    et événements à travers plusieurs étapes et exécutants. Elle permet de retrouver où sont les quantités, ce qui leur est
    arrivé et ce qui reste attendu malgré les fractionnements, regroupements et changements de prise en charge. Ce bénéfice
    dépasse la consultation isolée du statut d’une prestation ; il ne crée pas un comportement par étape ou interface.
  model_justification: Le mandat de D07.d couvre déjà le suivi des faits, jalons et estimations de toutes les prestations.
    La spécialisation conserve la maille large de la capacité, évite de créer deux suivis concurrents du même parcours et
    ne supprime pas les prestations documentaires ni les ressources futures encore attendues.
  market_justification: SAP relie visibilité physique, jalons, ETA, exceptions et contexte des Orders ; son intégration prévoit
    les événements de préparation. GS1 décrit le partage des faits de localisation/mouvement entre partenaires. Ces sources
    étayent le résultat et sa complexité ; elles ne prescrivent pas le rattachement FLOW proposé.
  alternatives:
  - option: Capacité sœur autonome sous D06
    assessment: Défendable si FLOW veut distinguer durablement visibilité logistique et suivi des autres services. Exigerait
      alors de réduire explicitement le périmètre d’Execution Tracking ; conserver les deux mandats actuels au même niveau
      laisserait un recouvrement.
  - option: Renommer Execution Tracking en Logistics Visibility
    assessment: 'Non recommandé : le mandat actuel comprend aussi résultats documentaires et autres prestations non physiques.
      Le nom adopté pour le parcours physique ne suffit pas à supprimer cette responsabilité.'
  - option: Sous Inventory Visibility
    assessment: 'Non recommandé : Inventory Visibility décrit quantités et états ; le parcours logistique traverse les prestations
      d’exécution. Des faits partagés ne font pas un lien de décomposition.'
  boundaries:
  - capability: Inventory Visibility — D01.c
    role: Quantités physiques, états logiques et ressources futures ; pas de disparition de stock au premier picking.
  - capability: Logistics Visibility — comportement proposé
    role: Parcours physique, localisation, progression, jalons, ETA et écarts visibles, depuis le picking au point final.
  - capability: Execution Reconciliation — D07.c
    role: Rapprocher et qualifier les résultats réalisés face aux attendus ; rendre visible 98 sur 100 ne clôt pas le rapprochement
      des deux manquants.
  - capability: Execution Adaptation Decision — D06.f
    role: Choisir la variation métier rendue nécessaire par un aléa.
  - capability: Execution Orchestration — D06.d
    role: Coordonner la réalisation des prestations et les conséquences du plan retenu.
  example: 'Un transfert porte sur 100 pièces : 60 sont préparées puis chargées, 40 attendent ; une partie des colis passe
    par un dépôt. Le comportement reconstitue la position et la progression des quantités, sans attendre que chaque Service
    Order soit clôturé. Le signalement d’un retard ne choisit pas le transporteur de remplacement.'
  decision_to_validate: 'Logistics Visibility est-il un comportement spécialisé du suivi de toute prestation, plutôt qu’une
    capacité autonome ? Proposition : comportement sous D07.d Execution Tracking, dans D06. Valider la justification de décomposition
    sur ce bénéfice de continuité physique.'
  not_to_revalidate: Le nom U297, le parcours physique demandé U296 et le principe sans doublon des exceptions U299. Aucun
    nouvel arbitrage sur l’implémentation WMS/TMS ou Case Management requis pour ce rattachement.
  implementation_scope: 'Si adopté : créer un seul comportement et sa relation contains, consigner la justification sur le
    parent et maintenir les responsabilités non physiques. À ce stade, aucun changement du catalogue ou publication.'
  supersession_note: La proposition de comportement logistique unique est réexaminée U303 ; périmètre parent étendu U301/U302.
    Voir feedback_U303.
