  catalog_changed: false
feedback_U303:
  status: proposed
  source_refs:
  - U301
  - U302
  - U303
  - CMP104
  market_sources:
  - S35
  - S44
  - S45
  conclusion: Proposer Warehouse Visibility et Transportation Visibility directement sous Execution Tracking ; conserver Logistics
    Visibility comme notion englobante, sans ajouter un niveau entre capacité et comportement.
  reasoning: Une plateforme est après un transport et avant le suivant. Réception et expédition sont relatives à un site ;
    elles ne constituent pas deux extrémités fixes du parcours. Un comportement distingue un mécanisme et un bénéfice, pas
    seulement une position dans une séquence.
  warehouse_scope: 'Suivre la progression des marchandises et unités logistiques dans les opérations sur site : réception,
    manutention, préparation, conditionnement, cross-docking et chargement. Applicable aux opérations correspondantes en entrepôt,
    plateforme, magasin ou darkstore.'
  warehouse_benefit: Retrouver les quantités malgré les fractionnements, regroupements et changements de contenant ; comprendre
    leur avancement et leur disponibilité pour la prochaine étape.
  transportation_scope: Suivre les acheminements entre lieux, leurs étapes, leur position connue, leurs estimations d’arrivée
    et leurs écarts, jusqu’à la remise au destinataire, dernier kilomètre compris.
  transportation_benefit: Maintenir la continuité entre trajets et transporteurs, anticiper les arrivées et identifier les
    ruptures de progression.
  boundaries: Une arrivée transport et une réception sur site sont des faits distincts, éventuellement liés à une même preuve.
    Inventory Visibility décrit quantités et états ; ces comportements expliquent le déroulement des opérations. Un événement
    partagé ne doit pas être dupliqué artificiellement.
  example: 'Préparation entrepôt → transport → cross-docking plateforme → transport → réception magasin : Warehouse Visibility
    s’applique sur trois sites, Transportation Visibility aux deux acheminements.'
  market_limit: SAP et Oracle étayent les périmètres warehouse/transport et inbound/internal/outbound ; ils ne normalisent
    pas notre hiérarchie. Warehouse Visibility est le libellé proposé pour cette spécialisation, pas un intitulé universel
    attesté de capacité.
  digital_scope: Le périmètre numérique et l’audit de toutes les opérations restent requis par U301/U302. Cette proposition
    ne décompose que la partie logistique et ne prétend pas achever la décomposition du parent.
  open: Valider deux comportements sur site/transport ou démontrer un bénéfice différenciant exigeant un suivi séparé de réception
    et préparation. Ne pas créer des comportements avant/après transport par simple séquencement.
  catalog_changed: false
  superseded_by: 'U304 : le cas de mise en rayon justifie de proposer une spécialisation Store Execution Visibility distincte
    ; voir feedback_U304.'
feedback_U304:
  status: adopted_in_stated_scope_U305
  source_refs:
  - U304
  - CMP104
  market_sources:
  - S46
  - S47
  conclusion: La mise en rayon relève de Shelf Replenishment ; le périmètre plus large est Store Execution ou In-Store Execution.
    Proposer Store Execution Visibility pour le suivi des opérations logistiques en magasin, en précisant que ce composé est
    une formulation FLOW appuyée sur le vocabulaire marché.
  scope: Réception magasin, passage en réserve, acheminement vers la surface de vente, mise en rayon et réassort du rayon.
    Distinguer livraison reçue, marchandise en réserve et quantité effectivement accessible en rayon.
  rationale: Le bénéfice différenciant est de révéler une rupture en rayon malgré un stock présent en magasin, et le délai
    entre livraison et accessibilité effective au client.
  recommendation: 'Réexaminer la proposition à deux comportements U303 : Warehouse Visibility pour les opérations des entrepôts/plateformes,
    Transportation Visibility pour les acheminements et Store Execution Visibility pour les opérations logistiques magasin.
    Trois spécialisations directement sous Execution Tracking, à valider ; aucune hiérarchie supplémentaire.'
  limits: Store Replenishment peut désigner l’approvisionnement du magasin depuis l’extérieur. On-Shelf Availability est un
    résultat de disponibilité, pas le suivi de toutes les opérations. Store Execution est plus large que le seul périmètre
    logistique retenu ici ; pas d’extension automatique à toutes les activités commerciales du magasin.
  catalog_changed: false
