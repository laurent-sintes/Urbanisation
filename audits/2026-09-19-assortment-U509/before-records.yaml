      reçues, distinctes de l’identité du produit.
    flow_scope: Références proposées, prix et zones d’application.
    flow_approach: Relier une offre à des produits déjà identifiés.
    synthesis:
    - Microsoft Commerce emploie Catalog pour cibler une offre B2B ; Procurement Catalog sélectionne ce que des employés peuvent
      commander. Le public change, tandis que la distinction entre produit et offre reste utile.
    - FLOW reçoit le catalogue applicable sans en administrer la construction. La présence du produit dans plusieurs catalogues
      ne multiplie pas sa référence maîtresse.
