- id: D11
  revision: 2
  kind: reference
  fields:
    name: Agreement
    definition: 'Recevoir et consulter la projection du contrat complet : cadre, conditions particulières, périodes de validité
      et engagements en quantité ou en valeur, avec identifiants Party et Catalog. Les commandes restent distinctes et consomment
      les conditions reçues ; administration du contrat maître externe.'
    finality: Disposer des conditions contractuelles applicables aux Orders et à la promesse sans administrer leur source
      de vérité.
    mastership: external
    market_comparisons:
    - vendor: Microsoft
      product: Dynamics 365 Supply Chain Management
      source_title: Purchase agreements
      source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/procurement/purchase-agreements
      source_version: Mise à jour du 8 septembre 2026
      source_locator: Commitment types ; Purchase agreement fulfillment
      consulted_on: '2026-09-19'
      evidence_limits: Document primaire consulté ; rapprochement de concepts, sans preuve de réalisation Beaumanoir.
      element_name: Purchase agreement
      element_type: Concept documenté par la source primaire
      relationship: Recouvrement partiel
      similarities: Conditions et engagements consommés par des commandes.
      differences: L’accord d’achat est un exemple plus ciblé que le contrat complet FLOW.
      flow_position: Retrouver les conditions et engagements qui s’appliquent aux commandes. Agreement reçoit la projection
        du contrat complet ; les commandes en consomment les conditions sans devenir le contrat.
      status: proposed
      source_refs:
      - U477
      - ELM426
      - CMP193
      concept_name: Purchase agreement
      scope_summary: Conditions et engagements consommés par des commandes.
      approach_summary: Suivre quantité ou valeur engagée sur une période.
    - vendor: Oracle
      product: Fusion Cloud Enterprise Contracts / Purchasing
      source_title: Create and Monitor Agreements in Oracle Fusion Purchasing
      source_url: https://docs.oracle.com/en/cloud/saas/sales/fasca/create-and-monitor-agreements-in-oracle-fusion-purchasing.html
      source_version: Documentation évolutive sans édition affichée
      source_locator: Track Purchasing Activity ; Import Blanket Agreements ; Import Contract Agreements
      consulted_on: '2026-09-19'
      evidence_limits: Document primaire consulté ; rapprochement de concepts, sans preuve de réalisation Beaumanoir.
      element_name: Contract / Purchasing agreement
      element_type: Concept documenté par la source primaire
      relationship: Recouvrement partiel
      similarities: Contrat communiqué au système d’achat.
      differences: Oracle gère aussi création et approbation ; FLOW reçoit la projection.
      flow_position: Retrouver les conditions et engagements qui s’appliquent aux commandes. Agreement reçoit la projection
        du contrat complet ; les commandes en consomment les conditions sans devenir le contrat.
      status: proposed
      source_refs:
      - U477
      - ELM347
      - CMP193
      concept_name: Contract / Purchasing agreement
      scope_summary: Contrat communiqué au système d’achat.
      approach_summary: Transférer les conditions et suivre l’accord obtenu.
    market_inspiration:
      choice: Retrouver les conditions et engagements qui s’appliquent aux commandes. Agreement reçoit la projection du [contrat](glossary:TER048)
        complet ; les commandes en consomment les conditions sans devenir le contrat.
      flow_scope: Cadre, conditions, périodes et engagements en quantité ou valeur.
      flow_approach: Relier le contrat reçu aux parties, catalogues et commandes concernés.
      synthesis:
      - Microsoft décrit un accord d’achat consommé par plusieurs commandes. Oracle montre comment transmettre un contrat
        vers Purchasing puis suivre l’accord correspondant. Le premier éclaire le contenu et son utilisation, le second son
        passage entre systèmes.
      - FLOW réunit ces repères dans une projection consultable. Il ne reprend ni la négociation, ni l’approbation du contrat
        maître, et ne réduit pas Agreement à un tarif ou à une seule commande.
      examples:
      - title: Illustration FLOW — plusieurs commandes sous un accord
        situation: Un accord prévoit un engagement annuel ; trois commandes sont passées à des dates différentes.
        outcome: Chaque commande utilise les conditions applicables et contribue à la consommation de l’engagement.
        lesson: L’accord reste identifiable indépendamment de ses commandes.
        source_title: Purchase agreements
        source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/procurement/purchase-agreements
        source_refs:
        - U477
        - ELM426
        - CMP193
