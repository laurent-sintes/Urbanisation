      choice: Recevoir les contrats et leurs évolutions pour appliquer les bonnes conditions. Agreement Ingestion conserve
        leur provenance et leurs liens sans négocier ni administrer le contrat maître.
      flow_scope: Cadre contractuel, validité, conditions et engagements reçus.
      flow_approach: Mettre à disposition une projection fidèle à la source.
      synthesis:
      - Oracle décrit un transfert de contrats vers les accords d’achat ; Microsoft précise les engagements et conditions
