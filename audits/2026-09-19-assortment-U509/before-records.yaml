- id: D12
  revision: 3
  kind: reference
  fields:
    name: Catalog
    definition: Recevoir les catalogues construits à l’extérieur et les informations commerciales applicables. Une même référence
      de produit ou de variante peut figurer dans plusieurs catalogues ; son identité maîtresse relève de Product Reference.
    finality: Disposer des catalogues applicables, avec les prix et zones géographiques nécessaires aux opérations.
    mastership: external
    market_comparisons:
    - vendor: Microsoft
      product: Dynamics 365 Commerce
      source_title: Create Commerce catalogs for B2B sites
      source_url: https://learn.microsoft.com/en-us/dynamics365/commerce/catalogs-b2b-sites
      source_version: Mise à jour du 21 janvier 2026
      source_locator: Catalog configuration ; customer hierarchies ; price groups
      consulted_on: '2026-09-19'
      evidence_limits: Document primaire consulté ; rapprochement de concepts, sans preuve de réalisation Beaumanoir.
      element_name: Commerce catalog
      element_type: Concept documenté par la source primaire
      relationship: Recouvrement partiel
      similarities: Produits et prix proposés à une population de clients.
      differences: FLOW ne construit ni site marchand ni politique commerciale.
      flow_position: Savoir quelles références sont proposées et sous quelles conditions commerciales. Catalog reçoit l’offre
        construite à l’extérieur ; il ne redéfinit pas le produit.
      status: proposed
      source_refs:
      - U477
      - ELM391
      - CMP193
      concept_name: Commerce catalog
      scope_summary: Produits et prix proposés à une population de clients.
      approach_summary: Cibler l’offre par catalogue et période.
    - vendor: Microsoft
      product: Dynamics 365 Supply Chain Management
      source_title: Procurement catalogs overview
      source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/procurement/procurement-catalogs
      source_version: Mise à jour du 1er juillet 2026
      source_locator: Set up a catalog ; publication and updates
      consulted_on: '2026-09-19'
      evidence_limits: Document primaire consulté ; rapprochement de concepts, sans preuve de réalisation Beaumanoir.
      element_name: Procurement catalog
      element_type: Concept documenté par la source primaire
      relationship: Recouvrement partiel
      similarities: Biens et services accessibles aux achats internes.
      differences: Le public et la gouvernance diffèrent du catalogue reçu dans FLOW.
      flow_position: Savoir quelles références sont proposées et sous quelles conditions commerciales. Catalog reçoit l’offre
        construite à l’extérieur ; il ne redéfinit pas le produit.
      status: proposed
      source_refs:
      - U477
      - ELM424
      - CMP193
      concept_name: Procurement catalog
      scope_summary: Biens et services accessibles aux achats internes.
      approach_summary: Publier une sélection suivant les règles d’achat.
    market_inspiration:
      choice: Savoir quelles références sont proposées et sous quelles conditions commerciales. Catalog reçoit l’offre construite
        à l’extérieur ; il ne redéfinit pas le produit.
      flow_scope: Références proposées, prix et zones d’application.
      flow_approach: Consulter une offre reçue et ses évolutions.
      synthesis:
      - Le catalogue B2B de Microsoft présente une offre à des clients ; son catalogue d’approvisionnement encadre les achats
        des employés. Les destinataires diffèrent, mais les deux sélectionnent ce qu’un public peut commander.
      - FLOW retient la distinction entre la référence produit et son offre. La construction, la publication et les politiques
        commerciales de ces produits Microsoft restent hors du référentiel projeté.
      examples:
      - title: Illustration FLOW — une variante, deux offres
        situation: La même variante figure dans deux catalogues applicables à des contextes différents.
        outcome: Le prix ou l’applicabilité peuvent différer sans créer deux produits.
        lesson: Catalog porte l’offre ; Product Reference conserve la référence commune.
        source_title: Create Commerce catalogs for B2B sites
        source_url: https://learn.microsoft.com/en-us/dynamics365/commerce/catalogs-b2b-sites
        source_refs:
        - U477
        - ELM391
        - CMP193
