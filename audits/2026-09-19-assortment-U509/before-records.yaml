    flow_approach: Garder le contrat et ses consommations identifiables.
    synthesis:
    - Microsoft Purchase Agreement décrit des engagements consommés par des commandes. Oracle distingue le contrat de l’accord
      d’achat créé à partir de celui-ci. Les mots se rapprochent, mais leur place dans le produit n’est pas identique.
    - 'FLOW adopte un sens explicite : la projection du contrat complet. L’accord ne se réduit ni au prix, ni à une seule
      demande, et sa gestion maîtresse reste externe.'
    examples:
    - title: Illustration FLOW — contrat et commandes
      situation: Un engagement sur une période est utilisé par plusieurs commandes successives.
      outcome: Le contrat subsiste indépendamment de chacune d’elles.
      lesson: Une modification de commande ne réécrit pas à elle seule le contrat maître.
      source_title: Purchase agreements
      source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/procurement/purchase-agreements
      source_refs:
      - U477
      - ELM426
      - CMP193
