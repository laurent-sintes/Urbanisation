      approach_summary: Organiser les informations utiles à la consultation de l’offre.
      similarities: Même besoin de comprendre les produits proposés et leur périmètre.
      differences: Microsoft configure et publie le catalogue commercial ; FLOW en reçoit la référence.
      relationship: Recouvrement partiel
      flow_position: Rendre lisibles les offres et leurs conditions de référence. Catalog Visibility permet de retrouver un
