- id: D11.a
  revision: 2
  kind: capability
  fields:
    name: Agreement Ingestion
    definition: Recevoir les contrats clients ou fournisseurs et leurs évolutions, y compris cadre, conditions particulières,
      périodes et engagements en quantité ou valeur, avec références Party et Catalog et provenance du maître externe.
    finality: Mettre les conditions contractuelles de référence à disposition des décisions et engagements transactionnels.
    scope: |-
      Recevoir les informations de référence et leurs évolutions ; aucune administration ou validation des données maîtresses dans la plateforme.

      Frontière : Aucune négociation locale de l’Agreement.

      Exemple fictif : Recevoir validité et conditions de livraison applicables.
    nature: action
    market_comparisons:
    - vendor: Oracle
      product: Fusion Cloud Enterprise Contracts / Purchasing
      source_title: Create and Monitor Agreements in Oracle Fusion Purchasing
      source_url: https://docs.oracle.com/en/cloud/saas/sales/fasca/create-and-monitor-agreements-in-oracle-fusion-purchasing.html
      source_version: Documentation évolutive sans édition affichée
      source_locator: Track Purchasing Activity ; Import Blanket Agreements ; Import Contract Agreements
      consulted_on: '2026-09-19'
      evidence_limits: Document primaire consulté ; rapprochement de concepts, sans preuve de réalisation Beaumanoir.
      element_name: Import Purchasing Agreements
      element_type: Concept documenté par la source primaire
      relationship: Recouvrement partiel
      similarities: Conditions transmises depuis un contrat vers l’achat.
      differences: FLOW ne crée pas un second maître ni son circuit d’approbation.
      flow_position: Recevoir les contrats et leurs évolutions pour appliquer les bonnes conditions. Agreement Ingestion conserve
        leur provenance et leurs liens sans négocier ni administrer le contrat maître.
      status: proposed
      source_refs:
      - U477
      - ELM347
      - CMP193
      concept_name: Import Purchasing Agreements
      scope_summary: Conditions transmises depuis un contrat vers l’achat.
      approach_summary: Importer et suivre l’accord créé.
    - vendor: Microsoft
      product: Dynamics 365 Supply Chain Management
      source_title: Purchase agreements
      source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/procurement/purchase-agreements
      source_version: Mise à jour du 8 septembre 2026
      source_locator: Commitment types ; Purchase agreement fulfillment
      consulted_on: '2026-09-19'
      evidence_limits: Document primaire consulté ; rapprochement de concepts, sans preuve de réalisation Beaumanoir.
      element_name: Purchase agreement
      element_type: Concept documenté par la source primaire
      relationship: Recouvrement partiel
      similarities: Conditions, validité et engagements quantité/valeur.
      differences: Ce document éclaire le contenu reçu, pas un contrat universel d’ingestion.
      flow_position: Recevoir les contrats et leurs évolutions pour appliquer les bonnes conditions. Agreement Ingestion conserve
        leur provenance et leurs liens sans négocier ni administrer le contrat maître.
