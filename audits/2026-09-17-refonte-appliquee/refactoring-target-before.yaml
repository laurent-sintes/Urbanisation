- id: BHV013
  before:
    name: Allocation Release
    definition: libération des quantités inutilisées
    scope: |-
      Restituer au disponible commun des droits encore inutilisés, sans nouveau bénéficiaire désigné. Exemple fictif : libérer 20 pièces d’une enveloppe devenue excessive. Cela distingue la libération de la réallocation et de l’annulation d’une réservation. Les effets sur les engagements existants et les corrections de consommation restent à instruire.

      Comportement terminal directement sous [Supply Protection](model:D02.b), combinable avec ses pairs sans séquence universelle. [Stock Allocation Decision](model:D05.d) reste la décision spécialisée des valeurs ; [Supply Assignment](model:D02.e) affecte les ressources aux besoins et [Reservation](model:D02.c) porte l’engagement de quantité. Écran, batch, flux et streaming restent des modalités, avec traitements unitaires, collectifs ou en masse selon le besoin.
