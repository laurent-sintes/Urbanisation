merge_proposal:
  key: PROMISE-MANAGEMENT
  source_ids:
  - D03.a
  - D03.b
  - D03.c
  name: Promise Management
  definition: Gérer les propositions et engagements de promesse Supply, leurs confirmations et leurs révisions autorisées,
    avec quantités, dates, conditions et historique.
  status: grouping_and_three_behaviors_adopted_U288_details_proposed
  recommended: true
  behavior_keys:
  - PROMISE-PROPOSE
  - PROMISE-CONFIRM
  - PROMISE-REVISE
  why: 'U288 retient les trois comportements : construire une proposition sans engager, établir un engagement, puis le réexaminer.
    Leurs résultats et effets sur la relation de promesse diffèrent.'
  identity_plan: Identifiant neuf si fusion retenue ; trois IDs retirés avec correspondance et redirection explicites. Aucun
    ancien accord transféré automatiquement.
  alternative: Ancienne alternative de maintien des trois capacités remplacée par l’accord U288 ; ne plus présenter la fusion
    comme arbitrage ouvert.
  counterexample_test: Vérifier les effets distincts des trois comportements et les frontières avec décisions, affectation
    et réservation ; pas une remise en question implicite du regroupement adopté.
  market_limit: BOP prouve le besoin de révision, pas la fusion ; recommandation fondée sur la cohérence FLOW.
  source_refs:
  - U288
  decomposition_rationale: 'Distinguer proposition, établissement de l’engagement et réexamen de cet engagement : trois façons
    d’agir avec effets différents, sans multiplier les capacités d’action. Principe adopté U288 ; formulation justificative
    proposée.'
protection_coverage:
- concern: Accès concurrent / surconsommation
  covered_by:
  - PROTECT-GROUP
  - PROTECT-CAP
  limit: Fait consommant les droits et correction à définir ; pas de double décompte avec réservation.
- concern: Pénurie / incertitude
  covered_by:
  - PROTECT-BUFFER
  - PROTECT-REPLENISH
  limit: Sécurité, seuil et cible se combinent sans addition automatique.
- concern: Surstock futur / fin de vie
  covered_by:
  - PROTECT-REPLENISH
  - D05.e
  limit: Limiter nouveaux apports ; ajustement des commandes fermes soumis à arbitrage puis D04.
- concern: Surstock existant
  covered_by:
  - D05.c
  limit: Protection ne réalise ni redistribution, ni retour, ni markdown ou destruction.
- concern: Présentation / espace / péremption / lots
  covered_by:
  - PROTECT-REPLENISH
  - D05.a
  - D05.e
  limit: Contraintes selon le cas ; aucun comportement par paramètre ni nouvelle maîtrise des données externes.
- concern: Validité / activation / dérogation / masse / suivi
  covered_by:
  - D02.b
  limit: Propriétés et fonctions de gouvernance ; dérogation explicite avec portée et durée.
