order_plan_application_U287:
  state: domain_direction_adopted_meaning_corrected_U289_parent_pending
  source_refs:
  - U287
  - U289
  domain_id: D04
  proposed_name: Plan-driven Order Application
  proposed_definition: Appliquer aux Orders les conséquences autorisées d’un scénario ou d’un plan d’affectation des ressources
    aux commandes, avec origine, portée et résultat de prise en compte.
  differentiator: mécanisme
  targeted_benefit: Assurer la cohérence des Orders avec les choix retenus sans confondre leur modification avec la tenue
    des liens ressources-commandes.
  example: Un plan affecte 100 pièces disponibles à deux commandes pour 60 et 40. Supply Assignment tient ces affectations
    ; D04 applique les évolutions d’Orders nécessaires et autorisées, qui peuvent être nulles si les Orders ne changent pas.
  boundaries:
    D05: Planifie le stock souhaitable ; un plan d’affectation aux commandes n’est pas automatiquement un scénario Inventory
      Planning.
    D04: Applique seulement les évolutions d’Orders issues du plan ; ne remplace pas Supply Assignment pour la tenue des affectations.
    D02.b: Applique les politiques, seuils et droits par groupes ; un plan d’enveloppes sans Orders ne devient pas une création
      de commandes.
    D03: Supply Assignment conserve les liens ressources-commandes ; décisions et Promise Management conservent la promesse.
      Le besoin de décision collective d’affectation reste à instruire sans déplacer silencieusement les responsabilités.
    D06: Coordonne les prestations et décide les variations opérationnelles ; matérialisation d’un plan d’Orders ne vaut pas
      exécution physique.
  functions_to_describe:
  - Identifier plan, version, périmètre retenu et lignes déjà prises en compte
  - Appliquer les évolutions autorisées des Orders, si le plan en exige ; pas de création automatique d’un transfert.
  - Préserver origine, quantités et liens ; connaître application, refus et reliquat
  - Reprendre la partie non appliquée sans dupliquer les actions reconnues
  non_assumptions:
  - Pas de lot atomique imposé
  - Pas de lancement ou affermissement systématique
  - Pas d’exécution physique ni application des quotas par D04
  - Pas d’assimilation du plan d’affectation à une répartition entre magasins
  parent_arbitration: Choisir le porteur de l’application sur les Orders après distinction entre décisions, affectations et
    mutations d’Orders. Si le plan ne change que les liens ressources-commandes, Supply Assignment reste le responsable courant
    ; aucune capacité D04 supplémentaire ne se déduit de ce cas.
  market_sources:
  - S13
  - S14
  count_note: Principe U287 conservé, interprétation corrigée U289 ; ne plus justifier une nouvelle capacité par un exemple
    de répartition magasin.
summary_counts_note: 39 capacités après le regroupement adopté U288, hors éventuelle capacité parent de l’application de plan
  U287 ; 14 comportements de cœur proposés/adoptés par portée, 4 conditionnels, plus direction U287 en attente de parent.
