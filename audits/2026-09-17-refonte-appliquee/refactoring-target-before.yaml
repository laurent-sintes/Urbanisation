    definition: 'Gérer les ordres de déplacement de marchandises entre sites : maintenir origine, destination, quantités et
      échéances, suivre les modifications et rapprocher départs et arrivées pour connaître le transfert restant à satisfaire.'
    finality: Rendre explicite ce qui doit être transféré, vers quel site et ce qui reste à acheminer ou à recevoir.
    nature: action
    scope: |-
      Type de commande : [Transfer Order](glossary:TER071).

      Enregistrer l’origine et le contenu applicable, intégrer les modifications autorisées avec leur historique, rendre la situation consultable et rapprocher les réalisations pour déterminer le reste à satisfaire. Les transformations de structure mobilisent [Order Structuring](model:D04.n) ; les autorisations et restrictions de progression mobilisent [Order Lifecycle Management](model:D04.o). Ces capacités transversales sont des responsabilités complémentaires, pas des sous-capacités répétées sous chaque type.

      Exemple discuté : sur un transfert de 100 pièces, 60 peuvent être autorisées pour traitement et 40 mises en attente. Reporter les 40 à lundi ne lève pas leur blocage. Les quantités autorisées, expédiées et reçues expriment des situations différentes ; une expédition ne prouve pas la réception. Scinder le transfert conserve les liens à la demande initiale et évite le double comptage. Préparer, transporter et réceptionner physiquement relèvent des exécutants.

      Les conditions contractuelles restent des références ; cette capacité ne confère pas l’autorité de négocier ou de modifier un Agreement. Priorités, couverture et promesses restent dans Order Promising ; prestations, engagements et faits d’exécution dans [Execution Management](model:D06) et chez les exécutants. Les règles d’imputation, tolérances, autorisations et effets sur les réservations sont à instruire. Les exemples sont fictifs et ne prouvent aucun déploiement.
