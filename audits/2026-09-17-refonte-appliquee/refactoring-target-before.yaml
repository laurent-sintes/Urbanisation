  origin_capability_id: D03.a
  layer: transactional
  functions_note: Qualification comme comportement adoptée spécifiquement U288 ; pas de généralisation à toutes les opérations
    CRUD.
- key: PROMISE-CONFIRM
  parent_id: PROMISE-MANAGEMENT
  name: Promise Confirmation
  definition: établir les quantités et dates promises, en distinguant la part confirmée de celle qui ne l’est pas.
  differentiator: politique
  targeted_benefit: Faire passer des possibilités à un engagement explicite selon les autorisations et conditions.
  example: 60 confirmées vendredi, 40 encore non confirmées ; affectation et réservation gardent leur contrat.
  boundary: Comportement de Promise Management selon U288. Les décisions de faisabilité, priorisation et échéancier restent
    distinctes ; confirmation ne prouve pas réservation, affectation ou prise en charge de service.
  market_sources: []
  status: behavior_role_adopted_U288_definition_reuse_proposed
