behaviors:
- key: BHV001
  parent_id: D03.i
  name: Existing Commitment Consideration
  definition: Établir les quantités admissibles pour la demande en tenant compte des allocations, protections et réservations,
    sans double décompte.
  differentiator: politique
  targeted_benefit: Respecter les droits sans promettre deux fois la même quantité.
  example: 100 présentes dont 30 engagées ne donnent pas 100 libres.
  boundary: Situation de référence ; aucune réservation par ATP.
  market_sources: []
  status: existing_adopted_rationale_proposed
  existing_id: BHV001
  layer: transactional
  functions_note: Aucune décomposition fonctionnelle supplémentaire sous ce comportement.
- key: BHV002
  parent_id: D03.i
  name: Network Stock Availability
  definition: Établir les possibilités de satisfaction à partir des lieux admissibles, entrepôts, magasins, darkstores ou
    autres espaces de stockage.
  differentiator: variante
  targeted_benefit: Élargir les possibilités au réseau admissible.
  example: Un magasin autorisé contribue lorsque l’entrepôt est vide.
  boundary: Pas de comportement par type de lieu.
  market_sources: []
  status: existing_adopted_rationale_proposed
  existing_id: BHV002
  layer: transactional
  functions_note: Aucune décomposition fonctionnelle supplémentaire sous ce comportement.
- key: BHV003
  parent_id: D03.i
  name: Operational Availability Timing
  definition: Déterminer quand une quantité peut effectivement contribuer à la promesse selon sa disponibilité opérationnelle.
  differentiator: mécanisme
  targeted_benefit: Convertir présence en disponibilité utilisable à temps.
  example: Réserve mobilisable dans 2 jours versus rack disponible aujourd’hui.
  boundary: Consomme les délais opérationnels ; ne réorganise pas le prélèvement.
  market_sources: []
  status: existing_adopted_rationale_proposed
  existing_id: BHV003
  layer: transactional
  functions_note: Aucune décomposition fonctionnelle supplémentaire sous ce comportement.
- key: BHV004
  parent_id: D03.i
  name: Future Supply Projection
  definition: Établir les possibilités à l’échéance en intégrant les réceptions attendues et les engagements concurrents,
    pour une promesse ou un ensemble.
  differentiator: mécanisme
  targeted_benefit: Permettre engagement futur sans exiger le stock aujourd’hui.
  example: Arrivage J+7 contribuant à J+60 après autres engagements.
  boundary: Pas de création d’approvisionnement par ATP.
  market_sources: []
  status: existing_adopted_rationale_proposed
  existing_id: BHV004
  layer: transactional
  functions_note: Aucune décomposition fonctionnelle supplémentaire sous ce comportement.
- key: PLAN-CONSTRUCT
  parent_id: D05.f
  name: Scenario Construction
  definition: Construire plusieurs réponses possibles en explicitant leurs hypothèses, objectifs et contraintes.
  differentiator: variante
  targeted_benefit: Explorer des alternatives avant engagement.
  example: Couvertures à 10 ou 15 jours pour les mêmes demandes.
  boundary: Copier est une fonction ; décisions spécialisées distinctes.
  market_sources:
  - S07
  status: direction_adopted_wording_proposed
  existing_id: BHV005
  layer: transactional
  functions_note: Aucune décomposition fonctionnelle supplémentaire sous ce comportement.
- key: PLAN-SIMULATE
  parent_id: D05.f
  name: Simulation & Analysis
  definition: Projeter les conséquences d’un scénario et analyser leurs impacts sur les indicateurs métier et les processus
    pour éclairer les choix.
  differentiator: mécanisme
  targeted_benefit: Comprendre compromis et effets locaux.
  example: Service 94 à 97 %, stock +120 k€ ; identifier les magasins perdants.
  boundary: BHV006 et BHV010 réunis ; comparer reste une fonction, aucun recalcul imposé.
  market_sources:
  - S07
  status: combined_behavior_adopted_wording_proposed
  existing_id: BHV006
  layer: transactional
  functions_note: Aucune décomposition fonctionnelle supplémentaire sous ce comportement.
- key: PLAN-ADAPT
  parent_id: D05.f
  name: Scenario Execution Adaptation
  definition: Adapter le scénario de stock en cours aux écarts observés, compte tenu des actions engagées et des décisions
    spécialisées.
  differentiator: mécanisme
  targeted_benefit: Maintenir une trajectoire cohérente malgré les aléas.
  example: Réviser apports et transferts après report fournisseur sans oublier les quantités expédiées.
  boundary: D06 décide la variation opérationnelle ; D04/D02.b appliquent leurs changements.
  market_sources:
  - S07
  status: direction_adopted_wording_proposed
  existing_id: null
  layer: transactional
  functions_note: Aucune décomposition fonctionnelle supplémentaire sous ce comportement.
- key: PROTECT-GROUP
  parent_id: D02.b
  name: Group Supply Protection
  definition: Configurer les droits préservant l’accès d’un groupe à des ressources face aux usages concurrents.
  differentiator: politique
  targeted_benefit: Éviter qu’une demande précoce épuise les ressources d’un autre groupe.
  example: Préserver 200 pièces pour le web avant sa demande.
  boundary: Protection mutuelle ou priorisée décrites ensemble ; D05.d décide les quantités.
  market_sources:
  - S01
  - S02
  status: proposed
  existing_id: null
  layer: transactional
  functions_note: Aucune décomposition fonctionnelle supplémentaire sous ce comportement.
- key: PROTECT-CAP
  parent_id: D02.b
  name: Consumption Capping
  definition: Configurer les limites de consommation d’un groupe sur le périmètre et la période retenus.
  differentiator: politique
  targeted_benefit: Empêcher la surconsommation même si du stock reste accessible.
  example: Un groupe ne dépasse pas 500 malgré un stock supérieur.
  boundary: Préserver un minimum et limiter un maximum diffèrent ; imputation et correction sont fonctions.
  market_sources:
  - S01
  status: proposed
  existing_id: null
  layer: transactional
  functions_note: Aucune décomposition fonctionnelle supplémentaire sous ce comportement.
- key: PROTECT-BUFFER
  parent_id: D02.b
  name: Safety Stock Policy
  definition: Configurer le stock tampon et ses conditions d’utilisation pour absorber les incertitudes.
  differentiator: mécanisme
  targeted_benefit: Expliciter le rôle de sécurité sans le confondre avec réservation ou déclenchement.
  example: Sécurité 40 pour absorber retard fournisseur ; préciser quand elle peut être consommée.
  boundary: D05.a décide le niveau ; ne pas additionner deux fois le tampon et le minimum de réassort.
  market_sources:
  - S04
  - S05
  status: proposed
  existing_id: null
  layer: transactional
  functions_note: Aucune décomposition fonctionnelle supplémentaire sous ce comportement.
- key: PROTECT-REPLENISH
  parent_id: D02.b
  name: Replenishment Regulation
  definition: Configurer les règles de déclenchement et de limitation du réassort qui encadrent le renouvellement du stock.
  differentiator: mécanisme
  targeted_benefit: Prévenir manque et excès par des règles cohérentes de renouvellement.
  example: Sous 60 viser 100 ; appliquer la baisse de cible décidée en fin de vie.
  boundary: Min/Max et revue périodique décrites comme modalités, sans sous-comportements ; D05.e décide et D04 gère les apports.
  market_sources:
  - S03
  - S05
  - S06
  status: proposed
  existing_id: null
  layer: transactional
  functions_note: Aucune décomposition fonctionnelle supplémentaire sous ce comportement.
- key: COUNT-RECUR
  parent_id: D01.d
  name: Recurring Stock Verification
  definition: Fiabiliser le stock par un programme récurrent de constats et de rapprochements ciblés.
  differentiator: politique
  targeted_benefit: Organiser une fiabilisation régulière selon les risques.
  example: Contrôles réguliers des références sensibles puis corrections justifiées.
  boundary: Réalisation du comptage chez l’exécutant ; mandat du programme à préciser.
  market_sources:
  - S08
  status: conditional_arbitration
  existing_id: null
  layer: transactional
  functions_note: Aucune décomposition fonctionnelle supplémentaire sous ce comportement.
- key: COUNT-TRIGGER
  parent_id: D01.d
  name: Triggered Stock Verification
  definition: Fiabiliser une situation de stock par une vérification ciblée face à un signal.
  differentiator: mécanisme
  targeted_benefit: Traiter une incertitude locale sans attendre le cycle régulier.
  example: Recomptage après écart de préparation.
  boundary: Seuil ou anomalie sont déclencheurs ; pas un comportement par motif.
  market_sources:
  - S08
  status: conditional_arbitration
  existing_id: null
  layer: transactional
  functions_note: Aucune décomposition fonctionnelle supplémentaire sous ce comportement.
- key: ORCH-DEPEND
  parent_id: D06.d
  name: Dependency-driven Execution
  definition: Coordonner les prestations selon leurs prérequis et les résultats observés du plan retenu.
  differentiator: mécanisme
  targeted_benefit: Éviter des sollicitations dont les prérequis métier ne sont pas satisfaits.
  example: Collecte conditionnée aux colis prêts et au document requis.
  boundary: Pas de workflow universel ; D06.f décide les variations.
  market_sources:
  - S11
  status: conditional_arbitration
  existing_id: null
  layer: transactional
  functions_note: Aucune décomposition fonctionnelle supplémentaire sous ce comportement.
- key: ORCH-COMPENSATE
  parent_id: D06.d
  name: Execution Compensation
  definition: Coordonner les ajustements des prestations engagées pour appliquer une variation retenue en respectant les effets
    irréversibles.
  differentiator: mécanisme
  targeted_benefit: Éviter doublons et annulations impossibles lors d’un changement.
  example: Changer de collecte après préparation ; révoquer seulement ce qui reste annulable.
  boundary: Pas de rollback physique ; décision D06.f et gestion D07.b distinctes.
  market_sources:
  - S11
  status: conditional_arbitration
  existing_id: null
  layer: transactional
  functions_note: Aucune décomposition fonctionnelle supplémentaire sous ce comportement.
- key: PROMISE-PROPOSE
  parent_id: PROMISE-MANAGEMENT
  name: Promise Proposal
  definition: Construire une proposition de mise à disposition de ressources pour honorer une commande Supply, précisant quantités,
    dates, conditions et alternatives possibles, à partir des ressources et possibilités de réalisation.
  differentiator: mécanisme
  targeted_benefit: Explorer et expliciter une solution sans produire d’engagement confirmé.
  example: 60 vendredi et 40 lundi proposés ; aucune réservation ou confirmation déduite.
  boundary: Comportement de Promise Management selon U288. Les décisions de faisabilité, priorisation et échéancier restent
    distinctes ; confirmation ne prouve pas réservation, affectation ou prise en charge de service.
  market_sources: []
  status: behavior_role_adopted_U288_definition_reuse_proposed
