- id: BHV014
  before:
    name: Allocation Consumption
    definition: imputation de la consommation
    scope: |-
      Enregistrer l’usage de droits contre la bonne enveloppe et actualiser son solde. Exemple fictif : imputer 80 sur une enveloppe de 300 laisse 220 disponibles dans le cas simple, sans autres mouvements. Le fait déclencheur (confirmation, réservation ou autre), les corrections et annulations restent à préciser. Microsoft permet un couplage à une réservation souple ; aucun couplage obligatoire ni double déduction avec Reservation ou Assignment n’est imposé.

      Comportement terminal directement sous [Supply Protection](model:D02.b), combinable avec ses pairs sans séquence universelle. [Stock Allocation Decision](model:D05.d) reste la décision spécialisée des valeurs ; [Supply Assignment](model:D02.e) affecte les ressources aux besoins et [Reservation](model:D02.c) porte l’engagement de quantité. Écran, batch, flux et streaming restent des modalités, avec traitements unitaires, collectifs ou en masse selon le besoin.
