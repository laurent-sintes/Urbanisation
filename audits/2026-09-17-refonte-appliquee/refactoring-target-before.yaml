  state: domain_mechanism_adopted_parent_pending
  source_refs:
  - U287
  domain_id: D04
  proposed_name: Plan-driven Order Application
  proposed_definition: Matérialiser les actions retenues d’un scénario ou d’un plan en créations et évolutions cohérentes
    d’Orders, avec leur origine, leur portée et le résultat de leur prise en compte.
  differentiator: mécanisme
  targeted_benefit: Passer d’une décision portant sur un ensemble à des commandes cohérentes, en maîtrisant les actions déjà
    engagées et les applications partielles ; le bénéfice dépasse un batch.
  example: Un plan prévoit 300 pièces vers le magasin A et 200 vers B. D04 matérialise les transferts et leurs liens au plan
    ; une ligne refusée reste identifiée sans recréer celles déjà prises en compte.
  boundaries:
    D05: Construit, simule/analyse et adapte le scénario ; ne tient pas les Orders à la place de D04.
    D04: Applique la part du plan produisant ou modifiant des Orders ; mobilise les gestions par type, Structuring et Lifecycle.
    D02.b: Applique les politiques, seuils et droits par groupes ; un plan d’enveloppes sans Orders ne devient pas une création
      de commandes.
    D03: Conserve priorités, faisabilité et promesse ; matérialisation ne vaut pas promesse confirmée.
    D06: Coordonne les prestations et décide les variations opérationnelles ; matérialisation d’un plan d’Orders ne vaut pas
      exécution physique.
  functions_to_describe:
  - Identifier plan, version, périmètre retenu et lignes déjà prises en compte
  - Créer ou modifier les Orders selon les autorisations applicables
  - Préserver origine, quantités et liens ; connaître application, refus et reliquat
  - Reprendre la partie non appliquée sans dupliquer les actions reconnues
  non_assumptions:
  - Pas de lot atomique imposé
  - Pas de lancement ou affermissement systématique
  - Pas d’exécution physique ni application des quotas par D04
  parent_arbitration: Le rattachement à une capacité précise reste ouvert. Ne pas créer un comportement directement sous D04,
    ni le dupliquer sous cinq types d’Orders. Comparer une responsabilité transverse dédiée à une extension justifiée d’une
    capacité existante ; ni Lifecycle ni Structuring ne couvrent seuls sans extension la création et le résultat d’application
    d’un portefeuille d’Orders.
  market_sources:
  - S13
  - S14
  count_note: 'Direction additionnelle U287, non comptée parmi les 11 comportements de cœur : parent à arbitrer. Le total
    de capacités dépendra de ce choix.'
