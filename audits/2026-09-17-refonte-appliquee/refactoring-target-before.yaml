  origin_capability_id: D03.b
  layer: transactional
  functions_note: Qualification comme comportement adoptée spécifiquement U288 ; pas de généralisation à toutes les opérations
    CRUD.
- key: PROMISE-REVISE
  parent_id: PROMISE-MANAGEMENT
  name: Promise Revision
  definition: Réexaminer les promesses lorsque les ressources, commandes, dates ou priorités changent et établir les modifications
    autorisées.
  differentiator: mécanisme
  targeted_benefit: Maintenir les engagements cohérents lorsque ressources, demandes ou priorités évoluent.
  example: Réexaminer les 40 après report d’arrivage et tracer la révision autorisée.
  boundary: Comportement de Promise Management selon U288. Les décisions de faisabilité, priorisation et échéancier restent
    distinctes ; confirmation ne prouve pas réservation, affectation ou prise en charge de service.
  market_sources:
