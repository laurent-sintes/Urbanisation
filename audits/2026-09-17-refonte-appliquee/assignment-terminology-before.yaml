canonical:
  en: Supply Assignment
  fr: Affectation des ressources aux commandes
  definition: Affecter les ressources Supply présentes ou futures aux commandes identifiées, selon les priorités, les engagements
    et les contraintes applicables, afin d’en assurer la meilleure satisfaction possible.
plan:
  en: Supply Assignment Plan
  fr: Plan d’affectation des ressources aux commandes
  definition: Ensemble cohérent d’affectations proposées ou retenues précisant les ressources, quantités et dates destinées
    aux commandes d’un périmètre, avec les hypothèses et contraintes applicables.
rules:
- Employer Supply Assignment / affectation pour les ressources destinées aux commandes ; pas Allocation comme synonyme dans
  les libellés FLOW.
- Employer plan d’affectation, sans alterner avec plan d’allocation.
- 'Pour les droits de groupes : enveloppes de protection, droits d’usage ou plafonds de consommation selon le résultat.'
- Répartition et distribution sont des verbes descriptifs ; toujours préciser entre quoi et quoi, pas de concepts concurrents.
- 'Allocation reste un terme éditeur ou historique qualifié : SAP PAL, Microsoft Inventory Allocation, Oracle Retail Allocation,
  ancien Order Allocation Run.'
- Optimiser la satisfaction des commandes est la finalité ; l’objectif exact dépend de priorités, service, coûts et engagements,
  pas du seul volume confirmé.
boundaries:
  protection: Configure les droits et contraintes des groupes ; ne choisit pas la ressource de chaque Order.
  assignment: Matérialise et maintient le lien ressources ↔ commandes ; mobilise les arbitrages spécialisés selon le modèle.
  reservation: Effet d’engagement sur les usages concurrents ; peut être porté par la même affectation, articulation toujours
    à arbitrer sans double déduction.
  promising: Établit les possibilités et gouverne les engagements quantité/date ; affecté, réservé et promis restent distincts.
  order_management: Applique les changements d’Orders autorisés issus du plan ; ne devient pas implicitement propriétaire
    du lien d’affectation.
  execution: Réalise et suit les prestations ; affectation ne prouve pas mouvement physique.
