gap: Le modèle représente les Orders de retour et l’exécution ; la responsabilité du choix du devenir du bien n’est pas attribuée
  explicitement. Cela ne prouve pas une absence de réalisation Beaumanoir.
proposal:
  name: Return Disposition Decision
  nature: decision
  proposed_domain_id: D05
  definition: Déterminer le devenir logistique d’un produit retourné, selon son état constaté, les politiques applicables
    et les possibilités de récupération de valeur.
  result: 'Orientation du produit retourné et conditions associées : remise en stock utilisable, réparation ou reconditionnement,
    renvoi fournisseur, autre filière autorisée ou sortie définitive.'
  benefit: Rendre visible la décision qui transforme un retour reçu en orientation métier ; la gestion de l’Order et la coordination
    des prestations ne déterminent pas à elles seules la valeur récupérable.
  rationale_for_domain: D05 proposé pour l’arbitrage disponibilité/immobilisation/risque et valeur du stock. Le rattachement
    est une interprétation FLOW, pas un domaine éditeur équivalent.
  boundaries:
  - L’inspection et l’état constaté sont fournis par les exécutants ; la décision peut être réalisée chez eux sans devoir
    être développée dans FLOW.
  - Les Orders de retour et de suite mobilisent D04 ; D06 coordonne et suit les prestations ; D01 enregistre les mouvements
    et changements d’état.
  - Stock Redistribution Decision choisit les déplacements de stock existant, pas son aptitude à être remis en circulation.
  - Autorisation commerciale du retour, remboursement et remplacement client restent distincts ; ne pas les absorber dans
    cette décision logistique.
  - Règles d’acceptation, seuils de coût et filières admissibles sont des politiques ; aucun comportement par code, écran
    ou action produit.
  example: 'Exemple fictif : sur dix pièces retournées, huit sont constatées revendables et deux nécessitent une remise en
    état. Déterminer si la remise en état est pertinente et autorisée, puis orienter les lots. D04/D06 portent les suites
    ; aucune inspection physique ni écriture de stock réalisée par la décision.'
  naming: Disposition est le terme métier des documents Microsoft ; le suffixe Decision et l’autonomie de capacité sont proposés
    selon la convention FLOW, sans intitulé natif exact revendiqué.
