      source_url: https://learning.sap.com/courses/exploring-fashion-functions-and-business-processes-in-sap-s-4hana-for-fashion-and-vertical-business/explaining-aatp-product-allocation-pal-_dd30c229-d63f-4aba-a950-a174280c4a58
      source_version: Cours en ligne sans édition affichée
      source_locator: PAL Concept ; Product Allocation Examples ; time series
      consulted_on: '2026-09-19'
      concept_name: Product Allocation (PAL)
      scope_summary: Limites de confirmation par groupe et période.
      approach_summary: Plafonner l’accès à un stock commun.
      evidence_limits: Documentation primaire de produit ; aucune preuve de réalisation Beaumanoir ni équivalence de catalogue
        de capacités.
      element_name: Product Allocation (PAL)
      element_type: Concept documenté par la source primaire
      relationship: Recouvrement partiel
      similarities: Les plafonds de groupe bornent les confirmations.
      differences: PAL ne garantit pas que la quantité plafonnée restera disponible pour le groupe.
      flow_position: 'Choisir combien préserver pour chaque groupe et quelles limites lui imposer : Group Protection Decision
        arbitre ces quantités selon les besoins et priorités. Les droits retenus sont ensuite appliqués par Supply Protection.'
      status: proposed
      source_refs:
      - U470
      - U471
      - ELM298
      - CMP186
      - U477
      - ELM448
      - CMP190
    market_inspiration:
      choice: 'Choisir combien préserver pour chaque groupe et quelles limites lui imposer : Group Protection Decision arbitre
        ces quantités selon les besoins et priorités. Les droits retenus sont ensuite appliqués par Supply Protection.'
      flow_scope: Quantités protégées et limites par canal ou population.
      flow_approach: Comparer les besoins concurrents et expliquer le partage.
      synthesis:
      - Microsoft met en avant une enveloppe préservée ; SAP PAL limite ce qu’un groupe peut consommer. Ces leviers se ressemblent
        dans leurs nombres mais diffèrent dans leur garantie.
      - FLOW décide séparément ce qui doit être protégé et ce qui ne doit pas être dépassé. Le mot Allocation des éditeurs
        ne vaut donc pas une unique responsabilité FLOW.
      examples:
      - title: Exemple SAP — un plafond sans garantie
