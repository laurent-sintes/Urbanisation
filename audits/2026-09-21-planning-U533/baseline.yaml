    definition: Construire, comparer et mettre à jour le plan d'ensemble qui organise la couverture des besoins de la Supply,
      puis préparer sa mise en œuvre avec les capacités opérationnelles responsables.
    finality: Maintenir une trajectoire cohérente entre besoins à couvrir et ressources mobilisables, à partir des faits et
      des hypothèses actualisés.
    scope: |-
      Le plan d'ensemble est régulièrement actualisé ; il ne se limite pas à un calcul en début de saison. Il peut préparer des demandes d'achat planifiées. Les faits nouveaux et les impondérables alimentent sa révision.

      La planification mobilise les décisions spécialisées. Les Areas opérationnelles conservent leurs décisions, leurs engagements et leur adaptabilité ; une décision ou un scénario ne réalise pas à lui seul les opérations. [Order Backlog Planning](model:D03.p) reste dans [Fulfillment Optimization](model:D03).

      La cadence de calcul et le recours à l'analytics ne définissent pas la frontière. Par exemple, un retard fournisseur peut conduire à ajuster les demandes d'achat envisagées dans le plan d'ensemble, tandis que les capacités opérationnelles adaptent la satisfaction des commandes en cours.
