      concept_name: Carrier and carrier service selection
      scope_summary: Choix d’une offre de transport adaptée au chargement.
      approach_summary: Comparer les possibilités et retenir un service.
    market_inspiration:
      choice: Choisir les [Backing Services](glossary:TER075) et exécutants qui peuvent répondre aux prestations nécessaires.
        Service Selection Decision compare les options admissibles en tenant compte du besoin et des contraintes.
      flow_scope: Services utilisables, exécutants, conditions et capacités connues.
      flow_approach: Écarter les options inadmissibles puis déterminer les moyens à mobiliser.
      synthesis:
      - Microsoft Field Service rapproche un besoin des ressources capables de le réaliser. Son exemple de transport dans
        Dynamics AX montre un choix de transporteur et de service lorsque les tarifs proposés ne conviennent pas. L’un insiste
        sur la ressource, l’autre sur l’offre de transport.
      - FLOW réunit admissibilité et comparaison des options à la maille du service. Le coût peut compter, mais aucune priorité
        automatique au moins cher n’est déduite ; la couverture de l’Order et sa promesse gardent leurs décisions propres.
      examples:
      - title: Exemple Microsoft — un tarif à convenir
        situation: Dans l’exemple Microsoft, les tarifs proposés ne conviennent pas au chargement ; un transporteur et son
          service sont choisis avec un tarif saisi manuellement.
        outcome: Le service retenu devient le moyen de transport utilisé dans ce scénario.
        lesson: Le choix dépend du contexte ; FLOW ne réduit pas sa décision à un classement tarifaire.
        source_title: Transportation scenario – Manual rating
        source_url: https://www.microsoft.com/en-us/dynamics-365/blog/business-leader/2016/02/16/transportation-charges-scenario-manual-rating-2/
