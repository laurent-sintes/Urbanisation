      scope_summary: Variantes de politique, ressources et demandes.
      approach_summary: Comparer le plan initial et les effets projetés.
      evidence_limits: Documentation primaire de produit ; aucune preuve de réalisation Beaumanoir ni équivalence de catalogue
        de capacités.
      element_name: What-if simulation
      element_type: Concept documenté par la source primaire
      relationship: Recouvrement partiel
      similarities: Oracle permet de varier politiques, demandes et apports avant application.
      differences: La page décrit une fonction de plan, pas l’ensemble des responsabilités FLOW.
      flow_position: 'Préparer et maintenir un scénario de stock cohérent : Inventory Planning construit des alternatives,
        en examine les effets et adapte le scénario retenu. Il mobilise les décisions spécialisées et les responsables de
