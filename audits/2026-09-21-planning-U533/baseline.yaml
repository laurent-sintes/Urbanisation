      product: Global Order Promising
      element_name: Scheduled ship and arrival dates
      concept_name: Scheduled ship and arrival dates
      element_type: Concept ou mécanisme métier documenté dans un produit
      relationship: Recouvrement partiel
      scope_summary: Possibilités de dates d’une ligne.
      approach_summary: Comparer puis retenir des dates.
      similarities: Expédition et réception sont distinguées.
      differences: Oracle regroupe exploration et application dans un parcours.
      flow_position: FLOW laisse chaque effet à sa responsabilité.
      source_title: Check Availability
      source_url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/25c/fascp/check-availability.html
      source_version: Oracle Fusion Cloud SCM 25C
      source_locator: Examine the Attributes ; Schedule the Order Line
      consulted_on: '2026-09-19'
      evidence_limits: Passage primaire consulté ; périmètre du produit documenté, sans preuve d’installation chez Beaumanoir.
      status: proposed
      source_refs:
      - U477
      - ELM350
      - CMP191
    market_inspiration:
      choice: Retenir quelles quantités fournir à quelles dates rend la solution compréhensible pour le demandeur. Delivery
        Schedule Decision choisit un échéancier réalisable et acceptable, sans modifier à elle seule la demande ni confirmer
        l’engagement.
      flow_scope: Une ou plusieurs échéances de satisfaction de la commande.
      flow_approach: Choisir parmi les possibilités en respectant conditions et calendriers.
      synthesis:
      - Microsoft Delivery schedules représente une commande livrée en plusieurs fois. Oracle Check Availability permet de
        travailler les dates d’expédition et d’arrivée avant leur application. Microsoft insiste sur la représentation des
        livraisons ; Oracle sur le choix des possibilités.
      - FLOW nomme la décision qui retient l’échéancier. Deux dates de livraison n’imposent pas deux commandes ; la formalisation
        de la proposition puis sa confirmation gardent leur responsabilité.
      examples:
      - title: Illustration FLOW — une commande, deux dates
        situation: Pour 100 pièces demandées vendredi, les possibilités admissibles sont 60 vendredi et 40 lundi.
        outcome: L’échéancier retient ces deux quantités si les conditions du client l’acceptent.
        lesson: La représentation en plusieurs échéances, illustrée par Microsoft, ne décide pas du découpage en commandes.
        source_title: Delivery schedules
        source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/sales-marketing/delivery-schedules
