      differences: Oracle décrit le traitement ; FLOW explicite aussi la demande qui le porte.
      flow_position: La demande porte le travail interne à mener, ses décisions et ses suites ; les capacités spécialisées
        assurent le traitement.
      status: proposed
      concept_name: Backlog Management
      scope_summary: Commandes dont la satisfaction mérite un réexamen.
