      similarities: Demandes de services et changements d’état.
      differences: Les états TMF sont liés à des services télécom ; FLOW ne les impose pas à tous les exécutants.
      flow_position: Tenir les demandes de prestation adressées aux exécutants et leurs évolutions. Backing Service Orders
        distingue ce qui est demandé, accepté et réalisé, selon les possibilités propres à chaque service.
