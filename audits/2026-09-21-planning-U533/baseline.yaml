      differences: La source n’établit pas une ingestion standard de tout service Supply.
      flow_position: Recevoir les offres des Backing Services et leurs conditions à jour. Service Catalog Ingestion conserve
        la référence de l’exécutant sans transformer une évolution de l’offre en révision automatique des engagements en cours.
      status: proposed
      source_refs:
      - U477
      - ELM397
      - CMP193
      concept_name: Product Catalog / Work Order
      scope_summary: Service de référence et prestation mobilisée dans une intervention.
      approach_summary: Réutiliser l’offre pour décrire un travail précis.
    market_inspiration:
      choice: Recevoir les offres des Backing Services et leurs conditions à jour. Service Catalog Ingestion conserve la référence
        de l’exécutant sans transformer une évolution de l’offre en révision automatique des engagements en cours.
      flow_scope: Descriptions des prestations exécutantes, résultats, niveaux de service configurés, conditions et moyens
        de contact reçus.
      flow_approach: Maintenir la description de référence des offres externes mobilisables par l’orchestration.
      synthesis:
      - TM Forum distingue le catalogue de la commande de service ; Microsoft Field Service utilise des prestations de catalogue
        dans les interventions. Tous deux séparent une description réutilisable du travail particulier demandé.
      - FLOW reçoit la description des Backing Services et ses évolutions. Les documents illustrent les objets à distinguer,
        sans imposer un mécanisme d’échange ni transférer au Domain la maîtrise du catalogue d’entreprise.
