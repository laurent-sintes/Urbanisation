- id: D06
  revision: 5
  kind: area
  fields:
    name: Process Management
    definition: Orchestrer l’exécution Supply en coordonnant les prestations, en suivant leur réalisation et en adaptant le
      plan aux aléas, en articulation avec la promesse Supply.
    finality: Maintenir une exécution cohérente et adaptable, depuis les possibilités de réalisation jusqu’aux résultats constatés.
    scope: |-
      Connaître les services admissibles et la capacité logistique contextualisée ; exprimer les prestations, gérer leurs engagements, coordonner leurs dépendances, suivre leur avancement et adapter le plan aux aléas. Les services couvrent entrepôt, transport et prestations telles que la production de documents.

      Un SLA configuré compatible ne garantit pas la réussite opérationnelle. Exemple : la préparation prend du retard et menace la collecte ; rechercher une autre collecte, un autre service ou une réalisation partielle selon les contraintes, puis mobiliser D15 si la promesse doit être réexaminée.

      Le référentiel D14 décrit l’offre et les SLA globaux ; D06 traite le contexte opérationnel. D15 conserve les décisions et engagements de promesse Supply, D04 les Orders et leurs reliquats, D01 la représentation du stock et de ses mouvements. Les exécutants conservent leurs opérations internes. La latitude d’adaptation est une règle de fonctionnement, sans effet sur le catalogue des capacités.

      Convention U409 : le Process orchestre des Services. Les Tasks expriment les contributions au processus ; les services réalisent les prestations sollicitées, humaines, physiques ou numériques. Un appel informatique est un moyen de sollicitation ou de feedback, pas le service métier lui-même. Process Orchestration coordonne la progression ; Process Adaptation Decision choisit les adaptations ; Operations Tracking rend visibles les opérations et Process Tracking leur contribution à la progression du processus. Les exécutants gardent leurs opérations internes. Le périmètre Supply et les responsabilités des areas restent inchangés ; aucun moteur de workflow ou nouveau niveau descriptif imposé.
    market_comparisons:
