      synthesis:
      - Oracle Backlog Management permet de simuler, comparer et préparer les résultats à transmettre. SAP propose aussi la
        comparaison de traitements d’affectation simulés. Les deux séparent l’examen d’un scénario de son exécution effective.
      - FLOW nomme le travail de préparation, humain, automatisé ou mixte. Les décisions établissent les scénarios ; la libération
