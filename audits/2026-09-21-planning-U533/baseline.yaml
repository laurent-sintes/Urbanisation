- id: D03.n
  revision: 8
  kind: capability
  fields:
    name: Fulfillment Commitment
    definition: Proposer, confirmer et réviser les engagements de satisfaction d’une commande, en quantités, dates et conditions.
    nature: management
    finality: Établir et maintenir des engagements Supply explicites et cohérents avec les possibilités retenues.
    decomposition_rationale: 'Distinguer proposition, établissement de l’engagement et réexamen de cet engagement : trois
      façons d’agir avec effets différents, sans multiplier les capacités d’action.'
    scope: |-
      Trois comportements : proposition sans engagement confirmé, confirmation des quantités et dates, révision lorsque la situation évolue. Les décisions ATP/CTP/PTP, priorités et échéancier restent distinctes, ainsi que Supply Assignment et Reservation. Exemple fictif : proposer 60 vendredi et 40 lundi, confirmer la première part puis réexaminer la seconde après retard fournisseur. Aucune confirmation n’est assimilée à un mouvement physique ni à une réservation automatique.

      U441/U443 : une demande de 100 pièces vendredi peut recevoir une promesse de 60 vendredi et 40 lundi ; la demande et l’engagement de satisfaction restent lisibles séparément. ATP/CTP établissent les possibilités, Delivery Schedule Decision choisit l’échéancier et Fulfillment Plan Decision la cohérence du plan. Promise Proposal formalise les résultats pertinents sans refaire ces arbitrages ; Promise Confirmation établit l’engagement ; Promise Revision tient ses modifications autorisées.

      Supply Assignment maintient les liens entre ressources et commandes. Exemple fictif : remplacer l’affectation à l’arrivage A par B, avec mêmes quantités et mêmes conditions de satisfaction, peut préserver la promesse. Inversement, un retard de transport peut imposer de réexaminer la date promise sans changer les ressources affectées. Aucun de ces constats n’autorise à modifier automatiquement l’engagement ; selon U436, seul Reservation bloque les usages concurrents.

      Order Firming rend une intention ferme ; il ne confirme pas automatiquement les quantités et dates de satisfaction. Order Preparation & Revision tient le contenu demandé et ses versions ; la présente capacité tient la proposition et l’engagement de satisfaction. Elle ne possède ni un second choix d’échéancier ni l’autorité générale de modifier les Orders. Les conditions d’autorisation et de synchronisation restent à préciser.

      U445 adopte le nom Fulfillment Commitment, en remplacement de Promise Management. La définition développée et les contrats restent proposés ; aucun effet de réservation ni réalisation physique déduit du mot Commitment.
    market_comparisons:
    - vendor: Oracle
      product: Global Order Promising
      element_name: Schedule an availability result
      concept_name: Schedule an availability result
      element_type: Concept ou mécanisme métier documenté dans un produit
      relationship: Recouvrement partiel
      scope_summary: Résultat retenu après exploration.
      approach_summary: Appliquer la réponse choisie.
      similarities: Un résultat affiché n’est pas encore appliqué.
      differences: Schedule transmet des données de commande dans Oracle.
      flow_position: FLOW isole l’engagement de satisfaction des autres changements d’Order.
      source_title: Check Availability
      source_url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/25c/fascp/check-availability.html
      source_version: Oracle Fusion Cloud SCM 25C
      source_locator: Examine the Attributes ; Schedule the Order Line
      consulted_on: '2026-09-19'
      evidence_limits: Passage primaire consulté ; périmètre du produit documenté, sans preuve d’installation chez Beaumanoir.
      status: proposed
      source_refs:
      - U477
      - ELM350
      - CMP191
    - vendor: SAP
      product: SAP S/4HANA Cloud Public Edition / Backorder Processing
      element_name: Order confirmations
      concept_name: Order confirmations
      element_type: Concept ou mécanisme métier documenté dans un produit
      relationship: Recouvrement partiel
      scope_summary: Quantités déjà confirmées.
      approach_summary: Réexaminer les confirmations après changement.
      similarities: Les engagements doivent rester lisibles quand la situation évolue.
      differences: BOP rassemble contrôle, arbitrage et modification.
      flow_position: FLOW réserve la révision à une modification autorisée.
      source_title: Exploring Backorder Processing
      source_url: https://learning.sap.com/courses/optimizing-advanced-logistics-and-analytics-in-sap-s-4hana-cloud-public-edition/exploring-backorder-processing_fed6ddd5-39be-41ab-a977-e41a1c3715fe
      source_version: Cours SAP S/4HANA Cloud Public Edition ; édition non précisée
      source_locator: Backorder Processing — Introduction, Reprioritization & Reallocation, Order Confirmations
      consulted_on: '2026-09-19'
      evidence_limits: Documentation primaire consultée ; aucun choix de produit ni déploiement Beaumanoir déduit.
      status: proposed
      source_refs:
      - U435
      - U460
      - U477
      - ELM458
      - CMP191
    examples:
    - title: Demander 100 vendredi, promettre en deux temps
      situation: Une commande demande 100 pièces vendredi.
      outcome: La proposition porte sur 60 vendredi et 40 lundi ; la confirmation établit les quantités et dates engagées
        selon les autorisations applicables.
      lesson: La demande, la proposition et l’engagement restent lisibles séparément. Confirmer ne réserve pas automatiquement
        les ressources.
      source_refs:
      - U441
      - U443
      - U436
      - U462
    - title: Même promesse, autre ressource
      situation: 40 pièces étaient affectées à l’arrivage A ; l’arrivage B offre les mêmes conditions de satisfaction.
      outcome: L’affectation peut passer de A à B sans changer l’engagement. Inversement, un retard de transport peut conduire
        à réexaminer la date promise avec la même ressource.
      lesson: Fulfillment Commitment et Supply Assignment répondent à deux questions distinctes.
      source_refs:
      - U443
      - U462
    market_inspiration:
      choice: Tenir ce qui est proposé puis réellement promis évite de confondre une option avec un engagement pris. Fulfillment
        Commitment porte les quantités, dates et conditions de satisfaction ainsi que leurs révisions autorisées.
      flow_scope: Propositions, confirmations et révisions de satisfaction.
      flow_approach: Conserver distincts demande, réponse envisagée et engagement confirmé.
      synthesis:
      - 'Oracle Check Availability sépare le résultat exploré de son application. SAP BOP décrit le réexamen de confirmations
        déjà données. Ces documents éclairent deux moments de la vie d’une réponse : sa préparation et son évolution.'
      - FLOW les réunit sous Fulfillment Commitment, sans refaire les décisions de faisabilité ni d’échéancier. La confirmation
        documentaire d’une commande chez Microsoft est un usage plus large du mot confirmation ; elle ne suffit pas à définir
        cette responsabilité.
      examples:
      - title: Illustration FLOW — confirmer une part de la proposition
        situation: Une solution propose 60 pièces vendredi et 40 lundi pour une demande de 100.
        outcome: Seules les 60 du vendredi sont confirmées ; les 40 restent proposées.
        lesson: Le passage de l’exploration à l’application est documenté par Oracle ; FLOW précise ici la part engagée sans
          réservation implicite.
        source_title: Check Availability
        source_url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/25c/fascp/check-availability.html
