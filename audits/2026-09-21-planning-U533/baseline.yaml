- id: D09.d
  revision: 3
  kind: capability
  fields:
    name: Party / Role Ingestion
    definition: Recevoir les [personnes](glossary:TER046), leurs identifiants et leurs [rôles métier](glossary:TER047), puis
      intégrer les évolutions transmises par les maîtres externes pour maintenir une référence locale utilisable par les accords
      et opérations Supply.
    finality: Conserver une continuité d’identité entre les référentiels d’entreprise et les accords et opérations Supply.
    scope: |-
      Intégrer les identités, relations et rôles de référence reçus, avec leur contexte, leur provenance et leur validité lorsqu’ils sont fournis. Une évolution de rôle se rattache à la personne identifiée par la source.

      La réception ne crée pas une nouvelle identité d’entreprise, ne fusionne pas de sa propre initiative les personnes et ne certifie pas leur capacité juridique. Les conditions et engagements d’un accord restent dans Agreement ; les droits d’accès applicatifs sont hors de ce périmètre.

      Exemple fictif : Alpha, déjà connue comme fournisseur, devient aussi cliente. Le rôle reçu enrichit sa référence locale avec son contexte, sans créer une deuxième personne.
    nature: action
    market_comparisons:
    - vendor: Oracle
      product: Fusion Cloud Financials
      source_title: Customer Import
      source_url: https://docs.oracle.com/en/cloud/saas/financials/25d/oefbf/customerimport-3032.html
      source_version: 25D
      source_locator: File Links ; Import Trading Community Data in Bulk
