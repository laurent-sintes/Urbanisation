- id: D04.r
  revision: 7
  kind: capability
  fields:
    name: Consignment Replenishment Order
    definition: 'Demander et suivre un apport fournisseur : produits, quantités, destinations, dates et reste à recevoir,
      sans engagement d’achat des marchandises.'
    nature: management
    finality: Disposer d’un apport fournisseur attendu et traçable, distinct de l’acquisition des marchandises.
    scope: |-
      La capacité suit la demande sous accord de consignation, ses quantités attendues et le reste à recevoir. La réception conserve la propriété fournisseur selon l’accord. Le stock reçu relève ensuite de [Consigned Inventory Management](model:D01.h). Le terme Replenishment de Microsoft couvre ici l’alimentation du stock consigné, y compris le premier apport ; [Initial Stocking Decision](model:D05.g) et [Replenishment Decision](model:D05.e) restent distinctes. Les mutations mobilisent Lifecycle en D04 ; la structuration et l’archivage mobilisent Structuring et Archiving en D04. [Purchase Order](model:D04.j) conserve l’acte d’achat éventuel ; aucun achat fictif, réservation ou disponibilité de stock non reçu ne découle de cette demande.

      [Agreement](model:D11) fournit les conditions applicables, y compris celles de l’offre de stockage. [Inventory Optimization](model:D05) décide des besoins d’implantation ou de réassort ; [Service Requests](model:D04) porte les demandes correspondantes ; [Inventory Management](model:D01) applique le régime du stock et enregistre ses évolutions ; [Process Management](model:D06) orchestre les prestations physiques et numériques.

      Exemple fictif présenté et adopté : une demande porte sur 500 pièces pour une implantation. Les réceptions satisfont progressivement la demande d’apport. Les pièces restent ensuite gérées sous l’accord de consignation : vente autorisée, éventuel transfert de propriété, échéance de reprise. La fin de la demande ne met pas fin à la gestion de la consignation. Cet exemple ne décrit pas une pratique installée prouvée chez Beaumanoir.

      U398 : deux comportements explicitent les intentions de la demande : [Initial Stocking](model:BHV061), pour constituer le stock avant le lancement, et [Continuous Replenishment](model:BHV062), pour alimenter le stock pendant l’activité. La lisibilité de ces intentions justifie la décomposition même lorsque leur traitement est commun. Les fonctions de création, révision, annulation, suivi des livraisons partielles et clôture sont décrites pour cet Order et reliées aux capacités responsables. Leur caractère partagé ne dispense pas d’expliciter leur effet métier ; il ne suffit pas non plus à créer un comportement par opération.
