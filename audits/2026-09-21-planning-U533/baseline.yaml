- id: D06.d
  revision: 5
  kind: capability
  fields:
    name: Process Orchestration
    definition: Coordonner les prestations et leurs dépendances.
    finality: Coordonner la réalisation du plan retenu entre les exécutants.
    nature: orchestration
    scope: |-
      Coordonner le déclenchement et l’enchaînement des prestations du plan retenu, en tenant compte de leurs dépendances, des prises en charge et des faits d’exécution. Mobiliser Backing Service Orders pour tenir les demandes et leurs évolutions.

      Exemple : coordonner la préparation, la disponibilité du document et la collecte. Si la décision d’adaptation retient un autre transporteur, coordonner la modification des prestations concernées et leur nouvel enchaînement.

      La détermination de la variation du plan appartient à Process Adaptation Decision. L’orchestration peut lui transmettre un aléa, mais ne porte plus cette décision dans sa propre définition. Les exécutants conservent l’organisation de leurs opérations internes. Aucun moteur de workflow, contrôle humain systématique ou rollback physique universel n’est présumé.

      Frontière : Décision D06.f séparée ; pas de rollback physique ni seconde promesse.

      Convention U409 : le Process orchestre des Services. Les Tasks expriment les contributions au processus ; les services réalisent les prestations sollicitées, humaines, physiques ou numériques. Un appel informatique est un moyen de sollicitation ou de feedback, pas le service métier lui-même. Process Orchestration coordonne la progression ; Process Adaptation Decision choisit les adaptations ; Operations Tracking rend visibles les opérations et Process Tracking leur contribution à la progression du processus. Les exécutants gardent leurs opérations internes. Le périmètre Supply et les responsabilités des areas restent inchangés ; aucun moteur de workflow ou nouveau niveau descriptif imposé.
