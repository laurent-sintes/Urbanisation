        Promising réunit l’étude des possibilités, les choix de promesse et le maintien des propositions et engagements.
      flow_scope: Possibilités, coûts, échéancier et engagement de satisfaction.
      flow_approach: Séparer ce qui est possible, proposé puis confirmé.
      synthesis:
      - Microsoft utilise Order promising pour les dates de livraison calculées. Oracle Global Order Promising ajoute une
        recherche de sources, des alternatives et des règles de coût. Le même vocabulaire recouvre donc des périmètres produits
