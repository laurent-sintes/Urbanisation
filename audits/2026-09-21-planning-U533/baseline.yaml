      similarities: Choix d’une offre de transport adaptée au chargement.
      differences: L’exemple historique est centré sur le tarif, plus étroit que les contraintes FLOW.
      flow_position: Choisir les services et exécutants qui peuvent répondre aux prestations nécessaires. Service Selection
        Decision compare les options admissibles en tenant compte du besoin et des contraintes.
