      scope_summary: Besoins de vente et de transfert.
      approach_summary: Reclasser selon les règles de confirmation.
      similarities: Réexaminer la priorité quand le contexte évolue.
      differences: BOP applique aussi des changements de confirmation.
      flow_position: FLOW ne confond pas classement et application.
