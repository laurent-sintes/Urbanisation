        de capacités.
      element_name: Physical inventory / Cycle counting
      element_type: Concept documenté par la source primaire
      relationship: Recouvrement partiel
      similarities: Inventaire complet et comptage tournant vérifient les quantités.
      differences: Oracle impose des règles opératoires de son application ; FLOW n’impose pas l’arrêt systématique des mouvements.
      flow_position: 'Fiabiliser le stock en confrontant les quantités enregistrées à des comptages : Stocktaking qualifie
        les écarts et les corrections justifiées. Les constats physiques sont réalisés par les exécutants.'
