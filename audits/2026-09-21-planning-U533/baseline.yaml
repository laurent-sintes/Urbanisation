      scope_summary: Stock détenu chez le client, propriété fournisseur.
      approach_summary: Séparer réception et acquisition.
      evidence_limits: Documentation primaire de produit ; aucune preuve de réalisation Beaumanoir ni équivalence de catalogue
        de capacités.
      element_name: Consignment inventory
      element_type: Concept documenté par la source primaire
      relationship: Recouvrement partiel
      similarities: La réception ne transfère pas la propriété ; l’utilisation peut le faire.
      differences: Le scénario Microsoft est celui de matières de production, pas toutes les consignations retail.
      flow_position: 'Appliquer les conditions du stock appartenant encore au fournisseur : Consigned Inventory Management
        distingue détention, utilisation et acquisition. Les issues possibles dépendent de l’accord de consignation.'
