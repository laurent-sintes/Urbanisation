      concept_name: Task hold
      scope_summary: Étape d’une vente suspendue.
      approach_summary: Cibler la progression et justifier sa reprise.
    examples:
    - title: Réviser une partie sans effacer la version applicable
      situation: Une commande de 100 pièces est ferme et 60 pièces sont libérées. Une révision prépare le report de la date
        demandée des 40 autres pièces.
      outcome: Tant que cette révision n’est pas applicable, la version en vigueur demeure la référence ; aucune suspension
        des 60 pièces n’est implicite.
      lesson: Préparation, engagement ferme, autorisation de traitement et suspension sont des dimensions distinctes. Les
        réalisations acquises ne sont pas réécrites.
      source_refs:
      - U424
      - U462
    market_inspiration:
      choice: Savoir ce qui peut encore changer, commencer ou s’arrêter dans une commande. Order Lifecycle Management distingue
        ces droits et engagements au lieu de les résumer par un seul statut.
      flow_scope: Préparation, engagement, gel, lancement, suspension et fin de la commande.
      flow_approach: Rendre explicites les transitions autorisées et conserver les engagements et réalisations acquis.
      synthesis:
      - Oracle sépare les statuts des objets et les blocages des étapes ; Microsoft sépare les décisions d’approbation et
        de confirmation d’achat. Les deux montrent pourquoi « commande en cours » ne suffit pas.
      - FLOW organise ces questions en dimensions métier indépendantes. Une commande peut être engagée, partiellement réalisée
        et suspendue pour son reliquat sans contradiction.
      examples:
      - title: Illustration FLOW — Engagée mais suspendue
        situation: Une commande confirmée est bloquée avant expédition pour vérifier l’adresse.
        outcome: Le blocage porte sur le départ ; l’engagement reste identifié.
        lesson: Reprendre le traitement et réviser la promesse sont deux décisions différentes.
