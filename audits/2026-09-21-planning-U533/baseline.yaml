        sans reprendre l’IA, les données familiales ou la maîtrise centrale dans FLOW.
      element_name: Identify Customer / Get Customer Profile / Get Customer Relationships
      concept_name: Identify Customer / Get Customer Profile / Get Customer Relationships
      element_type: Fonction documentée par la source primaire
      scope_summary: Personnes, organisations, profils et relations.
      approach_summary: Identifier un client puis consulter son profil et ses relations.
      similarities: La recherche et la lecture complètent l’intégration des données.
      differences: Présentation d’une extension Informatica ; ni agent IA, ni relations familiales, ni maîtrise MDM introduits
        dans FLOW.
      relationship: Recouvrement partiel
      flow_position: Savoir qui se trouve derrière une référence et à quel titre cette personne intervient. Party / Role Visibility
        rend consultables les identités et rôles reçus des maîtres d’entreprise.
      status: proposed
      source_refs:
      - U505
      - ELM507
      - CMP204
    market_inspiration:
      choice: Savoir qui se trouve derrière une référence et à quel titre cette personne intervient. Party / Role Visibility
        rend consultables les identités et rôles reçus des maîtres d’entreprise.
      flow_scope: Personnes, identifiants, rôles et relations de référence contextualisés.
      flow_approach: Retrouver la personne puis lire les rôles et contextes disponibles dans la référence locale.
      synthesis:
      - SAP documente la recherche et la consultation des partenaires et rôles ; Informatica expose la consultation de profils
        et relations de personnes ou d’organisations.
      - FLOW retient cette connaissance de référence, avec un périmètre centré sur les accords et processus Supply. Consulter
