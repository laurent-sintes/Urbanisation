      choice: Reconnaître un produit et ses [variantes](glossary:TER058) avant de les utiliser dans une commande. Product
        Reference reçoit ces références indépendamment des catalogues qui les proposent.
      flow_scope: Produits, variantes, identifiants et caractéristiques utiles à la Supply.
      flow_approach: Conserver le lien au maître externe, sans administrer le produit.
      synthesis:
      - Microsoft distingue la définition commune du produit de ses variantes ; Oracle décrit leur réception et leur traitement
        dans Product Hub. Les deux couvrent aussi des activités de gestion du référentiel.
