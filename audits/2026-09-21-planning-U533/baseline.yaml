      choice: Une Area de planification porte le plan d'ensemble au sein de Supply Chain Orchestration.
      flow_scope: Cohérence et actualisation des plans de couverture des besoins Supply.
      flow_approach: Relier les plans aux faits opérationnels et mobiliser les responsabilités spécialisées.
      synthesis:
      - SAP associe plans Supply, scénarios, réponse aux changements à court terme et coordination avec l'exécution. Cela
        étaye une planification régulièrement actualisée.
      - Oracle distingue Supply Planning et le composant qui orchestre les approvisionnements et leurs changements. FLOW retient
        une distinction de responsabilités au sein d'un même Domain, sans recopier la frontière des produits.
      examples:
