- id: D07.a
  revision: 9
  kind: capability
  fields:
    name: Service Requirements Decision
    definition: Déterminer les prestations nécessaires.
    finality: Déterminer les résultats de prestation nécessaires à la réalisation du besoin Supply.
    nature: decision
    scope: |-
      Déterminer, à partir du besoin Supply et de ses contraintes, les prestations et résultats requis : préparation, réception, transport ou production de documents. Préciser biens ou documents concernés, quantités, destinataires, lieux et échéances utiles.

      Exemple : réaliser la livraison requiert une préparation, un document et un transport. La décision explicite ces besoins ; Backing Service Orders tient ensuite les demandes adressées aux exécutants et leurs évolutions. La décision de service choisit les moyens de service pour y répondre.

      La capacité ne se limite plus à formuler un message ou à exprimer un Backing Service Order. Elle ne recrée ni l’autorisation de la commande D04, ni sa promesse D15, ni un Agreement ou un Case. D07.a conserve son identité pour la responsabilité de détermination des prestations, précisée par U245/U247.

      Frontière : Ne choisit pas encore l’exécutant et ne pilote pas ses opérations internes.
