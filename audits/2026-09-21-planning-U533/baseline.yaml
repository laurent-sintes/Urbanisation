      - CMP204
    - vendor: Informatica
      product: MDM — extension Agentforce
      source_title: Connecting Master Data to Agentforce
      source_url: https://www.informatica.com/content/dam/informatica-cxp/techtuesdays-slides-pdf/Connecting%20Master%20Data%20to%20Agentforce.pdf
      source_version: Présentation du 10 mars 2026
      source_locator: 'Diapositives 16–17 : Agentforce Actions ; CAI Processes and MDM APIs'
      consulted_on: '2026-09-19'
