- id: D07.b
  revision: 8
  kind: capability
  fields:
    name: Backing Service Orders
    definition: 'Gérer les demandes de prestation adressées aux exécutants et leur cycle de vie : émission, acceptation ou
      refus, modification, annulation et clôture, selon le service.'
    finality: Tenir les demandes de prestation, leur prise en charge et leurs évolutions de façon explicite et traçable.
    nature: management
    scope: |-
      Les [Backing Service Orders](glossary:TER066) portent les prestations demandées aux exécutants pour réaliser une prise en charge. [Service Requests](model:D04) porte les demandes de travail du Domain, reçues ou nées de son activité ; la présente capacité tient les sollicitations des exécutants mobilisés pour y répondre. Leur origine interne ou externe ne suffit pas à distinguer ces responsabilités.

      Tenir ce qui est demandé à un exécutant, ce qu’il accepte de réaliser et les évolutions de cette prise en charge. L’émission d’une demande, son acceptation et sa réalisation restent distinctes. Les opérations possibles dépendent du service et de son état ; aucun cycle universel ni acceptation systématiquement différée n’est imposé.

      Exemple : demander à l’entrepôt de préparer 100 colis avant 16 h ; enregistrer l’acceptation, le refus ou une autre échéance proposée ; tenir ensuite une demande de modification ou d’annulation et la réponse correspondante. Le tracking renseigne en parallèle la préparation commencée, les 60 colis prêts ou le retard annoncé.

      Requirements Decision détermine les prestations nécessaires ; Orchestration coordonne les prestations et leurs dépendances ; Adaptation Decision détermine la variation du plan. Cette gestion met à jour transactionnellement les demandes et leurs états, unitairement ou en groupe selon les interfaces disponibles ; ces modalités ne créent pas de capacités supplémentaires.

      Conserver la distinction entre SLA configuré, engagement individuel, estimation et résultat. Les exécutants gardent leurs opérations internes et D15 la promesse Supply. D07.b conserve la gestion des prises en charge et engagements, désormais explicitée dans le cycle du Backing Service Order.
