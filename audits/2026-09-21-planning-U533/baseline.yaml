- id: D05.a
  revision: 8
  kind: capability
  fields:
    name: Inventory Target Decision
    definition: Déterminer les objectifs de stock et les seuils associés, par produit, lieu et période, selon les besoins,
      le niveau de service recherché, les délais et les risques.
    finality: Définir les niveaux de stock auxquels comparer la situation connue ou attendue selon le compromis de service,
      immobilisation et risque.
    nature: decision
    scope: |-
      Déterminer et réviser les niveaux à viser selon le produit, le lieu, l’horizon, les besoins, les délais et leurs incertitudes. Les objectifs de service, le coût du stock et les risques alimentent les arbitrages ; les formules et seuils détaillés restent à préciser. Les calculs nécessaires font partie de la décision.

      Exemple fictif : retenir un minimum de 40 pièces, un seuil de réassort de 60 et une cible de 100 pour un magasin. Ces nombres illustrent des effets différents et ne constituent pas une règle adoptée. Le seuil déclencheur ne signifie pas que les pièces restantes sont interdites à la vente.

      Cette décision détermine les paramètres à retenir ; la gestion de leur validité et leur mise à jour transactionnelle relèvent du management opérationnel. Elle ne réserve pas le stock à un Order, ne promet pas une fourniture et ne déclenche pas à elle seule un réassort. [Inventory Planning](model:D05.f) peut la mobiliser à nouveau avec d’autres hypothèses.

      Frontière : Cible haute différente d’un plafond de groupe ou d’une capacité physique.
    market_comparisons:
    - vendor: Microsoft
      product: Dynamics 365 Supply Chain Management
      source_title: Use the safety stock journal to update minimum coverage for items
      source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/master-planning/safety-stock-journal
      source_version: '2025-08-22'
      source_locator: Calculate minimum coverage ; Calculate a proposal ; Update minimum
      consulted_on: '2026-09-19'
      concept_name: Safety stock calculation
      scope_summary: Propositions de minimum par produit et lieu.
      approach_summary: Calculer puis retenir un niveau.
      evidence_limits: Documentation primaire de produit ; aucune preuve de réalisation Beaumanoir ni équivalence de catalogue
        de capacités.
      element_name: Safety stock calculation
      element_type: Concept documenté par la source primaire
      relationship: Recouvrement partiel
      similarities: Le calcul produit une proposition de minimum à examiner.
      differences: Le minimum Microsoft n’est pas toujours une cible complète de position de stock.
      flow_position: 'Choisir combien de stock viser et quels seuils retenir : Inventory Target Decision détermine les objectifs
        par produit, lieu et période. Une cible est un résultat de décision, pas une commande de réassort.'
      status: proposed
      source_refs:
      - U328
      - ELM204
      - CMP112
      - U329
      - U462
      - U477
      - ELM421
      - CMP190
    - vendor: Oracle
      product: Oracle Fusion Cloud SCM
      source_title: Policy Assignment Sets
      source_url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/26b/faurp/policy-assignment-sets.html
      source_version: 26B
      source_locator: Policy Parameters — fixed cycle, min-max, ROP/EOQ, PAR
      consulted_on: '2026-09-19'
      concept_name: Replenishment policy
      scope_summary: Seuils, cibles et cycles de commande.
      approach_summary: Calculer les paramètres puis les utiliser.
      evidence_limits: Documentation primaire de produit ; aucune preuve de réalisation Beaumanoir ni équivalence de catalogue
        de capacités.
      element_name: Replenishment policy
      element_type: Concept documenté par la source primaire
      relationship: Recouvrement partiel
      similarities: Oracle calcule des paramètres de stock par produit et lieu.
      differences: La page couvre aussi les règles de commande, séparées dans FLOW.
      flow_position: 'Choisir combien de stock viser et quels seuils retenir : Inventory Target Decision détermine les objectifs
        par produit, lieu et période. Une cible est un résultat de décision, pas une commande de réassort.'
      status: proposed
      source_refs:
      - U328
      - ELM204
      - CMP112
      - U329
      - U477
      - ELM371
      - CMP190
    decomposition_rationale: 'Trois façons de déterminer les cibles selon la demande servie et le périmètre d’arbitrage :
      disponibilité client et contraintes locales du magasin ; alimentation de la demande aval du centre de distribution ;
      coordination des protections et des cibles entre échelons interdépendants. Le bénéfice est de rendre explicites les
      compromis locaux et globaux sans créer un comportement par type de bâtiment ni une séquence imposée.'
    examples:
    - title: Choisir où porter le stock de sécurité
      situation: Un même réseau comprend un entrepôt et plusieurs magasins.
      outcome: La décision compare une sécurité davantage portée par l’entrepôt à une sécurité répartie en magasins selon
        le réassort et le service attendu.
      lesson: L’objectif est un ensemble cohérent de cibles, sans centralisation systématique ni baisse garantie du stock
        total.
      source_refs:
      - U331
      - U332
      - U462
    market_inspiration:
      choice: 'Choisir combien de stock viser et quels seuils retenir : Inventory Target Decision détermine les objectifs
        par produit, lieu et période. Une cible est un résultat de décision, pas une commande de réassort.'
      flow_scope: Objectifs et seuils de stock selon service, délais et risques.
      flow_approach: Arbitrer la couverture souhaitable avant de déterminer les apports.
      synthesis:
      - Microsoft distingue proposition de minimum et application ; Oracle relie minimum, sécurité et cible aux méthodes de
        réassort. Les nombres servent des rôles différents et doivent être nommés.
      - FLOW choisit Inventory Target Decision pour réunir la détermination des objectifs et seuils. Leur maintien relève
        de Supply Protection ; les apports sont décidés par les capacités de réapprovisionnement.
      examples:
      - title: Illustration FLOW — objectif révisé avant application
        situation: Le service recherché augmente et le délai fournisseur devient moins fiable.
        outcome: Une nouvelle cible est comparée à la précédente, avec ses conséquences sur le stock immobilisé.
        lesson: Retenir la cible ne signifie pas qu’elle est déjà appliquée ni que les achats correspondants sont passés.
        source_title: Use the safety stock journal to update minimum coverage for items
        source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/master-planning/safety-stock-journal
        source_refs:
        - U477
        - ELM421
        - CMP190
