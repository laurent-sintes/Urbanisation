        Visibility rend cette information compréhensible dans son contexte, sans transformer un plafond en disponible garanti.
      status: proposed
      source_refs:
      - U477
      - ELM397
      - CMP193
      concept_name: Resource requirement / Scheduling
      scope_summary: Besoins d’une intervention et ressources pour la réaliser.
      approach_summary: Rechercher une ressource répondant au besoin et au créneau.
    market_inspiration:
      choice: Connaître la capacité annoncée par un exécutant pour éclairer les décisions Supply. Service Capacity Visibility
        rend cette information compréhensible dans son contexte, sans transformer un plafond en disponible garanti.
      flow_scope: Capacité, unité, période, calendrier, origine et fraîcheur communiqués.
      flow_approach: Présenter ce qui est connu avec son sens et ses limites.
      synthesis:
