    examples:
    - title: Livrer 100 tee-shirts à un magasin vendredi
      situation: Le magasin attend 100 tee-shirts pour vendredi. Un entrepôt en détient 60 et un fournisseur doit en livrer
        40 jeudi.
      outcome: La Supply vérifie si les 100 peuvent être livrés à temps, établit la quantité et la date promises, puis coordonne
        préparation et transport. Si les 40 sont retardés, elle examine les alternatives et les conséquences sur la commande.
      lesson: La Supply organise et suit la satisfaction de la demande ; les exécutants réalisent les opérations physiques.
        La promesse ne réserve pas implicitement le stock.
      source_refs:
      - U470
      - U436
    - title: Recevoir une nouvelle référence produit
      situation: Une nouvelle variante de tee-shirt, bleu taille M, est créée dans l’application qui fait autorité sur les
        produits.
      outcome: Son identifiant et ses caractéristiques utiles sont reçus dans [Product Reference](glossary:TER052). La Supply
        peut alors utiliser cette référence dans ses commandes et ses stocks.
      lesson: La projection sert aux opérations Supply. La création et les corrections de la référence restent dans la source
        de vérité externe.
      source_refs:
      - U470
      - U97
      - U460
    finality: Organiser l’approvisionnement, la répartition et la livraison des produits pour tenir les quantités et les dates
      promises.
    scope: |-
      Les applications externes restent les sources de vérité des référentiels : c’est là que leurs données sont créées, modifiées ou supprimées. La Supply en reçoit des projections, c’est-à-dire les références utiles à ses opérations, par [Reference Ingestion](glossary:TER050). Elle ne les administre pas à leur place.

      Le périmètre se concentre ainsi sur l’orchestration : commandes, stocks, promesses, optimisation et coordination des services. Les exécutants préparent, transportent et remettent les produits ; la Supply reçoit leurs faits de réalisation pour suivre les engagements et traiter les écarts.

      [Supply Planning](model:D17) porte le plan d'ensemble régulièrement actualisé. Les Areas opérationnelles conservent l'adaptation aux impondérables ; la planification mobilise leurs décisions et reçoit les faits utiles à la révision des plans.
    market_inspiration:
      choice: 'Nous appelons ce domaine Supply Chain Orchestration parce qu’il organise comment satisfaire les demandes :
        quelles quantités fournir, depuis où, à quelle date et avec quels moyens. Il coordonne les [commandes](glossary:TER012),
        les [stocks](glossary:TER005), les engagements et les prestations, tandis que les applications de référence gèrent
        les données produit et partenaires, et que les entrepôts et transporteurs réalisent les opérations physiques.'
      flow_scope: Planification Supply, commandes, stocks, engagements, optimisation et coordination de la réalisation.
      flow_approach: Décrire les responsabilités métier et leur coopération, indépendamment des outils.
      synthesis:
      - CSCMP et Microsoft utilisent un nom large, pour une discipline et une suite logicielle respectivement. Notre périmètre
        est plus ciblé, notamment parce que la gestion des données de référence et la réalisation physique restent chez les
        responsables concernés.
      - 'La recherche et SCOR éclairent la coopération entre acteurs, avec des angles différents : rôle du prestataire pour
        l’article, stratégie et organisation de la chaîne pour SCOR. FLOW décrit les responsabilités à assurer sans imposer
        cette organisation.'
      - Oracle utilise exactement notre nom, avec d’autres frontières. Son module coopère avec des applications distinctes
        pour les commandes, les stocks et les promesses ; notre domaine réunit aussi ces responsabilités.
      - 'Kinaxis emploie Supply Chain Orchestration pour un périmètre allant de la planification à l''exécution. FLOW inclut
        le plan d''ensemble dans ce Domain, sans reprendre tout le périmètre stratégique ou logiciel de cette offre. Oracle
        conserve une portée produit plus étroite : il n''existe pas ici de découpage commun imposé par ces deux noms d''offre.'
      examples:
      - title: 75 pièces livrables sur les 100 attendues
        situation: Un fournisseur ne peut livrer que 75 pièces sur les 100 attendues.
        outcome: Oracle décrit une orchestration qui recherche une autre source pour les 25 manquantes et, si elle n’en trouve
          pas, signale l’écart au responsable de la commande.
        lesson: Dans FLOW, ce cas permet d’expliquer comment relier les approvisionnements attendus, les solutions alternatives
          et les conséquences sur la quantité ou la date promises. La préparation et le transport sont ensuite réalisés par
          les exécutants.
        source_title: Oracle — Overview of Supply Chain Orchestration, exemple de réduction de 100 à 75 unités (26B)
        source_url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/26b/fauco/overview-of-supply-orchestration.html
        source_refs:
        - U474
        - U475
        - ELM294
        - CMP188
