- id: D09.e
  revision: 1
  last_modified: '2026-09-19T17:22:35.945608Z'
  kind: capability
  fields:
    name: Party / Role Visibility
    definition: Retrouver une [personne physique ou morale](glossary:TER046) et consulter son identité, ses relations et les
      [rôles](glossary:TER047) sous lesquels elle participe aux accords et opérations Supply.
    finality: Savoir qui intervient et à quel titre avant d’interpréter les accords et échanges qui le concernent.
    scope: |-
      Rechercher une personne par ses identifiants ou informations disponibles ; consulter ses rôles de référence, relations et contextes reçus, avec leur provenance et leur validité lorsqu’elles sont connues. Les liens permettent de retrouver les accords concernés.

      Agreement porte le contenu des engagements. La consultation ne crée ni nouvelle identité, ni rôle, ni habilitation applicative et ne certifie pas la capacité juridique d’une personne. Le rôle de contact ne suffit pas à désigner un cocontractant.

      Exemple fictif : retrouver Alpha par son identifiant, constater ses rôles client et fournisseur et identifier le contexte dans lequel chacun s’applique.
    nature: knowledge
    market_comparisons:
    - vendor: SAP
      product: S/4HANA — Purchasing
      source_title: Creating Business Partners
      source_url: https://learning.sap.com/courses/purchasing-in-sap-s-4hana/creating-business-partners
      source_version: Cours web ; numéro de release non affiché
      source_locator: Business Partner Concept ; Category ; Relationships ; Transactions and Apps
      consulted_on: '2026-09-19'
      evidence_limits: Texte primaire consulté ; appui sélectif, sans conformité ni réalisation Beaumanoir déduite.
      element_name: Search / Display Business Partners
      concept_name: Search / Display Business Partners
      element_type: Fonction documentée par la source primaire
      scope_summary: Partenaires, catégories, rôles et relations.
      approach_summary: Rechercher une identité et afficher les informations de référence.
      similarities: L’identité et les relations sont consultables en contexte métier.
      differences: SAP offre aussi une maintenance du maître ; FLOW ne retient ici que sa projection en lecture.
      relationship: Recouvrement partiel
      flow_position: Savoir qui se trouve derrière une référence et à quel titre cette personne intervient. Party / Role Visibility
        rend consultables les identités et rôles reçus des maîtres d’entreprise.
      status: proposed
      source_refs:
