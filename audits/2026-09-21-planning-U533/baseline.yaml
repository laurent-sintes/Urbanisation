      element_name: Task hold
      element_type: Concept et usage documentés
      relationship: Recouvrement partiel
      similarities: Une suspension vise une étape déterminée.
      differences: La levée d’un blocage ne confirme ni une nouvelle promesse ni la clôture de l’ordre.
      flow_position: Rendre explicites les transitions autorisées et conserver les engagements et réalisations acquis.
