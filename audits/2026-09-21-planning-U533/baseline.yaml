- id: D01.g
  revision: 3
  kind: capability
  fields:
    name: Record Inventory Movements
    definition: 'Enregistrer, qualifier et conserver les mouvements de stock et leurs justifications : réceptions, sorties,
      transferts, changements d’état ou de propriété et ajustements justifiés ; identifier les quantités concernées, les dates
      et les références explicatives, y compris sans déplacement physique.'
    finality: Disposer d’un historique traçable des faits qui expliquent les variations du stock.
    scope: |-
      Exemple fictif : Tracer -5 justifié par comptage sans effacer le mouvement initial.

      Précision éditoriale U435 : conserver la date du fait, sa date de connaissance, son origine et une référence rapprochant une correction du fait antérieur. Un même fait reçu plusieurs fois ne produit pas plusieurs mouvements. La correction reconnue reste traçable sans effacer le fait initial. Exemple fictif : une réception déclarée à 100 est corrigée à 80 ; conserver le lien explicatif entre les faits, puis fournir le résultat à Inventory Tracking. Identifiants techniques, dédoublonnage et propagation restent à concevoir ; aucune architecture événementielle imposée.
