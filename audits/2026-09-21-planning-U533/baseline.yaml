        par composant. Deux documents Microsoft ne prouvent pas un consensus interéditeurs.
      element_name: Catalog picker
      concept_name: Catalog picker
      element_type: Fonction documentée par la source primaire
      scope_summary: Liste des catalogues accessibles dans un site B2B.
      approach_summary: Parcourir les catalogues puis accéder à leur contenu.
      similarities: Plusieurs catalogues peuvent être retrouvés et distingués.
      differences: Composant d’interface commerciale, sans équivalence de capacité ni prescription de portail FLOW.
      relationship: Recouvrement partiel
      flow_position: Rendre lisibles les offres et leurs conditions de référence. Product Catalog Visibility permet de retrouver
        un catalogue et d’en comprendre le contenu et l’applicabilité renseignée.
      status: proposed
      source_refs:
      - U505
      - ELM510
      - CMP204
    market_inspiration:
      choice: Rendre lisibles les offres et leurs conditions de référence. Product Catalog Visibility permet de retrouver
        un catalogue et d’en comprendre le contenu et l’applicabilité renseignée.
      flow_scope: Catalogues, offres, références produit et conditions d’applicabilité enregistrées.
      flow_approach: Rechercher et parcourir l’offre reçue, sans recalculer ni administrer ses conditions.
      synthesis:
      - 'Ces deux documents Microsoft se complètent : l’un décrit les informations consultables, l’autre l’accès à plusieurs
        catalogues. Ils ne constituent pas une preuve de consensus interéditeurs.'
