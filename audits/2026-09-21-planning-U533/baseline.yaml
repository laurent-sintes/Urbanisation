    market_inspiration:
      choice: Retrouver les conditions et engagements qui s’appliquent aux commandes. Agreement reçoit la projection du [contrat](glossary:TER048)
        complet ; les commandes en consomment les conditions sans devenir le contrat.
      flow_scope: Cadre, conditions, périodes et engagements en quantité ou valeur.
      flow_approach: Relier le contrat reçu aux parties, catalogues et commandes concernés.
      synthesis:
      - Microsoft décrit un accord d’achat consommé par plusieurs commandes. Oracle montre comment transmettre un contrat
        vers Purchasing puis suivre l’accord correspondant. Le premier éclaire le contenu et son utilisation, le second son
        passage entre systèmes.
      - FLOW réunit ces repères dans une projection consultable. Il ne reprend ni la négociation, ni l’approbation du contrat
        maître, et ne réduit pas Agreement à un tarif ou à une seule commande.
      - Oracle distingue des accords avec détail des produits et d’autres portant seulement des conditions. SAP décrit l’assortiment
        par ses articles, destinataires et périodes. FLOW relie un assortiment à l’accord quand il est convenu, sans rendre
        contractuelle toute sélection interne.
      examples:
      - title: Illustration FLOW — plusieurs commandes sous un accord
        situation: Un accord prévoit un engagement annuel ; trois commandes sont passées à des dates différentes.
        outcome: Chaque commande utilise les conditions applicables et contribue à la consommation de l’engagement.
        lesson: L’accord reste identifiable indépendamment de ses commandes.
        source_title: Purchase agreements
        source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/procurement/purchase-agreements
        source_refs:
        - U477
        - ELM426
        - CMP193
    scope: |-
      Les conditions et engagements convenus entre parties : cadre contractuel, dispositions particulières, périodes et engagements en quantité ou en valeur.

      Un accord peut référencer ou figer un [assortiment](glossary:TER087) convenu ; il peut aussi porter des conditions sans liste de produits. Assortment reste une référence distincte, qui peut également représenter une sélection interne de magasins ou de canaux sans accord fournisseur dédié.

      La Supply reçoit le contrat et la référence de sélection convenus depuis les sources externes. Elle ne négocie pas l’accord et ne modifie pas son contenu en recevant un changement d’assortiment. Les commandes et leur promesse restent distinctes.
