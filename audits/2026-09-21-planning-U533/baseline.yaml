- id: D05.d
  revision: 3
  kind: capability
  fields:
    name: Group Protection Decision
    definition: Déterminer les quantités à protéger ou les limites d’usage par canal ou groupe de bénéficiaires.
    finality: Déterminer la répartition des droits d’usage du stock entre groupes, en préservant les usages retenus.
    nature: decision
    scope: |-
      Déterminer les quantités protégées et limites d’usage des canaux, régions ou groupes de bénéficiaires, avec leur périmètre et leur période. Préserver un accès minimum et plafonner une consommation répondent à des contraintes distinctes ; la décision comprend les calculs et la comparaison des options.

      Exemple fictif : sur 1 000 pièces, protéger 200 pour le web et plafonner à 500 la consommation d’un groupe de clients professionnels. Ce ne sont ni deux stocks physiques distincts ni une formule de décompte universelle. Les droits doivent rester cohérents avec les engagements et la couverture du réseau.

      [Supply Protection](model:D02.b) gouverne et applique les droits retenus. [Supply Assignment](model:D02.e) affecte des ressources aux commandes. La [Reservation](model:D02.c) porte ses effets d’engagement propres, à articuler sans double décompte. Le nom historique Stock Allocation Decision désignait cette même décision sur les groupes ; l’ancien identifiant est conservé.
    market_comparisons:
    - vendor: Microsoft
      product: Dynamics 365 Supply Chain Management
      source_title: Inventory Visibility inventory allocation
      source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/inventory/inventory-visibility-allocation
      source_version: Documentation en ligne sans édition affichée
      source_locator: Business background and purpose ; virtual pool ; Terminology
      consulted_on: '2026-09-19'
      concept_name: Inventory allocation
      scope_summary: Enveloppes par canal, région ou groupe.
      approach_summary: Préserver une part et suivre sa consommation.
      evidence_limits: Documentation primaire de produit ; aucune preuve de réalisation Beaumanoir ni équivalence de catalogue
        de capacités.
      element_name: Inventory allocation
      element_type: Concept documenté par la source primaire
      relationship: Recouvrement partiel
      similarities: L’enveloppe organise le partage entre groupes.
      differences: Microsoft décrit aussi l’application et la consommation ; FLOW isole ici le choix des quantités.
      flow_position: 'Choisir combien préserver pour chaque groupe et quelles limites lui imposer : Group Protection Decision
        arbitre ces quantités selon les besoins et priorités. Les droits retenus sont ensuite appliqués par Supply Protection.'
      status: proposed
      source_refs:
      - U435
      - U477
      - ELM410
