  fields:
    name: Product Reference
    definition: Recevoir les références Product et leurs Product Variants depuis leurs maîtres externes, indépendamment des
      catalogues qui les proposent. Product porte un rôle Article ou Container. Distinguer ces références des Product Units,
      exemplaires physiques suivis dans les opérations ; les identifiants commerciaux ne constituent pas à eux seuls leur
      identité individuelle.
    finality: Disposer de références produit communes aux catalogues et aux opérations de la Supply, pour les biens jouant
      un rôle Article ou Container.
    independence: Références produit autonomes des catalogues ; une même variante peut être proposée dans plusieurs catalogues.
      Correspondances avec SKU et conditionnements à préciser.
    market_comparisons:
