    market_inspiration:
      choice: Choisir comment faire évoluer le plan quand l’exécution rencontre un aléa. Process Adaptation Decision détermine
        la variation à retenir et signale à la promesse Supply les effets qui la concernent.
      flow_scope: Alternatives de service, de collecte ou de réalisation du plan.
      flow_approach: Réexaminer les options à partir des faits et contraintes actualisés.
      synthesis:
      - Camunda traite les exceptions dans des processus impliquant plusieurs intervenants. Microsoft IOM adapte les parcours
        de satisfaction aux politiques et contraintes. Les deux associent réaction à l’aléa et progression du parcours.
      - FLOW rend visible la décision d’adaptation comme responsabilité distincte. Orchestration met en œuvre le nouvel enchaînement
        ; un changement de date promise nécessite le réexamen de la promesse, pas une conclusion implicite du suivi.
      examples:
