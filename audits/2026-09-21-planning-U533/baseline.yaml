  fields:
    name: Supply Chain Orchestration
    definition: 'Préparer et actualiser le plan d''ensemble de la Supply, décider quels produits fournir, en quelle quantité,
      depuis quel lieu et à quelle date, puis coordonner les prestations nécessaires jusqu’à leur réalisation. La [Supply
      Chain](glossary:TER084), ou chaîne d’approvisionnement, relie les fournisseurs, les entrepôts, les transporteurs, les
      magasins et les clients. Ce domaine en assure l’[orchestration](glossary:TER031) : il suit les [commandes](glossary:TER012)
      et les [stocks](glossary:TER005), établit les engagements et adapte les choix lorsque la situation change.'
    market_comparisons:
    - vendor: Zacharia, Sanders et Nix
      product: Recherche — Journal of Business Logistics
      element_name: The Emerging Role of the Third-Party Logistics Provider (3PL) as an Orchestrator
      element_type: Article scientifique
      relationship: Appui sémantique et recouvrement partiel
      similarities: L’orchestration coordonne un réseau de partenaires et facilite leur coopération par le partage de l’information.
      differences: L’article étudie le rôle d’un prestataire logistique coordonnant plusieurs entreprises. FLOW décrit des
        responsabilités métier sans imposer ce prestataire ni cette organisation.
      flow_position: La finalité de coordination éclaire notre choix de vocabulaire ; le périmètre FLOW reste défini par ses
        responsabilités propres.
      term_choice: Orchestrator atteste un usage scientifique de la notion d’orchestration, distinct d’un nom de logiciel.
      definition_choice: Décrire les responsabilités et leur coopération sans présupposer l’acteur qui les réalisera.
      concept_name: Orchestrator
      scope_summary: Un prestataire logistique coordonne plusieurs entreprises.
      approach_summary: Partager l’information et organiser la coopération entre partenaires. L’article étudie un rôle d’acteur.
      source_title: The Emerging Role of the Third-Party Logistics Provider (3PL) as an Orchestrator
      source_url: https://bpb-us-w2.wpmucdn.com/wordpress.lehigh.edu/dist/e/653/files/2018/01/Zacharia-JBL-3PL-Orchestrator-Role-2011-27dqkbl.pdf
      source_version: Journal of Business Logistics, 2011, 32(1), 40–54 ; DOI 10.1111/j.2158-1592.2011.01004.x
      source_locator: Introduction p. 40 ; modèle p. 45 ; exemples p. 48–49 ; limites p. 50.
      consulted_on: '2026-09-19'
      status: proposed
