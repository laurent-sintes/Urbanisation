    market_inspiration:
      choice: Établir à quelles conditions une commande deviendrait satisfaisable permet de proposer une solution quand la
        situation actuelle ne suffit pas. CTP couvre les adaptations de ressources, de solution ou d’engagements, avec leurs
        impacts et autorisations nécessaires.
      flow_scope: Possibilités après adaptation de la situation de référence.
      flow_approach: Mobiliser les décisions responsables puis expliciter les conditions de faisabilité.
      synthesis:
      - Le CTP de Microsoft insiste sur les matières et capacités permettant de fabriquer. SAP traite d’autres leviers sous
        ABC, pour les alternatives, et BOP, pour les confirmations à réexaminer. Ces noms décrivent des fonctions différentes,
        pas une définition commune de CTP.
      - FLOW rassemble la faisabilité sous adaptation, tout en laissant les priorités, les choix économiques et les autorisations
        à leurs responsables. Un autre site déjà admissible relève encore d’ATP ; envisager une adaptation ne l’applique pas.
      examples:
