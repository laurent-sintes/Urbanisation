      concept_name: Business Process Tracking
      scope_summary: Étapes métier reliées aux résultats des services.
      approach_summary: Corréler les faits autour d’un même parcours.
    market_inspiration:
      choice: Comprendre où en sont les prestations et ce qui reste attendu. Operations Tracking distingue les faits, les
        estimations et les engagements pour rendre la progression lisible.
      flow_scope: Opérations d’entrepôt, transport, magasin et contributions au processus, y compris documentaires.
      flow_approach: Relier les retours connus aux prestations avec leur date et leur origine.
      synthesis:
      - GS1 organise les événements de traçabilité autour des objets et des étapes physiques. Azure Business Process Tracking
        relie les résultats de services aux étapes d’un processus métier. Ces perspectives sont complémentaires, et non deux
        noms du même suivi.
      - FLOW les réunit dans une responsabilité de visibilité. Il n’en déduit ni instrumentation uniforme, ni temps réel garanti
        ; choisir une adaptation et l’appliquer restent des responsabilités distinctes.
      examples:
      - title: Illustration FLOW — colis prêts, document attendu
        situation: La préparation est terminée, mais le document nécessaire à l’expédition n’est pas encore disponible.
        outcome: Le suivi explique les deux états et leur contribution au parcours.
        lesson: La progression physique ne suffit pas à conclure que tout est prêt à partir.
        source_title: What is Azure Business Process Tracking?
        source_url: https://learn.microsoft.com/en-us/azure/business-process-tracking/overview
