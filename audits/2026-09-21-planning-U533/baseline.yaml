    nature: action
    decomposition_rationale: 'Les parcours changent la nature de l’attendu, la destination, les dépendances entre commandes
      et les preuves de réalisation : apport en stock, livraison directe au client, prestation. Cette différence métier justifie
      la décomposition sans recopier le cycle de vie commun. Supplier Confirmation ajoute le mécanisme de construction d’un
      engagement avec une autre partie, qui peut répondre autrement que demandé : cette différence change le pilotage de l’achat
      et la fiabilité des ressources attendues. Il se combine avec les trois parcours ; les opérations accepter, refuser et
      reconfirmer ne sont pas des comportements séparés.'
    examples:
    - title: 'Réception partielle : rendre visible le reliquat'
      situation: 100 pièces sont attendues ; 60 sont réellement reçues.
      outcome: Le rapprochement explique les 40 restantes. Le fait de réception est associé à un document identifié, qui peut
        être structuré sans PDF.
      lesson: Une confirmation fournisseur ne prouve pas la réalisation.
      source_refs:
      - U391
      - U461
      - U462
    - title: Le fournisseur propose un autre échéancier
      situation: 100 pièces sont demandées vendredi ; le fournisseur propose 60 vendredi et 40 mardi.
      outcome: Sa réponse doit être distinguée de la demande et des conditions acceptées.
      lesson: Accepter sa réponse ne modifie pas automatiquement notre promesse client ; refuser son report ne restaure pas
        sa capacité.
      source_refs:
      - U403
      - U443
      - U462
    market_inspiration:
      choice: Savoir ce qu’un fournisseur doit encore apporter, en biens ou en prestations. Purchase Order couvre la commande
        d’achat et ses changements, avec un résultat attendu explicite.
      flow_scope: Attentes fournisseur, conditions applicables, réponses et reste à recevoir.
      flow_approach: Rapprocher la commande, les réponses acceptées et les réalisations ; garder l’accord de référence distinct.
      synthesis:
      - Microsoft explique comment exprimer l’achat et recueillir la réponse du fournisseur ; Oracle sépare la commande détaillée
        des accords qui encadrent des achats futurs.
      - FLOW reprend cette séparation pour conserver un attendu lisible. Le choix d’acheter, la négociation de l’accord et
        la réalisation physique ne se déduisent pas de la seule présence de la commande.
      examples:
      - title: Illustration FLOW — Une date fournisseur à examiner
        situation: Un achat attend 80 pièces vendredi ; le fournisseur propose lundi.
        outcome: La date proposée est visible avant son acceptation.
        lesson: Le besoin, la réponse et l’engagement retenu restent distinguables.
        source_title: Vendor collaboration with external vendors
