- id: D14.a
  revision: 4
  kind: capability
  fields:
    name: Service Catalog Ingestion
    definition: Recevoir l’offre des Backing Services, leurs niveaux de service configurés, conditions et accès, ainsi que
      leurs évolutions depuis les sources maîtresses externes.
    finality: Mettre à disposition une projection de référence exploitable par la qualification, la promesse et l’orchestration.
    nature: action
    scope: |-
      Recevoir les descriptions des [Backing Services](glossary:TER075) pour tenir leur offre de référence dans [Service Catalog](model:D14). Cette capacité concerne les prestations mobilisables par l’orchestration ; elle ne reçoit pas les demandes de travail de [Service Requests](model:D04).

      Ingestion du référentiel, dans la continuité du principe des projections Supply. Recevoir les évolutions des services et de leurs accès sans reprendre la maîtrise des données. Consultation et recherche restent en lecture seule pour les consommateurs.

      L’ingestion du catalogue ne reçoit pas à sa place le tracking des opérations et ne transforme pas une évolution du SLA en révision automatique des engagements déjà pris. Maîtres et contrats d’échange seront définis dans les règles de fonctionnement.

      Frontière : SLA, engagement individuel, estimation et résultat distincts ; pas de maître local.

      Exemple fictif : Recevoir service documentaire et accès sollicitation/feedback.
    market_comparisons:
    - vendor: TM Forum
      product: Service Catalog Management
      source_title: TMF633 Service Catalog API REST Specification R18.5.1
      source_url: https://www.tmforum.org/resources/specification/tmf633-service-catalog-api-rest-specification-r18-5-0/
      source_version: Archive R18.5.1 ; notice version 4.0.1, modifiée le 8 avril 2019
      source_locator: Description de la spécification
      consulted_on: '2026-09-19'
      evidence_limits: Notice primaire indexée consultée ; corps de spécification non consulté. Archive historique, pas édition
        courante ni norme Supply.
      element_name: Service Catalog
      element_type: Concept documenté par la source primaire
      relationship: Recouvrement partiel
      similarities: Offres de service et leurs évolutions.
      differences: La conception et le retrait du maître catalogue restent externes à FLOW.
      flow_position: Recevoir les offres des Backing Services et leurs conditions à jour. Service Catalog Ingestion conserve
        la référence de l’exécutant sans transformer une évolution de l’offre en révision automatique des engagements en cours.
      status: proposed
      source_refs:
      - U477
      - ELM482
      - CMP193
      concept_name: Service Catalog
      scope_summary: Offres de service et leurs évolutions.
      approach_summary: Rendre leur description disponible à la commande.
