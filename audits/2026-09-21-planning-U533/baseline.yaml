      consulted_on: '2026-09-19'
      evidence_limits: Document primaire consulté ; rapprochement de concepts, sans preuve de réalisation Beaumanoir.
      element_name: Exception handling
      element_type: Concept documenté par la source primaire
      relationship: Recouvrement partiel
      similarities: Situations qui empêchent le déroulement prévu.
      differences: La plateforme mêle décision et coordination ; FLOW les distingue.
      flow_position: Choisir comment faire évoluer le plan quand l’exécution rencontre un aléa. Process Adaptation Decision
        détermine la variation à retenir et signale à la promesse Supply les effets qui la concernent.
      status: proposed
      source_refs:
      - U407
      - U408
      - U409
      - ELM244
      - CMP155
      - U477
      - ELM330
      - CMP193
      concept_name: Exception handling
      scope_summary: Situations qui empêchent le déroulement prévu.
      approach_summary: Prévoir une suite adaptée aux circonstances.
