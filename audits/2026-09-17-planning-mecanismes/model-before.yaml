- id: BHV010
  revision: 1
  kind: behavior
  layer: transactional
  fields:
    name: Scenario Impact Analysis
    definition: Quantifier et expliquer les effets attendus d’un scénario sur les indicateurs métier, par rapport à une situation
      de référence, pour un périmètre et un horizon donnés.
    scope: 'Exploiter les résultats de [Scenario Simulation](model:BHV006), qui peut déjà produire les indicateurs ; aucun
      recalcul indépendant imposé. Expliciter les écarts de service, de stock immobilisé, de risques ou de flux, selon les
      informations et hypothèses disponibles. Les indicateurs, unités, références, périmètres et horizons doivent permettre
      une lecture cohérente. Exemple fictif : service projeté de 94 % à 97 %, stock moyen supplémentaire de 120 k€ et transferts
      en hausse de 15 %. Examiner aussi les écarts par magasin ou période, car une amélioration globale peut masquer des dégradations
      locales. [Scenario Evaluation](model:BHV007) apprécie ensuite le compromis ; cette séparation de résultats n’impose
      ni workflow fixe ni logiciels séparés. Les règles précises d’indicateurs et d’explication restent à instruire, sans
      causalité inventée.'
  source_refs:
  - U270
  - U271
  - CMP091
