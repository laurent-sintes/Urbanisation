- id: BHV006
  revision: 1
  kind: behavior
  layer: transactional
  fields:
    name: Scenario Simulation
    definition: 'Une situation opérationnelle projetée : stocks, apports, transferts, demandes satisfaites ou restantes.'
    scope: 'Mobiliser les décisions pertinentes de cibles de couverture, allocations, réapprovisionnement et redistribution.
      Exemple fictif : établir les apports et transferts proposés et leurs conséquences pour chaque scénario. Les calculs
      restent dans les décisions spécialisées ; les résultats simulés ne sont pas des mouvements de stock réalisés. U271 distingue
      la situation opérationnelle projetée et son analyse en indicateurs par [Scenario Impact Analysis](model:BHV010). La
      simulation peut déjà produire ces indicateurs ; aucun calcul doublonné imposé.'
  source_refs:
