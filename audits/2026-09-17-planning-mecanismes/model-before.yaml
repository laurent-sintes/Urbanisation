- id: BHV008
  revision: 1
  kind: behavior
  layer: transactional
  fields:
    name: Scenario Validation
    definition: Retenir et autoriser un scénario, avec ses conditions et réserves.
    scope: 'Identifier le scénario autorisé pour application et les conditions de cet accord. Exemple fictif : retenir le
      scénario de couverture à 10 jours sur certains magasins, sous réserve des ressources admissibles. Une validation peut
      être automatique selon les règles ; elle ne prouve pas l’application effective et ne valide pas les définitions du modèle
      d’urbanisme.'
