    note: 'Description française et maille reprises de U278 ; nom anglais proposé sauf Allocation conservé U276. Périmètre,
      exemples et justification ajoutés proposés. U282 : découpage par opérations remis en question au profit des mécanismes
      métier de protection. Valeurs et accords historiques conservés pour traçabilité ; cible à refondre, pas à reprendre
      comme découpage recommandé.'
