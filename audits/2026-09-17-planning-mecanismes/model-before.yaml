- id: D05
  revision: 2
  kind: domain
  layer: transactional
  fields:
    name: Inventory Optimization
    definition: Optimiser le stock consiste à choisir un compromis entre disponibilité, immobilisation et risque, puis à décider
      des ajustements nécessaires.
    finality: Décider du stock souhaitable et des ajustements nécessaires.
    scope: |-
      Le domaine produit les paramètres et ajustements de stock à retenir selon le compromis entre disponibilité, immobilisation et risque. Quatre décisions spécialisées portent respectivement les cibles de couverture, les allocations aux groupes, les apports de réapprovisionnement et la redistribution du stock existant. [Inventory Planning](model:D05.f) les mobilise pour construire, simuler, évaluer et valider un scénario cohérent, puis en déclencher l’application via les capacités responsables ; cette mobilisation n’est pas une décomposition en sous-capacités.

      Les calculs font partie des décisions. [Replenishment Decision](model:D05.e) intègre notamment les besoins nets, les contraintes, les quantités et dates à retenir. La redistribution et le réapprovisionnement demeurent distincts et coordonnés : leurs effets sur les stocks et manques sont pris en compte sans doublon. Les horizons restent opérationnels ; les prévisions et coûts peuvent être des entrées sans ajouter la planification de saison.

      Exemple fictif : retenir une cible magasin de 100 pièces et un seuil de réassort de 60 ; allouer une quantité à un canal ; puis arbitrer entre apports et transfert depuis un site excédentaire. Une reconfiguration du service attendu peut conduire Inventory Planning à mobiliser de nouveau plusieurs décisions et comparer leurs effets ensemble.

      Stock Protection désigne la gouvernance/management discutée en U230/U231 ; la capacité courante reste [Supply Protection](model:D02.b), sans renommage implicite. Son application signifie mettre à jour transactionnellement les données correspondantes, à l’unité, par groupe ou en masse, par écrans, batch, flux ou streaming. Décider les paramètres ou valider un scénario ne réalise pas ces mises à jour à lui seul.

      La mise en action du réapprovisionnement engage les Orders ; [Order Management](model:D04) les gère, [Order Promising](model:D03) travaille leur satisfaction, les exécutants réalisent les prestations et [Inventory Management](model:D01) tient la connaissance des stocks et mouvements. Le comportement Scenario Application d’Inventory Planning déclenche les actions retenues et connaît leur prise en compte via ces capacités responsables ; aucune nouvelle capacité autonome de déclenchement n’est ajoutée dans D05. D03 cherche à satisfaire les Orders ; D05 cherche le stock souhaitable et ses ajustements. La distinction ne repose ni sur l’absence de commandes dans les entrées ni sur un partage global/individuel. La portée actuelle de Supply Assignment, incluant les besoins prévisionnels, est conservée.

      La mise en application peut être automatique selon les règles et autorités ; aucun contrôle humain systématique, séquencement fixe ou découpage logiciel imposé. Les notions transversales soutenant la définition des objets du modèle restent dans le glossaire de modélisation séparé.
