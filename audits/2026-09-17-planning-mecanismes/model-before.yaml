- id: BHV009
  revision: 1
  kind: behavior
  layer: transactional
  fields:
    name: Scenario Application
    definition: Déclencher les actions retenues et connaître leur prise en compte, via les capacités opérationnelles responsables.
    scope: 'Solliciter [Supply Protection](model:D02.b) pour les protections applicables, les capacités d’[Order Management](model:D04)
      pour les Orders concernés, puis [Execution Management](model:D06) pour les prestations. Ces capacités conservent leurs
      responsabilités transactionnelles et opérationnelles. Exemple fictif : demander l’application des seuils retenus et
      la création des Orders nécessaires, puis distinguer les actions prises en compte, refusées ou restant à traiter. Ne
      pas confondre scénario retenu, actions engagées et prestations physiquement réalisées. Le détail des dépendances, reprises
      et conditions de traitement partiel reste proposé ; aucun lot atomique ni séquence technique universelle imposé.'
  source_refs:
