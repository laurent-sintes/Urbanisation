- id: BHV005
  revision: 1
  kind: behavior
  layer: transactional
  fields:
    name: Scenario Construction
    definition: Définir périmètre, hypothèses, objectifs et contraintes.
    scope: 'Construire un premier scénario, le copier ou modifier ses hypothèses. Exemple fictif : préparer deux scénarios
      de couverture magasin à 10 et 15 jours pour une promotion, avec le même périmètre de comparaison. La construction explicite
      ce qui sera exploré ; elle ne change pas à elle seule les protections ou Orders opérationnels.'
