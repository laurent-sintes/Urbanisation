- id: D03.i
  revision: 1
  kind: capability
  layer: transactional
  fields:
    name: Available-to-Promise (ATP)
    definition: Établir les quantités et dates auxquelles une demande ou un ensemble de demandes peut être satisfait par les
      ressources présentes ou futures admissibles dans la situation de référence, et expliciter la couverture qui rend ces
      engagements possibles.
    finality: Établir une solution de promesse réalisable dans la situation de référence.
    nature: decision
    scope: 'ATP tient compte des engagements existants, des stocks admissibles dans tout espace de stockage, des délais réels
      de mobilisation et des ressources futures. Ces prises en compte sont décrites par les quatre comportements rattachés.
      Exemple : un arrivage attendu dans 7 jours peut soutenir une promesse dans 60 jours si les autres consommations et contraintes
      le permettent. Pour plusieurs promesses, une même quantité ne peut soutenir des engagements incompatibles. Le calcul
      respecte les protections et règles existantes ; il ne modifie pas les politiques, ne réserve ni n’affecte par lui-même
      et ne confirme pas la promesse. Il mobilise la connaissance du stock et les informations opérationnelles des exécutants
      ; il ne pilote pas le rangement ou le prélèvement. Les adaptations de ressources ou d’engagements relèvent de CTP et
      des décisions spécialisées.'
    decomposition_rationale: 'Complexité : distinguer les engagements concurrents, les lieux admissibles, le délai réel de
      mobilisation et les apports futurs, qui peuvent se combiner. Bénéfice ciblé : expliquer pourquoi un stock enregistré
      ne garantit pas une promesse immédiate et pourquoi un arrivage à J+7 peut couvrir une échéance à J+60, sans créer quatre
      capacités ni un niveau marketing.'
  source_refs:
