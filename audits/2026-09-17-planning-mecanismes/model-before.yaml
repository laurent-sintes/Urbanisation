- id: BHV007
  revision: 1
  kind: behavior
  layer: transactional
  fields:
    name: Scenario Evaluation
    definition: Une appréciation du compromis selon les objectifs et contraintes.
    scope: 'Apprécier disponibilité, immobilisation et risque selon des critères explicites ; comparer si utile à une référence
      ou à plusieurs scénarios. Exemple fictif : examiner si le service attendu justifie davantage de stock et signaler les
      contraintes non satisfaites. Les critères détaillés, pondérations et règles d’arbitrage restent à préciser. U271 précise
      le résultat : apprécier le compromis en exploitant notamment [Scenario Impact Analysis](model:BHV010). Quantifier et
      expliquer les impacts fournit les éléments d’appréciation ; comparer plusieurs options reste possible, sans conditionner
      toute évaluation à plusieurs scénarios.'
  source_refs:
