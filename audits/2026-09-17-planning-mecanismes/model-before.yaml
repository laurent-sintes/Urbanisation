- id: BHV012
  revision: 1
  kind: behavior
  layer: transactional
  fields:
    name: Reallocation
    definition: réallocation entre groupes
    scope: |-
      Transférer des droits disponibles d’un groupe vers un autre. Exemple fictif : transférer 50 pièces du solde web vers les magasins ; le solde web baisse de 50 et celui des magasins augmente de 50. Le total des droits transférés est conservé dans ce cas simple. Cette opération ne déplace pas physiquement le stock et ne choisit pas à elle seule la répartition optimale.

      Comportement terminal directement sous [Supply Protection](model:D02.b), combinable avec ses pairs sans séquence universelle. [Stock Allocation Decision](model:D05.d) reste la décision spécialisée des valeurs ; [Supply Assignment](model:D02.e) affecte les ressources aux besoins et [Reservation](model:D02.c) porte l’engagement de quantité. Écran, batch, flux et streaming restent des modalités, avec traitements unitaires, collectifs ou en masse selon le besoin.
