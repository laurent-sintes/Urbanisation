- id: D05.f
  revision: 1
  kind: capability
  layer: transactional
  fields:
    name: Inventory Planning
    definition: Construire, simuler, analyser les impacts, évaluer et valider des scénarios de stock en mobilisant les décisions
      spécialisées, puis déclencher les actions retenues et connaître leur prise en compte via les capacités opérationnelles
      responsables.
    finality: Retenir un scénario de stock cohérent et explicite, puis relier ce choix à sa mise en action.
    nature: planning
    scope: |-
      Les six comportements rattachés décrivent la construction, la simulation, l’analyse d’impact, l’évaluation, la validation et l’application du scénario. Inventory Planning mobilise les quatre décisions d’Inventory Optimization ; elles conservent leurs responsabilités et ne sont pas ses comportements enfants.

      Exemple fictif : construire deux scénarios de couverture magasin à 10 et 15 jours avant une promotion, simuler leurs apports et transferts, comparer disponibilité, immobilisation et risque, retenir un scénario puis solliciter les capacités responsables pour sa mise en action.

      L’application déclenche les actions retenues et connaît leur prise en compte ; elle sollicite Supply Protection, les gestions d’Orders D04 et D06 pour les prestations. La validation du scénario ne prouve pas que ses actions sont appliquées. Les opérations peuvent être automatiques selon les règles ; aucun contrôle humain systématique ni enchaînement technique imposé. Les exécutants conservent la réalisation physique.

      Les horizons restent opérationnels ; les prévisions, coûts et contraintes peuvent être des entrées sans ajout de planification de saison. Les détails d’application partielle, de refus et de reprise sont à instruire.

      U271 distingue situation opérationnelle projetée, conséquences exprimées en indicateurs et appréciation du compromis. Le bénéfice est de rendre explicites les conséquences métier avant appréciation, y compris les écarts locaux masqués par les résultats globaux. Cette clarification justifie le sixième comportement, au même niveau terminal que les cinq autres.
    decomposition_rationale: Distinguer ce qu’on envisage, ses conséquences, son intérêt, ce qu’on retient et ce qu’on met
      effectivement en action.
