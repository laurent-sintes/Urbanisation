- id: D02.b
  revision: 1
  kind: capability
  layer: transactional
  fields:
    name: Supply Protection
    definition: Configurer et maintenir dans le temps les règles, seuils et quantités qui encadrent l’utilisation et le renouvellement
      des ressources, afin de maîtriser les risques de pénurie, de surstock et de déséquilibre.
    finality: Préserver les possibilités d’approvisionnement des usages retenus.
    decomposition_rationale: 'Distinguer cinq résultats : créer des droits, changer leur bénéficiaire, les restituer, enregistrer
      leur usage et connaître leur état. Cette séparation rend explicites les effets différents sur les enveloppes et leurs
      soldes, aide à éviter les doubles déductions et différencie une libération d’une réallocation. Elle permet de discuter
      et vérifier chaque résultat indépendamment sans créer de sous-comportements ; elle ne découle pas du seul nombre d’API
      Microsoft.'
    scope: |-
      U274 élargit explicitement la protection à la pénurie et au surstock, avec configuration des règles et quantités dans le temps. [Allocation](model:BHV011), [Reallocation](model:BHV012), [Allocation Release](model:BHV013), [Allocation Consumption](model:BHV014) et [Allocation Visibility](model:BHV015) décrivent cinq résultats distincts pour la gestion des enveloppes, directement sous cette capacité (U278) ; le catalogue des autres comportements reste à instruire, notamment les seuils de couverture et la validité des règles. La documentation Microsoft utilisée ne couvre pas à elle seule toute cette intention.

      Les décisions spécialisées D05 restent distinctes. Programmer une validité dans le temps ne duplique pas la construction, simulation, analyse d’impact, évaluation, validation et application de scénarios d’[Inventory Planning](model:D05.f). Le partage exact de la planification reste à examiner avec Laurent. L’application transactionnelle peut être unitaire, collective ou en masse, via écran, batch, flux ou streaming ; la réalisation physique et l’affectation aux commandes gardent leurs capacités responsables.
