  - S15
  question: Quels états, unités, horizons et dates d’effet rendent une ressource réellement engageable ?
  recommendation: Contractualiser donné physique, indisponible, réservé, attendu et capacité engagée avec leurs producteurs.
  limit: Ni SLA global = capacité contextuelle, ni nominal moins charge = disponible sans règle établie. Aucun maître externe
    précis inventé.
  status: open
scenarios:
- id: C01
  title: Pénurie entre deux commandes
  given: 100 disponibles, demande A=80 et B=60 ; B plus prioritaire mais A possède une confirmation protégée.
  expected: Le classement ne suffit pas à retirer A. Produire options et valeur, vérifier révisabilité et cohérence des engagements.
  tests:
  - A01
  - A02
  - P16
- id: C02
  title: Réassort sans nouvelle commande client
  given: Position 45, seuil 50, cible 120 ; apports attendus déjà inclus dans la position.
  expected: Proposition brute 75 ; ne pas compter deux fois les attendus ni assimiler ce besoin au reliquat d’une commande
    précise.
  tests:
  - P02
- id: C03
  title: Protection contre le surstock
  given: Besoin baissé, achat ferme de 500 pour besoin restant 300 ; fournisseur autorise report mais pas réduction.
  expected: D05.e étudie le report ; D04 applique seulement le changement admissible, sans effacer l’engagement.
  tests:
  - P03
  - A06
- id: C04
  title: Excédent sans magasin en rupture
  given: Reliquats dispersés, destination centrale sans besoin de vente immédiat.
  expected: Évaluer intérêt/coût du regroupement, sans imposer un faux manque au lieu receveur.
  tests:
  - P07
- id: C05
  title: Commande partiellement préparée
  given: Changement de service alors que la préparation est achevée et que le transport précédent est sollicité.
  expected: D06.f décide, D06.d coordonne les compensations réalisables ; ne pas annuler fictivement le fait physique.
  tests:
  - P04
  - P05
- id: C06
  title: Silence opérationnel
  given: Feedback attendu à 13 h, absent à 14 h ; état physique inconnu.
  expected: Signaler un retour manquant, chercher une preuve ; distinguer estimation de retard et retard confirmé.
  tests:
  - P10
  - A07
- id: C07
  title: Stock théorique non utilisable
  given: 100 présents dont 20 bloqués, 30 réservés ; recouvrement éventuel des deux populations non établi.
  expected: Ne pas conclure mécaniquement 50 libres sans règles de dimensions et de non-double-décompte.
  tests:
  - A01
  - A05
  - A07
- id: C08
  title: Lancement cohérent
  given: Un ensemble de lignes a un engagement de livraison commune, mais une ligne est indisponible.
  expected: Vérifier le groupe avant lancement ; fractionner nécessite une décision autorisée, pas seulement un clic Split.
  tests:
  - P11
- id: C09
  title: Retour remis en vente
  given: Un retour est reçu mais son état et son admissibilité à la revente ne sont pas encore établis.
  expected: La réception ne décide ni la remise en disponible ni le remboursement ; localiser le propriétaire de la disposition.
  tests:
  - A04
- id: C10
  title: Produit alternatif
  given: Produit demandé indisponible ; autre produit techniquement proche en stock.
  expected: Équivalence autorisée et acceptation utiles avant la proposition ; aucune substitution automatique taille/couleur.
  tests:
  - P15
  - A05
deliberate_non_additions:
- 'Allocation / désallocation / libération / consultation : opérations des mécanismes de protection ou d’affectation.'
- 'Batch, streaming, API, écran, masse : modes de réalisation ; besoin de cohérence conservé dans le contrat.'
- 'Un comportement par entrepôt, magasin, statut ou horizon : paramètres et variantes de référence.'
- 'AI Optimization / Advanced ATP : technologie ou qualification promotionnelle ; pas résultat métier différenciant.'
- 'Une formule de stock de sécurité, un indicateur économique ou un poids de priorité : règle dans une décision.'
- 'Validation, comparaison et application comme nouveaux comportements Planning : maintien du regroupement adopté.'
- 'Win/Gain/Redistribute comme sous-comportements de Promise Revision : politiques dans sa description terminale.'
- 'Soft / Hard Reservation recopiés tels quels : vocabulaire produit ambigu sans contrat FLOW.'
- 'Création, confirmation et annulation recopiées sous chaque type d’Order : duplication des responsabilités transverses.'
