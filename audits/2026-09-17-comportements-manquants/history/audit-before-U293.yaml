arbitrations:
- id: A01
  title: Reservation / Supply Assignment
  capabilities:
  - D02.c
  - D02.e
  market_sources:
  - S02
  - S03
  - S04
  question: Quel effet un lien d’affectation produit-il sur les usages concurrents, et à quel moment existe un engagement
    opposable ?
  recommendation: Conserver les deux capacités. Décrire affectation ressource-demande, réservation opposable et granularité
    physique/logique. Ne pas déduire temporaire de soft.
  limit: P16 et toute décomposition Reservation restent conditionnels ; aucun déplacement de responsabilité appliqué.
  status: open
- id: A02
  title: Cohérence de la décision collective
  capabilities:
  - D02.e
  - D03.j
  - D03.k
  - D03.m
  - D03.l
  market_sources:
  - S04
  - S06
  - S15
  - S16
  question: Qui garantit qu’un ensemble de choix locaux forme un plan réalisable maximisant la valeur multidimensionnelle
    ?
  recommendation: Éprouver la composition CTP/priorités/PTP/échéancier avant de créer une décision globale. Ne pas faire de
    Supply Assignment management un optimiseur implicite.
  limit: Gap de contrat de décision ; le marché montre des produits intégrés, pas une réponse normative à notre découpage.
  status: open
- id: A03
  title: Application d’un plan aux Orders
  capabilities:
  - D04.o
  - D04.n
  - D02.e
  - D05.f
  market_sources:
  - S09
  - S17
  question: Le plan change-t-il les liens d’affectation, le contenu/structure des Orders, leur état, ou plusieurs de ces objets
    ?
  recommendation: Conserver le principe U287, mais arbitrer le porteur exact. Lifecycle seul est trop étroit pour tous les
    effets ; ne pas dupliquer sous les cinq types.
  limit: Un comportement a un seul parent ; aucune création sous un domaine ni nouvelle capacité transverse décidée dans cet
    audit.
  status: open
- id: A04
  title: Devenir des retours
  capabilities:
  - D04.l
  - D04.m
  - D05.c
  - D06.f
  market_sources:
  - S23
  - S27
  question: Qui décide remise en vente, remplacement, retour fournisseur ou sortie définitive, et sur quelle preuve ?
  recommendation: Séparer enregistrement du retour, décision de disposition et exécution ; attribuer Supply/Business Services/exécutant
    sur un cas.
  limit: Les aspects remboursement/comptabilité ne deviennent pas des domaines FLOW. Un manque de responsabilité n’est pas
    automatiquement un comportement de Return Management.
  status: open
- id: A05
  title: Alternatives et admissibilité
  capabilities:
  - D03.i
  - D03.j
  - D08.d
  - D06.e
  market_sources:
