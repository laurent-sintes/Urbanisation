  differentiating_criterion: mécanisme
  decomposition_rationale: Distinguer une couverture des besoins identifiés d’une remontée systématique à un niveau cible.
  example: À J+7, 120 unités sont nécessaires ; 70 utilisables et 20 attendues laissent un besoin net de 30, sous contraintes
    de lot.
  boundary: Requirement et regroupement par fenêtre sont des variantes internes ; aucune création d’Order par la décision.
  market_sources:
  - S08
  needs:
  - D01.c
  - D02.c
  - D02.e
  validation_question: Les besoins identifiés et leur agrégation suffisent-ils comme premier mécanisme, sans comportement
    séparé par cadence ?
  source_refs:
  - U292
  - CMP098
- id: P02
  parent_id: D05.e
  name: Target-restoring Replenishment
  status: proposed
  priority: P1
  definition: Déterminer les apports qui ramènent une position de stock vers la cible selon une règle de déclenchement.
  differentiating_criterion: politique
  decomposition_rationale: Le motif est le rétablissement d’un niveau voulu ; le besoin n’est pas nécessairement relié à une
    commande individuelle.
  example: 'Position projetée 45, seuil 50, cible 120 : proposer 75 avant contraintes ; ne pas ignorer les apports déjà confirmés.'
  boundary: D05.a détermine les cibles ; D02.b applique leur configuration. Min/max ne signifie pas immobiliser physiquement
    la différence.
  market_sources:
  - S08
  - S11
  needs:
  - D05.a
  - D02.b
  - D01.c
  validation_question: Valider la restauration de cible comme mécanisme distinct, en conservant les formules et paramètres
    dans la description ?
  source_refs:
  - U292
  - CMP098
- id: P03
  parent_id: D05.e
  name: Committed Supply Adjustment
  status: proposed
  priority: P1
  definition: Décider des ajustements d’apports déjà prévus lorsque les besoins ou cibles changent, en respectant les engagements
    et contraintes de modification.
  differentiating_criterion: mécanisme
  decomposition_rationale: Éviter de traiter toute optimisation par une commande supplémentaire ; protéger aussi du surstock
    et des arrivages mal datés.
  example: 'Un arrivage de 500 est prévu, mais le besoin tombe à 300 : proposer une réduction de 200 ou un report, selon ce
    que le fournisseur accepte.'
  boundary: Avancer, reporter, augmenter et réduire sont des opérations de ce mécanisme. D04 applique les changements autorisés
    ; un accord ferme ne disparaît pas par recalcul.
  market_sources:
  - S09
  - S26
  needs:
  - D04.j
  - D04.k
  - D04.o
  - D05.a
  validation_question: Le mot Committed doit-il couvrir tout apport planifié avec des degrés de fermeté explicites ? Le périmètre
    proposé inclut ces degrés.
  source_refs:
  - U292
  - CMP098
- id: P04
  parent_id: D06.d
  name: Dependency-driven Execution
  status: proposed
  priority: P1
  definition: Coordonner les prestations selon leurs prérequis et conditions de progression, à partir de résultats et engagements
    connus.
  differentiating_criterion: mécanisme
  decomposition_rationale: Faire apparaître les dépendances métier au-delà d’une simple émission de Service Orders.
  example: La remise au transport dépend de la préparation et des documents requis ; un retour documentaire reçu ne vaut pas
    préparation physique achevée.
  boundary: Les tâches internes de l’entrepôt restent chez l’exécutant. Conditions de synchronisation proposées par FLOW,
    pas norme Oracle recopiée.
  market_sources:
  - S17
  - S25
  needs:
  - D07.a
  - D07.b
  - D07.d
  validation_question: Valider la coordination des prérequis de prestations comme comportement d’orchestration ?
  source_refs:
  - U292
  - CMP098
- id: P05
  parent_id: D06.d
  name: Execution Compensation
  status: proposed
  priority: P1
  definition: Coordonner les effets correctifs rendus nécessaires par un plan d’exécution modifié, en tenant compte des prestations
    déjà demandées ou réalisées.
  differentiating_criterion: mécanisme
  decomposition_rationale: Une adaptation en cours d’exécution doit traiter les effets du plan précédent, pas seulement émettre
    un nouveau plan.
  example: Après changement de transporteur, retirer la sollicitation précédente et obtenir un nouveau document ; si le colis
    est déjà parti, traiter cette réalité au lieu de rejouer une annulation.
  boundary: D06.f choisit la variation ; D06.d la coordonne ; D07.b porte les demandes. Aucun rollback physique ni transaction
    atomique globale promis.
  market_sources:
  - S17
  needs:
  - D06.f
  - D07.b
  - D07.c
  - D07.d
  validation_question: Valider le mécanisme, puis définir les irréversibilités et effets compensables service par service
    ?
  source_refs:
  - U292
  - CMP098
- id: P06
  parent_id: D05.c
  name: Shortage-driven Rebalancing
  status: proposed
  priority: P1
  definition: Décider des transferts de ressources existantes qui couvrent des manques en préservant la situation des lieux
    donneurs.
  differentiating_criterion: mécanisme
  decomposition_rationale: Rendre explicite l’arbitrage donneur-receveur, distinct d’un réapprovisionnement externe.
  example: A dispose de 100 mais doit en garder 70 ; B manque de 40. Un transfert de 30 laisse un manque de 10 à traiter autrement.
  boundary: Le déplacement commun ne fusionne pas les finalités D03 et D05 ; D04.k puis D06 portent la mise en action.
  market_sources:
  - S12
  needs:
  - D05.a
  - D01.c
  - D02.b
  - D06.b
  validation_question: Le respect du stock utile au donneur est-il le bon invariant à rendre visible ?
  source_refs:
  - U292
  - CMP098
- id: P07
  parent_id: D05.c
  name: Excess Consolidation
  status: proposed
  priority: P1
  definition: Décider du regroupement de stocks excédentaires dans des lieux adaptés, même sans manque immédiat dans le lieu
    de destination.
  differentiating_criterion: bénéfice ciblé
  decomposition_rationale: Adresser le surstock dispersé et les possibilités futures de réutilisation, au-delà de la réponse
    à une pénurie présente.
  example: Des magasins détiennent des reliquats dispersés ; les regrouper dans un lieu de redistribution permet de libérer
    de la place et de préparer un futur usage.
  boundary: Ni liquidation commerciale, ni destruction, ni remise de prix introduites. Le coût et la valeur du regroupement
    doivent être éprouvés.
  market_sources:
  - S12
  needs:
  - D05.a
  - D01.c
  - D13.a
  - D06.b
  validation_question: Cette collecte d’excédents est-elle un mécanisme utile au périmètre FLOW, distinct d’un transfert pour
    manque ?
  source_refs:
  - U292
  - CMP098
- id: P08
  parent_id: D01.d
  name: Recurring Stock Verification
  status: proposed
  priority: P2
  definition: Fiabiliser le stock par une vérification organisée et récurrente des quantités sur un périmètre défini.
  differentiating_criterion: politique
  decomposition_rationale: La récurrence assure une couverture de contrôle indépendamment des incidents visibles.
  example: Vérifier régulièrement les articles à enjeu, rapprocher les quantités constatées et instruire les écarts.
  boundary: Programme et mandat à préciser ; FLOW ne récupère pas automatiquement le comptage physique du WMS.
  market_sources:
  - S01
  needs:
  - D01.c
  - D01.f
  - D01.g
  validation_question: FLOW porte-t-il la politique de fiabilisation ou seulement le traitement des constats fournis par l’exécutant
    ?
  source_refs:
  - U292
  - CMP098
- id: P09
  parent_id: D01.d
  name: Triggered Stock Verification
  status: proposed
  priority: P2
  definition: Fiabiliser une quantité lorsque des signaux rendent sa crédibilité insuffisante pour les usages métier.
  differentiating_criterion: mécanisme
  decomposition_rationale: Concentrer un contrôle sur une situation à risque et non seulement sur un calendrier.
  example: 'Un picking échoue alors que le stock est annoncé disponible : solliciter un constat, puis traiter l’écart établi.'
  boundary: Microsoft documente le seuil ; l’échec de picking est notre cas proposé. Détecter le signal ne donne pas autorité
    de correction automatique.
  market_sources:
  - S01
  - S21
  needs:
  - D07.d
  - D01.c
  - D01.g
  validation_question: Quels signaux autorisent une demande de vérification et qui peut faire corriger la quantité ?
  source_refs:
  - U292
  - CMP098
- id: P10
  parent_id: D07.d
  name: Execution Exception Detection
  status: proposed
  priority: P2
  definition: Identifier les écarts de progression et l’absence de retours attendus afin d’alimenter la réaction opérationnelle.
  differentiating_criterion: bénéfice ciblé
  decomposition_rationale: Un tracking qui enregistre uniquement les événements reçus ne révèle pas les silences qui mettent
    le plan en risque.
  example: 'À 14 h, aucun retour de préparation attendu à 13 h : signaler un manque d’information ; confirmer le retard physique
    séparément.'
  boundary: Pas de nouvelle promesse ni de décision d’adaptation. Le catalogue de services doit préciser retours attendus
    et tolérances.
  market_sources:
  - S19
  - S20
  needs:
  - D07.b
  - D14.a
  - D06.b
  validation_question: Valider la détection ; préciser ensuite les signaux probants, estimés et absents ? Source SAP historique,
    validation métier particulièrement importante.
  source_refs:
  - U292
  - CMP098
- id: P11
  parent_id: D04.o
  name: Coordinated Order Release
  status: proposed
  priority: P2
  definition: Autoriser la progression d’Orders ou de lignes liés en respectant une condition de cohérence commune.
  differentiating_criterion: politique
  decomposition_rationale: Des lignes correctement affectées une à une peuvent rester collectivement impropres à être lancées.
  example: Un lot destiné à une ouverture magasin doit atteindre la complétude convenue avant lancement, malgré la disponibilité
    de certaines lignes.
  boundary: La condition de groupe est le mécanisme ; Hold/Release restent des opérations. D03.l décide l’échéancier, D04.n
    porte la structure, D06 orchestre après lancement.
  market_sources:
  - S04
  - S18
  needs:
  - D02.e
  - D03.l
  - D04.n
  validation_question: Le lancement coordonné de groupes existe-t-il dans le périmètre FLOW et avec quelle règle métier de
    complétude ?
  source_refs:
  - U292
  - CMP098
- id: P12
  parent_id: D05.a
  name: Service-risk Coverage Targeting
  status: proposed
  priority: conditionnel
  definition: Déterminer des cibles de couverture différenciées selon l’incertitude et le niveau de service attendu.
  differentiating_criterion: politique
  decomposition_rationale: Utile si les décisions de cible doivent expliciter un arbitrage de risque distinct d’une simple
    norme de couverture.
  example: Deux articles à même demande moyenne reçoivent des cibles différentes parce que leurs délais et aléas diffèrent.
  boundary: 'Déjà proche du mandat de D05.a : enrichir d’abord la définition ; ne créer le comportement que si la distinction
    apporte un usage concret.'
  market_sources:
  - S10
  - S13
  - S14
  needs:
  - D01.c
  - D08.d
  - D13.a
  validation_question: Ce mécanisme apporte-t-il assez par rapport à la définition actuelle pour justifier un nœud ?
  source_refs:
  - U292
  - CMP098
- id: P13
  parent_id: D05.a
  name: Network-coordinated Coverage Targeting
  status: proposed
  priority: conditionnel
  definition: Déterminer conjointement les cibles de plusieurs lieux ou échelons en tenant compte de leurs dépendances.
  differentiating_criterion: mécanisme
  decomposition_rationale: Éviter de cumuler partout des buffers optimisés indépendamment et de surprotéger le réseau.
  example: Comparer un buffer central et des buffers magasins en tenant compte des délais de transfert et du service réellement
    attendu.
  boundary: Décider des cibles n’est pas exécuter des transferts ; le marché consulté apporte un principe produit, pas un
    algorithme vérifié.
  market_sources:
  - S13
  needs:
  - D13.a
  - D01.c
  - D06.b
  validation_question: Le couplage des cibles réseau est-il une ambition FLOW suffisamment explicite ?
  source_refs:
  - U292
  - CMP098
- id: P14
  parent_id: D03.j
  name: Additional Supply Feasibility
  status: proposed
  priority: conditionnel
  definition: Établir si des ressources supplémentaires peuvent rendre une demande satisfaisable dans les contraintes retenues.
  differentiating_criterion: mécanisme
  decomposition_rationale: Faire apparaître l’origine de la faisabilité sous adaptation, sans faire de CTP une seconde optimisation
    du stock.
  example: Une commande ne peut être couverte par les ressources admissibles ; une fourniture additionnelle pourrait la rendre
    réalisable à J+10.
  boundary: D05.e intervient pour l’objectif de stock, pas obligatoirement pour tout achat à la demande. La capacité qui fournit
    l’option achat ponctuel reste à contractualiser.
  market_sources:
  - S07
  needs:
  - D14.a
  - D06.b
  - D06.e
  validation_question: Quelles adaptations de ressources sont effectivement dans CTP FLOW et qui sait en établir la faisabilité
    ?
  source_refs:
  - U292
  - CMP098
- id: P15
  parent_id: D03.j
  name: Fulfillment Alternative Feasibility
  status: proposed
  priority: conditionnel
  definition: Établir la faisabilité d’une satisfaction qui nécessite de modifier les modalités admissibles de fulfillment.
  differentiating_criterion: variante
  decomposition_rationale: Distinguer une adaptation autorisée de la simple lecture des alternatives déjà admissibles par
    ATP.
  example: Une autre prestation rend la date possible ; elle doit être autorisée et réalisable avant d’être proposée.
  boundary: Tous les lieux déjà admissibles restent dans ATP. Une substitution de produit nécessite un contrat d’équivalence
    ; D06.e garde la décision de service.
  market_sources:
  - S05
  - S15
  needs:
  - D03.i
  - D06.e
  - D06.b
  - D08.d
  validation_question: Quelle modification marque le passage de la référence ATP à une adaptation CTP ?
  source_refs:
  - U292
  - CMP098
- id: P16
  parent_id: D03.j
  name: Commitment Rebalancing Feasibility
  status: proposed
  priority: conditionnel
  definition: Établir les possibilités de satisfaction obtenues par une redistribution autorisée d’engagements existants.
  differentiating_criterion: mécanisme
  decomposition_rationale: Rendre visibles les gagnants, perdants et engagements protégés avant une révision de promesse.
  example: Étudier si une demande prioritaire peut être satisfaite en décalant une demande révisable, sans toucher une confirmation
    protégée.
  boundary: BOP est un appui partiel. D03.m fixe les priorités, D03.n révise les promesses et D02.e applique les affectations
    ; un scénario candidat ne les modifie pas.
  market_sources:
  - S06
  - S04
  needs:
  - D03.m
  - D03.k
  - D03.n
  - D02.c
  - D02.e
  validation_question: CTP doit-il établir cette faisabilité collective, et avec quel contrat pour les effets croisés ?
  source_refs:
  - U292
  - CMP098
