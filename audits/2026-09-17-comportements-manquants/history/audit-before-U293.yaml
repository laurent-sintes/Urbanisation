  question: Quelles options sont dans la référence ATP, lesquelles nécessitent une adaptation autorisée, et qui fournit les
    équivalences ?
  recommendation: Fixer une situation de référence puis décrire la variation. Distinguer stock présent et autorisé, produit
    équivalent et produit ressemblant.
  limit: Substitution de taille/couleur jamais supposée acceptable ; le Product Reference ne gouverne pas automatiquement
    les équivalences.
