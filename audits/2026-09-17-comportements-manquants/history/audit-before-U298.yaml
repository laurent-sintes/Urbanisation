deliberate_non_additions:
- 'Allocation / désallocation / libération / consultation : opérations des mécanismes de protection ou d’affectation.'
- 'Batch, streaming, API, écran, masse : modes de réalisation ; besoin de cohérence conservé dans le contrat.'
- 'Un comportement par entrepôt, magasin, statut ou horizon : paramètres et variantes de référence.'
- 'AI Optimization / Advanced ATP : technologie ou qualification promotionnelle ; pas résultat métier différenciant.'
- 'Une formule de stock de sécurité, un indicateur économique ou un poids de priorité : règle dans une décision.'
- 'Validation, comparaison et application comme nouveaux comportements Planning : maintien du regroupement adopté.'
- 'Win/Gain/Redistribute comme sous-comportements de Promise Revision : politiques dans sa description terminale.'
- 'Soft / Hard Reservation recopiés tels quels : vocabulaire produit ambigu sans contrat FLOW.'
- 'Création, confirmation et annulation recopiées sous chaque type d’Order : duplication des responsabilités transverses.'
