scenarios:
- id: C01
  title: Pénurie entre deux commandes
  given: 100 disponibles, demande A=80 et B=60 ; B plus prioritaire mais A possède une confirmation protégée.
  expected: Le classement ne suffit pas à retirer A. Produire options et valeur, vérifier révisabilité et cohérence des engagements.
  tests:
  - A01
  - A02
  - P16
- id: C02
  title: Réassort sans nouvelle commande client
  given: Position 45, seuil 50, cible 120 ; apports attendus déjà inclus dans la position.
  expected: Proposition brute 75 ; ne pas compter deux fois les attendus ni assimiler ce besoin au reliquat d’une commande
    précise.
  tests:
  - P02
- id: C03
  title: Traitement d’un excédent
  given: Besoin baissé, achat ferme de 500 pour besoin restant 300 ; fournisseur autorise report mais pas réduction.
  expected: D05.e étudie le report ; D04 applique seulement le changement admissible, sans effacer l’engagement.
  tests:
  - P03
  - A06
- id: C04
  title: Excédent sans magasin en rupture
  given: Reliquats dispersés, destination centrale sans besoin de vente immédiat.
  expected: Évaluer intérêt/coût du regroupement, sans imposer un faux manque au lieu receveur.
  tests:
  - P07
- id: C05
