  name: Demand-linked Replenishment
  status: proposed
  priority: P1
  definition: Déterminer les apports nécessaires pour couvrir des besoins datés nets des ressources déjà utilisables.
  differentiating_criterion: mécanisme
  decomposition_rationale: Distinguer une couverture des besoins identifiés d’une remontée systématique à un niveau cible.
  example: À J+7, 120 unités sont nécessaires ; 70 utilisables et 20 attendues laissent un besoin net de 30, sous contraintes
    de lot.
  boundary: Requirement et regroupement par fenêtre sont des variantes internes ; aucune création d’Order par la décision.
  market_sources:
