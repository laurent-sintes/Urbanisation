as_of: '2026-09-17'
purpose: Analyse comparative des comportements manquants après refonte U290.
status: proposed
author: Codex
source_refs:
- U292
- ELM191
- CMP098
- U293
- CMP099
- U294
- CMP100
- U295
- CMP101
- U296
- CMP102
- U297
decision_boundary: Étude autorisée ; aucun nouveau comportement, nom ou rattachement adopté. Catalogue actif et publications
  inchangés. U297 adopte le nom Logistics Visibility dans la portée de feedback_U297 ; autres propositions et rattachements
  non adoptés.
baseline:
  path: modeles/backlog/model.yaml
  sha256: 8b2e59f7d0786d0b0ae3faa09dd04438a9f287cab07b8ec78cff07fad7c9867c
  nodes: 71
  capabilities: 39
  behaviors: 14
  relations: 216
  scope: Backlog refondu U290 ; pas la release Atlas. Six projections de référentiels incluses. Business Services non décomposé
    exclu de toute conclusion de complétude.
methodology:
  comparison_unit: Mécanisme, politique, variante ou bénéfice ciblé ; pas opération, API, écran ou modalité technique.
  inference: Les faits éditeurs sont séparés de nos rattachements proposés. Les niveaux de leurs produits ne sont pas équivalents
    aux niveaux FLOW.
  evidence: Guides documentaires privilégiés ; pages commerciales utilisées comme indices de principe avec limites. Aucun
    score de couverture ou de déploiement.
  completeness: Revue des 39 capacités FLOW, échantillon documentaire ciblé de sept éditeurs. Pas inventaire exhaustif de
    toutes les versions ou fonctionnalités du marché. U293 ajoute Camunda comme appui de réalisation des processus, pas comme
    huitième catalogue Supply.
  scenarios: Cas fictifs d’épreuve du modèle ; aucune observation de GBM, Boardriders ou Sarenza. Sarenza reste non évalué.
findings:
- Capacité → Comportement suffit pour les mécanismes observés ; aucun cas étudié ne nécessite un troisième niveau descriptif.
- 35 capacités sans comportement ne signifient pas 35 lacunes ; décisions fines et projections simples peuvent rester sans
  décomposition.
- Cinq candidats conditionnels supplémentaires sur Coverage Target Decision et CTP ; pas d’inflation automatique.
- Sept arbitrages de responsabilité ou de contrat ne sont pas résolus par un nouveau comportement.
- Les 14 comportements existants restent pertinents au regard de cette passe ; enrichir leur contrat avant de les démultiplier.
- P05 retiré ; P11 à clarifier ; P10 conservé comme complément, Transit Visibility proposé séparément dans ce feedback. Neuf
  candidats ciblés initiaux restent proposés, cinq options conditionnelles ; Transit Visibility n’est pas encore ajouté comme
  fiche P ni comme BHV.
- 'U294 : Track and Trace remplace Transit Visibility dans la proposition courante ; pas de terme universel Global Track établi.
  Décomposition et rattachement non adoptés.'
- 'U297 : Logistics Visibility est le nom adopté pour le parcours physique U296 ; le niveau et le rattachement ne sont pas
  déduits de cette validation.'
