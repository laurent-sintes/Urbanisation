arbitration_id: A01
proposed_contract:
  assignment: Établir et maintenir les liens entre ressources Supply présentes ou futures et commandes identifiées, selon
    les décisions retenues.
  reservation: Établir et maintenir, pour un besoin identifié, un engagement de quantité dont les usages concurrents doivent
    tenir compte, sur un périmètre et une période définis.
  joint_effect: Une affectation opérationnelle peut établir en même temps une réservation. Distinguer les responsabilités
    ne prescrit pas deux étapes, écritures ou logiciels.
  granularity: Un engagement peut porter sur une quantité définie par produit et périmètre sans identifier les unités ou le
    lot à prélever ; préciser séparément la provenance affectée et l’effet sur les usages concurrents.
  counting: Une même quantité engagée pour le même besoin n’est pas déduite deux fois au titre de l’affectation et de la réservation.
    Maintenir la cohérence lors des réaffectations, libérations et réalisations.
  promise: Affecté, réservé, promis et réalisé restent distincts ; la protection contre un usage concurrent ne garantit pas
    à elle seule l’arrivée ou la livraison physique.
example: 'Illustration simplifiée : 100 unités admissibles ; 30 réservées pour une commande donnent 70 restant disponibles
  sur ce périmètre. Affecter ces mêmes 30 à un lot ne crée pas un second engagement de 30. Le stock physique reste 100 avant
  réalisation du mouvement.'
proposal_limit: Ne pas créer de comportements création/libération/modification. Les variantes de réservation sont à examiner
  après accord sur le contrat ; aucune partition soft/hard ou temporaire/définitif adoptée.
