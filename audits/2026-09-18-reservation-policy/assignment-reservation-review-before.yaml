promise_security_U340:
  status: proposed_interpretation
  user_principles:
    U339: Oui, transaction et lock c'est de la technique informatique au service du business. Réservation c'est du business
      de vente/supply
    U340: Réservation est une méthode pour garantir une promesse à un moment donné
  supersedes_interpretation: 'La lecture de U336 en termes de transaction longue ne définit pas la réservation métier : U339
    classe explicitement transaction et lock parmi les moyens informatiques. Ne pas introduire ces moyens comme comportements
    Supply ou termes métier.'
  proposed_definition: Sécuriser une promesse en préservant, au bénéfice du besoin concerné et selon les conditions convenues,
    la disponibilité des ressources nécessaires contre les usages concurrents incompatibles.
  boundary: La réservation sécurise la dimension ressource de la promesse ; elle ne garantit pas seule la préparation, le
    transport et la livraison. Elle peut commencer avant la confirmation définitive et se maintenir selon la politique retenue.
  timing_question_U338: Le jalon du parcours de vente, la durée de validité et les conditions de maintien ou de libération
    sont à définir par politique métier ; panier, paiement et commande ne sont pas synonymes.
  modeling_consequence: Conserver Reservation à sa maille actuelle pendant l’arbitrage. Le mot méthode désigne son rôle dans
    la sécurisation de la promesse, sans la transformer automatiquement en comportement de Promise Management. Aucun comportement
    par écran ni opération CRUD.
