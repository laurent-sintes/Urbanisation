long_transaction_U336:
  status: proposed
  user_observation: La notion de réservation est très liée à la notion de transaction longue.
  proposed_definition: Établir et maintenir un engagement de ressources au bénéfice d’un besoin identifié pendant le déroulement
    d’une opération métier, selon des conditions explicites de maintien, de consommation et de libération.
  purpose: Préserver l’engagement contre les usages concurrents pendant les attentes et étapes du processus.
  example: 'Exemple fictif : réserver deux articles pendant le contrôle d’un paiement ; après succès, maintenir l’engagement
    jusqu’à sa consommation ; en cas d’abandon, examiner la libération selon les règles applicables.'
  boundaries:
  - La durée métier ne signifie pas conserver un verrou technique de base de données ouvert.
  - Une confirmation de commande ne libère pas nécessairement la réservation ; l’engagement peut se poursuivre jusqu’à la
    consommation.
  - Expiration éventuelle selon une politique explicite ; pas de durée fixe obligatoire ni soft = temporaire.
  - Les processus Business Services/Case Management et l’orchestration dans leur périmètre pilotent l’enchaînement et les
    compensations ; Reservation porte l’engagement de ressource.
  - Une compensation après réalisation physique ne se réduit pas nécessairement à libérer une réservation.
  - Transaction longue relève d’abord du glossaire méthodologique, sans créer un glossaire métier concurrent.
  market_comparisons:
  - vendor: Microsoft
    product: Azure Architecture Center
    element_name: Compensating Transaction pattern
    element_type: Patron d’architecture et de réalisation
    relationship: Appui méthodologique
    similarities: Opérations longues à plusieurs étapes, avec compensation métier possible, notamment annulation de réservations.
    differences: Appui de réalisation, pas définition d’une capacité Supply. La compensation tient compte des effets déjà
      produits ; elle ne restaure pas nécessairement un état antérieur et peut être impossible pour certains effets.
