commercial_commitment_U337:
  status: proposed_interpretation
  user_observation: La réservation ajoute au verrou un engagement envers le client qui déroule le processus de vente.
  proposed_definition: Établir et maintenir au bénéfice d’un besoin identifié un engagement sur une ressource ou une quantité,
    en la protégeant des usages concurrents incompatibles, selon les conditions de réalisation et de libération convenues.
  sales_application: Préserver la ressource au bénéfice du client afin qu’il puisse l’obtenir en accomplissant les étapes
    convenues du processus de vente, pendant la validité de la réservation.
  distinctions:
    lock: Protège l’exclusivité d’un traitement en cours ; ne porte pas nécessairement de bénéficiaire commercial ni d’engagement
      de fourniture.
    reservation: Protège un engagement au bénéfice du besoin/client ; peut persister au-delà de la session du vendeur ou du
      client.
    assignment: Précise quelles ressources sont affectées au besoin ou à la commande ; une même opération peut aussi réserver.
    promise: Porte l’engagement de fourniture notamment en quantité et date ; la réservation en sécurise la ressource sans
      l’épuiser.
  limits:
  - L’exclusion concerne les usages incompatibles ; la lecture, la préparation et le transport pour le bénéficiaire ne sont
    pas interdits par principe.
  - Garantie métier conditionnelle de préservation, sans transfert immédiat de propriété ni impossibilité d’incident physique.
  - Le client bénéficiaire peut différer de l’utilisateur qui réserve ; ne pas lier l’engagement à la session.
  - Conserver une formulation générique par besoin pour les autres Orders Supply ; le cas de vente ne réduit pas implicitement
    le catalogue.
  market_comparisons:
  - vendor: Shopify
    product: Draft orders
    element_name: Creating draft orders
    element_type: Règle fonctionnelle de réservation de stock
    relationship: Recouvrement partiel
    similarities: Les quantités réservées sont dédiées au draft order et ne peuvent pas être achetées par les autres clients
      ; une expiration peut être définie.
    differences: Appui direct à l’engagement commercial conditionnel et à l’exclusion concurrente, pas preuve de transfert
      immédiat de propriété ou de garantie physique absolue ; les durées Shopify ne deviennent pas une politique FLOW.
    flow_position: 'U337 distingue verrou de traitement et réservation comme engagement conditionnel au bénéfice du client.
      Proposition : exclure les usages concurrents incompatibles, conserver bénéficiaire et conditions explicites, sans confondre
      promesse de fourniture, affectation et acquisition effective.'
    source_title: Creating draft orders
    source_url: https://help.shopify.com/en/manual/fulfillment/managing-orders/create-orders/create-draft
    source_version: Documentation évolutive sans édition figée
    consulted_on: '2026-09-18'
    source_locator: Reserve item inventory in a draft order
    evidence_limits: Texte primaire indexé consulté. Aucun déploiement Beaumanoir ni régime de propriété déduit.
    status: proposed
    source_refs:
    - U337
    - ELM210
    - CMP118
  - vendor: Microsoft
    product: Dynamics 365 Supply Chain Management
    element_name: Reserve inventory quantities
    element_type: Règle fonctionnelle de réservation de stock
    relationship: Recouvrement partiel
    similarities: Les quantités réservées pour un Sales Order ne peuvent pas être retirées pour d’autres Orders sans annulation
      de la réservation ; prise en compte de clients prioritaires, ressources présentes ou futures.
    differences: Le périmètre Microsoft inclut aussi des besoins de production. La réservation n’est donc pas limitée dans
      le marché au seul client acheteur ; aucune identité entre utilisateur du système et bénéficiaire n’est requise.
    flow_position: 'U337 distingue verrou de traitement et réservation comme engagement conditionnel au bénéfice du client.
      Proposition : exclure les usages concurrents incompatibles, conserver bénéficiaire et conditions explicites, sans confondre
      promesse de fourniture, affectation et acquisition effective.'
    source_title: Reserve inventory quantities
