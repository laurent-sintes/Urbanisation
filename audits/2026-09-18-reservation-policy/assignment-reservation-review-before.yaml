policy_decision_U341:
  status: proposed
  user_observation: |-
    Je pense que les policies (les choix de déclenchement) sont importantes à préciser et dépendent d'une décision. La décision peut être structurelle (on définit dès le départ) ou adaptative selon le niveau de stock et le niveau de flux sortant (risque de pénurie).
    Que dit le marché sur ça ?
  market_conclusion: 'Politiques de réservation configurées documentées ; leviers de variation disponibles. Les sources consultées
    ne démontrent pas de moteur standard choisissant le jalon du parcours de vente à partir du stock et de sa vitesse de sortie.
    Adaptation documentée sur des mécanismes voisins : stock de sécurité et confirmations.'
  distinction: Une politique structurelle peut contenir dès sa conception des règles conditionnelles. Une décision contextuelle
    peut appliquer ces règles sans réécrire la politique ni mobiliser de l’IA. Adapter les paramètres de politique est encore
    un autre acte.
  candidate_name: Reservation Policy Decision
  candidate_definition: Déterminer dans quelles situations, à quel moment et pour quelle durée réserver des ressources afin
    de sécuriser la promesse, selon le risque de pénurie et le coût d’indisponibilité pour les autres demandes.
  naming_limit: Nom proposé pour la responsabilité FLOW ; pas de dénomination unifiée de capacité établie sur le marché. Parent
    et éventuelle décomposition à arbitrer.
  decision_inputs:
  - Stock disponible après engagements existants et protections applicables
  - Vitesse et variabilité des nouvelles demandes et engagements concurrents ; flux physiques sortants à distinguer
  - Entrées attendues et leur fiabilité
  - Probabilité de conversion et durée du parcours de vente
  - Objectifs de service et priorités commerciales
  tradeoff: Un risque élevé peut justifier une réservation plus précoce pour protéger le parcours, ou plus tardive et courte
    pour éviter l’accaparement par des paniers peu probables. Le niveau de risque ne détermine pas seul la politique optimale.
  boundaries:
  - La décision recommande ou sélectionne la politique ; sa gouvernance et sa mise en vigueur restent une responsabilité de
    management à rattacher explicitement.
  - Reservation réalise et maintient les engagements individuels.
  - ATP fournit les possibilités ; Supply Assignment établit les liens ressources-commandes ; Inventory Target Decision garde
    les objectifs et seuils de stock.
  - Changer une politique pour les nouvelles demandes ne retire pas implicitement les garanties des réservations existantes.
  decomposition_position: Ne pas créer immédiatement deux capacités structurelle/adaptative. Examiner comme modalités ou comportements
    d’une même décision seulement après démonstration du bénéfice ; aucun comportement par jalon écran.
  market_comparisons:
  - vendor: Microsoft
    product: Dynamics 365 SCM
    element_name: Inventory reservation policies
    element_type: Règle ou mécanisme produit
    relationship: Recouvrement partiel
    similarities: 'Politiques configurées : réservation automatique à la création des lignes de commande ou manuelle ; jalon
      de réservation configurable en production.'
    differences: Pas de preuve dans ce passage d’un choix automatique du jalon de vente selon le stock et la vitesse de sortie.
      Texte primaire indexé consulté ; ouverture directe en erreur 503.
    flow_position: 'U341 : distinguer décision de politique, gouvernance des règles et réalisation de la réservation. Responsabilité
      proposée Reservation Policy Decision ; nom FLOW sans équivalence de catalogue revendiquée.'
    source_title: Inventory reservation policies
    source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/inventory/reserve-inventory-quantities
    source_version: Documentation évolutive sans édition figée
    source_locator: Inventory reservation policies ; Item sales reservation ; Production parameters
    consulted_on: '2026-09-18'
    evidence_limits: Pas de preuve dans ce passage d’un choix automatique du jalon de vente selon le stock et la vitesse de
      sortie. Texte primaire indexé consulté ; ouverture directe en erreur 503. Aucune couverture Beaumanoir démontrée.
