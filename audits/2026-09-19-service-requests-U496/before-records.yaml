      choice: Disposer d’une demande Supply claire et maintenue jusqu’à son résultat ou sa fin. Order Management porte les
        commandes et leurs évolutions, avec des responsabilités distinctes pour optimiser, promettre et exécuter.
      flow_scope: Intentions, parties, conditions, structure, cycle de vie et conservation des commandes Supply.
      flow_approach: Gérer chaque famille selon son résultat attendu et rendre ses échanges avec la promesse et les processus
        explicites.
      synthesis:
      - Microsoft montre la gestion d’une famille de commandes ; SAP décrit le parcours complet d’une vente ; Oracle coordonne
        les documents nécessaires à l’approvisionnement. Les noms proches recouvrent donc des périmètres différents.
      - FLOW retient Order Management pour maintenir les demandes et leurs règles d’évolution. L’area ne récupère ni toute
        l’optimisation ni toute l’exécution simplement parce qu’un éditeur les présente dans le même produit.
