principles:
- id: PRINCIPLE-EXECUTION-DECISION-AND-COORDINATION
  statement: La visibilité sur la capacité rend accessibles les informations communiquées par les exécutants. La décision
    de besoins détermine les prestations nécessaires ; Service Order Management tient les demandes et leur cycle. Orchestration
    coordonne les prestations et leurs dépendances ; Adaptation Decision détermine les variations du plan. D15 conserve la
    promesse Supply et les exécutants leurs opérations internes.
  source_refs:
  - U245
  - U246
  - U247
  - U438
method_terms:
- id: MOD013
  name: Area
  label_fr: Area
  definition: Périmètre cohérent de responsabilités métier au sein d’un Domain. Il regroupe les capacités qui permettent de
    traiter ces problèmes et coopère avec les autres Areas.
  role: Distinguer les périmètres tels qu’Order Management, Inventory Management ou Inventory Optimization des capacités qu’ils
    regroupent.
  notes:
  - U482 adopte Area au niveau auparavant nommé Domaine. Une Area n’est ni un service d’organisation ni une application.
  - Authoritative Data reste le nom du groupe de présentation des référentiels ; le choix des niveaux ne fusionne pas ces
    référentiels.
  source_refs:
  - U481
  - U482
  - ELM486
  - ELM487
  - CMP195
  review:
    state: partial
    adopted_scope: 'U482 : nom Area et place entre Domain et Capability.'
    proposed_scope: Définition explicative et exemples ; aucun nouveau périmètre métier.
  market_comparison:
