- id: D01.h
  revision: 8
  kind: capability
  fields:
    name: Consigned Inventory Management
    definition: 'Appliquer au stock consigné les conditions de l’accord : propriété, droits d’usage, échéances et suites autorisées
      ; mobiliser les capacités responsables lorsqu’une acquisition, un retour ou une autre issue devient nécessaire.'
    nature: management
    finality: Respecter les droits et obligations sur le stock fournisseur détenu, pendant sa présence dans le réseau et lors
      de ses suites.
    scope: |-
      La cible initiale concerne le fournisseur propriétaire et le distributeur détenteur. La capacité applique les conditions référencées d’Agreement ; elle ne négocie pas le contrat et n’administre pas son maître. Détention, propriété, droit d’usage, responsabilité et rémunération du stockage sont distincts. [Inventory Tracking](model:D01.f) et [Record Inventory Movements](model:D01.g) conservent les états et mouvements. [Consignment Replenishment Order](model:D04.r) porte la demande d’apport ; [Purchase Order](model:D04.j), [Supplier Return](model:D04.m) ou les autres Orders pertinents portent les suites retenues. Les faits utiles sont transmis à la comptabilité, la facturation et l’assurance sans absorber leurs responsabilités. Les issues autorisées après saison ne se confondent ni avec la décision du devenir ni avec sa réalisation. Location rémunérée, transfert de propriété à chaque vente et droit de destruction ne sont pas des règles universelles déduites de la consignation.

      [Agreement](model:D11) fournit les conditions applicables, y compris celles de l’offre de stockage. [Inventory Optimization](model:D05) décide des besoins d’implantation ou de réassort ; [Order Management](model:D04) porte les demandes correspondantes ; [Inventory Management](model:D01) applique le régime du stock et enregistre ses évolutions ; [Process Management](model:D06) orchestre les prestations physiques et numériques.

      Exemple fictif présenté et adopté : une demande porte sur 500 pièces pour une implantation. Les réceptions satisfont progressivement la demande d’apport. Les pièces restent ensuite gérées sous l’accord de consignation : vente autorisée, éventuel transfert de propriété, échéance de reprise. La fin de la demande ne met pas fin à la gestion de la consignation. Cet exemple ne décrit pas une pratique installée prouvée chez Beaumanoir.

      U401 : comportements adoptés — [Consumption-Based Ownership Transfer](model:BHV063), [Aging-Based Ownership Transfer](model:BHV064), [Consignment Exit](model:BHV065). Les comportements ne sont ni une séquence obligatoire ni tous exclusifs. Les comportements distinguent le transfert de propriété à la consommation, le transfert à une échéance contractuelle et la sortie autorisée de la consignation ou de la détention. Identifier les quantités concernées et ne pas additionner des stocks ou attendus deux fois.

      D04 porte les demandes, leur résultat attendu, Lifecycle, Structuring et Archiving ; D03 optimise leur satisfaction et D15 porte possibilités et engagements de promesse ; D05 optimise le stock, D01 conserve ses faits/régimes et D06 orchestre les services. Ces capacités restent mobilisables et les opérations utiles doivent être expliquées dans chaque contexte métier.
    market_comparisons:
    - vendor: Microsoft
      product: Dynamics 365 Supply Chain Management
      source_title: Set up consignment
      source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/inventory/consignment
      source_version: '2026-05-06'
      source_locator: Overview ; Inventory ownership change journal
      consulted_on: '2026-09-19'
      concept_name: Consignment inventory
      scope_summary: Stock détenu chez le client, propriété fournisseur.
      approach_summary: Séparer réception et acquisition.
      evidence_limits: Documentation primaire de produit ; aucune preuve de réalisation Beaumanoir ni équivalence de catalogue
        de capacités.
      element_name: Consignment inventory
      element_type: Concept documenté par la source primaire
      relationship: Recouvrement partiel
      similarities: La réception ne transfère pas la propriété ; l’utilisation peut le faire.
      differences: Le scénario Microsoft est celui de matières de production, pas toutes les consignations retail.
      flow_position: 'Appliquer les conditions du stock appartenant encore au fournisseur : Consigned Inventory Management
        distingue détention, utilisation et acquisition. Les issues possibles dépendent de l’accord de consignation.'
      status: proposed
      source_refs:
      - U400
      - U401
      - ELM240
      - CMP151
      - U477
      - ELM406
      - CMP190
    - vendor: Oracle
      product: Oracle Fusion Cloud SCM
      source_title: Consigned Inventory Aging
      source_url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/26a/famml/consigned-inventory-aging.html
      source_version: 26A
      source_locator: Aging Process ; Aging period ; Transfer to Owned
      consulted_on: '2026-09-19'
      concept_name: Consigned inventory aging
      scope_summary: Acquisition après une durée convenue.
      approach_summary: Appliquer une échéance contractuelle.
      evidence_limits: Documentation primaire de produit ; aucune preuve de réalisation Beaumanoir ni équivalence de catalogue
        de capacités.
      element_name: Consigned inventory aging
      element_type: Concept documenté par la source primaire
      relationship: Recouvrement partiel
      similarities: La durée contractuelle peut déclencher l’acquisition.
      differences: L’échéance Oracle est une clause possible, pas un achat automatique universel.
      flow_position: 'Appliquer les conditions du stock appartenant encore au fournisseur : Consigned Inventory Management
        distingue détention, utilisation et acquisition. Les issues possibles dépendent de l’accord de consignation.'
      status: proposed
      source_refs:
      - U400
      - U401
      - ELM240
      - CMP151
      - U477
      - ELM359
      - CMP190
    decomposition_rationale: Les obligations sur le stock diffèrent selon consommation, durée contractuelle ou sortie sans
      acquisition ; expliciter ce qui change la propriété et ce qui met fin à la détention évite de confondre mouvement et
      achat.
    market_inspiration:
      choice: 'Appliquer les conditions du stock appartenant encore au fournisseur : Consigned Inventory Management distingue
        détention, utilisation et acquisition. Les issues possibles dépendent de l’accord de consignation.'
      flow_scope: Propriété, droits d’usage, échéances et sorties autorisées.
      flow_approach: Appliquer le régime puis mobiliser achats, retours et prestations utiles.
      synthesis:
      - Microsoft illustre l’acquisition liée à l’utilisation ; Oracle montre celle liée au temps. La propriété fournisseur
        est leur point commun, les déclencheurs sont différents.
      - FLOW réunit l’application de ces conditions sans décider implicitement d’acheter tous les invendus. Les commandes
        et la réalisation des retours restent portées par leurs responsables.
      examples:
      - title: Exemple Microsoft — matière fournisseur dans l’usine
        situation: USMF reçoit puis conserve de la matière appartenant au fournisseur.
        outcome: La propriété des quantités destinées à la production change avant leur consommation.
        lesson: Détention et propriété doivent rester visibles séparément ; le mécanisme est adapté à l’accord applicable.
        source_title: Set up consignment
        source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/inventory/consignment
