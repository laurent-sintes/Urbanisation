id: flow-modeling-glossary
kind: modeling_glossary
as_of: '2026-09-16'
source_refs:
- U229
- U230
- U231
- U232
purpose: Vocabulaire de modélisation en support à la définition des objets du modèle ; distinct du glossaire métier.
boundary:
  business_glossary: modeles/backlog/glossary.yaml
  rule: Ne pas fusionner ce registre avec le glossaire métier ni ajouter ses termes au catalogue métier publié.
  coverage: Sens discutés en U229–U231 uniquement ; aucune reclassification exhaustive des termes historiques réalisée.
  links: 'Identifiants MOD propres à ce registre. Les liens glossary: des publications métier conservent leur résolution métier
    ; aucun nouveau protocole lexical ni écran Atlas créé par cette séparation.'
terms:
- id: MOD001
  name: Decision
  label_fr: Décision
  definition: Déterminer une réponse métier à partir d’hypothèses, d’objectifs et de contraintes.
  role: Qualifier une responsabilité de décision dans le modèle.
  notes:
  - Les capacités de Planning se nourrissent des capacités de décision selon U229.
  - Le calcul est un moyen possible ; U229 préfère Decision et souhaite éviter Calculation comme intitulé de capacité.
  - Une décision modélisée ne prouve pas sa mise en application transactionnelle.
  source_refs:
  - U229
  - U232
  review:
    state: partial
    adopted_scope: Préférence pour Decision et distinction avec Planning ; aucun choix de capacité spécifique adopté.
    proposed_scope: Définition synthétique rédigée par Codex.
- id: MOD002
  name: Planning
  label_fr: Planification
  definition: Reconfigurer, simuler et valider en mobilisant les capacités de décision.
  role: Qualifier les responsabilités de planification qui utilisent les décisions.
  notes:
  - Les trois verbes et le recours aux décisions proviennent de U229.
  - Leur mise en œuvre peut être itérative ; aucun enchaînement technique ou contrôle humain systématique n’est présumé.
  source_refs:
  - U229
  - U232
  review:
    state: partial
    adopted_scope: Reconfigurer, simuler, valider ; les capacités Planning se nourrissent de Decision.
    proposed_scope: Formulation et précisions éditoriales, sans adoption de périmètres de capacités.
- id: MOD003
  name: Management
  label_fr: Gestion / gouvernance
  definition: Gérer les règles et leur validité, et tenir transactionnellement les données qui les matérialisent.
  role: Qualifier une responsabilité de gestion, à préciser selon l’objet concerné.
  notes:
  - U230 qualifie Stock Protection de gouvernance/management ; U231 précise sa mise à jour transactionnelle.
  - Cette formulation générale est proposée à partir du cas Stock Protection ; elle n’impose pas la même définition à toute
    capacité nommée Management.
  - Le sens d’application transactionnelle est défini par MOD004.
  source_refs:
  - U230
  - U231
  - U232
  review:
    state: partial
    adopted_scope: Qualification et application transactionnelle dans le cas Stock Protection.
    proposed_scope: Généralisation à Management et formulation hors de ce cas.
- id: MOD004
  name: Application transactionnelle
  definition: Mettre à jour transactionnellement les données, unitairement, en groupe ou en masse, par plusieurs types d’interfaces
    possibles.
  role: Préciser le sens de l’application des résultats dans une capacité de management.
  modalities:
    granularities:
    - Unitairement
    - En groupe
    - En masse
    interfaces:
    - Écrans
    - Batch
    - Flux
    - Streaming
  notes:
  - Ces modalités ne constituent pas des capacités supplémentaires.
  - Ne pas confondre la mise à jour des données, leur utilisation par les capacités consommatrices et un mouvement physique.
  - Aucune technologie, garantie d’atomicité de lot ou interface particulière n’est imposée.
  source_refs:
  - U231
  - U232
  review:
    state: partial
    adopted_scope: Mise à jour transactionnelle et modalités précisées en U231 pour Stock Protection.
    proposed_scope: Reformulation, généralisation et précisions de lecture.
