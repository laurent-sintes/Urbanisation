    U283 et retient Simulation & analyse en un seul comportement : les impacts sont intégrés à ce comportement, sans Scenario
    Impact Analysis autonome dans la cible.'
  proposed_boundary: D05 adapte le scénario de stock à partir des faits et mobilise les décisions spécialisées ; D06 conserve
    adaptation opérationnelle et orchestration. Cette articulation détaillée reste proposée.
  open_points:
  - Définitions et noms anglais révisés
  - Rattachement et identité du comportement d’adaptation, sans réutilisation implicite de BHV009
  - Préservation des fonctions et de leurs exigences dans les descriptions utiles, sans niveau supplémentaire
  justification: Différencier des façons d’agir qui changent les pratiques et les processus ; conserver la justification par
    complexité ou bénéfice ciblé U265.
  confirmation_U284:
    source_refs:
    - U284
    adopted_label_fr: Simulation & analyse
    editorial_label_en: Simulation & Analysis
    proposed_combined_description: Projeter les conséquences d’un scénario et en analyser les impacts sur les indicateurs
      métier et les processus, pour éclairer les choix avant engagement ou adaptation.
    accepted_previous_descriptions:
      construction: 'Préparer plusieurs réponses possibles à une situation : privilégier la disponibilité, limiter l’immobilisation,
        modifier les contraintes.'
      simulation: Expérimenter les conséquences avant d’engager l’entreprise, y compris les impacts sur les indicateurs et
        les processus.
      adaptation: Réagir aux écarts observés en ajustant la trajectoire, en tenant compte des actions déjà engagées.
    accepted_boundary: D05 fait évoluer le scénario de stock ; D06 conserve l’adaptation opérationnelle et l’orchestration
      des prestations.
    migration_status: Migration des nœuds et rattachements historiques à préciser ; aucune réutilisation implicite des identifiants.
