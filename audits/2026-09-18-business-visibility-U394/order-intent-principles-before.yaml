id: ORDER-INTENT-PRINCIPLES-U393
as_of: '2026-09-18'
status: principle_recorded_from_user
source_refs:
- U393
- U391
- U392
- ELM238
- CMP149
principle: Modéliser une demande par son intention métier, les parties et leurs rôles, la relation ou l’accord applicable,
  les engagements attendus et le résultat à obtenir. Décrire ensuite son traitement et ses adaptations ; les documents ERP,
  mouvements logistiques et écritures sont des réalisations ou effets à relier, pas l’autorité qui fixe la sémantique de la
  demande.
review:
  adopted_scope: 'Direction architecturale exprimée et demande de mémorisation U393 : intentions et relations entre parties
    avant choix des documents.'
  editorial_scope: Formulation, grille d’analyse, exemples et comparaison marché rédigés par Codex ; noms de capacités encore
    proposés non validés par extension.
analysis_grid:
- Quelle intention et quel résultat métier ?
- Qui demande, à qui, et sous quels rôles ?
- Quel accord, quels droits et engagements ?
- Quels événements rendent la demande satisfaite ou imposent une adaptation ?
- Quels services et capacités sont mobilisés ?
- Quels documents et effets matérialisent cette intention dans chaque réalisation ?
architecture_boundaries:
- Un document ERP peut porter plusieurs intentions métier ; plusieurs documents peuvent réaliser une intention. Ne pas calquer
  capacité ou case sur une table ERP.
- Des opérations physiques communes ne fusionnent pas des demandes dont intentions ou engagements diffèrent.
- Les couches transactionnelle Supply et processus Business Services restent distinctes ; ne pas imposer un Order universel,
  un workflow unique, un case par document ou un logiciel.
- Réutiliser Lifecycle, Structuring et Archiving ; ne pas créer un comportement pour chaque étape technique.
- Conserver les accords antérieurs Purchase Order ; les noms Consigned Inventory Management et Consignment Replenishment Order
  demeurent proposés.
consignment_target:
  status: target_intent_expressed_by_user_not_installed_fact
  source_refs:
  - U393
  perspective: Le fournisseur dispose d’un espace de stockage distant dans le réseau du distributeur ; le distributeur propose
    une offre de mise à disposition de cet espace.
  commercial_model: Location/rémunération d’espace évoquée par Laurent ; nature précise, assiette, montant et conditions non
    définis. Ne pas la transformer en condition universelle de consignation.
  ownership: L’apport en consignation n’est pas un achat de marchandises ; un éventuel changement de propriété ultérieur reste
    distinct, selon le montage retenu.
  replenishment: Les ventes et l’évolution du besoin déclenchent ou alimentent le réassort demandé dans la cible décrite ;
    pas de poussée fournisseur unilatérale présumée.
  limits:
  - Aucun automatisme une vente = une unité immédiatement commandée.
  - Réassort tiré par la demande ne désigne pas, à lui seul, l’acteur responsable du calcul ou de la décision.
  - Ne pas déduire de VMI, de transfert automatique à chaque vente, de tarif de stockage ou de responsabilité assurantielle
    non explicités.
  - Stockage, propriété, pilotage du réassort et rémunération sont des dimensions séparées de l’offre.
market_comparisons:
- comparison_ref: CMP149
  status: editorial_comparison
  common: Microsoft distingue explicitement les intentions d’apport et d’acquisition. SAP conserve des effets métier distincts
    dans une structure documentaire commune et peut générer des apports selon les besoins.
  difference: La séparation Microsoft est plus directement alignée sur le vocabulaire métier FLOW pour ce cas. Ni l’existence
    de deux objets ni une catégorie de ligne ne mesure à elle seule la maturité processus ou Case Management de l’éditeur.
  flow_position: Adopter le principe de modélisation par intentions exprimé U393 ; préférence locale justifiée pour la séparation
    des demandes, sans classement général des éditeurs.
  source_ids:
  - OI-S1
  - OI-S2
  - OI-S3
