      - U496
      concept_name: Backlog planning / Simulation / Release
      scope_summary: Réexamen de la satisfaction d’un carnet de commandes existant.
      approach_summary: Planifier, comparer et simuler, puis appliquer les résultats retenus.
    market_inspiration:
      choice: Service Requests porte les demandes de travail que Supply Chain Orchestration reçoit ou fait naître. Ce nom
        couvre aussi bien les commandes que les demandes internes d’étude, de contrôle ou d’optimisation, avec un résultat
        attendu et une prise en charge suivie.
      flow_scope: Demandes métier de vente, achat, transfert, retour ou apport, et demandes internes issues d’une sollicitation
        ou d’une réaction du Domain.
      flow_approach: Distinguer la finalité, l’origine et le déclencheur ; conserver la demande pendant que les capacités
        concernées en assurent le traitement.
      synthesis:
      - 'Salesforce montre des demandes internes suivies comme des dossiers à part entière. TM Forum nomme Service Order une
        demande de service. Oracle décrit le parcours de réexamen du carnet, avec simulation et application distinctes : ces
        sources éclairent respectivement la demande, sa fonction d’activation et son traitement.'
      - FLOW retient Service Requests comme nom commun des familles de demandes du Domain. Les Sales Orders, Transfer Orders
        et autres Orders gardent leur sens propre. Une détection peut faire naître une demande interne ; le frontoffice ou
        le backoffice ne constitue pas une frontière de capacité.
      - Une Service Request exprime le travail pris en charge par le Domain. Les Backing Services sont les prestations mobilisées
        pour le réaliser ; les Backing Service Orders portent les demandes adressées aux exécutants. Les choix de simulation,
        d’arbitrage et d’application restent dans les Areas responsables.
      examples:
      - title: Illustration FLOW — réexaminer un carnet après un retard
        situation: Un retard d’approvisionnement rend plusieurs promesses difficiles à tenir. Le Domain ouvre une demande
          interne pour réexaminer les commandes concernées.
        outcome: La demande suit l’étude, la comparaison des scénarios et le résultat retenu ; les capacités d’optimisation
          et d’affectation assurent le traitement approprié.
        lesson: L’événement déclenche la prise en charge ; la demande porte son objectif et son suivi. Oracle documente le
          parcours de planification, pas l’obligation d’un dossier identique à celui de cette illustration FLOW.
        source_title: Oracle Overview of Backlog Management Processes
        source_url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/25c/faubm/overview-of-backlog-management-processes.html
        source_refs:
