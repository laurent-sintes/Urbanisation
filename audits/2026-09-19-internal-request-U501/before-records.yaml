  review:
    state: partial
    adopted_scope: 'Comportement comme niveau complémentaire sous la capacité ; arrêt de la décomposition à ce niveau. U263
      : descriptions factuelles sans qualification marketing. U265 : exigence de justification par une complexité ou un bénéfice
      ciblé. U282 : préférence explicite pour les mécanismes métier plutôt que les opérations, illustrée par Supply Protection.
      U283 retient Mécanisme, Politique, Variante ou bénéfice comme critères différenciants de décomposition. Pour Planning,
      les effets sur les pratiques humaines et les processus distinguent les comportements des fonctions de produits. Ces
      critères ne constituent pas quatre niveaux supplémentaires. U284 confirme la direction U283 et retient Simulation &
      analyse en un seul comportement : les impacts sont intégrés à ce comportement, sans Scenario Impact Analysis autonome
      dans la cible. U389 demande une définition étayée par une liste concrète construite à partir de l’existant et la mémorisation
      de cette règle. U398 : différencier et expliquer les comportements réellement différents d’une capacité selon les capacités
      qui la mobilisent ; interactions nommées pour rendre la logique métier lisible.'
    proposed_scope: Définition générale éditoriale et intitulé anglais de la notion. Les quatre définitions de comportements
      ATP sont adoptées séparément en U263 dans d03-review.yaml. Les formulations détaillées issues de U283 restent à préciser
      ; aucune nouvelle hiérarchie adoptée. La reformulation, les sept formes illustratives et leur analyse transversale U389
      sont éditoriales ; aucune classification exhaustive validée par Laurent n’est présumée.
  concrete_forms:
  - key: policy_strategy
    label: Politique ou stratégie métier
    explanation: Distinguer une logique de choix, de protection ou de contrôle qui change la réponse ou la façon d’agir.
    examples:
    - 'Reservation Policy Decision : Milestone-Based et Risk-Adaptive Reservation Policy (BHV032, BHV035).'
    - 'Return Disposition Decision : Policy-based Disposition et Value Recovery Optimization (BHV048, BHV049).'
    - 'Stocktaking : Periodic Physical Inventory, Cycle Counting, Spot Counting (BHV029–031).'
    boundary: Une valeur de seuil, une fréquence précise ou le choix humain/IA ne suffit pas à créer un comportement.
  - key: process_variant
    label: Variante de processus ou de prise en charge
    explanation: Distinguer un parcours par son résultat attendu, ses obligations, ses acteurs ou ses flux métier, sans détailler
      toutes ses étapes.
    examples:
    - 'Customer Return : Return to Stock, Repair and Refurbishment, Return to Supplier (BHV050–052).'
    - 'Supplier Return : Return for Credit, Return for Replacement, Return for Repair (BHV055–057).'
    boundary: Saisie, validation et clôture ne deviennent pas automatiquement trois comportements sous chaque Order ; les
      parcours peuvent se combiner.
  - key: intervention_mechanism
    label: Mécanisme d’intervention
    explanation: Distinguer comment une capacité produit son effet métier, notamment en préservant ou en révisant un état
      existant.
    examples:
    - 'Supply Assignment : Plan Application, Incremental Supply Assignment, Supply Reassignment (BHV045–047).'
    - 'Supply Protection : Group Supply Protection, Consumption Capping, Safety Stock Policy, Replenishment Regulation (BHV017–020).'
    - 'Stock Redistribution Decision : Inventory Rebalancing et Stock Consolidation (BHV024–025).'
    boundary: Ne pas confondre mécanisme métier et algorithme, API, batch ou liste des opérations CRUD.
  - key: business_scope
    label: Périmètre métier d’intervention ou d’arbitrage
    explanation: Distinguer une portée qui change les contraintes, interdépendances, faits observés ou responsabilités ; ce
      critère vaut aussi pour les décisions.
    examples:
    - 'Inventory Target Decision : Store, Distribution Center et Multi-Echelon Inventory Optimization (BHV026–028).'
    - 'Operations Tracking : Warehouse Visibility, Transportation Visibility, Store Visibility et Process Tracking, intégrés
      comme comportements directs BHV079–082 (U406/U409).'
    boundary: Un comportement par site, équipe ou application n’est pas justifié par le seul changement de périmètre. Le tracking
      est une capacité de connaissance, pas une action au sens strict de fields.nature.
  - key: decision_dimension
    label: Dimension de raisonnement ou d’information prise en compte
    explanation: Distinguer les informations ou contraintes qui changent les possibilités établies par une décision ; les
      dimensions sont combinables.
    examples:
    - 'ATP : engagements existants, stock du réseau, délai de mobilisation opérationnelle et apports futurs (BHV001–004).'
    boundary: Ne pas transformer chaque donnée d’entrée ou étape de calcul en comportement ; Decision garde ses calculs.
  - key: business_effect
    label: Effet sur l’état métier ou l’engagement
    explanation: Distinguer des effets substantiels sur les obligations, l’autorisation, la stabilité ou la continuité du
      traitement.
    examples:
    - 'Fulfillment Commitment : Promise Proposal, Confirmation, Revision (BHV021–023).'
    - 'Order Lifecycle Management : Order Firming, Order Freezing, Order Preparation & Revision, Order Release, Order Hold
      & Resume et Order Termination (BHV036–040, BHV043 ; U424). Order Splitting BHV044 relève d’Order Structuring, déplacée
      dans D04 en U438 ; son parent de capacité est conservé depuis U417.'
    boundary: Le nom d’un statut ou d’un bouton ne suffit pas ; expliquer l’effet métier. Ce critère n’autorise pas à dupliquer
      Lifecycle sous chaque type d’Order.
  - key: planning_practice
    label: Pratique de planification et d’adaptation
    explanation: Distinguer une manière de travailler sur un scénario qui transforme l’analyse, la coordination humaine ou
      les interactions avec l’exécution.
    examples:
    - 'Inventory Planning : Scenario Construction, Simulation & Analysis, Scenario Execution Adaptation (BHV005, BHV006, BHV016).'
    boundary: Évaluation, validation et application restent des fonctions utiles sans comportement autonome justifié à ce
      stade ; ne pas déplacer la responsabilité d’adaptation opérationnelle de D06.
  decomposition_rule: Pour définir ou réexaminer un comportement, partir d’exemples du modèle, expliciter sa forme concrète,
    ce qui le distingue des autres comportements de la capacité et son effet métier. Justifier la décomposition par une complexité
    ou un bénéfice ciblé ; ne pas imposer une catégorie exclusive par nature de capacité, une décomposition systématique ou
    un niveau supplémentaire.
  analysis_ref: modeles/backlog/behavior-typology.yaml
  market_comparison:
    comparison_ref: CMP145
    common: BIZBOK décrit Capability Behavior comme une manière d’agir selon les circonstances ; Microsoft illustre plusieurs
      politiques de comptage.
    difference: Les sept formes et le niveau terminal sont des conventions FLOW ; les sources ne prescrivent pas cette typologie
      ni une équivalence de niveaux.
    sources:
    - ELM052
    - ELM234
    consulted_on: '2026-09-18'
- id: MOD007
  name: Capability Nature
  label_fr: Type de capacité
  definition: Qualifier une capacité selon son résultat métier dominant, indépendamment de son nom, de ses comportements et
    de sa réalisation technique.
  role: Fournir une grille de lecture explicite et stable pour les icônes et la présentation des capacités.
  notes:
  - Les six valeurs présentes dans FLOW sont action, management, knowledge, orchestration, planning et decision.
  - Decision, Planning et Management gardent leurs conventions MOD001–MOD003. Les types peuvent partager des opérations ;
    la responsabilité dominante porte la classification.
  - Les décisions sont présentées après les autres capacités ; cet ordre de lecture ne représente pas un enchaînement.
  - La grille détaillée et les dix compléments proposés sont consignés dans capability-types-U449.yaml ; la nature propre
    de chaque capacité reste portée par son fields.nature.
  - OMG DMN éclaire la distinction décision/processus sans prescrire ces six types ni leurs icônes.
  analysis_ref: modeles/backlog/capability-types-U449.yaml
  source_refs:
  - U449
  - CMP169
  - ELM259
  review:
    state: partial
    adopted_scope: Typage exhaustif, icônes associées, décisions en fin de liste et séparation légère U449.
    proposed_scope: Formulation méthodologique, grille détaillée et compléments individuels rédigés par Codex.
