        - ELM496
        - CMP200
      - title: Exemple Salesforce — une demande de service interne
        situation: Un employé demande un téléphone professionnel avec les caractéristiques nécessaires à son travail.
        outcome: La demande est suivie, approuvée si nécessaire, traitée par les équipes concernées puis clôturée.
        lesson: Une demande interne peut porter un objectif et un suivi complet ; elle n’est pas limitée à une tâche technique.
        source_title: Salesforce Explore Service Requests and Resolutions
        source_url: https://trailhead.salesforce.com/content/learn/modules/request-management-for-agentforce-it-service/explore-service-requests-and-resolutions
