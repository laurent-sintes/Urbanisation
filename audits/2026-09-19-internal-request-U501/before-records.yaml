      product: Agentforce IT Service
      element_name: Service Request / Case / Incident
      element_type: Concept et fonctionnement documentés
      relationship: Recouvrement partiel
      similarities: Une demande de travail possède une finalité et un suivi, même lorsqu’elle est interne.
      differences: L’exemple concerne les services aux employés ; FLOW couvre les demandes Supply et leurs réactions internes,
        sans reprendre les types de dossiers Salesforce.
      flow_position: Service Requests porte les demandes métier reçues ou nées dans le Domain ; les autres Areas analysent,
        décident et réalisent leur traitement.
      source_title: Salesforce Explore Service Requests and Resolutions
      source_url: https://trailhead.salesforce.com/content/learn/modules/request-management-for-agentforce-it-service/explore-service-requests-and-resolutions
      source_version: Agentforce IT Service, cours évolutif sans édition précisée
      source_locator: Service Requests ; Request Tracking ; Resolving Requests
      consulted_on: '2026-09-19'
      evidence_limits: Exemple de service aux employés ; pas de réaction autonome Supply ou de fraude établie par cette source.
      status: proposed
