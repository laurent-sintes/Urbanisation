        peut le faire naître. Les deux traitent le même déplacement depuis des points de vue différents.
      - FLOW conserve la commande comme responsabilité propre. Implantation, réassort, rééquilibrage et satisfaction d’une
        vente expliquent son intention sans changer la distinction départ/arrivée.
