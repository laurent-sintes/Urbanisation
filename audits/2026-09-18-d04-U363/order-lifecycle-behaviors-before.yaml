      identique créé systématiquement.
  quantity_boundary: Scinder 100 pièces en 60+40 conserve la demande transformée. Cloner une commande de 100 peut ajouter
    une nouvelle demande de 100 ; ne pas compter la copie comme fragment de l’original. Copier une version de travail du même
    Order est encore un autre cas.
