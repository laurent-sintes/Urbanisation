architecture_direction_U357:
  status: direction_recorded_target_proposed_not_applied
  user_direction:
    role_capability: Hypothèse de capacité générique avec achat/vente/retour comme comportements.
    lifecycle: Mutations internes d’un Order ; accord de direction sur les mutations proposées.
    structuring: Séparé de Lifecycle.
    archiving: Séparé de Lifecycle.
  proposed_target:
  - name: Order Handling
    kind: capability
    naming_status: proposed_FLOW_label
    definition: Gérer les Orders selon leur finalité métier en appliquant les règles et informations propres à la vente, à
      l’achat, au transfert ou au retour.
    candidate_behavior_existing_ids:
    - D04.i
    - D04.j
    - D04.k
    - D04.l
    - D04.m
    decomposition_rationale: 'Les cinq variantes diffèrent par l’engagement, les parties, les informations à maintenir et
      le reste à satisfaire : à servir, recevoir, transférer ou retourner. Elles mobilisent des mutations communes sans dupliquer
      Lifecycle.'
    limit: Si ces variantes ne portaient qu’un attribut sans effet différenciant, une liste de types suffirait. La décomposition
      doit conserver les différences métier décrites dans les cinq capacités actuelles.
    naming_reason: Rôle seul désigne une propriété ambiguë, déjà utilisée pour Party. Order Type Management suggérerait l’administration
      d’un référentiel de types ; ce n’est pas l’objectif.
  - name: Order Lifecycle Management
    kind: capability
    existing_id: D04.o
    scope: Préparation en brouillon, affermissement, gel, autorisation de traitement, attente/reprise, report, annulation
      et clôture ; mutations structurelles avec simple filiation à examiner sous cette responsabilité élargie.
    limit: CRUD de contenu propre au type reste cohérent avec Handling ; ne pas doubler les responsabilités. Aucun transfert
      des décisions de promesse ou de l’exécution.
  - name: Order Structuring
    kind: capability
    existing_id: D04.n
    scope: Maintenir la composition durable d’un ensemble d’Orders et la cohérence entre ensemble et composants.
    limit: Un objet chapeau n’est pas créé par cette proposition. Une simple trace d’un split ne suffit pas ; une structure
      persistante et un bénéfice propre doivent être décrits.
  - name: Order Archiving
    kind: capability
    scope: Organiser la conservation et la consultation historiques des Orders éligibles, hors de leur usage opérationnel
      courant.
    decomposition_rationale: Responsabilité durable avec éligibilité, conservation des liens et accès à l’historique distincts
      de la terminaison opérationnelle ; pas simple transfert de tables.
    limit: La proposition U352 sous Lifecycle est remplacée par la direction de séparation U357. Aucun sous-comportement systématique
      et aucune durée légale inventée.
  identity_boundary: Une variante achat/vente/retour n’est pas un état librement interchangeable. Des Orders liés peuvent
    représenter les perspectives de parties différentes sans devenir un Order universel.
  migration_if_confirmed: Réutiliser les identifiants des cinq gestions par type en les requalifiant en comportements ; préserver
    leurs descriptions et validations à portée inchangée. Introduire les nouvelles capacités sans réutiliser un identifiant
    retiré. Étudier les relations consommant des capacités devenues comportements. Aucune migration exécutée ici.
