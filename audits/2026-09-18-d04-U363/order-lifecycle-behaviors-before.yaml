    spread: on répartit entre les commandes
  value_sha256:
    split: caa89924a85e542e34cd3bd9ef85e8401426c0e2b395911c557a0330e93836ff
    spread: f227bcf184ceb24927c2330216951557459149157997fc80556359702396d6e5
  context: Spread dans le sens ARun de la discussion U360/U361.
  editorial_explanation: Split transforme la demande en fragments ; Spread répartit des ressources entre demandes. La règle
