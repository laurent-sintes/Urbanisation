  - id: OL-RESCHEDULE
    name: Order Rescheduling
    parent_id: D04.o
    status: proposed
    definition: Appliquer un changement autorisé d’échéance du besoin porté par l’Order et en rendre explicites les effets
      à traiter.
    differentiating_criterion: Mécanisme métier avec effets distincts sur engagements, progression ou terminaison
    decomposition_rationale: Recaler dans le temps un besoin maintenu, sans annuler/recréer systématiquement la commande ni
      confondre les différentes dates.
    example: 'Exemple fictif : Reporter au lundi l’échéance demandée des 40 pièces restantes d’un transfert.'
    boundary: Le choix du meilleur échéancier reste une décision spécialisée ; Promise Management révise la promesse et D06
      adapte les prestations. Reporter ne lève pas une attente.
