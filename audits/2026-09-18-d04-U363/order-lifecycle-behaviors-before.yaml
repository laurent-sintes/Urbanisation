  - id: OL-CANCEL
    name: Order Cancellation
    parent_id: D04.o
    status: proposed
    definition: Retirer de manière autorisée tout ou partie du reste à satisfaire, en préservant les réalisations acquises
      et en signalant les effets aval nécessaires.
    differentiating_criterion: Mécanisme métier avec effets distincts sur engagements, progression ou terminaison
    decomposition_rationale: Mettre fin à une demande devenue inutile sans effacer ce qui a déjà eu lieu ; maîtriser les conséquences
