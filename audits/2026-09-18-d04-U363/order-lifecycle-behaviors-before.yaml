split_spread_U360:
  status: proposed_terminology_and_boundaries
  split: Scinder un Order, une ligne ou une quantité en éléments traitables distinctement, en explicitant identité, filiation,
    quantités et effets. Le marché applique aussi Split aux dates ; Spread n’est pas sa contrepartie normalisée.
  spread_senses:
  - 'Répartir une demande entre des échéances : schedule lines / delivery schedules.'
  - Répartir des quantités entre destinations ou autres axes, à qualifier.
  - 'Distribuer un stock contraint entre demandes selon proportions : spread logic SAP ARun.'
  recommendation: Garder Split avec l’objet explicite ; ne pas nommer un comportement Spread sans complément. Séparer choix
    de la répartition et application de ses effets.
  placement: Mutation de l’Order avec filiation sous Lifecycle élargi selon la direction U357 ; gestion persistante d’une
    composition entre Orders sous Structuring ; affectation de ressources sous Supply Assignment après décisions spécialisées.
    Ni le mot split ni la présence de liens ne suffisent à trancher.
  example: '100 pièces scindées en 60 et 40 : mutation de demande. 150 pièces disponibles pour deux besoins de 100 et 200,
    affectées proportionnellement à hauteur de 50 et 100 : répartition de ressources, sans nécessité de scinder les Orders.'
  market_comparisons:
  - vendor: Oracle
    product: Fusion Cloud Order Management
    element_name: What’s a Split Order Line
    element_type: Fonction produit, verbe descriptif ou stratégie de répartition
    relationship: Appui sémantique
    similarities: Split couvre plusieurs entrepôts, dates ou articles substituts, et peut créer plusieurs lignes et tâches
      de fulfillment.
    differences: Ne signifie pas toujours création de plusieurs commandes autonomes ; la fonction produit combine décisions
      et effets que FLOW sépare.
    source_title: What’s a Split Order Line
    source_url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/26b/fauom/fulfillment-line-splits.html
    source_version: 26B
    source_locator: How Order Management Determines Availability
    consulted_on: '2026-09-18'
    evidence_limits: Oracle ouvert ; passages Microsoft et SAP indexés consultés, page SAP dynamique sans texte à l’ouverture.
      Aucune implémentation Beaumanoir déduite.
    flow_position: 'Conserver Split en précisant l’objet et l’effet. Éviter Spread seul : distinguer échéancement de demande,
      distribution vers destinations et affectation de stock contraint. Le terme ne tranche pas Lifecycle versus Structuring.'
