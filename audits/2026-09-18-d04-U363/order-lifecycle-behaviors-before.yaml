  proposals:
  - id: OL-RELEASE
    name: Order Release
    parent_id: D04.o
    status: proposed
    definition: Autoriser la prise en charge de tout ou partie d’un Order lorsque ses conditions de lancement sont satisfaites.
    differentiating_criterion: Mécanisme métier avec effets distincts sur engagements, progression ou terminaison
    decomposition_rationale: Séparer l’engagement ferme de l’autorisation de mobiliser les opérations ; permettre une libération
      partielle ou conditionnelle.
    example: 'Exemple fictif : Un transfert de 100 pièces devient ferme ; seules 60 sont autorisées à partir, les 40 autres
      attendent.'
    boundary: D06 orchestre les prestations autorisées ; le début physique est un fait d’exécution. Le lancement coordonné
      P11 reste une variante à instruire, pas adopté par extension.
    market_comparisons:
