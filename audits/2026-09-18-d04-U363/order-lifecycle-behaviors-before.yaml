draft_and_structuring_U353_U354:
  status: draft_principle_adopted_details_proposed
  adoption_U354:
    principle: Mode brouillon
    principle_sha256: 991814e916767b546b407bd943e42002106bfe6feaed67781d47989aa0f7a52c
    scope: Principe accepté ; pas de nom anglais ou définition détaillée adoptés.
  draft_proposal:
    parent_id: D04.o
    status: proposed_details
    definition: Permettre de préparer, sauvegarder et reprendre un Order avant sa soumission au traitement opérationnel, en
      rendant explicites les effets autorisés dans cet état.
    benefit: Préparer une demande incomplète ou à vérifier sans déclencher prématurément son traitement.
    boundary: La saisie du contenu reste dans la gestion par type. Brouillon et ordre planifié ne sont pas synonymes ; soumettre
      ne vaut pas toujours affermir ou lancer. Ne pas supposer absence de calcul de disponibilité ou de réservation sans politique
      explicite.
    example: Préparer une commande par copie, corriger quantités et dates, puis la soumettre selon les règles ; aucun nouvel
      engagement repris implicitement de l’original.
  placement_proposal:
  - mechanism: Split / Spread / Merge
    parent_id: D04.n
    reason: Transformations de la structure de la demande ; rattachement déjà décrit dans le catalogue.
