spread_arun_U361:
  status: clarification_sourced_mapping_proposed
  finding: Spread est une stratégie utilisable dans ARun, pas toute opération lancée depuis ARun. ARun peut aussi utiliser
    FIFO.
  distinction: Split transforme une demande en parties ; Spread ARun partage les ressources entre demandes existantes. Un
    résultat peut ensuite conduire à un split, sans identité des deux mécanismes.
  example: 'Illustration simplifiée, hors quotas, arrondis et règles de libération : demandes 100 et 200 ; stock 150 ; prorata
    de 50 % donnant affectations 50 et 100. Les quantités demandées restent 100 et 200.'
  market_comparisons:
  - vendor: SAP
    product: ERP Fashion Management
    element_name: Steps in Order Allocation Run — Allocation
    element_type: Stratégie de répartition dans un processus produit
    relationship: Recouvrement partiel
    similarities: ARun peut affecter le stock selon FIFO ou une répartition proportionnelle fondée sur les quantités demandées
      (spread logic). Le regroupement des besoins est un prérequis au Spread.
    differences: Référence ERP Fashion, sans garantie pour toute édition aATP. ARun est le processus intégré ; Spread une
      de ses stratégies. La répartition ne nécessite pas la création de nouvelles commandes.
    source_title: Steps in Order Allocation Run
    source_url: https://help.sap.com/docs/SAP_ERP_SPV/f48e74ad3b3740bc8c9eaade394a3c1e/3d1df055aa2a6d55e10000000a4450e5.html
    source_version: Édition non relevée dans le passage indexé ; SAP ERP Fashion Management
    source_locator: Requirement Grouping ; Allocation ; Release Rules
    consulted_on: '2026-09-18'
    evidence_limits: Passage primaire indexé consulté, complété par Allocation déjà documenté ELM222. Aucune preuve de configuration
      ou version Beaumanoir.
    flow_position: La règle décide les parts de ressources destinées aux demandes ; Supply Assignment matérialise les liens.
      Le parent précis de la décision FLOW reste à instruire. Ne pas confondre avec Lifecycle/Structuring ni créer une capacité
      Spread.
    status: proposed
    source_refs:
    - U361
    - ELM223
    - CMP132
  correction_of_earlier_wording: Spread employé comme simple voisin de split sous Structuring était trop large ; réserver
    ici spread logic à la citation SAP, et qualifier les répartitions par leur objet.
