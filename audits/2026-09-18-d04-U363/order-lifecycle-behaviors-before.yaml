  - id: OL-CLOSE
    name: Order Closure
    parent_id: D04.o
    status: proposed
    definition: Constater et gouverner la fin du traitement opérationnel d’un Order en explicitant le devenir de tout reliquat.
    differentiating_criterion: Mécanisme métier avec effets distincts sur engagements, progression ou terminaison
    decomposition_rationale: Éviter les commandes durablement ouvertes et les quantités restantes ambiguës ; distinguer satisfaction,
