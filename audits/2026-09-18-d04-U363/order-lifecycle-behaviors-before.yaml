  - id: OL-HOLD
    name: Order Hold & Resume
    parent_id: D04.o
    status: proposed
    definition: Suspendre une progression désignée pour un motif métier puis permettre sa reprise lorsque les conditions de
      levée sont réunies.
    differentiating_criterion: Mécanisme métier avec effets distincts sur engagements, progression ou terminaison
    decomposition_rationale: Maintenir le besoin tout en évitant un traitement prématuré ; préserver la portée des autres
      blocages.
    example: 'Exemple fictif : Un magasin ne peut pas réceptionner : mettre le transfert en attente d’expédition, puis lever
      ce motif lorsque le magasin est prêt.'
    boundary: Une levée n’efface pas les autres blocages et ne constate pas un redémarrage physique. Hold bloque la progression
      ; Freezing protège contre modification.
