        démontrée.
      flow_position: 'U345/C99 : Supply Assignment porte l’application des affectations d’un plan ; décisions spécialisées
        et autres capacités gardent leurs responsabilités. Les recommandations éclairent Simulation & Analysis sans constituer
        un engagement.'
      status: proposed
