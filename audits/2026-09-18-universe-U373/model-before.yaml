- id: D04.o
  revision: 4
  kind: capability
  layer: transactional
  fields:
    name: Order Lifecycle Management
    definition: Gouverner et appliquer les évolutions autorisées du cycle de vie des Orders Supply, avec leur portée, leurs
      conditions et leurs effets sur le reste à satisfaire.
    finality: Savoir ce qui peut progresser, ce qui est bloqué et pourquoi, ainsi que les conditions de reprise ou de fin
      du traitement.
    nature: management
    scope: |-
      Gouverner et appliquer les mutations autorisées d’un Order dans sa préparation, ses engagements et sa progression. Les neuf comportements décrivent des mécanismes combinables, pas neuf états obligatoires : Drafting, Firming, Freezing, Release, Hold & Resume, Rescheduling, Cancellation, Closure et Splitting.

      Le contenu spécifique demeure géré selon Order Type. Le mode brouillon organise la préparation ; le CRUD reste explicite sans quatre comportements artificiels. Distinguer suppression admissible d’un brouillon et annulation du reste engagé. Une copie prépare une nouvelle demande, sans reprendre automatiquement ses garanties.

      Affermir ne libère pas automatiquement, libérer ne constate pas le démarrage physique. Hold bloque une progression ; Freezing limite des modifications. Reporter une échéance ne lève pas une attente. Annuler retire un besoin restant sans effacer les réalisations ; clôturer explique la fin opérationnelle et le reliquat. Archiver est une responsabilité séparée.

      Split coupe une commande ou ses éléments avec filiation et contrôle des quantités. Structuring garde la composition durable entre Orders. Spread ARun répartit les ressources entre commandes : décision des parts et application par Supply Assignment restent hors de cette mutation.

      Exemple fictif : sur un transfert de 100 pièces, 60 sont autorisées et 40 attendent. Reporter les 40 au lundi ne lève pas leur attente. Une scission éventuelle conserve l’origine ; les quantités déjà reçues ne sont pas annulables comme si elles n’avaient jamais existé. L’application d’un plan peut déclencher ces mutations autorisées ; Supply Assignment reste responsable des liens ressources-commandes.

      Conditions et autorités sont propres aux types d’Orders ; automatisation possible. D03 conserve promesses et décisions, D06 les prestations, faits et adaptations d’exécution. Aucun cycle universel aux Supply Orders ou Service Orders ; compensation du processus dans la couche processus.
    decomposition_rationale: Préparation différée, engagement ferme, stabilité face aux optimisations, autorisation, interruption,
      changement d’échéance, retrait du besoin, terminaison et scission modifient chacun les pratiques et responsabilités
      métier. Leurs conditions et effets partiels justifient les mécanismes ; pas une décomposition par bouton, statut technique
      ou interface.
