      Enregistrer l’origine et le contenu applicable, intégrer les modifications autorisées avec leur historique, rendre la situation consultable et rapprocher les réalisations pour déterminer le reste à satisfaire. Les mutations internes, dont le split avec filiation, mobilisent [Order Lifecycle Management](model:D04.o). La composition métier persistante d’un ensemble d’Orders mobilise [Order Structuring](model:D04.n). La conservation historique mobilise [Order Archiving](model:D04.q). Ces responsabilités restent distinctes du contenu propre au type.

      Exemple fictif : 10 pièces doivent être retournées au fournisseur ; 6 sont expédiées et 4 restent à envoyer. L’expédition des 6 ne prouve ni leur réception par le fournisseur ni un avoir financier. Conserver les liens à l’achat ou à la réception d’origine lorsqu’ils sont connus. Mettre le reliquat en attente, en modifier l’échéance ou l’annuler nécessite d’en préciser la portée et l’autorisation. Le traitement physique et le règlement financier ne sont pas déduits du seul statut de l’ordre.

      Les conditions contractuelles restent des références ; cette capacité ne confère pas l’autorité de négocier ou de modifier un Agreement. Priorités, couverture et promesses restent dans Order Promising ; prestations, engagements et faits d’exécution dans [Execution Management](model:D06) et chez les exécutants. Les règles d’imputation, tolérances, autorisations et effets sur les réservations sont à instruire. Les exemples sont fictifs et ne prouvent aucun déploiement.

      Frontière : Avoir financier et accord commercial hors de cette responsabilité.

      U363 : variante terminale d’Order Type ; identifiant historique conservé. Consultation, création, modification, suppression admissible et copie de contenu restent possibles selon les règles de la variante. La suppression d’un brouillon, l’annulation d’une demande engagée et la purge d’une archive sont distinctes.
