- id: D03
  revision: 3
  kind: domain
  layer: transactional
  fields:
    name: Order Promising
    definition: 'Chercher comment satisfaire les [Supply Orders](glossary:TER065) : établir les possibilités de couverture
      en ressources et en dates, arbitrer les solutions et établir puis maintenir les promesses. Les solutions peuvent mobiliser
      les ressources présentes ou attendues et proposer des adaptations lorsque la situation de référence ne suffit pas.'
    finality: Décider comment satisfaire les Orders avec les ressources disponibles ou adaptables.
    scope: |-
      La satisfaction des Orders est la finalité du domaine. ATP apprécie une solution dans les ressources et engagements admissibles ; CTP peut proposer leur adaptation ; PTP compare les scénarios économiquement. Priorités, affectations et échéanciers concourent à la proposition, à la confirmation et à la révision des promesses. Cette lecture ne limite pas D03 à une commande isolée : les arbitrages peuvent porter sur plusieurs commandes et leurs engagements.

      Exemple fictif : déplacer 50 pièces pour satisfaire une commande précise. Le résultat recherché est sa satisfaction, en tenant compte des dates, protections et conséquences sur les autres engagements. [Inventory Optimization](model:D05) peut envisager un transfert semblable pour corriger la répartition du stock : la ressemblance de l’opération n’efface pas la différence de finalité.

      D01 conserve la connaissance du stock, les mouvements, protections et réservations ; D04 gère les Orders et leur progression ; D06 et les services exécutants portent prestations, engagements et faits d’exécution. Proposer un scénario CTP ne crée ni n’affermit automatiquement un Order et ne réalise pas un mouvement. Supply Assignment conserve sa définition actuelle, incluant les besoins prévisionnels : leur articulation détaillée avec les besoins de stock de D05 reste à éprouver, sans réduction implicite de cette portée.

      Promise Management regroupe proposition, confirmation et révision en trois comportements. La satisfaction recherchée maximise une valeur multidimensionnelle selon objectifs et contraintes ; PTP conserve son arbitrage économique spécialisé.
