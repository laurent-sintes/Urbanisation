    name: Supplier Return Management
    definition: 'Gérer les commandes de renvoi de marchandises aux fournisseurs : maintenir les biens, quantités, destinataires
      et conditions de retour applicables, intégrer les évolutions et suivre le reste à retourner.'
    finality: Piloter un retour fournisseur explicite et traçable, distinct de la commande d’achat initiale.
    scope: |-
