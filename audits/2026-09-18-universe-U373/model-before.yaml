- id: D04
  revision: 3
  kind: domain
  layer: transactional
  fields:
    name: Order Management
    definition: Gérer les Orders transactionnels de la Supply selon leur type métier, gouverner leurs mutations, maintenir
      leurs compositions et assurer leur conservation historique, en distinguant contenu, promesse et exécution.
    finality: Disposer de commandes explicites et traçables pour savoir ce qui doit être satisfait, comment la demande est
      organisée et ce qui peut progresser ou reste bloqué.
    scope: 'Quatre capacités : Order Type, Order Lifecycle Management, Order Structuring et Order Archiving. Les cinq variantes
      vente, achat, transfert, retour client et retour fournisseur sont des comportements d’Order Type. Les mécanismes Lifecycle
      sont communs sans imposer un cycle identique. Structuring porte la composition persistante ; Archiving conserve la trace
      historique. Split transforme les commandes ; Spread répartit des ressources entre commandes et relève des décisions
      et de Supply Assignment.'
