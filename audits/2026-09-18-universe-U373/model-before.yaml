- id: D04.p
  revision: 1
  kind: capability
  layer: transactional
  fields:
    name: Order Type
    definition: Gérer les Orders selon leur finalité métier — vente, achat, transfert, retour client ou retour fournisseur
      — en appliquant les informations, règles et résultats propres à chaque variante.
    nature: action
    finality: Conserver une commande exploitable et un reste à satisfaire explicable dans chacune des finalités métier.
    scope: |-
      Enregistrer, rechercher, consulter et modifier le contenu des commandes selon leur type ; supprimer uniquement les enregistrements dont l’état et les liens l’autorisent. Préserver origine, versions et réalisations. Le clonage simple réutilise un contenu pour créer une nouvelle demande ou de nouvelles lignes ; il ne copie pas implicitement les promesses, réservations ou états fermes.

      Le CRUD ne devient pas quatre comportements identiques. Lifecycle gouverne les mutations et leurs autorisations, Structuring la composition persistante entre Orders, Archiving leur conservation historique. Achat et vente peuvent représenter des perspectives distinctes au moyen de commandes liées ; le type n’est pas un état librement interchangeable. Les cinq variantes gardent leurs informations et règles spécifiques, sans cycle universel.
    decomposition_rationale: Les variantes diffèrent par l’engagement, les parties, le sens du flux et le reste à servir,
      recevoir, transférer ou retourner. Ces différences métier justifient les comportements ; le CRUD commun et les mécanismes
      Lifecycle ne sont pas recopiés sous chacun.
