- id: BHV038
  revision: 1
  kind: behavior
  layer: transactional
  fields:
    name: Order Drafting
    definition: Permettre de préparer, sauvegarder et reprendre un Order avant sa soumission au traitement opérationnel, en
      rendant explicites les effets autorisés dans cet état.
    finality: Préparer une demande incomplète ou à vérifier sans déclencher prématurément son traitement.
    scope: |-
      Préparer une commande par copie, corriger quantités et dates, puis la soumettre selon les règles ; aucun nouvel engagement repris implicitement de l’original.

      La saisie du contenu reste dans la gestion par type. Brouillon et ordre planifié ne sont pas synonymes ; soumettre ne vaut pas toujours affermir ou lancer. Ne pas supposer absence de calcul de disponibilité ou de réservation sans politique explicite.

      Mécanisme de préparation différée : sauvegarder et reprendre un contenu incomplet avant soumission. Créer, éditer et retirer un brouillon sont ses opérations ; il n’impose ni validation humaine ni exclusion automatique des calculs de disponibilité. Libellé anglais éditorial ; principe du mode brouillon adopté U354/U363.
