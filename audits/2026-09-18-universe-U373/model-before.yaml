- id: D04.q
  revision: 1
  kind: capability
  layer: transactional
  fields:
    name: Order Archiving
    definition: Organiser la conservation historique des Orders éligibles en dehors de leur usage opérationnel courant, tout
      en préservant leur consultation, leurs versions utiles et leurs liens.
    nature: management
    finality: Permettre la recherche et l’explication d’anciens engagements sans maintenir indéfiniment les commandes dans
      le traitement courant ; maîtriser ce qui reste consultable.
    scope: |-
      Exemple fictif : retrouver une commande d’implantation d’une saison antérieure, ses changements et ses réalisations sans la réintroduire dans les commandes à satisfaire.

      Clôture et archivage sont distincts. Historisation des versions, restauration et réouverture ne sont pas synonymes. Purge définitive soumise à ses règles de conservation et d’éligibilité ; aucun nouveau comportement Purge ni règle juridique ajouté automatiquement.

      Préserver les identifiants, versions utiles et liens aux engagements et réalisations, afin de consulter et expliquer les Orders historiques sans les remettre automatiquement dans le stock de commandes à satisfaire. Définir les conditions d’éligibilité, de conservation et de retrait définitif selon le contexte. Clôture opérationnelle, conservation de versions, archivage et purge ne sont pas synonymes. Aucune durée légale ou architecture technique imposée. Les restrictions de Microsoft sur les commandes intersociétés sont une limite produit, pas une règle FLOW adoptée.
