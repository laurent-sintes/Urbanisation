      similarities: 'Politiques configurées : réservation automatique à la création des lignes de commande ou manuelle ; jalon
        de réservation configurable en production.'
      differences: Pas de preuve dans ce passage d’un choix automatique du jalon de vente selon le stock et la vitesse de
        sortie. Texte primaire indexé consulté ; ouverture directe en erreur 503.
