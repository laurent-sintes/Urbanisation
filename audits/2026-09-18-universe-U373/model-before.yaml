- id: D03.n
  revision: 1
  kind: capability
  layer: transactional
  fields:
    name: Promise Management
    definition: Gérer les propositions et engagements de promesse Supply, leurs confirmations et leurs révisions autorisées,
      avec quantités, dates, conditions et historique.
    nature: management
    finality: Établir et maintenir des engagements Supply explicites et cohérents avec les possibilités retenues.
    decomposition_rationale: 'Distinguer proposition, établissement de l’engagement et réexamen de cet engagement : trois
      façons d’agir avec effets différents, sans multiplier les capacités d’action.'
    scope: 'Trois comportements : proposition sans engagement confirmé, confirmation des quantités et dates, révision lorsque
      la situation évolue. Les décisions ATP/CTP/PTP, priorités et échéancier restent distinctes, ainsi que Supply Assignment
      et Reservation. Exemple fictif : proposer 60 vendredi et 40 lundi, confirmer la première part puis réexaminer la seconde
      après retard fournisseur. Aucune confirmation n’est assimilée à un mouvement physique ni à une réservation automatique.'
