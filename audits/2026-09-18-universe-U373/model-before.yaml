- id: D14.a
  revision: 1
  kind: capability
  layer: transactional
  fields:
    name: Execution Service Catalog Ingestion
    definition: Recevoir l’offre des services exécutants, leurs SLA configurés, conditions et accès, ainsi que leurs évolutions
      depuis les sources maîtresses externes.
    finality: Mettre à disposition une projection de référence exploitable par la qualification, la promesse et l’orchestration.
    nature: action
    scope: |-
      Ingestion du référentiel, dans la continuité du principe des projections Supply. Recevoir les évolutions des services et de leurs accès sans reprendre la maîtrise des données. Consultation et recherche restent en lecture seule pour les consommateurs.

      L’ingestion du catalogue ne reçoit pas à sa place le tracking des opérations et ne transforme pas une évolution du SLA en révision automatique des engagements déjà pris. Maîtres et contrats d’échange seront définis dans les règles de fonctionnement.

      Frontière : SLA, engagement individuel, estimation et résultat distincts ; pas de maître local.

      Exemple fictif : Recevoir service documentaire et accès sollicitation/feedback.
