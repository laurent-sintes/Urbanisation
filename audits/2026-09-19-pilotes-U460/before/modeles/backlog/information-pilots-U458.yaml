    observed: Commandes, confirmation, programmes de livraison et constats de réception sont distingués dans la documentation produit ; le terme bon de commande est employé.
    flow_interpretation: Appui lexical et exemples d’informations utiles ; ni import du module ERP ni équivalence entre document et capacité.
  - url: https://archimate-community.pages.opengroup.org/workgroups/archimate-101/
    observed: Le tutoriel communautaire distingue l’information conceptuelle utile à l’activité et les structures applicatives.
    flow_interpretation: Appui à une description métier transverse ; ne prescrit pas le lien obligatoire fait/document propre à FLOW.
    limit: Tutoriel non normatif et antérieur à ArchiMate 4 ; aucune obligation de couches FLOW n’en est déduite.
  - url: https://pubs.opengroup.org/architecture/archimate4-doc/chap08.html
    limit: Redirection vers authentification ; chapitre non consulté, aucune conclusion nouvelle attribuée à ArchiMate 4.
