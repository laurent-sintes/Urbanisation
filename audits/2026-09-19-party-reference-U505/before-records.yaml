      relationship: Recouvrement partiel
      similarities: Prestations et produits utiles à une intervention.
      differences: Field Service vise l’intervention terrain ; FLOW inclut aussi transport et prestations documentaires.
      flow_position: Savoir quelles prestations l’orchestration peut mobiliser pour répondre aux demandes du Domain. Service
        Catalog décrit les Backing Services et leurs conditions ; les demandes de prestation et leur prise en charge restent
        dans Process Management.
      status: proposed
