  market_inspiration:
    choice: Préciser à quel titre une partie intervient dans une relation ou une opération. Role signifie ici rôle métier,
      distinct d’une habilitation informatique.
    flow_scope: Client, fournisseur, destinataire ou autre responsabilité métier.
    flow_approach: Relier le rôle à la Party et à son contexte.
    synthesis:
    - Microsoft décrit les rôles d’une partie dans un carnet d’adresses partagé. TM Forum rattache une partie et son rôle
      à une demande de service. Microsoft insiste sur la référence réutilisable ; TM Forum sur la relation dans une opération.
    - FLOW retient le sens métier dans ces deux contextes. Un rôle de destinataire ne donne pas automatiquement des droits
      d’accès et ne remplace pas l’identité de la partie.
    examples:
    - title: Illustration FLOW — qui demande, qui reçoit
      situation: Une partie émet la demande de service ; une autre en reçoit le résultat.
      outcome: Les rôles permettent de comprendre leurs responsabilités respectives.
      lesson: Ce sont des rôles métier, pas des profils de connexion.
