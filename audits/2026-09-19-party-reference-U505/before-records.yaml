      approach_summary: Décrire le travail attendu à partir du catalogue.
    market_inspiration:
      choice: Savoir quelles prestations l’orchestration peut mobiliser pour répondre aux demandes du Domain. Service Catalog
        décrit les Backing Services et leurs conditions ; les demandes de prestation et leur prise en charge restent dans
        Process Management.
      flow_scope: Offre de préparation, réception, transport, production documentaire et autres prestations exécutantes mobilisables.
      flow_approach: Décrire les résultats proposés, leurs conditions d’éligibilité et leurs niveaux de service configurés.
      synthesis:
      - TM Forum sépare le catalogue de services de leur commande. Microsoft Field Service utilise aussi des prestations de
        catalogue pour décrire une intervention, dans un périmètre terrain avec ressources et facturation.
      - FLOW conserve Service Catalog et précise que son contenu est l’offre des Backing Services mobilisés par l’orchestration.
        Cette qualification exprime leur rôle dans notre modèle ; les sources ne proposent pas ce même nom pour un catalogue
        Supply.
      - Service Requests porte les demandes de travail du Domain ; Service Catalog décrit les prestations utilisables pour
        y répondre. Une prestation peut produire un document comme réaliser une préparation physique.
      examples:
