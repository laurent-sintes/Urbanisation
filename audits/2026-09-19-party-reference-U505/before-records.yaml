      source_url: https://learn.microsoft.com/en-us/dynamics365/field-service/field-service-architecture
      source_version: Documentation évolutive consultée le 19 septembre 2026
      source_locator: A work order is created ; scheduled ; performed ; reviewed and completed
      consulted_on: '2026-09-19'
      evidence_limits: Document primaire consulté ; rapprochement de concepts, sans preuve de réalisation Beaumanoir.
      element_name: Product catalog / Service
