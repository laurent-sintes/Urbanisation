    element_name: Party
    element_type: Concept documenté par la source primaire
    relationship: Recouvrement partiel
    similarities: Acteur identifiable dans la chaîne.
    differences: La clé d’identification peut avoir un usage combiné sans fusionner les notions FLOW.
    flow_position: Identifier l’acteur qui intervient, indépendamment des rôles qu’il joue. Party représente cette partie
      de référence, reçue depuis son maître externe.
    status: proposed
    source_refs:
    - U477
    - ELM468
    - CMP193
    concept_name: Party
    scope_summary: Acteur identifiable dans la chaîne.
    approach_summary: Distinguer qui intervient du lieu concerné.
  market_inspiration:
    choice: Identifier l’acteur qui intervient, indépendamment des rôles qu’il joue. Party représente cette partie de référence,
      reçue depuis son maître externe.
    flow_scope: Personne ou organisation utile aux opérations.
    flow_approach: Relier ses usages à une identité partagée.
    synthesis:
    - Microsoft rattache plusieurs rôles à une Party ; GS1 distingue les parties des lieux qu’elles occupent ou exploitent.
      Leurs objectifs diffèrent, mais les deux évitent de réduire l’acteur à une seule opération ou adresse.
    - FLOW retient l’acteur comme référence. Il ne fait ni de son rôle de fournisseur une identité séparée, ni de chaque lieu
      une nouvelle partie.
    examples:
    - title: Exemple Microsoft — un acteur, plusieurs rôles
      situation: First Up Consultants apparaît comme client et fournisseur dans l’exemple Microsoft.
      outcome: Les rôles restent attachés à une même partie.
      lesson: Le rôle décrit l’usage de l’identité, pas une organisation supplémentaire.
      source_title: Global address book overview
      source_url: https://learn.microsoft.com/en-us/dynamics365/fin-ops-core/dev-itpro/organization-administration/overview-global-address-book
      source_refs:
      - U477
      - ELM400
      - CMP193
