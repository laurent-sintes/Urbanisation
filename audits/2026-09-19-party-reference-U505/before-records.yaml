- id: D09
  revision: 2
  kind: reference
  fields:
    name: Party / Role
    definition: Recevoir les références des parties et leurs rôles métier, distincts des habilitations RBAC. L’identité sans
      doublon relève du maître externe ; les modèles se relient par identifiants.
    finality: Disposer des identités et rôles de référence nécessaires pour relier les opérations aux bonnes parties.
    mastership: external
    market_comparisons:
    - vendor: Microsoft
      product: Dynamics 365 Finance and Operations
      source_title: Global address book overview
      source_url: https://learn.microsoft.com/en-us/dynamics365/fin-ops-core/dev-itpro/organization-administration/overview-global-address-book
      source_version: Mise à jour du 18 mars 2026
      source_locator: Party roles ; Example
      consulted_on: '2026-09-19'
      evidence_limits: Document primaire consulté ; rapprochement de concepts, sans preuve de réalisation Beaumanoir.
      element_name: Party / Party role
      element_type: Concept documenté par la source primaire
      relationship: Recouvrement partiel
      similarities: Personne ou organisation et ses rôles client, fournisseur…
      differences: Microsoft gère les données centrales ; FLOW en reçoit la projection.
      flow_position: Reconnaître les parties et les rôles qu’elles jouent dans les opérations. Party / Role reçoit une identité
        commune et ses usages métier, sans les confondre avec des droits d’accès.
      status: proposed
      source_refs:
      - U477
      - ELM400
      - CMP193
      concept_name: Party / Party role
      scope_summary: Personne ou organisation et ses rôles client, fournisseur…
      approach_summary: Rattacher plusieurs rôles à une identité partagée.
    - vendor: GS1
      product: GLN Allocation Rules
      source_title: GS1 GLN Allocation Rules Standard
      source_url: https://www.gs1.org/standards/gs1-gln-allocation-rules-standard/current-standard
      source_version: Release 3.0.2, août 2022
      source_locator: §2.1 Use of GLN ; parties and locations ; exemple Dal Giardino
      consulted_on: '2026-09-19'
      evidence_limits: Passages primaires indexés consultés ; ouverture directe bloquée (403). Pas de conformité GS1 déduite
        pour FLOW.
      element_name: Party / Location
      element_type: Concept documenté par la source primaire
      relationship: Recouvrement partiel
      similarities: Identification des acteurs et des lieux.
      differences: Un GLN peut avoir un usage combiné ; FLOW ne déduit pas son modèle métier de la seule clé.
      flow_position: Reconnaître les parties et les rôles qu’elles jouent dans les opérations. Party / Role reçoit une identité
        commune et ses usages métier, sans les confondre avec des droits d’accès.
      status: proposed
      source_refs:
      - U477
      - ELM468
      - CMP193
      concept_name: Party / Location
      scope_summary: Identification des acteurs et des lieux.
      approach_summary: Distinguer qui intervient et où.
    market_inspiration:
      choice: Reconnaître les [parties](glossary:TER046) et les rôles qu’elles jouent dans les opérations. Party / Role reçoit
        une identité commune et ses usages métier, sans les confondre avec des droits d’accès.
      flow_scope: Personnes, organisations, rôles et relations de référence.
      flow_approach: Réutiliser les identifiants du maître externe.
      synthesis:
      - Microsoft montre qu’une même organisation peut être cliente et fournisseur. GS1 distingue l’acteur, le « qui », du
        lieu, le « où » ; les documents éclairent donc deux séparations complémentaires.
      - FLOW conserve une Party distincte de ses rôles et des lieux auxquels elle est liée. Il reçoit cette description ;
        la tenue du carnet d’adresses Microsoft ou l’attribution des clés GS1 ne deviennent pas ses responsabilités.
      examples:
      - title: Exemple Microsoft — First Up Consultants
        situation: Microsoft décrit First Up Consultants avec des rôles de client et de fournisseur.
        outcome: Une identité partagée évite de traiter ces rôles comme deux organisations sans lien.
        lesson: FLOW reçoit les rôles et leur référence commune ; il ne devient pas le maître des coordonnées.
        source_title: Global address book overview
        source_url: https://learn.microsoft.com/en-us/dynamics365/fin-ops-core/dev-itpro/organization-administration/overview-global-address-book
        source_refs:
        - U477
        - ELM400
        - CMP193
