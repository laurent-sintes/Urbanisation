findings:
- id: MKT-F01
  priority: P1
  title: Contrat temporel de promesse et de service insuffisamment explicite
  category: insuffisance_description_interface
  nodes:
  - D03.i
  - D03.l
  - BHV003
  - D06.b
  - D06.e
  - D14.a
  - D13.a
  evidence:
  - ELM-V0-14
  - ELM-V0-15
  - ELM-V0-08
  observation: Aucune occurrence de calendrier, calendar, cut-off ou fuseau dans les champs definition/scope/finality des
    nœuds. BHV003 couvre les délais réels, mais pas le contrat de calcul du temps.
  recommendation: Préciser source des calendriers, jours fermés, heure limite, fuseau, date départ/réception, fraîcheur et
    conduite sur donnée inconnue ; consommer un maître externe.
  acceptance: Un exemple vendredi après cut-off avec fermeture lundi aboutit à une promesse expliquée ; les lecteurs identifient
    responsable et données sans supposer un simple ajout de jours.
  boundary: Aucune nouvelle capacité Calendar Management proposée ; absence de mot ne suffit pas à conclure absence fonctionnelle.
- id: MKT-F02
  priority: P1
  title: PTP, priorités et échéancier restent trop peu définis pour une revue solution
  category: insuffisance_description
  nodes:
  - D03.k
  - D03.l
  - D03.m
  - D03.o
  evidence:
  - ELM-V0-01
  - ELM-V0-05
  - ELM-V0-10
  - ELM-V0-20
  observation: D03.l et D03.m ont un scope limité à un exemple fictif. D03.k expose une frontière et un exemple, sans inputs,
    résultat argumenté, coûts ni gestion des préférences incompatibles.
  recommendation: Expliciter question, entrées, contraintes impératives, préférences, résultat, justification et absence de
    solution. Séparer choix économique PTP et compromis collectif multidimensionnel.
  acceptance: Un même jeu de demandes permet de distinguer priorité, échéancier et arbitrage économique, sans fixer de pondération
    métier par défaut.
  boundary: Le marché justifie les responsabilités, pas une formule unique ni de nouveaux comportements par critère.
- id: MKT-F03
  priority: P1
  title: 'Réservation, affectation, promesse et consommation : contrat commun à rendre éprouvable'
  category: contrat_transverse_a_preciser
  nodes:
  - D02.c
  - D02.e
  - D01.c
  - D01.g
  - D03.i
  - D03.n
  evidence:
  - ELM-V0-11
  - ELM-V0-12
  - ELM-V0-08
  observation: Les responsabilités sont distinctes ; plusieurs relations gardent la formulation engagements opposables selon
    frontière à arbitrer. Le contrat quantitatif de passage vers consommation reste un point V0 à expliciter.
  recommendation: Fixer pour chaque quantité l’effet sur disponibilité, son identité, libération/expiration, consommation
    partielle et échec de confirmation ; distinguer engagement logique et ressources physiques.
  acceptance: Deux canaux promettant la dernière quantité, puis une expédition partielle, ne la comptent ni deux fois disponible
    ni deux fois indisponible.
  boundary: Pas de réservation obligatoire ou taxonomie soft/hard imposée ; tester les mécanismes choisis et leurs limites.
- id: MKT-F04
  priority: P1
  title: 'Changements en cours d’exécution et exceptions : fermer la boucle de responsabilité'
  category: contrat_transverse_a_preciser
  nodes:
  - D04.o
  - D06.f
  - D06.d
  - D07.b
  - D07.c
  - D07.d
  evidence:
  - ELM-V0-06
  - ELM-V0-10
  - ELM-V0-19
  observation: Tracking, adaptation et orchestration sont présents et reliés. Les textes ne forment pas encore un cas de preuve
    complet sur refus répétés, annulation trop tardive et réalisé irréversible.
  recommendation: Éprouver seuil d’arrêt, acteur de résolution, latitude de dérogation, prestation déjà exécutée, correction/compensation
    et révision de promesse.
  acceptance: Un rejet répété n’entraîne pas une boucle indéfinie ; une demande annulée après sortie physique conserve les
    faits et identifie la suite responsable.
  boundary: Pas de nouveau domaine générique Exception Management déduit d’une console éditeur ; les seuils restent à arbitrer.
- id: MKT-F05
  priority: P1
  title: 'Prévisions, assortiment, saison et coûts externes : entrées à rendre visibles'
  category: interface_externe_manquante_ou_peu_valorisee
  nodes:
  - D05.a
  - D05.g
  - D05.e
  - D05.f
  - D03.k
  - D08
  - D12
  - D11
  evidence:
  - ELM-V0-25
  - ELM-V0-26
  - ELM-V0-05
  observation: D05.g consomme un assortiment retenu et D05.f les hypothèses/prévisions ; aucun élément explicitement nommé
    Demand Forecast ou Assortment Plan dans le catalogue. Le coût consommé par PTP n’a pas de contrat dédié lisible.
  recommendation: Décrire dans une vue de contexte les producteurs externes à identifier, version/horizon/maille, données
    absentes et retours vers eux ; ne pas attribuer de maître sans preuve.
  acceptance: Un expert peut dire d’où viennent besoins, assortiment et coûts, et distinguer prévision, engagement fournisseur
    et demande ferme sans ajouter Demand Planning à FLOW.
  boundary: Finance, prévision commerciale, assortiment et saison ne deviennent pas de nouveaux domaines par comparaison éditeur.
- id: MKT-F06
  priority: P1
  title: 'Retours : interface admission/remboursement/remplacement à expliquer'
  category: interface_externe_peu_valorisee
  nodes:
  - D04.l
  - D04.m
  - D05.i
  - D07.c
  - D06.d
  - BHV053
  - BHV055
  - BHV056
  evidence:
  - ELM-V0-07
  - ELM-V0-21
  - ELM-V0-23
  observation: Les parcours et décisions logistiques sont riches ; les textes excluent explicitement autorisation commerciale,
    remboursement et remplacement client. Ces exclusions doivent déboucher sur des interfaces expliquées.
  recommendation: Présenter l’origine de l’autorisation et les faits/quantités transmis aux responsables des suites commerciales/financières
    ; distinguer réparation même bien et remplacement.
  acceptance: Un retour partiellement accepté puis partiellement renvoyé au client ne vaut pas remboursement total ; responsable
    et événement justificatif sont identifiés.
  boundary: Aucun domaine Finance ni remboursement ajouté à Return Disposition Decision ; aucune pratique Sarenza supposée.
- id: MKT-F07
  priority: P2
  title: 'Fashion et B2B : compléter les cas de preuve, pas multiplier les capacités'
  category: scenario_de_completude
  nodes:
  - D05.g
  - D05.e
  - D05.c
  - D04.n
  - D04.o
  - D04.i
  - D04.j
  - BHV039
  - BHV069
  evidence:
  - ELM-V0-03
  - ELM-V0-16
  - ELM-V0-24
  - ELM-V0-26
  observation: Tailles, couleurs, conditionnements, assortiment utile, intercompany et complétude sont déjà mentionnés. La
    fin de saison et la synchronisation de la chaîne B2B nécessitent une démonstration transversale.
  recommendation: Éprouver pack indivisible, assortiment incomplet, reliquat de fin de saison, livraisons groupées et changement
    d’Order intercompany ; préciser intention de chaque apport.
  acceptance: Le cas distingue implantation, réassort, redistribution et affectation ; il identifie la demande non satisfaite
    à la maille taille/ligne sans accord implicite sur les règles.
  boundary: La final allocation éditeur n’est pas automatiquement la Stock Consolidation FLOW ; la frontière doit être décidée
    au cas métier.
- id: MKT-F08
  priority: P2
  title: Capacité opérationnelle disponible et concurrence à éprouver
  category: contrat_transverse_a_preciser
  nodes:
  - D06.b
  - D06.e
  - D07.b
  - D03.i
  - D03.o
  - D05.f
  evidence:
  - ELM-V0-08
  - ELM-V0-20
  - ELM-V0-22
  - ELM-V0-24
  observation: D06.b distingue correctement plafond, charge et disponible communiqué et exclut une réservation implicite ;
    la concurrence de plans utilisant un même créneau reste à démontrer.
  recommendation: Préciser qui atteste et engage la capacité, avec unité, créneau, fraîcheur et réponse de prise en charge
    ; signaler conditionnel ou inconnu.
  acceptance: Deux décisions consommant simultanément un créneau limité ne confondent pas information de capacité et engagement
    confirmé.
  boundary: Ne pas inventer Capacity Reservation dans FLOW si l’engagement reste chez l’exécutant ; identifier cette dépendance
    externe.
- id: MKT-F09
  priority: P1
  title: Comparaisons marché des fiches trop inégales pour la V0
  category: valorisation_preuve
  nodes:
  - D03.i
  - D03.k
  - D03.l
  - D03.m
  - D03.n
  - D02.b
  - D02.c
  - D05.d
  - D06.b
  evidence:
  - ELM-V0-01
  - ELM-V0-05
  - ELM-V0-09
  - ELM-V0-11
  - ELM-V0-12
  - ELM-V0-14
  observation: Ces capacités n’ont pas de fields.market_comparisons dans le modèle lu alors que l’audit dispose de rapprochements
    précis. Cela mesure une documentation locale, jamais une absence marché.
  recommendation: Après revue, reporter les rapprochements utiles et leurs limites dans les fiches selon U311 ; conserver
    les correspondances proposées tant qu’elles ne sont pas validées.
  acceptance: Chaque fiche prioritaire montre au moins un appui pertinent, sa différence avec FLOW et sa date ; aucune étiquette
    validée ou réalisée déduite.
  boundary: Cet audit écrit une annexe isolée ; il ne modifie pas les champs modèle ni les registres MKT/ELM/CMP existants.
