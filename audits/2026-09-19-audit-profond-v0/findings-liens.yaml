market_sources:
- id: LNK-MKT-01
  title: ArchiMate 101 — Relationships between systems
  owner: The Open Group ArchiMate Community
  url: https://archimate-community.pages.opengroup.org/workgroups/archimate-101/
  consulted_on: '2026-09-19'
  edition: Tutoriel évolutif ; page mise à jour le 2026-05-26
  locator: Sharing information money goods ; Temporal or causal relationship ; Dependencies between systems
  observed: Distingue échanges, précédence temporelle ou causale et fourniture de fonctionnalité ; les orientations ne sont pas automatiquement identiques.
  comparison: Appui méthodologique à U398/U399 ; permet de préserver needs comme dépendance consommateur vers fournisseur tout en explicitant résultat et conditions.
  limit: Ni norme adoptée par FLOW ni preuve de flux métier installé ; aucune équivalence de maille avec les capacités et comportements FLOW.
- id: LNK-MKT-02
  title: Set up consignment
  owner: Microsoft
  url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/inventory/consignment
  consulted_on: '2026-09-19'
  edition: Documentation évolutive Dynamics 365 Supply Chain Management ; page mise à jour le 2026-05-06
  locator: Consignment replenishment orders ; Inventory ownership change journal
  observed: Distingue demande d’apport, réception en propriété fournisseur et changement ultérieur de propriété ; le journal de changement produit des achats dans le scénario documenté.
  comparison: Confirme l’intérêt de relier les responsabilités déjà présentes dans FLOW en gardant réception et acquisition distinctes.
  limit: Le scénario documentaire porte notamment une consommation de production ; pas preuve d’une règle retail universelle, d’un transfert à chaque vente ni d’un déploiement Beaumanoir.
- id: LNK-MKT-03
  title: Release to warehouse
  owner: Microsoft
  url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/warehousing/release-to-warehouse-process
  consulted_on: '2026-09-19'
  edition: Documentation évolutive Dynamics 365 Supply Chain Management ; aucune version produit unique relevée
  locator: Release to warehouse process ; Manual release to the warehouse ; relations aux shipments loads et work
  observed: Relie explicitement la libération des lignes d’Order à la formation de shipments et travaux ; les étapes automatiques dépendent de la configuration.
  comparison: Appui à une interaction lisible entre autorisation et prestations. FLOW garde une frontière plus abstraite entre Lifecycle, orchestration et réalisation.
  limit: Ne justifie pas d’importer waves, loads ou mécanismes Microsoft comme capacités FLOW ; ne prescrit pas de lancement simultané ni de workflow universel.
