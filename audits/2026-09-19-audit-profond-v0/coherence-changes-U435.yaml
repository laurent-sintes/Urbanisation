- target: BHV060
  field: fields.scope
  before: |-
    Attente de prestation et constat de réalisation, au lieu d’un apport d’articles à recevoir.

    Exemple fictif : commande de réparation de 50 pièces auprès d’un prestataire.

    D04 porte l’achat ; D06 sollicite, orchestre et suit les services via les Service Orders. Pas de Purchase Order imposée pour chaque appel de service ; comptabilité et négociation contractuelle hors périmètre. Extension explicite de la définition actuelle centrée sur les biens.

    Les mutations communes mobilisent [Order Lifecycle Management](model:D04.o), la composition [Order Structuring](model:D04.n) et la conservation [Order Archiving](model:D04.q). Aucune négociation de contrat, réalisation physique ni fonction comptable reprise par ce comportement. Les exemples ne prouvent aucune pratique installée.
  after: |-
    Attente de prestation et constat de réalisation, au lieu d’un apport d’articles à recevoir.

    Exemple fictif : commande de réparation de 50 pièces auprès d’un prestataire.

    D04 porte l’achat ; D06 sollicite, orchestre et suit les services via les Service Orders. Pas de Purchase Order imposée pour chaque appel de service ; comptabilité et négociation contractuelle hors périmètre. Purchase Order couvre les biens et les prestations depuis U391.

    Les mutations communes mobilisent [Order Lifecycle Management](model:D04.o), la composition [Order Structuring](model:D04.n) et la conservation [Order Archiving](model:D04.q). Aucune négociation de contrat, réalisation physique ni fonction comptable reprise par ce comportement. Les exemples ne prouvent aucune pratique installée.
  justification:
  - 'U391 : définition courante de Purchase Order inclut les prestations.'
- target: BHV063
  field: fields.scope
  before: |-
    Le contrat fixe l’événement ; Purchase Order et finance portent leurs suites. Aucun automatisme vente = acquisition universel.

    Exemple fictif : Vingt pièces vendues deviennent acquises au fournisseur selon les conditions convenues ; les autres restent consignées.

    D04 porte les demandes, leur résultat attendu et Lifecycle ; D03 travaille le carnet, ses décisions, Structuring et Archiving ; D05 optimise le stock, D01 conserve ses faits/régimes et D06 orchestre les services. Ces capacités restent mobilisables et les opérations utiles doivent être expliquées dans chaque contexte métier.

    Les comportements ne sont ni une séquence obligatoire ni tous exclusifs. Intercompany est un axe de relation commerciale ; les autres parcours décrivent principalement le mode de satisfaction. Identifier les quantités concernées et ne pas additionner des stocks ou attendus deux fois.

    Les modalités de paiement, autorisations, tolérances et échéances contractuelles restent des règles à préciser selon le contexte. Cet exemple n’établit aucune pratique installée chez Beaumanoir.
  after: |-
    Le contrat fixe l’événement ; Purchase Order et finance portent leurs suites. Aucun automatisme vente = acquisition universel.

    Exemple fictif : Vingt pièces vendues deviennent acquises au fournisseur selon les conditions convenues ; les autres restent consignées.

    D04 porte les demandes, leur résultat attendu et Lifecycle ; D03 travaille le carnet, ses décisions, Structuring et Archiving ; D05 optimise le stock, D01 conserve ses faits/régimes et D06 orchestre les services. Ces capacités restent mobilisables et les opérations utiles doivent être expliquées dans chaque contexte métier.

    Les comportements ne sont ni une séquence obligatoire ni tous exclusifs. Les comportements distinguent le transfert de propriété à la consommation, le transfert à une échéance contractuelle et la sortie autorisée de la consignation ou de la détention. Identifier les quantités concernées et ne pas additionner des stocks ou attendus deux fois.

    Les modalités de paiement, autorisations, tolérances et échéances contractuelles restent des règles à préciser selon le contexte. Cet exemple n’établit aucune pratique installée chez Beaumanoir.
  justification:
  - 'U401 : critères déjà adoptés des trois comportements de consignation ; phrase de vente hors contexte retirée.'
