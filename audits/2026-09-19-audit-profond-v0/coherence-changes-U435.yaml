changes:
- target: BHV045
  field: fields.scope
  before: |-
    Exemple fictif : Le plan affecte 60 pièces présentes et 40 attendues à une commande. Si une ressource manque, expliquer l’écart sans substituer silencieusement un autre plan.

    Un plan peut prescrire un complément avec préservation ou une réaffectation : les trois comportements sont combinables, sans séquence imposée. Restituer les écarts entre les affectations prévues et appliquées ; un écart peut appeler une nouvelle décision. Aucune transaction atomique de tout le plan ou validation humaine systématique n’est imposée.

    Les décisions spécialisées choisissent les affectations ; Supply Assignment matérialise leurs résultats. Une affectation ne confirme pas seule une promesse et ne réserve pas implicitement le stock. Respecter les restrictions applicables de [Order Freezing](model:BHV037), les réservations et les engagements. Modifier le contenu, l’état ou la structure d’un Order mobilise les responsabilités D04 ; D06 conserve l’exécution. API, batch, écran, unité et masse restent des modalités, sans comportement supplémentaire. Les exemples sont fictifs ; les règles d’exception et contrats détaillés restent à éprouver.
  after: |-
    Exemple fictif : Le plan affecte 60 pièces présentes et 40 attendues à une commande. Si une ressource manque, expliquer l’écart sans substituer silencieusement un autre plan.

    Un plan peut prescrire un complément avec préservation ou une réaffectation : les trois comportements sont combinables, sans séquence imposée. Restituer les écarts entre les affectations prévues et appliquées ; un écart peut appeler une nouvelle décision. Aucune transaction atomique de tout le plan ou validation humaine systématique n’est imposée.

    Les décisions spécialisées choisissent les affectations ; Supply Assignment matérialise leurs résultats. Une affectation ne confirme pas seule une promesse et ne réserve pas implicitement le stock. Respecter les restrictions applicables de [Order Freezing](model:BHV037), les réservations et les engagements. Modifier le contenu ou l’état d’un Order mobilise les responsabilités D04 ; modifier sa structure mobilise Order Structuring dans D03. D06 conserve l’exécution. API, batch, écran, unité et masse restent des modalités, sans comportement supplémentaire. Les exemples sont fictifs ; les règles d’exception et contrats détaillés restent à éprouver.
  justification:
  - 'U417/U420 : Structuring appartient à D03 ; Lifecycle et intentions restent D04.'
- target: BHV046
  field: fields.scope
  before: |-
    Exemple fictif : Sur 100 pièces demandées, conserver les 70 déjà affectées et rechercher les 30 restantes.

    Préserver l’existant est la politique de ce traitement ; cela ne crée pas un gel durable de chaque Order. Ce mécanisme vise le reliquat, sans promettre une stratégie technique de recalcul incrémental, RETE ou traitement par API. Si une affectation conservée devient irréalisable, rendre l’exception visible ; sa révision relève d’un arbitrage et du mécanisme de réaffectation. La préservation ne garantit pas la présence physique de la ressource.

    Les décisions spécialisées choisissent les affectations ; Supply Assignment matérialise leurs résultats. Une affectation ne confirme pas seule une promesse et ne réserve pas implicitement le stock. Respecter les restrictions applicables de [Order Freezing](model:BHV037), les réservations et les engagements. Modifier le contenu, l’état ou la structure d’un Order mobilise les responsabilités D04 ; D06 conserve l’exécution. API, batch, écran, unité et masse restent des modalités, sans comportement supplémentaire. Les exemples sont fictifs ; les règles d’exception et contrats détaillés restent à éprouver.

    Nommage : libellé descriptif FLOW ; pas de terme unifié du marché démontré.
