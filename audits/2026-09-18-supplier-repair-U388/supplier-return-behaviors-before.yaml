id: SUPPLIER-RETURN-BEHAVIORS-U386
status: integrated_U387
source_refs:
- U386
- ELM233
- CMP144
- U387
capability_id: D04.m
proposed_definition: Prendre en charge les retours de marchandises aux fournisseurs et suivre leurs suites attendues, selon
  les accords applicables, en distinguant renvoi, remplacement et règlement financier.
decomposition_rationale: Le retour sans remplacement éteint l’attente de marchandises au titre des quantités reprises ; le
  retour avec remplacement conserve un apport attendu. Cette différence change le suivi des quantités, des dates et des engagements
  aval. Elle justifie deux parcours métier, indépendamment des motifs du retour et des interfaces.
proposals:
- id: SR-P01
  name: Return for Credit
  status: integrated_U387
  parent_id: D04.m
  definition: Prendre en charge un retour fournisseur donnant lieu à un avoir ou remboursement attendu, sans remplacement
    des marchandises retournées.
  mechanism: Suivre le renvoi et son acceptation, matérialiser l’absence de remplacement attendu pour les quantités concernées
    et relier les références du règlement financier géré ailleurs.
  benefit: Éviter de compter un apport de remplacement inexistant dans les stocks futurs ou de rouvrir à tort un reste à recevoir.
  example: 'Exemple fictif : 100 pièces invendues sont reprises en fin de saison contre avoir. Elles sortent du stock ; aucun
    arrivage de remplacement n’est attendu pour ces 100 pièces.'
  boundary: Accord de reprise consommé, non négocié ici ; finance émet, comptabilise et rapproche l’avoir. Retour expédié,
    accepté et financièrement réglé restent distincts. Ne pas confondre avec Credit only côté client, qui peut ne comporter
    aucun retour physique.
  node_id: BHV055
- id: SR-P02
  name: Return for Replacement
  status: integrated_U387
  parent_id: D04.m
  definition: Prendre en charge un retour fournisseur associé à un remplacement attendu, en conservant les liens entre marchandises
    renvoyées et apports de remplacement.
  mechanism: Suivre les quantités et dates de remplacement convenues, leurs révisions et leurs réceptions via Purchase Order
    ; rapprocher sortant et entrant sans les compter deux fois.
  benefit: Rendre visible le besoin de remplacement restant et ses conséquences possibles sur les promesses, sans confondre
    expédition du retour et satisfaction du besoin.
  example: 'Exemple fictif : 20 pièces défectueuses sont renvoyées. Le fournisseur doit les remplacer ; 12 arrivent et 8 restent
    attendues.'
  boundary: Purchase Order porte l’apport attendu ; le marché utilise selon le produit une nouvelle commande liée ou le rétablissement
    d’un attendu sur la commande initiale. Aucun choix documentaire imposé. La date convenue ne vaut pas réception, ni disponibilité
    opposable automatique pour ATP.
  node_id: BHV056
conditional_candidate:
  name: Return for Repair
  status: boundary_to_review
  definition: Prendre en charge l’envoi d’un bien au fournisseur pour réparation puis sa récupération, en préservant son identité
    et l’attendu de restitution.
  benefit: Distinguer retour du même bien réparé et fourniture d’un autre produit de remplacement.
  issue: Si le fournisseur reprend le bien au titre de son obligation d’origine, le rattachement à Supplier Return est plausible.
    Si une prestation est achetée à un réparateur, Purchase Order et les Service Orders D06 peuvent porter le mécanisme. Le
    seul lieu physique fournisseur ne tranche pas la responsabilité.
  recommendation: Conserver comme candidat documenté sans le créer sous Supplier Return avant clarification du périmètre.
  source_refs:
  - ELM233
  - CMP144
combination: Un même retour peut associer avoir pour certaines quantités et remplacement pour d’autres. Pas de comportement
  autonome pour cette combinaison partielle.
shared_functions:
- Référence à l’achat, à la réception et au retour client lorsque connus.
- Autorisation de retour fournisseur/RMA selon le cas ; aucune obligation universelle de document.
- Quantités, dates, destinataire, avancement et preuves de réception.
- Mutations par Lifecycle, composition par Structuring, conservation par Archiving ; exécution D06 et stocks D01.
not_behaviors:
- Défaut, erreur de livraison, excédent et fin de saison sont des motifs ; ils ne suffisent pas seuls à justifier un parcours
  différent.
- Saisie, émission, consultation, annulation et traitement en masse restent fonctions ou modalités.
- La compensation financière sans renvoi physique ne crée pas un flux de retour fictif.
naming: Return for Credit reprend le vocabulaire Oracle ; Return for Replacement est une formulation explicite cohérente avec
  replacement delivery SAP et replacement purchase order Microsoft. Aucun catalogue universel de comportements revendiqué.
