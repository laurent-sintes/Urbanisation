- id: ELM484
  mkt: MKT68
  vendor: Oracle
  product: Oracle Reference Architecture — Information Management
  title: ORA Information Management
  url: https://www.oracle.com/technetwork/topics/entarch/oracle-ra-info-mgmt-r3-1-1980395.pdf
  version: Release 3.1, juillet 2013, E26368-03
  locator: §2.3.4, pages imprimées 2-3/2-4 ; §6.3.3.4.3, pages 6-49/6-50
  finding: Authoritative Data réunit master et reference data ; le Consolidated Hub reçoit les données et laisse les sources
    en contrôle.
  interpretation: Appui au concept, pas prescription de sept références Supply. Reference Data seul possède ici le sens étroit
    de classifications.
  evidence_limits: Architecture historique ; aucune offre OMS actuelle ni compréhension du nom par des clients démontrée.
  consulted_on: '2026-09-21'
  status: consulted_primary
  reuse_limits: Synthèse sélective et liens ; aucune reproduction substantielle.
- id: ELM485
  mkt: MKT67
  vendor: EDM Council
  product: CDMC
  title: 'CDMC Information Model: Controls, Tests and Mappings'
  url: https://edmcouncil.org/wp-content/uploads/2023/02/CDMC-Information-Model-Controls-Tests-Mappings-V1.1.pdf
  version: Version 1.1, octobre 2022
  locator: 'Contrôle 3, pages 13–14 : Authoritative Indication, Authority'
  finding: Qualification explicite des sources et points de fourniture faisant autorité.
  interpretation: L’autorité locale se qualifie ; elle ne découle pas automatiquement de la réception d’une copie.
  evidence_limits: Modèle de contrôle de gouvernance ; ni taxonomie Supply ni conformité FLOW revendiquée.
  consulted_on: '2026-09-21'
  status: consulted_primary
  reuse_limits: Synthèse sélective et liens ; aucune reproduction substantielle.
- id: ELM259
  mkt: MKT43
  vendor: OMG
  product: Decision Model and Notation
  title: Decision Model and Notation (DMN)
  url: https://www.omg.org/dmn/
  version: Présentation publique évolutive, sans édition normative utilisée
  locator: Precise specification of business decisions and business rules
  finding: DMN spécifie les décisions et règles métier et complète BPMN/CMMN.
  interpretation: Une approche par décisions est compatible avec des références communes ; elle ne fixe pas leur découpage.
  evidence_limits: Aucun moteur choisi ; aucune structure de stockage ou catalogue de données prescrit.
  consulted_on: '2026-09-21'
  status: consulted_primary
  reuse_limits: Synthèse sélective et liens ; aucune reproduction substantielle.
- id: ELM527
  mkt: MKT36
  vendor: Camunda
  product: Camunda 8
  title: Decision requirements graph
  url: https://docs.camunda.io/docs/components/modeler/dmn/decision-requirements-graph/
  version: Version 8.9 affichée
  locator: Introduction ; Decision ; Input data ; Knowledge source
  finding: Le graphe distingue décisions, données d’entrée et sources de connaissance ; la logique est portée par la décision.
  interpretation: Les données de référence peuvent alimenter les décisions ; leur gestion ne se confond pas avec la définition
    de toute règle.
  evidence_limits: Documentation d’un moteur, distincte de la norme OMG ; ni sept référentiels ni adoption DMN déduits.
  consulted_on: '2026-09-21'
  status: consulted_primary
  reuse_limits: Synthèse sélective et liens ; aucune reproduction substantielle.
