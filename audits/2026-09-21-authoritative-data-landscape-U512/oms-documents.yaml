audit: Authoritative Data — landscape U512
scope: Deux OMS ; cinq documents primaires effectivement ouverts. Lecture documentaire, sans vérification de disponibilité
  commerciale ni preuve de déploiement.
consulted_on: '2026-09-21'
documents:
- id: ELM522
  mkt: MKT14
  vendor: Microsoft
  product: Dynamics 365 Intelligent Order Management
  title: Data management
  url: https://learn.microsoft.com/en-us/dynamics365/intelligent-order-management/data-management
  version: Documentation en ligne ; version produit non précisée
  source_updated_at: '2026-01-30'
  consulted_on: '2026-09-21'
  locator: Introduction ; System data ; Master data (lignes 31-51 du relevé web)
  finding: IOM peut fonctionner avec ou sans master data locale. Un ERP peut être maître des produits ou comptes ; certaines
    commandes portent assez d'informations client et peuvent utiliser des produits saisis dans les lignes sans catalogue local.
    Des écrans et imports permettent aussi d'administrer ces données.
  similarities: Étaye la distinction FLOW entre autorité d'entreprise externe et données utiles à l'orchestration.
  differences: La conservation d'une liste locale de produits ou comptes dépend du parcours ; ce document ne présente pas
    sept référentiels distincts.
  evidence_limits: N'établit ni absence de toute administration locale ni taxonomie générique Party / Role, Product Catalog,
    Assortment ou Agreement. Aucun déploiement Beaumanoir documenté.
  status: consulted_primary
  reuse_limits: Synthèse sélective des sections citées ; aucun extrait intégral. Ne pas généraliser cette possibilité à toutes
    les configurations ni à tous les OMS.
- id: ELM523
  mkt: MKT14
  vendor: Microsoft
  product: Dynamics 365 Intelligent Order Management — Fulfillment and Returns Optimization
  title: Fulfillment and Returns Optimization provider overview
  url: https://learn.microsoft.com/en-us/dynamics365/intelligent-order-management/fulfillment-returns-optimization
  version: Documentation en ligne ; version produit non précisée
  source_updated_at: '2026-01-28'
  consulted_on: '2026-09-21'
  locator: Introduction ; Sources ; Source lists ; Constraints ; Strategies ; Activating and deactivating a fulfillment source
  finding: Le moteur lit dans Dataverse des sources de fulfillment, listes, contraintes et stratégies. Les sources représentent
    notamment entrepôts, magasins, fournisseurs livrant directement et sites virtuels ; elles peuvent être créées, modifiées,
    enrichies d'horaires et activées ou désactivées localement.
  similarities: Correspondance avec les données de Fulfillment Network nécessaires aux décisions d'orchestration.
  differences: Les objets sont réunis dans les réglages de fulfillment. Les stratégies et contraintes relèvent aussi des politiques
    de décision ; elles ne constituent pas automatiquement un référentiel d'accords.
  evidence_limits: Les listes de sources ne prouvent pas un Assortment de produits. Le document ne justifie pas sept référentiels
    ni une capacité par objet de configuration.
  status: consulted_primary
  reuse_limits: Synthèse sélective des concepts et opérations utiles au landscape ; ne pas reproduire les procédures ni importer
    la taxonomie produit telle quelle dans FLOW.
- id: ELM524
  mkt: MKT14
  vendor: Microsoft
  product: Dynamics 365 Intelligent Order Management — fulfillment optimization engine
  title: Call the Intelligent Order Management Fulfillment optimization engine (DOM) via API
  url: https://learn.microsoft.com/en-us/dynamics365/intelligent-order-management/calling-intelligent-fulfillmen-optimization-engine
  version: 'Fonction annoncée depuis avril 2023 ; prérequis de la page : version 1.0.0.6035'
  source_updated_at: '2026-01-30'
  consulted_on: '2026-09-21'
  locator: Introduction ; Prerequisites ; Functionality description
  finding: Une application externe peut appeler le moteur avec adresse, produits et quantités pour obtenir un plan de fulfillment.
    Les options de transport associent paramètres locaux, calendriers et ramasses, données produit et appel à l'API FedEx.
  similarities: Correspondance partielle avec Fulfillment Network et les conditions des prestations mobilisables dans un Backing
    Service Catalog.
  differences: La page décrit un service d'optimisation et des configurations transport ciblées, pas un catalogue générique
    de Backing Services.
  evidence_limits: La présence d'une API externe ne démontre pas l'absence d'administration. La version citée est celle du
    prérequis documentaire, pas une vérification de la dernière version commercialisée.
  status: consulted_primary
  reuse_limits: Synthèse sélective ; ne pas assimiler une configuration transport à un catalogue universel de prestations,
    ni reprendre les exemples de payload comme modèle métier.
- id: ELM525
  mkt: MKT23
  vendor: IBM
  product: Sterling Order Management System Software
  title: External system integration overview
  url: https://www.ibm.com/docs/en/order-management-sw/10.0.0?topic=systems-external-system-integration-overview
  version: 10.0.0
  source_updated_at: non affiché
  consulted_on: '2026-09-21'
  locator: Introduction ; Triggering data synchronization
  finding: Sterling échange avec les systèmes externes des informations de commandes, disponibilités, produits et clients.
    La synchronisation peut être quasi immédiate, à la demande ou par lot.
  similarities: Étaye l'alimentation d'un OMS depuis des systèmes externes pour des sujets comparables à Product Reference
    et Party / Role.
  differences: La documentation d'intégration ne définit pas les frontières d'autorité des objets ni une décomposition de
    capacités.
  evidence_limits: Une intégration de produits et clients ne prouve ni leur maîtrise externe exclusive ni l'absence de cycle
    de vie ou d'administration dans Sterling.
  status: consulted_primary
  reuse_limits: Synthèse sélective du mécanisme d'intégration ; ne pas convertir une synchronisation disponible en preuve
    de projection exclusive ou de réalisation installée.
- id: ELM526
  mkt: MKT23
  vendor: IBM
  product: Sterling Order Management System Software
  title: The organization's roles and participant associations
  url: https://www.ibm.com/docs/en/order-management-sw/10.0.0?topic=organization-organizations-roles-participant-associations
  version: 10.0.0
  source_updated_at: non affiché
  consulted_on: '2026-09-21'
  locator: Buyer ; Carrier ; Enterprise ; Node ; Seller
  finding: Une organisation peut porter plusieurs rôles ; les nœuds représentent des lieux physiques. Les transporteurs configurent
    leurs services ; les entreprises configurent règles et préférences de fulfillment ; les vendeurs configurent notamment
    paiement et prix.
  similarities: Correspondances partielles avec Party / Role, Fulfillment Network et les prestations d'un Backing Service
    Catalog.
  differences: Sterling rassemble lieux et rôles dans le modèle de participants ; le découpage ne reproduit pas les sept sujets
    FLOW.
  evidence_limits: Les règles de paiement et prix ne suffisent pas à établir un référentiel Agreement. Le document n'atteste
    pas le terme Backing Service Catalog ni un découpage marché consensuel.
  status: consulted_primary
  reuse_limits: Synthèse sélective des responsabilités décrites ; conserver la distinction entre objets de configuration d'un
    produit et capacités métier FLOW.
access_limits:
