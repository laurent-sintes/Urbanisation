  U488:
    source: connaissance/01-contributions-utilisateur.md#U488
    verbatim: Oui, Service Catalog, ce sont les Backing Services appelés par l'orchestration
    recorded_scope: Confirme le rôle de Service Catalog comme catalogue des Backing Services mobilisés par l’orchestration
      pour réaliser les demandes. Cette offre de prestations reste distincte de l’offre de prises en charge du Domain exprimée
