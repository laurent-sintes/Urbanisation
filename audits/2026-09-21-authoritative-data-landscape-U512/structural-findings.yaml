      de capacité, aucune restriction aux seuls services logiciels. La recherche de nom de D04 sous U487 reste ouverte.
  U497:
    source: connaissance/01-contributions-utilisateur.md#U497
    verbatim: Il n'y avait pas que ça comme modif. Il y avait aussi les backing services
    recorded_scope: 'Corrige la portée trop étroite annoncée après U496 : reprendre aussi le volet U488/U489 sur les Backing
      Services décrits par Service Catalog et les Backing Service Orders adressés aux exécutants. Actualiser les fiches et
      le glossaire correspondants pour distinguer ces prestations des demandes métier Service Requests. La restriction de
      U496 aux seules modifications de D04 ne s’applique donc plus à ce volet. Les identifiants, rattachements, responsabilités
      et noms natifs des sources restent préservés ; aucune nouvelle Area, release ou capacité dérivée automatiquement.'
