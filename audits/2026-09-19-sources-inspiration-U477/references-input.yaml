- id: D07.b
  kind: capability
  parent: D06
  family: D06
  fields:
    name: Service Order Management
    definition: 'Gérer les demandes de prestation adressées aux exécutants et leur cycle de vie : émission, acceptation ou
      refus, modification, annulation et clôture, selon le service.'
    finality: Tenir les demandes de prestation, leur prise en charge et leurs évolutions de façon explicite et traçable.
    nature: management
    scope: |-
      Tenir ce qui est demandé à un exécutant, ce qu’il accepte de réaliser et les évolutions de cette prise en charge. L’émission d’une demande, son acceptation et sa réalisation restent distinctes. Les opérations possibles dépendent du service et de son état ; aucun cycle universel ni acceptation systématiquement différée n’est imposé.

      Exemple : demander à l’entrepôt de préparer 100 colis avant 16 h ; enregistrer l’acceptation, le refus ou une autre échéance proposée ; tenir ensuite une demande de modification ou d’annulation et la réponse correspondante. Le tracking renseigne en parallèle la préparation commencée, les 60 colis prêts ou le retard annoncé.

      Requirements Decision détermine les prestations nécessaires ; Orchestration coordonne les prestations et leurs dépendances ; Adaptation Decision détermine la variation du plan. Cette gestion met à jour transactionnellement les demandes et leurs états, unitairement ou en groupe selon les interfaces disponibles ; ces modalités ne créent pas de capacités supplémentaires.

      Conserver la distinction entre SLA configuré, engagement individuel, estimation et résultat. Les exécutants gardent leurs opérations internes et D15 la promesse Supply. D07.b conserve la gestion des prises en charge et engagements, désormais explicitée dans le cycle du Service Order.
    market_comparisons:
    - vendor: Oracle
      product: Oracle Fusion Cloud SCM / Order Management / Global Order Promising
      element_name: Compensate Sales Orders That Change
      element_type: fonction ou mécanisme produit
      relationship: Recouvrement partiel
      similarities: Une demande de service engagée peut devoir être mise à jour, annulée ou refaite quand la commande change.
      differences: Les patterns Oracle portent des étapes d’orchestration logicielles ; un appel technique n’est pas à lui
        seul le Service Order métier FLOW.
      flow_position: D07.b tient demandes et réponses des prestations ; D06.f détermine la variation et D06.d la coordonne.
        Correspondance de mécanisme limitée. Comparaison proposée au titre de U435, sans validation ni réalisation installée
        déduites.
      source_title: Compensate Sales Orders That Change
      source_url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/26b/faiom/compensate-sales-orders-that-change.html
      source_version: Oracle Cloud SCM 26B
      source_locator: Introduction ; example Create Shipment Redo ; compensation pattern
      consulted_on: '2026-09-19'
