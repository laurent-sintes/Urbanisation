- id: TER052
  name: Product Reference
  short_description: Référentiel projeté des Product et Product Variants, distinct des catalogues et des exemplaires physiques.
  definition: Référentiel projeté des Product et Product Variants, indépendant des catalogues qui les proposent. Product porte
    un rôle Article ou Container ; les Product Units sont des exemplaires physiques distincts de ces références.
  context: 'Supply reçoit ces références depuis leurs autorités externes. La source qui les transmet peut être un relais :
    elle ne devient pas pour autant l’autorité sur leur contenu. Exemple fictif : une même variante de tee-shirt, bleu taille
    M, est proposée dans deux catalogues ; elle reste une seule référence de variante et ne désigne pas les exemplaires physiques
    détenus.'
  notes: Actualisé selon le modèle courant ; formulation détaillée proposée et périmètre local, pas une définition éditeur
    universelle.
