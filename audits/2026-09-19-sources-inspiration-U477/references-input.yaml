  short_description: Aptitude à recevoir les informations de référence et leurs évolutions pour les rendre utilisables dans
    les opérations, en conservant les liens et identifiants du maître externe.
  definition: Aptitude à recevoir les informations de référence et leurs évolutions pour les rendre utilisables dans les opérations,
    en conservant les liens et identifiants du maître externe.
  context: 'Exemple : recevoir une variante de produit créée dans le référentiel maître, avec son identifiant, sa taille et
    sa couleur. Une correction est reçue depuis cette même autorité ; la Supply ne modifie pas le maître à sa place.'
  notes: L’autorité sur les références reste externe à Supply. Recevoir leurs évolutions ne transfère pas la responsabilité
    de créer, corriger ou supprimer les maîtres.
  source_refs:
  - U203
  - U470
