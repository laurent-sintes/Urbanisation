- id: TER083
  name: Supply
  short_description: Ressources présentes ou attendues qui peuvent répondre à une demande.
  definition: 'Dans les mécanismes de disponibilité, de planification et d’affectation, côté ressources du bilan offre-demande
    : stock présent et apports attendus, considérés selon leurs quantités, dates et conditions d’admissibilité.'
  context: Sens métier ressources, illustré par Microsoft Business Central et SAP ARun ; ce n’est pas un synonyme universel
    d’approvisionnement ni de Supply Chain.
  notes: 'Exemple fictif : 80 pièces en stock et une réception de 40 constituent des ressources à examiner ; elles ne sont
    pas nécessairement toutes libres, fiables ou mobilisables à la date voulue. Un même transfert est sortant pour le lieu
    donneur et entrant pour le receveur : la perspective compte. À distinguer du [sens fonctionnel local FLOW](glossary:TER035),
    de la [Supply Chain](glossary:TER084) et du [Fulfillment](glossary:TER085).'
