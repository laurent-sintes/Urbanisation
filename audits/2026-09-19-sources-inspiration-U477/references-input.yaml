- id: TER057
  name: Product
  short_description: Référence commune d’un produit, portant un rôle Article ou Container.
  definition: Référence commune d’un produit, portant un rôle [Article](glossary:TER060) ou [Container](glossary:TER061).
  context: 'Exemple fictif : un modèle de tee-shirt constitue la référence commune ; bleu taille M en est une déclinaison.
    Cette référence ne désigne ni une offre de catalogue, ni une pièce physique particulière. Le rôle Article ou Container
