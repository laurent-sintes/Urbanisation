- id: D06.b
  kind: capability
  parent: D06
  family: D06
  fields:
    name: Service Capacity Visibility
    definition: Rendre visible la capacité opérationnelle communiquée par les exécutants, avec son contexte, sa période et
      sa fraîcheur, pour alimenter les décisions Supply.
    finality: Donner à D03, à D15 et aux décisions d’exécution une connaissance exploitable des capacités annoncées par les
      exécutants.
    nature: knowledge
    scope: |-
      Rendre accessible la capacité logistique dans son contexte, par exemple le nombre maximal de préparations communiqué pour un site et un créneau. Expliciter le service, l’unité, la période, l’origine et la fraîcheur des informations disponibles.

      Exemple : l’entrepôt annonce un plafond de 1 000 préparations sur un créneau ; si une charge ou un disponible sont également communiqués, les présenter avec leur sens et leur date de connaissance. Ne pas transformer sans règle connue ce plafond en capacité encore disponible.

      Cette visibilité ne décide pas d’augmenter les ressources de l’exécutant, ne calcule pas implicitement un disponible à partir d’une formule non convenue et ne réserve pas la capacité. D15 l’utilise pour la promesse Supply ; Service Selection Decision et Process Adaptation Decision peuvent la mobiliser. Le nom est adopté U246 ; les détails de représentation et contrats restent proposés.

      Précision éditoriale U435 : contextualiser les créneaux et dates communiqués avec leur calendrier applicable, fuseau et éventuelle heure limite. Une fermeture ou une information périmée doit rester visible aux décisions consommatrices ; aucun disponible ni engagement de capacité n’est déduit d’un plafond communiqué.
    market_comparisons:
    - vendor: Oracle
      product: Oracle Fusion Cloud SCM / Order Management / Global Order Promising
      element_name: Database Promising
      element_type: fonction ou mécanisme produit
      relationship: Recouvrement partiel
      similarities: Les données de capacité fournisseur peuvent être collectées et utilisées par la promesse avec une hypothèse
        de capacité explicitée.
      differences: Oracle décrit la capacité fournisseur dans Promising ; FLOW expose plus largement la capacité communiquée
        par les exécutants, sans présumer une capacité infinie.
      flow_position: D06.b restitue plafond, charge ou disponible avec sens, origine et date ; il ne réserve pas lui-même
        la capacité. Comparaison proposée au titre de U435, sans validation ni réalisation installée déduites.
      source_title: Database Promising
      source_url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/26a/fascp/overview-of-database-centric-order-promising.html
