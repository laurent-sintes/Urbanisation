- id: TER031
  name: Orchestration
  short_description: Coordination du déroulement d’activités et d’événements selon des dépendances et des règles de conduite
    explicites.
  definition: 'Coordonner les activités nécessaires pour obtenir un résultat : déterminer ce qui doit se passer, solliciter
    les intervenants, suivre leur avancement et adapter la suite en cas d’écart.'
  context: 'Exemple Supply : demander la préparation de 100 tee-shirts, coordonner leur transport puis suivre leur remise
    au magasin. L’orchestration s’appuie sur les faits transmis par les exécutants ; elle ne réalise pas elle-même la préparation
    ou le transport.'
  notes: Dans Atlas, les univers et domaines coopèrent selon leurs responsabilités métier. Le terme ne prescrit ni hiérarchie
