    name: Additional Supply Feasibility
    definition: Les possibilités de satisfaire la demande en obtenant des ressources supplémentaires, avec quantités, dates
      et conditions de disponibilité.
    finality: Expliciter les apports supplémentaires qui rendraient la commande satisfaisable et les conditions nécessaires
      avant engagement.
    scope: |-
      Un arrivage déjà prévu et admissible dans la situation de référence reste pris en compte par ATP. Ici, l’apport supplémentaire est une hypothèse à rendre réalisable. La capacité ne crée pas l’achat ou la demande d’apport ; elle ne suppose pas une acquisition quand le régime est consigné. Le fournisseur ou l’exécutant concerné fournit les possibilités utiles. Replenishment Decision conserve l’objectif d’optimisation du stock ; tout apport pour satisfaire un Order ne passe pas nécessairement par cette décision.

      Exemple fictif : Il manque 40 pièces : un apport fournisseur supplémentaire pourrait les rendre disponibles vendredi.

      [CTP](model:D03.j) établit les possibilités sous adaptation et leurs conséquences. [Fulfillment Plan Decision](model:D03.o) détermine le scénario collectif cohérent maximisant la valeur multidimensionnelle, en mobilisant les décisions spécialisées. [Supply Assignment](model:D02.e) applique les affectations retenues ; [Fulfillment Commitment](model:D03.n) porte les modifications autorisées de promesse. Le résultat de faisabilité ne réserve pas, ne modifie pas un Order ou une politique et ne déclenche pas l’exécution. Les trois comportements peuvent se combiner sans séquence imposée. Aucune pratique installée chez Beaumanoir déduite de cet exemple.
