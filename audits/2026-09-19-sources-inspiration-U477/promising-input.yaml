- id: D03.j
  kind: capability
  parent: D15
  family: D15
  fields:
    name: Capable-to-Promise (CTP)
    definition: Déterminer les possibilités de satisfaction d’un Order nécessitant une adaptation des ressources ou des engagements,
      en mobilisant les décisions spécialisées et en explicitant les conditions de faisabilité et les impacts.
    finality: Établir à quelles conditions une promesse deviendrait réalisable après adaptation.
    nature: decision
    scope: |-
      Établir les possibilités de satisfaction de l’Order lorsque la situation de référence ne suffit pas : ressources supplémentaires, autres dates ou adaptations d’engagements à examiner. Le résultat est une solution Supply candidate cohérente, avec quantités et dates réalisables sous conditions, adaptations nécessaires, impacts et points restant à autoriser. Les hypothèses de modification ne sont pas des politiques actives ni des engagements déjà modifiés.

      Mobiliser [Order Prioritization](model:D03.m) pour les arbitrages entre Orders et [Service Selection Decision](model:D06.e) pour les services/exécutants compatibles. Si une évolution des politiques de stock est envisagée, mobiliser [Group Protection Decision](model:D05.d) ou [Inventory Target Decision](model:D05.a) selon le résultat concerné ; CTP peut identifier la nécessité de cette évolution sans décider seul des valeurs de politique. Une dérogation ponctuelle à une politique n’est pas attribuée automatiquement à CTP par cette frontière.

      Les possibilités et impacts établis peuvent alimenter [Profitable-to-Promise (PTP)](model:D03.k), qui porte l’arbitrage économique, et [Delivery Schedule Decision](model:D03.l), qui retient l’échéancier parmi les possibilités réalisables. Identifier les dates possibles fait partie de la faisabilité ; choisir l’échéancier retenu conserve son responsable. Ces mobilisations n’imposent ni appel systématique à toutes les décisions, ni séquence universelle, ni hiérarchie de sous-capacités.

      Exemple fictif : une commande demande 100 pièces vendredi, mais seules 60 sont admissibles dans la situation de référence. CTP examine sous quelles conditions obtenir les 40 manquantes : apport supplémentaire disponible à temps ou autre solution compatible. La disponibilité du service nécessaire est éclairée par D06 ; une variante qui dégraderait une autre commande respecte l’arbitrage de priorité. Les possibilités et conséquences alimentent, selon le cas, le choix économique et l’échéancier. Le résultat ne crée pas automatiquement un achat et ne modifie pas de lui-même une autre promesse ou une protection.

      [Process Adaptation Decision](model:D06.f) détermine les variations du plan d’exécution face aux aléas. Lorsqu’une variation affecte la satisfaction de l’Order, le réexamen de la promesse dans D15 peut mobiliser CTP. [Promise Revision](model:BHV023) établit les modifications autorisées de promesse ; les capacités de gestion concernées tiennent les Orders, protections, affectations et réservations. CTP ne reprend pas leur application transactionnelle.

      Un apport ou un transfert envisagé pour honorer l’Order conserve cette finalité, distincte de [Replenishment Decision](model:D05.e) et [Stock Redistribution Decision](model:D05.c), qui recherchent un stock souhaitable ou mieux réparti. Leur opération commune ne crée pas une dépendance obligatoire de tout approvisionnement CTP à D05. Le partage éventuel de données ou de calculs n’impose pas de fusion. CTP reste une décision agrégée de faisabilité sous adaptation ; elle ne devient pas par cette composition une capacité Planning ni une seconde autorité sur les arbitrages spécialisés.

      U402 : [Additional Supply Feasibility](model:BHV075), [Fulfillment Alternative Feasibility](model:BHV076), [Commitment Rebalancing Feasibility](model:BHV077). [CTP](model:D03.j) établit les possibilités sous adaptation et leurs conséquences. [Fulfillment Plan Decision](model:D03.o) détermine le scénario collectif cohérent maximisant la valeur multidimensionnelle, en mobilisant les décisions spécialisées. [Supply Assignment](model:D02.e) applique les affectations retenues ; [Fulfillment Commitment](model:D03.n) porte les modifications autorisées de promesse. Le résultat de faisabilité ne réserve pas, ne modifie pas un Order ou une politique et ne déclenche pas l’exécution. Les trois comportements peuvent se combiner sans séquence imposée.
    decomposition_rationale: 'Distinguer trois leviers métier : obtenir davantage de ressources, changer la solution de satisfaction,
      ou réexaminer des engagements existants. Les conditions, les parties concernées et les conséquences diffèrent réellement.
      La décomposition rend explicite ce qui doit changer pour rendre une commande satisfaisable, sans confondre faisabilité,
      choix collectif et application. Plusieurs leviers peuvent se combiner.'
