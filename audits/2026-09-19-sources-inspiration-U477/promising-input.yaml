    definition: Les possibilités obtenues en modifiant les modalités de satisfaction par rapport à la situation de référence.
    finality: Rendre visibles les solutions de satisfaction nécessitant une adaptation, leurs conditions et leurs effets sur
      le service attendu.
    scope: |-
      Un autre magasin déjà admissible dans la référence relève d’ATP : le caractère alternatif ne suffit pas à classer une option dans CTP. Une substitution de produit exige une équivalence autorisée ; proximité de taille, couleur ou apparence ne vaut pas acceptabilité. Service Selection Decision et Service Capacity Visibility conservent respectivement choix de service et information de capacité contextualisée. CTP exploite leurs résultats sans créer une seconde décision de service. Un changement de date déjà possible dans la référence ne devient pas automatiquement CTP.

      Exemple fictif : La livraison standard ne permet pas de respecter la date ; une prestation express pourrait le permettre, sous réserve de sa disponibilité et de son autorisation.

      [CTP](model:D03.j) établit les possibilités sous adaptation et leurs conséquences. [Fulfillment Plan Decision](model:D03.o) détermine le scénario collectif cohérent maximisant la valeur multidimensionnelle, en mobilisant les décisions spécialisées. [Supply Assignment](model:D02.e) applique les affectations retenues ; [Fulfillment Commitment](model:D03.n) porte les modifications autorisées de promesse. Le résultat de faisabilité ne réserve pas, ne modifie pas un Order ou une politique et ne déclenche pas l’exécution. Les trois comportements peuvent se combiner sans séquence imposée. Aucune pratique installée chez Beaumanoir déduite de cet exemple.
