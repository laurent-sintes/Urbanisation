      term_choice: Fulfillment Commitment rend explicite l’engagement de satisfaction. Promise Management était trop vague
        ; Promise Confirmation trop étroit pour inclure proposition et révision. Order Confirmation peut désigner la confirmation
        documentaire. Aucun terme unique de marché couvrant exactement cette responsabilité n’est établi ici.
