  fields:
    name: Commitment Rebalancing Feasibility
    definition: Les possibilités obtenues en révisant des engagements modifiables, en explicitant les conséquences sur les
      commandes concernées.
    finality: Rendre visibles les possibilités et conséquences croisées d’une révision d’engagements avant l’arbitrage collectif.
    scope: |-
      CTP ne choisit pas seul quelle commande sacrifier. Il explicite les possibilités et impacts permettant à Fulfillment Plan Decision d’arbitrer, avec Order Prioritization, PTP et les autres décisions utiles. La modifiabilité est une condition à établir, non une autorisation déduite de l’urgence. Une même ressource ne peut soutenir des possibilités collectivement incompatibles. Réservation opposable et gel restent respectés ; aucune libération ou révision implicite. Promise Revision conserve la modification autorisée de l’engagement et Supply Reassignment l’application des liens révisés.

      Exemple fictif : Une commande urgente pourrait être satisfaite si une autre accepte un décalage de deux jours ; les engagements gelés restent préservés.

      [CTP](model:D03.j) établit les possibilités sous adaptation et leurs conséquences. [Fulfillment Plan Decision](model:D03.o) détermine le scénario collectif cohérent maximisant la valeur multidimensionnelle, en mobilisant les décisions spécialisées. [Supply Assignment](model:D02.e) applique les affectations retenues ; [Fulfillment Commitment](model:D03.n) porte les modifications autorisées de promesse. Le résultat de faisabilité ne réserve pas, ne modifie pas un Order ou une politique et ne déclenche pas l’exécution. Les trois comportements peuvent se combiner sans séquence imposée. Aucune pratique installée chez Beaumanoir déduite de cet exemple.
