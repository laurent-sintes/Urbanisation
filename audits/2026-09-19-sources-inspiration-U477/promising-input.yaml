- id: TER015
  name: Confirmation de promesse
  short_description: Acte ou résultat établissant la quantité et la date promises à une demande dans le contexte défini.
  definition: Acte ou résultat établissant la quantité et la date promises à une demande dans le contexte défini.
  context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
  notes: Distinguer d’une confirmation de réception de message ou de constat d’un fait ; préciser l’effet d’engagement. N3.
  source_refs:
  - U203
  source_locator:
    path: connaissance/19-glossaire-metier.md
    anchor: ''
  review:
    state: under_review
    note: Reprise documentaire ; aucune validation supplémentaire par la migration.
- id: TER017
  name: Affectation de ressource
  short_description: Lien entre une demande et une ressource identifiée au degré de précision utile.
  definition: Lien entre une demande et une ressource identifiée au degré de précision utile.
  context: Ressources et commandes ou autres besoins identifiés ; choix lexical Assignment confirmé U275, stabilisé U289.
  notes: |-
    La quantité affectée peut différer de la quantité demandée ou promise. Qualifier l’affectation d’une tâche, qui relève d’un autre objet. N1/N3. U289 : notion résultat associée à Supply Assignment (affectation des ressources aux commandes). Ne pas employer Allocation seul comme synonyme. Un lien peut porter sur une ressource future ; il ne prouve ni promesse confirmée ni mouvement physique. Convention : modeles/backlog/assignment-terminology.yaml.

    U290 : la finalité de l’affectation est de maximiser une valeur multidimensionnelle sous contraintes. Service, engagements, coûts et risques sont des exemples éditoriaux ; leurs poids et modes d’arbitrage ne sont pas fixés.

    U436 : seule la réservation bloque les usages concurrents ; l’affectation seule ne les bloque pas. Créer, conserver ou réviser un lien d’affectation ne crée donc pas implicitement une réservation. Les protections de groupe conservent leurs règles d’admissibilité, et un gel d’affectation sa restriction de modification. Expiration, consommation, libération et déclenchement automatique éventuel d’une réservation restent à préciser ; aucun mécanisme technique de concurrence n’est déduit de cette frontière.
  source_refs:
  - U203
  - U275
  - U289
  - CMP096
  - U290
  - U436
  source_locator:
    path: connaissance/19-glossaire-metier.md
    anchor: ''
  review:
    state: partial
    note: Reprise documentaire ; aucune validation supplémentaire par la migration. U436 adopte uniquement la frontière réservation
      / affectation sur le blocage concurrent. Définitions et autres compléments conservent leur portée antérieure ; aucun
      accord global sur le terme.
- id: TER044
  name: Available-to-Promise — ATP
  short_description: Établir les engagements possibles et leur couverture avec les ressources admissibles présentes ou futures.
  definition: Établir les quantités et dates auxquelles une demande ou un ensemble de demandes peut être satisfait par les
    ressources présentes ou futures admissibles dans la situation de référence, et expliciter la couverture qui rend ces engagements
    possibles.
  context: Cette définition décrit la capacité FLOW. Dans les références APICS et Microsoft, ATP désigne aussi une quantité
    non engagée disponible à promettre à un horizon donné, incluant des ressources futures admissibles.
  notes: 'U260 accepte le principe d’une couverture explicative des quantités/dates ; le niveau d’identification des ressources
    et le choix final restent à préciser. Ce calcul ne prouve pas une affectation ou une promesse confirmée. SAP aATP est
    un ensemble de fonctions plus large, et non un synonyme de cette seule capacité. Synthèse proposée et sources : marche/atp-aatp-couverture.md,
    CMP087 ; APICS CPIM 2019 et documentation Microsoft/SAP consultés le 16 septembre 2026. U264 : synthèse alignée sur la
    capacité et les quatre comportements d’ATP ; terminologie factuelle, pas de niveau marketing Advanced ATP.'
  source_refs:
  - U154
  - U202
  - U203
  - U260
  - U263
  - U264
  source_locator:
    path: connaissance/19-glossaire-metier.md
    anchor: ''
  review:
    state: proposed
    note: Reformulation lexicale alignée U264 ; les définitions des comportements sont adoptées séparément U263.
  previous_definition: Quantité non engagée disponible pour soutenir une promesse à un horizon donné, dans le périmètre et
    selon les règles considérés. Son calcul et son contrôle contribuent à évaluer une possibilité de fourniture.
  previous_notes_U260: Actualisé selon le modèle courant ; formulation détaillée proposée et périmètre local, pas une définition
    éditeur universelle.
  previous_definition_U264: Établir les quantités et dates proposées pour honorer une commande avec les stocks et engagements
    admissibles, en appliquant les protections et règles existantes, sans modifier ces engagements ou politiques.
- id: TER045
  name: Capable-to-Promise — CTP
  short_description: Déterminer les possibilités de satisfaction d’un Order après adaptation, en mobilisant les décisions
    spécialisées.
  definition: Déterminer les possibilités de satisfaction d’un Order nécessitant une adaptation des ressources ou des engagements,
    en mobilisant les décisions spécialisées et en explicitant les conditions de faisabilité et les impacts.
  context: 'Sens FLOW : faisabilité Supply sous adaptation. Priorités, échéancier, arbitrage économique, politiques de stock
    et services gardent leurs décisions responsables.'
  notes: Alignement documentaire sur D03.j après U251 ; la définition de capacité est adoptée, cette reprise lexicale et ses
    compléments restent proposés. CTP ne met pas en application les adaptations et ne devient pas une définition éditeur universelle.
    État antérieur conservé dans audits/2026-09-16-ctp-frontieres/before-glossary.yaml.
  source_refs:
  - U154
  - U202
  - U203
  - U250
  - U251
  source_locator:
