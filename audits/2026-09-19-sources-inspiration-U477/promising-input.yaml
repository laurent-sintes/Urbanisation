    name: Operational Availability Timing
    definition: Déterminer quand une quantité peut effectivement contribuer à la promesse selon sa disponibilité opérationnelle.
    finality: Établir une échéance compatible avec la mobilisation effective des quantités.
    scope: |-
      Un article au fond de la réserve peut nécessiter plus de temps de mobilisation qu’un article près de l’expédition. Consommer les délais et contraintes opérationnels pertinents ; la RFID est une illustration de moyen, pas une condition imposée.

      Précision éditoriale U435 : les délais utilisables tiennent compte des calendriers, jours ouvrés, heures limites et fuseaux pertinents. Conserver origine et validité des informations ; si une contrainte temporelle est inconnue, ne pas présenter la date comme certaine. Exemple fictif : un stock présent après la dernière collecte ne permet pas de promettre un départ avant la prochaine ouverture applicable. Cette lecture des délais ne gère pas les calendriers maîtres et ne choisit pas à elle seule l’échéancier engagé.
    nature: decision_dimension
