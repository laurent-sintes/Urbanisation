    anchor: ctp
  review:
    state: proposed
    note: Reprise lexicale après U251 ; pas de validation supplémentaire du glossaire déduite de l’accord sur la capacité.
  previous_definition: Raisonnement de faisabilité de promesse prenant en compte les moyens nécessaires pour rendre une fourniture
    disponible, au-delà des ressources déjà présentes ou attendues mobilisables.
