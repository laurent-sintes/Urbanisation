  - vendor: Oracle
    product: Oracle Fusion Cloud SCM
    source_title: How You Review Item Supply and Demand
    source_url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/25d/famml/how-you-review-item-supply-and-demand.html
    source_version: 25D
    source_locator: Quantities to Include ; Supply Types ; Demand Types
    consulted_on: '2026-09-19'
    concept_name: Item supply and demand
    scope_summary: Stock présent, ressources entrantes et besoins datés.
    approach_summary: Présenter un bilan chronologique.
    evidence_limits: Documentation primaire de produit ; aucune preuve de réalisation Beaumanoir ni équivalence de catalogue
      de capacités.
    element_name: Item supply and demand
    element_type: Concept documenté par la source primaire
    relationship: Recouvrement partiel
    similarities: Le bilan sépare quantité actuelle et apports à venir.
    differences: Oracle propose ses propres règles de disponibilité ; FLOW ne les impose pas à toute lecture.
    flow_position: 'Voir une situation de stock compréhensible dans les différents lieux : Inventory Visibility rapproche
      les quantités présentes, leurs états et les ressources attendues. La vue indique ce qu’elle sait, sans inventer une
      disponibilité garantie.'
    status: proposed
    source_refs:
    - U470
    - U471
    - ELM297
    - CMP186
    - U477
  market_inspiration:
    choice: 'Voir une situation de stock compréhensible dans les différents lieux : Inventory Visibility rapproche les quantités
      présentes, leurs états et les ressources attendues. La vue indique ce qu’elle sait, sans inventer une disponibilité
      garantie.'
    flow_scope: Lecture cohérente du présent et de l’attendu.
    flow_approach: Restituer les quantités avec leur périmètre et leur fraîcheur.
    synthesis:
    - Microsoft insiste sur les dimensions de lecture ; Oracle ajoute une chronologie des entrées et des besoins. Les deux
      rendent visible un stock expliqué plutôt qu’un total isolé.
    - FLOW applique cette exigence aux différents périmètres. La vue de stock alimente la promesse mais ne prend pas à sa
      place l’engagement d’une quantité à une date.
    examples:
    - title: Illustration FLOW — total et détail
      situation: Deux magasins détiennent 15 et 25 pièces d’une référence.
      outcome: La lecture réseau donne 40 ; le détail permet de retrouver les deux lieux.
      lesson: Une seconde copie de ces informations n’ajoute pas 40 pièces au réseau.
      source_title: Inventory on-hand list
      source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/inventory/inventory-on-hand-list
      source_refs:
      - U477
  editorial_notes:
  - 'Inventory Visibility reservations : La réservation diminue le disponible mais la fiche porte sur sa lecture ; les vues
    des quantités et du bilan attendu couvrent plus directement Visibility.'
