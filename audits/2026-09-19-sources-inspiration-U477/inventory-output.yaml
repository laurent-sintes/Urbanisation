    element_name: Cycle counting / Spot cycle counting
    element_type: Concept documenté par la source primaire
    relationship: Recouvrement partiel
    similarities: Le résultat compté peut nécessiter une revue des écarts.
    differences: Les écrans et tâches d’entrepôt Microsoft ne deviennent pas des comportements supplémentaires.
    flow_position: 'Fiabiliser le stock en confrontant les quantités enregistrées à des comptages : Stocktaking qualifie les
      écarts et les corrections justifiées. Les constats physiques sont réalisés par les exécutants.'
