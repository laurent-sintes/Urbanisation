    source_refs:
    - U333
    - ELM207
    - CMP115
    - U334
    - U477
  market_inspiration:
    choice: 'Fiabiliser le stock en confrontant les quantités enregistrées à des comptages : Stocktaking qualifie les écarts
      et les corrections justifiées. Les constats physiques sont réalisés par les exécutants.'
    flow_scope: Campagnes complètes, contrôles tournants et vérifications ciblées.
    flow_approach: Rapprocher le constat et l’enregistrement avant correction.
    synthesis:
    - Oracle distingue campagne complète et vérifications successives ; Microsoft précise les contrôles tournants et ponctuels.
      Ces méthodes ont la même finalité de fiabilité mais des rythmes différents.
    - FLOW emploie Stocktaking pour les réunir et garder communs le rapprochement et la justification. Un écart de comptage
      ne vaut pas correction automatique.
    examples:
    - title: Exemple Microsoft — contrôle d’un écart
      situation: La quantité enregistrée est 50 et la tolérance de l’opérateur est de 10.
      outcome: Un résultat hors de l’intervalle 40–60 demande une revue.
      lesson: Les seuils peuvent organiser la revue ; le modèle ne reprend pas ces valeurs comme règles métier.
      source_title: Cycle counting
      source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/warehousing/cycle-counting
      source_refs:
      - U477
