    consulted_on: '2026-09-19'
    concept_name: Inventory journals
    scope_summary: Réceptions, sorties, transferts et ajustements.
    approach_summary: Enregistrer les variations et leurs justificatifs.
    evidence_limits: Documentation primaire de produit ; aucune preuve de réalisation Beaumanoir ni équivalence de catalogue
      de capacités.
    element_name: Inventory journals
    element_type: Concept documenté par la source primaire
    relationship: Recouvrement partiel
    similarities: Les faits de réception, sortie et correction expliquent les quantités.
    differences: Le journal Microsoft inclut des effets comptables ; FLOW sépare conservation des faits et établissement des
      quantités.
    flow_position: 'Savoir combien de pièces sont présentes et dans quel état : Inventory Tracking tient cette situation à
      partir des faits reconnus. Les ressources attendues restent identifiées séparément.'
    status: proposed
    source_refs:
    - U470
    - U471
    - ELM296
    - CMP186
    - U477
  - vendor: Microsoft
    product: Dynamics 365 Supply Chain Management
    source_title: Inventory on-hand list
    source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/inventory/inventory-on-hand-list
    source_version: '2026-06-15'
    source_locator: Query your on-hand inventory ; tableau des quantités ; Examples
    consulted_on: '2026-09-19'
    concept_name: On-hand inventory
    scope_summary: Quantités présentes, réservées et attendues.
    approach_summary: Lire les quantités aux dimensions choisies.
    evidence_limits: Documentation primaire de produit ; aucune preuve de réalisation Beaumanoir ni équivalence de catalogue
      de capacités.
    element_name: On-hand inventory
    element_type: Concept documenté par la source primaire
    relationship: Recouvrement partiel
    similarities: La situation distingue présent, réservé et attendu.
    differences: La liste Microsoft expose aussi des calculs de disponibilité ; Tracking fournit d’abord la situation de référence.
    flow_position: 'Savoir combien de pièces sont présentes et dans quel état : Inventory Tracking tient cette situation à
      partir des faits reconnus. Les ressources attendues restent identifiées séparément.'
    status: proposed
    source_refs:
    - U477
  market_inspiration:
    choice: 'Savoir combien de pièces sont présentes et dans quel état : Inventory Tracking tient cette situation à partir
      des faits reconnus. Les ressources attendues restent identifiées séparément.'
    flow_scope: Quantités et états par produit, lieu et propriété utile.
    flow_approach: Actualiser la situation sans compter deux fois le même fait.
    synthesis:
    - 'Microsoft documente deux faces complémentaires : les journaux portent les variations, la liste de stock en restitue
      le résultat. FLOW distingue explicitement l’enregistrement des faits et le maintien des quantités.'
    - Le nom Tracking exprime cette continuité. Une réservation peut changer l’état logique sans sortie physique ; les futurs
      apports ne sont pas additionnés au présent.
    examples:
    - title: Illustration FLOW — une réception corrigée
      situation: Une réception déclarée à 100 pièces est corrigée à 80.
      outcome: La situation retenue est 80 présentes ; les deux déclarations ne font pas deux réceptions.
      lesson: Tracking établit la bonne quantité ; Record Inventory Movements conserve l’explication de la correction.
      source_title: Inventory journals
      source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/inventory/inventory-journals
      source_refs:
      - U477
  editorial_notes:
  - 'Inventory Visibility reservations : La réservation est documentée mais ne définit pas la tenue de stock ; les journaux
    et la liste des quantités étayent directement Tracking.'
- id: D01.g
  market_comparisons:
  - vendor: Microsoft
    product: Dynamics 365 Supply Chain Management
    source_title: Set up consignment
    source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/inventory/consignment
    source_version: '2026-05-06'
    source_locator: Overview ; Inventory ownership change journal
    consulted_on: '2026-09-19'
    concept_name: Consignment inventory
    scope_summary: Stock détenu chez le client, propriété fournisseur.
    approach_summary: Séparer réception et acquisition.
    evidence_limits: Documentation primaire de produit ; aucune preuve de réalisation Beaumanoir ni équivalence de catalogue
      de capacités.
    element_name: Consignment inventory
    element_type: Concept documenté par la source primaire
    relationship: Recouvrement partiel
    similarities: Un changement de propriété peut être enregistré sans déplacement.
    differences: Le journal d’acquisition Microsoft porte aussi des suites d’achat et financières.
    flow_position: 'Expliquer pourquoi le stock a changé : Record Inventory Movements conserve les mouvements reconnus et
      leurs corrections. Le fait reste distinct du document qui le décrit.'
    status: proposed
    source_refs:
    - U435
    - U477
  - vendor: GS1
    product: EPCIS / CBV
    source_title: EPCIS and CBV Implementation Guideline
    source_url: https://ref.gs1.org/guidelines/epcis-cbv/2.0.0/
    source_version: Release 2.0, mars 2023
    source_locator: 3.3 dimensions de visibilité ; 5.9 erreurs et corrections
    consulted_on: '2026-09-19'
    concept_name: Visibility event
    scope_summary: Faits sur les biens, dates, lieux et états.
    approach_summary: Garder le contexte et les corrections.
    evidence_limits: Guide de standard de visibilité ; ne calcule ni position de stock ni disponibilité FLOW et n’impose aucune
      architecture.
    element_name: Visibility event
    element_type: Concept documenté par la source primaire
    relationship: Recouvrement partiel
    similarities: Un fait et sa correction gardent leurs dates et leur contexte.
    differences: EPCIS définit des événements de visibilité, pas le registre FLOW ni son mode de stockage.
    flow_position: 'Expliquer pourquoi le stock a changé : Record Inventory Movements conserve les mouvements reconnus et
      leurs corrections. Le fait reste distinct du document qui le décrit.'
    status: proposed
    source_refs:
    - U434
    - U435
    - U477
  market_inspiration:
    choice: 'Expliquer pourquoi le stock a changé : Record Inventory Movements conserve les mouvements reconnus et leurs corrections.
      Le fait reste distinct du document qui le décrit.'
    flow_scope: Réceptions, sorties, transferts et changements d’état ou de propriété.
    flow_approach: Conserver une trace justifiée, datée et corrigeable.
    synthesis:
    - 'Microsoft illustre un mouvement sans déplacement : l’acquisition de marchandises consignées. GS1 éclaire la trace du
      fait et la manière de signaler une erreur sans rendre le passé illisible.'
    - FLOW retient le service d’enregistrement et d’explication. Calculer la nouvelle quantité appartient à Inventory Tracking
      ; une architecture de journal technique n’est pas prescrite.
    examples:
    - title: Exemple GS1 — compléter une expédition déclarée
      situation: Le guide décrit trois produits déclarés expédiés, alors qu’un quatrième est aussi parti.
      outcome: Un fait complémentaire permet de reconnaître le quatrième produit.
      lesson: Une correction explique la variation ; elle ne doit pas effacer la distinction entre ce qui s’est passé et ce
        qui était connu.
      source_title: EPCIS and CBV Implementation Guideline
      source_url: https://ref.gs1.org/guidelines/epcis-cbv/2.0.0/
      source_refs:
      - U477
