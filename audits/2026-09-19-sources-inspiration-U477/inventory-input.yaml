- id: BHV063
  kind: behavior
  parent: D01.h
  family: D01
  fields:
    name: Consumption-Based Ownership Transfer
    definition: Appliquer le transfert de propriété lors de la vente ou consommation prévue par l’accord.
    finality: Distinguer utilisation autorisée, acquisition et stock restant fournisseur.
    scope: |-
      Le contrat fixe l’événement ; Purchase Order et finance portent leurs suites. Aucun automatisme vente = acquisition universel.

      Exemple fictif : Vingt pièces vendues deviennent acquises au fournisseur selon les conditions convenues ; les autres restent consignées.

      D04 porte les demandes, leur résultat attendu, Lifecycle, Structuring et Archiving ; D03 optimise leur satisfaction et D15 porte possibilités et engagements de promesse ; D05 optimise le stock, D01 conserve ses faits/régimes et D06 orchestre les services. Ces capacités restent mobilisables et les opérations utiles doivent être expliquées dans chaque contexte métier.

      Les comportements ne sont ni une séquence obligatoire ni tous exclusifs. Les comportements distinguent le transfert de propriété à la consommation, le transfert à une échéance contractuelle et la sortie autorisée de la consignation ou de la détention. Identifier les quantités concernées et ne pas additionner des stocks ou attendus deux fois.

      Les modalités de paiement, autorisations, tolérances et échéances contractuelles restent des règles à préciser selon le contexte. Cet exemple n’établit aucune pratique installée chez Beaumanoir.
