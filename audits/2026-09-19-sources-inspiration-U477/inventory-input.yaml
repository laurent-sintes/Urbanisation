- id: D01.g
  kind: capability
  parent: D01
  family: D01
  fields:
    name: Record Inventory Movements
    definition: 'Enregistrer, qualifier et conserver les mouvements de stock et leurs justifications : réceptions, sorties,
      transferts, changements d’état ou de propriété et ajustements justifiés ; identifier les quantités concernées, les dates
      et les références explicatives, y compris sans déplacement physique.'
    finality: Disposer d’un historique traçable des faits qui expliquent les variations du stock.
    scope: |-
      Exemple fictif : Tracer -5 justifié par comptage sans effacer le mouvement initial.

      Précision éditoriale U435 : conserver la date du fait, sa date de connaissance, son origine et une référence rapprochant une correction du fait antérieur. Un même fait reçu plusieurs fois ne produit pas plusieurs mouvements. La correction reconnue reste traçable sans effacer le fait initial. Exemple fictif : une réception déclarée à 100 est corrigée à 80 ; conserver le lien explicatif entre les faits, puis fournir le résultat à Inventory Tracking. Identifiants techniques, dédoublonnage et propagation restent à concevoir ; aucune architecture événementielle imposée.
    market_comparisons:
    - vendor: Microsoft
      product: Dynamics 365 SCM / Commerce / Intelligent Order Management
      element_name: Set up consignment
      element_type: fonction ou mécanisme produit
      relationship: Recouvrement partiel
      similarities: Le changement de propriété du stock consigné fait l’objet d’une écriture distincte de la réception physique.
      differences: Le journal Microsoft s’inscrit dans son processus comptable et achat ; FLOW conserve ici la trace du fait
        de stock, sans reprendre Finance.
      flow_position: D01.g enregistre le changement justifié ; D01.h applique le régime de consignation et D04.j porte l’achat
        applicable. Comparaison proposée au titre de U435, sans validation ni réalisation installée déduites.
      source_title: Set up consignment
      source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/inventory/consignment
      source_version: Documentation évolutive SCM
      source_locator: Consignment replenishment orders ; Inventory ownership change journal
      consulted_on: '2026-09-19'
      evidence_limits: Documentation officielle consultée ; aucune preuve de déploiement Beaumanoir ni équivalence de taxonomie.
      status: proposed
      source_refs:
      - U435
    - vendor: GS1
      product: EPCIS / CBV
      element_name: Visibility data and erroneous events
      element_type: Standard de données et guide d’implémentation
      relationship: Appui sémantique
      similarities: Contexte des faits de visibilité, distinction des dates et correction traçable d’un fait antérieur.
      differences: EPCIS décrit des événements et échanges ; il ne définit pas la capacité FLOW, ses états de stock ou la
        politique d’engagement des ressources futures.
      flow_position: 'U435 : étayer la lecture et la correction des faits de stock, sans imposer EPCIS ni déduire une réalisation
        installée.'
      source_title: EPCIS and CBV Implementation Guideline
