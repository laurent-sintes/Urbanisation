      differences: Les recommandations et leur application restent séparées dans FLOW. La liste Microsoft consultée ne justifie
        pas un code Cancel natif ; l’annulation admissible est une possibilité FLOW soumise aux conditions métier. Pas de
        garantie d’arrêt des services par le calcul.
      flow_position: 'U427 : comportement métier adopté sous Replenishment Decision. Comparaison descriptive, sans alignement
        taxonomique exact ni preuve de déploiement Beaumanoir.'
