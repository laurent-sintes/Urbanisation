- id: D01.c
  kind: capability
  parent: D01
  family: D01
  fields:
    name: Inventory Visibility
    definition: Fournir une lecture cohérente des stocks physiques, de leurs états logiques et des ressources futures dans
      les différents lieux et périmètres, avec provenance et fraîcheur, sans double compte.
    finality: Permettre aux décisions de s’appuyer sur une connaissance partagée.
    scope: |-
      Exemple fictif : Afficher 70 présentes et 50 attendues à J+7 avec leur fraîcheur.

      Précision éditoriale U435 : exposer les états corrigés et leur fraîcheur, avec la provenance permettant au consommateur de comprendre une variation. Une donnée absente ou périmée n’équivaut pas à une quantité nulle ou certaine. Les décisions de disponibilité ou de promesse doivent pouvoir identifier cette limite. Cette lecture ne corrige pas elle-même les mouvements et ne confirme pas une nouvelle promesse.
