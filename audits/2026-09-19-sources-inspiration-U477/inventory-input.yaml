      differences: La solution Microsoft réalise aussi la réservation ; FLOW sépare exposition cohérente et prise d’engagement.
      flow_position: D01.c rend les quantités et leur contexte visibles ; D02.c applique la réservation sans que cette visibilité
        soit une promesse. Comparaison proposée au titre de U435, sans validation ni réalisation installée déduites.
      source_title: Inventory Visibility reservations
      source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/inventory/inventory-visibility-reservations
