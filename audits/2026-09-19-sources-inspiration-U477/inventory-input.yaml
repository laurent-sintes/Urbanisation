    name: Consignment Exit
    definition: 'Prendre en charge une sortie autorisée de la consignation ou de la détention : reprise fournisseur, orientation
      vers un soldeur, seconde main ou destruction selon l’accord et la décision retenue.'
    finality: Expliciter le devenir des quantités non consommées sans achat fictif ni autorisation implicite.
    scope: |-
      Renvoi, soldeur, seconde main, destruction seulement selon accord/décision ; cette capacité applique l’issue retenue, elle n’en optimise pas le choix. Supplier Return, Sales Order, Transfer Order et D06 mobilisés selon le cas.

      Exemple fictif : En fin de saison, un reliquat est repris et un autre orienté vers une filière seconde main autorisée.

      D04 porte les demandes, leur résultat attendu, Lifecycle, Structuring et Archiving ; D03 optimise leur satisfaction et D15 porte possibilités et engagements de promesse ; D05 optimise le stock, D01 conserve ses faits/régimes et D06 orchestre les services. Ces capacités restent mobilisables et les opérations utiles doivent être expliquées dans chaque contexte métier.

      Les comportements ne sont ni une séquence obligatoire ni tous exclusifs. Les comportements distinguent le transfert de propriété à la consommation, le transfert à une échéance contractuelle et la sortie autorisée de la consignation ou de la détention. Identifier les quantités concernées et ne pas additionner des stocks ou attendus deux fois.

      Les modalités de paiement, autorisations, tolérances et échéances contractuelles restent des règles à préciser selon le contexte. Cet exemple n’établit aucune pratique installée chez Beaumanoir. Le comportement porte les filières de sortie autorisées ; les déclencheurs d’acquisition par consommation ou durée sont décrits par les deux comportements frères. Aucune sortie sans autorisation ni transfert de propriété implicite.
