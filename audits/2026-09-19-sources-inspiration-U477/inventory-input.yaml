- id: D01
  kind: domain
  parent: null
  family: D01
  fields:
    name: Inventory Management
    definition: Connaître les stocks et les ressources attendues, expliquer leurs variations, fiabiliser les quantités et
      préserver les usages par les protections et réservations. Le stock futur est connu ici et mobilisé par Order Promising
      et Fulfillment Optimization.
    finality: Connaître et fiabiliser le stock, enregistrer ses mouvements, le protéger et le réserver.
    scope: |-
      Stocks physiques, états logiques et connaissance des ressources futures ; disponibilité virtuelle pour la promesse dans Order Promising. Suivi du stock, enregistrement des mouvements, visibilité, inventaire, protection et réservation conservent leurs responsabilités dans D01.

      [Inventory Optimization](model:D05) décide du stock souhaitable et des ajustements à viser ; [Fulfillment Optimization](model:D03) cherche comment satisfaire les Orders. D01 fournit une connaissance fiable et applique les protections et réservations de son périmètre ; il ne se réduit pas à une observation passive. Un objectif de stock n’est pas une quantité réservée ou protégée. Les règles détaillées de décision, de consommation des ressources et de révision des protections restent à instruire.

      [Consigned Inventory Management](model:D01.h) applique les conditions du stock consigné ; la demande d’apport relève de D04. Frontière adoptée U395.
