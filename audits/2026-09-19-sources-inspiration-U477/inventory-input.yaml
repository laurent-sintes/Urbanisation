- id: D01.f
  kind: capability
  parent: D01
  family: D01
  fields:
    name: Inventory Tracking
    definition: Établir et actualiser les quantités physiques et leurs états logiques à partir des faits de stock reconnus,
      par référence de produit, lieu, détenteur et propriétaire lorsque ces dimensions sont pertinentes ; suivre distinctement
      les ressources futures connues et leurs caractéristiques attendues.
    finality: Disposer d’un état du stock à jour, expliqué par les faits reconnus, en distinguant présent et attendu.
    scope: |-
      Exemple fictif : 100 présentes moins 30 sorties reconnues : 70 présentes ; 50 attendues restent futures.

      Précision éditoriale U435 : intégrer les mouvements reconnus et leurs corrections sans décompter plusieurs fois le même effet. Distinguer quantité physique, état logique et ressource future ; un fait tardif peut corriger leur représentation à la date pertinente. Exemple fictif : une réception de 100 reçue deux fois puis corrigée à 80 ne représente pas 180 ou 200 unités présentes. Record Inventory Movements conserve les faits et leurs justifications ; Inventory Tracking en établit les quantités et états.
    market_comparisons:
    - vendor: Microsoft
      product: Dynamics 365 SCM / Commerce / Intelligent Order Management
      element_name: Inventory Visibility reservations
      element_type: fonction ou mécanisme produit
      relationship: Recouvrement partiel
      similarities: La réservation logique peut modifier la disponibilité sans changer la quantité physique suivie.
      differences: Inventory Visibility est un produit mêlant visibilité et réservation ; cela ne définit pas toute la responsabilité
        Inventory Tracking.
      flow_position: D01.f distingue faits physiques, états et ressources futures ; D02.c maintient les engagements de quantité.
        Comparaison proposée au titre de U435, sans validation ni réalisation installée déduites.
      source_title: Inventory Visibility reservations
      source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/inventory/inventory-visibility-reservations
