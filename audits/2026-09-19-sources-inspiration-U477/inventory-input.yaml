    les apports nécessaires ; les capacités opérationnelles appliquent les décisions, déclenchent les Orders utiles et organisent
    leur mise en action selon les règles et autorisations applicables.
  context: Sens de travail proposé, aligné sur la frontière analytique/opérationnelle U224 et la refonte D05 U235.
  notes: |-
    [Replenishment Decision](model:D05.e) intègre les calculs des besoins nets et détermine les quantités et dates à retenir. La décision, la mise à jour transactionnelle, les Orders nécessaires, leurs promesses et les mouvements physiques restent distincts. Une application automatique est possible ; aucune création directe de Purchase Order ni validation humaine systématique n’est présumée.

    U313/U316 : dans le contexte retail discuté, distinguer le réassort continu de l’[implantation](glossary:TER079), dont les apports sont décidés par [Initial Stocking Decision](model:D05.g). Un produit couvrant les deux ne fusionne pas ces responsabilités.
  source_refs:
  - U221
  - U224
  - U229
  - U231
  - U235
  - U313
  - U316
  source_locator:
    path: connaissance/01-contributions-utilisateur.md
    anchor: u221
  review:
    state: proposed
    note: Définition proposée par Codex, précisée avant publication pour respecter U224/U235 ; aucun accord métier supplémentaire.
- id: TER077
  name: Couverture de stock
  short_description: Mesure de la demande qu’un stock peut satisfaire sur un périmètre et un horizon définis.
  definition: Mesure de la capacité d’un stock à satisfaire une demande de référence, exprimée notamment en durée de consommation,
    selon un périmètre et des hypothèses explicites.
  context: Sens métier proposé en U260 pour distinguer l’indicateur de stock de la couverture d’une demande identifiée.
  notes: 'Préciser produit, lieu, demande de référence, horizon et inclusion éventuelle des réceptions prévues. Exemple simplifié
    : 100 pièces utilisables, une consommation constante de 10 pièces par jour et aucune réception correspondent à dix jours
    de couverture. Ce ratio n’est pas une formule universelle et ne garantit pas la satisfaction de chaque Order. Une couverture
    cible constitue un objectif ; elle se distingue de la mesure constatée ou projetée. Voir [Couverture d’une demande](glossary:TER022).'
  source_refs:
  - U260
  source_locator:
    path: marche/atp-aatp-couverture.md
    anchor: couverture-deux-registres-separes
  review:
    state: proposed
    note: Définition et exemple proposés par Codex ; pas de validation détaillée déduite de la demande de glossaire.
