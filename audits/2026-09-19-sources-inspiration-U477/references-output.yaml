    element_name: Site / Warehouse / Location
    element_type: Concept documenté par la source primaire
    relationship: Recouvrement partiel
    similarities: Repères physiques nécessaires aux opérations d’entrepôt.
    differences: La configuration d’entrepôt est plus détaillée ; FLOW décrit le réseau utile à la Supply.
    flow_position: Connaître les lieux et les relations qui rendent une livraison possible. Fulfillment Network décrit le
      réseau de référence ; le stock, la charge et le trajet retenu sont connus ou décidés ailleurs.
    status: proposed
    source_refs:
    - U477
    concept_name: Site / Warehouse / Location
    scope_summary: Repères physiques nécessaires aux opérations d’entrepôt.
    approach_summary: Faire correspondre les références des systèmes.
  market_inspiration:
    choice: Connaître les [lieux](glossary:TER053) et les relations qui rendent une livraison possible. Fulfillment Network
      décrit le réseau de référence ; le stock, la charge et le trajet retenu sont connus ou décidés ailleurs.
    flow_scope: Points du réseau, caractéristiques, relations et parties responsables.
    flow_approach: Recevoir une description durable du réseau.
    synthesis:
    - GS1 fournit des repères pour identifier lieux et parties. Microsoft décrit les sites, entrepôts et emplacements nécessaires
      aux échanges logistiques. Les deux aident à nommer les points, avec des mailles et des objectifs différents.
    - FLOW ajoute la lecture métier des relations utiles à la réalisation des mouvements. Un lieu identifiable ne garantit
      ni stock disponible, ni capacité libre, ni admissibilité d’un trajet pour une commande donnée.
    examples:
    - title: Illustration FLOW — le lieu et son responsable
      situation: Un prestataire exploite deux plateformes distinctes.
      outcome: Les deux lieux sont reliés à la même partie responsable.
      lesson: Ni le lieu ni sa relation au prestataire ne suffisent à choisir celui qui traitera une commande.
      source_title: GS1 GLN Allocation Rules Standard
      source_url: https://www.gs1.org/standards/gs1-gln-allocation-rules-standard/current-standard
      source_refs:
      - U477
  editorial_notes: 'Relecture U477 : références resserrées sur le périmètre de la fiche ; les anciennes comparaisons et leurs
