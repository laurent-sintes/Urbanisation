    element_name: Trade item / Trade item instance
    element_type: Concept documenté par la source primaire
    relationship: Recouvrement partiel
    similarities: Référence commerciale ou exemplaire identifié.
    differences: La clé GS1 ne fixe pas à elle seule la maille de gestion FLOW.
    flow_position: Nommer le bien à la maille utile à sa gestion. Article / unité de gestion rappelle qu’une référence commune
      et un exemplaire physique ne répondent pas au même besoin d’identification.
    status: proposed
    source_refs:
    - U477
    concept_name: Trade item / Trade item instance
    scope_summary: Référence commerciale ou exemplaire identifié.
    approach_summary: Choisir le niveau d’identification utile.
  market_inspiration:
    choice: Nommer le bien à la maille utile à sa gestion. Article / unité de gestion rappelle qu’une référence commune et
      un exemplaire physique ne répondent pas au même besoin d’identification.
    flow_scope: Bien identifié pour les usages commerciaux ou opérationnels.
    flow_approach: Préciser la maille avant d’interpréter le mot article.
    synthesis:
    - Microsoft parle de produit et de variante pour la définition partagée. GS1 parle de trade item pour la référence commerciale
      et distingue son identification de celle d’un exemplaire. Ces vocabulaires se recouvrent sans désigner une maille unique
      dans tous les usages.
    - FLOW conserve ce terme général comme repère de lecture. Lorsqu’une distinction est nécessaire, les notions Product,
      Product Variant et Product Unit donnent un sens plus précis.
    examples:
    - title: Illustration FLOW — compter dix exemplaires
      situation: Dix tee-shirts partagent une même taille/couleur et une référence de gestion.
      outcome: On peut parler d’un article de référence et de dix pièces physiques.
      lesson: Préciser cette maille évite de confondre référence et quantité.
      source_title: Product information overview
      source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/pim/product-information
      source_refs:
      - U477
