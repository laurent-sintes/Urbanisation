  market_inspiration:
    choice: Savoir quelles références sont proposées et sous quelles conditions commerciales. Catalog reçoit l’offre construite
      à l’extérieur ; il ne redéfinit pas le produit.
    flow_scope: Références proposées, prix et zones d’application.
    flow_approach: Consulter une offre reçue et ses évolutions.
    synthesis:
    - Le catalogue B2B de Microsoft présente une offre à des clients ; son catalogue d’approvisionnement encadre les achats
      des employés. Les destinataires diffèrent, mais les deux sélectionnent ce qu’un public peut commander.
    - FLOW retient la distinction entre la référence produit et son offre. La construction, la publication et les politiques
      commerciales de ces produits Microsoft restent hors du référentiel projeté.
    examples:
    - title: Illustration FLOW — une variante, deux offres
      situation: La même variante figure dans deux catalogues applicables à des contextes différents.
      outcome: Le prix ou l’applicabilité peuvent différer sans créer deux produits.
      lesson: Catalog porte l’offre ; Product Reference conserve la référence commune.
      source_title: Create Commerce catalogs for B2B sites
      source_url: https://learn.microsoft.com/en-us/dynamics365/commerce/catalogs-b2b-sites
