  market_inspiration:
    choice: 'Décrire le sens fonctionnel local d’OMS dans les échanges FLOW : les parcours liés à la vente et leur coopération
      avec la Supply. Ce sens ne fixe pas le périmètre de tous les logiciels appelés OMS.'
    flow_scope: Vocabulaire de coopération autour des demandes de vente.
    flow_approach: Distinguer la convention projet de la catégorie logicielle.
    synthesis:
    - IBM décrit un OMS couvrant le cycle de commande jusqu’à la satisfaction et l’après-vente. Microsoft IOM met l’accent
      sur l’orchestration de la satisfaction. Les deux mobilisent la Supply, avec des regroupements de fonctions différents.
    - FLOW conserve son sens local pour comprendre les discussions. Il n’en déduit ni univers supérieur à Supply Chain Orchestration,
      ni nouveau chantier commerce ; les responsabilités existantes coopèrent.
    examples:
    - title: Exemple IBM — un parcours traverse les canaux
      situation: IBM évoque un achat commencé en ligne, poursuivi au centre d’appels et éventuellement retourné en magasin.
      outcome: La commande garde un parcours qui implique plusieurs contributions.
      lesson: Ce cas éclaire le mot OMS, sans étendre le modèle commerce courant.
      source_title: What is order management?
      source_url: https://www.ibm.com/think/topics/order-management
      source_refs:
