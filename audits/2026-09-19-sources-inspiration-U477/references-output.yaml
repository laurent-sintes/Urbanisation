    - Microsoft emploie Product variant pour une combinaison de dimensions telles que taille ou couleur. GS1 distingue la
      référence commerciale identifiée par GTIN de l’exemplaire éventuellement sérialisé. Les sources traitent la définition
      et l’identification sous deux angles complémentaires.
