    element_name: Master and reference data
    element_type: Concept documenté par la source primaire
    relationship: Recouvrement partiel
    similarities: Références nécessaires aux échanges avec un entrepôt.
    differences: Le guide Microsoft décrit une réalisation ; FLOW laisse les maîtres à l’extérieur.
    flow_position: Retrouver les références communes nécessaires aux opérations Supply. Business References les rassemble
      pour faciliter la lecture du modèle ; ce groupe ne crée pas un gestionnaire de toutes les données maîtresses.
    status: proposed
    source_refs:
    - U477
    concept_name: Master and reference data
    scope_summary: Références nécessaires aux échanges avec un entrepôt.
    approach_summary: Recevoir des données et relier leurs identifiants de source.
  market_inspiration:
    choice: Retrouver les références communes nécessaires aux opérations Supply. Business References les rassemble pour faciliter
      la lecture du modèle ; ce groupe ne crée pas un gestionnaire de toutes les données maîtresses.
    flow_scope: Produits, parties, offres, accords, lieux et services de référence.
    flow_approach: Recevoir des projections reliées à leurs sources externes.
    synthesis:
    - GS1 organise l’identification et l’échange des données partagées ; Microsoft décrit les références nécessaires pour
      faire coopérer un entrepôt avec d’autres systèmes. Leur point commun est de disposer de repères stables avant d’échanger
      des opérations.
    - FLOW utilise ce besoin pour regrouper ses référentiels. Les règles d’identification GS1 et les mécanismes d’intégration
      Microsoft ne constituent pas, à eux seuls, un découpage universel en domaines métier.
    examples:
    - title: Illustration FLOW — reconnaître le produit reçu
      situation: Un entrepôt reçoit une demande portant sur un article et un site déjà identifiés.
      outcome: Les références permettent de comprendre la demande sans recréer le produit ou le site.
      lesson: Le groupe aide à retrouver ces repères ; il ne pilote pas la réception.
      source_title: Exchange data between systems
      source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/warehousing/wms-only-mode-exchange-data
      source_refs:
      - U477
  editorial_notes: 'Relecture U477 : références resserrées sur le périmètre de la fiche ; les anciennes comparaisons et leurs
    preuves sont conservées dans before/. Les nouvelles formulations restent proposées.'
