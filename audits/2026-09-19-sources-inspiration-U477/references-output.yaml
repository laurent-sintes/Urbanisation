    - title: Illustration FLOW — bleu, taille M
      situation: Dix pièces sont du même modèle, de la même couleur et de la même taille.
      outcome: Elles partagent une variante, tout en restant dix exemplaires.
      lesson: Une variante identifie le type précis, pas une pièce particulière.
