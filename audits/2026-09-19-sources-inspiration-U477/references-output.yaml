    flow_scope: Progression des Tasks et du processus, contributions humaines, physiques et numériques.
    flow_approach: Corréler les faits et résultats connus dans leur contexte métier.
    synthesis:
    - Azure Business Process Tracking relie des opérations informatiques à des étapes métier et à un identifiant commun. Camunda
      rend visibles les étapes actives, terminées ou bloquées d’un processus. Les deux donnent une lecture du parcours au-delà
      des traces isolées.
    - FLOW retient cette lecture, sans imposer un moteur ou une correspondance entre une Task et un seul appel. Un appel accepté,
      un service terminé et un résultat métier acquis sont trois constats à distinguer.
    examples:
    - title: Illustration FLOW — document produit, dépôt attendu
      situation: La production d’un document a réussi, mais son dépôt n’est pas terminé.
      outcome: Le suivi montre ce qui manque au résultat attendu de la Task.
      lesson: La réussite d’un appel ne suffit pas à déclarer la Task, puis le processus entier, terminés.
      source_title: What is Azure Business Process Tracking?
