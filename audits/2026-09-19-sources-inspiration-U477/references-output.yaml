      Supply, dans ce sens fonctionnel local, ne désigne ni les seules ressources disponibles ni toute la Supply Chain.
    flow_scope: Coordination et optimisation de la satisfaction dans le modèle FLOW.
    flow_approach: Faire coopérer des responsabilités métier explicites.
    synthesis:
    - Le CSCMP décrit un Supply Chain Management étendu aux achats, à la transformation et à la coopération interentreprises.
