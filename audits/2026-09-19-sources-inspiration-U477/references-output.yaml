    - U477
    concept_name: Product master / Product variant
    scope_summary: Référence produit et déclinaisons.
    approach_summary: Partager une définition et ses dimensions de variante.
  - vendor: Oracle
    product: Fusion Cloud Product Hub
    source_title: Overview of Item Batches
    source_url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/26a/fapim/overview-of-item-batches.html
    source_version: 26A
    source_locator: Overview of Item Batches
    consulted_on: '2026-09-19'
    evidence_limits: Document primaire consulté ; rapprochement de concepts, sans preuve de réalisation Beaumanoir.
    element_name: Item / Item batch
    element_type: Concept documenté par la source primaire
    relationship: Recouvrement partiel
    similarities: Références produit provenant de plusieurs sources.
    differences: Oracle inclut rapprochement et gouvernance, hors de ce domaine FLOW.
    flow_position: Reconnaître un produit et ses variantes avant de les utiliser dans une commande. Product Reference reçoit
      ces références indépendamment des catalogues qui les proposent.
    status: proposed
    source_refs:
    - U470
    - U471
    - ELM295
    - CMP186
    - U477
    concept_name: Item / Item batch
    scope_summary: Références produit provenant de plusieurs sources.
    approach_summary: Importer et traiter les références par lots.
  market_inspiration:
    choice: Reconnaître un produit et ses [variantes](glossary:TER058) avant de les utiliser dans une commande. Product Reference
      reçoit ces références indépendamment des catalogues qui les proposent.
    flow_scope: Produits, variantes, identifiants et caractéristiques utiles à la Supply.
    flow_approach: Conserver le lien au maître externe, sans administrer le produit.
    synthesis:
    - Microsoft distingue la définition commune du produit de ses variantes ; Oracle décrit leur réception et leur traitement
      dans Product Hub. Les deux couvrent aussi des activités de gestion du référentiel.
    - FLOW retient le repère produit/variante, mais limite le domaine à une projection reçue. La présence dans une offre commerciale
      et l’identité d’un exemplaire physique répondent à deux autres questions.
    examples:
    - title: Illustration FLOW — une variante avant son offre
      situation: La référence d’un tee-shirt bleu en taille M est reçue avant son apparition dans un catalogue.
      outcome: Les opérations peuvent reconnaître cette variante sans créer une offre commerciale.
      lesson: Le produit, l’offre et l’exemplaire physique gardent des identités distinctes.
      source_title: Product information overview
      source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/pim/product-information
      source_refs:
      - U477
  editorial_notes: 'Relecture U477 : références resserrées sur le périmètre de la fiche ; les anciennes comparaisons et leurs
