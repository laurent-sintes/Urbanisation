  market_inspiration:
    choice: Coordonner plusieurs contributions pour obtenir un résultat. Orchestration désigne le déroulement d’ensemble ;
      dans le modèle détaillé, choix d’adaptation, coordination et suivi sont des responsabilités distinctes.
    flow_scope: Activités et intervenants participant à un résultat.
    flow_approach: Relier les dépendances, solliciter et suivre la suite.
    synthesis:
    - Camunda emploie Process Orchestration pour coordonner personnes et systèmes. Microsoft IOM applique une logique voisine
      à la satisfaction des commandes. Le premier est transversal ; le second est orienté commandes.
    - 'Le terme FLOW garde ce sens d’ensemble, sans imposer un moteur de workflow. La capacité Process Orchestration a un
      périmètre plus précis : coordonner le plan retenu, tandis que Process Adaptation Decision choisit ses variations.'
    examples:
    - title: Illustration FLOW — trois contributions, un départ
      situation: La préparation, le document et le transport doivent contribuer à la même expédition.
      outcome: Leurs dépendances sont coordonnées pour obtenir le résultat attendu.
      lesson: La coordination ne réalise pas les prestations à la place des intervenants.
