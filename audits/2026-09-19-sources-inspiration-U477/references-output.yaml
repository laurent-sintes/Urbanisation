    element_name: Master data
    element_type: Concept documenté par la source primaire
    relationship: Recouvrement partiel
    similarities: Références des produits, parties et lieux.
    differences: GS1 normalise des échanges ; Business References est un groupe de présentation.
    flow_position: Retrouver les références communes nécessaires aux opérations Supply. Business References les rassemble
      pour faciliter la lecture du modèle ; ce groupe ne crée pas un gestionnaire de toutes les données maîtresses.
    status: proposed
    source_refs:
