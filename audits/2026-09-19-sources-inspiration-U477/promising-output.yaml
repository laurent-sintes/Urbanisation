      situation: Le plan retient 60 pièces présentes et 40 sur un arrivage ; au moment de l’application, 10 de cet arrivage
        ne sont plus admissibles.
      outcome: Les liens applicables et l’écart de 10 sont rendus visibles pour un nouvel arbitrage.
      lesson: SAP documente l’affectation et ses résultats ; le traitement exact de cet écart est une illustration FLOW.
      source_title: Supply Assignment (ARun)
      source_url: https://help.sap.com/docs/SAP_S4HANA_ON-PREMISE/f132c385e0234fe68ae9ff35b2da178c/d335e3418f4348ffbae9f11888a62cc7.html
