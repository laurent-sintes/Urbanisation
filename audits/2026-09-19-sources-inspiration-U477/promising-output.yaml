      Optimization rapproche priorités, scénarios et affectations pour rechercher le meilleur compromis métier.
    flow_scope: Arbitrage des commandes et mise en place des affectations retenues.
    flow_approach: Composer service, engagements, coûts et risques sans pondération implicite.
    synthesis:
    - Microsoft DOM présente l’optimisation de satisfaction par commande ou par lot. Oracle Backlog Management travaille le
      carnet et les priorités ; son plan utilise les ressources connues sur le périmètre considéré. Tous deux dépassent une
      réponse isolée de disponibilité.
    - 'FLOW regroupe les responsabilités de priorité, plan, travail des scénarios et affectation. Les promesses restent coordonnées
      avec Order Promising : leur distinction repose sur l’effet métier, sans frontière artificielle entre individuel et collectif.'
    examples:
