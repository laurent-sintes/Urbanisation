  market_inspiration:
    choice: Retenir quelles quantités fournir à quelles dates rend la solution compréhensible pour le demandeur. Delivery
      Schedule Decision choisit un échéancier réalisable et acceptable, sans modifier à elle seule la demande ni confirmer
      l’engagement.
    flow_scope: Une ou plusieurs échéances de satisfaction de la commande.
    flow_approach: Choisir parmi les possibilités en respectant conditions et calendriers.
    synthesis:
    - Microsoft Delivery schedules représente une commande livrée en plusieurs fois. Oracle Check Availability permet de travailler
      les dates d’expédition et d’arrivée avant leur application. Microsoft insiste sur la représentation des livraisons ;
      Oracle sur le choix des possibilités.
    - FLOW nomme la décision qui retient l’échéancier. Deux dates de livraison n’imposent pas deux commandes ; la formalisation
      de la proposition puis sa confirmation gardent leur responsabilité.
    examples:
    - title: Illustration FLOW — une commande, deux dates
      situation: Pour 100 pièces demandées vendredi, les possibilités admissibles sont 60 vendredi et 40 lundi.
      outcome: L’échéancier retient ces deux quantités si les conditions du client l’acceptent.
      lesson: La représentation en plusieurs échéances, illustrée par Microsoft, ne décide pas du découpage en commandes.
      source_title: Delivery schedules
      source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/sales-marketing/delivery-schedules
      source_refs:
      - U477
