  market_inspiration:
    choice: Réexaminer une promesse quand la situation change permet de traiter l’écart avant qu’il devienne une mauvaise
      surprise. Promise Revision établit les modifications autorisées et conserve leur effet sur les quantités et dates engagées.
    flow_scope: Engagements affectés par les ressources, demandes ou priorités.
    flow_approach: Mobiliser les décisions utiles puis tenir la révision autorisée.
    synthesis:
    - SAP BOP peut redistribuer des confirmations après une pénurie ou un nouvel arrivage. Microsoft Order promising décrit
      un recalcul lorsque l’ancienne date ne peut plus être tenue, mais pas automatiquement lorsqu’une date meilleure devient
      possible. Les déclencheurs diffèrent.
    - 'FLOW ne choisit pas une règle automatique universelle : le changement appelle un réexamen et l’application des autorisations.
      Changer la ressource affectée peut laisser la promesse inchangée, et l’inverse est possible.'
    examples:
    - title: Microsoft — une date devenue intenable
      situation: Dans l’exemple Microsoft, une hausse de quantité rend impossible le 20 juillet et reporte la possibilité
        au 25.
      outcome: Le calcul est relancé ; à l’inverse, une baisse de quantité permettant le 15 ne remplace pas automatiquement
        le 20.
      lesson: FLOW sépare évolution des possibilités et décision de réviser l’engagement.
      source_title: Order promising
