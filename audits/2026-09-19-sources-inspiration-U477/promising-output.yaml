  - vendor: Microsoft
    product: Dynamics 365 SCM
    element_name: Pegging for confirmed demand
    concept_name: Pegging for confirmed demand
    element_type: Concept ou mécanisme métier documenté dans un produit
    relationship: Recouvrement partiel
    scope_summary: Liens couvrant une demande confirmée.
    approach_summary: Préserver la couverture entre plans.
    similarities: La relation à la demande doit rester explicite.
    differences: La fonction Microsoft protège une chaîne de planification plus large.
    flow_position: FLOW ne confond pas le lien avec un gel de tous ses moyens.
    source_title: Keep supply for confirmed demand
    source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/master-planning/planning-optimization/keep-supply-for-confirmed-demand
    source_version: 'Prérequis documenté : 10.0.48 build 10.0.2645.33 ou ultérieur'
    source_locator: What data is preserved ; Control how on-hand inventory is pegged ; Example scenario 1
    consulted_on: '2026-09-19'
    evidence_limits: Documentation primaire consultée ; aucun choix de produit ni déploiement Beaumanoir déduit.
    status: proposed
    source_refs:
    - U346
    - U347
    - ELM216
    - CMP124
    - U477
  market_inspiration:
    choice: Relier les ressources retenues aux commandes permet de savoir avec quoi les satisfaire. Nous gardons Supply Assignment
      pour cette affectation, distincte du choix du plan, de la réservation et de la promesse.
    flow_scope: Ressources présentes ou futures liées aux commandes identifiées.
    flow_approach: Appliquer les choix retenus, conserver ou réviser les liens autorisés.
    synthesis:
    - SAP emploie Supply Assignment pour un traitement qui combine choix, affectation et préparation de la livraison. Microsoft
      parle notamment de pegging pour les liens entre ressources et demandes. Les mots se rejoignent sur la relation à maintenir,
      mais les effets produits diffèrent.
    - 'FLOW isole cette responsabilité : une [affectation](glossary:TER017) indique la ressource retenue ; seule la réservation
      empêche son usage concurrent. Le nom SAP est proche, sans importer tous les effets d’ARun.'
    examples:
    - title: SAP — un arrivage lié à une commande
      situation: Le cours SAP décrit une commande déjà affectée à un achat attendu.
      outcome: Le lien est conservé lors de l’avis d’expédition puis de la réception.
      lesson: FLOW retient la continuité du lien ; les effets de réservation documentés par SAP restent une responsabilité
        distincte.
      source_title: Explaining Supply Assignment
      source_url: https://learning.sap.com/courses/exploring-fashion-functions-and-business-processes-in-sap-s-4hana-for-fashion-and-vertical-business/explaining-supply-assignment_af05618d-4954-4f22-9857-3dd12e3940c4
      source_refs:
      - U477
  editorial_notes: 'Anciennes références réexaminées et retirées de la présentation pour privilégier les appuis directement
    utiles à cette fiche : Supply Assignment (ARun); Backorder Processing — Reassignment; Steps in Order Allocation Run. Provenance
    intégrale conservée dans promising-input.yaml et le relevé de sources.'
