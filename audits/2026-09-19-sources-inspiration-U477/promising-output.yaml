  - vendor: Oracle
    product: PeopleSoft Inventory
    element_name: Cumulative ATP
    concept_name: Cumulative ATP
    element_type: Concept ou mécanisme métier documenté dans un produit
    relationship: Recouvrement partiel
    scope_summary: Quantités promettables par échéance.
    approach_summary: Rapprocher offre et demandes déjà promises.
    similarities: Une même ressource ne peut couvrir des promesses incompatibles.
    differences: Le produit joint calcul et traitements de réservation.
    flow_position: FLOW distingue résultat de faisabilité et effet d’engagement.
    source_title: Promising and Reserving Inventory
    source_url: https://docs.oracle.com/cd/E13228_01/fscm9pbr0/eng/psbooks/sinv/htm/sinv18.htm
    source_version: PeopleSoft Enterprise Inventory 9.0
    source_locator: Understanding Inventory Reservations ; Understanding the Order Line Processing Sequence ; Calculating
      ATP
    consulted_on: '2026-09-19'
    evidence_limits: Documentation primaire consultée ; aucun choix de produit ni déploiement Beaumanoir déduit.
    status: proposed
    source_refs:
    - U470
    - U471
    - ELM300
    - CMP186
    - U477
  market_inspiration:
    choice: Établir ce que l’on peut promettre avec les ressources déjà présentes ou attendues évite d’annoncer une quantité
      impossible à servir. ATP inclut les engagements et réservations existants ; son résultat explique les quantités et dates
      possibles sans les confirmer.
    flow_scope: Ressources admissibles dans la situation de référence, pour une ou plusieurs demandes.
    flow_approach: Croiser disponibilités, consommations, protections et délais sans changer les règles.
    synthesis:
    - Microsoft et PeopleSoft calculent une disponibilité dans le temps, au-delà du stock présent. PeopleSoft rapproche ce
      calcul du traitement des promesses et réservations ; Microsoft distingue notamment le délai de préparation à l’expédition.
    - FLOW nomme ATP la décision qui établit les possibilités et leur couverture. Calculer une [disponibilité](glossary:TER009)
      ne crée ni affectation ni réservation et ne confirme pas l’engagement.
    examples:
    - title: Microsoft — deux arrivages pour honorer 150 pièces
      situation: L’exemple Microsoft présente 200 pièces attendues en retard, 75 déjà demandées et un autre arrivage de 100
        à dix jours.
      outcome: Les 125 pièces encore mobilisables du premier arrivage ne suffisent pas ; la demande de 150 attend le second.
      lesson: Le stock futur contribue à ATP, après prise en compte des autres besoins.
      source_title: Order promising
      source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/sales-marketing/delivery-dates-available-promise-calculations
      source_refs:
      - U477
