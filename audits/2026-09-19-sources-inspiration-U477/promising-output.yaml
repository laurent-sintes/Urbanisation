  market_inspiration:
    choice: Mettre en place les liens prévus dans un plan permet de concrétiser le choix retenu. Supply Assignment Plan Application
      contrôle ce qui reste applicable et rend visibles les écarts, sans remplacer silencieusement le plan.
    flow_scope: Affectations d’un plan retenu aux commandes concernées.
    flow_approach: Appliquer les liens et signaler les impossibilités aux décisions responsables.
    synthesis:
    - SAP Supply Assignment matérialise des liens de ressources aux commandes. Son parcours distingue aussi résultats simulés
      et exécutés. Ces deux documents montrent un passage du scénario à l’action, mais ne prouvent pas l’importation de tout
      plan externe.
    - FLOW explicite ce passage comme une responsabilité. Préserver des liens ou en réviser certains peut faire partie de
      l’application ; le plan n’autorise ni réservation implicite ni modification d’Order par défaut.
    examples:
