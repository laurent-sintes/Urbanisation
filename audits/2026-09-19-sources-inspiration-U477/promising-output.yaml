  market_inspiration:
    choice: Promettre prend un engagement sur ce qui sera fourni à une demande. Il faut préciser le résultat, notamment quantité
      et date, ainsi que les conditions qui permettent de compter dessus.
    flow_scope: Acte d’engager une réponse de satisfaction.
    flow_approach: Passer d’une proposition à une réponse tenue.
    synthesis:
    - Oracle distingue le résultat exploré de son application. PeopleSoft emploie promise pour les quantités attribuées à
      des demandes dans ses traitements de stock. Ces usages rapprochent calcul et engagement à des degrés différents.
    - FLOW emploie le verbe pour l’effet d’engagement, et non pour tout calcul préparatoire. Promettre ne signifie ni affecter
      une ressource précise ni constater une livraison.
    examples:
