  market_inspiration:
    choice: Établir clairement la part promise permet à chacun de savoir sur quoi il peut compter. Promise Confirmation fait
      passer les quantités et dates autorisées du statut de proposition à celui d’engagement.
    flow_scope: Part confirmée et part restant non confirmée.
    flow_approach: Confirmer selon les conditions applicables, sans déduire une réservation.
    synthesis:
    - SAP BOP distingue les quantités confirmées de celles qui ne le sont pas. Oracle Check Availability distingue les résultats
      explorés de ceux transmis après planification. Les deux donnent un effet différent à une simple possibilité et à une
      réponse appliquée.
    - FLOW précise cet effet comme un [engagement](glossary:TER013) de satisfaction. Il ne suppose ni réception du stock,
      ni départ physique, ni blocage automatique de la ressource.
    examples:
    - title: Illustration FLOW — 60 confirmées sur 100
      situation: Une commande demande 100 pièces, mais les conditions permettent de confirmer seulement 60 vendredi.
      outcome: Les 60 sont promises ; les 40 restantes restent visibles comme non confirmées.
      lesson: SAP illustre l’existence de parts confirmées et non confirmées ; la règle autorisant cette confirmation relève
        du cas FLOW.
      source_title: Exploring Backorder Processing
