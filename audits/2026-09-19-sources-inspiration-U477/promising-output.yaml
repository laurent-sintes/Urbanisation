  market_inspiration:
    choice: Calculer ce qui reste mobilisable exige de tenir compte de ce qui est déjà engagé ou protégé. Existing Commitment
      Consideration rend ce décompte explicite pour la demande considérée, sans compter deux fois le même engagement.
    flow_scope: Réservations, protections et allocations applicables au calcul ATP.
    flow_approach: Déterminer les quantités admissibles sans changer les droits existants.
    synthesis:
