  market_inspiration:
    choice: Affecter établit un lien entre une ressource et une demande ou un bénéficiaire précis. Dans le cas Supply, le
      verbe décrit ce lien et ne suffit pas à promettre la fourniture ou à bloquer la ressource.
    flow_scope: Action créant une affectation identifiée.
    flow_approach: Nommer ressource, bénéficiaire et quantité concernée.
    synthesis:
    - SAP nomme Assign l’association de ressources physiques ou futures à des besoins. Microsoft emploie pegging pour la couverture
      liée à des demandes. Les mots diffèrent, mais rendent visible une association déterminée.
    - FLOW garde affecter pour l’acte de création du lien. L’affectation d’une tâche est un autre objet ; elle doit être qualifiée
      pour ne pas être confondue avec celle d’un stock.
    examples:
    - title: SAP — choisir une ressource future
      situation: Dans ITA, SAP permet de choisir le type de ressource, présente ou future, à associer au besoin.
      outcome: Le traitement crée une affectation sur le périmètre sélectionné.
      lesson: FLOW retient l’effet de lien ; réservation et confirmation conservent leur propre acte.
      source_title: Explaining Supply Assignment
