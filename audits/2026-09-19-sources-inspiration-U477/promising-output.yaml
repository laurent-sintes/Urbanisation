  market_inspiration:
    choice: Dire ce qui pourra être fourni, quand et sous quelles conditions rend la réponse aux commandes fiable. Order Promising
      réunit l’étude des possibilités, les choix de promesse et le maintien des propositions et engagements.
    flow_scope: Possibilités, coûts, échéancier et engagement de satisfaction.
    flow_approach: Séparer ce qui est possible, proposé puis confirmé.
    synthesis:
    - Microsoft utilise Order promising pour les dates de livraison calculées. Oracle Global Order Promising ajoute une recherche
      de sources, des alternatives et des règles de coût. Le même vocabulaire recouvre donc des périmètres produits différents.
    - FLOW retient un domaine métier centré sur la réponse faite à la demande. Le plan global d’affectation reste coordonné
      avec Fulfillment Optimization, et la [promesse](glossary:TER014) n’est ni un mouvement physique ni une réservation automatique.
    examples:
    - title: Oracle — examiner avant d’engager
      situation: Dans Check Availability, une ligne dispose d’un résultat de disponibilité que l’utilisateur peut faire évoluer.
      outcome: Oracle indique que les changements ne sont appliqués qu’au moment de Schedule.
      lesson: Cette séparation illustre le passage d’une possibilité à une réponse retenue ; FLOW garde ses propres conditions
        de confirmation.
      source_title: Check Availability
      source_url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/25c/fascp/check-availability.html
      source_refs:
      - U477
