  market_inspiration:
    choice: Autoriser rend une action admissible pour un périmètre et sous des conditions donnés. Cela ne signifie pas que
      l’action est déjà exécutée ou que sa ressource est réservée.
    flow_scope: Droit de poursuivre une action identifiée.
    flow_approach: Préciser les conditions et la portée de l’autorisation.
    synthesis:
    - Microsoft distingue un ordre planifié approuvé de son affermissement. SAP distingue aussi une affectation qui attend
      une libération manuelle d’un état permettant de créer la livraison. Les deux montrent une possibilité de passage soumise
      à une décision.
    - 'FLOW utilise autoriser comme convention de sens, sans assimiler les statuts éditeurs entre eux. L’action autorisée
      doit être nommée : affermir, libérer ou prendre en charge ne sont pas interchangeables.'
    examples:
    - title: Microsoft — approuvé pour affermissement
      situation: Un ordre planifié reçoit le statut Approved.
      outcome: Il est conservé pour un éventuel affermissement ; l’approbation n’est pas l’affermissement lui-même.
      lesson: Cet usage illustre la séparation entre rendre une action admissible et l’exécuter.
      source_title: View, manage, and approve planned orders
      source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/master-planning/planning-optimization/approved-planned-order
      source_refs:
