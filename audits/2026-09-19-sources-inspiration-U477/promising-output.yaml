  market_inspiration:
    choice: Tenir ce qui est proposé puis réellement promis évite de confondre une option avec un engagement pris. Fulfillment
      Commitment porte les quantités, dates et conditions de satisfaction ainsi que leurs révisions autorisées.
    flow_scope: Propositions, confirmations et révisions de satisfaction.
    flow_approach: Conserver distincts demande, réponse envisagée et engagement confirmé.
    synthesis:
    - 'Oracle Check Availability sépare le résultat exploré de son application. SAP BOP décrit le réexamen de confirmations
      déjà données. Ces documents éclairent deux moments de la vie d’une réponse : sa préparation et son évolution.'
    - FLOW les réunit sous Fulfillment Commitment, sans refaire les décisions de faisabilité ni d’échéancier. La confirmation
      documentaire d’une commande chez Microsoft est un usage plus large du mot confirmation ; elle ne suffit pas à définir
      cette responsabilité.
    examples:
    - title: Illustration FLOW — confirmer une part de la proposition
      situation: Une solution propose 60 pièces vendredi et 40 lundi pour une demande de 100.
      outcome: Seules les 60 du vendredi sont confirmées ; les 40 restent proposées.
      lesson: Le passage de l’exploration à l’application est documenté par Oracle ; FLOW précise ici la part engagée sans
        réservation implicite.
      source_title: Check Availability
      source_url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/25c/fascp/check-availability.html
      source_refs:
      - U477
  editorial_notes: 'Confirm sales orders relu : confirme un document de commande, avec contrôle de crédit, sans décrire à
    lui seul le contrat de promesse. Remplacé par Check Availability, plus précis sur proposition/application. Anciennes références
    réexaminées et retirées de la présentation pour privilégier les appuis directement utiles à cette fiche : Confirm sales
    orders. Provenance intégrale conservée dans promising-input.yaml et le relevé de sources.'
