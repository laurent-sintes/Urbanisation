  - vendor: Oracle
    product: Global Order Promising
    element_name: Scheduled ship and arrival dates
    concept_name: Scheduled ship and arrival dates
    element_type: Concept ou mécanisme métier documenté dans un produit
    relationship: Recouvrement partiel
    scope_summary: Possibilités de dates d’une ligne.
    approach_summary: Comparer puis retenir des dates.
    similarities: Expédition et réception sont distinguées.
    differences: Oracle regroupe exploration et application dans un parcours.
    flow_position: FLOW laisse chaque effet à sa responsabilité.
    source_title: Check Availability
    source_url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/25c/fascp/check-availability.html
    source_version: Oracle Fusion Cloud SCM 25C
    source_locator: Examine the Attributes ; Schedule the Order Line
