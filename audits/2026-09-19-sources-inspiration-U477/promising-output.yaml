  - vendor: SAP
    product: SAP S/4HANA Cloud Public Edition / Backorder Processing
    element_name: Backorder Processing
    concept_name: Backorder Processing
    element_type: Concept ou mécanisme métier documenté dans un produit
    relationship: Recouvrement partiel
    scope_summary: Confirmations devenues inadéquates.
    approach_summary: Réexaminer les commandes concernées.
    similarities: Une révision peut ouvrir une possibilité à une autre demande.
    differences: BOP peut directement modifier les confirmations.
    flow_position: CTP établit seulement possibilités et conséquences.
    source_title: Exploring Backorder Processing
    source_url: https://learning.sap.com/courses/optimizing-advanced-logistics-and-analytics-in-sap-s-4hana-cloud-public-edition/exploring-backorder-processing_fed6ddd5-39be-41ab-a977-e41a1c3715fe
    source_version: Cours SAP S/4HANA Cloud Public Edition ; édition non précisée
    source_locator: Backorder Processing — Introduction, Reprioritization & Reallocation, Order Confirmations
    consulted_on: '2026-09-19'
    evidence_limits: Documentation primaire consultée ; aucun choix de produit ni déploiement Beaumanoir déduit.
    status: proposed
    source_refs:
    - U402
    - ELM241
    - CMP152
    - U477
  market_inspiration:
    choice: Établir à quelles conditions une commande deviendrait satisfaisable permet de proposer une solution quand la situation
      actuelle ne suffit pas. CTP couvre les adaptations de ressources, de solution ou d’engagements, avec leurs impacts et
      autorisations nécessaires.
    flow_scope: Possibilités après adaptation de la situation de référence.
    flow_approach: Mobiliser les décisions responsables puis expliciter les conditions de faisabilité.
    synthesis:
    - Le CTP de Microsoft insiste sur les matières et capacités permettant de fabriquer. SAP traite d’autres leviers sous
      ABC, pour les alternatives, et BOP, pour les confirmations à réexaminer. Ces noms décrivent des fonctions différentes,
      pas une définition commune de CTP.
    - FLOW rassemble la faisabilité sous adaptation, tout en laissant les priorités, les choix économiques et les autorisations
      à leurs responsables. Un autre site déjà admissible relève encore d’ATP ; envisager une adaptation ne l’applique pas.
    examples:
    - title: Microsoft — fabriquer ce qui manque
      situation: Microsoft prend un article A sans stock, composé de B et C.
      outcome: CTP examine les composants et les moyens de fabrication pour établir combien de A peuvent être fournis.
      lesson: C’est un exemple d’apport supplémentaire ; FLOW couvre aussi d’autres adaptations sans créer automatiquement
        un ordre de fabrication.
      source_title: Calculate delivery dates using CTP
      source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/master-planning/planning-optimization/calculate-delivery-dates-using-ctp
      source_refs:
      - U477
