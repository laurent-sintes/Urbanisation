  market_inspiration:
    choice: 'La disponibilité indique quelle quantité peut servir un usage à une date donnée. Nous gardons ce sens contextualisé
      : un stock présent n’est pas nécessairement mobilisable pour toute demande.'
    flow_scope: Quantité admissible pour un usage et un horizon.
    flow_approach: Lire ressources, engagements et règles ensemble.
    synthesis:
    - Microsoft distingue le stock physique disponible et la disponibilité future calculée. Oracle distingue aussi ce qui
      est promettable de ce qui est déjà présent pour réservation. Le mot disponibilité dépend donc de la question posée.
    - FLOW exige d’indiquer l’usage, la date et les conditions. Une réponse positive n’engage pas automatiquement la quantité
      et ne prouve pas sa réception.
    examples:
    - title: Oracle — disponible pour plus tard
      situation: Une réception attendue au jour 28 peut couvrir une demande du jour 30.
      outcome: Elle ne constitue pourtant pas du stock présent réservable au jour 1.
      lesson: Toujours qualifier de quelle disponibilité on parle.
      source_title: Keep Global Order Promising and Inventory Management Synchronized
      source_url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/26a/fascp/keep-availability-in-global-order-promising-and-inventory-management-synchronized.html
