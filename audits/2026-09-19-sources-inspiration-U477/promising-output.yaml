    element_name: Inventory priority rank
    concept_name: Inventory priority rank
    element_type: Concept ou mécanisme métier documenté dans un produit
    relationship: Recouvrement partiel
    scope_summary: Lignes à réserver ou promettre.
    approach_summary: Trier avant distribution.
    similarities: La priorité influence l’accès à une ressource limitée.
    differences: Le classement PeopleSoft sert un traitement précis.
    flow_position: FLOW porte une priorité métier exploitable par les décisions concernées.
    source_title: Promising and Reserving Inventory
    source_url: https://docs.oracle.com/cd/E13228_01/fscm9pbr0/eng/psbooks/sinv/htm/sinv18.htm
    source_version: PeopleSoft Enterprise Inventory 9.0
    source_locator: Understanding Inventory Reservations ; Understanding the Order Line Processing Sequence ; Calculating
      ATP
    consulted_on: '2026-09-19'
    evidence_limits: Documentation primaire consultée ; aucun choix de produit ni déploiement Beaumanoir déduit.
    status: proposed
    source_refs:
