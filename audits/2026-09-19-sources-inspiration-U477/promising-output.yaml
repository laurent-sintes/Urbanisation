  - vendor: Microsoft
    product: Dynamics 365 Commerce
    element_name: Cost-based fulfillment optimization
    concept_name: Cost-based fulfillment optimization
    element_type: Concept ou mécanisme métier documenté dans un produit
    relationship: Recouvrement partiel
    scope_summary: Choix des sources pour commandes ou lots.
    approach_summary: Optimiser selon objectifs et contraintes.
    similarities: Les coûts participent au choix de satisfaction.
    differences: DOM couvre aussi composition du plan et sourcing.
    flow_position: PTP garde une responsabilité économique délimitée.
    source_title: Distributed order management (DOM)
    source_url: https://learn.microsoft.com/en-us/dynamics365/commerce/dom
    source_version: Documentation évolutive, mise à jour affichée le 3 juin 2026
    source_locator: Introduction, objectifs et contraintes
    consulted_on: '2026-09-19'
    evidence_limits: Documentation primaire consultée ; aucun choix de produit ni déploiement Beaumanoir déduit.
    status: proposed
    source_refs:
    - U477
  market_inspiration:
    choice: Choisir une promesse économiquement pertinente évite de gagner une livraison au prix d’un coût injustifié. PTP
      compare les conséquences économiques des solutions admissibles, avec des contraintes de service explicites et sans pondération
      universelle.
    flow_scope: Scénarios réalisables et coûts ou conséquences économiques pertinents.
    flow_approach: Expliquer le compromis économique sans confirmer la promesse.
    synthesis:
    - Oracle nomme profitable to promise la recherche d’une solution à moindre coût dans son ordre de priorités de service.
      Microsoft DOM traite aussi coûts et contraintes, au niveau plus large de l’optimisation des commandes. Les deux rapprochent
      service rendu et moyens mobilisés.
    - FLOW isole l’arbitrage économique. Le coût n’annule pas une obligation de délai ; les valeurs inconnues restent inconnues.
      Le compromis collectif de service, engagements, coûts et risques reste multidimensionnel, sans formule adoptée par cette
      comparaison.
    examples:
    - title: Oracle — Seattle plutôt que Denver
      situation: Dans l’exemple Oracle, dix unités peuvent arriver au même délai depuis Denver ou Seattle.
      outcome: Le coût total est de 23 dollars depuis Denver et 22,50 depuis Seattle ; Oracle retient Seattle.
      lesson: PTP éclaire l’écart économique entre possibilités compatibles ; cette politique chiffrée ne devient pas une
        règle générale FLOW.
      source_title: Create Alternative Fulfillment Scenarios to Reduce Cost
      source_url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/26c/fascp/create-alternative-fulfillment-scenarios-to-reduce-cost.html
      source_refs:
      - U477
  editorial_notes: 'Database Promising a été relu : ses détails de coût sont pertinents mais moins pédagogiques que le contrepoint
    DOM ; remplacement documentaire sans modifier le périmètre adopté. Anciennes références réexaminées et retirées de la
    présentation pour privilégier les appuis directement utiles à cette fiche : Database Promising. Provenance intégrale conservée
    dans promising-input.yaml et le relevé de sources.'
