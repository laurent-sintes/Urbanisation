  market_inspiration:
    choice: Déterminer quelles commandes passent avant les autres rend les pénuries arbitrables. Order Prioritization produit
      des priorités justifiées ; elle ne crée pas les ressources et ne lève pas une réservation.
    flow_scope: Commandes concurrentes et critères applicables.
    flow_approach: Distinguer obligations, préférences et conflits restant à résoudre.
    synthesis:
    - SAP BOP utilise des règles pour réordonner les besoins lors d’une pénurie. PeopleSoft ordonne également les lignes avant
      de distribuer les quantités. Les deux montrent que l’ordre d’examen influence qui sera servi.
    - 'FLOW sépare la priorité du plan qui en découle : être prioritaire ne détermine pas seul les quantités, les dates ou
      les ressources effectivement affectées. Aucun classement par client, chiffre d’affaires ou ancienneté n’est présumé
      universel.'
    examples:
    - title: SAP — une commande prioritaire arrive en pénurie
      situation: SAP décrit l’arrivée d’une commande d’un client prioritaire alors que le stock est limité.
      outcome: BOP peut réexaminer les confirmations d’autres commandes selon les règles définies.
