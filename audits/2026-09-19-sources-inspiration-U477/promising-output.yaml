      soustraire indistinctement peut masquer leurs bénéficiaires ou compter deux fois le même besoin.'
    - FLOW regroupe leur examen dans ATP. Une quantité protégée pour un groupe peut rester disponible pour ses membres ; la
      règle précise de décompte dépend du contexte et reste à expliciter.
