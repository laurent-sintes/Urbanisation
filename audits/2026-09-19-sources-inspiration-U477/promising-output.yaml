      situation: Après examen des possibilités, 60 pièces vendredi sont proposées puis confirmées.
      outcome: Le demandeur dispose désormais d’un engagement sur ces 60 pièces, selon les conditions convenues.
      lesson: La séparation Oracle entre exploration et application éclaire le passage, sans définir la procédure d’accord
        FLOW.
