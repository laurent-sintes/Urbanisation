  market_inspiration:
    choice: Vérifier consiste à établir si des conditions sont respectées et à en donner le constat. Ce verbe ne signifie
      pas, à lui seul, autoriser ou exécuter l’action envisagée.
    flow_scope: Conditions, éléments examinés et constat produit.
    flow_approach: Rendre lisible la conclusion et ses limites.
    synthesis:
    - Oracle Check Availability recherche une réponse possible avant application. SAP Release Check contrôle si les quantités
      affectées remplissent les conditions de départ. Les deux font un contrôle, mais pas sur la même question.
    - 'FLOW garde un verbe général à qualifier par son objet : vérifier une disponibilité ou vérifier un seuil de livraison.
      L’effet d’autorisation éventuel doit être nommé séparément.'
    examples:
    - title: SAP — vérifier avant de rendre livrable
      situation: Une affectation existe, mais un contrôle de libération reste requis.
      outcome: SAP compare les quantités aux règles et distingue notamment les situations nécessitant une libération manuelle.
      lesson: Le constat favorable et l’autorisation peuvent être séparés ; le mot vérifier ne les confond pas.
      source_title: Explaining Supply Assignment
