- id: D04.m
  kind: capability
  parent: D04
  family: D04
  fields:
    name: Supplier Return
    definition: Prendre en charge les retours de marchandises aux fournisseurs et suivre leurs suites attendues, selon les
      accords applicables, en distinguant renvoi sans remplacement, remplacement et réparation avec restitution du bien.
    finality: Piloter un retour fournisseur explicite et traçable, distinct de la commande d’achat initiale.
    scope: |-
      Supplier Return porte les commandes de renvoi aux fournisseurs et le suivi de leurs suites attendues. Le libellé désigne une capacité d’action ; [Supplier Return Order](glossary:TER073) reste l’objet métier associé.

      Trois comportements combinables sont retenus : Return for Credit et Return for Replacement adoptés U387, complétés par Return for Repair demandé U388. Return for Credit ne prévoit pas de remplacement pour les quantités reprises. Return for Replacement conserve un apport attendu et le lien entre le sortant et le remplacement. Un même retour peut associer avoir pour certaines quantités et remplacement pour d’autres. Pas de comportement autonome pour cette combinaison partielle.

      Référence à l’achat, à la réception et au retour client lorsque connus. Autorisation de retour fournisseur/RMA selon le cas ; aucune obligation universelle de document. Quantités, dates, destinataire, avancement et preuves de réception. Mutations par Lifecycle, composition par Structuring, conservation par Archiving ; exécution D06 et stocks D01.

      [Purchase Order](model:D04.j) porte l’apport de remplacement : commande liée ou adaptation de l’attendu existant selon les règles applicables, sans choix documentaire imposé. Ne pas compter deux fois le remplacement dans les ressources futures. Les confirmations, dates et réceptions restent des faits distincts ; leur usage par la promesse mobilise les capacités responsables.

      L’accord de reprise est consommé ; sa négociation et le règlement financier ne sont pas absorbés. Supplier Return peut référencer l’avoir ou son état communiqué, sans l’émettre, le comptabiliser ni le rapprocher. Expédition, réception fournisseur, acceptation et règlement restent distincts. [Process Management](model:D06) conserve prestations et suivi ; [Inventory Management](model:D01) enregistre mouvements et états. Lifecycle, Structuring et Archiving conservent leurs responsabilités communes.

      Le retour peut provenir d’un [Customer Return](model:D04.l), d’une réception fournisseur ou du stock, sans créer un comportement par origine ou motif. Défaut, erreur de livraison, excédent et fin de saison ne suffisent pas seuls à justifier un nouveau parcours. Return for Credit côté fournisseur prévoit un renvoi ; ne pas le confondre avec Credit only côté client, qui peut ne comporter aucun flux physique.

      Exemple fictif : sur 100 pièces reprises, 60 sont traitées sans remplacement et 40 doivent être remplacées. Suivre les quantités de chaque parcours et les apports réellement attendus. Aucun avoir ou remplacement ne se déduit du seul statut de l’Order.

      Return for Repair suit le renvoi et la restitution attendue du même bien. Le traitement physique reste chez le fournisseur ou prestataire et son orchestration dans D06. Lorsque la prestation nécessite un achat, Purchase Order porte cet achat ; aucun devis, garantie, gratuité ou schéma comptable imposé. Une impossibilité de réparer peut conduire à un autre devenir après décision autorisée, jamais à un remplacement implicite. Les exemples ne prouvent aucune pratique Beaumanoir.
