- id: BHV040
  kind: behavior
  parent: D04.o
  family: D04
  fields:
    name: Order Hold & Resume
    definition: Suspendre une progression désignée pour un motif métier puis permettre sa reprise lorsque les conditions de
      levée sont réunies.
    finality: Maintenir le besoin tout en évitant un traitement prématuré ; préserver la portée des autres blocages.
    scope: |-
      **Dimension gouvernée : Suspension de la progression.**

      **Portée des statuts.** Progression explicitement désignée et portée Order, ligne ou quantité ; plusieurs motifs peuvent coexister.

      **États possibles — vocabulaire de référence FLOW.**

      - **Clear — Sans suspension active** : Aucun Hold actif pour la progression et la portée considérées ; d’autres prérequis peuvent encore empêcher le traitement.
      - **On Hold — Suspendu** : Au moins un motif actif interdit la progression désignée.
      - **Partially On Hold — Partiellement suspendu** : Lecture agrégée lorsque seules certaines lignes, quantités ou progressions sont suspendues.

      **Combinaisons et transitions.** Un motif peut être Active ou Cleared ; ce sont les états du motif, pas de nouveaux états de l’Order. Lever un motif ne lève pas les autres. Clear ne signifie pas Released ni redémarrage effectif. Hold ne gèle pas automatiquement le contenu et n’annule pas le besoin. La suspension décidée et l’arrêt effectivement réalisé des services sont distincts ; D06 gère adaptation et compensation nécessaires.

      **Exemple métier fictif.** Suspendre l’expédition parce que le magasin ne peut pas réceptionner. Lever ce motif lorsque le magasin est prêt, tout en conservant un éventuel autre blocage.

      **Précisions métier conservées.**

      Exemple fictif : Un magasin ne peut pas réceptionner : mettre le transfert en attente d’expédition, puis lever ce motif lorsque le magasin est prêt.

      Une levée n’efface pas les autres blocages et ne constate pas un redémarrage physique. Hold bloque la progression ; Freezing protège contre modification.

      Portée : Order, ligne ou quantité selon le contexte ; conditions propres au type et à son avancement. Les modes écran, batch, API ou flux ne sont pas des comportements supplémentaires.

      U424 : les états listés explicitent la dimension ; les valeurs, règles détaillées et libellés sont des précisions éditoriales à adapter au type d’Order. Aucun nouveau comportement par état et aucune séquence imposée.
