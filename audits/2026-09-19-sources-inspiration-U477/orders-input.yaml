- id: BHV043
  kind: behavior
  parent: D04.o
  family: D04
  fields:
    name: Order Termination
    definition: Gouverner le retrait autorisé de tout ou partie du besoin et la clôture de son suivi opérationnel, en préservant
      les réalisations acquises et en explicitant le devenir du reliquat.
    finality: Mettre fin à la demande de façon explicable, sans perdre les réalisations ni laisser de reliquat ambigu.
    scope: |-
      **Dimension gouvernée : Fin de la demande.**

      **Portée des statuts.** Demande opérationnelle ou portée désignée. Les lignes peuvent avoir des situations différentes ; la clôture de l’ensemble dépend des reliquats et effets encore ouverts.

      **États possibles — vocabulaire de référence FLOW.**

      - **Open — Ouvert** : Un reste à satisfaire ou des effets de fin de traitement restent à résoudre.
      - **Closing — Clôture en cours** : La fin du suivi est engagée ; des vérifications, confirmations ou effets aval restent attendus.
      - **Closed — Clôturé** : La fin du suivi opérationnel est établie sur la portée considérée et le devenir du reliquat est explicite.

      **Combinaisons et transitions.** La dimension distingue le statut de clôture et l’étendue de l’annulation : Not Cancelled (aucune quantité retirée), Partially Cancelled (une partie du besoin retirée), Cancelled (tout le besoin de la portée retiré). Une demande peut être partiellement annulée et encore Open, puis Closed après traitement du reste. La raison de clôture précise satisfaction, annulation ou écart accepté ; elle n’est pas une nouvelle étape. Une demande d’annulation refusée ne change pas les quantités applicables. Aucune annulation de quantités déjà réalisées, aucun retour physique ni compensation informatique implicite. Closing peut être immédiat sans attente humaine. Réouverture selon règles du type, sans effacement de la clôture passée.

      **Exemple métier fictif.** Sur 100 pièces, 60 reçues restent acquises ; annuler les 40 encore attendues si autorisé. La commande demeure ouverte tant que les effets nécessaires ne sont pas résolus, puis est clôturée avec 60 satisfaites et 40 annulées.

      Order Cancellation (BHV042) est intégré ici avec ses restrictions et ses effets propres. Annuler retire le besoin ; clôturer constate la fin de son suivi : ces actes ne deviennent pas synonymes. Retirer une affectation, modifier un scénario ou arrêter un service ne suffit pas à annuler la demande. Clôture opérationnelle distincte de clôture financière et d’archivage ; Order Archiving relève de D04 depuis U438.

      U424 : les états listés explicitent la dimension ; les valeurs, règles détaillées et libellés sont des précisions éditoriales à adapter au type d’Order. Aucun nouveau comportement par état et aucune séquence imposée.
