      même commande.
    scope: |-
      Relais vers une commande de retour fournisseur liée au retour client ; suivre les quantités transférées à cette responsabilité et leur résultat.

      Exemple fictif : Trois pièces présentant un défaut fournisseur sont rattachées à un Supplier Return ; l’expédition ne prouve ni réception fournisseur ni avoir.

      Supplier Return D04.m porte la commande fournisseur ; ce comportement porte son articulation avec le retour client. L’accord de reprise est une condition, jamais déduit du choix logistique.

      Ce comportement appartient à [Customer Return](model:D04.l). Il peut se combiner avec les autres parcours du retour selon le produit ou la quantité. Le choix du devenir est porté par [Return Disposition Decision](model:D05.i). Les preuves de résultat proviennent des responsabilités opérationnelles compétentes. Aucune inspection, écriture de stock, prestation physique ou décision de remboursement absorbée ; aucun logiciel ni traitement manuel imposé.
