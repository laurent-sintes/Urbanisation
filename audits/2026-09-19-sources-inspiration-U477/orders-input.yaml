- id: BHV060
  kind: behavior
  parent: D04.j
  family: D04
  fields:
    name: Service Procurement
    definition: Acheter une prestation ; suivre ce qui est attendu puis reconnu réalisé.
    finality: Distinguer engagement d’achat, réalisation opérationnelle et résultat du service.
    scope: |-
      Attente de prestation et constat de réalisation, au lieu d’un apport d’articles à recevoir.

      Exemple fictif : commande de réparation de 50 pièces auprès d’un prestataire.

      D04 porte l’achat ; D06 sollicite, orchestre et suit les services via les Service Orders. Pas de Purchase Order imposée pour chaque appel de service ; comptabilité et négociation contractuelle hors périmètre. Purchase Order couvre les biens et les prestations depuis U391.

      Les mutations communes mobilisent [Order Lifecycle Management](model:D04.o), la composition [Order Structuring](model:D04.n) et la conservation [Order Archiving](model:D04.q). Aucune négociation de contrat, réalisation physique ni fonction comptable reprise par ce comportement. Les exemples ne prouvent aucune pratique installée.
