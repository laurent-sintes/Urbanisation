- id: D04
  kind: domain
  parent: null
  family: D04
  fields:
    name: Order Management
    definition: Capter et maintenir les demandes Supply selon leur intention, leurs parties, leurs conditions et leur résultat
      attendu, gouverner leur cycle de vie, leur structure et leur conservation, en articulation avec leur optimisation, leur
      promesse et les processus.
    finality: Disposer de commandes explicites et traçables pour savoir ce qui doit être satisfait, comment la demande est
      organisée et ce qui peut progresser ou reste bloqué.
    scope: |-
      Les capacités par intention prennent en charge les demandes de vente, achat, transfert, retour client, retour fournisseur et apport sous consignation. Elles gardent le sens du besoin, les parties, les quantités et conditions demandées, les évolutions autorisées et le suivi du reste à satisfaire selon chaque contexte métier.

      U438 : Order Structuring et Order Archiving rejoignent D04, où Order Lifecycle Management conserve les transitions et l’autorisation de prise en charge. D03 optimise la satisfaction et D15 porte les possibilités et engagements de promesse. Ce choix remplace les placements de Structuring et Archiving issus de U417/U420. Les identifiants historiques ne déterminent pas les parents.

      Le besoin d’origine doit rester lisible lorsque le carnet organise sa satisfaction en plusieurs parties ou phases. La prise en charge du sens de la demande ne présume ni un propriétaire logiciel exclusif ni une séquence universelle. D01 garde les faits et régimes de stock, D05 l’optimisation du stock et D06 les processus de services.
