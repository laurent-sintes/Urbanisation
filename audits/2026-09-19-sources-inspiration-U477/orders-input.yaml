      differences: Oracle limite les sets à une commande ; les ensembles FLOW multi-Orders proposés sont plus larges.
      flow_position: Grouping matérialiserait l’ensemble ; décisions et lancement restent distincts.
      source_title: Order Management Processes — Line Sets / Fulfillment Sets
