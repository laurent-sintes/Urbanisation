- id: TER039
  name: Notification d’événement
  short_description: Message qui informe un destinataire d’une occurrence avec les références nécessaires à sa compréhension.
  definition: Message qui informe un destinataire d’une occurrence avec les références nécessaires à sa compréhension.
  context: Notion locale en cours de consolidation ; consulter les sources et les réserves.
  notes: Définition proposée, éclairée par ELM059/ELM060 ; la notification et le fait de gestion qu’elle peut signaler sont
    distincts. Ne fixe ni protocole ni mécanisme de persistance.
  source_refs:
