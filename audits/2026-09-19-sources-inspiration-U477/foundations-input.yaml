- id: TER037
  name: Document — sens plateforme
  short_description: Représentation d’un état d’objet métier, ou objet non modifiable produit ou capté.
  definition: Représentation d’un état d’objet métier, ou objet non modifiable produit ou capté.
  context: 'Un document métier peut être conservé sous forme structurée sans fichier PDF. Exemple fictif : un document de
    réception identifié consigne le fait « 60 pièces reçues vendredi ». Le document, le fait qu’il consigne et la commande
    concernée restent des notions distinctes.'
  notes: Reformulation de U61/F162. Contenu exact des états, versions et règles de correction à préciser ; aucune équivalence
    avec tout Document SAP/TM Forum.
  source_refs:
  - U203
  - U461
  source_locator:
    path: connaissance/19-glossaire-metier.md
    anchor: ''
  review:
    state: under_review
    note: Reprise documentaire ; aucune validation supplémentaire par la migration.
