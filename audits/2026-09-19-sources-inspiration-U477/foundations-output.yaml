    product: Universal Business Language
    element_name: Despatch Advice / Receipt Advice
    concept_name: Despatch Advice / Receipt Advice
    element_type: Notion ou usage documenté
    relationship: Rapprochement de sens
    scope_summary: Documents structurés d’expédition et de réception.
    approach_summary: Communiquer un état ou un constat identifié.
    similarities: Un document n’est pas nécessairement un PDF.
    differences: UBL définit des échanges particuliers, pas tout objet documentaire.
    flow_position: FLOW précise le fait ou l’état représenté.
    source_title: Universal Business Language Version 2.4
    source_url: https://docs.oasis-open.org/ubl/UBL-2.4.html
    source_version: OASIS Standard 2.4, 2024
