  market_inspiration:
    choice: Rapprocher les capacités selon un critère métier rend la carte plus facile à lire. Regroupement de capacités désigne
      cette organisation de lecture, sans présumer une capacité parente.
    flow_scope: Ensemble de capacités réunies pour une raison explicite.
    flow_approach: Indiquer le critère commun et distinguer regroupement et décomposition.
    synthesis:
    - TOGAF distingue la classification des capacités pour lire une carte et leur décomposition pour détailler une aptitude.
      GEA-NZ recommande également de les classer afin de repérer lacunes et recouvrements. Les deux donnent un but à l’organisation
      de la carte.
    - 'FLOW conserve cette distinction : partager un thème ne signifie pas être les parties d’une même capacité. Un domaine
      peut apporter ce cadre de lecture quand ses problèmes métier sont cohérents ; le regroupement ne crée pas un niveau
      « fonction ».'
    examples:
    - title: TOGAF — catégories et décomposition
      situation: Le guide présente des catégories Strategic, Core et Supporting puis, séparément, la décomposition de Human
        Resource Management.
      outcome: Le premier classement facilite une lecture ; le second détaille une aptitude.
      lesson: FLOW reprend la différence entre les deux opérations, sans adopter ces catégories comme niveaux du modèle.
      source_title: Business Capabilities
      source_url: https://governance.foundation/assets/frameworks/togaf/g189%20-%20Business%20Capbility.pdf
      source_refs:
      - U477
- id: TER030
  market_comparisons:
  - vendor: Eric Evans
    product: Domain-Driven Design Reference
    element_name: Domain
    concept_name: Domain
    element_type: Notion ou usage documenté
    relationship: Rapprochement de sens
    scope_summary: Champ de connaissance ou d’activité.
    approach_summary: Construire un modèle utile à ses problèmes.
    similarities: Le périmètre part d’un sens métier cohérent.
    differences: Evans l’aborde dans la conception de logiciel.
    flow_position: FLOW emploie cette cohérence pour sa carte métier.
    source_title: 'Domain-Driven Design Reference: Definitions and Pattern Summaries'
    source_url: https://www.domainlanguage.com/wp-content/uploads/2016/05/DDD_Reference_2015-03.pdf
    source_version: Mars 2015
    source_locator: Definitions ; Entities p.11 ; Value Objects p.12 ; Domain Events p.13 ; Services p.14
    consulted_on: '2026-09-19'
    evidence_limits: Résumé de patrons par leur auteur, orienté conception logicielle. Les concepts éclairent le sens métier
      sans imposer objets de code, services ni bounded contexts au modèle FLOW.
    status: proposed
    source_refs:
    - U477
  - vendor: Martin Fowler
    product: Domain-Driven Design
    element_name: Bounded Context
    concept_name: Bounded Context
    element_type: Notion ou usage documenté
    relationship: Rapprochement de sens
    scope_summary: Périmètre où un modèle et son langage restent cohérents.
    approach_summary: Expliciter les différences de sens et leurs relations.
    similarities: La cohérence du vocabulaire aide à comprendre les frontières.
    differences: Un contexte DDD n’est pas un domaine FLOW par équivalence.
    flow_position: Aucune architecture applicative n’est déduite du regroupement.
    source_title: Bounded Context
    source_url: https://martinfowler.com/bliki/BoundedContext.html
    source_version: 15 janvier 2014
    source_locator: Paragraphes sur le vocabulaire et l’exemple meter
    consulted_on: '2026-09-19'
    evidence_limits: Retour d’auteur sur les modèles logiciels dans l’approche DDD ; document distinct d’Evans mais même école
      de pensée, pas preuve de consensus entre cadres.
    status: proposed
    source_refs:
    - U477
  market_inspiration:
    choice: Traiter ensemble des problèmes métier liés permet d’en comprendre la logique commune. Domaine désigne cet espace
      cohérent, sans imposer une organisation ni une frontière logicielle.
    flow_scope: Problèmes, notions et responsabilités qui gagnent à être compris ensemble.
    flow_approach: Justifier le regroupement par le métier et préciser ses relations avec les autres domaines.
    synthesis:
    - Evans emploie domain pour le champ de connaissance ou d’activité auquel s’applique le modèle. Fowler explique ensuite
      pourquoi un même vocabulaire peut prendre des sens différents dans plusieurs contextes. Les deux invitent à regarder
      le sens des problèmes avant leur représentation.
    - FLOW retient le domaine comme périmètre de cohérence métier. Il ne le confond pas avec le bounded context de DDD, qui
      délimite un modèle utilisé pour concevoir du logiciel ; les frontières applicatives ne sont pas arrêtées par ce terme.
    examples:
    - title: Fowler — les différents sens du compteur
      situation: Dans son exemple d’un fournisseur d’électricité, « compteur » peut désigner l’équipement ou une relation
        du réseau avec un lieu ou un client.
      outcome: Le vocabulaire doit être précisé pour éviter des modèles contradictoires.
      lesson: L’illustration aide FLOW à expliciter les problèmes et notions de chaque domaine ; elle ne prescrit pas ses
        frontières.
      source_title: Bounded Context
      source_url: https://martinfowler.com/bliki/BoundedContext.html
      source_refs:
      - U477
  editorial_notes: TER030 garde sa définition métier courante. Les repères historiques MKT017 / ELM041 / CMP027 sont conservés
    dans l’entrée et la capture ; les deux documents sont des appuis nouveaux U477, pas une adoption des bounded contexts.
