  - vendor: OASIS
    product: Universal Business Language
    element_name: Receipt Advice
    concept_name: Receipt Advice
    element_type: Notion ou usage documenté
    relationship: Rapprochement de sens
    scope_summary: Compte rendu de réception entre partenaires.
    approach_summary: Rapporter quantités reçues et écarts.
    similarities: Le document donne une représentation du fait de réception.
    differences: UBL porte l’échange documentaire, pas le sens plateforme complet.
    flow_position: FLOW distingue le fait, sa trace et sa notification.
    source_title: Universal Business Language Version 2.4
    source_url: https://docs.oasis-open.org/ubl/UBL-2.4.html
    source_version: OASIS Standard 2.4, 2024
    source_locator: §2.3.5.1.1–2.3.5.1.4 Fulfilment ; surtout Receipt Advice Business Rules
    consulted_on: '2026-09-19'
    evidence_limits: Standard de documents d’échange ; les exemples ne définissent ni tous les documents ni la convention
      obligatoire fait-document de FLOW.
    status: proposed
    source_refs:
    - U470
    - U471
    - ELM311
    - CMP186
    - U477
  market_inspiration:
    choice: Savoir ce qui s’est produit et sur quelle trace s’appuyer rend le suivi métier explicable. Dans le sens plateforme
      retenu par FLOW, un fait de gestion est toujours associé à un document identifié.
    flow_scope: Événement métier et document qui en porte la trace.
    flow_approach: Conserver le lien entre occurrence et représentation, même sans document PDF.
    synthesis:
    - Microsoft illustre le couple réception enregistrée et journal de réception. UBL décrit un Receipt Advice qui rapporte
      au partenaire ce qui a été reçu et les écarts éventuels. Le premier montre une trace dans un produit ; le second un
      document d’échange.
    - Ils appuient concrètement le lien entre un événement et un document, sans établir que tout événement du marché suit
      cette règle. Son caractère obligatoire est le choix FLOW pour le sens plateforme du terme ; notification et fait restent
      distincts.
    examples:
    - title: Microsoft — quatre pièces reçues sur cinq
      situation: Le scénario Microsoft enregistre quatre pièces reçues sur une commande de cinq.
      outcome: Le journal de réception matérialise les quantités enregistrées avec une référence documentaire.
      lesson: FLOW reconnaît le fait « quatre pièces reçues » et le document qui le porte ; leur rôle n’est pas celui du message
        qui avertit un tiers.
      source_title: Record the receipt of goods on the purchase order
      source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/procurement/tasks/record-receipt-goods-purchase-order
      source_refs:
      - U477
