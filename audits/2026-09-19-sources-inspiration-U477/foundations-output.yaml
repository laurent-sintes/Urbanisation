    status: proposed
    source_refs:
    - U477
  - vendor: Microsoft
    product: Dynamics 365 Supply Chain Management
    element_name: Product receipt journal
    concept_name: Product receipt journal
    element_type: Notion ou usage documenté
    relationship: Rapprochement de sens
    scope_summary: Trace consultable d’une réception enregistrée.
    approach_summary: Conserver les détails et leur référence.
    similarities: L’enregistrement peut porter un document métier.
    differences: La page ne démontre pas une immutabilité générale.
    flow_position: Les règles de correction restent celles du type de document.
    source_title: Record the receipt of goods on the purchase order
    source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/procurement/tasks/record-receipt-goods-purchase-order
    source_version: Documentation évolutive, mise à jour du 1er juillet 2026
    source_locator: Record receipt of goods, étapes 4–7 ; Review the product receipt journal
    consulted_on: '2026-09-19'
    evidence_limits: Exemple de réception de biens ; aucune universalité fait-document, immutabilité ou règle de correction
      n’en est déduite.
    status: proposed
    source_refs:
    - U477
  market_inspiration:
    choice: Conserver une représentation compréhensible d’un état ou d’un fait permet de s’y référer. Document, au sens plateforme,
      peut être un enregistrement structuré ; il ne suppose pas un fichier à lire ou à imprimer.
    flow_scope: Représentation d’état ou objet non modifiable produit ou capté, selon le cas défini.
    flow_approach: Identifier ce que le document représente et le distinguer de l’occurrence métier.
    synthesis:
    - UBL donne des documents d’échange différents pour l’expédition et la réception. Microsoft produit un journal lors de
      l’enregistrement des marchandises reçues. UBL insiste sur ce qui est communiqué au partenaire ; Microsoft sur la trace
      tenue dans le produit.
    - FLOW retient cette possibilité d’un document structuré, tout en gardant sa définition propre. Ces exemples ne suffisent
      pas à décider des règles de version, de correction ou d’immutabilité de tous les documents FLOW.
    examples:
    - title: UBL — distinguer expédié et reçu
      situation: UBL sépare Despatch Advice, émis pour l’expédition, et Receipt Advice, émis à la réception.
      outcome: Le réceptionnaire peut signaler des manquants, des dommages ou des refus.
      lesson: Les documents représentent des faits différents ; recevoir un avis d’expédition ne prouve pas que les biens
        ont été reçus.
      source_title: Universal Business Language Version 2.4
      source_url: https://docs.oasis-open.org/ubl/UBL-2.4.html
      source_refs:
      - U477
  editorial_notes: Les règles de correction/version restent à préciser selon l’historique courant ; cette rubrique n’en crée
    aucune et n’étend pas le catalogue Informations métier.
- id: TER039
  market_comparisons:
