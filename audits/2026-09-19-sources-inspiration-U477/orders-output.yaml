    flow_approach: Distinguer commande, accord de référence et simple apport consigné sans achat.
    synthesis:
    - Microsoft explicite ce qu’une commande peut acheter ; Oracle la distingue des accords préalables. Le recouvrement porte
      sur un attendu fournisseur suffisamment précisé.
    - FLOW conserve Purchase Order pour cet achat, distinct de la capacité qui le gère et du bon de commande qui en représente
      une version. La consignation sans engagement d’achat garde une autre qualification.
    examples:
    - title: Illustration FLOW — Un accord puis une commande
      situation: Un accord prévoit des conditions pour la saison ; une commande demande ensuite 50 pièces pour une date précise.
      outcome: Les deux restent liés mais n’expriment pas le même attendu.
      lesson: Le volume commandé ne se déduit pas de la seule existence de l’accord.
      source_title: What’s the difference between a purchase order, a purchase agreement, and a contract agreement?
      source_url: https://docs.oracle.com/en/cloud/saas/procurement/26a/oaprc/Chunk145966296.html
      source_refs:
