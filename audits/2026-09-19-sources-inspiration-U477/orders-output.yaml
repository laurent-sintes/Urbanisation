  market_inspiration:
    choice: 'Savoir ce qui est attendu après un renvoi au fournisseur : argent, remplacement ou retour du bien réparé. Supplier
      Return garde ces trois résultats distincts.'
    flow_scope: Marchandises renvoyées et contrepartie ou restitution attendue.
    flow_approach: Relier le renvoi à son résultat sans réouvrir implicitement un achat de remplacement.
    synthesis:
    - Business Central organise les documents du renvoi ; Oracle isole explicitement le crédit sans remplacement ; Dynamics
      GP distingue la réparation avec restitution.
    - FLOW classe les variantes par le résultat attendu du fournisseur. Cette lecture évite de considérer tout départ de stock
      comme une simple correction d’achat.
    examples:
    - title: Illustration FLOW — Attendre le bon résultat
      situation: 'Deux appareils partent au fournisseur : l’un doit être remplacé, l’autre réparé puis restitué.'
      outcome: Les attentes ne sont pas soldées par le seul départ.
      lesson: L’identité compte pour la réparation ; le lien au renvoi compte aussi pour le remplacement.
      source_title: Returns Management
      source_url: https://learn.microsoft.com/en-us/dynamics-gp/distribution/returnsmanagement
      source_refs:
      - U477
  editorial_notes: Ancienne page SAP Business ByDesign inaccessible en texte ; remplacée par Dynamics GP pour les résultats
    du renvoi. Oracle Service Parts Planning est conservé au niveau BHV057, où sa limite de planification est explicite.
