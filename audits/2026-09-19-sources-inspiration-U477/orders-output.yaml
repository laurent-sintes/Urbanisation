    approach_summary: Suivre départs, réceptions et liens avec les ventes.
  market_inspiration:
    choice: 'Formaliser une instruction et ses conditions pour pouvoir la suivre. Commande doit être qualifiée par son contexte
      : client, achat ou ordre de déplacement, par exemple.'
    flow_scope: Acte ou document exprimant une instruction commerciale ou opérationnelle.
    flow_approach: Préciser la famille et ses effets, sans supposer confirmation ni exécution à l’enregistrement.
    synthesis:
    - OASIS donne à Order un sens commercial d’échange ; Microsoft emploie Transfer Order pour un déplacement entre dépôts.
      Le mot Order ne suffit donc pas à déterminer la relation métier.
    - FLOW conserve Commande comme terme à qualifier. Aucun schéma universel de commande ni effet d’engagement automatique
      n’est déduit de ce rapprochement.
    examples:
