    flow_approach: Conserver le motif de consolidation et suivre les quantités effectivement regroupées.
    synthesis:
    - Nextail décrit chez Merkal une consolidation liée aux tailles ; Oracle présente le rééquilibrage excédent/manque. Le
      mouvement peut se ressembler, mais son bénéfice attendu diffère.
    - FLOW garde Stock Consolidation pour rendre visible le regroupement de fragments utiles ensemble. Le motif ne se réduit
      pas à remplir un site déficitaire.
    examples:
    - title: Regrouper les tailles chez Merkal
      situation: Le cas publié par Nextail évoque les transferts de fin de saison et une meilleure consolidation des tailles.
      outcome: Le regroupement vise une offre de tailles plus utilisable.
      lesson: FLOW retient ce bénéfice de regroupement, sans reprendre de gain chiffré ni en déduire une installation locale.
      source_title: Merkal footwear inventory planning
      source_url: https://nextail.co/customer/merkal-footwear-inventory-planning/
      source_refs:
      - U400
      - U401
      - ELM240
      - CMP151
      - U477
