  market_inspiration:
    choice: Conserver le nom rapporté pour le document émis par MAP dans le cas U48. Planned Purchase Order ne dit pas encore,
      dans ce contexte local, si la commande est ferme.
    flow_scope: Nom historique d’un document local, après planification en volumes et délais.
    flow_approach: Qualifier son engagement et son cycle avant toute équivalence avec un objet éditeur.
    synthesis:
    - 'Microsoft et Oracle emploient des noms très proches pour des engagements différents : proposition à affermir chez Microsoft,
      accord engageant un achat à long terme puis décliné en commandes chez Oracle.'
    - FLOW conserve donc la réserve du terme MAP. Le nom ne permet pas de choisir entre Planned Order, Purchase Requisition
      et Purchase Order ni de fermer la question locale.
    examples:
    - title: Illustration FLOW — Le nom du fichier ne suffit pas
      situation: Un document MAP porte « Planned Purchase Order » après planification.
      outcome: Avant rapprochement, il faut établir ce qu’il engage envers le fournisseur.
      lesson: Le passage Microsoft à l’ordre ferme fournit une question de comparaison, pas une réponse sur MAP.
