    element_name: Return disposition
    element_type: Concept et usage documentés
    relationship: Recouvrement partiel
    similarities: Le sort du produit est différent du motif de retour.
    differences: Un code de disposition n’est pas la preuve de l’exécution complète de la suite.
    flow_position: Conserver le retour, la décision et la suite attendue ; rapprocher les réalisations sans effacer la vente.
    status: proposed
    source_refs:
    - U384
    - ELM232
    - CMP143
