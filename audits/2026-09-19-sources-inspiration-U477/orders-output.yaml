      situation: Un article retourné est réparé ; le contrôle final décrit son état avant la décision de restitution au client.
      outcome: Le résultat de l’intervention est lié au retour.
      lesson: La réalisation et son contrôle fournissent les faits ; Return Disposition Decision conserve le choix du devenir.
      source_title: Manage Repair Orders from the Depot Repair Page
      source_url: https://docs.oracle.com/en/cloud/saas/service-logistics/26b/fasul/manage-repair-orders-from-the-depot-repair-page.html
      source_refs:
      - U477
