  market_inspiration:
    choice: Adapter la forme des commandes pour les traiter sans perdre leur origine. Order Structuring distingue scinder,
      traiter ensemble et remplacer plusieurs commandes par une seule.
    flow_scope: Composition des commandes et liens entre éléments d’origine et résultants.
    flow_approach: Préserver quantités, filiation et engagements à chaque changement de structure.
    synthesis:
    - Microsoft illustre le fractionnement, Oracle le traitement collectif et Infor la fusion. Ces trois mécanismes répondent
      à des besoins différents, même s’ils changent tous la forme du travail à traiter.
    - FLOW les réunit dans Order Structuring pour rendre les transformations explicables. La quantité d’origine et les engagements
      ne disparaissent pas avec une nouvelle présentation.
    examples:
    - title: 600 chaises échelonnées
      situation: Microsoft prend une vente de 600 chaises à livrer par lots de 100 pendant six mois.
      outcome: L’échéancier détaille les six livraisons sous le total commercial.
      lesson: Scinder les échéances ne crée pas six demandes indépendantes sans origine.
      source_title: Delivery schedules
      source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/sales-marketing/delivery-schedules
