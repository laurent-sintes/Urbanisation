    - U477
    concept_name: Return disposition
    scope_summary: Sort du produit retourné et compensation.
    approach_summary: Associer un résultat de traitement au retour.
  market_inspiration:
    choice: 'Prendre en charge ce que devient un produit retourné par un client. Customer Return relie le retour aux suites
      retenues : stock, remise en état, fournisseur, restitution ou rebut.'
    flow_scope: Retour client et résultat logistique attendu après examen.
    flow_approach: Conserver le retour, la décision et la suite attendue ; rapprocher les réalisations sans effacer la vente.
    synthesis:
    - SAP présente un parcours lié de retour et de suivi ; Microsoft détaille les choix de disposition et leurs effets. Tous
      deux évitent de réduire le retour à une simple quantité négative.
    - FLOW retient une demande de retour distincte de la vente et explicite le résultat attendu pour chaque quantité. Un remboursement
      et une remise en stock ne désignent pas le même résultat.
    examples:
    - title: Illustration FLOW — Deux états dans un même retour
      situation: Sur deux articles rendus, l’un est revendable et l’autre doit être expertisé.
      outcome: Les deux quantités suivent des suites différentes.
      lesson: Le retour reste traçable même si son traitement est réparti.
      source_title: Specify how to dispose of returned items
      source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/sales-marketing/specify-how-to-dispose-of-returned-items
      source_refs:
      - U384
      - ELM232
      - CMP143
      - U385
      - U477
  editorial_notes: La page SAP Help historique renvoie un texte vide lors de la consultation ; remplacement par le cours primaire
    SAP Managing Customer Returns, lisible et pertinent.
