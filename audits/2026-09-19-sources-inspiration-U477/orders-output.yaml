    element_name: Vendor purchase order response
    element_type: Concept et usage documentés
    relationship: Recouvrement partiel
    similarities: La réponse fournisseur peut accepter, refuser ou proposer un écart.
    differences: Une réponse reçue n’établit pas automatiquement le contenu applicable.
    flow_position: Rapprocher la commande, les réponses acceptées et les réalisations ; garder l’accord de référence distinct.
    status: proposed
    source_refs:
    - U403
    - ELM242
    - CMP153
    - U477
    concept_name: Vendor purchase order response
    scope_summary: Acceptation, refus ou contre-proposition fournisseur.
    approach_summary: Enregistrer la réponse puis confirmer selon les règles.
  market_inspiration:
    choice: Savoir ce qu’un fournisseur doit encore apporter, en biens ou en prestations. Purchase Order couvre la commande
      d’achat et ses changements, avec un résultat attendu explicite.
    flow_scope: Attentes fournisseur, conditions applicables, réponses et reste à recevoir.
    flow_approach: Rapprocher la commande, les réponses acceptées et les réalisations ; garder l’accord de référence distinct.
    synthesis:
    - Microsoft explique comment exprimer l’achat et recueillir la réponse du fournisseur ; Oracle sépare la commande détaillée
      des accords qui encadrent des achats futurs.
    - FLOW reprend cette séparation pour conserver un attendu lisible. Le choix d’acheter, la négociation de l’accord et la
      réalisation physique ne se déduisent pas de la seule présence de la commande.
    examples:
    - title: Illustration FLOW — Une date fournisseur à examiner
      situation: Un achat attend 80 pièces vendredi ; le fournisseur propose lundi.
      outcome: La date proposée est visible avant son acceptation.
      lesson: Le besoin, la réponse et l’engagement retenu restent distinguables.
      source_title: Vendor collaboration with external vendors
      source_url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/procurement/vendor-collaboration-work-external-vendors
      source_refs:
      - U403
      - ELM242
      - CMP153
      - U477
  editorial_notes: Recentrage sur commande et réponse fournisseur. Les détails Direct delivery et Service Entry Sheet restent
    documentés dans BHV059/BHV060 ; ancienne page SAP de confirmation non nécessaire à cette synthèse.
