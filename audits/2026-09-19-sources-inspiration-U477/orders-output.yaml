    evidence_limits: Documentation primaire consultée ; périmètre du produit, sans preuve de déploiement Beaumanoir.
    element_name: Planned transfer order
    element_type: Concept et usage documentés
    relationship: Recouvrement partiel
    similarities: Le réassort peut produire un ordre entre dépôts.
    differences: FLOW ne limite pas les transferts aux besoins calculés par la planification.
    flow_position: Maintenir l’ordre et rapprocher départ et arrivée sans confondre transfert demandé et stock déjà reçu.
    status: proposed
    source_refs:
    - U400
    - U401
    - ELM240
    - CMP151
    - U477
    concept_name: Planned transfer order
    scope_summary: Réapprovisionnement d’un dépôt par un autre.
    approach_summary: Déduire les transferts des besoins et des délais.
  market_inspiration:
    choice: Suivre ce qui doit quitter un site et arriver dans un autre. Transfer Order garde le nom du marché pour l’ordre
      de déplacement, quel que soit le motif de l’apport.
    flow_scope: Origine, destination, quantités, dates et restant à déplacer.
    flow_approach: Maintenir l’ordre et rapprocher départ et arrivée sans confondre transfert demandé et stock déjà reçu.
    synthesis:
    - Microsoft IOM expose le transfert à suivre ; la documentation SCM montre comment un besoin de réapprovisionnement peut
      le faire naître. Les deux traitent le même déplacement depuis des points de vue différents.
    - FLOW conserve la commande comme responsabilité propre. Implantation, réassort, rééquilibrage et satisfaction d’une vente
      expliquent son intention sans changer la distinction départ/arrivée.
    examples:
    - title: Illustration FLOW — Expédié ne signifie pas reçu
      situation: Un transfert prévoit 40 pièces de l’entrepôt au magasin ; 40 partent, 38 arrivent.
      outcome: Le suivi montre deux pièces à expliquer.
      lesson: Le reste et l’écart ne se calculent pas à partir d’un unique statut « terminé ».
      source_title: Integrate transfer orders
      source_url: https://learn.microsoft.com/en-us/dynamics365/intelligent-order-management/integrate-transfer-orders
      source_refs:
      - U400
      - U401
      - ELM240
      - CMP151
      - U477
  editorial_notes: Sources détaillant rééquilibrage et consolidation recentrées sur BHV072/BHV073. L’ancien STO SAP est remplacé
    ici par deux pages Microsoft directement lisibles sur le suivi et l’origine des transferts.
