id: NONPURCHASE-SUPPLY-ORDER-U392
status: proposed
source_refs:
- U392
- U391
- ELM237
- CMP148
problem: Représenter une demande fournisseur d’apport de stock sans la confondre avec l’acquisition, l’exécution logistique
  ou la gestion durable du stock consigné.
existing_coverage: Transfer Order couvre déjà les transferts ; Supplier Return et les retours peuvent également conduire à
  des apports. Ne pas inventer un manque pour tous les flux sans achat.
recommendation:
  name: Consignment Replenishment Order
  parent_id: D04
  kind: capability
  definition: 'Demander et suivre un apport de stock fournisseur sous consignation : produits, quantités, lieux, dates et
    reste à recevoir, sans confondre cette demande avec un achat.'
  status: proposed_not_created
  rationale: Nommage natif Microsoft correspondant au besoin précis démontré ; ordre d’apport distinct de la gestion du régime
    de stock.
  benefit: Suivre une livraison attendue sans créer un achat fictif ni rendre disponible un stock non reçu.
  boundary: D01 gère l’état et le régime du stock ; D04 suit la demande d’apport ; D06 orchestre les prestations ; D03/D05
    décident du besoin ou de la réponse selon leur finalité. Lifecycle, Structuring et Archiving restent transverses.
  naming_limit: Replenishment dans cet intitulé éditeur couvre la demande d’alimentation du stock consigné, y compris son
    premier apport ; ne fusionne pas Initial Stocking et Replenishment Decision de FLOW.
alternatives:
- name: Procurement Order
  assessment: Pas de convention générique indépendante de Purchase Order établie par les sources consultées. Risque de chevauchement
    achat/apport/prestation ; nom non adopté.
- name: Purchase Order avec variante de consignation
  assessment: Approche documentaire SAP compatible avec plusieurs régimes, mais contredirait notre séparation métier U391
    si la distinction achat/apport disparaît. Aucun rejet technique de SAP.
- name: Supply Order
  assessment: Oracle documente un objet d’orchestration plus large couvrant achat/fabrication/transfert ; pas un simple synonyme
    du manque identifié.
market_comparisons:
- comparison_ref: CMP148
  status: proposed
  similarities: Demande fournisseur et suivi des quantités/dates peuvent précéder toute acquisition ; mécanisme explicite
    chez Microsoft et Oracle, catégorie de ligne chez SAP.
  differences: Les éditeurs ne retiennent pas un nom et une structure uniques. Document, catégorie de ligne, capacité et objet
    d’orchestration ne sont pas équivalents.
  flow_position: Proposer un type d’Order ciblé dans D04 ; conserver séparément la gestion du régime de stock proposée U391.
    Aucun nouveau nœud ni comportement créé.
  source_ids:
  - NP-S1
  - NP-S2
  - NP-S3
  - NP-S4
sources:
- id: NP-S1
  vendor: Microsoft
  product: Dynamics 365 SCM
  title: Set up consignment
  url: https://learn.microsoft.com/en-us/dynamics365/supply-chain/inventory/consignment
  edition: Documentation évolutive
  locator: Consignment replenishment orders ; Overview of the consignment process
  access: Page primaire ouverte
  finding: Consignment replenishment order demande et suit les quantités à livrer dans un intervalle de dates ; le fournisseur
    conserve la propriété à réception. Le traitement de changement de propriété génère ensuite un Purchase Order.
  limit: Document produit illustré en production ; ne justifie pas une capacité Procurement Order générique couvrant tous
    les apports.
  consulted_on: '2026-09-18'
- id: NP-S2
  vendor: SAP
  product: S/4HANA on-premise
  title: Item Category
  url: https://help.sap.com/docs/SAP_S4HANA_ON-PREMISE/af9ef57f504840d2b81be8667206d485/a37eb65334e6b54ce10000000a174cb4.html
  edition: Documentation évolutive, édition non confirmée dans le passage lu
  locator: 'Table des catégories : Consignment'
  access: Passage primaire indexé consulté ; ouverture directe sans texte exploitable
  finding: Une ligne de Purchase Order de catégorie Consignment exige une réception de marchandises mais pas une réception
    de facture sur cette ligne.
  limit: Le nom de l’objet ERP ne prouve pas un achat/transfert de propriété à sa création ; catégorie de ligne, pas nouvelle
    capacité. Aucun comportement légal universel déduit.
  consulted_on: '2026-09-18'
- id: NP-S3
  vendor: Oracle
  product: Fusion Cloud SCM
  title: Consigned Inventory
  url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/25d/faims/consigned-inventory.html
  edition: 25D
  locator: Consignment Order ; Ship and Receive Items
  access: Page primaire ouverte
  finding: Consignment Order demande les expéditions avec quantités, lieux et dates selon l’accord ; les biens reçus restent
    propriété fournisseur.
  limit: Intitulé fonctionnel du parcours ; ne démontre pas un nouvel objet technique indépendant du Purchase Order.
  consulted_on: '2026-09-18'
- id: NP-S4
  vendor: Oracle
  product: Fusion Cloud SCM
  title: How Supply Chain Orchestration Works
  url: https://docs.oracle.com/en/cloud/saas/supply-chain-and-manufacturing/26a/fauco/how-supply-orchestration-works.html
  edition: 26A
  locator: Transform and assign request ; Orchestrate supply order ; Fulfill
  access: Page primaire ouverte
  finding: Un Supply Order orchestre plusieurs modes, notamment achat, fabrication et transfert, avec leurs documents d’exécution.
  limit: Plus large que l’apport consigné ; empièterait sur les responsabilités d’orchestration si recopié comme simple type
    d’Order FLOW.
  consulted_on: '2026-09-18'
catalog_changed: false
