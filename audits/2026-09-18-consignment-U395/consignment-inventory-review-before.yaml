id: CONSIGNED-INVENTORY-REVIEW-U391
as_of: '2026-09-18'
status: proposed_after_user_reframing
source_refs:
- U391
- C102
- ELM236
- CMP147
- U393
- CMP149
- U394
- C103
user_scope:
- Détention du stock et régime de propriété.
- Impacts valorisation comptable et facturation.
- Responsabilités assurantielles.
- 'Conditions et devenir après saison : soldeur, seconde main, renvoi fournisseur, destruction.'
- Offre de gestion proposée au fournisseur.
candidate:
  name: Consigned Inventory Management
  parent_id: D01
  status: proposed
  nature: management
  definition: 'Gérer le stock détenu sous accord de consignation avec un fournisseur : appliquer les droits, obligations et
    échéances utiles, suivre les changements de propriété et déclencher les suites autorisées en coordination avec les capacités
    responsables.'
  rationale: Responsabilité durable de gestion d’un régime de stock et de ses engagements, distincte du suivi des quantités
    et des seuls mouvements. Le lien avec les achats est un effet possible, pas son périmètre directeur.
  naming: Libellé exact documenté dans Oracle NetSuite ; proposition FLOW, pas intitulé universel des cartographies.
  benefit: Distinguer présence physique, propriété, droit d’usage et suites contractuelles ; ne pas perdre les obligations
    lors d’une vente, d’un incident ou d’une fin de saison.
  scope_limit: 'Cible initiale fournisseur propriétaire / FLOW détenteur. Le besoin de Laurent peut déborder la consignation
    : un droit de reprise sur stock déjà acheté n’est pas assimilé à ce régime. Ne pas généraliser sans arbitrage.'
  offer: L’offre proposée au fournisseur assemble un service de gestion de stock, ses conditions et ses suites ; l’offre n’est
    pas à elle seule une capacité. Les projections Catalog/Agreement/Party peuvent fournir les références utiles sans administration
    des maîtres ni négociation ajoutée.
  decomposition_status: Aucun comportement créé. Les axes ci-dessous précisent le périmètre et ne sont pas une liste d’opérations
    à transformer automatiquement en comportements.
distinctions:
- Détenteur physique, propriétaire, droits d’usage et responsabilités sont des dimensions distinctes.
- Pas de responsabilité assurantielle ou droit de destruction déduit automatiquement de la propriété ; conditions et autorisations
  à référencer.
- Consignation et pilotage du réassort par le fournisseur (VMI) sont distincts ; ne pas inférer ce dernier.
- Les issues de fin de saison sont un besoin FLOW exprimé par Laurent ; couverture complète de ce besoin non établie par les
  sources consultées.
responsibility_boundaries:
- responsibility: États et mouvements
  position: D01.f Inventory Tracking et D01.g Record Inventory Movements conservent quantités, détenteur/propriétaire, mouvements
    et changements de propriété ; ne pas les recopier dans la capacité candidate.
- responsibility: Accords et droits
  position: La capacité consomme les conditions référencées d’Agreement et les applique au stock ; maîtres et négociation
    restent ailleurs.
- responsibility: Comptabilité, facturation, assurance
  position: Fournir faits, références et responsabilités applicables aux fonctions compétentes ; ne pas absorber la valorisation
    comptable, émission de facture, souscription ou gestion des sinistres.
- responsibility: Choix du devenir après saison
  position: Distinguer issues autorisées par l’accord, décision du devenir et exécution. Articulation avec D05 à instruire
    ; Return Disposition Decision ne couvre pas automatiquement tous les excédents.
- responsibility: Mise en action
  position: Mobiliser D04 pour les commandes applicables (vente, retour fournisseur, transfert, achat éventuel), D06 pour
    les prestations et D01 pour le stock. Un renvoi de stock non acquis ne crée pas automatiquement un avoir.
- responsibility: Offre fournisseur
  position: Assemblage commercial de services et conditions ; ne pas imposer l’offre dans D14, dont le rôle courant est l’offre
    de services exécutants consommés par FLOW.
market_comparisons:
- comparison_ref: CMP147
  status: proposed
  similarities: Gestion de stock tiers, propriété distincte de la détention, accords et liens avec l’achat et le règlement
    attestés ; nom Consigned Inventory Management attesté chez NetSuite.
  differences: Microsoft montre un sous-processus, SAP des stocks spéciaux et une variante de Procure to Receipt, Oracle un
    cycle/fonctionnalité. Aucune capacité standard unique couvrant aussi assurance et devenirs de fin de saison n’a été établie.
  flow_position: Retrait du candidat achat acquis U391 ; proposer une capacité de gestion du stock dans D01 et relier les
    autres responsabilités. Nom, définition et découpage nouveaux restent à valider.
  source_ids:
  - CI-S1
  - CI-S2
  - CI-S3
  - CI-S4
  - CI-S5
  - CI-S6
  - CI-S7
- comparison_ref: CMP149
  status: editorial_comparison
  common: Microsoft distingue explicitement les intentions d’apport et d’acquisition. SAP conserve des effets métier distincts
    dans une structure documentaire commune et peut générer des apports selon les besoins.
  difference: 'U394 précise le critère : les intentions apport/acquisition sont plus directement identifiables dans les objets
    Microsoft du cas étudié ; SAP les distingue au sein d’un document commun. La comparaison porte sur la lisibilité métier,
    indépendamment de la couverture fonctionnelle.'
  flow_position: 'Priorité à la visibilité du métier dans le design FLOW : intentions, parties, engagements, progression et
    résultats explicites. Préférence locale Microsoft argumentée ; causalité historique non démontrée.'
  source_ids:
  - OI-S1
  - OI-S2
  - OI-S3
