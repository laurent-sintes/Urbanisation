market_label_note: Microsoft emploie Spot cycle counting ; Spot Counting est une forme courte proposée pour le contrôle ponctuel.
  Periodic Physical Inventory reprend la notion SAP, bornée au périmètre choisi dans FLOW.
boundaries:
- Les trois politiques peuvent se combiner ; elles ne sont pas une séquence ni une partition stricte des options éditeur.
- Une règle de seuil peut déclencher un cycle count ; ne pas prétendre que tout contrôle par seuil est un spot count.
- Un échec de picking est un exemple FLOW de signal, pas un déclencheur natif documenté par ces pages.
- Les exécutants réalisent les constats physiques. La politique de fiabilisation, la demande de vérification et le traitement
  des écarts doivent être distingués des choix de réalisation logicielle.
- Record Inventory Movements trace les ajustements justifiés ; Inventory Tracking actualise l’état ; Inventory Visibility
  restitue la connaissance. Un doute ne devient pas automatiquement une correction.
- Aucune capacité comptable, obligation annuelle, blocage automatique ou modalité RFID/mobile imposé.
open_question: Stocktaking doit-il porter dans le modèle la politique et les demandes de vérification, en complément du rapprochement
  et des corrections justifiées déjà décrits ?
candidate_mapping:
  P08: À réexaminer sous Cycle Counting ; une campagne complète mérite un mécanisme distinct.
  P09: À réexaminer sous contrôle ponctuel ; seuil et anomalie ne sont pas synonymes.
  other_market_procedures: Continuous Inventory et Inventory Sampling identifiés chez SAP ; ne pas les créer sans bénéfice
    et besoin FLOW établis.
