- path: modeles/backlog/model.yaml/nodes/17/fields/scope
  owner_id: D04
  name: Order Management
  category: current_business_text
  count: 1
  text: 'Quatre capacités : Order Type, Order Lifecycle Management, Order Structuring et Order Archiving. Les cinq variantes
    vente, achat, transfert, retour client et retour fournisseur sont des comportements d’Order Type. Les mécanismes Lifecycle
    sont communs sans imposer un cycle identique. Structuring porte la composition persistante ; Archiving conserve la trace
    historique. Split transforme les commandes ; Spread répartit des ressources entre commandes et relève des décisions et
    de Supply Assignment.'
