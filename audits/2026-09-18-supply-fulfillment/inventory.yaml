- path: modeles/backlog/model.yaml/nodes/8/fields/scope
  owner_id: D02.b
  name: Supply Protection
  category: current_business_text
  count: 1
  text: |-
    Quatre mécanismes combinables : préserver l’accès des groupes, plafonner leur consommation, définir le rôle d’un stock tampon et réguler le réassort. Les décisions spécialisées D05 déterminent les valeurs ; Supply Protection en gouverne la validité et les applique transactionnellement ; les consommateurs respectent les règles actives.

    Les opérations de création d’enveloppes, réallocation entre groupes, libération des droits inutilisés, imputation ou correction de consommation et consultation des quantités allouées, consommées et restantes restent des fonctions utiles. Les règles ont une validité, une portée et des conditions de dérogation. Leur application transactionnelle est possible à l’unité, par groupe ou en masse, via écran, batch, flux ou streaming ; ces modalités ne créent pas de comportement supplémentaire.

    Exemple fictif : protéger 200 pièces pour le web face à d’autres demandes, plafonner la consommation d’un groupe à 500, prévoir une sécurité de 40 et déclencher le réassort sous 60 vers 100. Ces paramètres ont des rôles distincts et ne s’additionnent pas automatiquement ; une même valeur peut contribuer à la sécurité et au seuil sans double décompte. Prévenir le surstock futur par les règles reste distinct de redistribuer un excès déjà présent.
- path: modeles/backlog/model.yaml/nodes/10/fields/definition
  owner_id: D03
  name: Order Promising
  category: current_business_text
  count: 1
  text: 'Chercher comment satisfaire les [Supply Orders](glossary:TER065) : établir les possibilités de couverture en ressources
    et en dates, arbitrer les solutions et établir puis maintenir les promesses. Les solutions peuvent mobiliser les ressources
    présentes ou attendues et proposer des adaptations lorsque la situation de référence ne suffit pas.'
- path: modeles/backlog/model.yaml/nodes/10/fields/scope
  owner_id: D03
  name: Order Promising
  category: current_business_text
  count: 1
  text: |-
    La satisfaction des Orders est la finalité du domaine. ATP apprécie une solution dans les ressources et engagements admissibles ; CTP peut proposer leur adaptation ; PTP compare les scénarios économiquement. Priorités, affectations et échéanciers concourent à la proposition, à la confirmation et à la révision des promesses. Cette lecture ne limite pas D03 à une commande isolée : les arbitrages peuvent porter sur plusieurs commandes et leurs engagements.

    Exemple fictif : déplacer 50 pièces pour satisfaire une commande précise. Le résultat recherché est sa satisfaction, en tenant compte des dates, protections et conséquences sur les autres engagements. [Inventory Optimization](model:D05) peut envisager un transfert semblable pour corriger la répartition du stock : la ressemblance de l’opération n’efface pas la différence de finalité.

    D01 conserve la connaissance du stock, les mouvements, protections et réservations ; D04 gère les Orders et leur progression ; D06 et les services exécutants portent prestations, engagements et faits d’exécution. Proposer un scénario CTP ne crée ni n’affermit automatiquement un Order et ne réalise pas un mouvement. Supply Assignment conserve sa définition actuelle, incluant les besoins prévisionnels : leur articulation détaillée avec les besoins de stock de D05 reste à éprouver, sans réduction implicite de cette portée.

    Promise Management regroupe proposition, confirmation et révision en trois comportements. La satisfaction recherchée maximise une valeur multidimensionnelle selon objectifs et contraintes ; PTP conserve son arbitrage économique spécialisé.
