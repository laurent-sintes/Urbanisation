- path: modeles/backlog/glossary.yaml/terms/106/market_comparisons/0/flow_position
  owner_id: TER082
  name: Spread
  category: market_reference
  count: 1
  text: Spread est une politique de répartition des ressources entre commandes. Les décisions déterminent les parts ; Supply
    Assignment applique les liens. Aucun agrégat décisionnel ou comportement automatique ajouté. U363 applique la structure
    ; les correspondances marché restent proposées.
- path: modeles/backlog/modeling-glossary.yaml/terms/5/notes/7
  owner_id: MOD006
  name: Capability Behavior
  category: context_metadata
  count: 1
  text: 'U282 précise la maille recherchée sur Supply Protection : mécanismes métier de protection, plutôt que liste des opérations
    sur Allocation. Les opérations fonctionnelles restent matière de conception produit ; elles ne constituent pas un nouveau
    niveau inférieur dans le modèle. La nouvelle décomposition cible reste à proposer.'
- path: modeles/backlog/modeling-glossary.yaml/terms/5/review/adopted_scope
  owner_id: MOD006
  name: Capability Behavior
  category: validation_or_history
  count: 1
  text: 'Comportement comme niveau complémentaire sous la capacité ; arrêt de la décomposition à ce niveau. U263 : descriptions
    factuelles sans qualification marketing. U265 : exigence de justification par une complexité ou un bénéfice ciblé. U282
    : préférence explicite pour les mécanismes métier plutôt que les opérations, illustrée par Supply Protection. U283 retient
    Mécanisme, Politique, Variante ou bénéfice comme critères différenciants de décomposition. Pour Planning, les effets sur
    les pratiques humaines et les processus distinguent les comportements des fonctions de produits. Ces critères ne constituent
    pas quatre niveaux supplémentaires. U284 confirme la direction U283 et retient Simulation & analyse en un seul comportement
    : les impacts sont intégrés à ce comportement, sans Scenario Impact Analysis autonome dans la cible.'
