  category: market_reference
  count: 1
  text: Split couvre plusieurs entrepôts, dates ou articles substituts, et peut créer plusieurs lignes et tâches de fulfillment.
- path: modeles/backlog/glossary.yaml/terms/105/market_comparisons/0/source_url
  owner_id: TER081
