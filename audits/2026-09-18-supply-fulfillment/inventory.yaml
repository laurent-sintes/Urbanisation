- path: modeles/backlog/model.yaml/principles/0/statement
  owner_id: PRINCIPLE-REFERENCE-PROJECTIONS
  name: ''
  category: context_metadata
  count: 2
  text: Les référentiels de la Supply sont des projections de sources de vérité maîtrisées par des produits tiers. Chaque
    référentiel comporte au moins une ingestion ; visibilité et recherche sont en lecture seule. L’ingestion actualise la
    projection sans transférer la maîtrise ; administration et validation métier des données maîtresses restent externes.
    Cette règle ne préjuge pas de l’autorité sur les commandes ni des états transactionnels propres à la Supply.
- path: modeles/backlog/model.yaml/principles/3/id
  owner_id: PRINCIPLE-SUPPLY-DOCUMENTS
  name: ''
  category: identifier_or_provenance
  count: 1
  text: PRINCIPLE-SUPPLY-DOCUMENTS
- path: modeles/backlog/model.yaml/principles/3/statement
  owner_id: PRINCIPLE-SUPPLY-DOCUMENTS
  name: ''
  category: context_metadata
  count: 1
  text: Supply générique orientée documents d’autorisation ; les parcours commerciaux appartiennent au modèle processus.
- path: modeles/backlog/model.yaml/principles/6/id
  owner_id: PRINCIPLE-CASE-SUPPLY-ORDERS
  name: ''
  category: identifier_or_provenance
  count: 1
  text: PRINCIPLE-CASE-SUPPLY-ORDERS
- path: modeles/backlog/model.yaml/principles/6/statement
  owner_id: PRINCIPLE-CASE-SUPPLY-ORDERS
  name: ''
  category: context_metadata
  count: 1
  text: Business Services porte le traitement des demandes et problèmes des parties prenantes ; le Case en est un dossier
    de traitement. Supply pilote ses Orders, pour toutes natures de commandes, clients et volumes. Les Service Orders portent
    les prestations confiées au contexte Services exécutant. Les modèles gardent leurs définitions propres et des contrats
    explicites, sans cardinalité ni cycle universel imposé.
- path: modeles/backlog/model.yaml/principles/8/statement
  owner_id: PRINCIPLE-EXECUTION-ORCHESTRATION
  name: ''
  category: context_metadata
  count: 1
  text: Le référentiel des services porte l’offre et les SLA configurés ; D06 décrit la capacité contextuelle et orchestre
    l’exécution, son tracking et son adaptation. D03 utilise D06 pour la promesse Supply et son réexamen ; les exécutants
    gardent leurs opérations internes. Un SLA compatible n’empêche pas un échec opérationnel. La latitude d’adaptation relève
    des règles de fonctionnement sans impact sur le catalogue des capacités.
- path: modeles/backlog/model.yaml/principles/9/statement
  owner_id: PRINCIPLE-EXECUTION-DECISION-AND-COORDINATION
  name: ''
  category: context_metadata
  count: 1
  text: La visibilité sur la capacité rend accessibles les informations communiquées par les exécutants. La décision de besoins
    détermine les prestations nécessaires ; Service Order Management tient les demandes et leur cycle. Orchestration coordonne
    les prestations et leurs dépendances ; Adaptation Decision détermine les variations du plan. D03 conserve la promesse
    Supply et les exécutants leurs opérations internes.
- path: modeles/backlog/model.yaml/principles/12/statement
  owner_id: PRINCIPLE-INVENTORY-SCENARIO-APPLICATION
  name: ''
  category: context_metadata
  count: 1
  text: Inventory Planning comporte construction de scénarios alternatifs, Simulation & Analysis et adaptation du scénario
    en cours. Comparaison, autorisation et mise en action restent des fonctions utiles. L’application mobilise Supply Protection,
    les gestions d’Orders et D06 sans absorber leurs responsabilités.
- path: modeles/backlog/model.yaml/principles/13/id
  owner_id: PRINCIPLE-SUPPLY-ASSIGNMENT-VALUE
  name: ''
  category: identifier_or_provenance
  count: 1
  text: PRINCIPLE-SUPPLY-ASSIGNMENT-VALUE
- path: modeles/backlog/model.yaml/principles/13/statement
  owner_id: PRINCIPLE-SUPPLY-ASSIGNMENT-VALUE
  name: ''
  category: context_metadata
  count: 2
  text: Supply Assignment affecte les ressources aux commandes afin de maximiser une valeur multidimensionnelle sous contraintes.
    Les critères, règles de priorité et arbitrages économiques restent explicites et mobilisent les décisions spécialisées
    ; aucune pondération universelle ni optimum garanti. Supply Assignment Plan signifie plan d’affectation, distinct des
    enveloppes de protection de groupes.
- path: modeles/backlog/glossary.yaml/terms/16/notes
  owner_id: TER017
  name: Affectation de ressource
  category: current_business_text
  count: 1
  text: |-
    La quantité affectée peut différer de la quantité demandée ou promise. Qualifier l’affectation d’une tâche, qui relève d’un autre objet. N1/N3. U289 : notion résultat associée à Supply Assignment (affectation des ressources aux commandes). Ne pas employer Allocation seul comme synonyme. Un lien peut porter sur une ressource future ; il ne prouve ni promesse confirmée ni mouvement physique. Convention : modeles/backlog/assignment-terminology.yaml.

    U290 : la finalité de l’affectation est de maximiser une valeur multidimensionnelle sous contraintes. Service, engagements, coûts et risques sont des exemples éditoriaux ; leurs poids et modes d’arbitrage ne sont pas fixés.
- path: modeles/backlog/glossary.yaml/terms/17/notes
  owner_id: TER018
  name: Allocation de groupe
  category: current_business_text
  count: 1
  text: 'Employer le qualificatif ; distinguer cette notion d’une affectation à une demande et d’un plafond de confirmation.
    N2/N3. U289 : Allocation n’est pas un synonyme de Supply Assignment. Cette entrée historique reste résoluble ; le mot
    seul est écarté des nouveaux libellés FLOW.'
